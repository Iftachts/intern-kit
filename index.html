הולית ופדגוגית שרואה בשילוב ילדים מתקשים מטרה חינוכית ראשונה במעלה, וחותרת לשילוב ככל האפשר.<\/li>\n<li>תפיסה חינוכית שרואה בהשקעה בטיפוח ילדים עם צרכים מיוחדים רווח לכל המערכת.<\/li>\n<li>אמונה ביכולתם של הילדים ורצון לקדם אותם ולעזור להם במסגרת בית הספר.<\/li>\n<li>הכרה בחשיבות העבודה האינטגרטיבית של צוות רב-מקצועי. העיקרון מתבטא גם בשילוב מלא של צוות כיתת החנ\"מ בכלל הצוות.<\/li>\n<\/ol>\n<p>ב. סביבה חינוכית הולמת ותנאים פיזיים מתאימים, עם דגש על שינוי עמדות סטיגמטיות אצל כל באי בית הספר:<\/p>\n<ul>\n<li>מקום מרכזי לכיתה (ולא כיתה צדדית) ולמחנכת הכיתה במערך השכבתי.<\/li>\n<li>התייחסות לכיתה ולמחנכת כאל אחת ממכלול הכיתות בבית הספר.<\/li>\n<li>כיתה מרווחת, עם מרחב מתאים וסידור פנימי שמאפשר עבודה דיפרנציאלית.<\/li>\n<li>עזרים וחומרי למידה שמתאימים לילדים עם צרכים מיוחדים.<\/li>\n<\/ul>\n<p><strong>ברמה האופרטיבית<\/strong><\/p>\n<ol>\n<li>בחירת צוות מורים מתאים, שהוכשר לעבוד בחינוך המיוחד בכלל ובסוג הלקות הספציפי בפרט.<\/li>\n<li>הכנת כלל הצוות, התלמידים וההורים לפתיחת הכיתה:\n        - קבלת רשימת התלמידים המשובצים מהמחלקה לחינוך מיוחד עד סוף הקיץ.\n        - רצוי שהמחנכת תיצור קשר עם התלמידים ועם הוריהם ותקבע איתם מפגש לפני תחילת השנה.\n        - רצוי שכל התלמידים יגיעו בתחילת השנה. תלמיד שמשובץ ומגיע מאוחר יותר: שיחת הכנה איתו ועם הוריו, ובמקביל הכנת הכיתה לקליטתו.<\/li>\n<li>הכשרה נוספת של המורים המקצועיים במהלך השנה, בסדנאות ובצוותי עבודה.<\/li>\n<li>תוכנית שילוב לתלמידים בכיתות הרגילות, בדרכים מגוונות:\n        - מערכת שעות קבועה לשילוב.\n        - כניסה דו-כיוונית של תלמידים מכיתה לכיתה, לפי תוכנית שהוגדרה מראש, למטרות לימודיות (כלל-שכבתיות) או חברתיות.\n        - הפעלת תוכניות עמיתים לסוגיהן, תוכניות שכבתיות ותוכניות חונכות.\n        - פעילויות חברתיות ולימודיות משותפות, כולל אירועים וטיולים של כיתת החנ\"מ עם שכבת הגיל.\n        - מעורבות הורים בפעילויות ובתוכניות השילוב.<\/li>\n<li>היערכות לעבודת צוות אינטגרטיבית. המנהל מוביל את הצוות, עוקב אחר התקדמות הכיתה ודואג ל:\n        - א. פעולת הכנה עם ועד ההורים של בית הספר.\n        - ב. בניית מעמד מומחה למחנך הכיתה, שיוכל להעשיר את חברי הצוות האחרים (השתלמויות רלוונטיות, הדרכה שוטפת).\n        - ג. עבודה משותפת קבועה של כל הגורמים שעובדים עם התלמידים לבניית התל\"א, הערכה ומעקב (שלוש פעמים בשנה), בשיתוף ההורים.\n        - ד. ישיבות של מחנכת הכיתה המיוחדת עם צוות הכיתות המשלבות: בשלב הראשון עם המחנכות, ובהמשך גם עם הצוות המקצועי המשלב.<\/li>\n<li>מומלץ לפתוח בבית הספר יותר מכיתת חנ\"מ אחת במידת האפשר, לשם התמקצעות, למידה ויצירת מילייה מקצועי.<\/li>\n<\/ol>\n<h3>חלק ב': תפיסת העבודה של הפסיכולוג בכיתות החנ\"מ – עקרונות ויישום<\/h3>\n<p><strong>עקרונות כלליים<\/strong><\/p>\n<ul>\n<li>כחלק מחוזה העבודה הכללי של הפסיכולוג בבית הספר, יש לייחד התייחסות ספציפית לעבודה קבועה ושיטתית של <strong>לפחות שעה בשבוע<\/strong> בכיתת החינוך המיוחד.<\/li>\n<li>החוזה צריך לשקף את האג'נדה של המנהל ובית הספר, ובאותו זמן גם את האג'נדה המקצועית-טיפולית של הפסיכולוג.<\/li>\n<li>הפסיכולוג מסייע לצוות להבין באופן אינטגרטיבי את החריגויות ואת השלכותיהן על ילדי הכיתה, ולתרגם את ההבנה לעבודת הצוות החינוכי-טיפולי בתחום הקוגניטיבי, הרגשי, החברתי וההתנהגותי.<\/li>\n<li>הפסיכולוג מסייע ביצירת אווירה שמקדמת שילוב. הוא מחזק את תחושת השייכות ואת הקשר בין תלמידי כיתת החנ\"מ לשאר תלמידי בית הספר באמצעות:<ul>\n<li>שילוב פרטני בכיתה רגילה.<\/li>\n<li>עידוד קשרים חברתיים בהפסקות ובאירועים שכבתיים וכלל-בית-ספריים.<\/li>\n<li>שילוב צוות כיתת החנ\"מ בחדר המורים הכללי ובעבודת בית הספר.<\/li>\n<li>שיתוף כלל הורי בית הספר בחשיבות תהליך השילוב.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>שלב א': לקראת פתיחת הכיתה<\/strong><\/p>\n<p>הפסיכולוג שותף לדיון בבית הספר, קודם עם המנהל ואחר כך עם צוות חדר המורים, על התפיסה הערכית, החינוכית והטיפולית ועל ההיערכות בפועל. המטרה היא ליצור תשתית להבעה ולעיבוד של הרגשות, הדעות והמחשבות כלפי השינוי. מהלך העבודה בתקופה זו:<\/p>\n<ol>\n<li><strong>ישיבה עם המנהל<\/strong>: תכנון הצרכים והצגת הכיתה לכלל המורים ביום ההיערכות שלפני תחילת השנה. אפשר לבחון יחד עם המנהל הקמת צוות חשיבה וביצוע, שיורכב מנציגי הצוות הניהולי-טיפולי, ממורי הכיתה ומהמורים שיהיו מעורבים בקליטתה ובעבודה איתה.<\/li>\n<li><strong>עם קבלת הטופס מוועדת ההשמה או השיבוץ<\/strong>: הזמנת התיקים הפסיכולוגיים מהתחנות הפולטות ולמידתם.<\/li>\n<li><strong>מפגש היכרות עם מחנכת הכיתה<\/strong>: קביעת לוח זמנים שנתי למפגשים איתה ועם כל צוות הכיתה. הדגש במפגש: הדילמות שמעסיקות את המחנכת לגבי התלמידים וההורים, תכנון העבודה איתם, ותכנון הצעדים לשילוב המורה בכלל הצוות ולשילוב כיתתה בכלל בית הספר.<\/li>\n<li><strong>השתתפות ביום ההיערכות של כל צוות בית הספר<\/strong>, בהנחיית המנהל. ביום הזה מוצגים הכיתה וקווים כלליים לאופי העבודה איתה, <strong>והפסיכולוג מציג את אפיוני תלמידי הכיתה<\/strong>.<\/li>\n<li><strong>מפגש מקדים של הצוות הטיפולי, בהשתתפות המנהל, עם מחנכת הכיתה ומחנכות הכיתות המשלבות<\/strong>. מטרות המפגש: היכרות, בניית צעדים אופרטיביים לשילוב, התאמת מערכת השעות וקביעת לוח זמנים למפגשים משותפים. תפקיד הפסיכולוג הוא לדאוג שהצעדים המתוכננים יתחשבו בצורכי התלמידים ובאפיוניהם, ולחשוב על דרכים לשתף את התלמידים בכיתות הקולטות.<\/li>\n<li><strong>איסוף מידע על גורמים טיפוליים חיצוניים<\/strong> שקשורים ישירות לתלמידים (עו\"ס, בריאות הנפש, חונכים), כדי שאפשר יהיה להיעזר בהם בעת הצורך.<\/li>\n<\/ol>\n<p><strong>שלב ב': בחודשים הראשונים<\/strong><\/p>\n<ol>\n<li>ליווי מחנכת הכיתה בהתארגנות של תחילת השנה ובבניית התל\"א לכל תלמיד לפי הצורך, ועירור מודעות לאספקטים הפסיכולוגיים שצריך לשקול בבנייתה.<\/li>\n<li>השתתפות במפגש הראשון עם הורי הכיתה. הפסיכולוג מציג את עצמו ואת סל השירותים שמיועד לכיתה, ופותח ערוץ זמינות להורים לייעוץ ולהדרכה לפי הצורך (גם בתחנה, במידת הצורך). מומלץ שגם המנהל והצוות הבין-מקצועי ישתתפו ויציגו את עצמם. המנהל מעביר את תפיסתו החינוכית: בית הספר אחראי לקידום כלל התלמידים לפי צורכיהם הדיפרנציאליים, ומשקיע משאבים חינוכיים וטיפוליים מיוחדים כשצריך. ההורים הם שותפים מלאים, ומעורבותם חיונית להצלחה, כולל להצלחת השילוב.<\/li>\n<\/ol>\n<p><strong>שלב ג': בהמשך השנה<\/strong><\/p>\n<ol>\n<li>הטמעת תהליכי מעקב אחר התקדמות התלמידים, יישום התל\"א ותוכנית השילוב האישית והכיתתית. כלומר, מעורבות בכל מה שקשור לתוכנית השילוב של כל ילד: באילו מקצועות ישתלב, התכנון, דרכי הביצוע, המעקב וההתאמות, והשתתפות בישיבות רב-מקצועיות.<\/li>\n<li>ייעוץ פסיכולוגי לצוות החינוכי-טיפולי ולהורים לפי הצורך.<\/li>\n<li>אבחונים לפי הצורך וכהכנה לוועדות ההשמה לפי חוק החינוך המיוחד.<\/li>\n<li>פרויקטים מיוחדים לפי צורכי הכיתה וביוזמת הפסיכולוג.<\/li>\n<\/ol>\n<p><strong>שלב ד': בסוף השנה<\/strong><\/p>\n<ol>\n<li>השתתפות במפגשי סיכום העבודה בכיתה (צוות והורים), עם דגש על הערכה עדכנית של צורכי כל תלמיד ועל תכנון שנת הלימודים הבאה לפיה.<\/li>\n<li>סיכום העבודה עם הכיתה כמערכת, ושל קשרי הגומלין שלה עם המערכת החינוכית הכללית.<\/li>\n<li>סיכום עבודת הפסיכולוג עם מחנכת הכיתה.<\/li>\n<\/ol>","practice":"<ul>\n<li><strong>בשיחת החוזה עם המנהל<\/strong> בתחילת השנה, לבקש במפורש שעה שבועית קבועה לכיתה הקטנה ולנסח מטרות שמשלבות את האג'נדה של המנהל ואת האג'נדה הטיפולית שלך.<\/li>\n<li><strong>לבנות לוח שנה אישי לפי ארבעת השלבים<\/strong>: לפני פתיחה (או בתחילת השנה, אם הכיתה כבר קיימת), החודשים הראשונים, המשך השנה וסוף השנה. כדאי לסמן מראש את מועדי ישיבות התל\"א (שלוש פעמים בשנה) ואת מועדי ועדות ההשמה.<\/li>\n<li><strong>ללמוד את התיקים הפסיכולוגיים מהמסגרות הקודמות<\/strong> ברגע שמגיע טופס ועדת ההשמה, ולהכין הצגה קצרה של אפיוני תלמידי הכיתה לחדר המורים, כזו שמסבירה ואינה מתייגת.<\/li>\n<li><strong>להיפגש מוקדם עם מחנכת הכיתה<\/strong> ולקבוע איתה מפגשים קבועים. כדאי לפתוח בדילמות שמעסיקות אותה, לא רק במידע על התלמידים, ולחשוב איתה איך היא וכיתתה משתלבות בבית הספר.<\/li>\n<li><strong>להשתתף בתכנון השילוב<\/strong>: באילו מקצועות, עם אילו כיתות, באיזו מערכת שעות. התפקיד שלך הוא לוודא שהתוכנית מתאימה לצורכי התלמידים ולאפיוניהם, ולחשוב גם על הכנת התלמידים בכיתות הקולטות.<\/li>\n<li><strong>לשים לב לסטיגמה המרחבית והחברתית<\/strong>: איפה ממוקמת הכיתה? האם המחנכת יושבת בחדר המורים ומשתתפת בישיבות השכבה? אלה נקודות שאפשר להעלות מול המנהל.<\/li>\n<li><strong>להופיע במפגש ההורים הראשון<\/strong> ולפתוח ערוץ זמינות ברור. כדאי לעודד את המנהל להעביר מסר של אחריות לכל התלמידים ושל שותפות עם ההורים.<\/li>\n<li><strong>למפות גורמי חוץ<\/strong> (עו\"ס, בריאות הנפש, חונכים) לכל תלמיד בכיתה כבר בתחילת השנה.<\/li>\n<\/ul>","questions":"<ol>\n<li>האם הכיתה הקטנה בבית הספר שלי נתפסת כ\"אחת ממכלול כיתות ביה\"ס\" או ככיתה צדדית? אילו סימנים מרחביים, ארגוניים וחברתיים מעידים על כך, ומה אני יכול/ה לעשות בנידון?<\/li>\n<li>אילו רגשות, דעות ומחשבות יש לצוות בית הספר כלפי הכיתה ותלמידיה? האם היה להם מקום לבטא ולעבד אותם, ומה תפקידי בכך?<\/li>\n<li>איך אני מאזן/ת בין האג'נדה של המנהל לבין האג'נדה הטיפולית שלי בכיתה? מה קורה כשהן מתנגשות?<\/li>\n<li>מה מקומי בבניית התל\"א? איך אני מביא/ה לתוכה \"אספקטים פסיכולוגיים\" בלי להפוך אותה למסמך טיפולי?<\/li>\n<li>איך אני מגדיר/ה עם המחנכת את מעמדה כ\"מומחית\" בבית הספר, ואיך אני יכול/ה לחזק אותו?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"קליטת תלמידים בעלי זכאות לחינוך מיוחד בבתיה\"ס הינה תהליך מורכב הדורש הערכות בכמה רמות- הערכית, העקרונית והיישומית.\"<\/li>\n<li>\"תפיסה חינוכית הרואה בהשקעה בטיפוח ילדים בעלי צרכים מיוחדים רווח לכל המערכת.\"<\/li>\n<li>\"כחלק מחוזה העבודה הכללי של הפסיכולוג בביה\"ס, יש ליחד התייחסות ספציפית לעבודה קבועה ושיטתית של לפחות שעה בשבוע בכיתת החינוך המיוחד.\"<\/li>\n<li>\"החוזה צריך לשקף את האגינדה של המנהל וביה\"ס, אך בו בזמן גם את האגינדה המקצועית – טיפולית של הפסיכולוג החינוכי.\"<\/li>\n<\/ul>"},"level":"שנה א' (לכל מתמחה שבבית הספר שלו יש כיתה קטנה או כיתת חנ\"מ), וגם שנים ב'-ג'","stype":"מתווה מדיניות / מודל עבודה (מסמך פנימי של השירות, בגרסת טיוטה)","tldr":"המסמך הוא טיוטת מדיניות של פורום החינוך המיוחד בשפ\"ח תל אביב-יפו (2010). הוא מגדיר איך עובד הפסיכולוג החינוכי בכיתות חינוך מיוחד (\"כיתות קטנות\") שפועלות בתוך בית ספר רגיל. הנחת המוצא היא שקליטת תלמידים עם זכאות לחינוך מיוחד היא תהליך מורכב, ושהיא…","search":"המסמך הוא טיוטת מדיניות של פורום החינוך המיוחד בשפ\"ח תל אביב-יפו (2010). הוא מגדיר איך עובד הפסיכולוג החינוכי בכיתות חינוך מיוחד (\"כיתות קטנות\") שפועלות בתוך בית ספר רגיל. הנחת המוצא היא שקליטת תלמידים עם זכאות לחינוך מיוחד היא תהליך מורכב, ושהיא מצליחה רק כשבית הספר מתפקד היטב מבחינה מערכתית, פדגוגית ודידקטית, וכשכל הגורמים, בבית הספר ומחוצה לו, מתואמים. החלק הראשון מתאר את \"תפיסת העולם החינוכית\" הרצויה בבית ספר שיש בו כיתה כזו. ברמה הערכית: סובלנות וקבלת השונה, אחריות לכלל התלמידים, שילוב כמטרה, אמונה ביכולת הילדים, עבודה רב-מקצועית אינטגרטיבית, ושינוי עמדות סטיגמטיות דרך מיקום הכיתה ותנאיה. ברמה האופרטיבית: בחירת צוות, הכנת הצוות, התלמידים וההורים, תוכנית שילוב, ומנהל שמוביל עבודת צוות. החלק השני מגדיר את עבודת הפסיכולוג: לפחות שעה שבועית קבועה בכיתה במסגרת החוזה, תרגום החריגויות לעבודת הצוות, וקידום אווירה של שילוב. אחר כך מפורט לוח עבודה כרונולוגי: לפני פתיחת הכיתה, בחודשים הראשונים, בהמשך השנה ובסופה. הצלחת הכיתה תלויה בבית הספר כולו: קליטה מוצלחת דורשת היערכות ברמה הערכית, העקרונית והיישומית, ותיאום בין כל הגורמים החינוכיים-טיפוליים בבית הספר ובין הגורמים החינוכיים-קהילתיים שמחוצה לו. עבודה עם כיתות החנ\"מ היא ערך מרכזי בתפיסת העבודה של הפסיכולוג החינוכי, כלפי הילדים ומשפחותיהם וכלפי המערכת המשלבת. לכן הפסיכולוג צריך להיות שותף פעיל כבר לפני פתיחת הכיתה, ולא רק להצטרף אחרי שהיא נפתחה. עבודה קבועה מעוגנת בחוזה: המסמך קובע עבודה קבועה ושיטתית של לפחות שעה בשבוע בכיתת החנ\"מ. החוזה צריך לשקף גם את האג'נדה של המנהל ובית הספר וגם את האג'נדה המקצועית-טיפולית של הפסיכולוג. הפסיכולוג כמתרגם: הוא מסייע לצוות להבין באופן אינטגרטיבי את החריגויות ואת השלכותיהן, ולתרגם את ההבנה לעבודה חינוכית-טיפולית בתחום הקוגניטיבי, הרגשי, החברתי וההתנהגותי. מאבק בסטיגמה דרך המרחב והמעמד: לכיתה צריך להיות מקום מרכזי ולא צדדי, ולמחנכת מקום במערך השכבתי. צריך להתייחס אליהן כאל \"אחת ממכלול כתות ביה\"ס\", לתת לכיתה מרחב שמאפשר עבודה דיפרנציאלית, ולשלב את צוות הכיתה בחדר המורים הכללי. עיבוד רגשי לפני השינוי: לפני פתיחת הכיתה הפסיכולוג שותף לדיון עם המנהל ואחר כך עם חדר המורים, כדי ליצור \"תשתית להבעה ועיבוד של מגוון הרגשות, הדעות והמחשבות\" כלפי הכנסת הכיתה ושילוב הילדים. המנהל מוביל: המנהל משמש מוביל צוות ועוקב אחר התקדמות הכיתה. הוא בונה למחנכת מעמד של מומחית, מקיים עבודה משותפת קבועה על התל\"א (שלוש פעמים בשנה, בשיתוף ההורים), ומחבר בין מחנכת הכיתה המיוחדת לצוות הכיתות המשלבות. ההורים שותפים מלאים: במפגש הראשון עם הורי הכיתה הפסיכולוג מציג את עצמו ואת סל השירותים ופותח ערוץ זמינות. המנהל מבהיר שבית הספר אחראי לקידום כלל התלמידים לפי צורכיהם הדיפרנציאליים, ושההורים הם \"חלק בלתי נפרד\" מהמאמץ החינוכי. עבודה במחזור שנתי: הכנה לפני פתיחה, ליווי בבניית התל\"א, מעקב אחר תוכניות השילוב, ייעוץ, אבחונים לקראת ועדות השמה, וסיכום שנתי ברמת הפרט, הכיתה כמערכת והקשר עם המחנכת. מילייה מקצועי: מומלץ לפתוח בבית הספר יותר מכיתת חנ\"מ אחת, כדי לאפשר התמקצעות, למידה ויצירת \"מילייה מקצועי\". כיתת ח\"מ / כיתה קטנה בבית ספר רגיל – כיתה לתלמידים בעלי זכאות לחינוך מיוחד שפועלת בתוך בית ספר רגיל. המסמך עוסק בקליטתה ובשילובה במערכת. תפיסת עולם חינוכית הומניסטית – בסיס הערכים הנדרש מבית ספר שקולט כיתה כזו: סובלנות, אחריות לכלל התלמידים, שילוב, אמונה ביכולת, ועבודה רב-מקצועית. שילוב – יצירת קשר והשתייכות בין תלמידי הכיתה לכלל בית הספר: מערכת שעות קבועה לשילוב, כניסה דו-כיוונית בין כיתות, תוכניות עמיתים, ופעילויות, אירועים וטיולים משותפים. כניסה דו-כיוונית – מעבר של תלמידים מכיתה לכיתה, בשני הכיוונים, לפי תוכנית שהוגדרה מראש, למטרות לימודיות (כלל-שכבתיות) או חברתיות. תל\"א (תוכנית לימודים אישית) – תוכנית אישית לכל תלמיד. הפסיכולוג מלווה את בנייתה ומעורר מודעות לאספקטים הפסיכולוגיים שבה, ובהמשך עוקב אחר יישומה. תוכנית שילוב אישית וכיתתית – התוכנית שקובעת באילו מקצועות ישתלב כל ילד ואיך. הפסיכולוג מעורב בתכנון, במעקב ובהתאמות. מעמד מומחה למחנך/ת הכיתה – מעמד שהמנהל בונה למחנכת (באמצעות השתלמויות והדרכה שוטפת), כדי שתוכל להעשיר את שאר הצוות. צוות חשיבה וביצוע – צוות אופציונלי, שאפשר להקים יחד עם המנהל, של נציגי הצוות הניהולי-טיפולי, מורי הכיתה ומורים מבית הספר שיהיו מעורבים בקליטת הכיתה. תחנות פולטות – המסגרות שמהן מגיעים התלמידים. מהן מזמינים את התיקים הפסיכולוגיים עם קבלת טופס ועדת ההשמה. יום ההיערכות – יום הצוות שלפני תחילת שנת הלימודים. בו מוצגת הכיתה לכלל המורים, והפסיכולוג מציג את אפיוני התלמידים."},{"id":"sped_multi","title":"עבודה רב-מקצועית בחינוך המיוחד","authors":"לא צוין","year":"","cite":"עבודה רב מקצועית בחינוך המיוחד.","url":null,"kind":"article","desc":null,"file":{"orig":"עבודה רב מקצועית בחינוך המיוחד.pdf","ext":"pdf","pdf":"sped_multi.pdf","pages":3,"bytes":107570},"placements":[["s2","sped"]],"extra":false,"ref":"עבודה רב-מקצועית בחנ\"מ","inFolder":true,"srcTitle":"עבודה רב מקצועית בחינוך המיוחד","secs":{"abstract":"<p>הטקסט הוא מסמך עמדה על עבודת צוות רב-מקצועי בחינוך המיוחד ועל מקומו של הפסיכולוג החינוכי בצוות. הוא נפתח בהסכמה הרחבה בעולם המערבי על חיוניותם של צוותים רב-מקצועיים שעובדים מתוך תפיסה של client-centered care. את ריבוי אנשי המקצוע בחינוך המיוחד הוא מסביר בעידן הפוסט-מודרני, שהתרחק מ\"אמת אחת ומוחלטת\". ערך הצוות מנוסח במשפט \"השלם הוא יותר מסכום חלקיו\". אחר כך מוצגות הגדרות של \"שיתוף פעולה\" (Reid, Hornby, Sileo), ומחקרה של מנור-בנימיני (2003), שמראה שעצם קיומו של צוות רב-מקצועי אינו מבטיח שיתוף פעולה יעיל. הטקסט מדגים יעד משותף שכל איש מקצוע עובד עליו מתחומו, ומגדיר את תפקיד הפסיכולוג. הוא מציג את גישת \"הערכה מבוססת צרכים\" (RTI ו-Problem Solving), שבה צוות רב-מקצועי ושותפות עם ההורים מחליפים את הגישה הפסיכומטרית בגישה \"אדיו-מטרית\" מעגלית. לבסוף הוא דן בשאלה אם ההורים הם חלק מהצוות. התשובה היא שהקשר בין ההורים לצוות הוא \"כר רחב מאוד לסיכוי ולסיכון\", והטקסט מונה את המרכיבים של partnership בין הורים לאנשי מקצוע.<\/p>","ideas":"<ul>\n<li><strong>צוות רב-מקצועי הוא תנאי להבנת הילד<\/strong>: יש היום הסכמה רחבה שצוותים רב-מקצועיים שעובדים מתוך תפיסה של client-centered care חיוניים, כי הם מספקים תובנות ייחודיות על היבטים שונים של התפתחות הילד וקידומו.<\/li>\n<li><strong>ריבוי מקצועות כביטוי של עידן<\/strong>: הפוסט-מודרניזם (\"רלטיביזם\") מוביל לחיפוש \"אמיתות\" רבות ולהתמחויות ספציפיות. לכן בצוותי החנ\"מ יש היום מגוון רחב של אנשי מקצוע: מחנכת ומורים מקצועיים, מנהל, פסיכולוג, יועץ, מטפלים באמנות, בתנועה, בדרמה, במוזיקה ובבעלי חיים, מרפאים בעיסוק, קלינאי תקשורת, מדריכי מת\"י, מורות שילוב, רופאים, סייעות אישיות, עובדים סוציאליים, מומחים להוראת קריאה ועוד.<\/li>\n<li><strong>אחריות אישית וצוותית<\/strong>: כל איש מקצוע מביא תרומה ייחודית, ובאותו זמן הוא \"מחויב ואחראי אישית וכחבר בצוות\" למענה על <strong>צרכיו הכוללים<\/strong> של הילד.<\/li>\n<li><strong>\"השלם הוא יותר מסכום חלקיו\"<\/strong>: כשהצוות עובד יחד (קולבורציה), בתיאום ובהרמוניה, נוצרת ישות רחבה ועשירה יותר מסך בעלי המקצוע, עם פוטנציאל תרומה לילד, למשפחה ולמערכת החינוכית.<\/li>\n<li><strong>נוכחות אינה שיתוף פעולה<\/strong>: לפי מנור-בנימיני, עצם הימצאותם של אנשי צוות רב-מקצועי במערכת \"אינו מבטיח שתוף פעולה יעיל\". היא מבחינה בין סוגי שיח: יידוע, התייעצות והתחלקות. שיתוף פעולה אמיתי יכול לייצר ידע חדש, לעודד דיאלוג ולשנות פרדיגמה קבועה.<\/li>\n<li><strong>יעד משותף שמתורגם לכל דיסציפלינה<\/strong>: בדוגמה, יעד של שיפור כישורים חברתיים והפחתת אלימות מתורגם לעבודה של כל איש מקצוע. המחנכת עובדת עם תוכנית חיזוקים, קלינאית התקשורת עובדת על הפרגמטיקה, הפסיכולוג עובד בטיפול פרטני ובייעוץ להורים, וכל הצוות מדריך את הצוות החינוכי, כך ש\"כל מהלך שהותו של הילד\" מכוון לאותה מטרה.<\/li>\n<li><strong>הערכה מבוססת צרכים במקום פסיכומטריקה<\/strong>: לפי מודלי RTI ו-Problem Solving, המוקד הוא בצרכים של התלמיד ולא בחוסריו. ההערכה נשענת על נתונים מגורמים שונים, על הערכה אקולוגית (תצפיות מובנות, ראיונות, אינדיקטורים דינמיים), על תיעוד פערים מול בני הגיל ועל ניתוח התגובה להוראה. זו גישה \"אדיו-מטרית\" (תלוית חינוך), מעגלית: מהערכה להתערבות וחזרה להערכה.<\/li>\n<li><strong>הפסיכולוג בכל שלבי התהליך<\/strong>: הוא תורם להגדרת הבעיה (אבחון והערכה) ולתכנון ההתערבות על שני צירים: התפתחות נורמטיבית רצויה, וההתפתחות האישית של הילד, עם לקויותיו וכוחותיו. הוא גם מסייע למטפלים הישירים בעבודה ייעוצית שמתייחסת \"לחלקים האישיים של המטפל המופעלים על ידי הילד הספציפי\".<\/li>\n<li><strong>ההורים כחלק מהצוות: סיכוי וסיכון<\/strong>: בראייה צרה ההורים אינם חלק מהצוות. בראייה הוליסטית הם חלק \"חיוני עד הכרחי\". ההורים ומערכת החינוך הם \"שני עמודי התווך\" של התפתחות הילד. אבל המעורבות הרגשית העמוקה של שני הצדדים עלולה ליצור \"הם\" ו\"אנחנו\", האשמות וקונפליקט, והילד, שחש ששני הגורמים המשמעותיים לו \"נלחמים\", עלול להיפגע.<\/li>\n<li><strong>מפרספקטיבה קלינית ל-Partnership<\/strong>: יש מעבר מעמדה קלינית לעמדה שבה נקודת המבט של הקליינט מוערכת מאוד. כדי ליצור partnership, אנשי המקצוע צריכים לבחון את עמדותיהם, לקבל את מגבלותיהם ולנסות לחלוק את התנסויות ההורים. סיוע שמבוסס על שיתוף פעולה משפיע יותר מסיוע שבו הנעזר מגיב באופן פסיבי.<\/li>\n<li><strong>מבט מערכתי ומדיניות<\/strong>: מוקד שני של הצוות הוא העבודה המערכתית, כלומר מאפייני המסגרת כחלק מהמערך חינוך-משפחה-קהילה, ועיצוב מדיניות המערכת.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>Client-centered care<\/strong> – תפיסה שבמרכזה הילד ומשפחתו. לפי הטקסט, ממנה נגזרת החיוניות של הצוות הרב-מקצועי.<\/li>\n<li><strong>קולבורציה (שיתוף פעולה)<\/strong> – עבודה משותפת, מתואמת והרמונית של הצוות. הגדרות שמובאות: \"מושג מטריה\" למצבים שבהם עבודת בעל מקצוע אחד חוברת לעבודת אחר (Reid); עבודה יחד שמכוונת למטרה משותפת (Hornby, 1993); תהליך אינטראקטיבי שמאפשר לאנשים עם התנסויות שונות להגיע לפתרונות יצירתיים לבעיות פרקטיות (Sileo, 1998).<\/li>\n<li><strong>יידוע, התייעצות והתחלקות<\/strong> – שלושה סוגי שיח בצוות רב-מקצועי (מנור-בנימיני, 2003). כל אחד מהם משקף אופי אחר של שיתוף פעולה.<\/li>\n<li><strong>הערכה מבוססת צרכים<\/strong> – גישה להחלטה על צרכים חינוכיים-טיפוליים, שתומכת בשני מודלים: תגובה להתערבות (RTI) ופתרון בעיות (Problem Solving).<\/li>\n<li><strong>Student study team<\/strong> – צוות רב-מקצועי שכולל את הפסיכולוג. הוא מגדיר את הבעיה, מתכנן ומעריך את ההתערבות ומנטר את ההתקדמות.<\/li>\n<li><strong>הערכה אקולוגית<\/strong> – תצפיות מובנות, ראיונות ואינדיקטורים דינמיים בסביבה הטבעית של התלמיד.<\/li>\n<li><strong>גישה אדיו-מטרית (edumetric)<\/strong> – \"גישה תלוית חינוך להערכה\", שמוצעת במקום הגישה הפסיכומטרית.<\/li>\n<li><strong>עבודה ייעוצית (קונסולטטיבית)<\/strong> – סיוע של הפסיכולוג למטפלים הישירים, שמתייחס גם לחלקים האישיים שהילד מפעיל בהם ושמונעים מהם להשתמש במלוא כישוריהם.<\/li>\n<li><strong>Partnership (שותפות הורים-אנשי מקצוע)<\/strong> – יחסים שמאופיינים בתרומה הדדית, ברצון לעבוד יחד לקראת מטרות מוסכמות, באמון, ביושר וביכולת לחשוף מידע (Dunst, 1991).<\/li>\n<li><strong>\"סיכוי וסיכון\"<\/strong> – הניסוח של הטקסט למעורבות ההורים בצוות. היא יכולה להיות מיטיבה ומרפאה, ויכולה להפוך לקונפליקט שפוגע בילד.<\/li>\n<\/ul>","models":"<p><strong>א. רשימת אנשי המקצוע בצוותי החנ\"מ (כפי שמופיעה בטקסט)<\/strong>: מחנכת, מורים מקצועיים, מנהל, פסיכולוג, יועץ, מרפאים באמנות, בתנועה, בדרמה, במוזיקה ובבעלי חיים, מרפאים בעיסוק, קלינאי תקשורת, מדריכי מת\"י, מורות שילוב, רופאים, סייעות אישיות, עובדים סוציאליים, מומחים להוראת קריאה \"ועוד ועוד\".<\/p>\n<p><strong>ב. דוגמה ליעד משותף שמתורגם לכל דיסציפלינה<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>איש מקצוע<\/th>\n<th>תרומה ליעד \"שיפור כישורים חברתיים והפחתת התנהגויות אלימות\"<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>מחנכת<\/td>\n<td>תוכנית חיזוקים התנהגותית בכיתה, תוך התייחסות לשפה שהילד משתמש בה<\/td>\n<\/tr>\n<tr>\n<td>קלינאית תקשורת<\/td>\n<td>שיפור החלק הפרגמטי בהתפתחות השפה, והתייחסות להתנהגות במערך הטיפולי<\/td>\n<\/tr>\n<tr>\n<td>פסיכולוג<\/td>\n<td>טיפול פרטני, ייעוץ להורי הילד וסיוע בבניית התנהגויות אלטרנטיביות<\/td>\n<\/tr>\n<tr>\n<td>כל הצוות<\/td>\n<td>עזרה לצוות החינוכי של המוסד והדרכתו, כדי שכל שהות הילד במוסד תכוון לאותה מטרה<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>ההחלטות \"נתונות אחר כך לבדיקה, לפיתוח ושינוי\" לפי מה שהושג ונלמד יחד ולחוד.<\/p>\n<p><strong>ג. תפקיד הפסיכולוג החינוכי בצוות הרב-מקצועי<\/strong><\/p>\n<ul>\n<li>טיפול פרטני.<\/li>\n<li>עבודה עם הורים.<\/li>\n<li>יצירת קשר בונה בין ההורים למוסד החינוכי.<\/li>\n<li>הנחיית הצוות הרב-מקצועי והדרכת חבריו לפי הצורך.<\/li>\n<li>ובמסגרת הערכה מבוססת צרכים:<ul>\n<li>תרומה להבנת הבעיה ולהגדרתה (אבחון והערכה).<\/li>\n<li>תכנון ההתערבות בהתייחסות מקבילה לשני צירים: התפתחות נורמטיבית רצויה, וההתפתחות האישית של הילד, עם לקויותיו וכוחותיו.<\/li>\n<li>סיוע למטפלים הישירים להפיק את המיטב מיכולותיהם ומיכולות הילד, בעבודה ייעוצית שמתייחסת לחלקים האישיים של המטפל שהילד מפעיל.<\/li>\n<li>השפעה על התהליכים בצוות הרב-מקצועי וייעוץ ישיר לשותפים בנושא הקשר בין הצוות, ההורים והילד.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>ד. הערכה מבוססת צרכים: הקו המאחד את מודלי RTI ו-Problem Solving<\/strong><\/p>\n<ol>\n<li><strong>חבירה ושותפות<\/strong> בין התלמיד והוריו לבין אנשי המקצוע (מחנך, יועצת, פסיכולוג, מטפלים פארא-רפואיים, צוותי חנ\"מ ואחרים), שעובדים יחד כצוות מעריך \"בזמן אמת\".<\/li>\n<li><strong>הגדרת הבעיה, תכנון והערכה של המצב ושל ההתערבות, ניטור ההתקדמות והערכת יעילות ההתערבות<\/strong> בידי צוות רב-מקצועי (student study team) שכולל את הפסיכולוג.<\/li>\n<\/ol>\n<p>מרכיבי התיעוד: נתונים מגורמים רלוונטיים שונים; הערכה אקולוגית (תצפיות מובנות, ראיונות, אינדיקטורים דינמיים); תיעוד הפערים מול בני הגיל; ניתוח התגובה להוראה ולהתערבות.\nהמוקד הוא בצרכים ולא בחוסרים, \"ללא קשר לדרגת החומרה\". התהליך מעגלי: הערכה, התערבות וחזרה להערכה.<\/p>\n<p><strong>ה. מרכיבי partnership בין צוותים רב-מקצועיים להורים<\/strong><\/p>\n<ul>\n<li>לפי Dunst (1991): תרומה הדדית, רצון לעבוד יחד לקראת מטרות שהוסכמו מראש, אמון, יושר ויכולת לחשוף מידע בין הצדדים.<\/li>\n<li>לפי Vosler ו-Hunter (1988): תקשורת ישירה, הבנה ואמפתיה, תגובתיות ונגישות, היעדר האשמות, אכפתיות, פתיחות וגמישות, ויכולת לקבל החלטות משותפות.<\/li>\n<li>התנאים מצד אנשי המקצוע: לבחון את עמדותיהם, לקבל את מגבלותיהם ולנסות לחלוק את התנסויות ההורים.<\/li>\n<\/ul>","practice":"<ul>\n<li><strong>לבדוק מה סוג השיח בצוות שלך<\/strong>: האם בישיבות רק מיידעים זה את זה, מתייעצים, או באמת מתחלקים בחשיבה? נוכחות של אנשי מקצוע רבים אינה מבטיחה שיתוף פעולה.<\/li>\n<li><strong>לנסח עם הצוות יעד משותף אחד<\/strong> לילד, ולפרק אותו למה שכל איש מקצוע עושה בתחומו, לפי הטבלה בסעיף ב'. לקבוע מתי בודקים מחדש מה הושג.<\/li>\n<li><strong>כשמבקשים ממך \"אבחון\"<\/strong>, לשקול גם הערכה מבוססת צרכים: איסוף נתונים מכמה גורמים, תצפית בכיתה, ראיונות, תיעוד הפער מבני הגיל, ובדיקה איך הילד הגיב להתערבויות שכבר נעשו. ואחרי ההתערבות, לחזור ולהעריך.<\/li>\n<li><strong>בייעוץ למטפלים ולמורים<\/strong>, לשים לב גם לחלקים האישיים שהילד מעורר בהם ושמגבילים את עבודתם. זה חלק לגיטימי מהעבודה הקונסולטטיבית.<\/li>\n<li><strong>לראות את עצמך כמי שאחראי/ת על הקשר בין ההורים לצוות<\/strong>: לזהות מוקדם סימנים של \"הם ואנחנו\" והאשמות, ולפעול לצמצם אותם, כי הילד נפגע כשההורים והצוות \"נלחמים\".<\/li>\n<li><strong>להשתמש ברשימת מרכיבי ה-partnership<\/strong> (תקשורת ישירה, היעדר האשמות, נגישות, החלטות משותפות) כרשימת בדיקה לפני ישיבת צוות עם הורים ואחריה.<\/li>\n<\/ul>","questions":"<ol>\n<li>בצוות הרב-מקצועי שאני חבר/ה בו, האם \"השלם גדול מסכום חלקיו\", או שכל אחד עובד לבד ומדווח? מה מאפשר או מונע קולבורציה?<\/li>\n<li>האם אני רואה את ההורים כחלק מהצוות? איך זה בא לידי ביטוי בפועל (הזמנה לישיבות, שפה, שיתוף בהחלטות)?<\/li>\n<li>איפה אני ממוקם/ת בין גישה פסיכומטרית לגישה \"אדיו-מטרית\" בהערכות שאני עושה? מה כל אחת מאפשרת ומה היא מחמיצה?<\/li>\n<li>אילו חלקים אישיים שלי מפעיל ילד מסוים, ואיך הם משפיעים על עבודתי? אותה שאלה לגבי המורה שאני מייעץ/ת לה.<\/li>\n<li>מתי נתקלתי במעורבות הורים שהפכה מ\"סיכוי\" ל\"סיכון\"? מה היה אפשר לעשות אחרת?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"ערכו של הצוות הרב מקצועי מודגם במשפט 'השלם הוא יותר מסכום חלקיו'.\"<\/li>\n<li>\"לפי המחקר עצם הימצאותם של אנשי צוות רב מקצועי במערכת חינוכית - אינו מבטיח שתוף פעולה יעיל.\"<\/li>\n<li>\"תפקידו של הפסיכולוג החינוכי הוא בטפול פרטני, בעבודה עם הורים, ביצירת קשר בונה בין ההורים למוסד החינוכי ובהנחיית הצוות הרב מקצועי והדרכת כל החברים בצוות לפי הצורך.\"<\/li>\n<li>\"ההורים משתתפים פעמים רבות בצוות רב מקצועי הדן בעניינו של ילדם והשתתפות זאת היא כר רחב מאוד לסיכוי ולסכון.\"<\/li>\n<\/ul>"},"level":"שנה א' (מבוא לעבודה בצוות רב-מקצועי ועם הורים בחנ\"מ)","stype":"מאמר (מסמך עמדה קצר; ייתכן שזה פרק או הרצאה כתובה)","tldr":"הטקסט הוא מסמך עמדה על עבודת צוות רב-מקצועי בחינוך המיוחד ועל מקומו של הפסיכולוג החינוכי בצוות. הוא נפתח בהסכמה הרחבה בעולם המערבי על חיוניותם של צוותים רב-מקצועיים שעובדים מתוך תפיסה של client-centered care. את ריבוי אנשי המקצוע בחינוך המיוחד הוא…","search":"הטקסט הוא מסמך עמדה על עבודת צוות רב-מקצועי בחינוך המיוחד ועל מקומו של הפסיכולוג החינוכי בצוות. הוא נפתח בהסכמה הרחבה בעולם המערבי על חיוניותם של צוותים רב-מקצועיים שעובדים מתוך תפיסה של client-centered care. את ריבוי אנשי המקצוע בחינוך המיוחד הוא מסביר בעידן הפוסט-מודרני, שהתרחק מ\"אמת אחת ומוחלטת\". ערך הצוות מנוסח במשפט \"השלם הוא יותר מסכום חלקיו\". אחר כך מוצגות הגדרות של \"שיתוף פעולה\" (Reid, Hornby, Sileo), ומחקרה של מנור-בנימיני (2003), שמראה שעצם קיומו של צוות רב-מקצועי אינו מבטיח שיתוף פעולה יעיל. הטקסט מדגים יעד משותף שכל איש מקצוע עובד עליו מתחומו, ומגדיר את תפקיד הפסיכולוג. הוא מציג את גישת \"הערכה מבוססת צרכים\" (RTI ו-Problem Solving), שבה צוות רב-מקצועי ושותפות עם ההורים מחליפים את הגישה הפסיכומטרית בגישה \"אדיו-מטרית\" מעגלית. לבסוף הוא דן בשאלה אם ההורים הם חלק מהצוות. התשובה היא שהקשר בין ההורים לצוות הוא \"כר רחב מאוד לסיכוי ולסיכון\", והטקסט מונה את המרכיבים של partnership בין הורים לאנשי מקצוע. צוות רב-מקצועי הוא תנאי להבנת הילד: יש היום הסכמה רחבה שצוותים רב-מקצועיים שעובדים מתוך תפיסה של client-centered care חיוניים, כי הם מספקים תובנות ייחודיות על היבטים שונים של התפתחות הילד וקידומו. ריבוי מקצועות כביטוי של עידן: הפוסט-מודרניזם (\"רלטיביזם\") מוביל לחיפוש \"אמיתות\" רבות ולהתמחויות ספציפיות. לכן בצוותי החנ\"מ יש היום מגוון רחב של אנשי מקצוע: מחנכת ומורים מקצועיים, מנהל, פסיכולוג, יועץ, מטפלים באמנות, בתנועה, בדרמה, במוזיקה ובבעלי חיים, מרפאים בעיסוק, קלינאי תקשורת, מדריכי מת\"י, מורות שילוב, רופאים, סייעות אישיות, עובדים סוציאליים, מומחים להוראת קריאה ועוד. אחריות אישית וצוותית: כל איש מקצוע מביא תרומה ייחודית, ובאותו זמן הוא \"מחויב ואחראי אישית וכחבר בצוות\" למענה על צרכיו הכוללים של הילד. \"השלם הוא יותר מסכום חלקיו\": כשהצוות עובד יחד (קולבורציה), בתיאום ובהרמוניה, נוצרת ישות רחבה ועשירה יותר מסך בעלי המקצוע, עם פוטנציאל תרומה לילד, למשפחה ולמערכת החינוכית. נוכחות אינה שיתוף פעולה: לפי מנור-בנימיני, עצם הימצאותם של אנשי צוות רב-מקצועי במערכת \"אינו מבטיח שתוף פעולה יעיל\". היא מבחינה בין סוגי שיח: יידוע, התייעצות והתחלקות. שיתוף פעולה אמיתי יכול לייצר ידע חדש, לעודד דיאלוג ולשנות פרדיגמה קבועה. יעד משותף שמתורגם לכל דיסציפלינה: בדוגמה, יעד של שיפור כישורים חברתיים והפחתת אלימות מתורגם לעבודה של כל איש מקצוע. המחנכת עובדת עם תוכנית חיזוקים, קלינאית התקשורת עובדת על הפרגמטיקה, הפסיכולוג עובד בטיפול פרטני ובייעוץ להורים, וכל הצוות מדריך את הצוות החינוכי, כך ש\"כל מהלך שהותו של הילד\" מכוון לאותה מטרה. הערכה מבוססת צרכים במקום פסיכומטריקה: לפי מודלי RTI ו-Problem Solving, המוקד הוא בצרכים של התלמיד ולא בחוסריו. ההערכה נשענת על נתונים מגורמים שונים, על הערכה אקולוגית (תצפיות מובנות, ראיונות, אינדיקטורים דינמיים), על תיעוד פערים מול בני הגיל ועל ניתוח התגובה להוראה. זו גישה \"אדיו-מטרית\" (תלוית חינוך), מעגלית: מהערכה להתערבות וחזרה להערכה. הפסיכולוג בכל שלבי התהליך: הוא תורם להגדרת הבעיה (אבחון והערכה) ולתכנון ההתערבות על שני צירים: התפתחות נורמטיבית רצויה, וההתפתחות האישית של הילד, עם לקויותיו וכוחותיו. הוא גם מסייע למטפלים הישירים בעבודה ייעוצית שמתייחסת \"לחלקים האישיים של המטפל המופעלים על ידי הילד הספציפי\". ההורים כחלק מהצוות: סיכוי וסיכון: בראייה צרה ההורים אינם חלק מהצוות. בראייה הוליסטית הם חלק \"חיוני עד הכרחי\". ההורים ומערכת החינוך הם \"שני עמודי התווך\" של התפתחות הילד. אבל המעורבות הרגשית העמוקה של שני הצדדים עלולה ליצור \"הם\" ו\"אנחנו\", האשמות וקונפליקט, והילד, שחש ששני הגורמים המשמעותיים לו \"נלחמים\", עלול להיפגע. מפרספקטיבה קלינית ל-Partnership: יש מעבר מעמדה קלינית לעמדה שבה נקודת המבט של הקליינט מוערכת מאוד. כדי ליצור partnership, אנשי המקצוע צריכים לבחון את עמדותיהם, לקבל את מגבלותיהם ולנסות לחלוק את התנסויות ההורים. סיוע שמבוסס על שיתוף פעולה משפיע יותר מסיוע שבו הנעזר מגיב באופן פסיבי. מבט מערכתי ומדיניות: מוקד שני של הצוות הוא העבודה המערכתית, כלומר מאפייני המסגרת כחלק מהמערך חינוך-משפחה-קהילה, ועיצוב מדיניות המערכת. Client-centered care – תפיסה שבמרכזה הילד ומשפחתו. לפי הטקסט, ממנה נגזרת החיוניות של הצוות הרב-מקצועי. קולבורציה (שיתוף פעולה) – עבודה משותפת, מתואמת והרמונית של הצוות. הגדרות שמובאות: \"מושג מטריה\" למצבים שבהם עבודת בעל מקצוע אחד חוברת לעבודת אחר (Reid); עבודה יחד שמכוונת למטרה משותפת (Hornby, 1993); תהליך אינטראקטיבי שמאפשר לאנשים עם התנסויות שונות להגיע לפתרונות יצירתיים לבעיות פרקטיות (Sileo, 1998). יידוע, התייעצות והתחלקות – שלושה סוגי שיח בצוות רב-מקצועי (מנור-בנימיני, 2003). כל אחד מהם משקף אופי אחר של שיתוף פעולה. הערכה מבוססת צרכים – גישה להחלטה על צרכים חינוכיים-טיפוליים, שתומכת בשני מודלים: תגובה להתערבות (RTI) ופתרון בעיות (Problem Solving). Student study team – צוות רב-מקצועי שכולל את הפסיכולוג. הוא מגדיר את הבעיה, מתכנן ומעריך את ההתערבות ומנטר את ההתקדמות. הערכה אקולוגית – תצפיות מובנות, ראיונות ואינדיקטורים דינמיים בסביבה הטבעית של התלמיד. גישה אדיו-מטרית (edumetric) – \"גישה תלוית חינוך להערכה\", שמוצעת במקום הגישה הפסיכומטרית. עבודה ייעוצית (קונסולטטיבית) – סיוע של הפסיכולוג למטפלים הישירים, שמתייחס גם לחלקים האישיים שהילד מפעיל בהם ושמונעים מהם להשתמש במלוא כישוריהם. Partnership (שותפות הורים-אנשי מקצוע) – יחסים שמאופיינים בתרומה הדדית, ברצון לעבוד יחד לקראת מטרות מוסכמות, באמון, ביושר וביכולת לחשוף מידע (Dunst, 1991). \"סיכוי וסיכון\" – הניסוח של הטקסט למעורבות ההורים בצוות. היא יכולה להיות מיטיבה ומרפאה, ויכולה להפוך לקונפליקט שפוגע בילד."},{"id":"manor2004","title":"שיתוף פעולה בין צוותים רב-מקצועיים","authors":"איריס מנור-בנימיני","year":"2004","cite":"מנור-בנימיני, א' (2004). שיתוף פעולה בין צוותים רב-מקצועיים. סוגיות בחינוך מיוחד ובשיקום, 19(2), 35-51.","url":null,"kind":"article","desc":null,"file":{"orig":"שיתוף פעולה בין צוותים רב מקצועיים.pdf","ext":"pdf","pdf":"manor2004.pdf","pages":8,"bytes":479903},"placements":[["s2","sped"]],"extra":false,"ref":"מנור-בנימיני 2004","inFolder":true,"srcTitle":"שיתוף פעולה בין צוותים רב-מקצועיים ובין הורים בבתי-ספר לחינוך מיוחד","secs":{"abstract":"<p>המאמר עוסק בפער בין החקיקה והרטוריקה של שיתוף הורים לבין המציאות, שבה שיתוף פעולה בין הורים לבין צוותים רב-מקצועיים \"נדיר וקשה\". במקום לחקור כישלונות, המחקר בוחן איך מתנהל בפועל שיתוף פעולה <strong>מוצלח<\/strong>. הוא נערך בשלושה צוותים מצליחים בשלושה בתי ספר לחינוך מיוחד: לתלמידים עם הפרעות נפשיות, לתלמידים עם ליקויי למידה מורכבים ופיגור קל רב-בעייתי, ולתלמידים עם הפרעות התנהגות. המחקר התמקד ב\"ישיבות מעברים\", כלומר מפגשי היכרות כשתלמיד נכנס לבית הספר ומפגשי פרידה בשנה האחרונה שלו. לפי הכותבת, אלה המפגשים הטעונים ביותר רגשית עבור ההורים. במשך שלוש שנים נצפו ותועדו כ-80 ישיבות, נערכו 94 ראיונות ונאספו 80 פרוטוקולים. הממצאים מתארים היבטים גלויים וסמויים, מבניים, ארגוניים וחברתיים, שחוזרים בשלושת הצוותים. ביניהם: סיכום ומעקב אחר החלטות, הסבר של מונחים מקצועיים, דוגמאות קונקרטיות, בדיקת הבנה, פתיחה בנקודות חוזק, מומחיות שמבוססת על היכרות עם התלמיד, התמקדות ועמידה בזמנים, מרחב לרגשות ההורים וכבוד. המסקנה היא שההתנהגויות האלה אינן דורשות משאבים רבים, ואפשר ללמד אותן.<\/p>","ideas":"<ul>\n<li><strong>הפער בין חוק למציאות<\/strong>: בישראל החוק (חוק החינוך המיוחד 1988, הרחבת סעיף 7 בנושא שילוב 1997, וחוק ליקויי למידה 2003, כפי שמובא בטקסט) מחייב ליידע את ההורים על התל\"א ולהחתים אותם עליה. בארה\"ב הזכויות רחבות יותר, ותיקוני 1997 הקצו כסף להכשרת הורים כשותפים. ובכל זאת, שיתוף פעולה אמיתי נדיר.<\/li>\n<li><strong>אף מומחה אינו יכול לבד<\/strong>: המדיניות שנגזרת מהחוק מבוססת על ההכרה ש\"אף מומחה אינו יכול לספק את כל הידע והמיומנויות\" הנחוצים לצרכים המגוונים של הילד.<\/li>\n<li><strong>ישיבות המעבר טעונות במיוחד<\/strong>: מפגשי הכניסה לבית ספר מיוחד ומפגשי הפרידה לפני העזיבה מעוררים לחץ רב, ו\"ייתכן שהן אף נחוות בעוצמה השווה לאירוע טראומתי\".<\/li>\n<li><strong>שישה משתנים מהספרות<\/strong> משפיעים על השתתפות ההורים בישיבות התל\"א: אורך הישיבה, שיפוטיות (ככל שההורים חשים פחות האשמה, הם משתתפים יותר), תשומה רב-מקצועית, כבוד להורים, הכנה של אנשי המקצוע לישיבה, והבנה או חוסר הבנה של מה שנאמר.<\/li>\n<li><strong>ממצא מפתיע על נוכחות רבה<\/strong>: ההורים לא חשו מאוימים מקבוצה גדולה של אנשי מקצוע. הם העריכו אותה, כי ראו בה הפגנה של דאגה ועניין בילד.<\/li>\n<li><strong>\"תקשורת טובה\" היא רצף<\/strong>: בקצה אחד העברת מידע פורמלית, שבה ההורה הוא \"מקבל אינפורמציה\", וזו הפרשנות הרווחת אצל אנשי מקצוע. בקצה השני הדרכה והכנה של ההורים לפני הישיבה, כדי שישתתפו בה באופן פעיל.<\/li>\n<li><strong>מונחים מקצועיים, עם הסבר<\/strong>: הצוותים המצליחים לא נמנעו ממונחים מקצועיים, אבל הסבירו אותם באופן מודע ובדקו שהם הובנו. כך הם שידרו \"כבוד ואמון ליכולת של ההורים ללמוד\". ההורים למדו את המושגים ואף השתמשו בהם.<\/li>\n<li><strong>חוזק לצד חולשה, ופתיחה בחוזקות<\/strong>: יכולת הצוות להצמיד חוזק לחולשה שכנעה את ההורים שהילד יכול להצליח, והעידה על נכונות למצוא דרכי התערבות. פתיחת הדיון בנקודות החוזק הרגיעה את ההורים ומנעה מהם להיכנס למגננה.<\/li>\n<li><strong>מומחיות פירושה היכרות עם הילד<\/strong>: איש מקצוע שמכיר את התלמיד אינו עסוק במסמכים ובתכנון דבריו. לכן הוא פנוי להסתכל בפני ההורים ולבדוק אם הבינו. גם הכנות של הצוות, שלפעמים קשה להורים, מבססת את אמונם.<\/li>\n<li><strong>מרחב לרגשות וכבוד מביאים לשותפות<\/strong>: מתן מקום, תוקף ומיקוד לרגשות ההורים, והעצמה מילולית של כל הערה שלהם, העלו את השתתפותם לאורך הישיבה. התעלמות או התגוננות מרחיקות את ההורה. כבוד אינו הימנעות מהקשיים: \"להורים יש את הזכות לשמוע אינפורמציה על הילד שלהם גם אם האינפורמציה אינה חיובית\", בדרך לא שיפוטית.<\/li>\n<li><strong>זול וניתן ללמידה<\/strong>: ההתנהגויות האלה אינן דורשות השקעה רבה ומשאבים נוספים, והדרכה של אנשי מקצוע על העקרונות יכולה להוביל לדיאלוג. הממצאים רלוונטיים גם לעבודה עם הורים לילדים ללא צרכים מיוחדים.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>צוות רב-מקצועי<\/strong> – אנשי המקצוע בבית הספר המיוחד שעובדים עם הילד, ובונים עבורו, לפי החוק, תוכנית לימודים אישית (תל\"א).<\/li>\n<li><strong>תל\"א (תוכנית לימודים אישית)<\/strong> – התוכנית שהצוות חייב לבנות לכל ילד בחנ\"מ. בישראל החוק מחייב ליידע את ההורים עליה ולקבל את חתימתם.<\/li>\n<li><strong>ישיבות מעברים<\/strong> – שני סוגי מפגשים: מפגשי היכרות של ההורים עם הצוות כשהתלמיד נכנס לבית הספר המיוחד, ומפגשי פרידה בשנה האחרונה שלו בבית הספר.<\/li>\n<li><strong>שיפוטיות<\/strong> – תחושת ההורים שאנשי המקצוע מאשימים אותם בקשיי הילד. זה משתנה מרכזי שמוריד את השתתפותם.<\/li>\n<li><strong>תשומה רב-מקצועית<\/strong> – נוכחות של אנשי צוות רבים בישיבה. ההורים חוו אותה כביטוי של דאגה, לא כאיום.<\/li>\n<li><strong>היבטים גלויים וסמויים<\/strong> – הממצאים מוצגים בדימוי של \"גליל המכיל בתוכו גלילים נוספים\": הגליל החיצוני הוא ההיבטים המבניים (גלויים), השני הוא ההיבטים הארגוניים (גם הם גלויים), ובפנים ההיבטים החברתיים (סמויים, לפי התקציר).<\/li>\n<li><strong>מומחיות מקצועית<\/strong> – לפי הגדרת אנשי המקצוע: התייחסות רצינית לישיבה, הגעה מוכנה והיכרות עם התלמיד, עם הערכתו, עם חוזקותיו וחולשותיו ועם מטרות העבודה. המומחיות מאפשרת הקשבה.<\/li>\n<li><strong>התמקדות<\/strong> – ניהול ממוקד של הישיבה, שאיפשר לסיים בזמן, מתוך מודעות לכך שהורים רבים מפסידים יום עבודה כדי להגיע.<\/li>\n<li><strong>מרחב לרגשות ההורים<\/strong> – מתן מקום, תוקף ומיקוד לרגשות, והתייחסות רצינית להערות ההורים.<\/li>\n<li><strong>כבוד<\/strong> – מרכיב שנבנה בעבודה משותפת ובהיכרות ממושכת. הוא מתבטא בהקשבה, באדיבות, בטון נינוח ובתיאור לא מאשים של קשיים, ובצוותים המצליחים הופנה גם בין אנשי הצוות עצמם.<\/li>\n<\/ul>","models":"<p><strong>א. שישה משתנים מהספרות שמשפיעים על השתתפות הורים בישיבות תל\"א<\/strong><\/p>\n<ol>\n<li>אורך הישיבה.<\/li>\n<li>שיפוטיות: ככל שההורים חשים פחות האשמה, הם משתתפים יותר.<\/li>\n<li>תשומה רב-מקצועית: נוכחות של אנשי מקצוע רבים, שההורים העריכו כהפגנת דאגה.<\/li>\n<li>כבוד להורים: הורים שחשים כבוד משתתפים יותר ומרוצים יותר.<\/li>\n<li>הכנה של אנשי המקצוע לישיבה.<\/li>\n<li>הבנה או חוסר הבנה של מה שנאמר בישיבה: לעיתים קרובות ההורים אינם מבינים על מה מדובר.<\/li>\n<\/ol>\n<p><strong>ב. מערך המחקר<\/strong><\/p>\n<ul>\n<li><strong>שיטה<\/strong>: מחקר איכותני, שמתאים במיוחד \"לתת קול לבעלי העניין השונים\". תוקף \"נוכח/בו-זמני\" וטריאנגולציה.<\/li>\n<li><strong>שדה<\/strong>: שלושה בתי ספר לחינוך מיוחד (הפרעות נפשיות; ליקויי למידה מורכבים ופיגור קל רב-בעייתי; הפרעות התנהגות), כל אחד במשך שנת לימודים מלאה.<\/li>\n<li><strong>היקף<\/strong>: כשלוש שנים, כ-80 ישיבות שנצפו, 94 ראיונות ו-80 פרוטוקולים.<\/li>\n<li><strong>חמשת שלבי המחקר<\/strong>:<ol>\n<li>תצפיות פתוחות באינטראקציות מילוליות במפגשים פורמליים של הצוות עם ההורים, כדי לאתר היבטים חוזרים של הצלחה.<\/li>\n<li>תצפיות ממוקדות יותר בהיבטים הגלויים והסמויים שזוהו.<\/li>\n<li>ראיונות עם חברי צוות ועם הורים, כדי להבין את תפיסותיהם ולתקף את ההיבטים.<\/li>\n<li>ניתוח והצגה נאמנה של הממצאים, מתוך הבנה והזדהות אמפתית עם הוויית המשתתפים.<\/li>\n<li>חקירה אנליטית שמטרתה לחלץ את התנאים הבסיסיים לשיתוף פעולה מוצלח.<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<p><strong>ג. מרכיבי שיתוף הפעולה המוצלח<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>מרכיב<\/th>\n<th>מה עשו הצוותים המצליחים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>סיכום בסוף ישיבה<\/td>\n<td>סיכמו בקיצור את נושאי הדיון, וכך נתנו להורים תחושת סיום ותמונה מקיפה של הילד<\/td>\n<\/tr>\n<tr>\n<td>סיכום ומעקב אחר החלטות<\/td>\n<td>איש צוות תיעד את הישיבה, והתיעוד הופץ לכל המשתתפים. אחת לחודש הופץ סיכום החלטות לאנשי המקצוע האחראים לביצוע. המפגש הבא נפתח בהחלטות הקודמות (למשל הפניה לנוירולוג, או שיטת עבודה שההורים ממשיכים בבית)<\/td>\n<\/tr>\n<tr>\n<td>הסבר טרמינולוגיה מקצועית<\/td>\n<td>השתמשו במונחים מקצועיים אבל הסבירו אותם, ובדקו שההסברים הובנו<\/td>\n<\/tr>\n<tr>\n<td>דוגמאות קונקרטיות<\/td>\n<td>הציגו את יכולות התלמיד, את קשייו ואת תוצאות ההערכה בעזרת דוגמאות מהעבודה איתו, וביקשו גם מההורים דוגמאות<\/td>\n<\/tr>\n<tr>\n<td>בדיקה של הבנה<\/td>\n<td>בדקו אם ההורים הבינו: לא מילולית, דרך התבוננות בפניהם, ומילולית, בשאלות<\/td>\n<\/tr>\n<tr>\n<td>כנות, וחוזק לצד חולשה<\/td>\n<td>הציגו את הקשיים בכנות, הצמידו להם חוזקות, הביעו דאגה ישירה בטון ובשפת גוף, ופתחו את הדיווח בנקודות החוזק<\/td>\n<\/tr>\n<tr>\n<td>מומחיות מקצועית<\/td>\n<td>הגיעו מוכנים, מכירים את התלמיד, את הערכתו ואת מטרות העבודה, וכך היו פנויים להקשבה<\/td>\n<\/tr>\n<tr>\n<td>התמקדות<\/td>\n<td>פתיחה לבבית וחמה, ניהול ממוקד, כל איש מקצוע בתורו, וסיום בזמן<\/td>\n<\/tr>\n<tr>\n<td>מרחב לרגשות ההורים<\/td>\n<td>נתנו מקום, תוקף ומיקוד לרגשות, למשל בשאלה ישירה להורה חרד. דיברו בעדינות ובטון מקצועי, והעצימו מילולית כל הערה של ההורים<\/td>\n<\/tr>\n<tr>\n<td>כבוד<\/td>\n<td>הקשבה אמיתית, אדיבות, היעדר כעס והאשמה, וכבוד גם בין אנשי הצוות עצמם<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>ד. נספח 1: כלי להערכת שיח שיתופי בין צוות רב-מקצועי להורים<\/strong><\/p>\n<p>הנחיה: \"התבונן באיש צוות השותף לישיבה במהלך כל הישיבה וסמן במקום המתאים בטבלה את מספר הפעמים שבהן זיהית את ההתנהגות\". לכל \"הישג נדרש\" יש סולם ספירה של 1-16:<\/p>\n<ol>\n<li>הסבר של טרמינולוגיה מקצועית<\/li>\n<li>סיכום ומעקב אחרי קבלת החלטות<\/li>\n<li>מתן דוגמאות קונקרטיות<\/li>\n<li>בדיקה של הבנה<\/li>\n<li>שאילת שאלות<\/li>\n<li>שפת דיבור חיובית<\/li>\n<li>מומחיות מקצועית<\/li>\n<li>התמקדות<\/li>\n<li>איזון במבנה הכוח הרב-מקצועי<\/li>\n<li>הגדרה ברורה של תפקיד ההורה<\/li>\n<li>מרחב לרגשות ההורים<\/li>\n<li>מתן כבוד<\/li>\n<li>אחר<\/li>\n<\/ol>\n<p>(שאילת שאלות, שפת דיבור חיובית, איזון במבנה הכוח והגדרה ברורה של תפקיד ההורה מופיעים גם הם ברשימת המרכיבים.)<\/p>","practice":"<ul>\n<li><strong>לפני ישיבת צוות-הורים<\/strong>, להכיר את הילד היטב ולהגיע מוכן/ה, כדי להיות פנוי/ה להסתכל על ההורים ולא על הניירות.<\/li>\n<li><strong>לפתוח בנקודות החוזק<\/strong> של הילד, ולהציג כל קושי לצד חוזק או דרך התערבות אפשרית. במקביל לא להסתיר את הקשיים, כי להורים יש זכות לשמוע.<\/li>\n<li><strong>להשתמש במונחים מקצועיים רק עם הסבר<\/strong>, ולבדוק במילים ובמבט שהם הובנו. במשוב אבחוני להורים זה קריטי במיוחד.<\/li>\n<li><strong>להביא דוגמאות קונקרטיות<\/strong> מהעבודה עם הילד, ולבקש מההורים דוגמאות משלהם.<\/li>\n<li><strong>לתת מקום לרגשות<\/strong>: לשאול שאלה ישירה כשההורה נראה חרד, להתייחס ברצינות להערות ההורים ולשקף אותן.<\/li>\n<li><strong>לסגור את הישיבה בסיכום קצר ובהחלטות כתובות<\/strong> עם אחראים, ולפתוח את המפגש הבא בבדיקת מה שסוכם. אם אין בבית הספר מנגנון כזה, אפשר להציע אותו.<\/li>\n<li><strong>לשים לב לישיבות \"מעברים\"<\/strong> (קליטה בכיתה או במסגרת חנ\"מ, פרידה ומעבר למסגרת הבאה, ועדות השמה). ההורים עשויים לחוות אותן באופן טראומטי, ולכן כדאי להכין אותם מראש, ולא רק להעביר להם מידע.<\/li>\n<li><strong>להשתמש בנספח 1 ככלי למידה<\/strong>: לצפות בישיבה (או לבקש מעמית/ה לצפות בך) ולספור את ההתנהגויות. הכלי מתאים גם להדרכה.<\/li>\n<\/ul>","questions":"<ol>\n<li>באיזו נקודה על הרצף שבין \"העברת מידע\" לבין \"הכנת הורים להשתתפות פעילה\" נמצאות הישיבות שאני משתתף/ת בהן?<\/li>\n<li>איך אני מגיב/ה כשהורה כועס או חרד בישיבה? האם אני נותן/ת מקום לרגש, או ממהר/ת להתגונן ולחזור לסדר היום?<\/li>\n<li>מה מאזן הכוח בין ההורים לאנשי המקצוע בישיבות שלי? מי מדבר, כמה זמן, ומי מחליט?<\/li>\n<li>האם יש פער בין הכבוד שאני רוצה לשדר לבין מה שההורים חווים בפועל (טון, שפת גוף, אורך הישיבה, עמידה בזמנים)?<\/li>\n<li>בישיבות המעבר בבית הספר שלי, מה עושים כדי להפחית את הלחץ על ההורים, ומה אפשר להוסיף?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"הורי הילד המיוחד נמצאים במסע רגשי שכצופים חיצוניים, לעולם לא נבין אותו במלואו או נוכל להעריכו, נוכל רק לכבד אותו\" (תרפיסטית באומנות ואם לילד חריג, בראיון).<\/li>\n<li>\"במציאות, אחרי שנים רבות של חקיקה, מחקר והתנסות, שיתוף פעולה בין הורים ובין צוותים רב-מקצועיים הוא נדיר וקשה.\"<\/li>\n<li>\"כבוד להורים משמעותו לא הייתה הימנעות מדיון בקשיים או בעיות של הילד.\"<\/li>\n<li>\"סוג ההתנהגויות וההתייחסות המוצעות כאן במרכיבים שהוצגו לקיום שותפות מוצלחת אינם דורשים השקעה רבה ומשאבים נוספים לחינוך או למערכות סיוע אחרות.\"<\/li>\n<\/ul>"},"level":"שנה א' (הממצאים הם כלים התנהגותיים ישירים לישיבות עם הורים). מתאים גם לשנים ב'-ג'.","stype":"מאמר (מחקר איכותני)","tldr":"המאמר עוסק בפער בין החקיקה והרטוריקה של שיתוף הורים לבין המציאות, שבה שיתוף פעולה בין הורים לבין צוותים רב-מקצועיים \"נדיר וקשה\". במקום לחקור כישלונות, המחקר בוחן איך מתנהל בפועל שיתוף פעולה מוצלח. הוא נערך בשלושה צוותים מצליחים בשלושה בתי ספר לחינוך…","search":"המאמר עוסק בפער בין החקיקה והרטוריקה של שיתוף הורים לבין המציאות, שבה שיתוף פעולה בין הורים לבין צוותים רב-מקצועיים \"נדיר וקשה\". במקום לחקור כישלונות, המחקר בוחן איך מתנהל בפועל שיתוף פעולה מוצלח. הוא נערך בשלושה צוותים מצליחים בשלושה בתי ספר לחינוך מיוחד: לתלמידים עם הפרעות נפשיות, לתלמידים עם ליקויי למידה מורכבים ופיגור קל רב-בעייתי, ולתלמידים עם הפרעות התנהגות. המחקר התמקד ב\"ישיבות מעברים\", כלומר מפגשי היכרות כשתלמיד נכנס לבית הספר ומפגשי פרידה בשנה האחרונה שלו. לפי הכותבת, אלה המפגשים הטעונים ביותר רגשית עבור ההורים. במשך שלוש שנים נצפו ותועדו כ-80 ישיבות, נערכו 94 ראיונות ונאספו 80 פרוטוקולים. הממצאים מתארים היבטים גלויים וסמויים, מבניים, ארגוניים וחברתיים, שחוזרים בשלושת הצוותים. ביניהם: סיכום ומעקב אחר החלטות, הסבר של מונחים מקצועיים, דוגמאות קונקרטיות, בדיקת הבנה, פתיחה בנקודות חוזק, מומחיות שמבוססת על היכרות עם התלמיד, התמקדות ועמידה בזמנים, מרחב לרגשות ההורים וכבוד. המסקנה היא שההתנהגויות האלה אינן דורשות משאבים רבים, ואפשר ללמד אותן. הפער בין חוק למציאות: בישראל החוק (חוק החינוך המיוחד 1988, הרחבת סעיף 7 בנושא שילוב 1997, וחוק ליקויי למידה 2003, כפי שמובא בטקסט) מחייב ליידע את ההורים על התל\"א ולהחתים אותם עליה. בארה\"ב הזכויות רחבות יותר, ותיקוני 1997 הקצו כסף להכשרת הורים כשותפים. ובכל זאת, שיתוף פעולה אמיתי נדיר. אף מומחה אינו יכול לבד: המדיניות שנגזרת מהחוק מבוססת על ההכרה ש\"אף מומחה אינו יכול לספק את כל הידע והמיומנויות\" הנחוצים לצרכים המגוונים של הילד. ישיבות המעבר טעונות במיוחד: מפגשי הכניסה לבית ספר מיוחד ומפגשי הפרידה לפני העזיבה מעוררים לחץ רב, ו\"ייתכן שהן אף נחוות בעוצמה השווה לאירוע טראומתי\". שישה משתנים מהספרות משפיעים על השתתפות ההורים בישיבות התל\"א: אורך הישיבה, שיפוטיות (ככל שההורים חשים פחות האשמה, הם משתתפים יותר), תשומה רב-מקצועית, כבוד להורים, הכנה של אנשי המקצוע לישיבה, והבנה או חוסר הבנה של מה שנאמר. ממצא מפתיע על נוכחות רבה: ההורים לא חשו מאוימים מקבוצה גדולה של אנשי מקצוע. הם העריכו אותה, כי ראו בה הפגנה של דאגה ועניין בילד. \"תקשורת טובה\" היא רצף: בקצה אחד העברת מידע פורמלית, שבה ההורה הוא \"מקבל אינפורמציה\", וזו הפרשנות הרווחת אצל אנשי מקצוע. בקצה השני הדרכה והכנה של ההורים לפני הישיבה, כדי שישתתפו בה באופן פעיל. מונחים מקצועיים, עם הסבר: הצוותים המצליחים לא נמנעו ממונחים מקצועיים, אבל הסבירו אותם באופן מודע ובדקו שהם הובנו. כך הם שידרו \"כבוד ואמון ליכולת של ההורים ללמוד\". ההורים למדו את המושגים ואף השתמשו בהם. חוזק לצד חולשה, ופתיחה בחוזקות: יכולת הצוות להצמיד חוזק לחולשה שכנעה את ההורים שהילד יכול להצליח, והעידה על נכונות למצוא דרכי התערבות. פתיחת הדיון בנקודות החוזק הרגיעה את ההורים ומנעה מהם להיכנס למגננה. מומחיות פירושה היכרות עם הילד: איש מקצוע שמכיר את התלמיד אינו עסוק במסמכים ובתכנון דבריו. לכן הוא פנוי להסתכל בפני ההורים ולבדוק אם הבינו. גם הכנות של הצוות, שלפעמים קשה להורים, מבססת את אמונם. מרחב לרגשות וכבוד מביאים לשותפות: מתן מקום, תוקף ומיקוד לרגשות ההורים, והעצמה מילולית של כל הערה שלהם, העלו את השתתפותם לאורך הישיבה. התעלמות או התגוננות מרחיקות את ההורה. כבוד אינו הימנעות מהקשיים: \"להורים יש את הזכות לשמוע אינפורמציה על הילד שלהם גם אם האינפורמציה אינה חיובית\", בדרך לא שיפוטית. זול וניתן ללמידה: ההתנהגויות האלה אינן דורשות השקעה רבה ומשאבים נוספים, והדרכה של אנשי מקצוע על העקרונות יכולה להוביל לדיאלוג. הממצאים רלוונטיים גם לעבודה עם הורים לילדים ללא צרכים מיוחדים. צוות רב-מקצועי – אנשי המקצוע בבית הספר המיוחד שעובדים עם הילד, ובונים עבורו, לפי החוק, תוכנית לימודים אישית (תל\"א). תל\"א (תוכנית לימודים אישית) – התוכנית שהצוות חייב לבנות לכל ילד בחנ\"מ. בישראל החוק מחייב ליידע את ההורים עליה ולקבל את חתימתם. ישיבות מעברים – שני סוגי מפגשים: מפגשי היכרות של ההורים עם הצוות כשהתלמיד נכנס לבית הספר המיוחד, ומפגשי פרידה בשנה האחרונה שלו בבית הספר. שיפוטיות – תחושת ההורים שאנשי המקצוע מאשימים אותם בקשיי הילד. זה משתנה מרכזי שמוריד את השתתפותם. תשומה רב-מקצועית – נוכחות של אנשי צוות רבים בישיבה. ההורים חוו אותה כביטוי של דאגה, לא כאיום. היבטים גלויים וסמויים – הממצאים מוצגים בדימוי של \"גליל המכיל בתוכו גלילים נוספים\": הגליל החיצוני הוא ההיבטים המבניים (גלויים), השני הוא ההיבטים הארגוניים (גם הם גלויים), ובפנים ההיבטים החברתיים (סמויים, לפי התקציר). מומחיות מקצועית – לפי הגדרת אנשי המקצוע: התייחסות רצינית לישיבה, הגעה מוכנה והיכרות עם התלמיד, עם הערכתו, עם חוזקותיו וחולשותיו ועם מטרות העבודה. המומחיות מאפשרת הקשבה. התמקדות – ניהול ממוקד של הישיבה, שאיפשר לסיים בזמן, מתוך מודעות לכך שהורים רבים מפסידים יום עבודה כדי להגיע. מרחב לרגשות ההורים – מתן מקום, תוקף ומיקוד לרגשות, והתייחסות רצינית להערות ההורים. כבוד – מרכיב שנבנה בעבודה משותפת ובהיכרות ממושכת. הוא מתבטא בהקשבה, באדיבות, בטון נינוח ובתיאור לא מאשים של קשיים, ובצוותים המצליחים הופנה גם בין אנשי הצוות עצמם."},{"id":"benrey2016","title":"פסיכולוגיה חינוכית מסביב לשעון: עבודת הפסיכולוג החינוכי בראי קהילתי","authors":"מ' בן ריי וא' כנפי בליי","year":"2016","cite":"בן ריי, מ' וכנפי בליי, א' (18 בדצמבר 2016). פסיכולוגיה חינוכית מסביב לשעון: עבודת הפסיכולוג החינוכי בראי קהילתי. פסיכולוגיה עברית.","url":"https://www.hebpsy.net/articles.asp?id=3485","kind":"article","desc":"מאמר על עבודת הפסיכולוג החינוכי בעדשה קהילתית.","urlLabel":"המאמר באתר פסיכולוגיה עברית","placements":[["s2","community"]],"extra":false,"ref":"בן ריי וכנפי בליי 2016","inFolder":false,"tldr":"מאמר על עבודת הפסיכולוג החינוכי בעדשה קהילתית.","search":"מאמר על עבודת הפסיכולוג החינוכי בעדשה קהילתית."},{"id":"binyamini1984","title":"הפסיכולוג באוהל ובשדה: מבוא למחנאות מקצועית","authors":"ק' בנימיני","year":"1984","cite":"בנימיני, ק' (1984). הפסיכולוג באוהל ובשדה: מבוא למחנאות מקצועית. פסיכולוגיה וייעוץ בחינוך, שנתון תשמ\"ד, 45-53.","url":null,"kind":"article","desc":"מאמר קלאסי בפסיכולוגיה החינוכית הישראלית, על הפסיכולוג שיוצא מ\"האוהל\" (החדר) אל \"השדה\" (המערכת).","placements":[["s3","general"]],"extra":false,"ref":"בנימיני 1984","inFolder":false,"tldr":"מאמר קלאסי בפסיכולוגיה החינוכית הישראלית, על הפסיכולוג שיוצא מ\"האוהל\" (החדר) אל \"השדה\" (המערכת).","search":"מאמר קלאסי בפסיכולוגיה החינוכית הישראלית, על הפסיכולוג שיוצא מ\"האוהל\" (החדר) אל \"השדה\" (המערכת)."},{"id":"rodded2017","title":"להניע את הקלידוסקופ: ליבת המקצוע והייחוד המקצועי של הפסיכולוגיה החינוכית","authors":"אלונה רודד, נעם יצחקי ומידד כהן","year":"2017","cite":"רודד, א', יצחקי, נ' וכהן, מ' (26 בנובמבר 2017). להניע את הקָלֵידוֹסְקוֹפּ: ליבת המקצוע והייחוד המקצועי של הפסיכולוגיה החינוכית. פסיכולוגיה עברית.","url":"https://www.hebpsy.net/articles.asp?id=3618","kind":"article","desc":null,"urlLabel":"המאמר באתר פסיכולוגיה עברית","file":{"orig":"ליבת המקצוע והייחוד המקצועי של הפסיכולוגיה החינוכית דר אלונה רודד.pdf","ext":"pdf","pdf":"rodded2017.pdf","pages":18,"bytes":550774},"placements":[["s3","general"]],"extra":false,"ref":"רודד ועמיתיו 2017","inFolder":true,"srcTitle":"להניע את הקלידוסקופ: ליבת המקצוע והיחוד המקצועי של הפסיכולוגיה החינוכית","secs":{"abstract":"<p>המאמר מתמודד עם \"משבר הזהות הקיומי והכרוני\" של הפסיכולוגיה החינוכית ועם הקושי של העוסקים בה להסביר מה הם עושים. כדי לתת פשר לריבוי שמאפיין את המקצוע, המחברים מציעים את דימוי הקלידוסקופ. השדה החינוכי הוא \"שדה הראייה\", ואי אפשר להפריד ממנו את הפסיכולוגיה החינוכית. על השדה פועלים חמישה מסננים: אוכלוסיות, פוזיציות מקצועיות, רצף מניעה-התערבות, רמות ניתוח והשקפות תיאורטיות. חלק מהמסננים משותפים גם למקצועות אחרים, אבל ליבת המקצוע וייחודו הם תנועת הסיבוב המשחקית, הגמישה והסקרנית, שמשלבת בין המסננים ובוחרת בכל רגע את הצירוף המתאים. האינטגרציה מתרחשת בשלוש רמות: מעשית (ניהול זמן ועומס), בין-אישית (נאמנויות מרובות, יצירת \"שערי כניסה\", תנועה בין עמדה פנימית לחיצונית, וסינגור על הילד) ותוך-אישית (נשיאת אי-ידיעה ועמימות כמאפיין מהותי של המקצוע ולא כ\"תקלה\"). תיאור מקרה מפורט של תלמיד כיתה ו' שהופנה לאבחון לקראת ועדת השמה מדגים כיצד הזזת המסננים מובילה מאבחון פרטני לטיפול דינמי, לעבודה עם המחנכת, לתוכנית לשיפור האקלים הבית-ספרי ולחשיבה קהילתית. לסיום מוצעת הבחנה בין המקצוע, שרוחב היריעה שלו עצום, לבין הפסיכולוג היחיד, שבוחר בגמישות בתוך ליבה משותפת.<\/p>","ideas":"<ul>\n<li><strong>הקלידוסקופ כדימוי מארגן<\/strong>: הייחוד של המקצוע אינו טמון במסנן מסוים, אלא בתנועת הסיבוב שמשלבת ביניהם ויוצרת בכל רגע דפוס קוהרנטי חדש. התנועה הזו משחקית, גמישה וסקרנית (ויניקוט).<\/li>\n<li><strong>השדה החינוכי הוא הבסיס<\/strong>: כל פעולה פסיכולוגית צריכה להיות מעוגנת בהקשר החינוכי, ולכן חובה להכיר את תרבות מערכת החינוך, את שפתה, את מחזוריה ואת האילוצים וההזדמנויות שבה (בנימיני, 1984).<\/li>\n<li><strong>ליבת המקצוע היא עמדה אינטגרטיבית בשלוש רמות: מעשית, בין-אישית ותוך-אישית.<\/strong> בכל אחת מהן הפסיכולוג משתכלל לאורך ההתפתחות המקצועית.<\/li>\n<li><strong>הלקוחות אינם מגיעים מעצמם<\/strong>: בניגוד למרפאה, הברית בשפ\"ח נשענת במידה רבה על יוזמה פרואקטיבית ו-outreach. הפסיכולוגית צריכה להציג את עצמה שוב ושוב, להגדיר עם הדמויות במסגרת את עצם קיומו של הקשר המקצועי ואת אופיו, ולחפש כל העת \"שערי כניסה\" להתערבות.<\/li>\n<li><strong>\"פסיכולוגית של מי אני?\"<\/strong>: ריבוי הדמויות יוצר ריבוי נאמנויות, אבל הילד הוא תמיד \"לקוח הקצה\". בקונפליקטים (סכסוך משמורת, משפחה מול בית ספר, אנשי מקצוע) הפסיכולוג יכול, ומבחינה אתית אף חייב, לגשר בין הפרספקטיבות ולהשמיע את קולו של הילד.<\/li>\n<li><strong>תנועה בין עמדה פנימית לחיצונית<\/strong>: קרבה (\"אחד שלנו\") מאפשרת להכיר את המערכת מבפנים ולרכוש אמון להתערבויות נועזות ואף לעימותים. עמדה חיצונית מאפשרת \"מבט ממעוף הציפור\" ובניית אמון עם מי שחשים מודרים.<\/li>\n<li><strong>אי-ידיעה היא חלק מהמקצוע, לא תקלה<\/strong>: חוויית העמימות וחוסר האונים אינה נעלמת עם הוותק. האתגר הוא לפתח זהות יציבה בלי לגלוש ל\"תחושת שווא של ידיעת-כל\" שחוסמת סקרנות וצניעות.<\/li>\n<li><strong>החלוקה בין אבחון לטיפול אינה מתאימה למציאות בית הספר<\/strong>: למשל מודל ה-RTI מטשטש את הגבול בין הערכה להתערבות. העבודה היא רצף ספירלי של איסוף מידע, קונסולטציה והתערבות, והפוזיציות נבדלות גם בצורת החשיבה ולא רק בכלים.<\/li>\n<li><strong>תנועה רב-כיוונית בין רמת הפרט לרמת המערכת<\/strong>: מקרים פרטניים מצטברים לדפוס מערכתי, ועבודה מערכתית חושפת מקרים פרטניים. התערבות פרטנית בלי שינוי של התנאים הסביבתיים עלולה להיות לא אפקטיבית.<\/li>\n<li><strong>ריבוי השקפות תיאורטיות<\/strong>: לכל פסיכולוגית צריכה להיות עמדה תיאורטית מגובשת, אבל המקצוע מחייב גם יכולת לנוע בין גישות. במציאות רוויית \"עשייה\" יש ערך לעמדה שמזמינה השהיה ותשומת לב לתהליכים לא-מודעים, ובמקביל יש להכיר לעומק עבודה התנהגותית: \"לא כל טבלת מדבקות 'עושה את העבודה'\".<\/li>\n<li><strong>ההבחנה בין המקצוע לבין הפרט<\/strong> עונה לתחושת \"מרוב עצים לא רואים את היער\": המקצוע פורש יריעה רחבה, והפסיכולוג היחיד מחויב לליבה משותפת של \"פסיכולוג חינוכי טוב דיו\" ובוחר בתוכה בגמישות לפי נטיות ליבו וצורכי המסגרות.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>קלידוסקופ<\/strong>: דימוי מארגן ל\"ריבוי\" שבמקצוע. גליל שבו רסיסים צבעוניים משתקפים במראות, ותנועת המסננים שלו יוצרת דפוסים משתנים. בהערה מצוין שגם מנוחין השתמש בדימוי זה בהקשר המשפחתי.<\/li>\n<li><strong>שדה הראייה / השדה החינוכי<\/strong>: המצע הבסיסי שעליו פועלים המסננים, שאי אפשר להפריד ממנו את הפסיכולוגיה החינוכית.<\/li>\n<li><strong>אינטגרציה מעשית<\/strong>: תכנון, ארגון וגמישות מול עומס, ריבוי מסגרות ושינויים בלתי צפויים (\"ה'קליניקה' הולכת איתם\").<\/li>\n<li><strong>אינטגרציה בין-אישית<\/strong>: בניית קשרים מבוססי אמון עם דמויות רבות, ניהול נאמנויות מרובות, יצירת ברית ראשונית, התמקמות על הציר שבין פנימי לחיצוני, וסינגור על הילד.<\/li>\n<li><strong>אינטגרציה תוך-אישית<\/strong>: שילוב קוגניטיבי ורגשי של רבדים גלויים וסמויים, של העברה והעברה נגדית ושל המשגות מגוונות, יחד עם נשיאת עמימות ושמירה על עמדה סקרנית ולא דוגמטית.<\/li>\n<li><strong>שערי כניסה<\/strong>: (בהשראת שטרן, 1995) הזדמנויות להתערבות במסגרת החינוכית, שהפסיכולוג תר אחריהן כל העת.<\/li>\n<li><strong>לקוח הקצה<\/strong>: הילד, שהוא תמיד הלקוח הסופי של הפסיכולוג החינוכי (גנץ, 2016).<\/li>\n<li><strong>פוזיציות מקצועיות<\/strong>: עמדות עבודה שנבדלות זו מזו בכלים ובעיקר בצורת החשיבה ובהתמקמות. ביניהן: דיאגנוסטית, פסיכו-חינוכית, טיפולית, ייעוצית-ארגונית, הדרכתית, מתכללת (ניהול תיקים), חוקרת וקונסולטטיבית.<\/li>\n<li><strong>RTI (תגובה להתערבות)<\/strong>: מודל חלופי לאבחון מסורתי של לקויות למידה, שמדגים את הרצף בין הערכה להתערבות.<\/li>\n<li><strong>ראייה סלוטוגנית<\/strong>: זיהוי ומינוף של כוחות וחוסן בפרטים, בקבוצות ובמערכות, לצד מניעה וטיפול.<\/li>\n<li><strong>פירמידת המניעה<\/strong>: מניעה ראשונית, שניונית ושלישונית, ובקצה שלה התערבות בחירום.<\/li>\n<li><strong>רמות ניתוח / ראייה אקולוגית<\/strong>: מהפרט, דרך המשפחה, הכיתה, בית הספר והשכונה, ועד הקהילה, הרמה הסוציו-אקונומית, התרבותית והמדינית (Bronfenbrenner). ההשפעות פועלות \"מהחוץ פנימה\" וגם \"מהפנים החוצה\".<\/li>\n<\/ul>","models":"<p><strong>מודל הקלידוסקופ: מבנה כללי<\/strong><\/p>\n<ul>\n<li><em>שדה הראייה<\/em>: השדה החינוכי<\/li>\n<li><em>ליבת המקצוע<\/em>: פעולת האינטגרציה, כלומר הנעה מתוזמרת של המסננים, בשלוש רמות:<ol>\n<li><strong>אינטגרציה מעשית<\/strong>: ניהול זמן ועומס (מפתח תקינה מיושן ואחוז כיסוי בפועל של 68%, \"השמיכה קצרה מדי\"), תכנון יחד עם גמישות (למשל תצפית מתוכננת כשהתלמיד נעדר), ושיקולים \"פרוזאיים\" כמו נסיעה, פקקים וחניה.<\/li>\n<li><strong>אינטגרציה בין-אישית<\/strong>: ריבוי נאמנויות (\"פסיכולוגית של מי אני?\"), יצירת ברית בתנאים של היעדר פנייה עצמית (outreach והצגה עצמית חוזרת), שערי כניסה, הציר פנימי-חיצוני (גרינולד, 2012), וסינגור על הילד כ\"לקוח הקצה\".<\/li>\n<li><strong>אינטגרציה תוך-אישית<\/strong>: רבדים גלויים וסמויים, העברה והעברה נגדית, שילוב ידע אמפירי, תיאורטי והתרשמותי, ונשיאת אי-ידיעה (ביון: \"בכל חדר טיפולים מן הראוי שיהיו שני אנשים מפוחדים\").<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<p><strong>חמשת המסננים:<\/strong><\/p>\n<ol>\n<li><strong>אוכלוסיות<\/strong>\n        - <em>טווח<\/em>: מפעוטות ועד גיל 21. בעבודה עם הורים וצוות הפסיכולוגית עדה גם לבגרות המוקדמת והתיכונה ואף לזקנה. מגוון אתני, דתי וסוציו-אקונומי.\n        - <em>רצף תפקוד<\/em>: מהנורמטיבי בכל תחומי ההתפתחות (קוגניטיבי, רגשי, חברתי, שפתי, מוטורי), דרך גורמי סיכון תת-קליניים, ועד מצבים פתולוגיים. בכלל זה מענה לתהליכים רגשיים במצבים התפתחותיים (התנפצות הפנטזיה, שלבי עיבוד אבל, פגיעה נרקיסיסטית).\n        - <em>התמקצעות בתת-אוכלוסיות<\/em>: קבוצות גיל, קהילות מהגרים, מחוננים, אוטיזם, הפרעות מצב רוח, אובדנות, שונות מגדרית ונטייה מינית, ומשפחות במבנה לא מסורתי.\n        - <em>היבט שני, \"מיהו הלקוח\"<\/em>: תלמידים, הורים, מחנכות, מורים מקצועיים, יועצות, רכזי שילוב, מנהלות, סייעות משלבות, אנשי מקצועות פארא-רפואיים, קב\"סיות, עובדים סוציאליים, רופאים, תרפיסטים ופסיכולוגיות במרפאות. הקשר יכול להיות קולגיאלי (התייעצות הדדית על לקוח משותף) או קשר של מתן שירות (הדרכה, ייעוץ, אבחון או טיפול). דוגמאות מהספרות: הסמכות החדשה (עומר, 2008), עבודה קבוצתית עם תלמידים למניעה וטיפול בדחייה חברתית (אברהם, 2011), ועבודה עם גננות בגישת התקשרות (אליצור, 2015).<\/li>\n<li><strong>פוזיציות מקצועיות<\/strong>\n        - רצף ספירלי: איסוף מידע, קונסולטציה, התערבות עקיפה או ישירה, וחוזר חלילה.\n        - רשימת הפוזיציות: דיאגנוסטית, פסיכו-חינוכית, טיפולית, ייעוצית-ארגונית, הדרכתית, מתכללת (ניהול תיקים), חוקרת וקונסולטציה.\n        - <em>דוגמה, פגישה עם מנהלת<\/em>: בעמדה טיפולית (גם אם המפגש לא מוגדר כטיפול) הפסיכולוגית מאפשרת ונטילציה, משמשת \"זולתעצמי\" ומאירה דפוסי חשיבה ואישיות. בעמדה ייעוצית-ארגונית היא מתבוננת בתהליכים ובמבני העבודה. בעמדה קונסולטטיבית היא מציעה פסיכו-חינוך לגבי תלמיד או חושבת עם המנהלת על יחסיה עם הורה או מורה. לעיתים מחליפים כמה פוזיציות באותה פגישה.\n        - <em>דוגמה, שאלה לתלמיד<\/em>: השאלה \"איך עבר עליך השבוע בבית?\" עלולה ליצור התנגשות בין הפוזיציה הטיפולית (צרכיו הרגשיים של הילד) לבין ציפיות המערכת לשינוי מהיר או לתשובה ל\"למה הוא מתנהג כך?\".<\/li>\n<li><strong>רצף מניעה-התערבות<\/strong>\n        - <em>היבט סלוטוגני<\/em>: קידום רווחה, לא רק שיקום וטיפול.\n        - <em>פעולות לקידום בריאות נפשית<\/em>: הרצאות להורים, דפי מידע, הדרכות, קונסולטציה, פסיכו-חינוך, וזיהוי ומינוף של כוחות וחוסן.\n        - <em>פירמידת מניעה<\/em>: ראשונית, שניונית ושלישונית, עם חשיבה התפתחותית על ציר הזמן (Coie et al., 1993; זכי, 2013; פרידמן, 2009).\n        - <em>התערבות בחירום: שלושת יתרונות הפסיכולוג החינוכי (קלינגמן, 2000)<\/em>:\n            1. היא נציגת עולם בריאות הנפש במערכת החינוך, הדמות המוכרת והנגישה ביותר בזמן משבר, כשכוחות המשפחות והצוות מדולדלים.\n            2. ההיכרות המוקדמת עם \"הנפשות הפועלות\" ויחסי האמון מאפשרים התערבות ראשונית מדויקת יותר מזו של גורם חיצוני.\n            3. המשך הליווי אחרי המשבר המיידי מאפשר מעקב, איתור תגובות דחק מאוחרות, מענה למעגלי פגיעות רחבים, חזרה לשגרה ותכנון התערבויות מונעות.\n            - בנוסף, תפיסת הרצף בין נורמטיבי לפתולוגי עשויה להפחית את הסטיגמה והחשש מפנייה לעזרה בעת משבר.<\/li>\n<li><strong>רמות ניתוח<\/strong>\n        - הרובד הפרטני והרובד הקבוצתי-ארגוני-קהילתי. האקולוגיה כוללת משפחה, בית ספר, שכונה, קהילה, רמה סוציו-אקונומית, תרבות ומדינה (Bronfenbrenner, 1989).\n        - קידום שיתופי פעולה וממשקים רב-מקצועיים.\n        - השפעות \"מהחוץ פנימה\" ו\"מהפנים החוצה\" (התלמיד בוחר סביבות, מזמן ומפרש תגובות).\n        - <em>דוגמאות<\/em>: הבנת בעיית התנהגות בלי לראות את התנהלות ההורים התוקפנית תניב הבנה חסרה. הישג טיפולי עם תלמיד דחוי בלי עבודה משלימה בכיתה לא יהיה אפקטיבי. מקרים פרטניים מצטברים מאפשרים לזהות דפוס מערכתי (אלימות, תרבות הישגית, קושי עם שונות), ואז אפשר להתערב ברמת כיתה, שכבה, מדיניות, תוכנית לימודים והכשרת צוות. בכיוון ההפוך, מפגש מורים על חינוך למיניות בריאה חושף חשש לפגיעה מינית בתלמידה.\n        - בנוסף: זיהוי תהליכים מקבילים, הבנת הקשר אדם-תפקיד, החזקה של ריבוי נקודות המבט של בעלי העניין, ושימור המשכיות לנוכח חילופי צוות.<\/li>\n<li><strong>השקפות תיאורטיות<\/strong>\n        - עמדה תיאורטית מגובשת לכל פסיכולוגית, לצד יכולת לראות גישות שונות כמשלימות ולנוע ביניהן (דור-חיים, 2017). העבודה צריכה להיות מעוגנת בחשיבה קנונית ובחידושים אמפיריים עכשוויים.\n        - <em>גישות דינמיות<\/em>: השהיה ותשומת לב לתהליכים לא-מודעים במציאות רוויית עשייה. גנץ (2016) מגדיר פסיכותרפיה במרחב הפסיכולוגי-חינוכי כ\"מתחם דיאלקטי גבוה\" בין המציאות החיצונית לעולם הפנימי.\n        - <em>גישות התנהגותיות<\/em>: הכרת תהליכי למידה וחשיבות המשוב. עבודה התנהגותית כנדבך אחד בהתערבות אינטגרטיבית יכולה לחשוף צדדים אחרים של התלמיד ולסלול דרך לעבודת עומק.<\/li>\n<\/ol>\n<p><strong>דוגמה לכוונון הקלידוסקופ (מתוך הסיכום)<\/strong>: הדמויות, הפוזיציה (למשל דיאגנוסטית), רמת ההתערבות ברצף המניעה (למשל התערבות מיידית בחירום), רמת הניתוח (למשל אקלים הכיתה) וההשקפה התיאורטית (למשל פסיכולוגיית העצמי של קוהוט).<\/p>\n<p><strong>תיאור המקרה \"הקלידוסקופ בתנועה\" (שלבים):<\/strong><\/p>\n<ol>\n<li><em>הפניה<\/em>: בית ספר יסודי מפנה תלמיד בן 12 בכיתה ו' לאבחון בשפ\"ח לקראת ועדת השמה ומעבר לחינוך מיוחד בחטיבת הביניים, בגלל פער של כשנתיים בקריאה ובכתיבה.<\/li>\n<li><em>אבחון<\/em>: תפקוד קוגניטיבי ממוצע וללא סימני לקות למידה. מהמבחנים ההשלכתיים, מההתרשמות הקלינית ומהרקע ההתפתחותי עלו בדידות ועצב בקשר לאובדן מוקדם, וחשדנות וניכור ביחסים. ההשערה הייתה שאלה פוגעים בקשר עם המורים ובפניות ללמידה, ולכן הוא הופנה לטיפול.<\/li>\n<li><em>טיפול פרטני<\/em>: טיפול דינמי שמעוגן בתיאוריית ההתקשרות (בולבי). מודל עבודה פנימי שעוצב מחוסר עקביות בטיפול המוקדם הוביל לקושי לתת אמון. הפסיכולוגית נקטה עמדה עקבית, קשובה ומכווננת, ונגעה בהדרגה בכאב המוקדם. במקביל ניתנה הדרכת הורים: הבנת תגובות הבן על רקע האובדן, ודרכים תואמות גיל לביסוס ביטחון, כשההורים עדיין \"בסיס בטוח\" ו\"חוף מבטחים\".<\/li>\n<li><em>מעבר לרמה המערכתית<\/em>: בצוות אח\"מ (אקלים חינוכי מיטבי) נדונו תוצאות מיצ\"ב אקלים שליליות מאוד, בעיקר בשאלון הצרכים (שייכות, כבוד וערך עצמי, מסוגלות, אוטונומיה, מימוש עצמי וביטוי אותנטי). הפסיכולוג בחן מחדש את ההפניה בעדשה מערכתית. בתצפיות ובראיונות התברר שהמחנכות חשות חוסר גיבוי, קרבה ואכפתיות מהנהלה, מה שמחליש את יכולתן להתמודד עם תלמידים שזקוקים להוראה דיפרנציאלית.<\/li>\n<li><em>התנגדות המנהלת<\/em>: המנהלת דחתה את יוזמת ההתערבות המערכתית (אין זמן, הישיבות מוקדשות לתקשוב, והבעיה היא \"פינוק\" של המורות). הפסיכולוג, מתוך הבנה שתהליכי עומק צריכים זמן להבשיל, הציע להמשיך לדון בנושא בצוות אח\"מ ולבנות תוכנית לשנה הבאה.<\/li>\n<li><em>קונסולטציה עם המחנכת<\/em>: המחנכת בלטה במספר ההפניות שלה לחינוך מיוחד. התברר שהיא עצמה הוגדרה בילדותה כתלמידה מתקשה ולמדה בכיתת חינוך מיוחד, שממנה נשארו לה זיכרונות חמים. היא ראתה בהפניה דרך \"להציל\" את התלמידים. בעבודה המשותפת זיהתה את הרכיבים שהפכו את החוויה לחיובית ויישמה חלק מהם בכיתה.<\/li>\n<li><em>צוות האקלים<\/em>: פעילות הפסקה שבועית ושיחות אישיות קבועות של המחנכות עם התלמידים. הצוות נתקל בקושי לגייס מתנדבים ובהתנגדות של המחנכות.<\/li>\n<li><em>שיחת סיכום שנה עם המנהלת<\/em>: המנהלת, שצמחה מתוך צוות המורות, הודתה שהרגישה צורך לבסס עמדה סמכותית ואף כוחנית מול חברותיה לשעבר. התובנה פתחה פתח לתוכנית כוללת לשיפור האקלים ולביסוס \"סמכות מקצועית מגדלת\" במקום כוחנית.<\/li>\n<li><em>תוכנית מבוססת תיאוריית ההכוונה העצמית<\/em> (Assor, Kaplan, Feinberg &amp; Tal, 2009; פיינברג ואחרים, 2008): בשנה הראשונה למידה של ההנהלה ליצירת אקלים ארגוני תומך לצוות, ופגישות שבועיות של הפסיכולוג עם המנהלת על האופן שבו התנהלותה תומכת בצורכי המורים או מתסכלת אותם. בהמשך עבודה משותפת של הפסיכולוג והיועצת עם המורים בקבוצות קטנות, ללמידת התיאוריה ולהתנסות.<\/li>\n<li><em>הרחבה לקהילה<\/em>: השאלה \"מדוע דווקא הוא ועוד שניים מכיתתו?\" הובילה לממצא ששלושתם דור ראשון בארץ, שהוריהם כמעט אינם דוברים עברית. הזזת מסנן האוכלוסיות חושפת קהילת מהגרים אתנית-תרבותית, ומכאן כיוון לפעילויות משותפות של בית הספר עם הקהילה, שמכבדות את תרבותה ומקדמות שילוב שפתי ותרבותי (בן ריי וכנפי בליי, 2016; עיני, 2017). המחברים מציינים שמרחב זה עדיין אינו חלק משגרת רוב הפסיכולוגים, בעיקר בגלל מגבלת המשאבים.<\/li>\n<li><em>מסקנה<\/em>: עבור התלמיד עצמו ההתערבויות האלה לא ייתרו את הצורך בהתערבות חינוכית שלישונית בקריאה ובכתיבה. אבל עבור הצוות, הקהילה ותלמידים עתידיים עם פרופיל דומה, ועבור הפסיכולוג עצמו, זו נקודת תפנית. עדשה של אבחון פסיכודידקטי פרטני בלבד לא הייתה חושפת את הרבדים האלה.<\/li>\n<\/ol>\n<p><strong>נתוני תקינה (הערות שוליים במאמר):<\/strong><\/p>\n<ul>\n<li>תקן אחד ל-300 תלמידים בחינוך המיוחד<\/li>\n<li>תקן אחד ל-500 ילדים בגיל הגן ובכיתות א' (גילים 3 עד 6)<\/li>\n<li>תקן אחד ל-1,000 תלמידים בכיתות ב' עד י\"ב<\/li>\n<li>מפתח התקינה פורסם לראשונה ב-2003 ונשען על הערכת צרכים לא עדכנית. \"אחוז הכיסוי\" (רמת האיוש ביחס לתקן שקבע שפ\"י) עומד בפועל על 68%, לפי דברי מנהלת אגף פסיכולוגיה בדיונים ציבוריים.<\/li>\n<\/ul>\n<p><strong>למי מיועד המודל (לפי המחברים):<\/strong> למתעניינים בתחום הוא מציג את מגוון האפשרויות. לסטודנט ולמתמחה הוא מאפשר לשאת את העמימות והמורכבות. לפסיכולוג המנוסה הוא מאתגר דפוסי עבודה שגורים.<\/p>","practice":"<ul>\n<li>בכל הפניה כדאי לעבור במכוון על חמשת המסננים: מי האוכלוסייה ומי הלקוח, באיזו פוזיציה אני נמצא/ת ובאיזו כדאי להיות, היכן המקרה על רצף המניעה-התערבות, באיזו רמת ניתוח כדאי להתבונן (ילד, כיתה, צוות, הנהלה, קהילה), ואיזו השקפה תיאורטית מכוונת אותי.<\/li>\n<li>בכניסה למסגרת חדשה, אין לצפות שיפנו אלייך. יש להציג את עצמך שוב ושוב לדמויות השונות, להסביר מה השירות מציע, לבנות יחד את מבני העבודה, ולחפש \"שערי כניסה\", למשל מפגשי צוות, דיוני מיצ\"ב ושיחות מסדרון.<\/li>\n<li>כשהפניה מגיעה כבקשה לאבחון לקראת ועדה, כדאי לשאול גם שאלות מערכתיות: מדוע דווקא הילד הזה, האם יש מחנכת שמפנה הרבה, ומה מצב האקלים והגיבוי לצוות.<\/li>\n<li>בפגישה עם מנהלת, כדאי לשים לב באיזו פוזיציה את/ה נמצא/ת (טיפולית, ייעוצית-ארגונית או קונסולטטיבית) ולעבור ביניהן במודע, לפעמים כמה פעמים באותה פגישה.<\/li>\n<li>כשנתקלים בהתנגדות של ההנהלה, כדאי לא לוותר ולא להתעמת. אפשר לתת לתהליך זמן להבשיל, להמשיך לדון בפורומים קיימים (כמו צוות אח\"מ) ולעבוד במקביל עם מי שזמין, למשל המחנכת.<\/li>\n<li>בקונפליקטים בין הורים, צוות או אנשי מקצוע, יש לזכור שהילד הוא \"לקוח הקצה\", ולוודא שנקודת המבט שלו נשמעת בבירור.<\/li>\n<li>כדאי להכיר עקרונות התנהגותיים (למידה, משוב) כדי שתוכניות התנהגותיות, כמו טבלאות מדבקות, יבנו ויוטמעו נכון, ולשלב אותן כנדבך אחד בהתערבות רחבה יותר.<\/li>\n<li>חוויית אי-ידיעה וחוסר אונים אינה סימן לכישלון. כדאי להביא אותה להדרכה ולהיזהר משני הקצוות: שיתוק מחד, ו\"ידיעת-כל\" מאידך.<\/li>\n<\/ul>","questions":"<ol>\n<li>באילו מסננים אני נוטה \"להיתקע\" (למשל פוזיציה דיאגנוסטית או רמה פרטנית), ומה יכול לעזור לי \"לסובב\" את הקלידוסקופ במקרה שאני עובד/ת עליו עכשיו?<\/li>\n<li>\"פסיכולוג/ית של מי אני?\" במסגרת שלי: מול אילו דמויות אני חש/ה נאמנויות סותרות, ואיך אני שומר/ת על קולו של הילד כ\"לקוח הקצה\"?<\/li>\n<li>איפה אני ממוקם/ת כרגע על הציר שבין דמות פנימית לדמות חיצונית במסגרת? מה הרווחים והמחירים של המיקום הזה?<\/li>\n<li>איך אני חווה את אי-הידיעה והעמימות בעבודה? מה עוזר לי לשאת אותן בלי לקפוץ למסקנות נחרצות?<\/li>\n<li>בתיאור המקרה, הפסיכולוג בחר לחכות להבשלת תהליך מול המנהלת. מתי נכון לחכות ומתי לדחוף, ואיך אני מזהה את ההבדל במסגרת שלי?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"לא אחת שואלת את עצמה הפסיכולוגית החינוכית \"פסיכולוגית של מי אני?\"\"<\/li>\n<li>\"פסיכולוגיות חינוכיות מנוסות יודעות היטב שלא כל טבלת מדבקות \"עושה את העבודה\" ומקדמת שינוי שהוא משמעותי וארוך-טווח.\"<\/li>\n<li>\"ניתן לומר שחוויית אי-הידיעה איננה \"תקלה\", אלא מהותי של הפסיכולוגיה החינוכית.\"<\/li>\n<li>\"עושה רושם כי הקושי להגדיר את התפקיד עד הסוף הוא חלק מה-DNA של המקצוע\"<\/li>\n<\/ul>"},"level":"שנה א' (כמסגרת מארגנת), וגם שנים ב'-ג' (לעבודה עם תיאור המקרה ולתנועה בין פוזיציות)","stype":"מאמר (עיוני, עם מודל מושגי ותיאור מקרה מורחב)","tldr":"המאמר מתמודד עם \"משבר הזהות הקיומי והכרוני\" של הפסיכולוגיה החינוכית ועם הקושי של העוסקים בה להסביר מה הם עושים. כדי לתת פשר לריבוי שמאפיין את המקצוע, המחברים מציעים את דימוי הקלידוסקופ. השדה החינוכי הוא \"שדה הראייה\", ואי אפשר להפריד ממנו את…","search":"המאמר מתמודד עם \"משבר הזהות הקיומי והכרוני\" של הפסיכולוגיה החינוכית ועם הקושי של העוסקים בה להסביר מה הם עושים. כדי לתת פשר לריבוי שמאפיין את המקצוע, המחברים מציעים את דימוי הקלידוסקופ. השדה החינוכי הוא \"שדה הראייה\", ואי אפשר להפריד ממנו את הפסיכולוגיה החינוכית. על השדה פועלים חמישה מסננים: אוכלוסיות, פוזיציות מקצועיות, רצף מניעה-התערבות, רמות ניתוח והשקפות תיאורטיות. חלק מהמסננים משותפים גם למקצועות אחרים, אבל ליבת המקצוע וייחודו הם תנועת הסיבוב המשחקית, הגמישה והסקרנית, שמשלבת בין המסננים ובוחרת בכל רגע את הצירוף המתאים. האינטגרציה מתרחשת בשלוש רמות: מעשית (ניהול זמן ועומס), בין-אישית (נאמנויות מרובות, יצירת \"שערי כניסה\", תנועה בין עמדה פנימית לחיצונית, וסינגור על הילד) ותוך-אישית (נשיאת אי-ידיעה ועמימות כמאפיין מהותי של המקצוע ולא כ\"תקלה\"). תיאור מקרה מפורט של תלמיד כיתה ו' שהופנה לאבחון לקראת ועדת השמה מדגים כיצד הזזת המסננים מובילה מאבחון פרטני לטיפול דינמי, לעבודה עם המחנכת, לתוכנית לשיפור האקלים הבית-ספרי ולחשיבה קהילתית. לסיום מוצעת הבחנה בין המקצוע, שרוחב היריעה שלו עצום, לבין הפסיכולוג היחיד, שבוחר בגמישות בתוך ליבה משותפת. הקלידוסקופ כדימוי מארגן: הייחוד של המקצוע אינו טמון במסנן מסוים, אלא בתנועת הסיבוב שמשלבת ביניהם ויוצרת בכל רגע דפוס קוהרנטי חדש. התנועה הזו משחקית, גמישה וסקרנית (ויניקוט). השדה החינוכי הוא הבסיס: כל פעולה פסיכולוגית צריכה להיות מעוגנת בהקשר החינוכי, ולכן חובה להכיר את תרבות מערכת החינוך, את שפתה, את מחזוריה ואת האילוצים וההזדמנויות שבה (בנימיני, 1984). ליבת המקצוע היא עמדה אינטגרטיבית בשלוש רמות: מעשית, בין-אישית ותוך-אישית. בכל אחת מהן הפסיכולוג משתכלל לאורך ההתפתחות המקצועית. הלקוחות אינם מגיעים מעצמם: בניגוד למרפאה, הברית בשפ\"ח נשענת במידה רבה על יוזמה פרואקטיבית ו-outreach. הפסיכולוגית צריכה להציג את עצמה שוב ושוב, להגדיר עם הדמויות במסגרת את עצם קיומו של הקשר המקצועי ואת אופיו, ולחפש כל העת \"שערי כניסה\" להתערבות. \"פסיכולוגית של מי אני?\": ריבוי הדמויות יוצר ריבוי נאמנויות, אבל הילד הוא תמיד \"לקוח הקצה\". בקונפליקטים (סכסוך משמורת, משפחה מול בית ספר, אנשי מקצוע) הפסיכולוג יכול, ומבחינה אתית אף חייב, לגשר בין הפרספקטיבות ולהשמיע את קולו של הילד. תנועה בין עמדה פנימית לחיצונית: קרבה (\"אחד שלנו\") מאפשרת להכיר את המערכת מבפנים ולרכוש אמון להתערבויות נועזות ואף לעימותים. עמדה חיצונית מאפשרת \"מבט ממעוף הציפור\" ובניית אמון עם מי שחשים מודרים. אי-ידיעה היא חלק מהמקצוע, לא תקלה: חוויית העמימות וחוסר האונים אינה נעלמת עם הוותק. האתגר הוא לפתח זהות יציבה בלי לגלוש ל\"תחושת שווא של ידיעת-כל\" שחוסמת סקרנות וצניעות. החלוקה בין אבחון לטיפול אינה מתאימה למציאות בית הספר: למשל מודל ה-RTI מטשטש את הגבול בין הערכה להתערבות. העבודה היא רצף ספירלי של איסוף מידע, קונסולטציה והתערבות, והפוזיציות נבדלות גם בצורת החשיבה ולא רק בכלים. תנועה רב-כיוונית בין רמת הפרט לרמת המערכת: מקרים פרטניים מצטברים לדפוס מערכתי, ועבודה מערכתית חושפת מקרים פרטניים. התערבות פרטנית בלי שינוי של התנאים הסביבתיים עלולה להיות לא אפקטיבית. ריבוי השקפות תיאורטיות: לכל פסיכולוגית צריכה להיות עמדה תיאורטית מגובשת, אבל המקצוע מחייב גם יכולת לנוע בין גישות. במציאות רוויית \"עשייה\" יש ערך לעמדה שמזמינה השהיה ותשומת לב לתהליכים לא-מודעים, ובמקביל יש להכיר לעומק עבודה התנהגותית: \"לא כל טבלת מדבקות 'עושה את העבודה'\". ההבחנה בין המקצוע לבין הפרט עונה לתחושת \"מרוב עצים לא רואים את היער\": המקצוע פורש יריעה רחבה, והפסיכולוג היחיד מחויב לליבה משותפת של \"פסיכולוג חינוכי טוב דיו\" ובוחר בתוכה בגמישות לפי נטיות ליבו וצורכי המסגרות. קלידוסקופ: דימוי מארגן ל\"ריבוי\" שבמקצוע. גליל שבו רסיסים צבעוניים משתקפים במראות, ותנועת המסננים שלו יוצרת דפוסים משתנים. בהערה מצוין שגם מנוחין השתמש בדימוי זה בהקשר המשפחתי. שדה הראייה / השדה החינוכי: המצע הבסיסי שעליו פועלים המסננים, שאי אפשר להפריד ממנו את הפסיכולוגיה החינוכית. אינטגרציה מעשית: תכנון, ארגון וגמישות מול עומס, ריבוי מסגרות ושינויים בלתי צפויים (\"ה'קליניקה' הולכת איתם\"). אינטגרציה בין-אישית: בניית קשרים מבוססי אמון עם דמויות רבות, ניהול נאמנויות מרובות, יצירת ברית ראשונית, התמקמות על הציר שבין פנימי לחיצוני, וסינגור על הילד. אינטגרציה תוך-אישית: שילוב קוגניטיבי ורגשי של רבדים גלויים וסמויים, של העברה והעברה נגדית ושל המשגות מגוונות, יחד עם נשיאת עמימות ושמירה על עמדה סקרנית ולא דוגמטית. שערי כניסה: (בהשראת שטרן, 1995) הזדמנויות להתערבות במסגרת החינוכית, שהפסיכולוג תר אחריהן כל העת. לקוח הקצה: הילד, שהוא תמיד הלקוח הסופי של הפסיכולוג החינוכי (גנץ, 2016). פוזיציות מקצועיות: עמדות עבודה שנבדלות זו מזו בכלים ובעיקר בצורת החשיבה ובהתמקמות. ביניהן: דיאגנוסטית, פסיכו-חינוכית, טיפולית, ייעוצית-ארגונית, הדרכתית, מתכללת (ניהול תיקים), חוקרת וקונסולטטיבית. RTI (תגובה להתערבות): מודל חלופי לאבחון מסורתי של לקויות למידה, שמדגים את הרצף בין הערכה להתערבות. ראייה סלוטוגנית: זיהוי ומינוף של כוחות וחוסן בפרטים, בקבוצות ובמערכות, לצד מניעה וטיפול. פירמידת המניעה: מניעה ראשונית, שניונית ושלישונית, ובקצה שלה התערבות בחירום. רמות ניתוח / ראייה אקולוגית: מהפרט, דרך המשפחה, הכיתה, בית הספר והשכונה, ועד הקהילה, הרמה הסוציו-אקונומית, התרבותית והמדינית (Bronfenbrenner). ההשפעות פועלות \"מהחוץ פנימה\" וגם \"מהפנים החוצה\"."},{"id":"kachergin2012","title":"מה זו בעצם לקות למידה?","authors":"ע' קצ'רגין","year":"2012","cite":"קצ'רגין, ע' (2012). מה זו בעצם לקות למידה? דיון על הגדרה ומשמעויותיה. דברים 5, 67-82.","url":null,"kind":"article","desc":"דיון בהגדרה של לקות למידה ובמשמעויות שלה לעבודה האבחונית.","placements":[["s3","diag"]],"extra":false,"ref":"קצ'רגין 2012","inFolder":false,"tldr":"דיון בהגדרה של לקות למידה ובמשמעויות שלה לעבודה האבחונית.","search":"דיון בהגדרה של לקות למידה ובמשמעויות שלה לעבודה האבחונית."},{"id":"yablon2019","title":"\"אם לא תדע לאן אתה רוצה להגיע, איך תדע שהגעת לשם?\"","authors":"י' יבלון","year":"2019","cite":"יבלון, י' (27 בפברואר 2019). \"אם לא תדע לאן אתה רוצה להגיע, איך תדע שהגעת לשם?\": המוקד הטיפולי הדינאמי כבסיס ל\"מפת דרכים\" בטיפול. פסיכולוגיה עברית.","url":"https://www.hebpsy.net/articles.asp?id=3777","kind":"article","desc":"מאמר על ניסוח מוקד טיפולי דינמי כבסיס ל\"מפת דרכים\" בטיפול. משתלב היטב עם משולש הפורמולציה של בהט.","urlLabel":"המאמר באתר פסיכולוגיה עברית","placements":[["s3","therapy"]],"extra":false,"ref":"יבלון 2019","inFolder":false,"tldr":"מאמר על ניסוח מוקד טיפולי דינמי כבסיס ל\"מפת דרכים\" בטיפול. משתלב היטב עם משולש הפורמולציה של בהט.","search":"מאמר על ניסוח מוקד טיפולי דינמי כבסיס ל\"מפת דרכים\" בטיפול. משתלב היטב עם משולש הפורמולציה של בהט."},{"id":"bion","title":"היכרות עם וילפרד ביון","authors":"לא צוין (חומר לימוד)","year":"","cite":"היכרות עם וילפרד ביון (חומר לימוד).","url":null,"kind":"theory","desc":null,"file":{"orig":"היכרות עם וילפרד ביון.doc","ext":"doc","pdf":"bion.pdf","pages":8,"bytes":75300},"placements":[["s3","therapy"]],"extra":false,"ref":"היכרות עם ביון","inFolder":true,"srcTitle":"היכרות עם וילפרד ביון","secs":{"abstract":"<p>הטקסט הוא היכרות ראשונית עם חשיבתו של וילפרד ביון. הוא נפתח ברקע ביוגרפי: ביון נולד ב-1897 בהודו להורים אנגלים מהמעמד הגבוה אך חסרי אמצעים, שירת במלחמת העולם הראשונה, חי בשנותיו המאוחרות בקליפורניה ונפטר ב-1979. אחר כך הוא ממקם את ביון מול פרויד וקליין. נקודת המוצא של ביון היא הפנומנולוגיה של הפגישה האנליטית, והנחות היסוד שלו הן התגלות האמת וצמיחה מנטלית. הסימפטום הוא \"סיפור כיסוי\", החיפוש אחר סיבתיות קשור לתחושת נרדפות, והשינוי הוא ההחלטה להתמודד עם הכאב במקום להתחמק ממנו. הטקסט מציג את המושגים המרכזיים: שש החוליות הרגשיות (L, H, K והשלילות שלהן) עם דוגמה קלינית של ילד, מיכל-מוכל, פונקציית אלפא ומרכיבי ביתא (שנולדו מהעבודה עם פסיכוטיים), המציאות הנפשית ומגבלות השפה, טרנספורמציות ומושג ה-O. הוא מסתיים בעיקרון \"ללא זיכרון וללא תשוקה\" וב\"אבולוציה\" בפגישה. בסך הכול זהו טקסט מבואי ומושגי, שנותן אוצר מילים בסיסי להבנת ביון בקליניקה.<\/p>","ideas":"<ul>\n<li>ביון אינו מציע תיאוריה פסיכואנליטית שיטתית, אלא \"סינתזה תיאורית של החוויה\" של הפגישה האנליטית: האווירה הרגשית, מחשבות המטפל ומצבו. לשם כך הוא נעזר בתיאוריות פסיכואנליטיות, פילוסופיות ומתמטיות.<\/li>\n<li>שתי הנחות יסוד: התגלות האמת וצמיחה מנטלית. \"הנפש צומחת בזכות החשיפה לאמת\", וביון חוקר איך האמת מתפתחת ואיך היא נחסמת.<\/li>\n<li>הסימפטום הוא \"סיפור כיסוי\". האמת הפנימית (\"אני לא מסוגל לאהוב\") היא הסיבה האמיתית לפנייה. החיפוש אחר סיבתיות (\"כל הצרות שלי בגלל ש...\") משקף קונסטלציה פרנואידית ובריחה מדיכאון פנימי. המטרה אינה לספק סיבה שמסירה אחריות, אלא לפתח קונסטלציה רגשית אחרת.<\/li>\n<li>השינוי הוא המעבר מהתחמקות מכאב להתמודדות איתו, בניגוד לעקרון העונג. ביון מאמין ביכולתו של האדם לשאת כאב וסבל כדרך לצמיחה ולא כפתולוגיה. המטפל רואה את המעבר הזה, אבל לא את הסיבה לו.<\/li>\n<li>במקום \"מודע ולא מודע\", ביון מדבר על \"סופי\" ו\"אינסופי\". מטופל שמתייחס לכל דבר כ\"סופי\", כלומר כעצה ליישום מיידי, \"חונק\" את הטיפול. הפירוש, לעומת זאת, נוגע לכל מהלך החיים ולגילומים השונים של האמת של המטופל.<\/li>\n<li>כל הרגשות ניתנים להמשגה בשש חוליות מקשרות: L, H, K ו-‎-L, ‎-H, ‎-K. החוליה היא זרז לחוויה רגשית, ובלעדיה אין חוויה רגשית ואין התפתחות של חשיבה. בפגישה המטפל מנסה לזהות מהי החוליה הרגשית המשמעותית.<\/li>\n<li>מיכל-מוכל: שני הצדדים פעילים, בניגוד ל\"החזקה\" של ויניקוט. מיכל נוקשה מדי מקבע את התוכן, תוכן נפיץ מדי מותח את המיכל עד להרס הדדי, ובמצב תקין שניהם צומחים. אותו מודל חל על מחשבות: \"מחשבות המחפשות חושב\".<\/li>\n<li>פונקציית אלפא הופכת חוויה רגשית וחושית גולמית למרכיבי אלפא, שאפשר לזכור, לחלום ולהשתמש בהם לחשיבה ולסמל. מרכיבי ביתא הם חומר לא מעוכל, חסר שם ומשמעות, שהנפש מסלקת בהזדהות השלכתית לגוף או לעולם. המקבל עשוי לחוות אותם כאירוע פיזי.<\/li>\n<li>שפת הפסיכואנליזה שאולה מהעולם החושי והפיזי (\"מיכל\", \"רוויה\", \"חוליה\"), ולכן היא מוגבלת. שירה ואמנות ממחישות את העולם הפנימי טוב יותר. מטופל עשוי להגיע לטיפול כי \"בניית המודלים\" שלו לגבי חייו הרגשיים תקועה, קונקרטית מדי או לא מקדמת צמיחה.<\/li>\n<li>\"ללא זיכרון וללא תשוקה\": הדבר החשוב היחיד בפגישה הוא הלא-ידוע. ההתקשרות לזיכרון (כולל לתיאוריה) והתשוקה (לריפוי, לפרשנות מוצלחת) מעוותות את השיפוט. נדרשים reverie ואינטואיציה, ושימוש \"רצוי\" בזיכרון הוא זיכרון שעולה מעצמו כשלם, כחלק מ\"אבולוציה\" בפגישה.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>התגלות האמת וצמיחה מנטלית<\/strong> – שתי הנחות היסוד של ביון. הנפש צומחת דרך חשיפה לאמת.<\/li>\n<li><strong>סימפטום כ\"סיפור כיסוי\"<\/strong> – הסימפטום אינו הסיבה האמיתית לפנייה לאנליזה. הסיבה היא מציאות או אמת פנימית בעייתית.<\/li>\n<li><strong>סופי / אינסופי<\/strong> – חלופה של ביון ל\"מודע ולא מודע\". \"סופי\" הוא התייחסות לדברי המטפל כעצה מיידית, ו\"אינסופי\" הוא פירוש שנוגע לכל מהלך החיים.<\/li>\n<li><strong>O<\/strong> – המציאות העליונה: אמת מוחלטת, אלוהות, האינסופי, \"הדבר בפני עצמו\". חסידי קליין ותיאורטיקנים פוזיטיביסטים ראו בו מושג \"מיסטי\" מדי. כל הטרנספורמציות הן טרנספורמציות של O.<\/li>\n<li><strong>חוליות מקשרות L / H / K (ו-‎-L, ‎-H, ‎-K)<\/strong> – אהבה, שנאה, ידיעה והשלילות שלהן: שש פעילויות רגשיות שמקשרות בין בני אדם. K הוא תהליך של היכרות רגשית עם האחר, לא צבירת מידע. שכלתנות יתר בטיפול היא דרך להימנע ממגע אמיתי.<\/li>\n<li><strong>מיכל / מוכל<\/strong> – ארכיטיפ של תינוק בכאב שמחפש את שד האם. שני הצדדים פעילים ויכולים לצמוח, או להרוס זה את זה. ובאותו אופן: מחשבות (מוכל) שמחפשות חושב (מיכל).<\/li>\n<li><strong>פונקציית אלפא<\/strong> – תהליך בחלק הלא-פסיכוטי של האישיות. הוא הופך את נתוני החוויה הרגשית והחושית למרכיבי אלפא, ש\"ניתנים להטמעה על ידי הנפש\".<\/li>\n<li><strong>מרכיבי אלפא<\/strong> – תוצרי פונקציית אלפא, שאפשר לאחסן בזיכרון, לחלום, להשתמש בהם לחשיבה ולהפוך לסמל.<\/li>\n<li><strong>מרכיבי ביתא<\/strong> – רסיסים גולמיים, \"לא נפשיים או גשמיים ממש\", חסרי משמעות ושם, שנחווים כ\"דברים בפני עצמם\". הנפש פולטת אותם בהזדהות השלכתית, ואפשר להתמיר אותם רק דרך פונקציית אלפא.<\/li>\n<li><strong>טרנספורמציה (התמרה)<\/strong> – גרסה חדשה של חוויה מקורית (באמנות, בשירה או באנליזה) שמהות המקור עדיין ניתנת לזיהוי בה. אצל המטפל הטרנספורמציה צריכה להיות מוגבלת להתנהגות מילולית פרשנית.<\/li>\n<li><strong>ללא זיכרון וללא תשוקה<\/strong> – עמדה שבה המטפל משתחרר מההתקשרות לזיכרון (כולל תיאוריות) ומהתשוקה (לריפוי, להצלחה), כדי להיות מכוונן ללא-ידוע בפגישה.<\/li>\n<li><strong>Reverie<\/strong> – \"קשב צף\", מצב שבו הנפש ערוכה לבצע את המעבר מהחושי למנטלי.<\/li>\n<li><strong>אבולוציה<\/strong> – תהליך שבו \"תוהו ובוהו\" בפגישה מתחיל לקבל צורה. התוצר דומה לחלום, נוכח ונעדר בבת אחת, ושם טמונה הפרשנות.<\/li>\n<\/ul>","models":"<p><strong>רקע ביוגרפי (כפי שמובא בטקסט):<\/strong> נולד ב-1897 במוטרה שבהודו להורים אנגלים \"מהמעמד הגבוה, אך חסרי אמצעים\". התקבל לאוקספורד אבל חש נחות בגלל חינוך ירוד. שירת במלחמת העולם הראשונה, היה ביישן, הרגיש תמיד \"כמתבונן מהצד\" וראה חברים קרובים מתים לצידו. הוא \"העדיף להיות בחזית מאשר לשהות בקרבת אימו\". נאבק כל חייו לפרנס את משפחתו, ובשנותיו המאוחרות חי בקליפורניה. נפטר ב-1979.<\/p>\n<p><strong>ב
