יון מול פרויד וקליין:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>נושא<\/th>\n<th>פרויד / קליין<\/th>\n<th>ביון<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>סימפטום<\/td>\n<td>(פרויד) דחף מיני שנחסם<\/td>\n<td>\"סיפור כיסוי\". הסיבה האמיתית היא אמת פנימית<\/td>\n<\/tr>\n<tr>\n<td>סיבתיות<\/td>\n<td>(פרויד) קשר סיבה-תוצאה<\/td>\n<td>חלק מתחושת נרדפות (קונסטלציה פרנואידית)<\/td>\n<\/tr>\n<tr>\n<td>מודע / לא מודע<\/td>\n<td>המודל הסטרוקטורלי (פרויד)<\/td>\n<td>סופי / אינסופי. לא משתמש במודל הסטרוקטורלי<\/td>\n<\/tr>\n<tr>\n<td>הבסיס הקלייניאני<\/td>\n<td>פיצול, הזדהות השלכתית, יצר המוות, עמדות PS ו-D<\/td>\n<td>שואב מהם, אבל בגישה \"חיובית יותר\" ופחות ממוקדת בחמדנות ובקנאה. מוסיף את מושג ה-O<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>שש החוליות הרגשיות:<\/strong> L (אהבה), H (שנאה), K (ידיעה), ‎-L, ‎-H, ‎-K.<\/p>\n<ul>\n<li>דוגמה לפחד: פחד מדחייה של מישהו שאני אוהבת (‎-L), או פחד שמישהו שאני שונאת ינקום בי (‎-H). פחד הוא מצב סביל, והחוליות הן פעילויות רגשיות.<\/li>\n<li>הרצף: חוליה מקשרת → חוויה רגשית → חשיבה (או פורקן). \"ללא החוליות המקשרות לא הייתה מתרחשת חוויה רגשית, וללא חוויה רגשית אין התפתחות של חשיבה.\"<\/li>\n<\/ul>\n<p><strong>דוגמה קלינית לזיהוי החוליה (מתוך סימינגטון וסימינגטון):<\/strong> ילד נכנס לפגישה בפראות, מנגח מכוניות ומתגרה במטפלת. הוא נרגע אחרי שיחה על הכעס, מדבר בבהירות על סירובו להשתתף במשחק מיני בבית הספר, ואז חוזר לפראות (פלסטלינה, מים, יריקות).<\/p>\n<ul>\n<li>השערה 1: H, כי הילד מעורר שנאה.<\/li>\n<li>השערה 2: ‎-L, כלומר התנגדות ל\"בצבוצי רוך\". כל דחף אוהב נקטע.<\/li>\n<li>השערה 3: ‎-K, כלומר שנאת החוויה של הכרה עצמית. הילד משתיק את המטפלת ומחקה בלעג.<\/li>\n<li>המטפלת בחרה ב-‎-L, כי היו סימנים לרצון לשתף פעולה שנדחה כמעט מיד.<\/li>\n<\/ul>\n<p><strong>מיכל-מוכל: שלושה מצבים:<\/strong><\/p>\n<ol>\n<li>מיכל נוקשה מדי: התוכן נשאר סטטי.<\/li>\n<li>תוכן נפיץ מדי: מותח את גבולות המיכל, ואפשרי הרס הדדי.<\/li>\n<li>מצב תקין: גם המיכל וגם המוכל (האם והתינוק) צומחים מהאינטראקציה.\n- באווירה שלילית תתרחש \"צמיחה נפשית שלילית\".<\/li>\n<\/ol>\n<p><strong>פונקציית אלפא: מרכיבי ביתא לעומת מרכיבי אלפא:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>מרכיבי ביתא<\/th>\n<th>מרכיבי אלפא<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>גולמיים, \"עובריים\", עכורים. לא נפשיים ולא גשמיים ממש<\/td>\n<td>תוצר של פונקציית אלפא<\/td>\n<\/tr>\n<tr>\n<td>חסרי משמעות או שם; גורמים לתסכול; רודפניים או דיכאוניים, ובעיקר בלתי קוהרנטיים<\/td>\n<td>מובנים ובעלי משמעות; נוצרים מרשמים חזותיים, שמיעתיים, של טעם ושל ריח<\/td>\n<\/tr>\n<tr>\n<td>נחווים כ\"דברים בפני עצמם\", כפסולת<\/td>\n<td>ניתנים לאחסון בזיכרון, לשימוש בחלומות ולהפיכה לסמל<\/td>\n<\/tr>\n<tr>\n<td>נפלטים בהזדהות השלכתית לגוף או לעולם, ועשויים להיחוות כאירוע פיזי אצל המקבל<\/td>\n<td>זמינים לחשיבה, לחלימה ולאינטגרציה<\/td>\n<\/tr>\n<tr>\n<td>\"דברים שאי אפשר לחשוב עליהם\"<\/td>\n<td>ביתא → (פונקציית אלפא) → אלפא<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>המקור הקליני של מושג פונקציית אלפא (העבודה עם פסיכוטיים):<\/strong> הפסיכוטי תוקף את נפשו לרסיסים כדי להשמיד את המודעות למציאות נפשית רודפנית. בחומר המפוצל ביון מצא רסיסים חזותיים של \"עובדות לא מעוכלות\". מכיוון ש\"פסיכוטים לא חולמים\", ביון הסיק שקיים תהליך, שהחלימה היא רק חלק ממנו, שחסר בחלק הפסיכוטי של האישיות. היעדרו פוגע בקשב לשדה חווייתי רחב, בזיכרון, בשיפוט ובייצור דימויים שמעוררים אסוציאציות.<\/p>\n<p><strong>טרנספורמציות באנליזה: השלבים:<\/strong><\/p>\n<ol>\n<li>כל אחד מבני הדיאדה חווה את המפגש בדרכו ומייצג אותו לעצמו (הטרנספורמציה הראשונה).<\/li>\n<li>כל אחד יוצר טרנספורמציה משלו ומעביר אותה לאחר.<\/li>\n<li>משווים בין שתי הגרסאות.\n- הטרנספורמציה של המטופל מתבטאת בהתנהגות מילולית ובלתי מילולית. הטרנספורמציה של המטפל אמורה להיות מוגבלת להתנהגות מילולית פרשנית בלבד.<\/li>\n<\/ol>\n<p><strong>\"ללא זיכרון וללא תשוקה\": פירוט:<\/strong><\/p>\n<ul>\n<li>זיכרון: רעיונות שעולים כתגובה למאמץ מודע \"להיזכר\", קשורים לרשמים חושיים, \"מתעתעים\", וכוללים גם את התיאוריה. מה שחוסם את ההבנה הוא לא הזיכרון עצמו אלא ההתקשרות אליו, ולכן נדרשת \"משמעת\".<\/li>\n<li>תשוקה: מעוותת את השיפוט, כי היא בוחרת חומר ומדכאת חומר אחר לפי רצונות המטפל (לריפוי, לפרשנות מוצלחת).<\/li>\n<li>החלופה: אינטואיציה (\"השכל מתנוון ואילו האינטואיציה מתפתחת\"), reverie, וזיכרון ש\"עולה באופן אורגני\" כשלם, כחלק מהאבולוציה.<\/li>\n<\/ul>","practice":"<ul>\n<li>בפגישה, ובכתיבת סיכומים, שאל/י את עצמך: מהי החוליה הרגשית הדומיננטית עכשיו? אהבה, שנאה או ידיעה, או אולי ההתנגדות לאחת מהן? בדוק/בדקי כמה השערות כמו בדוגמת הילד, ובחר/י לפי הסימנים בחדר.<\/li>\n<li>כשמטופל או הורה מחפשים \"את הסיבה\" (\"הכול בגלל...\"), אל תמהר/י לספק הסבר סיבתי שמסיר אחריות. חפש/י את הכאב או את האמת הפנימית שמאחורי הסימפטום.<\/li>\n<li>שים/י לב לבקשות \"סופיות\", כלומר למטופל שמתייחס לכל משפט כעצה ליישום מיידי, ולשכלתנות יתר שמשמשת להימנעות ממגע (‎-K).<\/li>\n<li>חשוב/י על עצמך כעל \"מיכל\". תחושות גולמיות, גופניות או בלתי נסבלות שעולות בך מול מטופל (מרכיבי ביתא שהושלכו) הן חומר שמחכה לעיבוד ולניסוח, לא רק מטרד.<\/li>\n<li>כשאת/ה נכנס/ת לפגישה, הנח/י בצד את הסיכום מהשבוע שעבר ואת הרצון \"להצליח\" או \"לרפא\". הקשב/י למה שקורה עכשיו (reverie), וחכה/י שמשהו \"יקבל צורה\" לפני שתפרש/י.<\/li>\n<li>זכור/זכרי שהשפה הטיפולית מוגבלת. מטאפורות ודימויים, ולפעמים שפה אמנותית, יכולים לבטא חוויה רגשית טוב יותר ממונחים מקצועיים.<\/li>\n<li>ראה/י ביכולת לשאת כאב, אצל המטופל ואצלך, חלק מהצמיחה, ולא סימן לכישלון הטיפול.<\/li>\n<\/ul>","questions":"<ol>\n<li>בפגישה האחרונה עם מטופל מסוים, איזו חוליה (L, H, K או השלילות שלהן) הייתה דומיננטית לדעתי? אילו סימנים בחדר תומכים בהשערה, ואילו בהשערה חלופית?<\/li>\n<li>אילו \"מרכיבי ביתא\" אני מרגיש/ה שהמטופל מעביר אליי (תחושות גופניות, בלבול, מועקה)? מה עזר לי, או יכול לעזור לי, להפוך אותם למחשבה?<\/li>\n<li>מה ה\"זיכרון\" וה\"תשוקה\" שלי בטיפול הזה (תיאוריה שאני נאחז/ת בה, רצון להצליח או להראות התקדמות להורים או למערכת)? איך הם מעוותים את הקשב שלי?<\/li>\n<li>האם אני נענה/ית לחיפוש של המטופל או ההורים אחר סיבה (\"זה בגלל...\"), ומה הייתי עושה אחרת לפי ביון?<\/li>\n<li>איך מתיישב \"ללא זיכרון וללא תשוקה\" עם הדרישות של שפ\"ח: מידע מבית הספר, מטרות ודיווח?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"ביון ראה את הסימפטום כסיפור כיסוי של האנליזה. לא עוד \"הגעתי לכאן כי יש לי אסתמה\", אלא \"הגעתי לכאן כי אני לא מסוגל לאהוב\".\"<\/li>\n<li>\"השינוי מתרחש בהחלטה להתמודד עם הכאב במקום להתחמק ממנו.\"<\/li>\n<li>\"ללא החוליות המקשרות לא הייתה מתרחשת חוויה רגשית, וללא חוויה רגשית אין התפתחות של חשיבה.\"<\/li>\n<li>\"ביון מבהיר שזה לא הזיכרון עצמו שחוסם את ההבנה, אלא ההתקשרות לזיכרון.\"<\/li>\n<\/ul>"},"level":"שנים ב'-ג' (יכול לשמש גם כמבוא ראשוני בשנה א')","stype":"מאמר (בפועל: סיכום לימודי מבואי בסגנון הרצאה, לא מאמר מקורי)","tldr":"הטקסט הוא היכרות ראשונית עם חשיבתו של וילפרד ביון. הוא נפתח ברקע ביוגרפי: ביון נולד ב-1897 בהודו להורים אנגלים מהמעמד הגבוה אך חסרי אמצעים, שירת במלחמת העולם הראשונה, חי בשנותיו המאוחרות בקליפורניה ונפטר ב-1979. אחר כך הוא ממקם את ביון מול פרויד…","search":"הטקסט הוא היכרות ראשונית עם חשיבתו של וילפרד ביון. הוא נפתח ברקע ביוגרפי: ביון נולד ב-1897 בהודו להורים אנגלים מהמעמד הגבוה אך חסרי אמצעים, שירת במלחמת העולם הראשונה, חי בשנותיו המאוחרות בקליפורניה ונפטר ב-1979. אחר כך הוא ממקם את ביון מול פרויד וקליין. נקודת המוצא של ביון היא הפנומנולוגיה של הפגישה האנליטית, והנחות היסוד שלו הן התגלות האמת וצמיחה מנטלית. הסימפטום הוא \"סיפור כיסוי\", החיפוש אחר סיבתיות קשור לתחושת נרדפות, והשינוי הוא ההחלטה להתמודד עם הכאב במקום להתחמק ממנו. הטקסט מציג את המושגים המרכזיים: שש החוליות הרגשיות (L, H, K והשלילות שלהן) עם דוגמה קלינית של ילד, מיכל-מוכל, פונקציית אלפא ומרכיבי ביתא (שנולדו מהעבודה עם פסיכוטיים), המציאות הנפשית ומגבלות השפה, טרנספורמציות ומושג ה-O. הוא מסתיים בעיקרון \"ללא זיכרון וללא תשוקה\" וב\"אבולוציה\" בפגישה. בסך הכול זהו טקסט מבואי ומושגי, שנותן אוצר מילים בסיסי להבנת ביון בקליניקה. ביון אינו מציע תיאוריה פסיכואנליטית שיטתית, אלא \"סינתזה תיאורית של החוויה\" של הפגישה האנליטית: האווירה הרגשית, מחשבות המטפל ומצבו. לשם כך הוא נעזר בתיאוריות פסיכואנליטיות, פילוסופיות ומתמטיות. שתי הנחות יסוד: התגלות האמת וצמיחה מנטלית. \"הנפש צומחת בזכות החשיפה לאמת\", וביון חוקר איך האמת מתפתחת ואיך היא נחסמת. הסימפטום הוא \"סיפור כיסוי\". האמת הפנימית (\"אני לא מסוגל לאהוב\") היא הסיבה האמיתית לפנייה. החיפוש אחר סיבתיות (\"כל הצרות שלי בגלל ש...\") משקף קונסטלציה פרנואידית ובריחה מדיכאון פנימי. המטרה אינה לספק סיבה שמסירה אחריות, אלא לפתח קונסטלציה רגשית אחרת. השינוי הוא המעבר מהתחמקות מכאב להתמודדות איתו, בניגוד לעקרון העונג. ביון מאמין ביכולתו של האדם לשאת כאב וסבל כדרך לצמיחה ולא כפתולוגיה. המטפל רואה את המעבר הזה, אבל לא את הסיבה לו. במקום \"מודע ולא מודע\", ביון מדבר על \"סופי\" ו\"אינסופי\". מטופל שמתייחס לכל דבר כ\"סופי\", כלומר כעצה ליישום מיידי, \"חונק\" את הטיפול. הפירוש, לעומת זאת, נוגע לכל מהלך החיים ולגילומים השונים של האמת של המטופל. כל הרגשות ניתנים להמשגה בשש חוליות מקשרות: L, H, K ו-‎-L, ‎-H, ‎-K. החוליה היא זרז לחוויה רגשית, ובלעדיה אין חוויה רגשית ואין התפתחות של חשיבה. בפגישה המטפל מנסה לזהות מהי החוליה הרגשית המשמעותית. מיכל-מוכל: שני הצדדים פעילים, בניגוד ל\"החזקה\" של ויניקוט. מיכל נוקשה מדי מקבע את התוכן, תוכן נפיץ מדי מותח את המיכל עד להרס הדדי, ובמצב תקין שניהם צומחים. אותו מודל חל על מחשבות: \"מחשבות המחפשות חושב\". פונקציית אלפא הופכת חוויה רגשית וחושית גולמית למרכיבי אלפא, שאפשר לזכור, לחלום ולהשתמש בהם לחשיבה ולסמל. מרכיבי ביתא הם חומר לא מעוכל, חסר שם ומשמעות, שהנפש מסלקת בהזדהות השלכתית לגוף או לעולם. המקבל עשוי לחוות אותם כאירוע פיזי. שפת הפסיכואנליזה שאולה מהעולם החושי והפיזי (\"מיכל\", \"רוויה\", \"חוליה\"), ולכן היא מוגבלת. שירה ואמנות ממחישות את העולם הפנימי טוב יותר. מטופל עשוי להגיע לטיפול כי \"בניית המודלים\" שלו לגבי חייו הרגשיים תקועה, קונקרטית מדי או לא מקדמת צמיחה. \"ללא זיכרון וללא תשוקה\": הדבר החשוב היחיד בפגישה הוא הלא-ידוע. ההתקשרות לזיכרון (כולל לתיאוריה) והתשוקה (לריפוי, לפרשנות מוצלחת) מעוותות את השיפוט. נדרשים reverie ואינטואיציה, ושימוש \"רצוי\" בזיכרון הוא זיכרון שעולה מעצמו כשלם, כחלק מ\"אבולוציה\" בפגישה. התגלות האמת וצמיחה מנטלית – שתי הנחות היסוד של ביון. הנפש צומחת דרך חשיפה לאמת. סימפטום כ\"סיפור כיסוי\" – הסימפטום אינו הסיבה האמיתית לפנייה לאנליזה. הסיבה היא מציאות או אמת פנימית בעייתית. סופי / אינסופי – חלופה של ביון ל\"מודע ולא מודע\". \"סופי\" הוא התייחסות לדברי המטפל כעצה מיידית, ו\"אינסופי\" הוא פירוש שנוגע לכל מהלך החיים. O – המציאות העליונה: אמת מוחלטת, אלוהות, האינסופי, \"הדבר בפני עצמו\". חסידי קליין ותיאורטיקנים פוזיטיביסטים ראו בו מושג \"מיסטי\" מדי. כל הטרנספורמציות הן טרנספורמציות של O. חוליות מקשרות L / H / K (ו-‎-L, ‎-H, ‎-K) – אהבה, שנאה, ידיעה והשלילות שלהן: שש פעילויות רגשיות שמקשרות בין בני אדם. K הוא תהליך של היכרות רגשית עם האחר, לא צבירת מידע. שכלתנות יתר בטיפול היא דרך להימנע ממגע אמיתי. מיכל / מוכל – ארכיטיפ של תינוק בכאב שמחפש את שד האם. שני הצדדים פעילים ויכולים לצמוח, או להרוס זה את זה. ובאותו אופן: מחשבות (מוכל) שמחפשות חושב (מיכל). פונקציית אלפא – תהליך בחלק הלא-פסיכוטי של האישיות. הוא הופך את נתוני החוויה הרגשית והחושית למרכיבי אלפא, ש\"ניתנים להטמעה על ידי הנפש\". מרכיבי אלפא – תוצרי פונקציית אלפא, שאפשר לאחסן בזיכרון, לחלום, להשתמש בהם לחשיבה ולהפוך לסמל. מרכיבי ביתא – רסיסים גולמיים, \"לא נפשיים או גשמיים ממש\", חסרי משמעות ושם, שנחווים כ\"דברים בפני עצמם\". הנפש פולטת אותם בהזדהות השלכתית, ואפשר להתמיר אותם רק דרך פונקציית אלפא. טרנספורמציה (התמרה) – גרסה חדשה של חוויה מקורית (באמנות, בשירה או באנליזה) שמהות המקור עדיין ניתנת לזיהוי בה. אצל המטפל הטרנספורמציה צריכה להיות מוגבלת להתנהגות מילולית פרשנית. ללא זיכרון וללא תשוקה – עמדה שבה המטפל משתחרר מההתקשרות לזיכרון (כולל תיאוריות) ומהתשוקה (לריפוי, להצלחה), כדי להיות מכוונן ללא-ידוע בפגישה. Reverie – \"קשב צף\", מצב שבו הנפש ערוכה לבצע את המעבר מהחושי למנטלי. אבולוציה – תהליך שבו \"תוהו ובוהו\" בפגישה מתחיל לקבל צורה. התוצר דומה לחלום, נוכח ונעדר בבת אחת, ושם טמונה הפרשנות."},{"id":"theorists","title":"קוהוט, ויניקוט, בולבי","authors":"תיאורטיקנים להכרה","year":"","cite":"היכרות עם התיאוריות של היינץ קוהוט, דונלד ויניקוט וג'ון בולבי.","url":null,"kind":"theory","desc":"שלושה הוגים שהם בסיס תיאורטי לשנה ד'. מושגים של ויניקוט וקוהוט מופיעים גם בחומרים אחרים, למשל בפרק של לוריא ועמיתיו על הדרכת מנהלים.","placements":[["s3","therapy"]],"extra":false,"ref":"קוהוט, ויניקוט, בולבי","inFolder":false,"tldr":"שלושה הוגים שהם בסיס תיאורטי לשנה ד'. מושגים של ויניקוט וקוהוט מופיעים גם בחומרים אחרים, למשל בפרק של לוריא ועמיתיו על הדרכת מנהלים.","search":"שלושה הוגים שהם בסיס תיאורטי לשנה ד'. מושגים של ויניקוט וקוהוט מופיעים גם בחומרים אחרים, למשל בפרק של לוריא ועמיתיו על הדרכת מנהלים."},{"id":"mor2006","title":"הרחבת המרחב החינוכי של המורה ושל הצוות החינוכי בבית הספר","authors":"פ' מור","year":"2006","cite":"מור, פ' (2006). הרחבת המרחב החינוכי של המורה ושל הצוות החינוכי בבית הספר. בתוך: לראות את הילדים: מדריך ליצירת סביבה חינוכית מגדלת לתלמידים בסיכון (עמ' 61-67). ג'וינט-אשלים.","url":"https://www.thejoint.org.il/digital-library/%D7%9C%D7%A8%D7%90%D7%95%D7%AA-%D7%90%D7%AA-%D7%94%D7%99%D7%9C%D7%93%D7%99%D7%9D-%D7%9E%D7%93%D7%A8%D7%99%D7%9A-%D7%9C%D7%99%D7%A6%D7%99%D7%A8%D7%AA-%D7%A1%D7%91%D7%99%D7%91%D7%94-%D7%97%D7%99%D7%A0/","kind":"article","desc":"פרק מתוך המדריך \"לראות את הילדים\" על הרחבת המרחב החינוכי של המורה והצוות, כחלק מיצירת סביבה מגדלת לתלמידים בסיכון.","urlLabel":"המדריך בספרייה הדיגיטלית של ג'וינט, הפרק בעמ' 61","placements":[["s3","system"]],"extra":false,"ref":"מור 2006","inFolder":false,"tldr":"פרק מתוך המדריך \"לראות את הילדים\" על הרחבת המרחב החינוכי של המורה והצוות, כחלק מיצירת סביבה מגדלת לתלמידים בסיכון.","search":"פרק מתוך המדריך \"לראות את הילדים\" על הרחבת המרחב החינוכי של המורה והצוות, כחלק מיצירת סביבה מגדלת לתלמידים בסיכון."},{"id":"nutkevitch2025","title":"The Challenge of Containment: A Psychoanalytic-Systemic Approach","authors":"Avi Nutkevitch","year":"2025","cite":"Nutkevitch, A. (2025). The Challenge of Containment: A Psychoanalytic-Systemic Approach. In Containment, Organisations and the Working Task (pp. 187-197). Routledge.","url":"https://www.routledge.com/Containment-Organisations-and-the-Working-Task/Mendes-Hinshelwood/p/book/9781138505117","kind":"article","desc":"פרק עדכני של נוטקביץ' על אתגר ההכלה בארגונים. המשך ישיר למאמר \"המכל והמוכל\" שבשנים ב'-ג'.","urlLabel":"עמוד הספר בהוצאת Routledge","placements":[["s3","system"]],"extra":false,"ref":"Nutkevitch 2025","inFolder":false,"tldr":"פרק עדכני של נוטקביץ' על אתגר ההכלה בארגונים. המשך ישיר למאמר \"המכל והמוכל\" שבשנים ב'-ג'.","search":"פרק עדכני של נוטקביץ' על אתגר ההכלה בארגונים. המשך ישיר למאמר \"המכל והמוכל\" שבשנים ב'-ג'."},{"id":"menzies","title":"Social Systems as a Defense Against Anxiety","authors":"Isabel Menzies Lyth","year":"1960","cite":"Menzies, I. E. P. (1960). A case-study in the functioning of social systems as a defence against anxiety: A report on a study of the nursing service of a general hospital. Human Relations, 13(2), 95-121.","url":"https://journals.sagepub.com/doi/10.1177/001872676001300201","kind":"article","desc":null,"urlLabel":"המאמר בכתב העת Human Relations (SAGE)","file":{"orig":"social systems as a defense against anxiety.pdf","ext":"pdf","pdf":"menzies.pdf","pages":24,"bytes":1036583},"placements":[["s3","system"]],"extra":false,"ref":"Menzies Lyth 1960","inFolder":true,"srcTitle":"Social Systems as a Defense Against Anxiety: An Empirical Study of the Nursing Service of a General Hospital","secs":{"abstract":"<p>המאמר מתאר מחקר-התערבות בשירות הסיעוד של בית חולים כללי להוראה בלונדון. שירות הסיעוד ביקש עזרה בתכנון שיבוץ האחיות-הסטודנטיות (500 סטודנטיות ו-150 אחיות מוסמכות), כי המערכת עמדה על סף קריסה. במהלך הבירור ה\"דיאגנוסטי\" גילו החוקרים רמה גבוהה מאוד של מתח וחרדה: שליש מהסטודנטיות לא סיימו את ההכשרה, הייתה תחלופה גבוהה בקרב הבכירות, ושיעורי המחלה היו גבוהים. לפי מנזיס-לית', מקור החרדה הוא שהמצב האובייקטיבי בעבודת הסיעוד (מחלה, סבל, מוות, מגע גופני אינטימי) דומה מאוד למצבי הפנטזיה הלא מודעים והפרימיטיביים שתיארה קליין. לכך מצטרפות השלכות של מטופלים ובני משפחה. כדי להתמודד, הארגון פיתח לאורך זמן, בשיתוף פעולה קולוזיבי ולא מודע, \"מערכת הגנה מובנית חברתית\": פיצול הקשר עם המטופל לרשימות משימות, דה-פרסונליזציה, הכחשת רגשות, טקסיות, בדיקות כפולות, פיזור אחריות ועוד. ההגנות האלה נשענות על מנגנונים פרימיטיביים של הימנעות. לכן הן אינן מאפשרות עיבוד אמיתי של החרדה, יוצרות \"חרדה משנית\", פוגעות ביעילות ובסיפוק, מעכבות את התבגרותן של האחיות ומקשות מאוד על שינוי. המסקנה: הצלחתו ושרידותו של מוסד קשורות קשר הדוק לדרכים שבהן הוא מכיל חרדה.<\/p>","ideas":"<ul>\n<li><strong>מקור החרדה במשימה עצמה<\/strong>: האחות נושאת את ההשפעה המלאה, המיידית והמרוכזת של הטיפול בחולים: סבל, מוות, משימות דוחות ומפחידות, ומגע אינטימי שמעורר משאלות ליבידינליות. העבודה מעוררת רגשות חזקים וסותרים: רחמים, חמלה ואהבה, אשמה וחרדה, שנאה וטינה כלפי המטופלים, וקנאה בטיפול שהם מקבלים.<\/li>\n<li><strong>הדמיון בין המציאות לפנטזיה<\/strong>: המצב האובייקטיבי מעורר מחדש מצבי פנטזיה אינפנטיליים (לפי קליין): עולם פנימי מלא אובייקטים פגועים ומתים. כשהסמל \"נדבק\" לגמרי לאובייקט הפנטזיה (משוואה סמלית, לפי סגל), הוא חדל להכיל את החרדה, והחרדה הפרימיטיבית נחווית במלוא עוצמתה.<\/li>\n<li><strong>השלכות מבחוץ<\/strong>: מטופלים ובני משפחה משליכים על בית החולים, ובעיקר על האחיות, דיכאון, חרדה, פחד וגועל, ולפעמים \"מחזירים\" אליו את האחריות על החלטות. חלק מהמטופלים אושפזו כי הם ומשפחותיהם לא יכלו לשאת את המחלה בבית.<\/li>\n<li><strong>מערכת הגנה מובנית חברתית<\/strong> (socially structured defense system, בעקבות Jaques, 1955): צורכי החברים בארגון במאבק בחרדה מעצבים את המבנה, התרבות ודרכי התפקוד שלו, בגבולות שהמשימה המרכזית והטכנולוגיה מציבות. המערכת נבנית בהסכמה קולוזיבית ולא מודעת, והופכת ל\"מציאות חיצונית\" שכל חבר חדש צריך להסתגל אליה.<\/li>\n<li><strong>ההגנות מבוססות הימנעות<\/strong>: הן עוזרות לפרט להימנע מחוויה מודעת של חרדה, אשמה, ספק ואי-ודאות, אבל לא עוזרות לו להתמודד עם החרדה ולפתח יכולת לשאת אותה. החרדה \"מוכלת\" חלקית, אבל לא מעובדת.<\/li>\n<li><strong>חרדה משנית<\/strong>: מערכת ההגנה עצמה מייצרת חרדה נוספת, כמו תחושת משבר מתמדת, ניודים תכופים, תת-תעסוקה ושלילת סיפוק, ובאותו זמן אינה מקלה על החרדה הראשונית.<\/li>\n<li><strong>פיצול והשלכה של אחריות<\/strong>: כל אחות מפצלת ומשליכה את הדחפים \"חסרי האחריות\" שלה על הזוטרות ואת הנוקשות המשמעתית על הבכירות. כך הקונפליקט התוך-נפשי הופך לקונפליקט בין-אישי, שכואב פחות. ה\"אמת הנפשית\" הופכת גם לאמת אובייקטיבית, כי אנשים פועלים לפי התפקידים שהושלכו עליהם.<\/li>\n<li><strong>התאמה בין הגנות אישיות להגנות חברתיות<\/strong>: את ההגנות מפעילים רק יחידים. החברות בארגון מחייבת התאמה מספקת בין מערכת ההגנה האישית לחברתית. פער גדול מדי מוביל לניתוק, למשל נשירה או דחייה. במוסד נוקשה, ההתאמה מושגת בעיקר בכך שהפרט משנה את הגנותיו. ה\"הפנמה הכפויה\" של הגנות פרימיטיביות מעכבת התבגרות ואף גורמת לרגרסיה.<\/li>\n<li><strong>ההגנות פוגעות ביעילות<\/strong>: ההגנות גורמות לתחלופת צוות גבוהה, לסיעוד גרוע, להכשרה לקויה ואף משפיעות על שיעורי ההחלמה (Revans, 1959). \"חוסר היעילות הוא תוצאה בלתי נמנעת של מערכת ההגנה שנבחרה.\"<\/li>\n<li><strong>התנגדות לשינוי<\/strong>: ההתנגדות לשינוי חברתי היא היאחזות לא מודעת במוסדות קיימים, כי שינוי מאיים על ההגנות. היא חזקה במיוחד כשההגנות פרנואידיות-סכיזואידיות. השינויים שהושגו בבית החולים (תוכנית קורסים ומאגר אחיות ניידות) דווקא חיזקו את ההגנות הקיימות. ההצעה לשינוי עמוק, ניסוי של שיבוץ אחות למטופל במקום רשימת משימות, לא יצאה לפועל.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>מערכת הגנה מובנית חברתית<\/strong> (Socially structured defense system / Social defense system) – הגנות שהוחצנו וקיבלו ממשות במבנה, בתרבות ובדרכי התפקוד של הארגון, ונוצרו בהסכמה קולוזיבית ולא מודעת בין חבריו.<\/li>\n<li><strong>המשימה המרכזית<\/strong> (Primary task, לפי Rice, 1958) – המשימה שהארגון נוצר לבצע. בבית חולים: לטפל בחולים שאי אפשר לטפל בהם בבית. לפי המאמר, המשימה והטכנולוגיה רק מציבות גבולות, ובתוכם התרבות והמבנה נקבעים לפי הצרכים הפסיכולוגיים של החברים.<\/li>\n<li><strong>פנטזיה / פַנטזיה<\/strong> (fantasy / phantasy) – פנטזיה מודעת לעומת פנטזיה לא מודעת. המצב האובייקטיבי בסיעוד מעורר מחדש מצבי פנטזיה אינפנטיליים.<\/li>\n<li><strong>ייצוג סמלי לעומת משוואה סמלית<\/strong> (Symbolic representation vs. symbolic equation, לפי Segal, 1957) – כדי שסמל יכיל חרדה, הוא צריך לייצג את אובייקט הפנטזיה בלי להיות זהה לו. כשהם מתמזגים, החרדה מתעוררת במלוא עוצמתה.<\/li>\n<li><strong>דה-פרסונליזציה וקטגוריזציה<\/strong> (Depersonalization, categorization) – מחיקת הייחודיות של המטופל ושל האחות (\"הכבד במיטה 10\"; המדים כסמל לאחידות).<\/li>\n<li><strong>ריחוק והכחשת רגשות<\/strong> (Detachment and denial of feelings) – ריחוק מקצועי שהושג בדרך קונקרטית, דרך ניודים תכופים, יחד עם טכניקות דיכוי (\"stiff upper lip\").<\/li>\n<li><strong>ביצוע טקסי של משימות<\/strong> (Ritual task-performance) – הוראות מדויקות ומחייבות שמבטלות את הצורך להחליט, ולכן גם את החרדה שבהחלטה.<\/li>\n<li><strong>בדיקות ובדיקות-נגד<\/strong> (Checks and counterchecks) – דחיית המחויבות הסופית ופיזור משקל ההחלטה.<\/li>\n<li><strong>חלוקה מחדש קולוזיבית של אחריות וחוסר-אחריות<\/strong> (Collusive social redistribution of responsibility and irresponsibility) – פיצול והשלכה: הזוטרות \"חסרות אחריות\" והבכירות \"נוקשות\".<\/li>\n<li><strong>ערפול מכוון בחלוקת האחריות<\/strong> (Purposeful obscurity) – תפקידים וגבולות לא מוגדרים, ואחריות מפוזרת. המאמר מכנה זאת \"מדיניות של אי-עשייה\" (a policy for inactivity).<\/li>\n<li><strong>האצלה כלפי מעלה<\/strong> (Delegation to superiors) – משימות \"נדחפות\" במעלה ההיררכיה כדי להתנער מאחריות עליהן.<\/li>\n<li><strong>חרדה ראשונית לעומת חרדה משנית<\/strong> (Primary / secondary anxiety) – החרדה שמקורה במשימה, לעומת החרדה שמערכת ההגנה עצמה מייצרת.<\/li>\n<li><strong>התאמה בין הגנות אישיות להגנות חברתיות; הפנמה כפויה<\/strong> (Matching; forced introjection) – תנאי לחברות בארגון. כשהמוסד נוקשה, הפרט נאלץ לאמץ את הגנותיו, במחיר התבגרות וסובלימציה.<\/li>\n<li><strong>שיקול דעת<\/strong> (Discretion, לפי Jaques, 1956) – רמת האחריות שאדם חווה בעבודה תלויה רק בהפעלת שיקול דעת, ולא בביצוע מה שנקבע מראש.<\/li>\n<li><strong>הגנות פרנואידיות-סכיזואידיות<\/strong> (Paranoid-schizoid defenses, לפי קליין) – הגנות פרימיטיביות של פיצול והשלכה. מוסדות שנשענים עליהן מתנגדים לשינוי יותר מכולם.<\/li>\n<\/ul>","models":"<p><strong>א. מקורות החרדה של האחות (כפי שמתוארים במאמר)<\/strong><\/p>\n<ol>\n<li>מגע מתמיד עם חולים ופצועים, לעתים קשה. ההחלמה אינה ודאית, וטיפול בחולים חשוכי מרפא הוא מהמשימות הקשות ביותר.<\/li>\n<li>התמודדות עם סבל ומוות \"כפי שמעט אנשים מן השורה\" מתמודדים.<\/li>\n<li>משימות שלפי אמות מידה רגילות הן דוחות, מגעילות ומפחידות.<\/li>\n<li>מגע גופני אינטימי שמעורר משאלות ליבידינליות וארוטיות.<\/li>\n<li>רגשות עזים וסותרים: רחמים, חמלה, אהבה, אשמה, חרדה, שנאה וטינה כלפי המטופלים, וקנאה בטיפול שהם מקבלים.<\/li>\n<li>השלכות של מטופלים ובני משפחה. הרגשות שלהם מעורבים: הכרת תודה לצד טינה על התלות, קנאה, דרישות ורכושנות. הם מנסים \"להעביר\" לאחיות דיכאון, פחד, גועל ואחריות.<\/li>\n<li>הדמיון בין המצב האובייקטיבי למצבי הפנטזיה הפרימיטיביים, והסכנה שהייצוג הסמלי יהפוך למשוואה סמלית. דוגמה מהמאמר: אחות שאמה עברה כמה ניתוחים גינקולוגיים קרסה ועזבה את הסיעוד זמן קצר אחרי שהתחילה לעבוד במחלקה הגינקולוגית.<\/li>\n<\/ol>\n<p><strong>ב. מערכת ההגנה החברתית: עשר טכניקות הגנה בשירות הסיעוד<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>ההגנה (באנגלית)<\/th>\n<th>ההגנה (בעברית)<\/th>\n<th>ביטוי בשירות הסיעוד<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Splitting up the nurse/patient relationship<\/td>\n<td>פיצול הקשר אחות-מטופל<\/td>\n<td>רשימות משימות: כל סטודנטית מבצעת מעט משימות לחולים רבים ואינה נפגשת עם \"השלמות\" של מטופל אחד. \"האחות לא סיעדה מטופלים\"<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Depersonalization, categorization and denial of the significance of the individual<\/td>\n<td>דה-פרסונליזציה, קטגוריזציה והכחשת חשיבות הפרט<\/td>\n<td>\"הכבד במיטה 10\". \"אתיקה\" שלפיה כל מטופל זהה לכל מטופל אחר. מדים אחידים. החלטות \"גורפות\" לפי קטגוריות<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Detachment and denial of feelings<\/td>\n<td>ריחוק והכחשת רגשות<\/td>\n<td>\"אחות טובה לא מתנגדת לעבור\" (ניודים תכופים). הכחשת כאב הפרידה. \"stiff upper lip\". נזיפה במקום תמיכה אחרי טעות<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Attempt to eliminate decisions by ritual task-performance<\/td>\n<td>ניסיון לבטל החלטות באמצעות ביצוע טקסי<\/td>\n<td>הוראות מדויקות על אופן, סדר וזמן של כל משימה. כל משימה מוצגת כעניין של \"חיים ומוות\". אין עידוד לשיקול דעת, גם בשעת משבר<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Reducing the weight of responsibility by checks and counterchecks<\/td>\n<td>הפחתת משקל האחריות בבדיקות ובדיקות-נגד<\/td>\n<td>דחיית ההחלטה, בדיקה חוזרת, התייעצות גם עם זוטרות ועם מי שבמקרה זמינה, גם בעניינים זניחים<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Collusive social redistribution of responsibility and irresponsibility<\/td>\n<td>חלוקה מחדש קולוזיבית של אחריות וחוסר-אחריות<\/td>\n<td>תלונות על \"הזוטרות חסרות האחריות\" ועל \"הבכירות הנוקשות\", כשמדובר באותן נשים במבט מלמעלה או מלמטה. \"אם נעשתה טעות, צריך לנזוף במישהו, גם אם לא יודעים מי באמת עשה אותה\"<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Purposeful obscurity in the formal distribution of responsibility<\/td>\n<td>ערפול מכוון בחלוקת האחריות הפורמלית<\/td>\n<td>גבולות תפקיד לא ברורים, בעיקר בדרגים הבכירים. כל אחות אחראית על כל מי שזוטרה ממנה. האחריות מפוזרת ולכן לא נחווית ברצינות<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Reduction of the impact of responsibility by delegation to superiors<\/td>\n<td>הפחתת האחריות בהאצלה כלפי מעלה<\/td>\n<td>שיבוץ סטודנטיות בידי עוזרות המטרונית, משימה שפקיד יכול לבצע. האחיות האחראיות ביקשו שהבכירות ימשיכו לבחור עבורן סטודנטיות<\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Idealization and underestimation of personal developmental possibilities<\/td>\n<td>אידיאליזציה והערכת חסר של אפשרויות ההתפתחות האישית<\/td>\n<td>\"אחיות נולדות, לא נעשות\", \"סיעוד הוא שליחות\". הכשרה שמתמקדת בעובדות ובטכניקות ולא בהתבגרות אישית. גיוס סטודנטיות \"ברמה גבוהה\" למשימות פשוטות, והתוצאה: נשירה של 30–50%<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Avoidance of change<\/td>\n<td>הימנעות משינוי<\/td>\n<td>היאחזות במוכר גם כשאינו מתאים יותר. שינוי רק בנקודת משבר. תגובה לעומס משתנה בעוד נוקשות ועוד הוראות<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>ג. כיצד מערכת ההגנה מייצרת חרדה משנית ושוללת סיפוק<\/strong><\/p>\n<ol>\n<li><strong>איום מתמיד במשבר ובקריסה תפעולית<\/strong> (Threat of crisis and operational breakdown): המערכת מסורבלת ולא גמישה. היחס בין עבודה לכוח אדם משתנה בפתאומיות, ההחלטות איטיות כי האחריות מפוזרת, ומי שמחליט חסר מידע. התוצאה: חרדה וכעס.<\/li>\n<li><strong>ניוד מופרז של סטודנטיות<\/strong> (Excessive movement of student nurses): אבל על קשרים שנקטעו, זרות, חוסר הכנה (Janis, 1958: הכנה מוקדמת מקלה על אירועים טראומטיים), ריחוק הגנתי ועמדה של \"לא אכפת לי\".<\/li>\n<li><strong>תת-תעסוקה<\/strong> (Under-employment): גם בכמות, כי התכנון מכוון לשיאי עומס, וגם ברמה, כי המשימות מותאמות לחלשה בקטגוריה ושיקול הדעת מנוטרל. התוצאה: אשמה ותסכול. דוגמה: אחות שהעירה חולה משינה טבעית כדי לתת לו כדור שינה, כי כך הורו לה.<\/li>\n<li><strong>שלילת סיפוק אישי<\/strong> (Deprivation of personal satisfactions): ההצלחה מתפזרת כמו החרדה. הכרת התודה של המטופלים אינה מגיעה לאחות מסוימת. אין שבחים, רק נזיפות. הצוותים אינם יציבים ואין \"רוח צוות\". הסטודנטיות מקוות להיות תלויות ולקבל טיפול, אבל זוכות בכך רק כשהן חולות.<\/li>\n<\/ol>\n<p><strong>ד. הפרט מול מערכת ההגנה (ההיבט הפסיכולוגי הישיר)<\/strong><\/p>\n<ul>\n<li>רק יחידים מפעילים הגנות. ההתנהגות שלהם היא החוליה המקשרת בין ההגנות הנפשיות לבין המוסד.<\/li>\n<li>חברות בארגון מחייבת התאמה מספקת בין ההגנות האישיות לחברתיות. ההתאמה מושגת בהשלכה ובהפנמה חוזרות (Heimann, 1952). אם הפער גדול מדי, החברות נשברת, זמנית או לצמיתות.<\/li>\n<li>למצטרפים חדשים מערכת ההגנה היא נתון, \"מציאות חיצונית\" (Fenichel, 1946). במוסד נוקשה כמו שירות הסיעוד, הפרט נאלץ לשנות את הגנותיו כדי להתאים למערכת.<\/li>\n<li><strong>מחירי ההפנמה הכפויה של הגנות פרימיטיביות<\/strong>: פגיעה ביכולת ליצור סמלים ובחשיבה מופשטת, עיכוב באינטגרציה הנפשית ובפיתוח ידע ומיומנויות, הגבלת היכולת לדאגה ולחמלה, פגיעה בשורשי הסובלימציה, רגרסיה לרמה נמוכה מזו שלפני הכניסה לבית החולים, וחרדה פתולוגית מתמשכת, כי אי אפשר להבחין בין חרדה מציאותית לחרדה שמקורה בפנטזיה.<\/li>\n<\/ul>\n<p><strong>ה. תוצאות ההתערבות<\/strong><\/p>\n<ul>\n<li>הושגו: תוכנית קורסים מתוכננת לסטודנטיות, שמאזנת בין צורכי ההכשרה לצורכי כוח האדם, ומאגר רזרבי של אחיות ניידות כדי שמצבי חירום לא ישבשו את התוכנית. שני השינויים כמעט לא הפריעו להגנות הקיימות, ואף חיזקו אותן.<\/li>\n<li>לא הושג: ניסוי מוגבל בארגון המחלקה, ביטול רשימות המשימות לטובת שיבוץ של אחות למטופל. הבכירות דנו בהצעה \"באומץ וברצינות\", אבל לא הרגישו שהן מסוגלות להתקדם, למרות אזהרת החוקרים.<\/li>\n<\/ul>","practice":"<ul>\n<li><strong>לשאול \"מפני איזו חרדה זה מגן?\"<\/strong> כשפוגשים בבית הספר נוהל נוקשה, טקס שחוזר על עצמו, \"ועדה על כל דבר\", בדיקות כפולות או עמימות בשאלה מי אחראי. כך אפשר להבין את ההתנהגות הזו כהגנה חברתית ולא רק כחוסר יעילות.<\/li>\n<li><strong>לזהות פיצול והשלכה של אחריות<\/strong> בין דרגים: \"המורים לא אחראים\" מול \"ההנהלה נוקשה\", הורים מול צוות, מחנכת מול יועצת. כדאי לשים לב אם מדובר באותם אנשים במבט מלמעלה ומלמטה, ולא להצטרף לפיצול.<\/li>\n<li><strong>לשים לב להאצלה כלפי מעלה, ולפסיכולוג<\/strong>: הפניה של ילד לפסיכולוג או לוועדה עשויה לשמש לפעמים להעברת החרדה והאחריות, בדומה למטופלים שאושפזו כי המשפחה לא יכלה לשאת את המחלה בבית. ההבנה הזו עוזרת לא \"לקחת הכול\" ולהחזיר אחריות בצורה מותאמת.<\/li>\n<li><strong>לזכור שהמוסד משליך על אנשי הטיפול<\/strong>: הפסיכולוג, כמו האחות, עשוי להיות מושא להשלכות של דיכאון, חרדה ואחריות. את התחושות האלה אפשר להביא להדרכה ולהשתמש בהן כמידע על המערכת.<\/li>\n<li><strong>להיזהר בשינוי<\/strong>: שינוי מבני מערער הגנות ומשחרר חרדה, ולכן הוא מעורר התנגדות ועוינות. כדאי לתכנן התערבות מערכתית שמכילה את החרדה המשתחררת, ולא רק \"מתקנת נהלים\". מנגד, לשים לב ששינוי \"קל\" עלול רק לחזק את ההגנה הקיימת.<\/li>\n<li><strong>לבחון את ההתאמה שלך כמצטרף חדש<\/strong>: לבחון את ההתאמה בין ההגנות האישיות שלך לבין ההגנות של בית הספר ושל השפ\"ח. פער גדול מסביר תחושות זרות, שחיקה ודחייה בשנה הראשונה, ושווה להעלות אותו בהדרכה.<\/li>\n<li><strong>לשים לב לדה-פרסונליזציה<\/strong>: לזהות דיבור על תלמידים כקטגוריות (\"ה-ADHD של ה'2\", \"תיק הוועדה\") ולהחזיר את הילד כאדם שלם לשיחה, בעדינות.<\/li>\n<li><strong>לזכור את חשיבות שיקול הדעת והסיפוק<\/strong>: מערכת שמנטרלת שיקול דעת מייצרת אשמה ותסכול. בעבודה עם צוותים כדאי לחזק את שיקול הדעת המקצועי, ולא רק להוסיף נהלים.<\/li>\n<\/ul>","questions":"<ol>\n<li>אילו \"טקסים\", נהלים או מבנים בבית הספר שלך (או בשפ\"ח) ייתכן שמשמשים בעיקר להגנה מפני חרדה, ומהי החרדה הזו?<\/li>\n<li>היכן אתה מזהה פיצול של \"אחראיים\" מול \"חסרי אחריות\" בין קבוצות במערכת, ואיך אתה נמשך לקחת בו צד?<\/li>\n<li>אילו רגשות ואחריות \"מושלכים\" עליך כפסיכולוג, למשל בהפניות, ואיך תוכל להחזיר חלק מהם למערכת בצורה שתאפשר עיבוד ולא הימנעות?<\/li>\n<li>אם היית מציע שינוי מבני בבית הספר, אילו הגנות הוא עלול לערער, ואיך היית מכין את המערכת לחרדה שתשתחרר?<\/li>\n<li>כמצטרף חדש לשירות, אילו מהגנות הארגון אימצת? מה זה עולה לך, ומה זה מאפשר לך?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"It is hardly too much to say that the nurse did not nurse patients.\" (\"אין זו הגזמה רבה לומר שהאחות לא סיעדה מטופלים.\")<\/li>\n<li>\"If a mistake has been made, you must reprimand someone, even if you don't know who really did it.\" (אחות, staff nurse, מצוטטת במאמר)<\/li>\n<li>\"Defenses are, and can be, operated only by individuals. Their behavior is the link between their psychic defenses and the institution.\"<\/li>\n<li>\"The success and viability of a social institution are intimately connected with the techniques it uses to contain anxiety.\"<\/li>\n<\/ul>"},"level":"שנים ב'-ג' (טקסט יסוד לעבודה מערכתית; מתאים גם להעמקה בשנה ד')","stype":"מאמר (מחקר-התערבות סוציו-תרפויטי בארגון, בגישה פסיכואנליטית-מערכתית)","tldr":"המאמר מתאר מחקר-התערבות בשירות הסיעוד של בית חולים כללי להוראה בלונדון. שירות הסיעוד ביקש עזרה בתכנון שיבוץ האחיות-הסטודנטיות (500 סטודנטיות ו-150 אחיות מוסמכות), כי המערכת עמדה על סף קריסה. במהלך הבירור ה\"דיאגנוסטי\" גילו החוקרים רמה גבוהה מאוד של…","search":"המאמר מתאר מחקר-התערבות בשירות הסיעוד של בית חולים כללי להוראה בלונדון. שירות הסיעוד ביקש עזרה בתכנון שיבוץ האחיות-הסטודנטיות (500 סטודנטיות ו-150 אחיות מוסמכות), כי המערכת עמדה על סף קריסה. במהלך הבירור ה\"דיאגנוסטי\" גילו החוקרים רמה גבוהה מאוד של מתח וחרדה: שליש מהסטודנטיות לא סיימו את ההכשרה, הייתה תחלופה גבוהה בקרב הבכירות, ושיעורי המחלה היו גבוהים. לפי מנזיס-לית', מקור החרדה הוא שהמצב האובייקטיבי בעבודת הסיעוד (מחלה, סבל, מוות, מגע גופני אינטימי) דומה מאוד למצבי הפנטזיה הלא מודעים והפרימיטיביים שתיארה קליין. לכך מצטרפות השלכות של מטופלים ובני משפחה. כדי להתמודד, הארגון פיתח לאורך זמן, בשיתוף פעולה קולוזיבי ולא מודע, \"מערכת הגנה מובנית חברתית\": פיצול הקשר עם המטופל לרשימות משימות, דה-פרסונליזציה, הכחשת רגשות, טקסיות, בדיקות כפולות, פיזור אחריות ועוד. ההגנות האלה נשענות על מנגנונים פרימיטיביים של הימנעות. לכן הן אינן מאפשרות עיבוד אמיתי של החרדה, יוצרות \"חרדה משנית\", פוגעות ביעילות ובסיפוק, מעכבות את התבגרותן של האחיות ומקשות מאוד על שינוי. המסקנה: הצלחתו ושרידותו של מוסד קשורות קשר הדוק לדרכים שבהן הוא מכיל חרדה. מקור החרדה במשימה עצמה: האחות נושאת את ההשפעה המלאה, המיידית והמרוכזת של הטיפול בחולים: סבל, מוות, משימות דוחות ומפחידות, ומגע אינטימי שמעורר משאלות ליבידינליות. העבודה מעוררת רגשות חזקים וסותרים: רחמים, חמלה ואהבה, אשמה וחרדה, שנאה וטינה כלפי המטופלים, וקנאה בטיפול שהם מקבלים. הדמיון בין המציאות לפנטזיה: המצב האובייקטיבי מעורר מחדש מצבי פנטזיה אינפנטיליים (לפי קליין): עולם פנימי מלא אובייקטים פגועים ומתים. כשהסמל \"נדבק\" לגמרי לאובייקט הפנטזיה (משוואה סמלית, לפי סגל), הוא חדל להכיל את החרדה, והחרדה הפרימיטיבית נחווית במלוא עוצמתה. השלכות מבחוץ: מטופלים ובני משפחה משליכים על בית החולים, ובעיקר על האחיות, דיכאון, חרדה, פחד וגועל, ולפעמים \"מחזירים\" אליו את האחריות על החלטות. חלק מהמטופלים אושפזו כי הם ומשפחותיהם לא יכלו לשאת את המחלה בבית. מערכת הגנה מובנית חברתית (socially structured defense system, בעקבות Jaques, 1955): צורכי החברים בארגון במאבק בחרדה מעצבים את המבנה, התרבות ודרכי התפקוד שלו, בגבולות שהמשימה המרכזית והטכנולוגיה מציבות. המערכת נבנית בהסכמה קולוזיבית ולא מודעת, והופכת ל\"מציאות חיצונית\" שכל חבר חדש צריך להסתגל אליה. ההגנות מבוססות הימנעות: הן עוזרות לפרט להימנע מחוויה מודעת של חרדה, אשמה, ספק ואי-ודאות, אבל לא עוזרות לו להתמודד עם החרדה ולפתח יכולת לשאת אותה. החרדה \"מוכלת\" חלקית, אבל לא מעובדת. חרדה משנית: מערכת ההגנה עצמה מייצרת חרדה נוספת, כמו תחושת משבר מתמדת, ניודים תכופים, תת-תעסוקה ושלילת סיפוק, ובאותו זמן אינה מקלה על החרדה הראשונית. פיצול והשלכה של אחריות: כל אחות מפצלת ומשליכה את הדחפים \"חסרי האחריות\" שלה על הזוטרות ואת הנוקשות המשמעתית על הבכירות. כך הקונפליקט התוך-נפשי הופך לקונפליקט בין-אישי, שכואב פחות. ה\"אמת הנפשית\" הופכת גם לאמת אובייקטיבית, כי אנשים פועלים לפי התפקידים שהושלכו עליהם. התאמה בין הגנות אישיות להגנות חברתיות: את ההגנות מפעילים רק יחידים. החברות בארגון מחייבת התאמה מספקת בין מערכת ההגנה האישית לחברתית. פער גדול מדי מוביל לניתוק, למשל נשירה או דחייה. במוסד נוקשה, ההתאמה מושגת בעיקר בכך שהפרט משנה את הגנותיו. ה\"הפנמה הכפויה\" של הגנות פרימיטיביות מעכבת התבגרות ואף גורמת לרגרסיה. ההגנות פוגעות ביעילות: ההגנות גורמות לתחלופת צוות גבוהה, לסיעוד גרוע, להכשרה לקויה ואף משפיעות על שיעורי ההחלמה (Revans, 1959). \"חוסר היעילות הוא תוצאה בלתי נמנעת של מערכת ההגנה שנבחרה.\" התנגדות לשינוי: ההתנגדות לשינוי חברתי היא היאחזות לא מודעת במוסדות קיימים, כי שינוי מאיים על ההגנות. היא חזקה במיוחד כשההגנות פרנואידיות-סכיזואידיות. השינויים שהושגו בבית החולים (תוכנית קורסים ומאגר אחיות ניידות) דווקא חיזקו את ההגנות הקיימות. ההצעה לשינוי עמוק, ניסוי של שיבוץ אחות למטופל במקום רשימת משימות, לא יצאה לפועל. מערכת הגנה מובנית חברתית (Socially structured defense system / Social defense system) – הגנות שהוחצנו וקיבלו ממשות במבנה, בתרבות ובדרכי התפקוד של הארגון, ונוצרו בהסכמה קולוזיבית ולא מודעת בין חבריו. המשימה המרכזית (Primary task, לפי Rice, 1958) – המשימה שהארגון נוצר לבצע. בבית חולים: לטפל בחולים שאי אפשר לטפל בהם בבית. לפי המאמר, המשימה והטכנולוגיה רק מציבות גבולות, ובתוכם התרבות והמבנה נקבעים לפי הצרכים הפסיכולוגיים של החברים. פנטזיה / פַנטזיה (fantasy / phantasy) – פנטזיה מודעת לעומת פנטזיה לא מודעת. המצב האובייקטיבי בסיעוד מעורר מחדש מצבי פנטזיה אינפנטיליים. ייצוג סמלי לעומת משוואה סמלית (Symbolic representation vs. symbolic equation, לפי Segal, 1957) – כדי שסמל יכיל חרדה, הוא צריך לייצג את אובייקט הפנטזיה בלי להיות זהה לו. כשהם מתמזגים, החרדה מתעוררת במלוא עוצמתה. דה-פרסונליזציה וקטגוריזציה (Depersonalization, categorization) – מחיקת הייחודיות של המטופל ושל האחות (\"הכבד במיטה 10\"; המדים כסמל לאחידות). ריחוק והכחשת רגשות (Detachment and denial of feelings) – ריחוק מקצועי שהושג בדרך קונקרטית, דרך ניודים תכופים, יחד עם טכניקות דיכוי (\"stiff upper lip\"). ביצוע טקסי של משימות (Ritual task-performance) – הוראות מדויקות ומחייבות שמבטלות את הצורך להחליט, ולכן גם את החרדה שבהחלטה. בדיקות ובדיקות-נגד (Checks and counterchecks) – דחיית המחויבות הסופית ופיזור משקל ההחלטה. חלוקה מחדש קולוזיבית של אחריות וחוסר-אחריות (Collusive social redistribution of responsibility and irresponsibility) – פיצול והשלכה: הזוטרות \"חסרות אחריות\" והבכירות \"נוקשות\". ערפול מכוון בחלוקת האחריות (Purposeful obscurity) – תפקידים וגבולות לא מוגדרים, ואחריות מפוזרת. המאמר מכנה זאת \"מדיניות של אי-עשייה\" (a policy for inactivity). האצלה כלפי מעלה (Delegation to superiors) – משימות \"נדחפות\" במעלה ההיררכיה כדי להתנער מאחריות עליהן. חרדה ראשונית לעומת חרדה משנית (Primary / secondary anxiety) – החרדה שמקורה במשימה, לעומת החרדה שמערכת ההגנה עצמה מייצרת. התאמה בין הגנות אישיות להגנות חברתיות; הפנמה כפויה (Matching; forced introjection) – תנאי לחברות בארגון. כשהמוסד נוקשה, הפרט נאלץ לאמץ את הגנותיו, במחיר התבגרות וסובלימציה. שיקול דעת (Discretion, לפי Jaques, 1956) – רמת האחריות שאדם חווה בעבודה תלויה רק בהפעלת שיקול דעת, ולא בביצוע מה שנקבע מראש. הגנות פרנואידיות-סכיזואידיות (Paranoid-schizoid defenses, לפי קליין) – הגנות פרימיטיביות של פיצול והשלכה. מוסדות שנשענים עליהן מתנגדים לשינוי יותר מכולם."},{"id":"armstrong","title":"The Institution in the Mind","authors":"Armstrong","year":"","cite":"Armstrong, D. (1997). The 'institution in the mind': Reflections on the relation of psycho-analysis to work with institutions. Free Associations, 7, 1-14.","url":"https://pep-web.org/browse/document/FA.007A.0001A","kind":"theory","desc":"המושג \"הארגון בראש\": הייצוג הפנימי של הארגון אצל מי שעובד בו, כמקור מידע על הארגון עצמו. גרסה מעודכנת של המאמר מופיעה כפרק בספר Organization in the Mind (Routledge, 2005).","urlLabel":"רשומת המאמר ב-PEP-Web (קריאה מלאה דורשת מנוי)","placements":[["s3","system"]],"extra":false,"ref":"Armstrong","inFolder":false,"tldr":"המושג \"הארגון בראש\": הייצוג הפנימי של הארגון אצל מי שעובד בו, כמקור מידע על הארגון עצמו. גרסה מעודכנת של המאמר מופיעה כפרק בספר Organization in the Mind (Routledge, 2005).","search":"המושג \"הארגון בראש\": הייצוג הפנימי של הארגון אצל מי שעובד בו, כמקור מידע על הארגון עצמו. גרסה מעודכנת של המאמר מופיעה כפרק בספר Organization in the Mind (Routledge, 2005)."},{"id":"fuchs","title":"המפה המערכתית לפי אינה פוקס","authors":"אינה פוקס","year":"1995","cite":"פוקס, א' (1995). המפה המערכתית. (מצגת)","url":null,"kind":"tool","desc":null,"file":{"orig":"2מצגת המפה המערכתית לפי  אינה פוקס.pdf","ext":"pdf","pdf":"fuchs.pdf","pages":6,"bytes":118562},"placements":[["s3","system"]],"extra":false,"ref":"המפה של פוקס","inFolder":true,"srcTitle":"מודל המפה המערכתית של אינה פוקס, 1995 (מצגת), ו\"אבחון מערכת\"","secs":{"abstract":"<p>המסמך הוא מצגת ובה שני חלקים. החלק הראשון מציג את \"מודל המפה המערכתית\" של אינה פוקס (1995). לפי המודל, בית הספר הוא מערכת של רכיבים שקשורים זה בזה. בדיאגרמה המרכזית הרכיב האידיאולוגי נמצא במרכז, וסביבו חמישה רכיבים: אנושי, פדגוגי, מרחב וחומר, ארגוני ומנגנונים. ביניהם חיצים, והם מסודרים במעגל. השקופיות מפרטות את התוכן של כל רכיב: המרכיב האנושי (מי שותף, בתוך בית הספר ומחוצה לו), הפדגוגי, הכלכלי, הארגוני, מרכיב הנהלים, והמרכיב הרעיוני-אידיאולוגי. אחריהן מופיעה דיאגרמה נוספת, \"המפה הבית ספרית ומרכיביה\". החלק השני, \"אבחון מערכת\" (מריה טרנטייב, שפ\"ח אור יהודה), מציע שבעה ממדים לאבחון תהליכי וחוויתי של בית הספר: קצב ויציבות השגרה; תפקוד; תחושת מוגנות והתמודדות עם שבירתה; מערכת יחסים; המשגה והבנות משותפות; מוטיבציה להתפתחות; ותרבות בית ספרית ואווירה. המסמך כולו בנוי מרשימות, בלי טקסט הסברי. ערכו העיקרי הוא כצ'קליסט מובנה למיפוי בית ספר.<\/p>","ideas":"<ul>\n<li>בית הספר מובן כמערכת שרכיביה תלויים זה בזה. בדיאגרמה של פוקס כל רכיב מחובר בחיצים לרכיב המרכזי ולרכיבים הסמוכים במעגל.<\/li>\n<li>הרכיב הרעיוני-אידיאולוגי (השקפת עולם, חזון, \"אני מאמין\", מטרות, פילוסופיה חינוכית, מדיניות) ממוקם במרכז המפה, וכל שאר הרכיבים מחוברים אליו.<\/li>\n<li>המרכיב האנושי חורג מגבולות בית הספר. הוא כולל גם את משרד החינוך (מחוז, מטה, פיקוח, מדריכים), את הקהילה (פוליטיקאים ו\"בעלי עניין\") ואת הבעלויות (רשויות מקומיות, רשתות).<\/li>\n<li>גם המשאבים, כלומר המרכיב הכלכלי או \"מרחב וחומר\" (תשתיות, סל שעות, כספי הורים, תרומות, ארגון פיזי של הכיתה), נכללים במפה המערכתית ולא רק ההיבטים הפסיכולוגיים.<\/li>\n<li>המרכיב הארגוני ומרכיב הנהלים עוסקים במבנים ובתהליכים: חלוקת תפקידים וסמכויות, סגנון מנהיגות, עבודת צוות, מערכת השעות, תקשורת, קבלת החלטות, טקסים, טיפול במשמעת, ערוצי דיווח ומנגנוני הערכה ובקרה.<\/li>\n<li>החלק של \"אבחון מערכת\" מוסיף ממדים תהליכיים וחוויתיים: יציבות השגרה ותגובה לשבירתה, יעילות התפקוד, תחושת מוגנות ברמות שונות, דינמיקות של יחסים ומנהיגות גלויה ונסתרת, נרטיב משותף, מוטיבציה להתפתחות ותרבות ואווירה.<\/li>\n<li>תחושת מוגנות מוגדרת שם כרב-רמתית: פיזית, מאלימות, מהתעללות רגשית, של מעמד חברתי, של חופש ביטוי, מחשיפה למידע מלחיץ ומשינויים לא רצויים. גם תגובת המערכת למשבר נבחנת: נגישות עזרה, מעגלי תקשורת, מי לוקח אחריות, הפקת לקחים ומניעה.<\/li>\n<li>הכלי מבקש במפורש לבחון \"איזון\": בין התערבות מערכתית להתערבויות בפרט, ובין חלקים לימודיים ל\"אנושיים\".<\/li>\n<li>בממד \"המשגה והבנות משותפות\" מופיע מושג ה\"נרטיב על רצף חיים של בית ספר: עבר, הווה, עתיד\", כלומר ההיסטוריה של בית הספר היא חלק מהאבחון.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>המפה המערכתית<\/strong> (אינה פוקס, 1995) – מודל שממפה את בית הספר לרכיבים שקשורים זה בזה, עם הרכיב האידיאולוגי במרכז.<\/li>\n<li><strong>המרכיב האנושי<\/strong> – כל השותפים: בבית הספר (מנהלים, הנהלה ובעלי תפקידים, מורים, צוות טיפולי, צוות מנהלה, תלמידים, הורים), במשרד החינוך, בקהילה ובבעלויות.<\/li>\n<li><strong>המרכיב הפדגוגי<\/strong> – תוכניות לימודים, חומרים, סביבה לימודית, שיטות ודרכי הוראה, בחינות, חינוך בלתי פורמלי והערכת לומדים.<\/li>\n<li><strong>המרכיב הכלכלי<\/strong> (\"מרחב וחומר\" בדיאגרמה) – תשתיות, סל שעות, כספי הורים, השתלמות מוסדית, צוות נוסף, ארגון פיזי ותרומות.<\/li>\n<li><strong>המרכיב הארגוני<\/strong> – חלוקת תפקידים וסמכויות, סגנון מנהיגות, עבודת צוות, מבנה בית הספר, מערכת השעות, מבנה היום, תקשורת וקבלת החלטות.<\/li>\n<li><strong>מרכיב הנהלים<\/strong> (\"מנגנונים\" בדיאגרמה) – טקסים ואירועים, טיפול במשמעת, ערוצי תקשורת ודיווח, ומנגנוני הערכה ובקרה.<\/li>\n<li><strong>המרכיב הרעיוני-אידיאולוגי<\/strong> – השקפת עולם וחזון (\"אני מאמין\"), מטרות ויעדים, פילוסופיה חינוכית, עקרונות ועמדות, ומדיניות מוסדית.<\/li>\n<li><strong>אבחון מערכת<\/strong> – (בחלק של טרנטייב) הערכה של בית הספר לפי ממדים תהליכיים וחוויתיים: שגרה, תפקוד, מוגנות, יחסים, הבנות משותפות, מוטיבציה ותרבות.<\/li>\n<li><strong>תחושת מוגנות<\/strong> – מושג רב-רמתי שכולל גם את האופן שבו בית הספר מבין \"מה זה מוגנות או פגיעה\", ואת תגובתו לשבירת המוגנות.<\/li>\n<li><strong>נרטיב בית ספרי<\/strong> – סיפור הרצף של בית הספר: עבר, הווה ועתיד.<\/li>\n<li><strong>מנהל כ-\"public figure\"<\/strong> – אנשי הצוות, ובראשם המנהל, כדמויות ציבוריות שמעצבות את תרבות בית הספר.<\/li>\n<\/ul>","models":"<h3>חלק א': מודל המפה המערכתית של אינה פוקס, 1995<\/h3>\n<p><strong>הדיאגרמה:<\/strong> במרכז עיגול \"אידיאולוגי\". סביבו חמישה עיגולים: <strong>אנושי<\/strong> (למעלה), <strong>מנגנונים<\/strong> (ימין), <strong>ארגוני<\/strong> (ימין למטה), <strong>מרחב וחומר<\/strong> (שמאל למטה), <strong>פדגוגי<\/strong> (שמאל). חיצים רחבים מחברים בין המרכז לכל אחד מהרכיבים. חיצים דקים דו-כיווניים מחברים בין רכיבים סמוכים, וקווים מקווקווים יוצרים מעגלים סביב המבנה.<\/p>\n<p><strong>1. המרכיב האנושי<\/strong><\/p>\n<ul>\n<li><strong>בית הספר:<\/strong><ul>\n<li>מנהל/ים<\/li>\n<li>הנהלה ובעלי תפקידים<\/li>\n<li>מורים<\/li>\n<li>צוות טיפולי<\/li>\n<li>צוות מנהלה<\/li>\n<li>תלמידים<\/li>\n<li>הורים<\/li>\n<\/ul>\n<\/li>\n<li><strong>משרד החינוך:<\/strong><ul>\n<li>מחוז ומטה<\/li>\n<li>פיקוח, מדריכים<\/li>\n<\/ul>\n<\/li>\n<li><strong>קהילה:<\/strong><ul>\n<li>פוליטיקאים ו\"בעלי עניין\"<\/li>\n<\/ul>\n<\/li>\n<li><strong>בעלויות:<\/strong><ul>\n<li>רשויות מקומיות, רשתות<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p><strong>2. המרכיב הפדגוגי<\/strong><\/p>\n<ul>\n<li>תוכניות לימודים<\/li>\n<li>חומרי הלמידה<\/li>\n<li>הסביבה הלימודית<\/li>\n<li>שיטות ההוראה<\/li>\n<li>דרכי ההוראה<\/li>\n<li>מבנה הבחינות ופיזורן<\/li>\n<li>החינוך הבלתי פורמלי: חינוך חברתי, טיולים...<\/li>\n<li>הערכת לומדים: מבחנים, דרכים חלופיות<\/li>\n<\/ul>\n<p><strong>3. המרכיב הכלכלי<\/strong><\/p>\n<ul>\n<li>תשתיות: מבנים, חדרי ספח, מעבדות, טכנולוגיה<\/li>\n<li>סל שעות: תקן משרד, תמיכת בעלות<\/li>\n<li>כספי הורים<\/li>\n<li>השתלמות מוסדית<\/li>\n<li>צוות אחר: פנימי וחיצוני<\/li>\n<li>הארגון הפיזי של הכיתה והסביבה<\/li>\n<li>תרומות<\/li>\n<li>ועוד?.....<\/li>\n<\/ul>\n<p><strong>4. המרכיב הארגוני<\/strong><\/p>\n<ul>\n<li>חלוקת התפקידים והסמכויות<\/li>\n<li>סגנון המנהיגות של המנהל<\/li>\n<li>עבודת הצוות<\/li>\n<li>מבנה ביה\"ס: שכבות, כיתות, מגמות...<\/li>\n<li>מבנה מערכת השעות<\/li>\n<li>מבנה יום הלימודים וההפסקות<\/li>\n<li>אופי התקשורת<\/li>\n<li>תהליכי קבלת ההחלטות<\/li>\n<li>ועוד....<\/li>\n<\/ul>\n<p><strong>5. מרכיב הנהלים<\/strong><\/p>\n<ul>\n<li>טקסים ואירועים<\/li>\n<li>טיפול בבעיות משמעת, נוהג ונוהל<\/li>\n<li>ערוצי תקשורת ודיווח: \"ימי הורים\", מועצות פדגוגיות, פרסומים בכתב ובאמצעי המדיה השונים...<\/li>\n<li>קיום מנגנונים להערכה ובקרה בית ספרית: שאלונים, משובים, מדדים, ניתוח מסמכים<\/li>\n<\/ul>\n<p><strong>6. המרכיב הרעיוני-אידיאולוגי<\/strong> (במרכז המפה)<\/p>\n<ul>\n<li>השקפת עולם וחזון: \"אני מאמין\" חינוכי וחברתי<\/li>\n<li>מטרות ויעדים בית-ספריים<\/li>\n<li>פילוסופיה חינוכית<\/li>\n<li>עקרונות ועמדות<\/li>\n<li>מדיניות מוסדית<\/li>\n<\/ul>\n<p><strong>\"התבוננות נוספת על רכיבי המערכת\":<\/strong> דיאגרמה שכותרתה \"המפה הבית ספרית ומרכיביה\", עם קרדיט \"אינה פוקס\". יש בה שישה עיגולים כפולים: גרעין שבו שם הרכיב, וסביבו תת-רכיבים, ועיגול אחד נמצא במרכז. היא מציגה שוב את אותם רכיבים עם תת-רכיביהם.<\/p>\n<h3>חלק ב': \"אבחון מערכת\" (מריה טרנטייב, שפ\"ח אור יהודה)<\/h3>\n<p><strong>1. קצב ויציבות השגרה<\/strong><\/p>\n<ul>\n<li>תרבות התכנון ברמות שונות<\/li>\n<li>הקפדה על גבולות הזמן<\/li>\n<li>תגובות לשבירת השגרה: מה קורה כשמשהו משתנה וצריך להתאים הכול מחדש, יכולת להתגמש<\/li>\n<li>תכנון עבודה ניהולית<\/li>\n<li>זמן לחשיבה<\/li>\n<li>עבודת צוות כחלק מתוכנן של השגרה<\/li>\n<li>תכנון אירועים בית-ספריים לא לימודיים (משמשים לגיבוש, ליצירת קשרים בין קבוצות שונות וכו')<\/li>\n<\/ul>\n<p><strong>2. תפקוד<\/strong><\/p>\n<ul>\n<li>עד כמה התנאים הפיזיים עונים על צורכי התפקוד של בית הספר<\/li>\n<li>הגדרת תפקידים וציפיות מכולם: עד כמה כל אחד יודע מה הוא עושה, ועד כמה זה יעיל<\/li>\n<li>יעילות של מעגלי תקשורת<\/li>\n<li>כללים שמחזקים את התפקוד (משמעת, עונשים...)<\/li>\n<li>אחריות של בעלי תפקידים<\/li>\n<li>איזון בין חלקים לימודיים ל\"אנושיים\"<\/li>\n<li>שיתוף פעולה עם גורמים מחוץ לבית הספר כחלק מתפקודו (קשר עם ההורים, מועדוניות, גורמים ייעוציים וכו')<\/li>\n<\/ul>\n<p><strong>3. תחושה של מוגנות והתמודדות במצבים של שבירת תחושת מוגנות<\/strong><\/p>\n<ul>\n<li>חשוב איך מבינים בבית הספר מה זה מוגנות או פגיעה.<\/li>\n<li>אפשר לדבר על תחושת מוגנות בכמה רמות:<ul>\n<li>מוגנות בסיסית מבחינה פיזית (מקומות מסוכנים, השפעה על בריאות וכו')<\/li>\n<li>מוגנות מאלימות פיזית<\/li>\n<li>מוגנות מהתעללות רגשית<\/li>\n<li>מוגנות של מעמד חברתי<\/li>\n<li>מוגנות כחופש ביטוי עצמי ללא בקרה מיותרת<\/li>\n<li>מוגנות מחשיפה לאינפורמציה מלחיצה<\/li>\n<li>מוגנות משינויים אישיים לא רצויים<\/li>\n<\/ul>\n<\/li>\n<li>נגישות של עזרה במקרה של פגיעה או חשש לפגיעה: האם יש למי לפנות, במי להיעזר<\/li>\n<li>מידע על קושי, פגיעה ומשבר: איך פועלים מעגלי התקשורת?<\/li>\n<li>מצבי משבר כבדיקה של תפקוד בעלי התפקידים: עד כמה בית הספר לוקח אחריות על טיפול ותמיכה במשבר, ומי לוקח את האחריות<\/li>\n<li>איזון בין התערבות מערכתית לבין התערבויות בפרט<\/li>\n<li>יכולת להפיק לקחים ממצבי משבר<\/li>\n<li>עבודה למניעת פגיעות מעלה את תחושת המוגנות.<\/li>\n<\/ul>\n<p><strong>4. מערכת יחסים<\/strong><\/p>\n<ul>\n<li>נכונות לשיתוף פעולה שגרתי<\/li>\n<li>קשרים בין-אישיים<\/li>\n<li>נורמות קבוצתיות<\/li>\n<li>לחצים ומתחים במערכת היחסים, קבוצות ומנהיגים נסתרים וגלויים<\/li>\n<li>מנהיגות וסגנון ניהול, והשפעתם על הדינמיקות החברתיות<\/li>\n<li>דינמיקות בין תת-קבוצות פורמליות (כיתות, שכבות...)<\/li>\n<li>תחושת לכידות<\/li>\n<\/ul>\n<p><strong>5. המשגה והבנות משותפות<\/strong><\/p>\n<ul>\n<li>נרטיב על רצף החיים של בית הספר: עבר, הווה, עתיד<\/li>\n<li>כללים, מטלות ומטרות קצרי טווח: הבנה אחידה<\/li>\n<li>גישה לבניית קשר<\/li>\n<li>אידיאולוגיה מנהלית<\/li>\n<li>חזון בית הספר, גישה חינוכית<\/li>\n<li>ציפיות לרמת מקצועיות והשקעה, מסירות לבית הספר<\/li>\n<li>המשגה של תרבות בית-ספרית<\/li>\n<\/ul>\n<p><strong>6. מוטיבציה להתפתחות<\/strong><\/p>\n<ul>\n<li>התאמה בין ערכים אישיים לבין ערכים ודרישות של בית הספר<\/li>\n<li>בית ספר כמקום להעשרה: חשיפה לדברים חדשים<\/li>\n<li>קשר אישי כגורם שמלווה שינוי<\/li>\n<li>יצירת אווירה חברתית שתומכת בהתפתחות<\/li>\n<li>קידום פרויקטים אישיים מיוחדים מעבר לדרישות הבסיסיות של העבודה או הלמידה<\/li>\n<li>הומור, משחק, שחרור, שמחה... בחיי בית הספר<\/li>\n<li>פתיחות להשפעות חיצוניות<\/li>\n<\/ul>\n<p><strong>7. תרבות בית ספרית, אווירה, style<\/strong><\/p>\n<ul>\n<li>אסתטיקה בתנאים הפיזיים, השקעה במראה החיצוני<\/li>\n<li>הרגלים בית-ספריים<\/li>\n<li>סגנון התקשורת בין מורים לתלמידים<\/li>\n<li>סגנון התקשורת וההתנהלות בין אנשי הצוות<\/li>\n<li>אנשי צוות (קודם כל המנהל) כ-\"public figure\"<\/li>\n<li>אירועים בית-ספריים<\/li>\n<li>סמלים בית-ספריים (כולל סמלים חזותיים, מילוליים וכו')<\/li>\n<\/ul>\n<h3>שאלות מנחות למיפוי<\/h3>\n<ul>\n<li><strong>אידיאולוגי<\/strong>: מהו ה\"אני מאמין\" המוצהר? האם המטרות, העקרונות והמדיניות נגזרים ממנו? האם הוא נוכח בשאר הרכיבים?<\/li>\n<li><strong>אנושי<\/strong>: מי השחקנים בתוך בית הספר ומחוצה לו (פיקוח, רשות, רשת, קהילה)? מי בעל ההשפעה?<\/li>\n<li><strong>פדגוגי<\/strong>: איך מלמדים ומעריכים? מה מקומו של החינוך הבלתי פורמלי?<\/li>\n<li><strong>כלכלי / מרחב וחומר<\/strong>: אילו משאבים יש (סל שעות, כספי הורים, תשתיות, צוות נוסף), ואיך מאורגן המרחב הפיזי?<\/li>\n<li><strong>ארגוני<\/strong>: מי מחליט, ואיך? מה סגנון המנהיגות? איך בנויים הצוותים, מערכת השעות והתקשורת?<\/li>\n<li><strong>נהלים / מנגנונים<\/strong>: אילו טקסים, נהלי משמעת, ערוצי דיווח ומנגנוני בקרה קיימים, ועד כמה הם פועלים בפועל?<\/li>\n<\/ul>","practice":"<ul>\n<li>להשתמש בשישת הרכיבים כתבנית מסודרת ל\"היכרות עם בית ספר\" בתחילת שנה, ולמלא כל רכיב תוך כדי שיחות, תצפיות וקריאת מסמכים.<\/li>\n<li>לשלב את המיפוי עם שיחת החוזה עם המנהל (ראו הכלי של תורי-מגדסי): נתוני הרקע וצורכי המערכת שם נשענים על רבים מהפריטים כאן, כמו סל שעות, אוכלוסייה, בעלי תפקידים, נהלים וחזון.<\/li>\n<li>להרחיב את \"המרכיב האנושי\" מעבר לכיתה ולצוות: לברר מי בפיקוח, ברשות, ברשת ובקהילה משפיע על בית הספר.<\/li>\n<li>להשתמש בממד \"תחושת מוגנות\" כצ'קליסט להיערכות לחירום ולמשבר: למי פונים, איך זורם המידע, מי לוקח אחריות, ואיך מאזנים בין התערבות מערכתית להתערבות בפרט.<\/li>\n<li>לבדוק את \"קצב ויציבות השגרה\" ואת \"התגובה לשבירת השגרה\" כמדד לגמישות ולחוסן של בית הספר. הם משפיעים גם על האפשרות לקיים עבודה פסיכולוגית מתוכננת.<\/li>\n<li>לאסוף את \"הנרטיב\" של בית הספר (עבר, הווה, עתיד), למשל אירועים מכוננים, חילופי מנהלים ומשברים, כחלק מהאבחון המערכתי.<\/li>\n<li>לשים לב לקבוצות ולמנהיגים \"נסתרים וגלויים\" ולדינמיקות בין תת-קבוצות. הם חיוניים להבנת התנגדויות ובריתות.<\/li>\n<li>להציג את המפה בהדרכה כבסיס לפורמולציה מערכתית: איפה הפערים בין הרכיבים, למשל בין החזון האידיאולוגי לבין הנהלים או המשאבים בפועל?<\/li>\n<\/ul>","questions":"<ol>\n<li>איזה רכיב במפה אתה מכיר הכי פחות בבית הספר שלך, ואיך תוכל ללמוד עליו?<\/li>\n<li>האם החזון ה\"אידיאולוגי\" של בית הספר משתקף ברכיבים הארגוני, הפדגוגי והנהלים, או שיש פער? מה הפער מלמד?<\/li>\n<li>איך בית הספר מבין \"מוגנות\" ו\"פגיעה\"? מה קרה במשבר האחרון: מי לקח אחריות, ואיך זרם המידע?<\/li>\n<li>אילו קבוצות או מנהיגים \"נסתרים\" פועלים בבית הספר, ואיך הם משפיעים על הדינמיקה?<\/li>\n<li>מהו הנרטיב של בית הספר על עצמו, ואיפה אתה, כפסיכולוג, ממוקם בתוכו?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"חשוב, איך בבית ספר מבינים, מה זה מוגנות או פגיעה.\" (שקופית \"תחושה של מוגנות\")<\/li>\n<li>\"איזון בין התערבות מערכתית לבין התערבויות בפרט\" (שם)<\/li>\n<li>\"עבודה למניעת פגיעות מעלה תחושת מוגנות.\" (שם)<\/li>\n<li>\"קשר אישי כגורם מלווה שינוי.\" (שקופית \"מוטיבציה להתפתחות\")<\/li>\n<\/ul>"},"level":"שנה א' (כלי בסיס להיכרות עם בית ספר ולמיפוי שלו; מתאים גם לשימוש מעמיק בשנים ב'-ג')","stype":"מצגת / כלי (מפת מיפוי ואבחון מערכתי של בית ספר, בפורמט דפי מצגת להדפסה עם שורות להערות)","tldr":"המסמך הוא מצגת ובה שני חלקים. החלק הראשון מציג את \"מודל המפה המערכתית\" של אינה פוקס (1995). לפי המודל, בית הספר הוא מערכת של רכיבים שקשורים זה בזה. בדיאגרמה המרכזית הרכיב האידיאולוגי נמצא במרכז, וסביבו חמישה רכיבים: אנושי, פדגוגי, מרחב וחומר, ארגוני…","search":"המסמך הוא מצגת ובה שני חלקים. החלק הראשון מציג את \"מודל המפה המערכתית\" של אינה פוקס (1995). לפי המודל, בית הספר הוא מערכת של רכיבים שקשורים זה בזה. בדיאגרמה המרכזית הרכיב האידיאולוגי נמצא במרכז, וסביבו חמישה רכיבים: אנושי, פדגוגי, מרחב וחומר, ארגוני ומנגנונים. ביניהם חיצים, והם מסודרים במעגל. השקופיות מפרטות את התוכן של כל רכיב: המרכיב האנושי (מי שותף, בתוך בית הספר ומחוצה לו), הפדגוגי, הכלכלי, הארגוני, מרכיב הנהלים, והמרכיב הרעיוני-אידיאולוגי. אחריהן מופיעה דיאגרמה נוספת, \"המפה הבית ספרית ומרכיביה\". החלק השני, \"אבחון מערכת\" (מריה טרנטייב, שפ\"ח אור יהודה), מציע שבעה ממדים לאבחון תהליכי וחוויתי של בית הספר: קצב ויציבות השגרה; תפקוד; תחושת מוגנות והתמודדות עם שבירתה; מערכת יחסים; המשגה והבנות משותפות; מוטיבציה להתפתחות; ותרבות בית ספרית ואווירה. המסמך כולו בנוי מרשימות, בלי טקסט הסברי. ערכו העיקרי הוא כצ'קליסט מובנה למיפוי בית ספר. בית הספר מובן כמערכת שרכיביה תלויים זה בזה. בדיאגרמה של פוקס כל רכיב מחובר בחיצים לרכיב המרכזי ולרכיבים הסמוכים במעגל. הרכיב הרעיוני-אידיאולוגי (השקפת עולם, חזון, \"אני מאמין\", מטרות, פילוסופיה חינוכית, מדיניות) ממוקם במרכז המפה, וכל שאר הרכיבים מחוברים אליו. המרכיב האנושי חורג מגבולות בית הספר. הוא כולל גם את משרד החינוך (מחוז, מטה, פיקוח, מדריכים), את הקהילה (פוליטיקאים ו\"בעלי עניין\") ואת הבעלויות (רשויות מקומיות, רשתות). גם המשאבים, כלומר המרכיב הכלכלי או \"מרחב וחומר\" (תשתיות, סל שעות, כספי הורים, תרומות, ארגון פיזי של הכיתה), נכללים במפה המערכתית ולא רק ההיבטים הפסיכולוגיים. המרכיב הארגוני ומרכיב הנהלים עוסקים במבנים ובתהליכים: חלוקת תפקידים וסמכויות, סגנון מנהיגות, עבודת צוות, מערכת השעות, תקשורת, קבלת החלטות, טקסים, טיפול במשמעת, ערוצי דיווח ומנגנוני הערכה ובקרה. החלק של \"אבחון מערכת\" מוסיף ממדים תהליכיים וחוויתיים: יציבות השגרה ותגובה לשבירתה, יעילות התפקוד, תחושת מוגנות ברמות שונות, דינמיקות של יחסים ומנהיגות גלויה ונסתרת, נרטיב משותף, מוטיבציה להתפתחות ותרבות ואווירה. תחושת מוגנות מוגדרת שם כרב-רמתית: פיזית, מאלימות, מהתעללות רגשית, של מעמד חברתי, של חופש ביטוי, מחשיפה למידע מלחיץ ומשינויים לא רצויים. גם תגובת המערכת למשבר נבחנת: נגישות עזרה, מעגלי תקשורת, מי לוקח אחריות, הפקת לקחים ומניעה. הכלי מבקש במפורש לבחון \"איזון\": בין התערבות מערכתית להתערבויות בפרט, ובין חלקים לימודיים ל\"אנושיים\". בממד \"המשגה והבנות משותפות\" מופיע מושג ה\"נרטיב על רצף חיים של בית ספר: עבר, הווה, עתיד\", כלומר ההיסטוריה של בית הספר היא חלק מהאבחון. המפה המערכתית (אינה פוקס, 1995) – מודל שממפה את בית הספר לרכיבים שקשורים זה בזה, עם הרכיב האידיאולוגי במרכז. המרכיב האנושי – כל השותפים: בבית הספר (מנהלים, הנהלה ובעלי תפקידים, מורים, צוות טיפולי, צוות מנהלה, תלמידים, הורים), במשרד החינוך, בקהילה ובבעלויות. המרכיב הפדגוגי – תוכניות לימודים, חומרים, סביבה לימודית, שיטות ודרכי הוראה, בחינות, חינוך בלתי פורמלי והערכת לומדים. המרכיב הכלכלי (\"מרחב וחומר\" בדיאגרמה) – תשתיות, סל שעות, כספי הורים, השתלמות מוסדית, צוות נוסף, ארגון פיזי ותרומות. המרכיב הארגוני – חלוקת תפקידים וסמכויות, סגנון מנהיגות, עבודת צוות, מבנה בית הספר, מערכת השעות, מבנה היום, תקשורת וקבלת החלטות. מרכיב הנהלים (\"מנגנונים\" בדיאגרמה) – טקסים ואירועים, טיפול במשמעת, ערוצי תקשורת ודיווח, ומנגנוני הערכה ובקרה. המרכיב הרעיוני-אידיאולוגי – השקפת עולם וחזון (\"אני מאמין\"), מטרות ויעדים, פילוסופיה חינוכית, עקרונות ועמדות, ומדיניות מוסדית. אבחון מערכת – (בחלק של טרנטייב) הערכה של בית הספר לפי ממדים תהליכיים וחוויתיים: שגרה, תפקוד, מוגנות, יחסים, הבנות משותפות, מוטיבציה ותרבות. תחושת מוגנות – מושג רב-רמתי שכולל גם את האופן שבו בית הספר מבין \"מה זה מוגנות או פגיעה\", ואת תגובתו לשבירת המוגנות. נרטיב בית ספרי – סיפור הרצף של בית הספר: עבר, הווה ועתיד. מנהל כ-\"public figure\" – אנשי הצוות, ובראשם המנהל, כדמויות ציבוריות שמעצבות את תרבות בית הספר."},{"id":"rubric","title":"מחוון לתחום המערכתי","authors":"דניאלה ב.","year":"","cite":"דניאלה ב. מצגת מחוון לתחום המערכתי.","url":null,"kind":"presentation","desc":null,"file":{"orig":"מצגת לתחום המערכתי.pptx","ext":"pptx","pdf":"rubric.pdf","pages":14,"bytes":821723},"placements":[["s3","system"]],"extra":false,"ref":"המחוון המערכתי","inFolder":true,"srcTitle":"מחוון לתחום המערכתי","secs":{"abstract":"<p>המצגת מגדירה מה אמור פסיכולוג חינוכי לדעת בתחום המערכתי לקראת סוף ההתמחות, ומה מצופה ממנו בהצגת מקרה מערכתי בבחינה. עליו להציג באופן מומשג ואינטגרטיבי התערבות שבה מושא האבחון וההתערבות הוא המערכת, מתוך ראיית הילדים כ\"לקוחות מרכזיים\", ובמטרה לקדם סביבה מיטיבה נפשית באמצעות השפעה מערכתית. הנבחן צריך להכיר את חלקי המערכת (אקלים, חזון, מטרות, מבנים, הגדרות תפקיד, שגרות, דרכי תקשורת ודינמיקת יחסים), לקשר בין סיבת האבחון, הממצאים וההתערבות דרך שתי נקודות מבט תיאורטיות, להציג התערבויות בשניים-שלושה ממדים של המערכת, ולהראות איך נבדקה האפקטיביות. המצגת מציגה כדוגמה תיאורטית את המודל האקולוגי של ברונפנברנר, מפרטת את הציפיות מהפסיכולוג בסיום ההתמחות, ומסתיימת בתרשים זרימה לארגון מקרה מערכתי.<\/p>","ideas":"<ul>\n<li>מושא האבחון וההתערבות הוא המערכת; הילדים הם הלקוחות המרכזיים, וההשפעה עליהם עוברת דרך המערכת.<\/li>\n<li>נדרש קשר מומשג בין סיבת האבחון, הממצאים וההתערבות, דרך שתי נקודות מבט תיאורטיות.<\/li>\n<li>יש להציג התערבויות בלפחות 2-3 ממדים של המערכת, ולהסביר איך נבדקה האפקטיביות.<\/li>\n<li>התערבות בחלק מצומצם של המערכת (כיתה, צוות) צריכה להיות מוסברת ביחס למערכת כולה: למה דווקא שם, ואיך היא משחררת חסמים ומשנה מבנה, שגרות, אקלים ודינמיקה.<\/li>\n<li>אפשר להציג בבחינה אבחון של כל מסגרת חינוכית, כולל גן, או של תת-מערכת, כל עוד ההבנה המערכתית עמוקה.<\/li>\n<li>נדרשת יכולת אינטרוספקטיבית: לזהות העברה והעברה נגדית, חרדות ומנגנוני הגנה, ואת השפעתם על העבודה ועל היחסים במערכת.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>המודל האקולוגי של ברונפנברנר<\/strong> — מודל הממוקד באדם המתפתח, בסביבתו וביחסי הגומלין ביניהם, בארבע רמות.<\/li>\n<li><strong>מיקרוסיסטם<\/strong> — המערכות שבהן הילד גדל ושמשפיעות עליו ישירות: משפחה, חברים, בית ספר.<\/li>\n<li><strong>מזוסיסטם<\/strong> — הקשרים בין המערכות הישירות.<\/li>\n<li><strong>אקזוסיסטם<\/strong> — מערכות שמשפיעות על הילד אף שאינו פעיל בהן (למשל יחסי הגננת והסייעת).<\/li>\n<li><strong>מקרוסיסטם<\/strong> — התרבות והאידיאולוגיה של החברה הרחבה.<\/li>\n<li><strong>מפה מערכתית מרובדת<\/strong> — קריאה של המערכת ברבדים שונים, בעזרת המשגה תיאורטית.<\/li>\n<\/ul>","models":"<p><strong>הציפיות מפסיכולוג/ית חינוכי/ת בסיום ההתמחות:<\/strong><\/p>\n<ul>\n<li>לקרוא מפה מערכתית מרובדת ולהשתמש בהמשגה תיאורטית.<\/li>\n<li>לזהות מוקדי התערבות והשפעה.<\/li>\n<li>ליצור שותפויות עם בעלי תפקידים ולתכנן התערבות מערכתית רחבה.<\/li>\n<li>להשתמש בהבנה הפסיכולוגית הפרטנית והקבוצתית כדי לקדם עבודה צוותית ומבנים מערכתיים.<\/li>\n<li>להבין את חשיבות העבודה עם מנהל המערכת כמנוף להשפעה מערכתית.<\/li>\n<li>להבין את חשיבות העמדה הפרו-אקטיבית של השפעה ונקיטת עמדה.<\/li>\n<li>לעשות התאמה מקומית ותרבותית לקהילות מקבלות השירות.<\/li>\n<li>לגלות יכולת אינטרוספקטיבית לזהות העברה והעברה נגדית, חרדות ומנגנוני הגנה, ולהשתמש בתובנות באבחון ובהתערבות.<\/li>\n<\/ul>\n<p><strong>תרשים זרימה לארגון מקרה מערכתי:<\/strong><\/p>\n<ol>\n<li>רקע: תיאור הארגון<\/li>\n<li>סיבת האבחון הארגוני וכלי האבחון<\/li>\n<li>תופעות: הקשורות באפיוני המערכת; בנשות הצוות; בתלמידים; בהורים; בפסיכולוגיות<\/li>\n<li>ממצאי האבחון: ניתוח והמשגה<\/li>\n<li>מטרת ההתערבות המערכתית — בדוגמה שבמצגת: יצירת מבנים לעבודה מערכתית; פיתוח מיומנויות רגשיות וחוסן בצוות החינוכי; החזקת נושא האובדנות ומקרי הקצה; התערבויות פרטניות קצרות מועד<\/li>\n<li>תוצאות<\/li>\n<li>אינטרוספקציה ומבט אישי של הפסיכולוג<\/li>\n<\/ol>","practice":"<ul>\n<li>לבחור מקרה מערכתי כבר בשנים ב'-ג' ולתעד אותו לפי תרשים הזרימה.<\/li>\n<li>לבחור מראש שתי עדשות תיאורטיות (למשל ברונפנברנר ופסיכואנליטית-מערכתית) ולהשתמש בהן לאורך כל המקרה.<\/li>\n<li>לתכנן מראש איך תיבדק האפקטיביות של ההתערבות.<\/li>\n<li>לנהל יומן אישי של תחושות, העברה נגדית ותגובות לאורך העבודה, כחומר לפרק האינטרוספקציה.<\/li>\n<\/ul>","questions":"<ul>\n<li>מה סיבת האבחון המערכתי שלי, ומי הגדיר אותה?<\/li>\n<li>באילו 2-3 ממדים של המערכת אני מתערב/ת, ולמה דווקא בהם?<\/li>\n<li>אם ההתערבות בתת-מערכת, איך היא מתקשרת למערכת כולה?<\/li>\n<li>אילו חרדות והגנות זיהיתי במערכת, ואיך הן השפיעו עליי?<\/li>\n<\/ul>","quotes":"<ul>\n<li>\"על הפסיכולוג להציג באופן מומשג ואינטגרטיבי התערבות פסיכולוגית, בה מושא האבחון וההתערבות הוא המערכת.\"<\/li>\n<li>\"הפסיכולוג מצופה להבין את השפעת הסביבה, ולהציג התערבויות במספר ממדים של המערכת (לפחות 2-3).\"<\/li>\n<\/ul>"},"level":"שנה ד'","stype":"מצגת (מחוון לבחינת הסיום בתחום המערכתי)","tldr":"המצגת מגדירה מה אמור פסיכולוג חינוכי לדעת בתחום המערכתי לקראת סוף ההתמחות, ומה מצופה ממנו בהצגת מקרה מערכתי בבחינה. עליו להציג באופן מומשג ואינטגרטיבי התערבות שבה מושא האבחון וההתערבות הוא המערכת, מתוך ראיית הילדים כ\"לקוחות מרכזיים\", ובמטרה לקדם…","search":"המצגת מגדירה מה אמור פסיכולוג חינוכי לדעת בתחום המערכתי לקראת סוף ההתמחות, ומה מצופה ממנו בהצגת מקרה מערכתי בבחינה. עליו להציג באופן מומשג ואינטגרטיבי התערבות שבה מושא האבחון וההתערבות הוא המערכת, מתוך ראיית הילדים כ\"לקוחות מרכזיים\", ובמטרה לקדם סביבה מיטיבה נפשית באמצעות השפעה מערכתית. הנבחן צריך להכיר את חלקי המערכת (אקלים, חזון, מטרות, מבנים, הגדרות תפקיד, שגרות, דרכי תקשורת ודינמיקת יחסים), לקשר בין סיבת האבחון, הממצאים וההתערבות דרך שתי נקודות מבט תיאורטיות, להציג התערבויות בשניים-שלושה ממדים של המערכת, ולהראות איך נבדקה האפקטיביות. המצגת מציגה כדוגמה תיאורטית את המודל האקולוגי של ברונפנברנר, מפרטת את הציפיות מהפסיכולוג בסיום ההתמחות, ומסתיימת בתרשים זרימה לארגון מקרה מערכתי. מושא האבחון וההתערבות הוא המערכת; הילדים הם הלקוחות המרכזיים, וההשפעה עליהם עוברת דרך המערכת. נדרש קשר מומשג בין סיבת האבחון, הממצאים וההתערבות, דרך שתי נקודות מבט תיאורטיות. יש להציג התערבויות בלפחות 2-3 ממדים של המערכת, ולהסביר איך נבדקה האפקטיביות. התערבות בחלק מצומצם של המערכת (כיתה, צוות) צריכה להיות מוסברת ביחס למערכת כולה: למה דווקא שם, ואיך היא משחררת חסמים ומשנה מבנה, שגרות, אקלים ודינמיקה. אפשר להציג בבחינה אבחון של כל מסגרת חינוכית, כולל גן, או של תת-מערכת, כל עוד ההבנה המערכתית עמוקה. נדרשת יכולת אינטרוספקטיבית: לזהות העברה והעברה נגדית, חרדות ומנגנוני הגנה, ואת השפעתם על העבודה ועל היחסים במערכת. המודל האקולוגי של ברונפנברנר — מודל הממוקד באדם המתפתח, בסביבתו וביחסי הגומלין ביניהם, בארבע רמות. מיקרוסיסטם — המערכות שבהן הילד גדל ושמשפיעות עליו ישירות: משפחה, חברים, בית ספר. מזוסיסטם — הקשרים בין המערכות הישירות. אקזוסיסטם — מערכות שמשפיעות על הילד אף שאינו פעיל בהן (למשל יחסי הגננת והסייעת). מקרוסיסטם — התרבות והאידיאולוגיה של החברה הרחבה. מפה מערכתית מרובדת — קריאה של המערכת ברבדים שונים, בעזרת המשגה תיאורטית."},{"id":"psa_map","title":"הגישה הפסיכואנליטית-מערכתית: מפת מושגים","authors":"לא צוין","year":"","cite":"גישה פסיכואנליטית מערכתית (דף עזר).","url":null,"kind":"tool","desc":null,"file":{"orig":"גישה הפסיכואנליטית -מערכתית.pdf","ext":"pdf","pdf":"psa_map.pdf","pages":2,"bytes":339902},"placements":[["s3","system"]],"extra":false,"ref":"מפת המושגים הפסיכואנליטית-מערכתית","inFolder":true,"srcTitle":"מהי הגישה/הדיסציפלינה הפסיכואנליטית-מערכתית","secs":{"abstract":"<p>המסמך מציג בשני עמודים את הגישה הפסיכואנליטית-מערכתית כשילוב של שתי מסורות תיאורטיות. בעמוד הראשון יש טבלה בת שלוש עמודות. בימין, \"התיאוריה הפסיכואנליטית\", מסודרת לפי ארבע רמות: פרט, קבוצה, ארגון וסביבה. ברמת הפרט מופיעים מושגים כמו לא מודע, חרדה, הגנות, השלכה, פיצול, הזדהות השלכתית, הכלה, העברה והעברה נגדית, אנאקטמנט והפוזיציות. ברמת הקבוצה: ולנסי, הקבוצה כשלם והנחות יסוד. ברמת הארגון: \"אקסטרפולציה מקבוצה לארגון\". בשמאל, \"תיאוריית המערכות הפתוחות\": משימה מרכזית, מערכת פתוחה (אינפוט, המרה, אאוטפוט), גבולות ותפקיד. בעמודה האמצעית, שכותרתה \"מקף\", שבעה מושגים שמחברים בין שתי התיאוריות, ובהם משימה מרכזית ותהפוכותיה, הגנה חברתית/ארגונית, הנחות יסוד מול קבוצת עבודה, סמכות, לקיחת תפקיד, מנהיגות והמיכל והכלתו. בעמוד השני יש שני תרשימים של \"הרעיון הסיסטמי\": מעגלים קונצנטריים (פרט בתוך קבוצה, בתוך ארגון, בתוך סביבה), וארבעה עיגולים שמחוברים זה לזה בחיצים דו-כיווניים. המסמך הוא מפה שמארגנת את אוצר המילים של הגישה.<\/p>","ideas":"<ul>\n<li>הגישה הפסיכואנליטית-מערכתית היא שילוב של שתי תיאוריות: התיאוריה הפסיכואנליטית ותיאוריית המערכות הפתוחות. בין השתיים עומד \"מקף\" של מושגים מחברים.<\/li>\n<li>המושגים הפסיכואנליטיים מוחלים על ארבע רמות: פרט, קבוצה, ארגון וסביבה. רוב המושגים נמצאים ברמת הפרט, וחלקם מופיעים שוב ברמת הקבוצה (למשל הזדהות השלכתית \"בקבוצה ובין קבוצות\").<\/li>\n<li>את ההבנה של הארגון מציג המסמך כ\"אקסטרפולציה מקבוצה לארגון\": מה שידוע על תהליכים לא מודעים בקבוצות מורחב לארגון כולו.<\/li>\n<li>מתיאוריית המערכות הפתוחות נלקחים ארבעה מושגים: משימה מרכזית; מערכת פתוחה (אינפוט, המרה, אאוטפוט); גבולות; ותפקיד.<\/li>\n<li>לגבולות יש ממדים רבים: תפקיד, סמכות, אחריות, זמן, טריטוריה, משימה, המחלקה, הארגון ועוד.<\/li>\n<li>המושגים המחברים מראים איך הלא מודע פועל בתוך מבנים ארגוניים: משימה מרכזית ותהפוכותיה, הגנה חברתית/ארגונית, קבוצת הנחות יסוד מול קבוצת עבודה, סמכות (מקורותיה והפעלתה), \"הדרמה של לקיחת תפקיד\", מנהיגות, והמיכל והכלתו.<\/li>\n<li>\"הרעיון הסיסטמי\" מוצג בשני אופנים משלימים. הראשון הוא הכלה הדרגתית: הפרט נמצא בתוך קבוצה, הקבוצה בתוך ארגון, והארגון בתוך סביבה. השני הוא השפעה הדדית: כל אחת מארבע הרמות קשורה בחיצים דו-כיווניים לכל האחרות.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>משימה מרכזית (Primary Task)<\/strong> – המשימה שהארגון חייב לבצע כדי להתקיים (לפי רייס, כפי שמובא אצל תורי-מגדסי ו-Menzies Lyth). במסמך: \"משימה מרכזית ותהפוכותיה\".<\/li>\n<li><strong>מערכת פתוחה: אינפוט, המרה, אאוטפוט<\/strong> – תפיסת הארגון כמערכת שקולטת חומרים מהסביבה, ממירה אותם ומוציאה תוצרים בחזרה לסביבה, דרך גבולותיה.<\/li>\n<li><strong>גבולות<\/strong> – הקווים שמגדירים תפקיד, סמכות, אחריות, זמן, טריטוריה, משימה, מחלקה וארגון.<\/li>\n<li><strong>הגנה חברתית/ארגונית<\/strong> – הגנות מפני חרדה שמובנות במבנה ובתרבות של הארגון (ראו Menzies Lyth).<\/li>\n<li><strong>קבוצת הנחות יסוד מול קבוצת עבודה<\/strong> – ההבחנה של ביון בין קבוצה שעוסקת במשימה לבין קבוצה שנשלטת בהנחות יסוד לא מודעות.<\/li>\n<li><strong>ולנסי (Valency)<\/strong> – מושג של ביון: נטייתו של הפרט להתחבר להנחות היסוד של הקבוצה.<\/li>\n<li><strong>הקבוצה כשלם<\/strong> – התייחסות לקבוצה כישות שיש לה תהליכים משלה, ולא רק כאוסף של פרטים.<\/li>\n<li><strong>הזדהות השלכתית<\/strong> – במסמך מופיעה גם ברמת הפרט וגם \"בקבוצה ובין קבוצות\".<\/li>\n<li><strong>שדה/מטריצה לא מודע/ת<\/strong> – הממד הלא מודע המשותף שבתוכו פועלים הפרטים.<\/li>\n<li><strong>מימוש בפעולה (אנאקטמנט)<\/strong> – ביטוי של תוכן לא מודע במעשה, ולא במילים או במחשבה.<\/li>\n<li><strong>פוזיציות: פרנואידית-סכיזואידית ודפרסיבית<\/strong> – שתי עמדות נפשיות לפי קליין.<\/li>\n<li><strong>סמכות, מקורותיה והפעלתה; הדרמה של לקיחת תפקיד; מנהיגות<\/strong> – מושגים מחברים שעוסקים באופן שבו אנשים נכנסים לתפקידים ופועלים בהם בתוך מבנה ארגוני.<\/li>\n<li><strong>המיכל והכלתו<\/strong> – מושג מחבר, על בסיס מושג המיכל-מוכל (ביון), שמוחל על הארגון והקבוצה.<\/li>\n<\/ul>","models":"<h3>עמוד 1: \"1. תיאוריה ומושגים כללי\": טבלה בת שלוש עמודות<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>התיאוריה הפסיכואנליטית<\/th>\n<th>\"מקף\" (המושגים המחברים)<\/th>\n<th>תיאוריית המערכות הפתוחות<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ביחס:<\/strong><\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><strong>1. לפרט – לא מודע<\/strong><\/td>\n<td>משימה מרכזית ותהפוכותיה<\/td>\n<td>משימה מרכזית<\/td>\n<\/tr>\n<tr>\n<td>מופעי הלא מודע<\/td>\n<td>הגנה חברתית/ארגונית<\/td>\n<td>מערכת פתוחה: אינפוט, המרה, אאוטפוט<\/td>\n<\/tr>\n<tr>\n<td>חרדה<\/td>\n<td>קבוצת הנחות יסוד למול קבוצת עבודה<\/td>\n<td>גבולות (תפקיד, סמכות, אחריות, זמן, טריטוריה, משימה, המחלקה, הארגון כו')<\/td>\n<\/tr>\n<tr>\n<td>הגנות<\/td>\n<td>סמכות, מקורותיה והפעלתה<\/td>\n<td>תפקיד<\/td>\n<\/tr>\n<tr>\n<td>השלכה<\/td>\n<td>הדרמה של לקיחת תפקיד<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>פיצול<\/td>\n<td>מנהיגות<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הזדהות השלכתית<\/td>\n<td>המיכל והכלתו<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>קנאה/תחרות<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>הכלה<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>העברה<\/td>\n<td><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>העברה נגדי כולוג בבית הספר.<\/li>\n<li>לשאול על כל תופעה ארגונית שאלות מתוך העמודה המחברת: מה המשימה המרכזית, ואיך היא \"התהפכה\"? איזו הגנה ארגונית פועלת כאן? האם הצוות מתפקד כקבוצת עבודה או כקבוצת הנחות יסוד? מי מחזיק בסמכות, ומאין היא באה? מי מכיל, ומה?<\/li>\n<li>להשתמש בהעברה ובהעברה נגדית כמידע לא רק בטיפול הפרטני, אלא גם בעבודה עם צוותים ועם מנהלים.<\/li>\n<li>לזכור את רמת \"הסביבה\" (קהילה, רשות, משרד החינוך) ולשלב אותה בעזרת המפה המערכתית של אינה פוקס.<\/li>\n<\/ul>","questions":"<ol>\n<li>בחר אירוע מבית הספר שלך. איך הוא נראה מכל אחת מארבע הרמות (פרט, קבוצה, ארגון, סביבה), ואיך הרמות משפיעות זו על זו?<\/li>\n<li>מהי המשימה המרכזית של הצוות שאתה עובד איתו, ומה \"תהפוכותיה\"? מתי הוא פועל כקבוצת עבודה ומתי כקבוצת הנחות יסוד?<\/li>\n<li>אילו גבולות (זמן, טריטוריה, סמכות, תפקיד) נפרצים או מטושטשים בעבודתך בבית הספר, ומה זה עשוי להגן מפניו?<\/li>\n<li>מה \"הדרמה של לקיחת תפקיד\" אצלך כמתמחה בבית הספר? איזו סמכות ניתנת לך, ואיזו אתה לוקח?<\/li>\n<li>מי מכיל את מי בבית הספר, ומה קורה כשהמיכל קורס?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"מהי הגישה/הדיסצפלינה הפסיכואנליטית-מערכתית\" (כותרת המסמך, כלשונה)<\/li>\n<li>\"קבוצת הנחות יסוד למול קבוצת עבודה\" (מושג מחבר בעמודת ה\"מקף\")<\/li>\n<li>\"הדרמה של לקיחת תפקיד\" (מושג מחבר בעמודת ה\"מקף\")<\/li>\n<li>\"ביטוי גרפי של הרעיון ה'סיסטמי'\" (כותרת עמוד 2)<\/li>\n<\/ul>"},"level":"שנה א' (כמפת התמצאות ואוצר מילים לעבודה המערכתית); להעמקה בשנים ב'-ג' יחד עם מקורות התיאוריה","stype":"מודל עבודה (מפת מושגים סכמטית ותרשימים)","tldr":"המסמך מציג בשני עמודים את הגישה הפסיכואנליטית-מערכתית כשילוב של שתי מסורות תיאורטיות. בעמוד הראשון יש טבלה בת שלוש עמודות. בימין, \"התיאוריה הפסיכואנליטית\", מסודרת לפי ארבע רמות: פרט, קבוצה, ארגון וסביבה. ברמת הפרט מופיעים מושגים כמו לא מודע, חרדה,…","search":"המסמך מציג בשני עמודים את הגישה הפסיכואנליטית-מערכתית כשילוב של שתי מסורות תיאורטיות. בעמוד הראשון יש טבלה בת שלוש עמודות. בימין, \"התיאוריה הפסיכואנליטית\", מסודרת לפי ארבע רמות: פרט, קבוצה, ארגון וסביבה. ברמת הפרט מופיעים מושגים כמו לא מודע, חרדה, ה תוצרים בחזרה לסביבה, דרך גבולותיה. גבולות – הקווים שמגדירים תפקיד, סמכות, אחריות, זמן, טריטוריה, משימה, מחלקה וארגון. הגנה חברתית/ארגונית – הגנות מפני חרדה שמובנות במבנה ובתרבות של הארגון (ראו Menzies Lyth). קבוצת הנחות יסוד מול קבוצת עבודה – ההבחנה של ביון בין קבוצה שעוסקת במשימה לבין קבוצה שנשלטת בהנחות יסוד לא מודעות. ולנסי (Valency) – מושג של ביון: נטייתו של הפרט להתחבר להנחות היסוד של הקבוצה. הקבוצה כשלם – התייחסות לקבוצה כישות שיש לה תהליכים משלה, ולא רק כאוסף של פרטים. הזדהות השלכתית – במסמך מופיעה גם ברמת הפרט וגם \"בקבוצה ובין קבוצות\". שדה/מטריצה לא מודע/ת – הממד הלא מודע המשותף שבתוכו פועלים הפרטים. מימוש בפעולה (אנאקטמנט) – ביטוי של תוכן לא מודע במעשה, ולא במילים או במחשבה. פוזיציות: פרנואידית-סכיזואידית ודפרסיבית – שתי עמדות נפשיות לפי קליין. סמכות, מקורותיה והפעלתה; הדרמה של לקיחת תפקיד; מנהיגות – מושגים מחברים שעוסקים באופן שבו אנשים נכנסים לתפקידים ופועלים בהם בתוך מבנה ארגוני. המיכל והכלתו – מושג מחבר, על בסיס מושג המיכל-מוכל (ביון), שמוחל על הארגון והקבוצה."},{"id":"cohen_parenting","title":"טיפול בהורות: הגישה האינטגרטיבית בעבודה עם הורים לילדים עם צרכים מיוחדים","authors":"אסתר כהן (עורכת)","year":"2017","cite":"כהן, א' (עורכת) (2017). טיפול בהורות: גישה אינטגרטיבית לטיפול בבעיות ילדים באמצעות הוריהם. הוצאת אח.","url":null,"kind":"book","desc":"פרק מתוך הספר \"טיפול בהורות\" של פרופ' אסתר כהן, על עבודה אינטגרטיבית עם הורים לילדים עם צרכים מיוחדים.","placements":[["s3","sped"]],"extra":false,"ref":"כהן, טיפול בהורות","inFolder":false,"tldr":"פרק מתוך הספר \"טיפול בהורות\" של פרופ' אסתר כהן, על עבודה אינטגרטיבית עם הורים לילדים עם צרכים מיוחדים.","search":"פרק מתוך הספר \"טיפול בהורות\" של פרופ' אסתר כהן, על עבודה אינטגרטיבית עם הורים לילדים עם צרכים מיוחדים."},{"id":"corona2020","title":"מצפן לפסיכולוגיה חינוכית מערכתית במשבר נגיף הקורונה","authors":"החטיבה החינוכית, הסתדרות הפסיכולוגים","year":"2020","cite":"החטיבה החינוכית בהסתדרות הפסיכולוגים בישראל (6 באפריל 2020). מצפן לפסיכולוגיה חינוכית מערכתית במשבר נגיף הקורונה.","url":"https://drive.google.com/file/d/1mYeLKPfPiio9-TDaH6X5e7-_GR-Gz3-Q/view","kind":"outline","desc":"מסמך עקרונות של החטיבה החינוכית לעבודה מערכתית בזמן משבר הקורונה; ועשוי להיות רלוונטי גם לחשיבה על משברים מתמשכים.","urlLabel":"המסמך ב-Google Drive","placements":[["s3","emerg"]],"extra":false,"ref":"מצפן הקורונה 2020","inFolder":false,"tldr":"מסמך עקרונות של החטיבה החינוכית לעבודה מערכתית בזמן משבר הקורונה; ועשוי להיות רלוונטי גם לחשיבה על משברים מתמשכים.","search":"מסמך עקרונות של החטיבה החינוכית לעבודה מערכתית בזמן משבר הקורונה; ועשוי להיות רלוונטי גם לחשיבה על משברים מתמשכים."},{"id":"outline_elem","title":"ליבת העבודה בבית הספר היסודי","authors":"מיכל אורגלר ודורית טל, שפ\"ח ת\"א-יפו","year":"2022","cite":"שפ\"ח תל אביב-יפו (נובמבר 2022). ליבת העבודה של הפסיכולוג החינוכי בבית הספר היסודי.","url":null,"kind":"outline","desc":null,"file":{"orig":"ליבת העבודה שפח בתי ספר יסודיים - מעודכן.doc","ext":"doc","pdf":"outline_elem.pdf","pages":6,"bytes":289110},"placements":[],"extra":false,"ref":"ליבת העבודה ביסודי","inFolder":true,"srcTitle":"ליבת העבודה של הפסיכולוג החינוכי בבית הספר היסודי","secs":{"abstract":"<p>המסמך מגדיר מה נכלל ב\"ליבה\" של תוכנית העבודה השנתית של פסיכולוג בית ספר יסודי בשפ\"ח תל אביב-יפו. נקודת המוצא היא שהפסיכולוג שותף לחשיבה ולביצוע ברמת הפרט וברמת המערכת, ושעבודתו מגוונת מאוד: איתור, הדרכת הורים וצוות, הערכות ואבחונים, חירום, טיפולים ועבודה עם גורמי חוץ, ולצדם עבודה עם המנהל, עם היועצת, עם צוותים, עם כיתות רגישות ושכבות גיל, והשתתפות בחשיבה על שינויים גדולים במערכת (סגירה, מיזוג, החלפת בעלי תפקידים, תוכניות חדשות). מאחר שזמן הפסיכולוג מוגבל, יש לקבוע ליבה מדי שנה לפי חמישה עקרונות: עבודה מערכתית, עבודה טיפולית עם תלמידים והורים, עבודה מניעתית, עבודה הנדרשת על פי חוק, ועבודה לפי צרכים דחופים ומצבי חירום. פרק ייחודי מוקדש לחינוך המיוחד בבית הספר הרגיל. המסמך מדגיש שהתנאי החשוב ביותר להצלחה הוא עבודה רציפה ומשותפת עם מנהל בית הספר, שאיתו נקבעת תוכנית העבודה השנתית, ומזכיר את השירות הפסיכולוגי המשלים (שפ\"מ) כהרחבה כשהשעות אינן מספיקות.<\/p>","ideas":"<ul>\n<li>הפסיכולוג החינוכי עומד לרשות המערכת \"במעגלים שונים של התייחסות: מרמת הפרט ועד לרמת המערכת\".<\/li>\n<li>קשר ישיר, קבוע ורציף עם בעלי תפקידים: ראשית עם המנהל כראש המערכת, ואחריו עם היועצת, הצוות הטיפולי וצוות המורים.<\/li>\n<li>היקף העבודה והגיוון מול זמן מוגבל מחייבים לקבוע ליבת עבודה מדי שנה.<\/li>\n<li>הפסיכולוג צריך להכיר את אפיוני בית הספר ולהיות שותף ל\"שפה הבית ספרית\", כולל חשיבה על שינויים משמעותיים ועל תוכניות חדשות והשלכותיהן הרגשיות.<\/li>\n<li>ישיבה בין-מקצועית שבועית על כלל כיתות בית הספר היא עיקרון מרכזי בעבודה מניעתית.<\/li>\n<li>החינוך המיוחד בבית הספר הרגיל הוא מחויבות מתוקף \"חוק החינוך המיוחד\", וכולל גם למידה משותפת עם הצוות על \"המקום\" של החנ\"מ בבית הספר.<\/li>\n<li>היקף השעות לבית ספר נקבע לפי גודלו, כיתות חנ\"מ, קהילות ייחודיות (למשל ילדי הקהילה האתיופית, ילדי מהגרי עבודה ומבקשי מקלט, הרכב יהודי-ערבי) והיותו ב\"שלב רגיש\".<\/li>\n<li>יש להותיר מקום לבלתי צפוי וליצירתיות, גם מחוץ לתוכנית שנקבעה מראש.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>ליבת העבודה<\/strong> — הנושאים שחייבים להיכלל בתוכנית העבודה השנתית של הפסיכולוג בבית הספר.<\/li>\n<li><strong>רמת שירות א'/ב'/ג'<\/strong> — שלוש רמות שירות שמאפשר מתווה השירות של משה\"ח; שאיפת השפ\"ח היא רמה א' (מרבית), שאינה ממומשת במלואה בשל התקינה.<\/li>\n<li><strong>ישיבה בין-מקצועית שבועית<\/strong> — דיון שוטף על כלל כיתות בית הספר לפי סדר עדיפויות שהמערכת קובעת.<\/li>\n<li><strong>שפ\"מ (שירות פסיכולוגי משלים)<\/strong> — מאפשר להרחיב אבחונים, טיפולים והתערבויות מערכתיות מעבר לשעות התקן.<\/li>\n<li><strong>\"השפה הבית ספרית\"<\/strong> — הכרת האפיונים הייחודיים של בית הספר והשתתפות בשיח שלו.<\/li>\n<\/ul>","models":"<p><strong>חמשת העקרונות המנחים לקביעת הליבה:<\/strong><\/p>\n<ol>\n<li>עבודה מערכתית<\/li>\n<li>עבודה טיפולית עם תלמידים ועם הורים<\/li>\n<li>עבודה מניעתית<\/li>\n<li>עבודה הנדרשת על פי החוק<\/li>\n<li>עבודה הנקבעת על פי התעוררות צרכים דחופים ומצבי חירום<\/li>\n<\/ol>\n<p><strong>ליבת תוכנית העבודה השנתית:<\/strong><\/p>\n<ul>\n<li><em>עבודה מערכתית:<\/em> מפגשים קבועים עם מנהל ביה\"ס; מיסוד מפגשים קבועים עם היועצת; בניית מודל לישיבות שבועיות של צוות בין-מקצועי על כלל הכיתות; השתתפות בהתערבויות מערכתיות שנקבעו מראש עם המנהל; עבודה עם החטיבה הצעירה (חט\"צ) כחלק מהשלם הבית ספרי, בבתי ספר שיש בהם.<\/li>\n<li><em>עבודה טיפולית עם תלמידים ועם הורים:<\/em> קשר ותקשורת עם הורים כחלק משמעותי מהעבודה הפרטנית והמערכתית; טיפול בתלמידים באמצעים ישירים ועקיפים.<\/li>\n<li><em>עבודה מניעתית:<\/em> התייחסות ייחודית לכיתות א' — השתלבות, רכישת קריאה, כתיבה וחשבון, עם התמקדות בשכבה החל מדצמבר; התייחסות לכיתות ו' לקראת המעבר לחטיבת הביניים.<\/li>\n<li><em>עבודה הנדרשת על פי חוק:<\/em> התייחסות שיטתית לכיתות החנ\"מ (פרטני ומערכתי); לילדים זכאי חנ\"מ בכיתות הרגילות; היערכות לוועדות אפיון וזכאות חוזרות; השתתפות בוועדות השילוב הבית ספריות; היערכות להפניית תלמידים מהחינוך הרגיל לוועדות אפיון וזכאות.<\/li>\n<li><em>צרכים דחופים:<\/em> התערבויות חירום ברמת פרט, כיתה ובית ספר.<\/li>\n<\/ul>","practice":"<ul>\n<li>בתחילת השנה, לקבוע עם המנהל את תוכנית העבודה השנתית ולשקף לו את היקף השעות (גם השעות שמחוץ לבית הספר).<\/li>\n<li>לבנות מסגרת מפגשים קבועה עם המנהל ועם היועצת כבר בחודש הראשון.<\/li>\n<li>להציע מודל לישיבה בין-מקצועית שבועית על כל הכיתות, כבסיס לעבודה מניעתית.<\/li>\n<li>לסמן בלוח השנה: כיתות א' מדצמבר, כיתות ו' לקראת סוף השנה, מועדי ועדות אפיון ושילוב.<\/li>\n<li>למפות את תלמידי החנ\"מ בבית הספר, בכיתות הקטנות ובכיתות הרגילות.<\/li>\n<li>להכיר את שירותי השפ\"מ כדי להציע אותם כשהשעות אינן מספיקות.<\/li>\n<\/ul>","questions":"<ul>\n<li>איך מתחלקות השעות שלי בפועל בין חמשת עקרונות הליבה, ואיפה יש פער מהתוכנית?<\/li>\n<li>מה \"השפה הבית ספרית\" של בית הספר שלי, ואיך אני שותף/ה לה?<\/li>\n<li>אילו שינויים מערכתיים מתרחשים השנה, ומה ההשלכות הרגשיות שלהם על הצוות, ההורים והילדים?<\/li>\n<li>איך אני שומר/ת מקום לבלתי צפוי בלי לוותר על הליבה?<\/li>\n<\/ul>","quotes":"<ul>\n<li>\"מכאן שעבודת הפסיכולוג החינוכי היא מגוונת ביותר ומכילה תכני עבודה רבים.\"<\/li>\n<li>\"אחד התנאים החשובים ביותר להצלחת עבודת הפסיכולוג החינוכי במערכת החינוך היא העבודה המשותפת הרציפה שלו עם מנהל בית הספר.\"<\/li>\n<li>\"המציאות מלמדת שיש להותיר מקום וכוחות ללא צפוי ויצירתיות הצוות החינוכי ופסיכולוג בית הספר\"<\/li>\n<\/ul>"},"level":"שנה א'","stype":"מתווה מדיניות / מודל עבודה (מסמך פנימי של השירות)","tldr":"המסמך מגדיר מה נכלל ב\"ליבה\" של תוכנית העבודה השנתית של פסיכולוג בית ספר יסודי בשפ\"ח תל אביב-יפו. נקודת המוצא היא שהפסיכולוג שותף לחשיבה ולביצוע ברמת הפרט וברמת המערכת, ושעבודתו מגוונת מאוד: איתור, הדרכת הורים וצוות, הערכות ואבחונים, חירום, טיפולים…","search":"המסמך מגדיר מה נכלל ב\"ליבה\" של תוכנית העבודה השנתית של פסיכולוג בית ספר יסודי בשפ\"ח תל אביב-יפו. נקודת המוצא היא שהפסיכולוג שותף לחשיבה ולביצוע ברמת הפרט וברמת המערכת, ושעבודתו מגוונת מאוד: איתור, הדרכת הורים וצוות, הערכות ואבחונים, חירום, טיפולים ועבודה עם גורמי חוץ, ולצדם עבודה עם המנהל, עם היועצת, עם צוותים, עם כיתות רגישות ושכבות גיל, והשתתפות בחשיבה על שינויים גדולים במערכת (סגירה, מיזוג, החלפת בעלי תפקידים, תוכניות חדשות). מאחר שזמן הפסיכולוג מוגבל, יש לקבוע ליבה מדי שנה לפי חמישה עקרונות: עבודה מערכתית, עבודה טיפולית עם תלמידים והורים, עבודה מניעתית, עבודה הנדרשת על פי חוק, ועבודה לפי צרכים דחופים ומצבי חירום. פרק ייחודי מוקדש לחינוך המיוחד בבית הספר הרגיל. המסמך מדגיש שהתנאי החשוב ביותר להצלחה הוא עבודה רציפה ומשותפת עם מנהל בית הספר, שאיתו נקבעת תוכנית העבודה השנתית, ומזכיר את השירות הפסיכולוגי המשלים (שפ\"מ) כהרחבה כשהשעות אינן מספיקות. הפסיכולוג החינוכי עומד לרשות המערכת \"במעגלים שונים של התייחסות: מרמת הפרט ועד לרמת המערכת\". קשר ישיר, קבוע ורציף עם בעלי תפקידים: ראשית עם המנהל כראש המערכת, ואחריו עם היועצת, הצוות הטיפולי וצוות המורים. היקף העבודה והגיוון מול זמן מוגבל מחייבים לקבוע ליבת עבודה מדי שנה. הפסיכולוג צריך להכיר את אפיוני בית הספר ולהיות שותף ל\"שפה הבית ספרית\", כולל חשיבה על שינויים משמעותיים ועל תוכניות חדשות והשלכותיהן הרגשיות. ישיבה בין-מקצועית שבועית על כלל כיתות בית הספר היא עיקרון מרכזי בעבודה מניעתית. החינוך המיוחד בבית הספר הרגיל הוא מחויבות מתוקף \"חוק החינוך המיוחד\", וכולל גם למידה משותפת עם הצוות על \"המקום\" של החנ\"מ בבית הספר. היקף השעות לבית ספר נקב
