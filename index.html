לם את \"החולשה\"?<\/li>\n<li>שינוי מבני יערער הגנות וישחרר חרדה: איך אכין לכך את המערכת?<\/li>\n<\/ul>"},{"id":"systemic-case-flow","title":"תרשים זרימה לארגון מקרה מערכתי","domain":"system","sources":["rubric"],"when":"כשבוחרים ומתעדים מקרה מערכתי לאורך ההתמחות, ובהכנה להצגתו בבחינת הסיום.","html":"<p>מושא האבחון וההתערבות הוא המערכת, והילדים הם הלקוחות המרכזיים.<\/p>\n<h4>תרשים הזרימה<\/h4>\n<ol>\n<li>רקע: תיאור הארגון.<\/li>\n<li>סיבת האבחון הארגוני וכלי האבחון.<\/li>\n<li>תופעות: במערכת, בצוות, בתלמידים, בהורים ובפסיכולוגים.<\/li>\n<li>ממצאי האבחון: ניתוח והמשגה.<\/li>\n<li>מטרת ההתערבות המערכתית.<\/li>\n<li>תוצאות.<\/li>\n<li>אינטרוספקציה ומבט אישי של הפסיכולוג.<\/li>\n<\/ol>\n<h4>מה מצופה בהצגת המקרה<\/h4>\n<ul>\n<li>קשר מומשג בין סיבת האבחון, הממצאים וההתערבות, דרך שתי נקודות מבט תיאורטיות.<\/li>\n<li>התערבויות בלפחות 2-3 ממדים של המערכת, והסבר איך נבדקה האפקטיביות.<\/li>\n<li>אם ההתערבות בתת-מערכת (כיתה, צוות): למה דווקא שם, ואיך היא משפיעה על המערכת כולה.<\/li>\n<li>היכרות עם חלקי המערכת: אקלים, חזון, מטרות, מבנים, הגדרות תפקיד, שגרות, תקשורת ודינמיקת יחסים.<\/li>\n<li>זיהוי העברה והעברה נגדית, חרדות והגנות, והשפעתם על העבודה.<\/li>\n<\/ul>\n<h4>עדשה לדוגמה: ברונפנברנר<\/h4>\n<p>מיקרוסיסטם (משפחה, חברים, בית ספר); מזוסיסטם (הקשרים ביניהם); אקזוסיסטם (מערכות שמשפיעות על הילד בלי שהוא פעיל בהן); מקרוסיסטם (תרבות ואידיאולוגיה).<\/p>\n<h4>כבר בשנים ב'-ג'<\/h4>\n<ul>\n<li>לבחור מקרה ולתעד אותו לפי התרשים.<\/li>\n<li>לבחור מראש שתי עדשות תיאורטיות.<\/li>\n<li>לתכנן מראש איך תיבדק האפקטיביות.<\/li>\n<li>לנהל יומן של תחושות והעברה נגדית, כחומר לפרק האינטרוספקציה.<\/li>\n<\/ul>"}],"glossary":[{"term":"אבחון מערכתי","en":"Systemic assessment","domains":["system"],"sources":["englert","fuchs","italy2019","forest2014","rubric"],"html":"<p>הערכה שבה מושא האבחון הוא המערכת (בית ספר, גן, צוות או תת-מערכת) ולא הילד היחיד, כבסיס להתערבות מערכתית; המחוון לבחינת הסיום דורש לקשר בין סיבת האבחון, הממצאים וההתערבות דרך שתי נקודות מבט תיאורטיות. אנגלרט מציעה <strong>\"אבחון תוך כדי תנועה\"<\/strong>, כלומר למידה על המערכת מתוך הפעולות השוטפות במקום אבחון מקדים נפרד, ומבחינה בין רמת ההצהרות (הרצוי), רמת ההתרחשויות (המצוי) ורמת הפירושים. במצגת על המפה המערכתית האבחון נשען על ממדים תהליכיים וחוויתיים כמו שגרה, תפקוד, מוגנות, יחסים ותרבות, ואיטלי מראה איך עיבוד מה שהמערכת השליכה על הפסיכולוג הופך לאבחון מערכתי.<\/p>"},{"term":"אדם בתפקיד","en":"Person-in-role","domains":["system","therapy"],"sources":["gantz2016","italy2019","luria2011","rodded2017","psa_map"],"html":"<p>ההבחנה בין האדם, על עולמו הפנימי, לבין התפקיד שהוא ממלא במציאות הארגונית. גנץ רואה בכך את המכנה המשותף של הורים, אנשי חינוך ותלמידים: לכל אחד מהם רכיב אובייקטיבי של ממלא תפקיד ורכיב סובייקטיבי של אדם; איטלי מדגישה שבעבודה עם בית הספר ההתמקדות היא בפונקציה המקצועית של אנשי החינוך ולא בפונקציה האישית שלהם. לוריא ועמיתיו מדברים על התפתחות המנהל \"כאדם בתפקידו\", ורודד ועמיתיו מונים את הבנת הקשר אדם-תפקיד בין מיומנויות העבודה המערכתית.<\/p>"},{"term":"אובייקט טרנספרנסיאלי ואובייקט התפתחותי","en":"Transference object / Developmental object","domains":["therapy","system"],"sources":["greenwald2012","reflection"],"html":"<p>שתי עמדות של המטפל. כ<strong>אובייקט טרנספרנסיאלי<\/strong> הוא מושא להשלכות המטופל, ופעולתו העיקרית היא לחשוף ולפרש רבדים לא מודעים ודפוסי קשר חוזרים; כ<strong>אובייקט התפתחותי<\/strong> הוא מספק הכרה אמפתית ומשלים צרכים התפתחותיים שתוסכלו או נעצרו. גרינולד מרחיבה את המושג השני לסביבה החינוכית כולה, שמשמשת אובייקט התפתחותי \"במובנו הרחב\" ומחזקת את כוחות האגו (שליטה, איפוק, ריסון ותכנון).<\/p>"},{"term":"אינטגרציה","en":"Integration","domains":["diag","general"],"sources":["sapiryogev","rodded2017"],"html":"<p>המונח משמש בשני מובנים שונים. אצל ספיר-יוגב זהו שלב בהתערבות הדיאגנוסטית: גיבוש התשובה לשאלות האבחון בחמישה עד עשרה משפטים, שהם \"עמוד השדרה\" של המשוב והדו\"ח. אצל רודד, יצחקי וכהן זו יכולת ליבה של המקצוע בשלוש רמות: <strong>מעשית<\/strong> (תכנון וגמישות מול עומס וריבוי מסגרות), <strong>בין-אישית<\/strong> (קשרי אמון, ניהול נאמנויות מרובות וסינגור על הילד) ו<strong>תוך-אישית<\/strong> (שילוב רבדים גלויים וסמויים, העברה והעברה נגדית, ונשיאת עמימות).<\/p>"},{"term":"אישיות בית ספרית","en":"School personality","domains":["system"],"sources":["forest2014"],"html":"<p>מודל של שפ\"ח ירושלים שמתאר את ה\"רוח\" והאווירה של בית הספר במונחים פסיכולוגיים, דרך תפקוד המערכת, החלקים הלא מודעים, הדימוי העצמי ותחושת הקוהסיביות. המודל שואל את המבנה של פרויד: <strong>הסופר-אגו הבית ספרי<\/strong> הוא הערכים, החזון, החוקים והאיסורים; <strong>האגו הבית ספרי<\/strong> הוא החלק הפועל במציאות (משימות מרכזיות, מבנים, משאבים, גמישות ויצירתיות); ו<strong>האיד הבית ספרי<\/strong> הוא החלקים הלא מודעים, ההיסטוריה והדפוסים שבית הספר \"ירש\".<\/p>"},{"term":"אנאקטמנט","en":"Enactment","domains":["therapy","system"],"sources":["italy2019","gantz2021","psa_map"],"html":"<p>מושג מהגישה ההתייחסותית לביטוי של תוכן לא מודע במעשה ובתוך הקשר, ולא במילים או במחשבה (במפת המושגים הפסיכואנליטית-מערכתית: \"מימוש בפעולה\"). איטלי, בעקבות חזקיהו, מתארת אותו כמפגש שבו ההעברה וההעברה הנגדית מיטשטשות ונוצר \"קיפאון משותף\", כי כל תנועה נחווית כמסוכנת. גנץ מעדיפה אותו על פני \"הזדהות השלכתית\" משום שהוא כולל, מלבד התחושות הקשות (חוסר ערך, ייאוש, בלבול), גם את הביטוי ההתנהגותי בקשר הממשי: מאבק, כניעה או הכנעה.<\/p>"},{"term":"אנטי-משימה","en":"Anti-task","domains":["system"],"sources":["turi_contract","forest2014"],"html":"<p>מה שקורה כשהמשימה המרכזית של הארגון אינה ברורה: הגבולות מיטשטשים, תכנים לא מודעים (כמו הנחות היסוד של ביון) פורצים לתוך העבודה, ומופיעים דפוסים הגנתיים לא יעילים (תורי-מגדסי). בשפ\"ח ירושלים מתוארת קבוצה שנסוגה בחרדה לתפקוד הגנתי \"אנטי-משימתי\" כהיפוכה של קבוצת העבודה.<\/p>"},{"term":"ארגון מורכב מסתגל","en":"Complex adaptive system (CAS)","domains":["system"],"sources":["mop2020"],"html":"<p>תפיסה של משרד החינוך (אגף מו\"פ) את בית הספר כמערכת אקולוגית פתוחה ודינמית, שלומדת ומסתגלת למציאות של תנודתיות, אי-ודאות, מורכבות ועמימות (VUCA). מאפייניו הם גורמים פעלנים אוטונומיים, התארגנות עצמית והתהוות \"מלמטה למעלה\", שליטה מבוזרת והתנהלות \"על סף הכאוס\", ובמיטבו הוא \"אנטי-שביר\", כלומר מנצל את השינוי לצמיחה. בית ספר כזה הוא \"ארגון הלמה\": ההנהלה מגדירה עם בעלי העניין <strong>מצפן בית ספרי<\/strong> ברור, מוסכם ושקוף, והצוותים בוחרים בעצמם את ה\"איך\"; הדגש הזה על ביזור ועמימות מבוקרת שונה מהדגש של נוטקביץ' על גבולות מנוהלים.<\/p>"},{"term":"גבול עבה וגבול דק","en":"Thick and thin boundaries","domains":["therapy","system","sped"],"sources":["greenwald2012"],"html":"<p>הבחנה (בעקבות גורביץ') באופן שבו תת-מערכת טיפולית בבית הספר מנהלת את הגבול שלה מול הצוות החינוכי. <strong>גבול עבה<\/strong>, אטום לשיתוף, יוצר מכניסטיות וסגירות ומגביר פיצול והשלכה; <strong>גבול דק<\/strong> מאפשר דיאלוג פורה עם הצוות, תוך שמירה זהירה על פרטיות וסודיות.<\/p>"},{"term":"גישה אסטרטגית","en":"Strategic approach","domains":["emerg"],"sources":["alon2023"],"html":"<p>עקרונות להתערבות מיידית עם פרט אחרי אירוע חירום, בהשראת מילטון אריקסון: לגיטימציה לסימפטומים כתגובה נורמלית, מסגור מחדש של השלילי לחיובי, אי-עיסוק בעבר, חיפוש \"נקודת אור\", הסתייעות בסביבה הטבעית ו\"להיות עם\", כלומר נוכחות פיזית ורגשית לצד הנפגע בלי חובה ב\"מילים חכמות\". עיקרון מרכזי הוא <strong>הצטרפות והובלה<\/strong> (pacing and leading): \"לרדת למקום הנמוך\" שבו נמצא הנפגע, להתאים קצב וטון, ומשם להוביל אותו מעלה. הפסיכולוג תומך בדרך כלל \"ליד\" הדמויות הטבעיות, ורק באין ברירה ב\"חזית\".<\/p>"},{"term":"גישה אקולוגית","en":"Ecological approach (Bronfenbrenner)","domains":["general","system","community"],"sources":["peraui2013","rodded2017","rubric","outline_gan","sped_multi"],"html":"<p>תפיסה, בעקבות ברונפנברנר, שרואה בילד חלק ממערכות משפחתיות, חינוכיות וקהילתיות שמשפיעות זו על זו, ולכן מבינה כל קושי כתוצר של גורמים רבים ומתערבת במעגלים שסביב הילד; פראוי מוצא שהתפיסה הזו היא ייחודו של המקצוע. המחוון לתחום המערכתי מציג את המודל בארבע רמות (מיקרוסיסטם, מזוסיסטם, אקזוסיסטם ומקרוסיסטם), ורודד ועמיתיו מציגים אותו כרצף רמות ניתוח מהפרט ועד הרמה התרבותית והמדינית, שההשפעות בו פועלות \"מהחוץ פנימה\" וגם \"מהפנים החוצה\". בעבודה רב-מקצועית בחנ\"מ מוצעת ברוח זו <strong>הערכה אקולוגית<\/strong>: תצפיות, ראיונות ואינדיקטורים דינמיים בסביבה הטבעית של התלמיד.<\/p>"},{"term":"גישה פסיכואנליטית-מערכתית","en":"Psychoanalytic-systemic approach","domains":["system"],"sources":["psa_map","turi_unconscious","menzies","nutkevitch2003","greenwald2009","peraui2013","nutkevitch2025"],"html":"<p>גישה שמשלבת את התיאוריה הפסיכואנליטית (לא מודע, חרדה, הגנות, הזדהות השלכתית, הנחות יסוד) עם תיאוריית המערכות הפתוחות (משימה מרכזית, גבולות, תפקיד), כדי להבין איך תהליכים לא מודעים פועלים בתוך מבנים ארגוניים. מפת המושגים ממקמת ביניהן \"מקף\" של מושגים מחברים, כמו הגנה חברתית, סמכות, לקיחת תפקיד, הנחות יסוד מול קבוצת עבודה, והמיכל והכלתו. אצל גרינולד-קשאני ומטיחס זו \"התפיסה הארגונית-פסיכואנליטית\", שכליה העיקרי הוא ההעברה הנגדית של הפסיכולוג.<\/p>"},{"term":"גישת הרצפים","en":"Continuity approach","domains":["emerg"],"sources":["alon2023"],"html":"<p>תיאוריה של עומר ואלון (1994), שנשענת על ויניקוט, ולפיה האדם חי לאורך שמונה רצפים: הכרתי-חשיבתי, בין-אישי, תפקיד, היסטורי, דימויים, אמונות, פיזיולוגי ורגשי. אירוע טראומטי קוטע את הרצפים, יוצר חלל ב\"קו החיים\" ומרסק את תחושת \"השלם\" של הפרט ושל בית הספר, ומטרת ההתערבות בחירום היא לחבר אותם מחדש.<\/p>"},{"term":"דיבוב","en":"Debriefing","domains":["emerg"],"sources":["alon2023"],"html":"<p>כינוס שנועד לאוורור חוויות ולמתן מקום לרמת הרגש אחרי אירוע חירום. לפי התרשים במאמר \"רציפות בחרו\"ם\" נערך דיבוב גם לכיתות בסיכון בימים שאחרי חידוש הלימודים, ולכל חדר המורים בטווח של עד שבוע מהאירוע; גם המתערבים עצמם משתתפים בדיבוב, כחלק מהשמירה עליהם.<\/p>"},{"term":"האוהל והשדה","en":"The tent and the field","domains":["general","system","community"],"sources":["binyamini1984","tauber","italy2019"],"html":"<p>דימוי שטבע קלמן בנימיני (1984) ליציאת הפסיכולוג החינוכי מחדר הטיפולים אל \"השדה\", כלומר אל המערכות החינוכיות. איטלי מביאה את מטפורת \"האוהל\" של בנימיני, מבנה חלופי שהפסיכולוג בונה בשדה בתנועה בין \"הבית\" (השפ\"ח) למערכת, ומוסיפה בעקבות לומברוזו-טאובר ואלרואי (2018) שלמתחיל אי אפשר להציג אותו \"טרם זמנו\"; טאובר מציעה לחדד את הציר חדר-בית ספר-קהילה של בנימיני ורביב כעוגן תיאורטי לזהות המקצועית.<\/p>"},{"term":"הארגון בראש","en":"Institution in the mind","domains":["system"],"sources":["armstrong"],"html":"<p>מושג של ארמסטרונג: הייצוג הפנימי של הארגון אצל מי שעובד בו. לפי הגישה, אפשר להשתמש בייצוג הזה כמקור מידע על הארגון עצמו.<\/p>"},{"term":"הגנה חברתית","en":"Social defense system","domains":["system"],"sources":["menzies","forest2014","psa_map"],"html":"<p>הגנות מפני חרדה שהוחצנו וקיבלו ממשות במבנה, בתרבות ובנהלים של הארגון, ונוצרו בהסכמה קולוזיבית ולא מודעת בין חבריו (מנזיס-לית'). במחקר על הסיעוד הן כוללות דה-פרסונליזציה, ריחוק והכחשת רגשות, ביצוע טקסי של משימות, האצלה כלפי מעלה וערפול מכוון של האחריות; הן מפחיתות את <strong>החרדה הראשונית<\/strong> שמקורה במשימה, אבל מייצרות <strong>חרדה משנית<\/strong> ומקשות על שינוי. בשפ\"ח ירושלים מדובר ב\"הגנות מערכתיות\" של בית הספר, כמו הכחשה, פיצול, השלכה, אידאליזציה ודה-ולואציה, שתפקידן למנוע הצפה ולשמר תחושת ערך.<\/p>"},{"term":"הדרכה","en":"Supervision","domains":["general","therapy","system"],"sources":["tene2011","tauber","luria2011","gantz2021","rodded2017"],"html":"<p>ליווי מקצועי שבו המדריך תומך, מעשיר ומקנה ידע, וגם משקף, מבקר ומעריך (טנא), והוא רכיב מרכזי ב\"רשת הביטחון\" של הפסיכולוג המתחיל (טאובר); גנץ רואה בו אחד ה\"סולמות\" שעוזרים למטפל לצאת ממבוי סתום. לוריא ועמיתיו מתארים הדרכת מנהלים כמסגרת יציבה (\"תיבה\" ו\"תבנית פעילה\") וכ\"מרחב פוטנציאלי\" למשחק, ומבחינים בינה לבין היוועצות: בהדרכה האירוע הספציפי הוא אמצעי להתפתחות המודרך ולא מטרה, והיא אינה מסגרת למצבי חירום.<\/p>"},{"term":"הזדהות השלכתית","en":"Projective identification","domains":["therapy","system"],"sources":["nutkevitch2003","turi_unconscious","reflection","italy2019","bion","gantz2021","forest2014","psa_map"],"html":"<p>תהליך שבו אדם מפקיד באחר חלקים ורגשות בלתי נסבלים, והאחר חווה אותם כאילו היו שלו, כך שהמציאות הנפשית של המקבל משתנה. קליין תיארה אותה כתופעה תוך-נפשית, וביון פיתח אותה כתופעה בין-אישית שבה המקבל יכול לעבד את מה שהושלך ולהחזיר אותו בצורה ממותנת; בקבוצה ובארגון כל חבר, וגם הפסיכולוג, יכול להפוך ל\"בית קיבול\" להשלכות (תורי-מגדסי, איטלי). גנץ מעדיפה במקומה את המושג \"אנאקטמנט\", שמוסיף את הביטוי ההתנהגותי בקשר.<\/p>"},{"term":"החזקה","en":"Holding","domains":["therapy","system"],"sources":["reflection","kellner2000","gantz2016","nutkevitch2003","outline_sec"],"html":"<p>מושג של ויניקוט (\"אין תינוק בלי אם\"): שמירה על רצף המשכיות החיים (going on being) והגנה מפני חדירויות (impingements). קלנר רואה בהחזקה את הפונקציה ה\"מטרנלית\" של המערך הטיפולי, וגנץ מביאה את \"ההחזקה בזמן\" של אוגדן. ברמה המערכתית, באחת הדוגמאות של נוטקביץ' מטרת הייעוץ מוגדרת בחוזה עם הארגון כ\"סביבה ארגונית מחזיקה\", ובמסמך ליבת העבודה בעל-יסודי הפסיכולוג מבקש לפתח את יכולת ההחזקה וההכלה של המחנכים.<\/p>"},{"term":"הכלה","en":"Containment (container-contained)","domains":["therapy","system"],"sources":["nutkevitch2003","turi_unconscious","reflection","bion","forest2014","outline_sec","psa_map","nutkevitch2025"],"html":"<p>היכולת של ישות (אם, מטפל, קבוצה, הנהלה או ארגון) לקלוט חלקים מעוררי חרדה, כאב ובושה בלי להתפרק ובלי להשליך אותם הלאה, לעכל אותם ולהחזיר אותם בצורה שאפשר לחשוב עליה. המושג נשען על מודל <strong>המיכל-מוכל<\/strong> של ביון (תינוק בכאב שמחפש את שד האם; מחשבות שמחפשות חושב), שבו שני הצדדים פעילים; בארגון פונקציית ההכלה שייכת בעיקר לבעל הסמכות והפסיכולוג מסייע לה, ובמסמך הרפלקציה היא מתוארת כפעולה אקטיבית ולא כספיגה סבילה. בשפ\"ח ירושלים המונח \"מיכל\" מיוחס דווקא לוויניקוט: המחנכת היא מיכל לילדים, ובית ספר מכיל הוא \"מיכל מורחב\" עבורה.<\/p>"},{"term":"המשגה דינמית","en":"Dynamic formulation","domains":["therapy"],"sources":["bahat","yablon2019","rodded2017"],"html":"<p>השערת עבודה, נכונה לנקודת זמן מסוימת, על \"איך המטופל הגיע עד הלום\", שחותרת לאמת רגשית ולא לאמת עובדתית בלעדית; בהט מעדיפה את המונח \"פורמולציה\" או \"המשגה\" על פני \"אבחנה דינמית\", שהיא מצמצמת, סטטית ו\"סופית\". ההמשגה נבנית כמשולש שעומד על ראשו, בין אנמנזה, הווה ותיאוריה מחברת, ונשענת על ה\"תבלינים\" הייחודיים של המטופל ולא על תיאור גנרי. יש להחזיק בה באחיזה שאינה חזקה מדי, כמו \"עמוד ענן לפני המחנה\" שלפעמים לפנינו, לפעמים מאחורינו ולפעמים עוטף אותנו.<\/p>"},{"term":"הנחות יסוד","en":"Basic assumptions","domains":["system"],"sources":["forest2014","turi_unconscious","psa_map","turi_contract"],"html":"<p>לפי ביון, הרובד הרגרסיבי, הלא מודע וההגנתי של הקבוצה, שמונע מפנטזיות ומחרדות וגורם לה לפעול \"כאילו\" (as if) יש לה אויב או שהיא בסכנה, במקום לעסוק במשימה. שלוש הנחות היסוד הן <strong>תלות<\/strong> (תקווה במנהיג כל-יכול), <strong>מאבק-בריחה<\/strong> (fight-flight) ו<strong>זיווג<\/strong> (pairing: תקווה שאיחוד של שניים יביא ישועה, תוך הימנעות מההווה). הן עומדות מול \"קבוצת העבודה\", ותורי-מגדסי מחילה אותן על הארגון כולו, שמתנהג כאילו משימתו המרכזית היא להינצל מסכנה.<\/p>"},{"term":"הסמלה","en":"Symbolization","domains":["therapy","system"],"sources":["gantz2016","menzies"],"html":"<p>ייצוג של מציאות \"אובייקטיבית\" באמצעות סמל \"סובייקטיבי\" שטעון במשמעות. גנץ מדגישה את המתח הדיאלקטי בין המסומל לסמל, שמונע קריסה לאחד הקטבים; מנזיס-לית', בעקבות סגל, מבחינה בין <strong>ייצוג סמלי<\/strong>, שמאפשר לסמל להכיל חרדה, לבין <strong>משוואה סמלית<\/strong>, שבה הסמל ואובייקט הפנטזיה מתמזגים והחרדה מתעוררת במלוא עוצמתה.<\/p>"},{"term":"העברה","en":"Transference","domains":["therapy","system"],"sources":["italy2019","greenwald2012","bahat","turi_contract","rodded2017"],"html":"<p>העברה של רגשות, ציפיות ודפוסי יחס מקשרים מוקדמים אל המטפל, באופן מודע ולא מודע. המושג מוחל גם על מערכות: איטלי מראה שרגשות כלפי בעלי תפקידים (\"מנהל\", \"מורה\", \"פסיכולוג\") מתעוררים עוד לפני המפגש בפועל. בהט, בעקבות ג'וזף, רואה ב\"סיטואציה הכוללנית\" (total situation), כלומר בהתנהגות הכוללת של המטופל גם במוסד, חלון למרכיבים ההעברתיים ולעולם הפנימי.<\/p>"},{"term":"העברה נגדית","en":"Countertransference","domains":["therapy","system","general"],"sources":["italy2019","greenwald2009","turi_contract","rodded2017","rubric","gantz2021","bahat"],"html":"<p>התגובות הרגשיות של המטפל כלפי המטופל, מודעות ולא מודעות, שבגישות בנות זמננו משמשות גם מקור מידע על המטופל. בעבודה המערכתית ההעברה הנגדית של הפסיכולוג היא כלי אבחון מרכזי: תגובה לא אופיינית, למשל תוקפנות בישיבה, יכולה להצביע על תהליך מקביל במערכת (גרינולד-קשאני ומטיחס), והמחוון לבחינת הסיום דורש יכולת אינטרוספקטיבית לזהות אותה. תורי-מגדסי מונה את תהליכי ההעברה וההעברה הנגדית בין \"אבני הנגף\" הצפויות בביצוע החוזה עם המנהל.<\/p>"},{"term":"הפסיכולוגיה של ההורה","en":"Psychology of the parent","domains":["therapy"],"sources":["gantz2021","gantz2016"],"html":"<p>לפי גנץ, מערך של שני פרדוקסים: ההורה הוא גם אובייקט הורי וגם סובייקט אנושי, והילד הוא גם שלוחה של הוריו וגם ישות נפרדת. בטיפול בהורים המשבר הטיפולי הוא לעיתים החצנה של הפרדוקס הזה, וגם הסטינג עצמו מעביר מסר יחסי (למשל, פגישות משותפות קבועות להורים גרושים משדרות \"אתם עדיין זוג\"); במאמר אחר גנץ מדגישה שמרגע שהורה נכנס לטיפול, גם אם הוא בא בשביל הילד, \"הוא הוא הקליינט\".<\/p>"},{"term":"השלישי","en":"The third (analytic / intersubjective)","domains":["therapy"],"sources":["tene2011","gantz2021"],"html":"<p>מרחב משותף שנוצר בין מטפל למטופל ואינו שייך לאף אחד מהם. אצל טנא, בעקבות אוגדן, <strong>\"השלישי האנליטי\"<\/strong> הוא הסובייקטיביות המשותפת שנוצרת בחדר, הופכת חוויות תוך-אישיות לבין-אישיות ומנגישה חלקים מפוצלים או מודחקים. אצל גנץ, בעקבות בנג'מין, <strong>\"השלישי האינטרסובייקטיבי\"<\/strong> הוא יצירה משותפת ריתמית, סימבולית ומוסרית שמאפשרת לצאת מיחסי שליטה-כניעה, והיא מכנה את העמדה הזו \"מרפסת\" שממנה המטפל והמטופל צופים יחד במה שקורה ביניהם.<\/p>"},{"term":"התכווננות ארגונית","en":"Organizational orientation","domains":["general","system"],"sources":["greenwald2009"],"html":"<p>הרחבת המבט של הפסיכולוג מהפרט אל הארגון, בעזרת \"מפות תיאורטיות\" של מה עושים (פרקטיקות) ולאן חותרים (אתיקה). גרינולד-קשאני ומטיחס מציגות שלוש תפיסות: <strong>אסטרטגית-פונקציונלית<\/strong> (תחומי אחריות ומבני עבודה), <strong>ארגונית-פסיכואנליטית<\/strong> (חרדה לא מודעת כשהמערכת לא עומדת במשימותיה, וההעברה הנגדית ככלי) ו<strong>פוסט-מודרנית<\/strong> (ערעור על עליונות המומחה וחשיפת האינטרסים שמאחורי פרקטיקות כמו מיון לפי אינטליגנציה).<\/p>"},{"term":"התנגדות המערכת לפסיכולוג","en":"System resistance to the psychologist","domains":["system"],"sources":["turi_unconscious","italy2019"],"html":"<p>בלימה, לעיתים לא מודעת, של הפסיכולוג כ\"גוף זר\": לא נותנים לו כניסה של ממש, לא חושפים בפניו מידע ודוחים את פירושיו (תורי-מגדסי). צורה מוסווית שלה היא <strong>\"מלכודת דבש\"<\/strong>, קבלה חמה וחסרת התנגדות ש\"מרדימה\" את הפסיכולוג ומסתירה ממנו את מה שהארגון אינו רוצה שיראה. איטלי, בעקבות אוגדן, מתארת \"סימני אזהרה\" כמו הפניה לרכזת במקום פגישה עם המנהלת, כביטוי ל\"חרדת העברה\" של המערכת כלפי הקשר.<\/p>"},{"term":"התערבות דיאגנוסטית","en":"Diagnostic intervention","domains":["diag"],"sources":["sapiryogev","ravid2024"],"html":"<p>תפיסה של ספיר-יוגב שרואה בתהליך האבחון כולו, מהראיונות והמפגשים ועד המשוב, הדו\"ח והמעקב, התערבות שמחוללת שינוי ולא רק איסוף מידע. התהליך יוצא משאלות אבחון, נבנה כ\"חליפה\" לפי השערות, ומשתף את הילד בגילוי על עצמו; ראביד-חיון ובן ריי ממשיכים את הקו הזה ומדגישים את הערך הטיפולי של המשוב.<\/p>"},{"term":"ולנסי","en":"Valency","domains":["system"],"sources":["turi_unconscious","psa_map"],"html":"<p>מושג מתורת הקבוצות של ביון, כפי שמובא אצל ריוך (Rioch): נטייתו של חבר בקבוצה לעורר סוג מסוים של השלכה, וכך לקבל תפקיד סימבולי שמשרת את הקבוצה, למשל \"שעיר לעזאזל\".<\/p>"},{"term":"ועדת אפיון וזכאות","en":"","domains":["sped"],"sources":["outline_elem","outline_sec","outline_gan","tlv_smallclasses","greenwald2009","turi_contract","manor2004","rodded2017"],"html":"<p>ועדה לפי חוק החינוך המיוחד שדנה בזכאות של תלמיד לשירותי חינוך מיוחד ובאפיון צרכיו; הפסיכולוג שותף בחשיבת הצוות הבין-מקצועי, מכין מסמכים קבילים לפי הצורך, ומתווך את ההמלצות להורים ולתלמיד. בחלק מהטקסטים, בעיקר המוקדמים ובמודל העבודה בגנים, מופיע המונח \"ועדת השמה\". מסמכי השירות ממליצים להיערך לוועדות לפי לוח הזמנים השנתי ולהכין את ההורים, שעלולים לחוות ישיבות מעבר כאלה כטראומטיות (מנור-בנימיני).<\/p>"},{"term":"ועדת שילוב","en":"","domains":["sped"],"sources":["outline_sec","outline_elem","outline_gan"],"html":"<p>ועדה בין-מקצועית בבית הספר (או בגן) שדנה בילדים שמועמדים לשילוב במסגרת הרגילה. הפסיכולוג משתתף בה ומכין מסמכים קבילים לפי הצורך; מודל העבודה בגנים מפרט את מועדי הוועדות לאורך השנה.<\/p>"},{"term":"זולת-עצמי","en":"Selfobject","domains":["therapy","system"],"sources":["forest2014","luria2011","rodded2017"],"html":"<p>מושג של קוהוט: דמות שממלאת עבור הפרט תפקודים נפשיים שאינו יכול עדיין למלא בעצמו, דרך שיקוף (mirroring), קוטב לאידאליזציה ותאומות. המושג מוחל גם מחוץ לחדר הטיפול: המחנכת, המבוגרים בבית הספר ואפילו הקבוצה יכולים לשמש זולת-עצמי לתלמידים (שפ\"ח ירושלים), בהדרכת מנהלים חדשים שלוש ההתייחסויות האלה (מראה, האדרה ותאומות) מזינות את \"העצמי הניהולי\" המתפתח (לוריא ועמיתיו), והפסיכולוגית בפגישה עם מנהלת יכולה לשמש עבורה \"זולתעצמי\" (רודד ועמיתיו).<\/p>"},{"term":"חוויית ההגירה","en":"Migration experience","domains":["general"],"sources":["tauber"],"html":"<p>המטפורה המרכזית של טאובר לשנה הראשונה בשפ\"ח: מעבר מתחום הכשרה מוכר לתחום חדש, עם \"הלם תרבותי\", איום על הזהות המקצועית ואף היבטים של אבל. לפי המחברת המעבר מצליח יותר כשיש \"גורמים מתווכים\" לפני הקליטה ובמהלכה, ו\"רשת ביטחון\" של הדרכה, ידע תיאורטי וצוות תומך.<\/p>"},{"term":"חוזה טיפולי","en":"Therapeutic contract","domains":["therapy"],"sources":["kellner2000"],"html":"<p>הסכם בין מטפל למטופל על הגבולות והמסגרת של הטיפול (המערך הטיפולי), שרק חלקו מנוסח במפורש. קלנר, בעקבות אטשגוז'ן, מבחינה בין חוזה <strong>רציונלי<\/strong>, שמותאם למה שעדיף לתהליך, חוזה <strong>סמכותי<\/strong>, שמקדים את נוחות המטפל למשימה הטיפולית, וחוזה <strong>דמגוגי<\/strong>, שמרצה את המטופל על חשבון המשימה. לדבריה, מטפל שאינו מקבל את האסוציאציות החופשיות כ\"כלל יסוד\" צריך לכלול בחוזה עיקרון מנחה חלופי שמסביר למטופל את תפקידו.<\/p>"},{"term":"חוזה עבודה","en":"Working contract","domains":["system","general"],"sources":["turi_contract","peraui2013","outline_gan","outline_sec","outline_elem","nutkevitch2003"],"html":"<p>ההסכמות שהפסיכולוג בונה עם המסגרת החינוכית, בעיקר עם המנהל ובגן עם הגננת, על תחומי ההתערבות, סדרי העדיפויות, דפוסי העבודה ותנאיה. החוזה נבנה בשיחה, נשען על החזון והמשימה המרכזית של המסגרת ומתעדכן לאורך הזמן; תורי-מגדסי מציעה מבנה מסודר לשיחת החוזה, ומסמכי ליבת העבודה של השפ\"ח משמשים בסיס לשיחה כזו בתחילת השנה. במודל העבודה בגנים החוזה נבנה מתוך מיפוי משותף של הגן.<\/p>"},{"term":"חוליות מקשרות (L, H, K)","en":"Links L, H, K","domains":["therapy","general"],"sources":["bion","tene2011"],"html":"<p>לפי ביון, שלושה סוגי חיבור רגשי בין בני אדם: אהבה (L), שנאה (H) וידיעה (K), וגם השלילות שלהם. K אינו צבירת מידע אלא תהליך של היכרות רגשית עם האחר, ושכלתנות יתר בטיפול היא דרך להימנע ממגע אמיתי. טנא נשענת על המושג כדי לטעון שלמידה משמעותית, גם בהכשרת פסיכולוגים, נוצרת רק מהחיבור בין שלושתם.<\/p>"},{"term":"טיפול במשחק","en":"Play therapy","domains":["therapy"],"sources":["playbook"],"html":"<p>טיפול שבו הילד משחק, מדבר ומצייר, והמטפל מבין דרך המשחק את הרגשות והדאגות שגורמים לבעיות. \"הספר הראשון שלי על טיפול במשחק\" מציג את הגישה כפסיכודינמית ומסביר לילד את המסגרת: התוכנית שבונים יחד עם ההורים, סודיות \"של כיוון אחד\", וסיום הדרגתי שעשוי לעורר חזרה זמנית של הבעיות.<\/p>"},{"term":"טראומטיזציה משנית","en":"Secondary traumatization / Compassion fatigue","domains":["emerg"],"sources":["alon2023"],"html":"<p>שחיקת חמלה ופגיעה רגשית אצל מתערבים שנחשפים לאירועי חירום ולכאבם של אחרים. מודל רציפות בחרו\"ם מחייב שמירה מובנית עליהם: התערבות בשניים, גיבוי של מדריך או מנהל למתמחה, אפשרות החלפה בהתערבות ממושכת, השתתפות בדיבוב ורגישות למצב אישי פגיע (הורות, היריון, אבל).<\/p>"},{"term":"כיתה קטנה","en":"Special education class in a regular school","domains":["sped"],"sources":["tlv_smallclasses","outline_sec","outline_elem"],"html":"<p>כיתת חינוך מיוחד (כיתת ח\"מ) לתלמידים בעלי זכאות, שפועלת בתוך בית ספר רגיל. פורום חנ\"מ של שפ\"ח ת\"א-יפו מתאר את תפקיד הפסיכולוג בקליטתה ובשילובה: הכנת המנהל וחדר המורים (למשל ביום ההיערכות), ליווי בניית התל\"א ותוכניות השילוב, ייעוץ למחנכת ומעקב שנתי ברמת הפרט והכיתה כמערכת. הצלחת הכיתה מחייבת מבית הספר תפיסת עולם חינוכית הומניסטית של סובלנות, אחריות לכלל התלמידים ואמונה ביכולת.<\/p>"},{"term":"לא-מודע ארגוני","en":"Organizational unconscious","domains":["system"],"sources":["turi_unconscious","forest2014","greenwald2009","menzies","psa_map"],"html":"<p>הרעיון שגם לארגון יש \"מבנים נפשיים\": חרדות, הגנות, השלכות והזדהויות שפועלות מתחת לפני השטח ומשפיעות על תפקודו. תורי-מגדסי שואלת \"האם יש לבית הספר לא מודע?\" ומשיבה דרך מושגי ביון ותיאוריית המערכות הפתוחות. שפ\"ח ירושלים מרחיב את המושג ל<strong>\"לא-מודע חברתי\"<\/strong> (הופר): הסדרים חברתיים ותרבותיים משותפים שאנשים אינם מודעים להם, ובהם חרדות, מיתוסים, טראומות ו\"רגעי תהילה\".<\/p>"},{"term":"ליבת העבודה","en":"","domains":["general","system"],"sources":["outline_elem","outline_sec","rodded2017"],"html":"<p>במסמכי שפ\"ח ת\"א-יפו: הנושאים והמטרות שחייבים להיכלל בתוכנית העבודה השנתית של הפסיכולוג בבית הספר, כמו עבודה מערכתית, עבודה טיפולית עם תלמידים והורים, עבודה מניעתית, עבודה לפי חוק ומענה לחירום. העבודה צריכה להיות נאמנה לליבה ובה בעת דינמית, והליבה משמשת בסיס לשיחת החוזה עם המנהל. רודד ועמיתיו משתמשים במונח קרוב, \"ליבת המקצוע\", במובן אחר: הייחוד של הפסיכולוגיה החינוכית כמקצוע, שלדבריהם הוא התנועה הגמישה בין \"המסננים\" של הקלידוסקופ.<\/p>"},{"term":"ליווי התפתחותי","en":"Developmental monitoring","domains":["diag","general"],"sources":["outline_gan"],"html":"<p>במודל העבודה בגנים: מעקב שיטתי ורציף אחר ההתפתחות של כלל ילדי הגן, שכולל איתור חוזקות וחולשות, מניעה, בניית תוכניות ומעקב אחר יעילותן, בשיתוף הגננת וההורים ולפי מודל RTI. הוא נשען על כלים כמו \"מבטים\" (כלי התצפית של האגף לחינוך קדם-יסודי) ועל הערכה מבוססת קריטריונים לילדים מאותרים בלבד, כדי למנוע מיון-יתר. המודל מדגיש את <strong>ההתאמה<\/strong> (goodness of fit) בין הילד לבין אפשרויות ההכלה של סביבתו, שמשפיעה על התמודדותו גם כשמקור הקושי ביולוגי.<\/p>"},{"term":"ללא זיכרון וללא תשוקה","en":"Without memory and desire","domains":["therapy"],"sources":["bion","bahat","gantz2016","tene2011","reflection"],"html":"<p>עמדה של ביון שבה המטפל משתחרר מהזיכרון (כולל תיאוריות) ומהתשוקה (לריפוי, להצלחה), כדי להיות מכוונן ללא-ידוע שבפגישה; קרובים לה ה-negative capability, \"הוויתור על הידיעה המוקדמת\" אצל טנא, וה\"פניות\" כתנאי להכלה במסמך הרפלקציה. המקורות מסייגים אותה בדרכים שונות: בהט מדגישה שהיא אינה מחליפה את המאמץ להמשיג ושימוש הגנתי בה מסוכן. גנץ טוענת שהקליניקה החינוכית אינה \"נטולת תשוקה, זיכרון או הבנה\" אלא מגיעה עם מידע מהשדה, עם נורמות תפקוד ועם הבנה דינמית, לצד אי-ידיעה.<\/p>"},{"term":"לקוח הקצה","en":"End client","domains":["general","system","therapy"],"sources":["gantz2016","rodded2017","italy2019","rubric"],"html":"<p>התשובה לשאלה מי הלקוח של הפסיכולוג החינוכי: לפי גנץ ולפי רודד ועמיתיו הילד הוא תמיד \"לקוח הקצה\", אבל מרגע שהורה או מורה נכנסים לקשר טיפולי, גם אם הם ממלאים פונקציה עבור אחר, \"הוא הוא הקליינט\". איטלי מדברת על בית הספר ואנשי החינוך כ\"קליינט\" מערכתי, שבו ההתמקדות היא בפונקציה המקצועית; המחוון לתחום המערכתי מגדיר את הילדים \"לקוחות מרכזיים\" שההשפעה עליהם עוברת דרך המערכת.<\/p>"},{"term":"מבוי סתום אנליטי","en":"Analytic impasse","domains":["therapy"],"sources":["gantz2021"],"html":"<p>משבר ביחסים הטיפוליים שבו במקום \"מפגש של תודעות\" נוצר \"פינג-פונג\" (בנג'מין) או \"נדנדה\" (ארון), לעיתים בצורת <strong>יחסים קומפלימנטריים<\/strong> נוקשים של שולט-כנוע. גנץ מתארת מצב כזה בטיפול בהורים, \"כשהפתולוגיה תוקפת את הטיפול\" ומלהקת את המטפל לדרמה הפתולוגית. היציאה ממנו מתרחשת כשהמטפל נעזר ב\"סולמות\" (תיאוריה, הדרכה ולעיתים טיפול אישי) כדי לטפס ראשון אל \"המרפסת\" הרפלקטיבית ולהזמין את ההורים להתבוננות משותפת.<\/p>"},{"term":"מודל רופא המשפחה","en":"Family doctor model","domains":["general","therapy"],"sources":["kochavi2018"],"html":"<p>הפסיכולוג החינוכי ככתובת נגישה וזמינה לאורך זמן, שאליה פונים כשמתעורר קושי: עם ריווח בין פגישות, בלי סיום טיפול \"דרמטי\" ועם \"דלת פתוחה\". כוכבי מציגה אותו כחלק מתפיסה של קידום בריאות נפשית ומניעה, בדומה לרפואה מונעת.<\/p>"},{"term":"מחקר פעולה","en":"Action research","domains":["system"],"sources":["englert"],"html":"<p>תהליך מעגלי שמשלב לימוד שיטתי של בעיה עם המאמצים לפתור אותה; לפי לוין פעולה, מחקר והכשרה הם \"משולש אחד\". אנגלרט מציעה אותו כדרך עבודה שבה האבחון וההתערבות במערכת נמצאים \"בדיאלוג מתמיד\".<\/p>"},{"term":"מח\"ר","en":"Multi-professional thinking space","domains":["system"],"sources":["gaon2021"],"html":"<p>ראשי תיבות של \"מרחב חשיבה רב-מקצועי\": מודל לעבודה מערכתית של גאון-הרשקו, שמבוסס על גישת המנטליזציה ויוצר בבית הספר מרחב חשיבה רב-מקצועי קבוע.<\/p>"},{"term":"מיכל טוב דיו","en":"Good-enough container","domains":["system"],"sources":["nutkevitch2003","reflection"],"html":"<p>בהשאלה מוויניקוט: ישות ארגונית שמכילה את החלקים מעוררי החרדה וגם מאפשרת עבודה יעילה ויצירתית, הצטיינות ומימוש פוטנציאל. נוטקביץ' מביא לצידו את <strong>\"המיכל האמין\"<\/strong> של סטוקס, הנהלה יציבה דיה כדי לספק מטרה ברורה ולהכיל את מה שמושלך אליה; במסמך הרפלקציה מיכל טוב דיו הוא גם כזה שמאפשר את קיומו של ה\"מיסטי\".<\/p>"},{"term":"מיסטיקן והממסד","en":"The mystic and the establishment","domains":["system"],"sources":["nutkevitch2003","reflection"],"html":"<p>לפי ביון, \"המיסטיקן\" הוא פרט חריג שהוא בו-זמנית מאיים, הרסני ויצירתי, והממסד (הישות בעלת הסמכות) צריך להכיל אותו ולא לגרש אותו. אם אינו מוכל, הקבוצה עלולה לנדות אותו ואף להיהרס, אבל גם \"המימסד המכיל זקוק לגיניוס או למיסטי (לחריג) על מנת לגדול\"; לפי המקורות ההכלה הזו מוטלת בעיקר על ההנהלה.<\/p>"},{"term":"מנטליזציה","en":"Mentalization","domains":["therapy","system"],"sources":["greenwald2012","gantz2021","gantz2016","reflection","gaon2021"],"html":"<p>לפי פונגי וטרג'ט, היכולת לראות את העצמי ואת האחר כבעלי רעיונות, כוונות ורצונות, ולכן להכיר באחר כמי שעשוי להיות שונה מהעצמי; בבסיסה עומדת היכולת \"לשחק עם המציאות\", והיפוכה הוא <strong>מצב שקילות<\/strong> (mode of equivalence), שבו המציאות הפנימית והחיצונית \"חד הן\" ואין מקום לחלופה (\"הם בטח לועגים לי\"). גרינולד מחילה את המושגים גם על קבוצות (שעיר לעזאזל) ועל ארגונים (עימות בין צוותים), וגנץ מגדירה מנטליזציה בקצרה כ\"נתינת פשר פנימי להתרחשויות חיצוניות\". מודל מח\"ר של גאון-הרשקו בונה על הגישה הזו מרחב חשיבה רב-מקצועי קבוע בבית הספר.<\/p>"},{"term":"מסגור מחדש","en":"Reframing","domains":["therapy","emerg","system"],"sources":["miller","alon2023","englert"],"html":"<p>ניסוח מחדש של בעיה או של סימפטום, שפותח דרך חדשה להתבונן בהם. בפגישה הראשונה (מילר, \"הבניה מחדש\") המטרה היא שהמטופל ייצא אופטימי יותר ועם כיווני מחשבה על שינוי, ובהתערבות בחירום (אלון ועמיתיו) מגדירים את הסימפטום כביטוי לבריאות, למשל חולשה כחוזק. קרוב לו <strong>ייחוס משמעות חיובית<\/strong> (positive connotation), שאנגלרט מביאה מהגישה המשפחתית-מערכתית: מציגים קודם את התפקיד החיובי שדפוס ממלא בשימור שיווי המשקל של המערכת, ורק אחר כך את מחירו ואת החלופות.<\/p>"},{"term":"מסגרת טיפולית","en":"Setting / Frame","domains":["therapy","system"],"sources":["kellner2000","luria2011","italy2019","gantz2021"],"html":"<p>הגבולות והתנאים הקבועים שבתוכם מתקיים הקשר הטיפולי או ההדרכתי, כמו זמן, מקום, תדירות וסודיות. קלנר מבחינה בין \"מסגרת טיפולית\" (setting) לבין \"מערך טיפולי\" (frame) הרחב יותר, שכולל גם את כללי ההנחיה ויש לו פונקציה פטרנלית (גבולות שמעמתים עם המציאות) ומטרנלית (החזקה); לוריא ועמיתיו מבחינים, בעקבות גרין, בין \"התיבה\" (הגבולות הפורמליים) לבין \"התבנית הפעילה\" (אופן הפעולה בתוכם). בעבודה בבית הספר, לפי איטלי, הפסיכולוג צריך להביא את הסטינג \"בתוכו\", וגנץ מזכירה שגם הסטינג עצמו מעביר מסר יחסי.<\/p>"},{"term":"מעגלי פגיעות","en":"Circles of vulnerability","domains":["emerg"],"sources":["alon2023"],"html":"<p>הקבוצות שאירוע חירום מטלטל ומרחיק מה\"שלם\" (טמיר וחיימוב), למשל הכיתה, החברים, השכבה, האחים, מסגרות קודמות ותנועת הנוער, שכל אחת מהן דורשת התייחסות ייעודית. לפי אלון ועמיתיו זיהוי מעגלי הפגיעות הוא חלק מהערכת המצב שהמנהל מוביל כבר בכינוס הראשון של הצל\"ח.<\/p>"},{"term":"מערכת פתוחה","en":"Open system","domains":["system"],"sources":["englert","turi_unconscious","psa_map","reflection","nutkevitch2003","turi_contract"],"html":"<p>תפיסה של הארגון כאורגניזם חי שקולט תשומות מהסביבה, ממיר אותן ומוציא תפוקות, עם היזון חוזר מעגלי (Katz &amp; Kahn; לוין; מילר ורייס). המערכת מורכבת מתת-מערכות תלויות זו בזו, שואפת לשיווי משקל וחייבת לקיים יחסי גומלין עם סביבתה דרך גבול שצריך גם להפריד וגם לאפשר מעבר מווסת. מתיאוריה זו נלקחים מושגי המשימה המרכזית, הגבולות והתפקיד שבגישה הפסיכואנליטית-מערכתית.<\/p>"},{"term":"מפה מערכתית","en":"Systemic map (Fuchs)","domains":["system"],"sources":["fuchs","englert","rubric","psa_map"],"html":"<p>מודל של אינה פוקס (1995) שממפה את בית הספר לשישה מרכיבים שקשורים זה בזה: הרעיוני-אידיאולוגי (במרכז), האנושי, הפדגוגי, הכלכלי, הארגוני ומרכיב הנהלים. אנגלרט משתמשת בה לריכוז המידע על בית הספר, והמחוון לתחום המערכתי מצפה מהמתמחה לקרוא <strong>\"מפה מערכתית מרובדת\"<\/strong>, כלומר לקרוא את המערכת ברבדים שונים בעזרת המשגה תיאורטית.<\/p>"},{"term":"מרחב הביניים של הפסיכולוג","en":"The psychologist's in-between position","domains":["system","general"],"sources":["turi_unconscious","outline_sec","gantz2016"],"html":"<p>המיקום של הפסיכולוג החינוכי בין פנים לחוץ: הוא אינו חלק אינטגרלי מצוות בית הספר, כפוף לגורמים חיצוניים ועובד עם כלל בית הספר (במסמך ליבת העבודה בעל-יסודי: \"גורם חוץ בית ספרי\"). לפי תורי-מגדסי דווקא המיקום הזה מאפשר לו לסייע בהבנת המערכת. גנץ מתארת את הטשטוש בין פנים לחוץ, בין פרט למערכת ובין דמות לרקע בחוויית הפסיכולוג החינוכי בדימוי של טבעת מביוס.<\/p>"},{"term":"מרחב פוטנציאלי","en":"Potential space","domains":["therapy","system"],"sources":["gantz2016","luria2011","forest2014"],"html":"<p>מושג של ויניקוט למרחב ביניים בין הפנים לחוץ, בין הממשי למדומיין, שבו מתקיימים משחק, יצירה, תופעות מעבר ומשמעות אישית (\"ממלכת הסמלים\"). גנץ, בעקבות אוגדן, מתארת אותו כמתח דיאלקטי בין פנטזיה מנותקת לבין אחיזה נוקשה במציאות. לוריא ועמיתיו רואים בהדרכת מנהלים מרחב כזה, שבו המודרך יכול \"לשחק\", לנסות פתרונות ועמדות, ושמחייב \"סביבה מאפשרת\".<\/p>"},{"term":"משוב","en":"Feedback","domains":["diag","system"],"sources":["sapiryogev","ravid2024","englert"],"html":"<p>באבחון, לפי ספיר-יוגב, המשוב הוא <strong>\"מפגש בין מומחים\"<\/strong>: שיחה דיאלוגית שבה כל צד מביא את ה\"תיאוריה\" שלו על הבעיה, ומגיעים להבנה משותפת ולתוכנית עבודה; ראביד-חיון ובן ריי מדגישים את ערכו הטיפולי. אנגלרט משתמשת במונח במובן אחר, של סנג'י: לא החזרת מידע אלא \"זרימה הדדית של השפעה\" בין חלקי המערכת, שמעקב אחריה מאפשר לזהות דפוסים חוזרים, כמו ב\"ארגון לומד\".<\/p>"},{"term":"משימה מרכזית","en":"Primary task","domains":["system"],"sources":["turi_contract","turi_unconscious","menzies","forest2014","greenwald2009","reflection","psa_map"],"html":"<p>לפי רייס, המשימה שהארגון חייב לבצע כדי להתקיים; בכל רגע נתון יש לארגון משימה מרכזית אחת, וממנה נגזרים התפקידים, המשאבים, סדרי העדיפויות והיחסים עם הסביבה, והיא עשויה להשתנות, במיוחד במשבר. תורי-מגדסי מבחינה בין המשימה <strong>הנורמטיבית<\/strong> (המוצהרת), <strong>האקזיסטנציאלית<\/strong> (כפי שחברי הארגון תופסים אותה) ו<strong>הפנומנלית<\/strong> (כפי שהארגון מתנהג בפועל), ובשפ\"ח ירושלים, בעקבות וגה-זאגייר, מדברים על רמה הצהרתית, לא-מודעת ובפועל. מנזיס-לית' מסייגת שהמשימה רק מציבה גבולות, ובתוכם התרבות והמבנה נקבעים לפי הצרכים הפסיכולוגיים של החברים, כלומר לפי ההגנות מפני חרדה.<\/p>"},{"term":"מתווה השירות הפסיכולוגי-חינוכי","en":"","domains":["general","community"],"sources":["peraui2013","outline_elem","outline_sec","outline_gan"],"html":"<p>חוזר מנכ\"ל משרד החינוך (2010) שמגדיר את ייעוד השירות: \"לקדם את רווחתם ואת בריאותם הנפשית של כלל התלמידים במערכת החינוך\", ברמת המערכת והקהילה, הפרט והמשפחה, בשגרה ובחירום. המתווה מתאר שלושה רצפים: <strong>רצף התפתחות<\/strong> (גילים 3 עד 18, ובחנ\"מ עד 21), <strong>רצף אוכלוסיות<\/strong> (שירות לכל מי שבא במגע עם הילד) ו<strong>רצף מניעה-התערבות<\/strong>. הוא מגדיר שלוש רמות שירות, שעליהן נשענים מסמכי ליבת העבודה של השפ\"ח; התקינה עצמה נקבעת בידי שפ\"י והרשות.<\/p>"},{"term":"ניהול גבולות","en":"Boundary management","domains":["system"],"sources":["nutkevitch2003","turi_unconscious","reflection","psa_map","forest2014","turi_contract"],"html":"<p>לפי מילר ורייס, ליבת תפקיד המנהל: ניהול הגבולות של משימה, זמן, טריטוריה, חברות, תפקיד, סמכות ותהליך קבלת החלטות, באזור המפגש בין הארגון לסביבתו ובין תתי-המערכות שלו. גבולות מוגדרים ומנוהלים הם \"רשת ביטחון\" שמאפשרת למנהל לשמור על יכולת ההכלה שלו ועל שלמות המיכל (נוטקביץ'). שפ\"ח ירושלים מזהיר מפני <strong>\"קואליציות חוצות גבולות\"<\/strong>, בריתות של המנהל עם גורמי חוץ במקום עם הצוות, ותורי-מגדסי שואלת גם על גבולות התפקיד של הפסיכולוג עצמו: רחבים או צרים, נוקשים או חדירים.<\/p>"},{"term":"ניהול תיק","en":"Case management","domains":["general","system"],"sources":["kochavi2018","rodded2017","turi_contract"],"html":"<p>תיאום וויסות בין אנשי המקצוע, ההורים, המורים וכל מי שיכול לסייע לרווחת הילד, או בלשונה של כוכבי \"לנצח על התזמורת\"; רודד ועמיתיו מונים זאת כ\"פוזיציה מתכללת\". אצל תורי-מגדסי המונח case manager (\"אחראי מענה\") מתאר דווקא בעל תפקיד בבית הספר שממונה על נושאים מסוימים במסגרת תהליכי הבקרה והמעקב.<\/p>"},{"term":"ניטרליות ועמדה סקרנית","en":"Neutrality / Curious stance","domains":["therapy","system"],"sources":["italy2019","miller","rodded2017"],"html":"<p>עמדה מתבוננת ולומדת, שאינה מתגוננת, תוקפנית או מרצה. בפגישה הראשונה בטיפול (מילר) עמדה ניטרלית והימנעות מחשיפה עצמית עוזרות למטופל להבין מה טיב היחסים הטיפוליים; איטלי מחילה אותה על המפגש עם בית הספר, שבו היא מאפשרת לעבד בהדרגה את מה שהושלך על הפסיכולוג ולהמשיג אותו כאבחון מערכתי. רודד ועמיתיו מדגישים עמדה סקרנית ולא דוגמטית כחלק מהאינטגרציה התוך-אישית.<\/p>"},{"term":"סודיות","en":"Confidentiality","domains":["therapy","general"],"sources":["playbook","kellner2000","greenwald2012","kochavi2018","luria2011","outline_sec"],"html":"<p>חובת המטפל לשמור על מה שנאמר בטיפול. \"הספר הראשון שלי על טיפול במשחק\" מסביר לילד שזה \"סוד של כיוון אחד\": המטפל שומר, והילד חופשי לספר; קלנר מעלה גם את שאלת הסודיות מצד המטופל, בעקבות האזהרה של פרויד שכשמטופל משוחח על הטיפול עם אחרים \"ידלוף דווקא המיטב\". במסגרת החינוכית הסודיות נבחנת מול הצורך בשיתוף: גרינולד מציעה \"גבול דק\" שמאפשר דיאלוג עם הצוות תוך שמירה על פרטיות, וכוכבי מתארת שילוב הורים בטיפול במתבגר בלי לבטל את הסודיות.<\/p>"},{"term":"סוציאליזציה מקצועית","en":"Professional socialization","domains":["general"],"sources":["greenwald2009","tauber"],"html":"<p>הדרך שבה הפרופסיה מכשירה את המתלמדים ומפקחת עליהם, אחד מממדי הפרופסיה לצד גוף ידע, קוד אתי וביקורת עצמית. לפי גרינולד-קשאני ומטיחס היא כוללת גם מבני הדרכה ושפה ארגונית פנים-שפ\"חית, וטאובר קוראת לבנות בכל תחנה <strong>מודל קליטה<\/strong> ברור ומתמשך שמשתף את כלל הפסיכולוגים ובעלי התפקידים בשירות.<\/p>"},{"term":"סימפטום מערכתי","en":"Systemic symptom","domains":["system"],"sources":["forest2014"],"html":"<p>קושי שנראה פרטני, של הורה, תלמיד, כיתה, מורה או מנהל, אבל מבטא \"קול במערכת\", כלומר קושי של המערכת כולה (שפ\"ח ירושלים). לכן ההבנה וההתערבות מכוונות גם אל המערכת, ולא רק אל מי שנושא את הסימפטום.<\/p>"},{"term":"סיפור דומיננטי וסיפור אלטרנטיבי","en":"Dominant and alternative stories","domains":["system","therapy"],"sources":["forest2014","fuchs"],"html":"<p>מושגים מהגישה הנרטיבית של מייקל וייט: הסיפור המקובל שנתפס כ\"מציאות\", לעומת סיפור מועדף שנבנה מאירועים יוצאי דופן (unique outcomes). שפ\"ח ירושלים מחיל אותם על בית ספר במשבר, בעזרת re-membering ו\"עדים\" שהופכים שותפים פעילים לסיפור החדש. גם המצגת על המפה המערכתית מונה את <strong>\"הנרטיב הבית ספרי\"<\/strong>, סיפור העבר, ההווה והעתיד של בית הספר, בין ממדי האבחון.<\/p>"},{"term":"ס-ק-י-ר-ת התפתחות","en":"","domains":["diag"],"sources":["outline_gan"],"html":"<p>מסגרת לסקירה התפתחותית של ילדי גן (מי-טל ושר), שמשלבת את הגישה האקולוגית עם המודל הרב-ממדי של לאזרוס. ראשי התיבות הם <strong>ס<\/strong>ביבה, <strong>ק<\/strong>וגניציה (עמדות, תפיסות, כישורים), <strong>י<\/strong>חסים בין-אישיים, <strong>ר<\/strong>גשות (ביטוייהם), <strong>ת<\/strong>גובות התנהגותיות, ו<strong>התפתחות<\/strong>, כלומר ההתאמה ההתפתחותית לשלב.<\/p>"},{"term":"עבודה מערכתית","en":"Systemic work","domains":["system","general"],"sources":["kochavi2018","outline_sec","outline_elem","rubric","greenwald2009","forest2014","englert"],"html":"<p>עבודה שמושא האבחון וההתערבות בה הוא המערכת (בית ספר, גן, צוות), מתוך ראיית הילדים כלקוחות שההשפעה עליהם עוברת דרכה; כוכבי מנסחת זאת כ\"אין ילד ללא מערכת\", בהקבלה ל\"אין תינוק ללא אם\" של ויניקוט. לדבריה היא בראש ובראשונה צורת חשיבה שמתפתחת בהדרגה, ויכולה להתקיים גם בשיחה שקטה אחד על אחד. במסמכי ליבת העבודה היא מתבטאת במפגשים קבועים עם המנהל ובעלי התפקידים לייעוץ, לשותפות במדיניות ולהפעלת תוכניות מניעה, והמחוון לבחינת הסיום דורש להציג התערבות ב-2 עד 3 ממדים של המערכת ולבדוק את יעילותה.<\/p>"},{"term":"עבודה רב-מקצועית","en":"Multidisciplinary teamwork","domains":["sped","system"],"sources":["sped_multi","manor2004","greenwald2012","tlv_smallclasses","outline_elem","outline_sec"],"html":"<p>עבודה משותפת של אנשי המקצוע סביב הילד ומשפחתו, שבחינוך המיוחד כוללת לפי החוק בניית תל\"א; במסמך ליבת העבודה ביסודי היא מתבטאת בישיבה בין-מקצועית שבועית על כל הכיתות. בעקבות מנור-בנימיני מבחינים בין צוות מולטי-, אינטר- וטרנס-דיסציפלינרי ובין שלושה סוגי שיח (יידוע, התייעצות והתחלקות), ומחקרה מראה שהשתתפות ההורים בישיבות נפגעת משיפוטיות ומשתפרת עם מומחיות, התמקדות, מקום לרגשות וכבוד. גרינולד מציעה לראות בישיבה רב-מקצועית <strong>\"פוליפוניה\"<\/strong>, שבה חלק מהמשתתפים מייצגים את ההיבט התפקודי וחלקם את הקול הסובייקטיבי של הילד.<\/p>"},{"term":"עמדה חינוכית-הסתגלותית ועמדה טיפולית-רפלקטיבית","en":"Educational-adaptive vs. therapeutic-reflective stance","domains":["therapy","system"],"sources":["greenwald2012","reflection"],"html":"<p>שתי עמדות במפגש בין חינוך לטיפול. העמדה <strong>החינוכית-הסתגלותית<\/strong> מתעניינת בהסתגלות הפרט למשימות הנורמטיביות לגילו (למידה, התנהגות, חברה) ומודדת שינוי בקריטריונים אובייקטיביים ומוסכמים; העמדה <strong>הטיפולית-רפלקטיבית<\/strong> חוקרת את העולם הפנימי והסובייקטיבי, את המשמעות, הרגשות והכוונות של פרט, קבוצה או ארגון. מנוני, שאליה מייחס מסמך הרפלקציה את ההבחנה, משייכת את הראשונה לצוות החינוכי ואת השנייה למטפלים בלבד, ואילו גרינולד טוענת שהגבולות ביניהן אינם חדים ושיש בכך תועלת.<\/p>"},{"term":"עמדה פרנואידית-סכיזואידית ועמדה דיכאונית","en":"Paranoid-schizoid and depressive positions","domains":["therapy","system"],"sources":["forest2014","menzies","psa_map"],"html":"<p>שתי עמדות נפשיות לפי קליין: הראשונה נשענת על הגנות פרימיטיביות של פיצול והשלכה, והשנייה על אינטגרציה ועל היכולת להחזיק טוב ורע יחד. ברמה המערכתית שפ\"ח ירושלים מגדיר את מטרת ההתערבות כמעבר מפיצול, מחנות והאשמות לאינטגרציה וחיבור. מנזיס-לית' מראה שמוסדות שנשענים על הגנות פרנואידיות-סכיזואידיות מתנגדים לשינוי יותר מכולם.<\/p>"},{"term":"עקרונות הקמ\"צ","en":"Proximity, Immediacy, Expectancy (PIE)","domains":["emerg"],"sources":["alon2023"],"html":"<p>שלושה עקרונות להתערבות בחירום, שמקורם בטיפול בתגובות קרב: <strong>ק<\/strong>רבה (סיוע במקום האירוע או במקום משמעותי הקשור אליו, כמו בית הספר), <strong>מ<\/strong>יידיות (מה שלא נעשה בסמיכות לאירוע קשה לעשות אחר כך) ו<strong>צ<\/strong>יפייה (העברת מסר שהתגובות המיידיות נורמליות וזמניות ושתהיה חזרה לרצף). אלון ועמיתיו מתאימים כל עיקרון גם לרמת המסגרת החינוכית.<\/p>"},{"term":"עשייה והוויה","en":"Doing / Being","domains":["general","emerg","therapy"],"sources":["alon2023","reflection","englert"],"html":"<p>צמד מושגים לשני ממדים בעבודת הפסיכולוג. במודל רציפות בחרו\"ם הם שתיים משלוש רמות ההכשרה, לצד חשיבה (knowing): \"מעשה\" (doing) הוא ההתערבות עצמה, ו\"רגש\" (being) הוא ההוויה הפנימית של המתערב מול איום ומוות. במסמך הרפלקציה הם \"שתי עמדות מהותיות\" שמלוות את הפסיכולוג, ואנגלרט מציעה \"שאלות ממקום אחר\" שעוברות מ-doing ל-being, כלומר מכוונות לכוחות, לערכים ולמשאלות שלא מומשו.<\/p>"},{"term":"פגישה ראשונה","en":"First session","domains":["therapy","system"],"sources":["miller","italy2019"],"html":"<p>הפגישה הראשונה \"נותנת את הטון\" לתהליך כולו, ולכן מנוהלת כך שתאפשר בו-זמנית הערכה ויצירת מעורבות; מילר ממליץ על מסגרת שיטתית (בהשראת Milan), הימנעות מהנחות מוקדמות, שימוש במילות המטופל ועמדה ריאלית לגבי מה שאפשר להשיג. איטלי מחילה את עקרונות \"הפגישה האנליטית הראשונה\" של אוגדן על הפגישה הראשונה עם בית הספר והמנהל, שלדבריה היא \"תנאי בסיסי והכרחי לעבודה\", כולל הקשב להעברה, להעברה הנגדית ולחרדות שמתעוררות עוד לפני המפגש.<\/p>"},{"term":"פגישות אישיות עם המנהל","en":"Individual meetings with the principal","domains":["system"],"sources":["italy2019","rodded2017","luria2011","dorhaim2018"],"html":"<p>מפגשים קבועים של הפסיכולוג עם מנהל בית הספר, שאיטלי מכנה <strong>\"מרחב אנליטי\"<\/strong>: מרחב ייחודי לכל \"זוג\", שבו המנהל יכול לחשוב ולהרגיש, ושמחייב התאמה לקצב ולשפה שלו. רודד ועמיתיו מראים שבמפגש כזה הפסיכולוג נע, רצוי במודע, בין פוזיציה טיפולית, ייעוצית-ארגונית וקונסולטטיבית. לוריא ועמיתיו מבחינים בין היוועצות לבין הדרכה אישית למנהלים חדשים, שמטרתה טיפוח \"העצמי הניהולי\" לאורך זמן.<\/p>"},{"term":"פוזיציות מקצועיות","en":"Professional positions","domains":["general"],"sources":["rodded2017","luria2011"],"html":"<p>עמדות עבודה של הפסיכולוג החינוכי, שנבדלות זו מזו בכלים ובעיקר בצורת החשיבה ובהתמקמות: דיאגנוסטית, פסיכו-חינוכית, טיפולית, ייעוצית-ארגונית, הדרכתית, מתכללת (ניהול תיקים), חוקרת וקונסולטטיבית (רודד ועמיתיו). לעיתים עוברים בין כמה פוזיציות באותה פגישה, ורצוי לעשות זאת במודע. לוריא ועמיתיו מתארים באופן דומה את עמדות המדריך מאחורי המנהל (\"נותן גב\"), לפניו (מציע את המצפן שלו, במשורה) ולצדו (מצפן משותף).<\/p>"},{"term":"פונקציית אלפא ומרכיבי בטא","en":"Alpha function and beta elements","domains":["therapy","system"],"sources":["bion","nutkevitch2003","reflection"],"html":"<p>לפי ביון, <strong>מרכיבי בטא<\/strong> הם רסיסי חוויה גולמיים, חסרי משמעות ושם, שאי אפשר לחשוב אותם, והנפש שואפת להיפטר מהם בהזדהות השלכתית. <strong>פונקציית אלפא<\/strong> הופכת אותם ל<strong>מרכיבי אלפא<\/strong>, שאפשר לאחסן בזיכרון, לחלום, להפוך לסמל ולהשתמש בהם לחשיבה. אצל נוטקביץ' זו הפונקציה שמאפשרת לאדם או לארגון לפעול מתוך הבנה ולא מתוך צורך להיפטר מההשלכה, ובמסמך הרפלקציה היא מתוארת כ\"תרגום\" שנותן משמעות.<\/p>"},{"term":"פורום תמיכה","en":"","domains":["system"],"sources":["greenwald2009"],"html":"<p>צוות קבוע בכל בית ספר, שמורכב מהמנהל, הפסיכולוג החינוכי, היועצת ומורת השילוב, שממפה צרכים, בוחן כניסה של גורמים טיפוליים, מפנה מקרים ועוקב אחרי ההתערבויות. המודל הוקם בשפ\"ח שדרות כחלק ממיצוב השפ\"ח כ\"גוף מתכלל\" ו\"שער כניסה\" לשירותים הטיפוליים בעיר.<\/p>"},{"term":"פירמידת המניעה","en":"Prevention pyramid","domains":["general","emerg","community"],"sources":["rodded2017","outline_gan","kochavi2018","peraui2013"],"html":"<p>מניעה ראשונית, שניונית ושלישונית, כחלק מרצף מניעה-התערבות שבו הפסיכולוג החינוכי עוסק בעיקר בקידום בריאות נפשית, באיתור מוקדם ובהפצת ידע פסיכולוגי, ולא רק בטיפול אחרי שהבעיה נוצרה (כוכבי, פראוי). רודד ועמיתיו מציגים זאת כפירמידה שבקצה שלה התערבות בחירום, ומוסיפים <strong>ראייה סלוטוגנית<\/strong> של זיהוי ומינוף כוחות וחוסן. במודל העבודה בגנים, בעקבות קפלן, ההגדרות מנוסחות ביחס לאירוע: הכנה והיערכות (ראשונית), זיהוי והתערבות סמוך לאירוע (שניונית) והפחתת משקעים לטווח ארוך (שלישונית).<\/p>"},{"term":"פרואקטיביות","en":"Proactivity","domains":["system","general"],"sources":["englert","turi_contract","luria2011","rubric"],"html":"<p>לפי קובי, נשיאה באחריות, בחירת התגובה והרחבת \"טווח ההשהיה\" בין גירוי לתגובה, למשל בשאלה \"לשם מה?\"; ההפך הוא ריאקטיביות, שמונעת מדאגה ומ\"רצון לרצות\". אנגלרט מזהירה שהמטלות שבחובה (אבחונים, ועדות) מושכות את הפסיכולוג לעמדה ריאקטיבית שמובילה לשחיקה, ותורי-מגדסי מתארת את המתח בין עבודה מניעתית מתוכננת לבין \"סחף לתגובתיות\" ו\"כיבוי שריפות\". לוריא ועמיתיו מזהירים מפני \"דיקטטורה של המיידי\" גם בהדרכת מנהלים, והמחוון לתחום המערכתי מציב עמדה פרו-אקטיבית כציפייה מהמתמחה.<\/p>"},{"term":"צל\"ח","en":"School emergency team","domains":["emerg"],"sources":["alon2023"],"html":"<p>ראשי תיבות של \"צוות לשעת חירום\": צוות בית ספרי שנקבע מראש לפי חוזר המנכ\"ל, לרוב מקביל לצוות ההנהלה, ומתכנס ראשון אחרי אירוע חירום בראשות המנהל כדי להעריך את המצב ולתכנן את ההתמודדות. ההיערכות המקדימה כוללת גם \"ערכת חירום\" מוכנה (רשימות, חומרים להנהלה ולמורים, עקרונות שיחה לפי גיל ומכתב להורים), ולפסיכולוג \"ערכת חירום אישית\".<\/p>"},{"term":"קבוצת עבודה","en":"Work group","domains":["system"],"sources":["turi_unconscious","forest2014","psa_map","nutkevitch2003"],"html":"<p>לפי ביון, הרובד המודע, המציאותי והמשימתי של הקבוצה, שמקדם את המטרה המוצהרת שלשמה היא קיימת. שפ\"ח ירושלים מקביל אותה לאגו ומעמיד אותה מול \"קבוצת הנחות היסוד\", שנסוגה בחרדה לתפקוד הגנתי; נוטקביץ' מתאר כל קבוצה או יחידה ארגונית בעלת משימה כ\"מיכל שבו מתבצעת עבודה\".<\/p>"},{"term":"קונסולטציה","en":"Consultation","domains":["system","sped","therapy"],"sources":["sped_multi","rodded2017","luria2011","forest2014","greenwald2009","ostrovil1987"],"html":"<p>סיוע של הפסיכולוג למי שעובדים ישירות עם הילד (מורים, מטפלים, מנהלים), במקום התערבות ישירה או לצידה. בעבודה רב-מקצועית בחנ\"מ העבודה הייעוצית מתייחסת גם לחלקים האישיים שהילד מפעיל אצל המטפלים ושמונעים מהם להשתמש במלוא כישוריהם. רודד ועמיתיו מבחינים בין פוזיציה קונסולטטיבית, שעוסקת בתלמיד מסוים או בקשר מסוים, לבין פוזיציה ייעוצית-ארגונית, שמתבוננת בתהליכים ובמבני העבודה, ולוריא ועמיתיו מבדילים בין היוועצות לבין הדרכה.<\/p>"},{"term":"קלידוסקופ","en":"Kaleidoscope","domains":["general"],"sources":["rodded2017"],"html":"<p>הדימוי המארגן של רודד, יצחקי וכהן לריבוי שבמקצוע: על \"שדה הראייה\" החינוכי פועלים חמישה מסננים (אוכלוסיות, פוזיציות מקצועיות, רצף מניעה-התערבות, רמות ניתוח והשקפות תיאורטיות), ותנועתם יוצרת דפוסי עבודה משתנים. לפי המחברים ליבת המקצוע וייחודו הם תנועת הסיבוב הגמישה והסקרנית שבוחרת בכל רגע את הצירוף המתאים. תיאור המקרה במאמר מראה איך הזזת המסננים מובילה מהפניה לאבחון לקראת ועדה, לטיפול דינמי, לעבודה עם המחנכת, לתוכנית אקלים בית ספרית ולחשיבה קהילתית.<\/p>"},{"term":"קליניקה חינוכית","en":"Educational clinic","domains":["therapy"],"sources":["gantz2016","greenwald2012"],"html":"<p>לפי גנץ, העבודה הטיפולית בתוך המרחב החינוכי, שמאופיינת ב\"מתח דיאלקטי גבוה\": העולם הפנימי והמציאות החיצונית נוכחים בה בעוצמה בו-זמנית, בלי קריסה או נתק. זו \"קליניקה לא סטרילית\", שמגיעה עם מידע מהשדה, עם נורמות תפקוד ועם מחויבות ל<strong>\"זמן-ילד\"<\/strong>, כלומר לקצב ההתפתחות של הילד, גם כשההמתנה להבשלה איטית עלולה לגבות מחיר של הצטברות פערים. לכן היא משלבת עבודה דינמית עם מהלכים \"מבחוץ כלפי פנים\" שמכוונים לשינוי במציאות.<\/p>"},{"term":"רוורי","en":"Reverie","domains":["therapy","system"],"sources":["bion","tene2011","nutkevitch2003","reflection"],"html":"<p>לפי ביון, מצב נפשי של \"קשב צף\", שבו האם (או המטפל) מסוגלת לקלוט את מה שהושלך אליה ולהישאר איתו, והנפש ערוכה לעבור מהחושי למנטלי; הוא מאפשר את פעולת פונקציית האלפא. טנא מתארת אותו כ\"שיטוט חשיבתי\" שבו המטפל קשוב למטופל וגם למצבים רגשיים מפוצלים שחלחלו ממנו לעולמו שלו. במסמך הרפלקציה נוסף לו, בעקבות בירן, הלך הרוח האופטימי, \"הידיעה שיהיה טוב\".<\/p>"},{"term":"ריבוי נאמנויות","en":"Multiple loyalties","domains":["general","system"],"sources":["outline_gan","rodded2017","peraui2013"],"html":"<p>מחויבות אתית בו-זמנית לילד, להוריו, לגננת או לצוות החינוכי, למפקחת ולגורמי הרשות, שמחייבת ניהול זהיר של נאמנויות שעלולות להתנגש (מודל העבודה בגנים). פראוי מתאר את החוויה כ<strong>\"לוליינות\"<\/strong>, הליכה על חבל דק בין נאמנויות ומטרות סותרות תוך הכלת ניגודים ו\"אפשור דיאלוג\", ורודד ועמיתיו מונים את ניהול הנאמנויות המרובות כחלק מהאינטגרציה הבין-אישית.<\/p>"},{"term":"רמת שירות","en":"","domains":["general"],"sources":["outline_elem"],"html":"<p>אחת משלוש רמות השירות (א', ב', ג') שמתווה השירות של משרד החינוך מאפשר לבית ספר. שאיפת שפ\"ח ת\"א-יפו היא לרמה א', המרבית, אבל היא אינה ממומשת במלואה בשל התקינה; כשהשעות אינן מספיקות אפשר להרחיב את השירות באמצעות שפ\"מ.<\/p>"},{"term":"רציפות בחרו\"ם","en":"Continuity in emergency (knowing, being, doing)","domains":["emerg"],"sources":["alon2023"],"html":"<p>מודל עבודה והכשרה של אלון, גרוס וקונפינו להתערבות מיידית בחירום במסגרות חינוך, בשלוש רמות: <strong>חשיבה<\/strong> (knowing: גישת הרצפים ועקרונות הקמ\"צ), <strong>רגש<\/strong> (being: העולם הרגשי של המתערבים מול מוות ואיום) ו<strong>מעשה<\/strong> (doing: ההבדל בין התערבות מיידית לטיפול מתמשך). המודל כולל פרוטוקול לתפקיד המנהל והפסיכולוג בכל שלב, מהיערכות מקדימה והרכבת הצל\"ח ועד דיבוב והתערבות מערכתית בשבועות שאחרי האירוע.<\/p>"},{"term":"רשת ביטחון","en":"Safety net","domains":["general","system"],"sources":["tauber","nutkevitch2003","reflection"],"html":"<p>המונח משמש בשני מובנים. אצל טאובר זו התשתית שמחזיקה את הפסיכולוג המתחיל: הדרכות, ידע תיאורטי וצוות תומך בתוך השירות, ולדבריה זו גם תפיסה מובילה בעבודה עם מערכות. אצל נוטקביץ' ובמסמך הרפלקציה זו המסגרת של גבולות מוגדרים ומנוהלים (משימה, תפקיד, סמכות), שמסייעת למנהל לשמור על יכולת ההכלה שלו ועל שלמות המיכל.<\/p>"},{"term":"שאלת אבחון","en":"Diagnostic question","domains":["diag"],"sources":["sapiryogev"],"html":"<p>שאלה ספציפית שמגבשים עם המורה, ההורים והילד, ושמכוונת את תכנון האבחון; ממנה נגזרות השערות שנבדקות (ואולי מוטב, מופרכות) במפגשי האבחון. ה\"אינטגרציה\" בסוף התהליך היא התשובה לשאלות האבחון, והיא עמוד השדרה של המשוב והדו\"ח.<\/p>"},{"term":"שומר סף","en":"Gatekeeper","domains":["general","sped"],"sources":["tauber","greenwald2009"],"html":"<p>תפקיד הפסיכולוג במעבר בין החינוך הרגיל לחינוך המיוחד, מורשת של ההקשר האבחוני ההיסטורי של המקצוע (טאובר). גרינולד-קשאני ומטיחס מתארות את החוויה שהאבחון וההשמה השתלטו על העבודה (פסיכולוגים כ\"טסטולוגים\"), וטוענות שהבחירה ב\"פסיכולוגיה של המתקשים\" על פני \"פסיכולוגיה של מערכת החינוך\" היא בחירה מקצועית שאפשר לבחון מחדש.<\/p>"},{"term":"שותפות עם הורים","en":"Parent-professional partnership","domains":["sped","therapy"],"sources":["sped_multi","manor2004"],"html":"<p>יחסים בין הורים לאנשי מקצוע שמאופיינים בתרומה הדדית, ברצון לעבוד יחד לקראת מטרות מוסכמות, באמון, ביושר וביכולת לחשוף מידע (Dunst). מעורבות ההורים בצוות היא \"סיכוי וסיכון\": היא יכולה להיות מיטיבה ומרפאה, או להפוך לקונפליקט שפוגע בילד. מנור-בנימיני מוצאת שתחושת שיפוטיות מצד אנשי המקצוע מורידה את השתתפות ההורים, ושכבוד, הקשבה ומקום לרגשות מעלים אותה.<\/p>"},{"term":"שחיינים וצוללנים","en":"Swimmers and divers","domains":["general"],"sources":["kochavi2018","peraui2013"],"html":"<p>מטפורה של כוכבי לשני סוגי מומחיות: הצוללן יורד לעומק בתחום צר, והשחיין שוחה למרחקים ומקשר בין אירועים ומצבים \"על פני השטח, קרוב למציאות\". הפסיכולוגים החינוכיים הם בראש ובראשונה שחיינים, ורבים מהם הופכים עם הזמן גם לצוללנים. כוכבי מדגישה ש\"רחב\" אינו \"שטחי\", בתגובה לחשש מבינוניות שעלה בדיון בקבוצת הפייסבוק של הפסיכולוגים החינוכיים; תחושת שטחיות ו\"פסיכולוגיה בינונית\" עלו גם בראיונות במחקר של פראוי.<\/p>"},{"term":"שילוב","en":"Inclusion","domains":["sped"],"sources":["tlv_smallclasses","outline_sec","outline_gan"],"html":"<p>יצירת קשר והשתייכות בין תלמידים בעלי צרכים מיוחדים לבין כלל בית הספר. בכיתות הקטנות זה כולל מערכת שעות קבועה לשילוב, <strong>\"כניסה דו-כיוונית\"<\/strong> מתוכננת של תלמידים בין כיתות, תוכניות עמיתים ופעילויות משותפות. הפסיכולוג מעורב בתכנון תוכנית השילוב האישית והכיתתית, במעקב ובהתאמות, ומשתתף בוועדות השילוב.<\/p>"},{"term":"שערי כניסה","en":"Entry points","domains":["general","system"],"sources":["rodded2017","greenwald2009"],"html":"<p>אצל רודד ועמיתיו (בהשראת שטרן): הזדמנויות להתערבות במסגרת החינוכית, שהפסיכולוג תר אחריהן כל הזמן ויוצר אותן. גרינולד-קשאני ומטיחס משתמשות בביטוי במובן מוסדי: מיצוב השפ\"ח כ\"שער כניסה\" וכ\"גוף מתכלל\" שמרכז, מאגם ומסנן את כל השירותים הטיפוליים שנכנסים למערכת החינוך בעיר.<\/p>"},{"term":"שפ\"מ","en":"","domains":["general"],"sources":["outline_elem","outline_sec"],"html":"<p>שירות פסיכולוגי משלים (בלשון מסמך העל-יסודי: \"שירותים משלימים\"): הרחבה של שירותי השפ\"ח מעבר לשעות התקן, שמאפשרת להוסיף אבחונים, טיפולים והתערבויות מערכתיות. מסמכי ליבת העבודה מציגים אותו כדרך להשלים את החסר שנובע מהיקפי הכיסוי ומעומס המטלות, וממליצים למתמחה להכיר את שירותיו כדי להציע אותם כשהשעות אינן מספיקות.<\/p>"},{"term":"תגובה להתערבות (RTI)","en":"Response to Intervention","domains":["diag","sped"],"sources":["outline_gan","sped_multi","rodded2017"],"html":"<p>מודל הערכה מעגלי ודינמי: איתור צרכים, החלטה על התערבות, ניטור התגובה ובדיקה חוזרת, בשלוש רמות עוצמה; רק כשההתקדמות מעטה עוברים להערכה פסיכולוגית מעמיקה (מודל העבודה בגנים). רודד ועמיתיו מציגים אותו כחלופה לאבחון מסורתי של לקויות למידה, שמטשטשת את הגבול בין הערכה להתערבות. בעבודה רב-מקצועית בחנ\"מ הוא חלק מ\"הערכה מבוססת צרכים\", לצד מודל פתרון בעיות.<\/p>"},{"term":"תהליך מקביל","en":"Parallel process","domains":["system","therapy"],"sources":["greenwald2009","forest2014","italy2019","rodded2017"],"html":"<p>שחזור של דינמיקה מרמה אחת של המערכת ברמה אחרת: המערכת מבטאת את הדינמיקה של האוכלוסייה שהיא משרתת, והצוות או הפסיכולוג \"נשאבים\" לדפוסים הרגשיים של מי שהם עובדים איתו (שפ\"ח ירושלים). גרינולד-קשאני ומטיחס ממליצות לראות בתגובה רגשית לא אופיינית של הפסיכולוג רמז לתהליך מקביל, ולעבד אותה בהדרכה לפני ששותפים בה את הצוות. איטלי מתארת התערבות לחיזוק השייכות בחדר המורים כתהליך מקביל לשייכות התלמידים.<\/p>"},{"term":"תוכנית לימודים אישית (תל\"א)","en":"Individualized education program (IEP)","domains":["sped"],"sources":["tlv_smallclasses","manor2004"],"html":"<p>תוכנית אישית שהצוות הרב-מקצועי חייב לבנות לכל תלמיד בחינוך המיוחד; בישראל החוק מחייב ליידע את ההורים עליה ולקבל את חתימתם. הפסיכולוג מלווה את בנייתה, מעורר מודעות להיבטים הפסיכולוגיים שבה ועוקב אחר יישומה, ובכיתות הקטנות מומלץ לסמן מראש את ישיבות התל\"א, כשלוש בשנה.<\/p>"},{"term":"תיוג-יתר","en":"Over-labeling","domains":["diag","system"],"sources":["outline_gan","greenwald2012"],"html":"<p>מתן הגדרה של תסמין להתנהגות שבגיל הרך עשויה להעיד על קושי זמני, דבר שעלול ליצור נבואה המגשימה את עצמה (מודל העבודה בגנים). גרינולד מתארת תופעה קרובה, <strong>שימוש הגנתי באבחנה<\/strong>: מתן תווית (למשל ADHD) מתוך צורך \"להגיד משהו בעל משמעות\" מול לחץ הצוות, כשאף גורם אינו מחזיק את המשימה הטיפולית של חקירת המשמעות עבור הילד.<\/p>"},{"term":"תיק גן ומיפוי גן","en":"","domains":["system","diag"],"sources":["outline_gan"],"html":"<p>שני כלים ייחודיים לעבודה בגנים. <strong>מיפוי גן<\/strong> הוא תהליך משותף לגננת ולפסיכולוג, שממפה את מאפייני הגן, הצוות והתוכניות ומאתר את הילדים שזקוקים להתייחסות, והוא בסיס לחוזה העבודה עם הגננת. <strong>תיק גן<\/strong> מתעדכן מדי שנה, מתעד את העבודה המערכתית והפרטנית בגן ומאפשר רציפות גם כשמתחלף פסיכולוג.<\/p>"},{"term":"תפירת חליפה אבחונית","en":"Tailored assessment","domains":["diag"],"sources":["sapiryogev"],"html":"<p>תכנון אבחון לפי השערות שנגזרות משאלות האבחון, עם דגש על היכולות הרלוונטיות, בניגוד ל<strong>\"תלבושת אחידה\"<\/strong> שבה כל ילד עובר את אותה סוללת מבחנים. לפי ספיר-יוגב המפגש הראשון כולל ראיון עם הילד ובדיקה ראשונית לפי ההשערות, והמפגש השני מוקדש להעמקה בשאלות שנותרו פתוחות.<\/p>"}],"domainText":{"orientation":"<h4>למתמחים בתחילת הדרך<\/h4>\n<p>רשימת הקריאה למתמחים בשפ\"ח תל אביב-יפו מסודרת לפי שנות ההתמחות, ובתוך כל שנה לפי שבעה תחומים: כללי, אבחון, טיפול, מערכת, חירום, חנ\"מ וקהילה. מתחילים בשנה א' וממשיכים קדימה. השלבים בנויים כמו ארוחה. המתאבנים הם הקריאה לשנה א', ובהם משקל גדול לזהות מקצועית ולכניסה לעבודה. המנה העיקרית היא הקריאה לשנים ב'-ג', ורובה בתחומי המערכת והטיפול. הקינוח הוא הקריאה לשנה ד', ובו תיאוריה מעמיקה יותר וחומר לקראת בחינת הסיום <a class=\"ref\" href=\"#i-rubric\" data-ref=\"rubric\">המחוון המערכתי<\/a>.<\/p>\n<p>בחודש הראשון כדאי לקרוא:<\/p>\n<ul>\n<li><a class=\"ref\" href=\"#i-tauber\" data-ref=\"tauber\">טאובר<\/a>: מחקר על השנה הראשונה בשפ\"ח של פסיכולוגים שהגיעו מהכשרה אחרת. הוא מתאר את ה\"קפיצה למים\" ואת הצורך ב\"רשת ביטחון\" של הדרכה, ידע וצוות.<\/li>\n<li><a class=\"ref\" href=\"#i-tene2011\" data-ref=\"tene2011\">טנא 2011<\/a>: מאמר של צילה טנא מהנהלת השירות על למידה ועל הדרכה. הוא מזמין להביא להדרכה גם רגעים של אי-ידיעה.<\/li>\n<li><a class=\"ref\" href=\"#i-italy2019\" data-ref=\"italy2019\">איטלי 2019<\/a>: נכתב לימים שלפני פתיחת השנה. הוא מסביר למה הפגישה הראשונה עם המנהל היא תנאי לעבודה, ואיך ללמוד מאירועי הכניסה.<\/li>\n<li><a class=\"ref\" href=\"#i-miller\" data-ref=\"miller\">הפגישה הראשונה (Miller)<\/a>: מבנה לפגישה ראשונה עם פונה חדש. הוא נכתב למתמחים בייעוץ ובפסיכותרפיה ולא לעבודה עם ילדים, ולכן צריך להתאים אותו להורים ולילדים.<\/li>\n<li><a class=\"ref\" href=\"#i-alon2023\" data-ref=\"alon2023\">אלון ועמיתיו 2023<\/a>: מודל להתערבות בחירום. הוא ממליץ להכין ערכת חירום אישית מראש, ומדגיש שמתמחה צריך ליצור קשר עם המדריך האישי כבר בשלב כינוס הצל\"ח.<\/li>\n<\/ul>\n<p>מתווי העבודה מגדירים מה חייב להיכלל בתוכנית העבודה השנתית. יש מתווה לבית הספר היסודי <a class=\"ref\" href=\"#i-outline_elem\" data-ref=\"outline_elem\">ליבת העבודה ביסודי<\/a>, לעל-יסודי <a class=\"ref\" href=\"#i-outline_sec\" data-ref=\"outline_sec\">ליבת העבודה בעל-יסודי<\/a> ולגנים <a class=\"ref\" href=\"#i-outline_gan\" data-ref=\"outline_gan\">מודל העבודה בגנים<\/a>, ומסמך לכיתות הקטנות בבית ספר רגיל <a class=\"ref\" href=\"#i-tlv_smallclasses\" data-ref=\"tlv_smallclasses\">הכיתות הקטנות 2010<\/a>. המתווים הם בסיס לשיחה עם המנהל או הגננת על יעדים וסדרי עדיפויות. לשיחה הזאת אפשר להיעזר גם בכלי לבניית חוזה עם המנהל <a class=\"ref\" href=\"#i-turi_contract\" data-ref=\"turi_contract\">תורי-מגדסי, חוזה עם המנהל<\/a>.<\/p>","general":"<p>התחום הכללי עוסק בשאלה מה פירוש להיות פסיכולוג חינוכי, ואיך לומדים להיות כזה. המקורות מתארים מקצוע רחב מאוד: אבחון, טיפול, ייעוץ ועבודה מערכתית, בגן, בבית הספר ובקהילה <a class=\"ref\" href=\"#i-peraui2013\" data-ref=\"peraui2013\">פראוי 2013<\/a>, <a class=\"ref\" href=\"#i-kochavi2018\" data-ref=\"kochavi2018\">כוכבי 2018<\/a>. הרוחב הזה מעורר שוב ושוב שאלות של זהות. רודד ועמיתיו כותבים שהקושי להגדיר את התפקיד הוא \"חלק מה-DNA של המקצוע\" <a class=\"ref\" href=\"#i-rodded2017\" data-ref=\"rodded2017\">רודד ועמיתיו 2017<\/a>. לצד זה עומדת הלמידה עצמה: התנסות בשדה, הדרכה ונכונות לשהות באי-ידיעה <a class=\"ref\" href=\"#i-tene2011\" data-ref=\"tene2011\">טנא 2011<\/a>. שלושה מהטקסטים לשנה א' נכתבו או נערכו בשפ\"ח תל אביב-יפו <a class=\"ref\" href=\"#i-tene2011\" data-ref=\"tene2011\">טנא 2011<\/a>, <a class=\"ref\" href=\"#i-peraui2013\" data-ref=\"peraui2013\">פראוי 2013<\/a>, <a class=\"ref\" href=\"#i-tauber\" data-ref=\"tauber\">טאובר<\/a>.<\/p>\n<h4>מה הקריאה בונה לאורך השנים<\/h4>\n<p><strong>שנה א'.<\/strong> חמשת הטקסטים עוסקים בכניסה למקצוע ובשאלה מהו. טאובר מתארת את השנה הראשונה כ\"הגירה\", ואת הצורך ב\"רשת ביטחון\" של הדרכה, ידע תיאורטי וצוות תומך <a class=\"ref\" href=\"#i-tauber\" data-ref=\"tauber\">טאובר<\/a>. טנא מתארת למידה שאינה נגמרת, ומבקשת להניח בצד ידע מוקדם בכל מפגש מקצועי <a class=\"ref\" href=\"#i-tene2011\" data-ref=\"tene2011\">טנא 2011<\/a>. כוכבי ופראוי מתארים מקצוע רחב, שבו הגיוון הוא נכס וגם מקור לעומס ולתחושת שטחיות <a class=\"ref\" href=\"#i-kochavi2018\" data-ref=\"kochavi2018\">כוכבי 2018<\/a>, <a class=\"ref\" href=\"#i-peraui2013\" data-ref=\"peraui2013\">פראוי 2013<\/a>. גרינולד-קשאני ומטיחס מוסיפות מבט ביקורתי על הנחות היסוד של המקצוע ועל המקום הגדול שתופסים בו האבחון וההשמה <a class=\"ref\" href=\"#i-greenwald2009\" data-ref=\"greenwald2009\">גרינולד ומטיחס 2009<\/a>.<\/p>\n<p><strong>שנים ב'-ג'.<\/strong> שאלות של זהות ממשיכות להופיע בפריטים מתחומים אחרים באותו שלב. גרינולד שואלת איך איש טיפול מגדיר את עצמו בתוך מוסד חינוכי, ואיך הוא נע בין עמדה חינוכית לעמדה טיפולית <a class=\"ref\" href=\"#i-greenwald2012\" data-ref=\"greenwald2012\">גרינולד 2012<\/a>. לוריא ועמיתיו כתבו על הדרכת מנהלים, ואת המושגים שלהם אפשר להחיל גם על יחסי ההדרכה של המתמחה <a class=\"ref\" href=\"#i-luria2011\" data-ref=\"luria2011\">לוריא ועמיתיו 2011<\/a>.<\/p>\n<p><strong>שנה ד'.<\/strong> רודד, יצחקי וכהן מציעים את דימוי הקלידוסקופ. חמישה מסננים פועלים על השדה החינוכי: אוכלוסיות, פוזיציות מקצועיות, רצף מניעה-התערבות, רמות ניתוח והשקפות תיאורטיות. ליבת המקצוע היא התנועה שמשלבת ביניהם. המחברים מבחינים בין המקצוע, שרוחב היריעה שלו גדול מאוד, לבין הפסיכולוג היחיד, שבוחר בתוך ליבה משותפת <a class=\"ref\" href=\"#i-rodded2017\" data-ref=\"rodded2017\">רודד ועמיתיו 2017<\/a>. לצדו עומד המאמר הקלאסי של בנימיני על היציאה מ\"האוהל\" אל \"השדה\" <a class=\"ref\" href=\"#i-binyamini1984\" data-ref=\"binyamini1984\">בנימיני 1984<\/a>.<\/p>\n<h4>רעיונות שחוזרים במקורות<\/h4>\n<ul>\n<li><strong>רוחב ועומק.<\/strong> כוכבי טוענת ש\"רחב\" אינו \"שטחי\", ומציעה צניעות מקצועית לצד חתירה למצוינות <a class=\"ref\" href=\"#i-kochavi2018\" data-ref=\"kochavi2018\">כוכבי 2018<\/a>. המרואיינים של פראוי מתארים גדילה אינסופית לצד תחושה של \"בינוניות\" <a class=\"ref\" href=\"#i-peraui2013\" data-ref=\"peraui2013\">פראוי 2013<\/a>. גנץ מציינת סיכון ל\"בינוניות\" גם בטיפול, כשמנסים לרכוש גם כישורים דינמיים וגם כישורים מכווני שינוי <a class=\"ref\" href=\"#i-gantz2016\" data-ref=\"gantz2016\">גנץ 2016<\/a>.<\/li>\n<li><strong>אי-ידיעה כחלק מהעבודה.<\/strong> טנא מבקשת לוותר על ידיעה מוקדמת ולשהות באי-ידיעה למרות החרדה <a class=\"ref\" href=\"#i-tene2011\" data-ref=\"tene2011\">טנא 2011<\/a>. רודד ועמיתיו כותבים שחוויית העמימות אינה נעלמת עם הוותק, ורואים בה מאפיין מהותי של המקצוע <a class=\"ref\" href=\"#i-rodded2017\" data-ref=\"rodded2017\">רודד ועמיתיו 2017<\/a>. גנץ מבקשת מהמטפל להגיע לקליניקה עם מידע מהשדה ובאותו זמן עם אי-ידיעה <a class=\"ref\" href=\"#i-gantz2016\" data-ref=\"gantz2016\">גנץ 2016<\/a>.<\/li>\n<li><strong>הדרכה ורשת ביטחון.<\/strong> טנא רואה בהדרכה מרכיב חיוני, תומך וגם ביקורתי <a class=\"ref\" href=\"#i-tene2011\" data-ref=\"tene2011\">טנא 2011<\/a>. טאובר ממליצה שהתחנה תרחיב למתחילים את אפשרויות ההתייעצות, עד מעורבות ישירה של פסיכולוג נוסף באירוע <a class=\"ref\" href=\"#i-tauber\" data-ref=\"tauber\">טאובר<\/a>. כוכבי רואה בהתייעצות עם מדריכים ועמיתים חלק מצניעות מקצועית <a class=\"ref\" href=\"#i-kochavi2018\" data-ref=\"kochavi2018\">כוכבי 2018<\/a>. גם בחירום, הצעד הראשון של מתמחה הוא פנייה למדריך <a class=\"ref\" href=\"#i-alon2023\" data-ref=\"alon2023\">אלון ועמיתיו 2023<\/a>.<\/li>\n<li><strong>\"אין ילד ללא מערכת\".<\/strong> כוכבי מנסחת כך את העיקרון, בעקבות ויניקוט <a class=\"ref\" href=\"#i-kochavi2018\" data-ref=\"kochavi2018\">כוכבי 2018<\/a>. פראוי מזהה את ייחוד המקצוע בתפיסה רב-ממדית ואקולוגית <a class=\"ref\" href=\"#i-peraui2013\" data-ref=\"peraui2013\">פראוי 2013<\/a>. טאובר מצטטת פסיכולוגית צעירה שאמרה שמשמעות העשייה היא \"בחיבורים\" <a class=\"ref\" href=\"#i-tauber\" data-ref=\"tauber\">טאובר<\/a>. רודד ועמיתיו מפרטים רמות ניתוח מהפרט ועד הקהילה והמדינה <a class=\"ref\" href=\"#i-rodded2017\" data-ref=\"rodded2017\">רודד ועמיתיו 2017<\/a>.<\/li>\n<li><strong>מהפרט אל המערכת.<\/strong> אצל המרואיינים של פראוי המשמעות עברה עם השנים מקשר טיפולי עם ילד אחד להשפעה על המערכת <a class=\"ref\" href=\"#i-peraui2013\" data-ref=\"peraui2013\">פראוי 2013<\/a>. גרינולד-קשאני ומטיחס טוענות שהתחום מיקם את עצמו כ\"פסיכולוגיה של המתקשים\", ומציעות לבחון מחדש את הבחירה הזאת <a class=\"ref\" href=\"#i-greenwald2009\" data-ref=\"greenwald2009\">גרינולד ומטיחס 2009<\/a>. מרואיינת אצל טאובר הרגישה שרק בסוף השנה הראשונה יכלה להתחיל עבודה מערכתית <a class=\"ref\" href=\"#i-tauber\" data-ref=\"tauber\">טאובר<\/a>.<\/li>\n<li><strong>שורשי המקצוע באבחון.<\/strong> טאובר מתארת איך הפסיכולוגיה החינוכית צמחה מהצורך לאתר ילדים לחינוך מיוחד, ואיך דבק בה תפקיד \"שומר הסף\" <a class=\"ref\" href=\"#i-tauber\" data-ref=\"tauber\">טאובר<\/a>. גרינולד-קשאני ומטיחס מצטטות פסיכולוג שאמר \"הפכנו מפסיכולוגים לטסטולוגים\" <a class=\"ref\" href=\"#i-greenwald2009\" data-ref=\"greenwald2009\">גרינולד ומטיחס 2009<\/a>.<\/li>\n<\/ul>\n<h4>מתחים ושאלות פתוחות<\/h4>\n<ul>\n<li><strong>כמה מקום לטיפול.<\/strong> המרואיינים של טאובר חווים את הוויתור על הטיפול כוויתור העיקרי והמתסכל של השנה הראשונה <a class=\"ref\" href=\"#i-tauber\" data-ref=\"tauber\">טאובר<\/a>. גרינולד-קשאני ומטיחס מציעות, באופן היפותטי, להקצות לאוכלוסייה המתקשה משאבים לפי חלקה באוכלוסייה ולהפנות את השאר לעבודה ארגונית <a class=\"ref\" href=\"#i-greenwald2009\" data-ref=\"greenwald2009\">גרינולד ומטיחס 2009<\/a>. פראוי מצא שהממצאים שלו שונים מסקר משנת 1996, שבו פסיכולוגים חינוכיים העדיפו לעבוד כקלינאים <a class=\"ref\" href=\"#i-peraui2013\" data-ref=\"peraui2013\">פראוי 2013<\/a>.<\/li>\n<li><strong>\"האוהל\" של בנימיני.<\/strong> שני מקורות מתארים את המושג אחרת. טאובר מתארת את \"האוהל והשדה\" כמעבר מחדר הטיפולים אל השדה <a class=\"ref\" href=\"#i-tauber\" data-ref=\"tauber\">טאובר<\/a>. איטלי מתארת את האוהל כמבנה ביניים שהפסיכולוג בונה בשדה, בתנועה בין השפ\"ח לבית הספר <a class=\"ref\" href=\"#i-italy2019\" data-ref=\"italy2019\">איטלי 2019<\/a>. כדאי לקרוא את המקור <a class=\"ref\" href=\"#i-binyamini1984\" data-ref=\"binyamini1984\">בנימיני 1984<\/a>.<\/li>\n<li><strong>נתונים שאינם מתיישבים.<\/strong> פראוי מביא תקן של שעת פסיכולוג לכל 10 עד 30 תלמידים <a class=\"ref\" href=\"#i-peraui2013\" data-ref=\"peraui2013\">פראוי 2013<\/a>. אצל רודד ועמיתיו התקן הוא פסיכולוג אחד ל-300, ל-500 או ל-1,000 תלמידים, לפי סוג האוכלוסייה <a class=\"ref\" href=\"#i-rodded2017\" data-ref=\"rodded2017\">רודד ועמיתיו 2017<\/a>. גם שנת ההקמה של השירות הראשון בתל אביב שונה: 1937 אצל טאובר ו-1936 אצל רודד ועמיתיו.<\/li>\n<\/ul>\n<h4>איפה להתחיל<\/h4>\n<ul>\n<li>לקרוא את <a class=\"ref\" href=\"#i-tauber\" data-ref=\"tauber\">טאובר<\/a> בשבועות הראשונים, ולהביא להדרכה את השאלה מה הבאת מההכשרה הקודמת, ומה מזה עוזר או מתנגש עם העבודה בשפ\"ח.<\/li>\n<li>לקרוא את <a class=\"ref\" href=\"#i-kochavi2018\" data-ref=\"kochavi2018\">כוכבי 2018<\/a>, ולשאול על תיק פתוח את השאלות שהמטפלת של יונתן שאלה בדיעבד: באיזו מסגרת הילד לומד, מי המחנכת, אילו מקורות תמיכה יש לו בקהילה, והאם כדאי לפגוש אותו יחד עם ההורה.<\/li>\n<li>כשמגיעה הפניה, לעבור עליה לפי חמשת המסננים של <a class=\"ref\" href=\"#i-rodded2017\" data-ref=\"rodded2017\">רודד ועמיתיו 2017<\/a>. המאמר ממוקם בשנה ד', והמחברים כותבים שהמודל עוזר למתמחה לשאת את העמימות והמורכבות.<\/li>\n<\/ul>","diag":"<p>התחום הזה עוסק באבחון הפסיכולוגי של הילד. אבחון של בית הספר או של צוות כמערכת שייך לתחום העבודה המערכתית, ומופיע שם.<\/p>\n<p>במקורות האבחון מוצג כהתערבות. ספיר-יוגב טוענת שהראיונות, המפגשים עם הילד והמשוב משפיעים על הילד, על הוריו ועל המורה. לכן צריך לשאול מה מטרת האבחון, ואיך כולם ייצאו ממנו מחוזקים, עם תחושת יכולת ותקווה <a class=\"ref\" href=\"#i-sapiryogev\" data-ref=\"sapiryogev\">ספיר-יוגב 2016<\/a>. האבחון מתחיל בשאלה ספציפית שגובשה עם המורה, ההורים והילד. לצד האבחון הפרטני מוצעת הערכה מבוססת צרכים, שבה ההערכה וההתערבות מתחלפות במעגל <a class=\"ref\" href=\"#i-sped_multi\" data-ref=\"sped_multi\">עבודה רב-מקצועית בחנ&quot;מ<\/a>, <a class=\"ref\" href=\"#i-outline_gan\" data-ref=\"outline_gan\">מודל העבודה בגנים<\/a>. כמה מקורות שואלים גם כמה מקום תופס האבחון בעבודה, ולשירות מי הוא עומד <a class=\"ref\" href=\"#i-greenwald2009\" data-ref=\"greenwald2009\">גרינולד ומטיחס 2009<\/a>.<\/p>\n<h4>מה הקריאה בונה לאורך השנים<\/h4>\n<p><strong>שנה א'.<\/strong> הסכמה של ספיר-יוגב מפרקת את האבחון לשלבים: גיבוש שאלות אבחון עם המורה, ההורים והילד; תכנון לפי השערות, שהיא מכנה \"תפירת חליפה\"; מפגש ראשון לבדיקת ההשערות ומפגש שני להעמקה; אינטגרציה; משוב כ\"מפגש בין מומחים\"; דו\"ח שנכתב אחרי המשוב; ומעקב <a class=\"ref\" href=\"#i-sapiryogev\" data-ref=\"sapiryogev\">ספיר-יוגב 2016<\/a>. באותה שנה מופיעה בתחום הטיפול גם פגישה ראשונה שמשלבת הערכה עם יצירת מעורבות <a class=\"ref\" href=\"#i-miller\" data-ref=\"miller\">הפגישה הראשונה (Miller)<\/a>.<\/p>\n<p><strong>שנים ב'-ג'.<\/strong> הפריט לשלב זה עוסק בהיבטים הטיפוליים של המשוב באבחון, כהמשך לרעיון של ספיר-יוגב <a class=\"ref\" href=\"#i-ravid2024\" data-ref=\"ravid2024\">ראביד-חיון ובן ריי 2024<\/a>. בתחומים אחרים באותו שלב יש חומר שנוגע לאבחון. בהט מבקרת המשגות גנריות, גם בדו\"חות אבחון, ומציעה משולש להמשגה ייחודית <a class=\"ref\" href=\"#i-bahat\" data-ref=\"bahat\">בהט<\/a>. גרינולד מבחינה בין חלקי האבחון שמשווים את הילד לבני גילו לבין חלקים שחושפים את תפיסת העצמי שלו <a class=\"ref\" href=\"#i-greenwald2012\" data-ref=\"greenwald2012\">גרינולד 2012<\/a>. מסמך העבודה הרב-מקצועית בחנ\"מ מציע הערכה מבוססת צרכים בצוות <a class=\"ref\" href=\"#i-sped_multi\" data-ref=\"sped_multi\">עבודה רב-מקצועית בחנ&quot;מ<\/a>.<\/p>\n<p><strong>שנה ד'.<\/strong> הפריט לשלב זה עוסק בהגדרה של לקות למידה ובמשמעותה לעבודה האבחונית <a class=\"ref\" href=\"#i-kachergin2012\" data-ref=\"kachergin2012\">קצ&#x27;רגין 2012<\/a>.<\/p>\n<h4>רעיונות שחוזרים במקורות<\/h4>\n<ul>\n<li><strong>אבחון מתחיל בשאלה.<\/strong> לפי ספיר-יוגב, התערבות דיאגנוסטית מוצדקת רק כשיש שאלה אבחונית אמיתית <a class=\"ref\" href=\"#i-sapiryogev\" data-ref=\"sapiryogev\">ספיר-יוגב 2016<\/a>. תורי-מגדסי מתארת חטיבת ביניים שביקשה לאבחן שליש מתלמידיה, ופסיכולוגית ששאלה קודם מה פירוש הבקשה <a class=\"ref\" href=\"#i-turi_unconscious\" data-ref=\"turi_unconscious\">תורי-מגדסי, הלא מודע<\/a>. במקרה שמתארים רודד ועמיתיו, הפניה לאבחון לקראת ועדת השמה הובילה לשאלות על המחנכת, על אקלים בית הספר ועל הקהילה <a class=\"ref\" href=\"#i-rodded2017\" data-ref=\"rodded2017\">רודד ועמיתיו 2017<\/a>.<\/li>\n<li><strong>הערכה והתערבות במעגל.<\/strong> רודד ועמיתיו מתארים רצף ספירלי של איסוף מידע, קונסולטציה והתערבות, ומביאים את מודל RTI כדוגמה <a class=\"ref\" href=\"#i-rodded2017\" data-ref=\"rodded2017\">רודד ועמיתיו 2017<\/a>. מסמך העבודה הרב-מקצועית בחנ\"מ מציע הערכה שחוזרת מההתערבות להערכה <a class=\"ref\" href=\"#i-sped_multi\" data-ref=\"sped_multi\">עבודה רב-מקצועית בחנ&quot;מ<\/a>. במתווה הגנים, הליווי ההתפתחותי של כלל הילדים קודם להערכה פרטנית <a class=\"ref\" href=\"#i-outline_gan\" data-ref=\"outline_gan\">מודל העבודה בגנים<\/a>. גם אצל ספיר-יוגב המעקב הוא חלק מהאבחון <a class=\"ref\" href=\"#i-sapiryogev\" data-ref=\"sapiryogev\">ספיר-יוגב 2016<\/a>.<\/li>\n<li><strong>המשוב כשיחה משותפת.<\/strong> ספיר-יוגב בונה את ההמלצות יחד עם המורה וההורים, ואינה מוסרת דו\"ח מודפס בסוף המשוב <a class=\"ref\" href=\"#i-sapiryogev\" data-ref=\"sapiryogev\">ספיר-יוגב 2016<\/a>. מנור-בנימיני מצאה שצוותים מצליחים מסבירים מונחים מקצועיים, בודקים שההורים הבינו ופותחים בנקודות החוזק <a class=\"ref\" href=\"#i-manor2004\" data-ref=\"manor2004\">מנור-בנימיני 2004<\/a>. המתווה העל-יסודי כולל תיווך של הממצאים להורים ולצוות <a class=\"ref\" href=\"#i-outline_sec\" data-ref=\"outline_sec\">ליבת העבודה בעל-יסודי<\/a>.<\/li>\n<li><strong>זהירות מתיוג.<\/strong> מתווה הגנים מזהיר שתיוג שאינו במקומו עלול ליצור נבואה שמגשימה את עצמה <a class=\"ref\" href=\"#i-outline_gan\" data-ref=\"outline_gan\">מודל העבודה בגנים<\/a>. גרינולד מתארת שימוש הגנתי באבחנה, כשהצוות לוחץ לתייג מתוך קושי לשאת אי-ידיעה <a class=\"ref\" href=\"#i-greenwald2012\" data-ref=\"greenwald2012\">גרינולד 2012<\/a>. בשדרות נמצא שכ-70% מהתלמידים אובחנו, והכותבות שאלו אם אבחנת-יתר משדרת \"התמסכנות\" <a class=\"ref\" href=\"#i-greenwald2009\" data-ref=\"greenwald2009\">גרינולד ומטיחס 2009<\/a>. ספיר-יוגב מזכירה שהמשוב משפיע על הדימוי העצמי של הילד לאורך שנים <a class=\"ref\" href=\"#i-sapiryogev\" data-ref=\"sapiryogev\">ספיר-יוגב 2016<\/a>.<\/li>\n<li><strong>קוגניציה ורגש יחד.<\/strong> ספיר-יוגב כותבת ש\"הילד הוא אחד\", ומתכננת לפי הקשרים בין יכולות קוגניטיביות, רגש ותפקוד <a class=\"ref\" href=\"#i-sapiryogev\" data-ref=\"sapiryogev\">ספיר-יוגב 2016<\/a>. במקרה של רודד ועמיתיו, ילד שהופנה בגלל פער בקריאה ובכתיבה נמצא ללא לקות למידה, והממצאים הרגשיים הובילו להפניה לטיפול <a class=\"ref\" href=\"#i-rodded2017\" data-ref=\"rodded2017\">רודד ועמיתיו 2017<\/a>. גרינולד מציעה להתעניין באופן שבו הילד מתמודד עם הלקות <a class=\"ref\" href=\"#i-greenwald2012\" data-ref=\"greenwald2012\">גרינולד 2012<\/a>.<\/li>\n<li><strong>המשגה ייחודית.<\/strong> בהט מציעה לבדוק על כל משפט בהמשגה אם היה מתאים כמעט לכל מטופל, ומכנה זאת אפקט ברנום <a class=\"ref\" href=\"#i-bahat\" data-ref=\"bahat\">בהט<\/a>. ספיר-יוגב שואלת בשלב האינטגרציה אם רואים את הילד \"מבעד למבחנים\" <a class=\"ref\" href=\"#i-sapiryogev\" data-ref=\"sapiryogev\">ספיר-יוגב 2016<\/a>.<\/li>\n<\/ul>\n<h4>מתחים ושאלות פתוחות<\/h4>\n<ul>\n<li><strong>מעט קריאה ייעודית.<\/strong> בכל שלב יש פריט אבחון אחד <a class=\"ref\" href=\"#i-ravid2024\" data-ref=\"ravid2024\">ראביד-חיון ובן ריי 2024<\/a>, <a class=\"ref\" href=\"#i-kachergin2012\" data-ref=\"kachergin2012\">קצ&#x27;רגין 2012<\/a>, ורוב החשיבה האבחונית נמצאת בטקסטים מתחומים אחרים.<\/li>\n<li><strong>חובה חוקית וביקורת.<\/strong> המתווים מגדירים ועדות אפיון, זכאות ושילוב, והערכות לקראתן, כחלק מליבת העבודה <a class=\"ref\" href=\"#i-outline_elem\" data-ref=\"outline_elem\">ליבת העבודה ביסודי<\/a>, <a class=\"ref\" href=\"#i-outline_sec\" data-ref=\"outline_sec\">ליבת העבודה בעל-יסודי<\/a>. גרינולד-קשאני ומטיחס מתארות תחושה שהאבחון וההשמה השתלטו על העבודה <a class=\"ref\" href=\"#i-greenwald2009\" data-ref=\"greenwald2009\">גרינולד ומטיחס 2009<\/a>. מרואיינים אצל טאובר ואצל פראוי מתארים את הוועדות והטפסים כמשימות שאינן פסיכולוגיות במהותן או כחסרות תועלת <a class=\"ref\" href=\"#i-tauber\" data-ref=\"tauber\">טאובר<\/a>, <a class=\"ref\" href=\"#i-peraui2013\" data-ref=\"peraui2013\">פראוי 2013<\/a>.<\/li>\n<li><strong>מבחנים והערכה אקולוגית.<\/strong> מסמך העבודה הרב-מקצועית מציע להחליף את הגישה הפסיכומטרית בגישה \"אדיו-מטרית\", שנשענת על תצפיות, ראיונות ותגובה להוראה <a class=\"ref\" href=\"#i-sped_multi\" data-ref=\"sped_multi\">עבודה רב-מקצועית בחנ&quot;מ<\/a>. מתווה הגנים שומר לכלים סטנדרטיים מקום ברמה השלישית, בעיקר להחלטה על זכאות, ומזהיר מפרשנות כמותית של כלים בלי נורמות ישראליות <a class=\"ref\" href=\"#i-outline_gan\" data-ref=\"outline_gan\">מודל העבודה בגנים<\/a>. ספיר-יוגב משתמשת במבחנים ובוחרת אותם לפי השערות <a class=\"ref\" href=\"#i-sapiryogev\" data-ref=\"sapiryogev\">ספיר-יוגב 2016<\/a>. הפריט שעוסק ישירות בהגדרה של לקות למידה ממוקם בשנה ד' <a class=\"ref\" href=\"#i-kachergin2012\" data-ref=\"kachergin2012\">קצ&#x27;רגין 2012<\/a>.<\/li>\n<\/ul>\n<h4>איפה להתחיל<\/h4>\n<ul>\n<li>לפני האבחון הראשון, לקרוא את <a class=\"ref\" href=\"#i-sapiryogev\" data-ref=\"sapiryogev\">ספיר-יוגב 2016<\/a> ולכתוב שאלות אבחון נפרדות למורה, להורים ולילד. אחר כך לכתוב השערות ותוכנית אבחון ולהביא אותן להדרכה.<\/li>\n<li>לפני פגישת משוב, לעבור על המרכיבים שמנור-בנימיני מצאה בישיבות מוצלחות עם הורים, ולהשתמש בכלי התצפית שבנספח <a class=\"ref\" href=\"#i-manor2004\" data-ref=\"manor2004\">מנור-בנימיני 2004<\/a>.<\/li>\n<li>מי שעובד בגנים, לקרוא את פרק ההערכה במתווה הגנים: מודל RTI והדגשים לאבחון ילדים צעירים, כמו היכרות ומשחק בתחילת ההערכה והפסקות לפי הצורך <a class=\"ref\" href=\"#i-outline_gan\" data-ref=\"outline_gan\">מודל העבודה בגנים<\/a>.<\/li>\n<\/ul>","therapy":"<p>הטיפול בשפ\"ח מתקיים בתוך הקשר חינוכי. גנץ מתארת את הקליניקה של הפסיכולוג החינוכי כמרחב שבו המציאות החיצונית והעולם הפנימי נוכחים שניהם בעוצמה. המטופלים הם תלמידים, הורים ואנשי חינוך, וכולם \"אנשים בתפקיד\" <a class=\"ref\" href=\"#i-gantz2016\" data-ref=\"gantz2016\">גנץ 2016<\/a>. לכן הטיפול מחויב גם לתפקוד ולקצב ההתפתחות של הילד. גרינולד רואה במטפל בבית הספר שותף למערך התערבות רחב <a class=\"ref\" href=\"#i-greenwald2012\" data-ref=\"greenwald2012\">גרינולד 2012<\/a>. במתווים של השירות, עבודה טיפולית עם תלמידים והורים היא אחד מעקרונות הליבה <a class=\"ref\" href=\"#i-outline_elem\" data-ref=\"outline_elem\">ליבת העבודה ביסודי<\/a>, ובעל-יסודי הטיפול הישיר הוא בדרך כלל קצר מועד <a class=\"ref\" href=\"#i-outline_sec\" data-ref=\"outline_sec\">ליבת העבודה בעל-יסודי<\/a>.<\/p>\n<h4>מה הקריאה בונה לאורך השנים<\/h4>\n<p><strong>שנה א'.<\/strong> שלושה פריטים מניחים יסודות. גנץ מגדירה מה ייחודי בטיפול בקליניקה של הפסיכולוג החינוכי: \"אדם בתפקיד\", \"מיהו הלקוח\" ומחויבות ל\"זמן-ילד\" <a class=\"ref\" href=\"#i-gantz2016\" data-ref=\"gantz2016\">גנץ 2016<\/a>. מילר מציעה מבנה לפגישה הראשונה: פתיחה ומסגרת, זיהוי הקשיים במילים של הפונה, איסוף מידע, סיכום והצעת כיוון <a class=\"ref\" href=\"#i-miller\" data-ref=\"miller\">הפגישה הראשונה (Miller)<\/a>. \"הספר הראשון שלי על טיפול במשחק\" הוא ספר שמסביר לילדים צעירים, בערך בני 4 עד 7, מה קורה בטיפול, כולל סודיות, פגישות עם ההורים ופרידה <a class=\"ref\" href=\"#i-playbook\" data-ref=\"playbook\">הספר הראשון על טיפול במשחק<\/a>.<\/p>\n<p><strong>שנים ב'-ג'.<\/strong> זה השלב העמוס ביותר בתחום. קלנר מפרטת את החוזה הטיפולי ואת המערך שמחזיק את התהליך <a class=\"ref\" href=\"#i-kellner2000\" data-ref=\"kellner2000\">קלנר 2000<\/a>. גנץ כותבת על טיפול בהורים, ועל מצבים שבהם הפתולוגיה תוקפת את הטיפול והמטפל מלוהק לדפוס הפתולוגי <a class=\"ref\" href=\"#i-gantz2021\" data-ref=\"gantz2021\">גנץ 2021<\/a>. בהט מציעה משולש להמשגה דינמית: אנמנזה, הווה ותיאוריה מחברת <a class=\"ref\" href=\"#i-bahat\" data-ref=\"bahat\">בהט<\/a>. גרינולד בוחנת את המטפל בתוך בית הספר, בין עמדה חינוכית-הסתגלותית לעמדה טיפולית-רפלקטיבית <a class=\"ref\" href=\"#i-greenwald2012\" data-ref=\"greenwald2012\">גרינולד 2012<\/a>. שלושה פריטים נוספים: מודל אינטגרטיבי לקונסולטציה במסגרות חינוכיות <a class=\"ref\" href=\"#i-ostrovil1987\" data-ref=\"ostrovil1987\">אוסטרוויל 1987<\/a>, הכיתה כקבוצה והתפקידים שתלמידים נושאים בה <a class=\"ref\" href=\"#i-barakstein2014\" data-ref=\"barakstein2014\">ברק שטיין 2014<\/a>, וטקסט של ארון שגנץ נשענת עליו <a class=\"ref\" href=\"#i-aron\" data-ref=\"aron\">ארון<\/a>.<\/p>\n<p><strong>שנה ד'.<\/strong> הטקסט על ביון נותן אוצר מילים: חוליות L, H ו-K, מיכל-מוכל, פונקציית אלפא ו\"ללא זיכרון וללא תשוקה\" <a class=\"ref\" href=\"#i-bion\" data-ref=\"bion\">היכרות עם ביון<\/a>. יבלון כותב על ניסוח מוקד טיפולי דינמי כבס
