אם המטפלת שלי תזכור אותי?\" (\"כן!!!\")<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>ב. הנושאים שהספר מכסה לפי ההקדמה להורים<\/strong><\/p>\n<ol>\n<li>דברים שילד עושה ושמצביעים על בעיה אפשרית (presenting problems).<\/li>\n<li>איך ילד נכנס לטיפול (referral).<\/li>\n<li>סודיות.<\/li>\n<li>חדר הטיפול והציוד שבו.<\/li>\n<li>מה קורה בפועל בטיפול במשחק.<\/li>\n<li>איך ילד משתפר עם הזמן.<\/li>\n<li>איך הטיפול יסתיים, שזו תקופה מעוררת חרדה במיוחד, ואיך החרדה גורמת לפעמים לחזרה זמנית להתנהגות הבעייתית (temporary regression).<\/li>\n<\/ol>\n<p><strong>ג. דרכי שימוש מומלצות לפי ההקדמה לאנשי מקצוע<\/strong><\/p>\n<ul>\n<li>להשאיר עותק בחדר ההמתנה, כדי שילדים ומבוגרים יוכלו לעיין בו.<\/li>\n<li>לתת אותו להורים ולאחרים אחרי המלצה על טיפול לילד.<\/li>\n<li>יועצים חינוכיים ומורים לחינוך מיוחד עשויים למצוא אותו שימושי במיוחד כשהם מפנים משפחה למטפל ילדים.<\/li>\n<li>ילדים שבריריים יותר יכולים להשתמש בו כ\"גשר\" בינם לבין המטפל, ולמצוא נחמה בקריאה בו בין הפגישות.<\/li>\n<\/ul>\n<p><strong>ד. \"מה המטפלת עושה\" (עמ' 39-40)<\/strong>: 1. מקשיבה, 2. מתבוננת, 3. מבינה, 4. לפעמים משחקת גם, 5. מפענחת רגשות, 6. משוחחת עם ילדים עליהם.<\/p>\n<p><strong>ה. \"מה ילדים מרגישים בטיפול\" (עמ' 41-42)<\/strong>: 1. סקרנים, 2. מבולבלים, 3. עצובים, 4. כועסים, 5. שמחים, 6. וכל מיני רגשות אחרים.<\/p>","practice":"<ul>\n<li><strong>בפגישת ההיכרות עם ילד בגן או בכיתות א'-ב'<\/strong>: אפשר להקריא איתו חלקים נבחרים, למשל את החששות (עמ' 13-14), את \"מה יש בחדר\" ואת \"מותר לדבר על הכול\". זו דרך מוחשית להסביר את המסגרת ולהזמין את הילד לשאול שאלות.<\/li>\n<li><strong>בהדרכת הורים לפני תחילת טיפול<\/strong>: אפשר לתת להורים את הספר או לעבור איתם עליו, כדי להסביר מה זה טיפול במשחק, למה גם הם נפגשים עם המטפל, מה זו סודיות, ומה צפוי בסיום (כולל חזרה זמנית של קשיים). ההקדמה להורים מנוסחת כרשימה של בדיוק הנושאים האלה.<\/li>\n<li><strong>בהפניה של משפחה לטיפול בקהילה<\/strong>: אפשר להציע את הספר ליועצת או לגננת כחומר להורים, לפי ההמלצה בהקדמה לאנשי מקצוע.<\/li>\n<li><strong>להתאים את המסר על הסודיות<\/strong>: הספר מציג סודיות כ\"סוד של כיוון אחד\", בלי חריגים. בעבודה בשפ\"ח ובבית הספר המטפל משתף את ההורים ולעיתים את הצוות (בגבולות שמכבדים את פרטיות הילד), ויש מצבים שבהם חובה לדווח. לכן כדאי להשלים לילד, בשפה מותאמת גיל, מה כן נשמר בסוד ומתי המבוגרים ידברו ביניהם.<\/li>\n<li><strong>להתאים את המסגרת<\/strong>: הספר מתאר טיפול מרפאתי (ההורים מביאים את הילד, פעם או פעמיים בשבוע). בטיפול בתוך בית הספר או הגן, המתמחה יכול/ה להתאים את ההסבר: מאיפה הילד מגיע, מי מלווה אותו, ואיפה החדר.<\/li>\n<li><strong>להכין לסיום מוקדם<\/strong>: עמ' 49-56 יכולים לשמש בשבועות האחרונים של הטיפול כדי לפתוח שיחה על הפרידה ועל השאלות \"האם תזכרי אותי?\" ו\"האם אראה אותך שוב?\", ולהכין את ההורים לחזרה זמנית של התנהגויות.<\/li>\n<li><strong>לנרמל התנגדות<\/strong>: לשתף ילד (ואת הוריו) בכך ש\"לפעמים ילדים לא אוהבים להקשיב למטפל... אבל זה בסדר\" יכול לעזור בתקופות של כעס או סירוב בטיפול.<\/li>\n<\/ul>","questions":"<ol>\n<li>איך אני מסביר/ה היום לילד צעיר למה הוא מגיע אליי? מה הספר מציע שחסר בהסבר שלי, ומה בספר אינו מתאים להקשר של שפ\"ח, גן או בית ספר?<\/li>\n<li>איך אני מסביר/ה סודיות לילד בן חמש, כשאני גם נפגש/ת עם ההורים ועם הגננת? איך שומרים על רוח \"הסוד של כיוון אחד\" בלי להבטיח הבטחה שאי אפשר לקיים?<\/li>\n<li>הספר מתאר את המטפל כ\"עוזר מיוחד\" וכ\"חבר מיוחד\". מה המשמעות של הניסוח הזה בפרידה? איך הוא משפיע על הדרך שבה אני מכין/ה ילד לסיום?<\/li>\n<li>הספר מניח שהבנת רגשות לא מודעים דרך המשחק מקטינה את הבעיות. איך אני מסביר/ה את ההיגיון הזה להורים שמצפים לשינוי התנהגותי מהיר?<\/li>\n<li>בתרגום העברי נשמטה המילה \"a lot\" במשפט על סימני הבעיה. מה המשמעות של שינויים כאלה כשמשתמשים בחומר מתורגם עם הורים?<\/li>\n<\/ol>","quotes":"<p>(מתוך התרגום העברי שמודבק בספר, ולצדו המקור האנגלי.)<\/p>\n<ul>\n<li>\"בעיה היא משהו שמדאיג אותך, או גורם לך להרגיש רע.\" (A problem is a thing you worry about or feel bad about.)<\/li>\n<li>\"סודיות היא כמו סוד של כיוון אחד.\" (Confidentiality is like a one-way secret.)<\/li>\n<li>\"כי ילדים יודעים לשחק את הרגשות שלהם יותר בקלות מאשר לדבר עליהם.\" (That's because children play their feelings better than they talk about them.)<\/li>\n<li>\"הבעיות של ילדים עוברות מהר יותר, כשגם ההורים נפגשים עם המטפל.\" (Children get better quicker when parents meet with the therapist, too.)<\/li>\n<\/ul>"},"level":"שנה א'","stype":"ספר (ספר ילדים מאויר, פסיכו-חינוכי)","tldr":"זהו ספר ילדים מאויר בשחור-לבן שנועד להסביר לילדים בני 4 עד 7 בערך, שנשקל עבורם טיפול פסיכולוגי, מה זה טיפול במשחק. אפשר להקריא אותו לילד, או לקרוא אותו יחד עם ילד שכבר קורא. בפתח הספר יש שתי הקדמות באנגלית: אחת להורים ולאפוטרופוסים, ואחת לאנשי מקצוע…","search":"זהו ספר ילדים מאויר בשחור-לבן שנועד להסביר לילדים בני 4 עד 7 בערך, שנשקל עבורם טיפול פסיכולוגי, מה זה טיפול במשחק. אפשר להקריא אותו לילד, או לקרוא אותו יחד עם ילד שכבר קורא. בפתח הספר יש שתי הקדמות באנגלית: אחת להורים ולאפוטרופוסים, ואחת לאנשי מקצוע בבריאות הנפש. לפי ההקדמות, הטקסט משקף \"בשפה מאוד מפושטת\" את הגישה הפסיכודינמית של הכותבים לטיפול במשחק, ונכתב מנקודת המבט של המטופל הצעיר. הספר עובר בסדר כרונולוגי על מהלך הטיפול: אילו התנהגויות מעידות על \"בעיות\" (מריבות, קושי לחלוק, ביישנות, דאגה), למה צריך \"עזרה מיוחדת\", מי הם המטפלים (\"רופאי דאגות\"), ומה קורה בפנייה לטיפול (המטפל נפגש קודם עם ההורים, אחר כך עם הילד, ואז נבנית \"התוכנית\"). הוא מסביר גם את התדירות, את המפגשים עם ההורים, את הסודיות (\"סוד של כיוון אחד\"), את חדר הטיפול ואת הצעצועים, ואת האופן שבו המשחק עוזר להבין רגשות. הוא מכין את הילד לכך שלפעמים יהיה קשה ולא נעים להקשיב למטפל, לכך שהשיפור לוקח זמן, ולפרידה בסוף הטיפול, שבה הבעיות עשויות לחזור לזמן קצר. נרמול הבעיה: הספר פותח בשאלה \"שמת לב שלפעמים יש לילדים בעיות?\", ומונה התנהגויות מוכרות (מריבות ומכות, קושי לחלוק ולחכות לתור, ביישנות וחשש מילדים אחרים, דאגה מתמדת). במקור האנגלי, \"Doing one of these things a lot\" הוא סימן לבעיה. הגדרה פשוטה של בעיה: \"בעיה היא משהו שמדאיג אותך, או גורם לך להרגיש רע\". היא יכולה לגרום לרצות לבכות, להרביץ, או להיות \"לגמרי לגמרי לבד\". למה צריך עזרה: הילדים \"לא יודעים מאיפה הבעיות האלה באו\", ולכן אינם מצליחים להיפטר מהן. לפעמים אמא או אבא יכולים לעזור, ולפעמים צריך \"עזרה מיוחדת\". מי המטפל: \"עוזרים מסוג מיוחד\". יש שקוראים להם \"רופאי דאגות\", אבל שמם האמיתי \"מטפלים\". הם עוזרים לילדים \"ללמוד על דאגות ורגשות שגורמים לבעיות להופיע\". זו המילה הגדולה הראשונה בספר. מענה לפחדים לפני הטיפול: הספר מעלה את חששות הילד (\"האם הוא ידבר כמו המורה שלי?\", \"האם היא תיתן לי זריקה כמו הרופאה?\", \"האם אני אלך לגמרי לבדי?\") ועונה עליהם דרך תיאור התהליך. שלושה שלבים לכניסה לטיפול: המטפל נפגש קודם עם ההורים כדי להבין את הבעיות, אחר כך ההורים מביאים את הילד, ואז ההורים והמטפל מתכננים יחד את הדרך הטובה לעזור (\"התוכנית!\"). המסגרת: בדרך כלל פעם או פעמיים בשבוע. הילד מדבר עם המטפל לבד, ומותר לו לדבר על \"כל מה שתרצה\". ההורים חלק מהטיפול: ההורים נפגשים מדי פעם עם המטפל. \"הבעיות של ילדים עוברות מהר יותר כשגם ההורים נפגשים עם המטפל\". ההורים עוזרים למטפל להבין את הילד, והמטפל מלמד אותם דרכים חדשות לעזור. סודיות היא \"סוד של כיוון אחד\": זו המילה הגדולה השנייה בספר. מטפלים לא מספרים לאף אחד על הרעיונות והרגשות שהילד עובד עליהם, אבל הילד רשאי לספר עליהם אם הוא רוצה. ההיגיון של טיפול במשחק: \"ילדים יודעים לשחק את הרגשות שלהם יותר בקלות מאשר לדבר עליהם\". המטפל מבין את הרגשות והדאגות דרך המשחק. יש רגשות \"שהם אפילו לא ידעו שיש להם\", וכשהילדים מבינים אותם, הבעיות משתפרות. מה עושה המטפל: מקשיב, מתבונן, מבין, לפעמים משחק גם, מפענח רגשות ומשוחח עליהם עם הילד. הכנה לקושי ולהתנגדות: בטיפול ילדים מרגישים סקרנים, מבולבלים, עצובים, כועסים, שמחים ועוד. לפעמים הם לא אוהבים להקשיב למטפל, במיוחד כשהם כועסים, עצובים או מבולבלים, \"אבל זה בסדר\". ככל שמדברים יותר על הרגשות, הבעיות נהיות \"קטנות ויותר ויותר קטנות\". זה קשה ולוקח זמן, אבל \"בסופו של דבר ילדים מרגישים יותר טוב!\". סיום ופרידה: הפרידה מהמטפל, \"העוזר המיוחד\" ו\"חבר מיוחד\", יכולה להיות קשה ומפחידה, כי היא \"כמו להגיד להתראות להרבה זמן\". בסוף יש רגשות חשובים לדבר עליהם, ולפעמים הבעיות חוזרות קצת, \"אבל רק לקצת זמן\". שלב הסיום נמשך בדרך כלל כמה שבועות. טיפול במשחק (Play Therapy) – טיפול שבו הילד משחק, מדבר ומצייר, והמטפל מבין דרך המשחק את הרגשות ואת הדאגות שגורמים לבעיות. בספר הגישה מוצגת כפסיכודינמית. בעיה – בלשון הספר: \"משהו שמדאיג אותך, או גורם לך להרגיש רע\". בהקדמה להורים: \"presenting problems\", כלומר הבעיות המוצגות. מטפל (\"רופא דאגות\") – עוזר מיוחד שעוזר לילדים ללמוד על הדאגות והרגשות שגורמים לבעיות. התוכנית (The Plan) – התוכנית שההורים והמטפל בונים יחד אחרי מפגש ההיכרות. סודיות (Confidentiality) – \"סוד של כיוון אחד\": המטפל שומר בסוד, והילד חופשי לספר. רגשות לא מודעים – \"רגשות שהם אפילו לא ידעו שיש להם\". הבנתם מביאה לשיפור. סיום הטיפול – פרידה ארוכה שמעוררת רגשות חשובים, ולעיתים חזרה זמנית של הבעיות (בהקדמה: temporary regression). הפניה (referral) – הדרך שבה ילד נכנס לטיפול, כפי שמוגדרת בהקדמה להורים."},{"id":"miller","title":"הפגישה הראשונה עם מטופל חדש","authors":"תקציר טיפולנט (על פי Miller)","year":"2015","cite":"צוות טיפולנט (2015). הפגישה הראשונה עם מטופל חדש (תקציר של הפרק The first session with a new client: five stages, מתוך Bor & Watts, The Trainee Handbook).","url":"https://openaccess.city.ac.uk/id/eprint/16402/","kind":"article","desc":null,"urlLabel":"גרסה מעודכנת של הפרק המקורי (מאגר City University, 2017)","file":{"orig":"הפגישה הראשונה עם מטופל חדש.pdf","ext":"pdf","pdf":"miller.pdf","pages":3,"bytes":948031},"placements":[["s1","therapy"]],"extra":true,"ref":"הפגישה הראשונה (Miller)","inFolder":true,"srcTitle":"הפגישה הראשונה עם מטופל חדש: תקציר מאמרה של Miller משנת 1999","secs":{"abstract":"<p>הפרק של ריבה מילר (Miller, 1999), \"הפגישה הראשונה עם מטופל חדש: חמישה שלבים\", לקוח ממדריך למתמחים בייעוץ ובפסיכותרפיה.<\/p>\n<p>הטענה המרכזית היא שהפגישה הראשונה \"נותנת את הטון\" לכל הטיפול. יש לה מטרה כפולה: להעריך את המטופל, ובו בזמן ליצור את המעורבות שלו. המטפל והמטופל בוחנים יחד אם הטיפול יכול לעזור, ואם לא, המטפל מפנה להתערבות חלופית.<\/p>\n<p>הגישה נשענת על רעיונות של Milan וממשיכיו. היא מציעה מסגרת שיטתית שמבטיחה שהנושאים המרכזיים ייבדקו, ומתאימה למגוון מודלים תיאורטיים. בבסיסה ארבעה עקרונות: הימנעות מהנחות מוקדמות, בחירת מילים זהירה, עמדה ריאלית, ויחס מכבד ולא שיפוטי לדרכי ההתמודדות של המטופל.<\/p>\n<p>הפרק מתאר את רצף הפגישה:<\/p>\n<ul>\n<li><strong>פתיחה<\/strong>: הצגה עצמית, מסגרת זמן, מטרת הפגישה והתייחסות לרישום. המטפל מוביל באופן פעיל וקשוב לסימנים לא מילוליים.<\/li>\n<li><strong>זיהוי הקשיים<\/strong>: מוקדם ככל האפשר, במילים של המטופל, תוך חידוד של אמירות כלליות.<\/li>\n<li><strong>איסוף מידע<\/strong>: משך הבעיה, השפעתה והאירועים שסביב הופעתה. בשלב הזה גם הבניה מחדש וזיהוי משאבים.<\/li>\n<li><strong>עמדה טיפולית<\/strong>: ידידותית אבל מקצועית, ניטרלית וללא חשיפה עצמית.<\/li>\n<li><strong>סיום<\/strong>: סיכום ההבנה, הצעת כיוון טיפולי והזמנה לשאלות.<\/li>\n<\/ul>","ideas":"<ul>\n<li><strong>לפגישה הראשונה יש שתי משימות בו-זמנית:<\/strong> הערכה של המטופל ויצירת מעורבות שלו. אם המטפל מעריך שלא יוכל לעזור, מסיבה כלשהי, עליו להפנות להתערבות חלופית.<\/li>\n<li><strong>הפגישה הראשונה עלולה להיות מלווה בחרדה משמעותית<\/strong> אצל שני הצדדים. לכן כדאי להחזיק כמה דגשים בסיסיים שעוזרים ליצור קשר טיפולי טוב.<\/li>\n<li><strong>איכות הקשר תלויה בגורמים רבים:<\/strong><ul>\n<li>המסגרת: קליניקה פרטית, מרפאה או בית חולים.<\/li>\n<li>קבוצת האוכלוסייה.<\/li>\n<li>התיאוריה המנחה את המטפל, הניסיון שלו והאוריינטציה שלו.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<p>האתגר הוא הקשבה שמאפשרת הבנה \"פתוחה ומעמיקה ככל האפשר\" של בעיית המטופל.<\/p>\n<ul>\n<li><strong>מסגרת שיטתית מבוססת Milan.<\/strong> היא מוודאת שהנושאים המרכזיים ייבדקו, ואיננה כובלת את המטפל לגישה תיאורטית אחת.<\/li>\n<li><strong>המטפל מוביל.<\/strong> מאחר שהמטופל חסר ניסיון וחרד, המטפל מוביל את המפגש ושואל שאלות שמקלות על הדיאלוג. הוא שומר על קשר עין, שם לב לסימנים מילוליים ולא מילוליים (הסטת מבט, ישיבה לא נינוחה) ומעודד את המטופל להמשיך (הנהון, \"ספר לי עוד\").<\/li>\n<li><strong>לזהות מוקדם את הקשיים המרכזיים.<\/strong> כך נשאר זמן לדון בהם, והפגישה לא \"הולכת לאיבוד\". כדי לזהות אותם עוזרים למטופל להיות ספציפי, משתמשים במילים שלו ומבררים לעומק אמירות כלליות.<\/li>\n<li><strong>אחרי איסוף המידע הראשוני מתחילים ליצור קישורים.<\/strong> בודקים כמה זמן הבעיה קיימת, איך היא משפיעה ואילו אירועים קריטיים קרו סמוך להופעתה (אובדן, שינוי מקצועי, מחלה, פרידה).<\/li>\n<li><strong>הבניה מחדש (re-framing) של הבעיה<\/strong> יכולה לעזור למטופל לצאת מהפגישה אופטימי יותר, עם כיווני מחשבה ראשוניים על שינוי. אבל צריך לשמור על עמדה ריאלית ולא לעורר ציפייה להקלה מיידית. לצד הקשיים מדגישים גם את מקורות הכוח של המטופל.<\/li>\n<li><strong>עמדה ידידותית אך מקצועית, ניטרלית וללא חשיפה עצמית.<\/strong> חשיפה עצמית בפגישה הראשונה רק במקרים יוצאי דופן, ובזהירות. מטופלים קולטים גם תגובות לא רצוניות של המטפל, למשל אי-נוחות מול בכי או כעס, ולומדים מהן.<\/li>\n<li><strong>הסיום דורש \"עבודה עדינה\" של עצירת השיחה וארגונה.<\/strong> המטפל מציג סיכום קצר של ההבנה שלו, ועל בסיסו מציע כיוון טיפולי: שיטה, תדירות, משך, ומסגרת פרטנית או אחרת. אחר כך הוא מקשיב למשוב ושואל ישירות אם למטופל יש שאלות.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>פגישה ראשונה \"נותנת את הטון\"<\/strong> – הפגישה הראשונה מעצבת את המשך התהליך הטיפולי.<\/li>\n<li><strong>הערכה ומעורבות בו-זמנית<\/strong> – הפגישה מנוהלת כך שתאפשר גם הערכה של המטופל וגם יצירת מעורבות שלו.<\/li>\n<li><strong>הפניה להתערבות חלופית<\/strong> – חובת המטפל כשהוא מעריך שלא יוכל לעזור.<\/li>\n<li><strong>מסגרת עבודה שיטתית (בהשראת Milan)<\/strong> – מבנה לפגישה הראשונה שמבטיח שהנושאים המרכזיים ייבדקו, ומתאים למגוון מודלים תיאורטיים.<\/li>\n<li><strong>הימנעות מהנחות מוקדמות<\/strong> – לא להניח מראש מהן הבעיות, התגובות, האמונות או המשאלות של המטופל.<\/li>\n<li><strong>שימוש במילות המטופל<\/strong> – לתאר את מצבו במילים שהוא בחר, כדי למנוע אי-הבנות והטיה.<\/li>\n<li><strong>בירור לעומק של אמירות כלליות<\/strong> – לחדד ניסוחים עמומים (\"כל הזמן מדוכא\", \"מפחד מדחייה\") לשאלות ספציפיות.<\/li>\n<li><strong>הבניה מחדש (re-framing)<\/strong> – ניסוח מחדש של הבעיה, שמאפשר למטופל לצאת אופטימי יותר ועם כיווני מחשבה על שינוי.<\/li>\n<li><strong>עמדה ריאלית<\/strong> – לא לעורר ציפיות לא סבירות לשינוי ולהקלה מיידיים, ולהיות מציאותיים לגבי מה שאפשר להשיג וגם לגבי הזמינות של המטפל.<\/li>\n<li><strong>עמדה ניטרלית / הימנעות מחשיפה עצמית<\/strong> – עוזרות למטופל להבין מה טיב היחסים הטיפוליים.<\/li>\n<li><strong>תגובות לא רצוניות של המטפל<\/strong> – רמזים שהמטופל קולט, למשל אי-נוחות מול בכי או כעס, ושמשפיעים על התגובות שלו בטיפול.<\/li>\n<\/ul>","models":"<p><strong>עקרונות מנחים:<\/strong><\/p>\n<ol>\n<li>הימנעות מהנחות מוקדמות על הבעיות, התגובות, האמונות או המשאלות של המטופל.<\/li>\n<li>בחירת מילים זהירה, מתוך הנחה שלכל מה שנאמר במפגש יש השפעה על התפיסות והתגובות של המטופל.<\/li>\n<li>עמדה ריאלית לגבי מצב המטופל: מה אפשר להשיג בפגישה הראשונה ובטיפול, זמינות המטפל וכו'.<\/li>\n<li>זיהוי דרכי ההתמודדות של המטופל עם קשייו, מתוך עמדה מכבדת ולא שיפוטית.<\/li>\n<\/ol>\n<p><strong>רצף הפגישה:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>שלב<\/th>\n<th>מה עושים<\/th>\n<th>דגשים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. פתיחה ויצירת מסגרת<\/td>\n<td>הצגה עצמית מקצועית; הגדרת מסגרת הזמן; הסבר שהמפגש נועד להערכה ראשונית ולחשיבה על כיוון טיפולי; התייחסות ישירה לרישום, אם רושמים<\/td>\n<td>המטפל מוביל ושואל שאלות שמקלות על הדיאלוג; קשר עין; קשב לסימנים לא מילוליים (הסטת מבט, ישיבה לא נינוחה); עידוד (הנהון, \"ספר לי עוד\")<\/td>\n<\/tr>\n<tr>\n<td>2. זיהוי הקשיים המרכזיים<\/td>\n<td>לעזור למטופל להיות ספציפי וברור, לא מעורפל<\/td>\n<td>לזהות כמה שיותר מוקדם; להשתמש במילות המטופל; לברר לעומק אמירות כלליות; לעזור כשהמטופל נתקע ומאבד את חוט המחשבה<\/td>\n<\/tr>\n<tr>\n<td>3. איסוף מידע נוסף ויצירת קישורים ראשוניים<\/td>\n<td>לברר כמה זמן הבעיה קיימת, איך היא משפיעה ואילו אירועים קריטיים קרו סמוך להופעתה (אובדן, שינוי מקצועי, מחלה, פרידה)<\/td>\n<td>הבניה מחדש (re-framing); עמדה ריאלית בלי הבטחה להקלה מיידית; זיהוי מקורות כוח ומשאבים והדגשתם לצד הקושי<\/td>\n<\/tr>\n<tr>\n<td>(לאורך הפגישה) עמדה טיפולית<\/td>\n<td>יחסים ידידותיים אבל מקצועיים, שמבהירים שמדובר בקשר טיפולי<\/td>\n<td>ניטרליות; הימנעות מחשיפה עצמית, למעט מקרים חריגים ומתוך מחשבה; מודעות לתגובות לא רצוניות<\/td>\n<\/tr>\n<tr>\n<td>4. סיכום והערכה ראשונית<\/td>\n<td>\"עבודה עדינה\" של עצירת השיחה וארגונה; סיכום קצר של ההבנה, ואם אפשר גם של הגורמים שהובילו למצב<\/td>\n<td>הסיכום הוא הבסיס להצגת הכיוון הטיפולי<\/td>\n<\/tr>\n<tr>\n<td>5. הצגת כיוון טיפולי וקבלת משוב<\/td>\n<td>לשקול: האם אני יכול לעזור; התאמת שיטת הטיפול; תדירות; משך (קצר מועד או פתוח); פרטני או סוג אחר או נוסף (משפחתי, זוגי, קבוצתי)<\/td>\n<td>להקשיב ברגישות לשאלות ולמשוב; לשאול ישירות אם יש שאלות או מחשבות על הכיוון שהוצע<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>דוגמאות לבירור אמירות כלליות (מתוך הטקסט):<\/strong><\/p>\n<ul>\n<li>\"אמרת שאתה כל הזמן מדוכא. למה התכוונת? האם יש גם רגעים בהם אתה מרגיש אחרת?\"<\/li>\n<li>\"אמרת שאתה מפחד מאוד מדחייה. איזו דחייה בדיוק מטרידה אותך?\"<\/li>\n<\/ul>","practice":"<ul>\n<li><strong>להכין פתיחה קבועה לפגישת היכרות<\/strong> (עם הורים, ילד, מתבגר או איש צוות): מי אני ומה התפקיד שלי, כמה זמן יש לנו, מה מטרת הפגישה (הערכה ראשונית וחשיבה על כיוון), ואם אני רושם/ת, למה.<\/li>\n<li><strong>לזהות מוקדם את הדאגה המרכזית.<\/strong> כדאי לנסות להגיע אליה כבר בתחילת הפגישה. להשתמש במילים של הפונה, ולחדד אמירות כלליות כמו \"הוא כל הזמן מתפרץ\" בשאלות קונקרטיות: מתי, איפה, ויש רגעים שזה אחרת?<\/li>\n<li><strong>לשאול תמיד שלוש שאלות:<\/strong> ממתי זה קיים, איך זה משפיע על החיים, ומה קרה סמוך להופעת הקושי (אובדן, מעבר, מחלה, פרידה).<\/li>\n<li><strong>לחפש ולומר בקול גם את הכוחות והמשאבים<\/strong>, לא רק את הקשיים. לנסות ניסוח מחדש שנותן תקווה, בלי להבטיח הקלה מיידית.<\/li>\n<li><strong>לשים לב לתגובות הלא רצוניות שלי<\/strong> מול בכי, כעס או סיפור קשה, ולזכור שהפונה קולט אותן. כדאי להימנע מחשיפה עצמית בפגישה הראשונה, ולהביא להדרכה מקרים שבהם התלבטתי.<\/li>\n<li><strong>לשריין זמן לסיום:<\/strong> סיכום קצר של ההבנה שלי, הצעה לכיוון (תדירות, משך, פרטני או הדרכת הורים או אחר) ושאלה ישירה: \"יש לך שאלות או מחשבות על מה שהצעתי?\"<\/li>\n<li><strong>לשאול את עצמי בכנות אם אני המענה המתאים.<\/strong> אם לא, להפנות לגורם אחר, וזה חלק לגיטימי מהפגישה הראשונה.<\/li>\n<\/ul>","questions":"<ol>\n<li>איך מאזנים בין הערכה ליצירת מעורבות כשהפונים לא הגיעו מיוזמתם, למשל הורים שהופנו על ידי בית הספר?<\/li>\n<li>אילו הנחות מוקדמות הבאתי לפגישה הראשונה האחרונה שלי, ואיך הן השפיעו על השאלות ששאלתי?<\/li>\n<li>מתי חשיפה עצמית בפגישה ראשונה עשויה להיות מוצדקת, ומה השיקולים בעד ונגד?<\/li>\n<li>איך מנסחים מחדש בעיה כך שתהיה בניסוח גם תקווה וגם ריאליות? מה ההבדל בין הבניה מחדש לבין הרגעה מוקדמת מדי?<\/li>\n<li>איך אני מגיב/ה כשאני לא יכול/ה להציע כיוון ברור בסוף הפגישה הראשונה?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"...הפגישה הראשונה הנערכת עם מטופל חדש 'נותנת את הטון' להמשך התהליך הטיפולי.\" (עמ' 1)<\/li>\n<li>\"אמרת שאתה כל הזמן מדוכא. למה התכוונת? האם יש גם רגעים בהם אתה מרגיש אחרת?\" (עמ' 2)<\/li>\n<li>\"מטופלים קולטים אי נוחות של המטפל לנוכח בכי או כעס, ותגובותיהם בטיפול יכולות להיות מושפעות מהרמזים שקלטו.\" (עמ' 3)<\/li>\n<li>\"חשוב לשאול ישירות את המטופל האם יש לו שאלות או מחשבות על הכיוון הטיפולי שהוצע לו.\" (עמ' 3)<\/li>\n<\/ul>"},"level":"שנה א'","stype":"מאמר. ליתר דיוק, תקציר מקוון משני (3 עמודים) של פרק בספר.","tldr":"הפרק של ריבה מילר (Miller, 1999), \"הפגישה הראשונה עם מטופל חדש: חמישה שלבים\", לקוח ממדריך למתמחים בייעוץ ובפסיכותרפיה. הטענה המרכזית היא שהפגישה הראשונה \"נותנת את הטון\" לכל הטיפול. יש לה מטרה כפולה: להעריך את המטופל, ובו בזמן ליצור את המעורבות שלו.…","search":"הפרק של ריבה מילר (Miller, 1999), \"הפגישה הראשונה עם מטופל חדש: חמישה שלבים\", לקוח ממדריך למתמחים בייעוץ ובפסיכותרפיה. הטענה המרכזית היא שהפגישה הראשונה \"נותנת את הטון\" לכל הטיפול. יש לה מטרה כפולה: להעריך את המטופל, ובו בזמן ליצור את המעורבות שלו. המטפל והמטופל בוחנים יחד אם הטיפול יכול לעזור, ואם לא, המטפל מפנה להתערבות חלופית. הגישה נשענת על רעיונות של Milan וממשיכיו. היא מציעה מסגרת שיטתית שמבטיחה שהנושאים המרכזיים ייבדקו, ומתאימה למגוון מודלים תיאורטיים. בבסיסה ארבעה עקרונות: הימנעות מהנחות מוקדמות, בחירת מילים זהירה, עמדה ריאלית, ויחס מכבד ולא שיפוטי לדרכי ההתמודדות של המטופל. הפרק מתאר את רצף הפגישה: פתיחה: הצגה עצמית, מסגרת זמן, מטרת הפגישה והתייחסות לרישום. המטפל מוביל באופן פעיל וקשוב לסימנים לא מילוליים. זיהוי הקשיים: מוקדם ככל האפשר, במילים של המטופל, תוך חידוד של אמירות כלליות. איסוף מידע: משך הבעיה, השפעתה והאירועים שסביב הופעתה. בשלב הזה גם הבניה מחדש וזיהוי משאבים. עמדה טיפולית: ידידותית אבל מקצועית, ניטרלית וללא חשיפה עצמית. סיום: סיכום ההבנה, הצעת כיוון טיפולי והזמנה לשאלות. לפגישה הראשונה יש שתי משימות בו-זמנית: הערכה של המטופל ויצירת מעורבות שלו. אם המטפל מעריך שלא יוכל לעזור, מסיבה כלשהי, עליו להפנות להתערבות חלופית. הפגישה הראשונה עלולה להיות מלווה בחרדה משמעותית אצל שני הצדדים. לכן כדאי להחזיק כמה דגשים בסיסיים שעוזרים ליצור קשר טיפולי טוב. איכות הקשר תלויה בגורמים רבים: המסגרת: קליניקה פרטית, מרפאה או בית חולים. קבוצת האוכלוסייה. התיאוריה המנחה את המטפל, הניסיון שלו והאוריינטציה שלו. האתגר הוא הקשבה שמאפשרת הבנה \"פתוחה ומעמיקה ככל האפשר\" של בעיית המטופל. מסגרת שיטתית מבוססת Milan. היא מוודאת שהנושאים המרכזיים ייבדקו, ואיננה כובלת את המטפל לגישה תיאורטית אחת. המטפל מוביל. מאחר שהמטופל חסר ניסיון וחרד, המטפל מוביל את המפגש ושואל שאלות שמקלות על הדיאלוג. הוא שומר על קשר עין, שם לב לסימנים מילוליים ולא מילוליים (הסטת מבט, ישיבה לא נינוחה) ומעודד את המטופל להמשיך (הנהון, \"ספר לי עוד\"). לזהות מוקדם את הקשיים המרכזיים. כך נשאר זמן לדון בהם, והפגישה לא \"הולכת לאיבוד\". כדי לזהות אותם עוזרים למטופל להיות ספציפי, משתמשים במילים שלו ומבררים לעומק אמירות כלליות. אחרי איסוף המידע הראשוני מתחילים ליצור קישורים. בודקים כמה זמן הבעיה קיימת, איך היא משפיעה ואילו אירועים קריטיים קרו סמוך להופעתה (אובדן, שינוי מקצועי, מחלה, פרידה). הבניה מחדש (re-framing) של הבעיה יכולה לעזור למטופל לצאת מהפגישה אופטימי יותר, עם כיווני מחשבה ראשוניים על שינוי. אבל צריך לשמור על עמדה ריאלית ולא לעורר ציפייה להקלה מיידית. לצד הקשיים מדגישים גם את מקורות הכוח של המטופל. עמדה ידידותית אך מקצועית, ניטרלית וללא חשיפה עצמית. חשיפה עצמית בפגישה הראשונה רק במקרים יוצאי דופן, ובזהירות. מטופלים קולטים גם תגובות לא רצוניות של המטפל, למשל אי-נוחות מול בכי או כעס, ולומדים מהן. הסיום דורש \"עבודה עדינה\" של עצירת השיחה וארגונה. המטפל מציג סיכום קצר של ההבנה שלו, ועל בסיסו מציע כיוון טיפולי: שיטה, תדירות, משך, ומסגרת פרטנית או אחרת. אחר כך הוא מקשיב למשוב ושואל ישירות אם למטופל יש שאלות. פגישה ראשונה \"נותנת את הטון\" – הפגישה הראשונה מעצבת את המשך התהליך הטיפולי. הערכה ומעורבות בו-זמנית – הפגישה מנוהלת כך שתאפשר גם הערכה של המטופל וגם יצירת מעורבות שלו. הפניה להתערבות חלופית – חובת המטפל כשהוא מעריך שלא יוכל לעזור. מסגרת עבודה שיטתית (בהשראת Milan) – מבנה לפגישה הראשונה שמבטיח שהנושאים המרכזיים ייבדקו, ומתאים למגוון מודלים תיאורטיים. הימנעות מהנחות מוקדמות – לא להניח מראש מהן הבעיות, התגובות, האמונות או המשאלות של המטופל. שימוש במילות המטופל – לתאר את מצבו במילים שהוא בחר, כדי למנוע אי-הבנות והטיה. בירור לעומק של אמירות כלליות – לחדד ניסוחים עמומים (\"כל הזמן מדוכא\", \"מפחד מדחייה\") לשאלות ספציפיות. הבניה מחדש (re-framing) – ניסוח מחדש של הבעיה, שמאפשר למטופל לצאת אופטימי יותר ועם כיווני מחשבה על שינוי. עמדה ריאלית – לא לעורר ציפיות לא סבירות לשינוי ולהקלה מיידיים, ולהיות מציאותיים לגבי מה שאפשר להשיג וגם לגבי הזמינות של המטפל. עמדה ניטרלית / הימנעות מחשיפה עצמית – עוזרות למטופל להבין מה טיב היחסים הטיפוליים. תגובות לא רצוניות של המטפל – רמזים שהמטופל קולט, למשל אי-נוחות מול בכי או כעס, ושמשפיעים על התגובות שלו בטיפול."},{"id":"italy2019","title":"הפגישה (האנליטית) הראשונה עם בית הספר","authors":"לבנת איטלי","year":"2019","cite":"איטלי, ל' (6 בספטמבר 2019). הפגישה (האנליטית) הראשונה עם בית הספר. פסיכולוגיה עברית.","url":"https://www.hebpsy.net/articles.asp?id=3859","kind":"article","desc":null,"urlLabel":"המאמר באתר פסיכולוגיה עברית","file":{"orig":"הפגישה האנליטית הראשונה עם ביתה ספר.doc","ext":"doc","pdf":"italy2019.pdf","pages":9,"bytes":296361},"placements":[["s1","system"]],"extra":false,"ref":"איטלי 2019","inFolder":true,"srcTitle":"הפגישה (האנליטית) הראשונה עם בית הספר","secs":{"abstract":"<p>המאמר נכתב ימים ספורים לפני פתיחת שנת הלימודים, כשפסיכולוגים חינוכיים קובעים פגישות ראשונות עם מנהלים. טענתו המרכזית היא שההתרגשות והמתח שהפסיכולוג חש בכניסה למערכת חדשה הם לא רק חלק מהסתגלות אישית. הם חלק משמעותי מהעבודה עצמה ונושאים מידע חשוב על המערכת. מכאן שניסיון להרגיע את הפסיכולוג יותר מדי עלול לגרום לאובדן המידע הזה. המחברת נשענת על מאמרו של אוגדן \"הפגישה האנליטית הראשונה\" ומקבילה בין חדר הטיפול לעבודה המערכתית. ההקבלה עוסקת בהעברה ובהעברה נגדית שמתחילות עוד לפני הפגישה, ב\"סימני אזהרה\" וב\"חרדת העברה\", בפרדוקס שבין הרשמי לאינטימי, ב\"מרחב האנליטי\" ובוויתור על לקיחת אנמנזה שיטתית. היא גם מצביעה על ההבדלים: הפסיכולוג הוא שמגיע לבית הספר, והמנהל לא בחר בשינוי. לכן זו קרקע פורייה להתנגדות, להזדהות השלכתית ול-enactment. ארבע דוגמאות מהדרכה מדגימות איך \"תקלות\" בכניסה הופכות לחומר לאבחון מערכתי. המחברת קובעת שעל קיום הפגישה הראשונה עם המנהל אין מקום לגמישות, וממליצה על פגישות שבועיות, ולכל הפחות שלוש בשנה. היא מזהירה מ\"מלכודת האבחנות הפסיכולוגיות של אנשי החינוך כפרסונות\".<\/p>","ideas":"<ul>\n<li>המתח הרגשי שמלווה את הכניסה לבית ספר חדש הוא מקור מידע על המערכת, ולא רק תופעת הסתגלות של הפסיכולוג. הרגעה מוקדמת מדי עלולה להוריד את החרדה אבל גם לגרום לאובדן מידע שיש לו השלכות על העבודה המערכתית.<\/li>\n<li>לפסיכולוגיה החינוכית שלושה אשכולות: דיאגנוסטיקה, טיפול ועבודה מערכתית. הם אינם מיומנויות נפרדות או סותרות. בבסיס שלושתם עומדת עמדה פסיכולוגית דינמית משותפת, ולכן ההמשגה הפסיכואנליטית יכולה לשמש בסיס איתן גם לעבודה המערכתית.<\/li>\n<li>כשמתייחסים לבית הספר ולאנשי החינוך כ\"קליינט\", הכוונה לפונקציה המקצועית שלהם ולא לאישיותם. בעקבות יבלון (2017): אי אפשר ולא רצוי \"להשכיב את הארגון על הספה\", אבל אפשר להשתמש בכלים אנליטיים \"במתינות\".<\/li>\n<li>העברה והעברה נגדית מתחילות עוד לפני הפגישה הראשונה. כל פסיכולוג חווה את בית הספר כילד וכהורה, ופסיכולוגים ומנהלים נושאים איתם גם את הפסיכולוגים והמנהלים שעבדו איתם קודם.<\/li>\n<li>בניגוד למטופל, המנהל לא בחר בשינוי ולא בהכרח רואה בפסיכולוג מוביל שינוי. לכן הפגישה הראשונה היא קרקע לתהליכי התנגדות, הזדהות השלכתית ו-enactment, ונדרשות רגישות והתכווננות מיוחדות.<\/li>\n<li>בבית הספר הפסיכולוג הוא שמגיע, ופגישות נערכות בדרך כלל בחדר המנהל. המנהל והארגון חשופים ועלולים לחוות את המפגש כחודרני, והפסיכולוג פגיע יותר כי עליו לשאת את ה-setting בתוכו. מושג \"האוהל\" של בנימיני מתאר את מבנה הביניים שהפסיכולוג בונה בשדה, ויש לו גם היבט התפתחותי: מתחילים צריכים לעבור דרך עד שהם מרגישים בצורך בו.<\/li>\n<li>חוויות \"קבלת הפנים\" (המתנה במזכירות, איחור, ביטול, בלבול בשעה, דחייה בגלל אירוע דחוף) הן חומר לחשיבה על העברה והעברה נגדית ועל צורכי המערכת מהפסיכולוג.<\/li>\n<li>יש פער מובנה בין המשימה הניהולית, שמכוונת למטרות ומדברת בשפה מהירה, פרגמטית וממוקדת בתוצאות, לבין המשימה הפסיכולוגית, שמכוונת לתהליך ומדברת בשפה איטית ולעיתים עמומה. כדי שייווצר \"מרחב אנליטי\" (פגישות אישיות עם מנהל), על הפסיכולוג להיות רגיש לפער הזה ולהתאים את עצמו.<\/li>\n<li>על עצם קיומה של הפגישה הראשונה עם המנהל אין מקום לגמישות: זהו \"תנאי בסיסי והכרחי לעבודה\", כמו הגעת המטופל לטיפול. תדירות מומלצת: פעם בשבוע, ולכל הפחות שלוש פגישות בשנה (בכניסה, באמצע ובסיכום השנה).<\/li>\n<li>בעקבות אוגדן, עדיף לא לאסוף אנמנזה שיטתית בתחילת הפגישה. כדאי לאפשר למנהל לבחור מה לספר (ומה לא) ולהיות ערניים להעברה. כך מתקבל בהדרגה מידע רב לפחות כמו באיסוף נתונים מסודר.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>העברה והעברה נגדית<\/strong> – רגשות מודעים ולא מודעים שמתעוררים כלפי בעלי תפקידים (\"מנהל\", \"מורה\", \"פסיכולוג\"), עוד לפני המפגש בפועל.<\/li>\n<li><strong>\"סימני אזהרה\" / \"חרדת העברה\" (אוגדן)<\/strong> – הסברים לא מודעים של המטופל (כאן: המערכת) לתחושה שהקשר מסוכן או מועד לכישלון. על המטפל לנסות להמשיג אותם במילים \"בעיתוי הנכון\".<\/li>\n<li><strong>הזדהות השלכתית<\/strong> – השלכה של רגשות (למשל תוקפנות או ניכור) על הפסיכולוג, שחווה אותם כאילו היו שלו.<\/li>\n<li><strong>Enactment<\/strong> – לפי הפרספקטיבה ההתייחסותית (חזקיהו, 2017), מפגש שבו ההעברה וההעברה הנגדית מיטשטשות ועולמות הלא מודע של שני הצדדים נוגעים זה בזה. הוא מאופיין ב\"קיפאון משותף\", כי כל תנועה נחווית כמסוכנת.<\/li>\n<li><strong>מרחב אנליטי<\/strong> – מרחב ייחודי לכל \"זוג\", שבו המטופל חושב, מרגיש וחי. בפסיכולוגיה החינוכית המונח המקובל לו הוא \"פגישות אישיות עם מנהל\".<\/li>\n<li><strong>\"האוהל\" (בנימיני, 1984)<\/strong> – מבנה חלופי שהפסיכולוג החינוכי בונה בשדה, בתנועה בין \"הבית\" (השפ\"ח) לבין השדה (המערכות החינוכיות). יש לו היבט התפתחותי, ואין להציג אותו \"טרם זמנו\".<\/li>\n<li><strong>Setting<\/strong> – המסגרת הטיפולית. בעבודה בבית הספר הפסיכולוג צריך להביא אותה \"בתוכו\".<\/li>\n<li><strong>פרדוקס רשמי-אינטימי<\/strong> – הקשר הטיפולי הוא מהרשמיים ובו-זמנית מהאינטימיים שבקשרים האנושיים. המטפל שומר על המתח הזה, ואוגדן מזהיר מתחילים מפני small talk.<\/li>\n<li><strong>\"קליינט\" מערכתי<\/strong> – בית הספר ואנשי החינוך כלקוחות, כשההתמקדות היא בפונקציה המקצועית שלהם ולא בפונקציה האישית.<\/li>\n<li><strong>ניטרליות פסיכולוגית / עמדה סקרנית<\/strong> – עמדה מתבוננת ולומדת, שאינה מתגוננת, תוקפנית או מרצה. היא מאפשרת לעבד בהדרגה את מה שהושלך ולהמשיג אותו כאבחון מערכתי.<\/li>\n<\/ul>","models":"<h3>1. הקבלה בין רעיונות אוגדן לכניסה לבית הספר<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>אצל אוגדן (חדר הטיפול)<\/th>\n<th>בבית הספר (לפי המאמר)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>להיות מופתע מחדש מהעברה, מהתנגדות ומהעברה נגדית, להיות נתון להשפעתן ולנתח אותן רק בדיעבד<\/td>\n<td>המפגש עם בעלי תפקידים מעורר השלכות עוד לפני שנפגשים. דוגמה מפאנל מנהלות: \"מאוד מלחיץ לדבר מול עשרות פסיכולוגים\", ופסיכולוגית ענתה \"את נלחצת? אנחנו יושבים מול ה'מנהלות'\"<\/td>\n<\/tr>\n<tr>\n<td>העברות של שני הצדדים קיימות עוד לפני הפגישה<\/td>\n<td>הפסיכולוג מביא את חוויותיו מבית הספר כילד וכהורה. שני הצדדים נושאים את קודמיהם בתפקיד<\/td>\n<\/tr>\n<tr>\n<td>הפגישה הראשונה אינה שונה במהותה משאר הפגישות. הזמנה לשקול את משמעות החוויה, לקבל בלי שיפוט, ובאותו זמן מטרה של שינוי<\/td>\n<td>המנהל לא בחר בשינוי, ולכן זו קרקע להתנגדות, להזדהות השלכתית ול-enactment<\/td>\n<\/tr>\n<tr>\n<td>חדר ההמתנה; יחסים רשמיים ואינטימיים בו-זמנית; הימנעות מ-small talk<\/td>\n<td>הפסיכולוג מגיע אל המנהל. המנהל והארגון חשופים, והפסיכולוג נושא את ה-setting בתוכו. חוויות \"קבלת פנים\"<\/td>\n<\/tr>\n<tr>\n<td>\"סימני אזהרה\" ו\"חרדת העברה\". שאלות ישירות הן אמירות על פנטזיות או ניסיון לגרום למטפל \"למלא את המרחב\", ועל חלקן יש לענות כמובן מאליו<\/td>\n<td>לענות בפשטות על שאלות בסיסיות (היקף השעות, דרכי התקשרות), ולזהות \"סימני אזהרה\" כמו הפניה לרכזת במקום פגישה עם המנהלת<\/td>\n<\/tr>\n<tr>\n<td>\"מרחב אנליטי\" ייחודי לכל זוג. האנליטיקאי מאפשר לעצמו \"להיברא\" על ידי המטופל<\/td>\n<td>פגישות אישיות עם המנהל, בהתאמה לקצב ולשפה שלו<\/td>\n<\/tr>\n<tr>\n<td>לא לקחת אנמנזה. ההיסטוריה עולה בהתייחסויות מודעות ודרך העברה-העברה נגדית<\/td>\n<td>לתת למנהל לבחור מה לספר, לפחות בשלב הראשון, לפני איסוף נתונים על בית הספר, האוכלוסייה, המבנה הארגוני והמנהל<\/td>\n<\/tr>\n<tr>\n<td>\"הרעיונות... הנם רעיונות ותו לא\", ולא כללים<\/td>\n<td>בעבודה מערכתית נדרש גם ידע בהבנה ארגונית, בפילוסופיה של החינוך ובתיאוריות של חינוך וניהול<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>2. חוויות \"קבלת פנים\" שכדאי לסמן (כפי שנמנו במאמר)<\/h3>\n<ul>\n<li>המתנה בחדר המזכירות<\/li>\n<li>איחור לפגישה הראשונה<\/li>\n<li>ביטול הפגישה<\/li>\n<li>בלבול בשעה או ביום<\/li>\n<li>דחיית הפגישה בגלל אירוע דחוף<\/li>\n<li>(מתוך הדוגמאות) הצטרפות לא מתוכננת של אנשים נוספים לפגישה, או \"הסטה\" לרכזת במקום פגישה עם המנהלת<\/li>\n<\/ul>\n<h3>3. שאלות שהפסיכולוגית שאלה את עצמה מול אירוע לא צפוי (המנהלת זימנה לפגישה הראשונה את כל הצוות הניהולי, והיועצת התקשרה לתקן)<\/h3>\n<ul>\n<li>מדוע המנהלת ביקשה מהיועצת להצטרף לפגישה?<\/li>\n<li>מדוע היועצת לקחה על עצמה את האחריות להתקשר לפסיכולוגית?<\/li>\n<li>מה משמעות האירוע הנקודתי הזה לגבי הקשר והדינמיקה בין היועצת למנהלת, לפסיכולוגית ולבית הספר בכלל?<\/li>\n<li>איזה משולש נוצר כאן ביחסי מנהלת-יועצת-פסיכולוגית?<\/li>\n<\/ul>\n<h3>4. פערים בין המשימה הניהולית למשימה הפסיכולוגית<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>ניהולית-בית ספרית<\/th>\n<th>פסיכולוגית<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>כיוון המשימה<\/td>\n<td>מכוונת מטרות<\/td>\n<td>מכוונת תהליך<\/td>\n<\/tr>\n<tr>\n<td>שפה<\/td>\n<td>דינמית, מהירה ופרגמטית<\/td>\n<td>איטית ולעיתים קרובות עמומה<\/td>\n<\/tr>\n<tr>\n<td>דגש<\/td>\n<td>תוצאות והישגים<\/td>\n<td>תהליך<\/td>\n<\/tr>\n<tr>\n<td>קצב<\/td>\n<td>\"קצב מטורף\", אירועי חירום יומיומיים שדורשים מענה מיידי<\/td>\n<td>עומק, חשיבה והשתהות<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>5. בניית \"מרחב אנליטי\" עם המנהל, בהדרגה<\/h3>\n<ul>\n<li>לגבש זהות מקצועית ולהבין את הייחודיות של המענה שהפסיכולוג מציע, כדי להמשיג (קודם כל לעצמו) את חשיבות המרחב.<\/li>\n<li>לקבוע פגישות קבועות ולהקפיד, מצד הפסיכולוג, על קיומן.<\/li>\n<li>לנהל שיח פתוח ואמפתי על סדרי העדיפויות ועל המתח התמידי של המנהל בין \"הדחוף\" ל\"חשוב\".<\/li>\n<li>לא לצפות שהמנהל יצליח תמיד \"לסגור את הדלת\" לפגישה שבועית.<\/li>\n<li><strong>תדירות<\/strong>: לדעת המחברת, עבודה מערכתית יעילה דורשת פגישה פעם בשבוע, ולא פחות משלוש פגישות בשנה (כניסה, אמצע וסיכום).<\/li>\n<li><strong>עיקרון<\/strong>: אין גמישות לגבי עצם קיום הפגישה הראשונה. היא חלק מ\"חוזה העבודה\" של הפסיכולוג, ואולי של השפ\"ח, עם המנהל.<\/li>\n<\/ul>\n<h3>6. דוגמאות מהדרכה<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>דוגמה<\/th>\n<th>מה קרה<\/th>\n<th>מה עובד בהדרכה<\/th>\n<th>התוצאה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>פסיכולוגית ותיקה בבית ספר חדש<\/td>\n<td>המנהלת עסקה בשעות \"שקיבלה מהשפ\"ח\" ולחצה להוסיף שעות ולפצל את יום העבודה. הפסיכולוגית הרגישה שהיא דחוקה למקום ביורוקרטי ושהמנהלת מפצלת בין \"אנחנו\" ל\"אתם\", והרגישה ניכור, תסכול וכעס<\/td>\n<td>ההתמקמות של פסיכולוגית שפ\"ח, הקושי שלה להיות בעמדה \"ממסדית\" והחשש שלא תיצור קשר משמעותי<\/td>\n<td>בלי לשנות את היקף העבודה, עמדה סקרנית ואמפתית פתחה שיח על צורכי בית הספר. התברר ש\"שייכות\" ו\"אחר\" הן תמה מרכזית בבית הספר, בגלל מאפייני האוכלוסייה. הפסיכולוגית הכילה את התוקפנות שהושלכה עליה, בנתה אמון והציעה התערבות לחיזוק השייכות בחדר המורים, כתהליך מקביל לשייכות התלמידים<\/td>\n<\/tr>\n<tr>\n<td>שיחת הטלפון הראשונה<\/td>\n<td>המנהלת ביקשה לדעת את שם המשפחה של הפסיכולוגית לפני הנישואים, כדי לברר אם יש ביניהן היכרות. הפסיכולוגית הרגישה דחוקה לפינה ונענתה<\/td>\n<td>אסוציאציות חופשיות בהדרכה: אולי צורך של המנהלת בשליטה ובעליונות. בהעברה הנגדית: כעס, חודרנות, מבוכה ותחושה של \"ילדה קטנה אל מול מנהלת גדולה\", כולן עוד לפני הפגישה<\/td>\n<td>עמדה ניטרלית יותר, לא מתגוננת, תוקפנית או מרצה, שמאפשרת לבחון את החוויה יחד בהמשך<\/td>\n<\/tr>\n<tr>\n<td>המנהלת זימנה את כל הצוות הניהולי לפגישה האישית, והיועצת התקשרה \"לתקן\"<\/td>\n<td>אפשר היה לראות בזה טעות או אי הבנה, או להתבייש בכך שלא הסבירה את עצמה מספיק<\/td>\n<td>סימון האירוע כחלק מחוויית הכניסה ושאילת השאלות שבסעיף 3<\/td>\n<td>לקראת סוף השנה התברר שזה דפוס של המנהלת: היא התקשתה לבסס סמכות ובחרדתה גייסה את היועצת, שנשאבה לעמדה מגוננת והורית. מכאן נבנתה תוכנית עבודה עם המנהלת וצוות ההנהלה<\/td>\n<\/tr>\n<tr>\n<td>רכזת במקום מנהלת<\/td>\n<td>אחרי כמה ניסיונות התקשרה רכזת ואמרה שהמנהלת ביקשה לייעל את התהליך ושאין צורך בפגישה מקדימה איתה<\/td>\n<td>הפסיכולוגית זיהתה את \"המלכודת\", ובגיבוי ראש הצוות שלה התעקשה על פגישה עם המנהלת לפני תחילת העבודה. בהדרכה עובדו \"סימני האזהרה\" ו\"חרדת ההעברה\"<\/td>\n<td>התברר שהפרידה מהפסיכולוגית הקודמת לא עובדה כראוי, ולכן קשה היה למנהלת להיכנס לקשר חדש<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","practice":"<ul>\n<li>לפני הכניסה לבית הספר ואחריה, כדאי לרשום את התחושות שעולות (מבוכה, כעס, תחושת \"ילד מול מנהל\", רצון לרצות) ולהביא אותן להדרכה כמידע על המערכת, לא רק כ\"לחץ של מתחילים\".<\/li>\n<li>לסמן כל אירוע לא צפוי בכניסה: המתנה, ביטול, דחייה, אנשים שהצטרפו, מי התקשר במקום מי. כדאי לשאול מה הוא מלמד על היחסים ועל המשולשים בהנהלה.<\/li>\n<li>להתעקש בנועם על פגישה אישית ראשונה עם המנהל ולא להסתפק ברכזת או ביועצת. אם צריך, להיעזר בראש הצוות.<\/li>\n<li>לענות בפשטות ובבהירות על שאלות בסיסיות (היקף שעות, ימי עבודה, דרכי התקשרות), ובמקביל לשים לב מה הן מבטאות.<\/li>\n<li>בפגישה הראשונה לתת למנהל לספר בדרכו לפני שעוברים לשאלות רקע שיטתיות, ולשים לב גם למה שלא מסופר.<\/li>\n<li>לברר מה היה עם הפסיכולוג הקודם ואיך נפרדו, כי פרידה שלא עובדה עלולה להקשות על הקשר החדש.<\/li>\n<li>לבנות רצף של פגישות קבועות עם המנהל, ולפחות כניסה, אמצע וסיכום. להתאים את עצמך לקצב של המנהל ולדבר איתו בגלוי על הפער בין \"דחוף\" ל\"חשוב\".<\/li>\n<li>להיזהר מ\"לאבחן\" אנשי חינוך כפרסונות. ההמשגה הדינמית נועדה להבנה מערכתית ולבחירת התערבות, לא לתיוג אישי.<\/li>\n<\/ul>","questions":"<ul>\n<li>אילו חוויות שלי מבית הספר, כתלמיד, כהורה או כמי שעבד בעבר עם מנהלים, נכנסות איתי לפגישה עם המנהל הזה?<\/li>\n<li>מה קרה סביב קביעת הפגישה הראשונה ובמהלכה? אילו \"סימני אזהרה\" או \"חרדת העברה\" אפשר לזהות בזה?<\/li>\n<li>מה הושלך עליי בכניסה (ביורוקרטיות, \"אתם\" מול \"אנחנו\", ילדה מול מנהלת)? איך אני יכול להכיל את זה בלי להתגונן, לתקוף או לרצות?<\/li>\n<li>איך אני מסביר לעצמי, ואחר כך למנהל, את הערך של פגישות קבועות איתו, בשפה שמתאימה לקצב ולסדרי העדיפויות שלו?<\/li>\n<li>איפה עובר אצלי הגבול בין שימוש בהבנה דינמית של המנהל לבין \"אבחון\" שלו כאדם?<\/li>\n<\/ul>","quotes":"<ul>\n<li>\"במאמר זה אבקש לטעון שהקושי המלווה בעוצמות רגשיות, אותו חווה הפסיכולוג, הינו חלק משמעותי מהעבודה הפסיכולוגית.\"<\/li>\n<li>\"...המפגש הראשון עם תחילת עבודתו של הפסיכולוג בבית הספר הוא תנאי בסיסי והכרחי לעבודה.\"<\/li>\n<li>\"כפי שברור לנו שעל מנת שיוכל להתקיים טיפול פסיכולוגי, התנאי הבסיסי (ואולי גם היחיד) הוא שהמטופל יגיע.\"<\/li>\n<li>\"עלינו להבחין בין הקליינטים בשדה בצוות החינוכי לבין המטופלים בחדר הטיפולים, ולהיזהר ממלכודת האבחנות הפסיכולוגיות של אנשי החינוך כפרסונות.\"<\/li>\n<\/ul>"},"level":"שנה א'","stype":"מאמר","tldr":"המאמר נכתב ימים ספורים לפני פתיחת שנת הלימודים, כשפסיכולוגים חינוכיים קובעים פגישות ראשונות עם מנהלים. טענתו המרכזית היא שההתרגשות והמתח שהפסיכולוג חש בכניסה למערכת חדשה הם לא רק חלק מהסתגלות אישית. הם חלק משמעותי מהעבודה עצמה ונושאים מידע חשוב על…","search":"המאמר נכתב ימים ספורים לפני פתיחת שנת הלימודים, כשפסיכולוגים חינוכיים קובעים פגישות ראשונות עם מנהלים. טענתו המרכזית היא שההתרגשות והמתח שהפסיכולוג חש בכניסה למערכת חדשה הם לא רק חלק מהסתגלות אישית. הם חלק משמעותי מהעבודה עצמה ונושאים מידע חשוב על המערכת. מכאן שניסיון להרגיע את הפסיכולוג יותר מדי עלול לגרום לאובדן המידע הזה. המחברת נשענת על מאמרו של אוגדן \"הפגישה האנליטית הראשונה\" ומקבילה בין חדר הטיפול לעבודה המערכתית. ההקבלה עוסקת בהעברה ובהעברה נגדית שמתחילות עוד לפני הפגישה, ב\"סימני אזהרה\" וב\"חרדת העברה\", בפרדוקס שבין הרשמי לאינטימי, ב\"מרחב האנליטי\" ובוויתור על לקיחת אנמנזה שיטתית. היא גם מצביעה על ההבדלים: הפסיכולוג הוא שמגיע לבית הספר, והמנהל לא בחר בשינוי. לכן זו קרקע פורייה להתנגדות, להזדהות השלכתית ול-enactment. ארבע דוגמאות מהדרכה מדגימות איך \"תקלות\" בכניסה הופכות לחומר לאבחון מערכתי. המחברת קובעת שעל קיום הפגישה הראשונה עם המנהל אין מקום לגמישות, וממליצה על פגישות שבועיות, ולכל הפחות שלוש בשנה. היא מזהירה מ\"מלכודת האבחנות הפסיכולוגיות של אנשי החינוך כפרסונות\". המתח הרגשי שמלווה את הכניסה לבית ספר חדש הוא מקור מידע על המערכת, ולא רק תופעת הסתגלות של הפסיכולוג. הרגעה מוקדמת מדי עלולה להוריד את החרדה אבל גם לגרום לאובדן מידע שיש לו השלכות על העבודה המערכתית. לפסיכולוגיה החינוכית שלושה אשכולות: דיאגנוסטיקה, טיפול ועבודה מערכתית. הם אינם מיומנויות נפרדות או סותרות. בבסיס שלושתם עומדת עמדה פסיכולוגית דינמית משותפת, ולכן ההמשגה הפסיכואנליטית יכולה לשמש בסיס איתן גם לעבודה המערכתית. כשמתייחסים לבית הספר ולאנשי החינוך כ\"קליינט\", הכוונה לפונקציה המקצועית שלהם ולא לאישיותם. בעקבות יבלון (2017): אי אפשר ולא רצוי \"להשכיב את הארגון על הספה\", אבל אפשר להשתמש בכלים אנליטיים \"במתינות\". העברה והעברה נגדית מתחילות עוד לפני הפגישה הראשונה. כל פסיכולוג חווה את בית הספר כילד וכהורה, ופסיכולוגים ומנהלים נושאים איתם גם את הפסיכולוגים והמנהלים שעבדו איתם קודם. בניגוד למטופל, המנהל לא בחר בשינוי ולא בהכרח רואה בפסיכולוג מוביל שינוי. לכן הפגישה הראשונה היא קרקע לתהליכי התנגדות, הזדהות השלכתית ו-enactment, ונדרשות רגישות והתכווננות מיוחדות. בבית הספר הפסיכולוג הוא שמגיע, ופגישות נערכות בדרך כלל בחדר המנהל. המנהל והארגון חשופים ועלולים לחוות את המפגש כחודרני, והפסיכולוג פגיע יותר כי עליו לשאת את ה-setting בתוכו. מושג \"האוהל\" של בנימיני מתאר את מבנה הביניים שהפסיכולוג בונה בשדה, ויש לו גם היבט התפתחותי: מתחילים צריכים לעבור דרך עד שהם מרגישים בצורך בו. חוויות \"קבלת הפנים\" (המתנה במזכירות, איחור, ביטול, בלבול בשעה, דחייה בגלל אירוע דחוף) הן חומר לחשיבה על העברה והעברה נגדית ועל צורכי המערכת מהפסיכולוג. יש פער מובנה בין המשימה הניהולית, שמכוונת למטרות ומדברת בשפה מהירה, פרגמטית וממוקדת בתוצאות, לבין המשימה הפסיכולוגית, שמכוונת לתהליך ומדברת בשפה איטית ולעיתים עמומה. כדי שייווצר \"מרחב אנליטי\" (פגישות אישיות עם מנהל), על הפסיכולוג להיות רגיש לפער הזה ולהתאים את עצמו. על עצם קיומה של הפגישה הראשונה עם המנהל אין מקום לגמישות: זהו \"תנאי בסיסי והכרחי לעבודה\", כמו הגעת המטופל לטיפול. תדירות מומלצת: פעם בשבוע, ולכל הפחות שלוש פגישות בשנה (בכניסה, באמצע ובסיכום השנה). בעקבות אוגדן, עדיף לא לאסוף אנמנזה שיטתית בתחילת הפגישה. כדאי לאפשר למנהל לבחור מה לספר (ומה לא) ולהיות ערניים להעברה. כך מתקבל בהדרגה מידע רב לפחות כמו באיסוף נתונים מסודר. העברה והעברה נגדית – רגשות מודעים ולא מודעים שמתעוררים כלפי בעלי תפקידים (\"מנהל\", \"מורה\", \"פסיכולוג\"), עוד לפני המפגש בפועל. \"סימני אזהרה\" / \"חרדת העברה\" (אוגדן) – הסברים לא מודעים של המטופל (כאן: המערכת) לתחושה שהקשר מסוכן או מועד לכישלון. על המטפל לנסות להמשיג אותם במילים \"בעיתוי הנכון\". הזדהות השלכתית – השלכה של רגשות (למשל תוקפנות או ניכור) על הפסיכולוג, שחווה אותם כאילו היו שלו. Enactment – לפי הפרספקטיבה ההתייחסותית (חזקיהו, 2017), מפגש שבו ההעברה וההעברה הנגדית מיטשטשות ועולמות הלא מודע של שני הצדדים נוגעים זה בזה. הוא מאופיין ב\"קיפאון משותף\", כי כל תנועה נחווית כמסוכנת. מרחב אנליטי – מרחב ייחודי לכל \"זוג\", שבו המטופל חושב, מרגיש וחי. בפסיכולוגיה החינוכית המונח המקובל לו הוא \"פגישות אישיות עם מנהל\". \"האוהל\" (בנימיני, 1984) – מבנה חלופי שהפסיכולוג החינוכי בונה בשדה, בתנועה בין \"הבית\" (השפ\"ח) לבין השדה (המערכות החינוכיות). יש לו היבט התפתחותי, ואין להציג אותו \"טרם זמנו\". Setting – המסגרת הטיפולית. בעבודה בבית הספר הפסיכולוג צריך להביא אותה \"בתוכו\". פרדוקס רשמי-אינטימי – הקשר הטיפולי הוא מהרשמיים ובו-זמנית מהאינטימיים שבקשרים האנושיים. המטפל שומר על המתח הזה, ואוגדן מזהיר מתחילים מפני small talk. \"קליינט\" מערכתי – בית הספר ואנשי החינוך כלקוחות, כשההתמקדות היא בפונקציה המקצועית שלהם ולא בפונקציה האישית. ניטרליות פסיכולוגית / עמדה סקרנית – עמדה מתבוננת ולומדת, שאינה מתגוננת, תוקפנית או מרצה. היא מאפשרת לעבד בהדרגה את מה שהושלך ולהמשיג אותו כאבחון מערכתי."},{"id":"dorhaim2018","title":"על היוועצות אישית עם מנהל בית ספר","authors":"פ' דור-חיים","year":"2018","cite":"דור־חיים, פ' (2018). על היוועצות אישית עם מנהל בית ספר. בתוך ש' מי־טל ור' שלהבת־קניאל (עורכות), סוגיות בפסיכולוגיה חינוכית: מהלכה למעשה (עמ' 145-172). שפ\"י, משרד החינוך.","url":"https://meyda.education.gov.il/files/shefi/psihologia/Sugiot_Psychologia_Halacha_Lemaase_kerech_alef.pdf","kind":"article","desc":"פרק בספר \"סוגיות בפסיכולוגיה חינוכית: מהלכה למעשה\" שעוסק בהיוועצות האישית של הפסיכולוג עם מנהל בית הספר. הספר כולו זמין להורדה באתר משרד החינוך.","urlLabel":"הספר המלא באתר משרד החינוך (PDF), כרך א', עמ' 145","placements":[["s1","system"]],"extra":false,"ref":"דור-חיים 2018","inFolder":false,"tldr":"פרק בספר \"סוגיות בפסיכולוגיה חינוכית: מהלכה למעשה\" שעוסק בהיוועצות האישית של הפסיכולוג עם מנהל בית הספר. הספר כולו זמין להורדה באתר משרד החינוך.","search":"פרק בספר \"סוגיות בפסיכולוגיה חינוכית: מהלכה למעשה\" שעוסק בהיוועצות האישית של הפסיכולוג עם מנהל בית הספר. הספר כולו זמין להורדה באתר משרד החינוך."},{"id":"englert","title":"אבחון והתערבות בדיאלוג מתמיד","authors":"מיכל אנגלרט","year":"2018","cite":"אנגלרט, מ' (2018). עבודה מערכתית: אבחון והתערבות בדיאלוג מתמיד. בתוך ש' מי־טל ור' שלהבת־קניאל (עורכות), סוגיות בפסיכולוגיה חינוכית: מהלכה למעשה, כרך א' (עמ' 127-144). שפ\"י, משרד החינוך.","url":"https://meyda.education.gov.il/files/shefi/psihologia/Sugiot_Psychologia_Halacha_Lemaase_kerech_alef.pdf","kind":"article","desc":null,"urlLabel":"הספר המלא באתר משרד החינוך (PDF), כרך א', עמ' 127","file":{"orig":"אבחון והתערבות בדיאלוג מתמיד.pdf","ext":"pdf","note":"rotated","pdf":"englert.pdf","pages":17,"bytes":3537451},"placements":[["s1","system"]],"extra":false,"ref":"אנגלרט","inFolder":true,"srcTitle":"עבודה מערכתית: אבחון והתערבות בדיאלוג מתמיד","secs":{"abstract":"<p>אנגלרט טוענת שבמציאות של היום רק לעיתים רחוקות יכול פסיכולוג חינוכי לערוך אבחון מערכת כולל ומובנה, כפרויקט נפרד, כשהוא נכנס לבית ספר. שעותיו מוגבלות, והתרבות הארגונית מחפשת פתרונות מיידיים. לכן היא מציעה לשלב אבחון והתערבות \"תוך כדי תנועה\": לבצע את הפעולות השוטפות וההכרחיות, ובאותו זמן ללמוד מהן על המערכת, בתהליך מעגלי שדומה ל\"מחקר פעולה\". המאמר מגדיר את בית הספר כמערכת פתוחה (תשומות, תהליכים, תפוקות), מציג את המפה המערכתית של פוקס (שישה רכיבים) ואת ניתוח SWOT, ודן בשאלה מתי אבחון כולל באמת נחוץ. אחר כך הוא מציג כלים ללמידה על המערכת: שלוש רמות מידע (הצהרות, התרחשויות, פירושים), חשיפת פערים בין המוצהר למתרחש, וניתוח תוצרים גלויים ומסמכים. החלק האחרון עוסק במנהל כ\"מפתח\" לאבחון ולהתערבות, ובמעבר של הפסיכולוג מעמדה ריאקטיבית לעמדה פרואקטיבית, באמצעות הרחבת \"טווח ההשהיה\", \"שאלות ממקום אחר\" וייחוס משמעות חיובית. לאורך המאמר משולבות דוגמאות מהשטח.<\/p>","ideas":"<ul>\n<li><strong>חשיבה מעגלית ולא קווית<\/strong>: עבודה מערכתית אינה מוגדרת, והחשיבה שלה מעגלית. בכל מעגל צריך לחפש את \"הסיפור המסתתר\" שיוצר דפוס חוזר, שמקדם, מאט או מחמיר את המצב ומשפיע על מעגלים נוספים.<\/li>\n<li><strong>בית הספר כמערכת פתוחה<\/strong>: תשומות (תלמידים, מורים, משאבים, טכנולוגיות; למנהל שליטה מוגבלת עליהן), תהליכים (חלקם מעוגנים בתקנות משרד החינוך; שלבי הביצוע עמומים וארוכים), ותפוקות (ציונים, בגרות, למידה עצמאית; מלבד הציונים קשה להגדיר ולמדוד אותן), עם היזון חוזר מעגלי ביניהן.<\/li>\n<li><strong>אבחון כולל אינו תמיד הכרחי<\/strong>: לפי לוי (2000), אבחון כולל מתאים לארגון שאינו יודע להגדיר את בעיותיו, שיש לו זמן ומשאבים, שמטרות השינוי בו אינן ברורות או מוסכמות, או שהוא יציב. אבל אבחון הוא \"מנוף חלש לשינוי\", ו\"המגירות במשרדי ארגונים רבים מלאות חוברות... שלא נעשה בהן שימוש\".<\/li>\n<li><strong>שיקול עלות-תועלת<\/strong>: בעיות שמשותפות לבתי ספר רבים (משמעת, אלימות, תקשורת, עבודת צוות, ניהול כיתה) לרוב אינן מצריכות אבחון כולל. צריך להבין ולהגדיר את הבעיה, ואפשר לאמץ \"פתרונות מדף\" (למשל \"התפריט הבסיסי\") ולהתאים אותם לבית הספר. את רוב הזמן כדאי להשקיע בהכשרה, בתרגול ובהטמעה.<\/li>\n<li><strong>מחקר פעולה<\/strong>: פעולה ורפלקציה, תיאוריה ופרקטיקה, בשיתוף הנוגעים בדבר. זהו מעגל של איסוף נתונים, פעולה והערכה, עם משוב תמידי, מנקודת המבט של הפונה ובהתחשב בהקשרים האקולוגיים. הפסיכולוג הוא \"המוציא אל הפועל\" של מחקר הפעולה.<\/li>\n<li><strong>פעולה אחת חושפת מעגלים נוספים<\/strong>: בדוגמת ההשתלמות על לקויות למידה, סדנה שנבנתה סביב הצגת מקרים שינתה את תפיסת המורים, וגם חשפה בעיות ברכיב הארגוני וברכיב המנגנוני (איך נבחרות השתלמויות, מה תפקיד הצוות המקצועי). כך נוצר אבחון \"חסכוני\" בלי אבחון מקדים.<\/li>\n<li><strong>החזרת מידע מה\"תחום העיוור\" ממצבת את הפסיכולוג<\/strong>: כשהפסיכולוג מחזיר למנהל מידע שידוע לאחרים במערכת אבל לא למנהל, הוא נעשה דמות \"משמעותית ופרואקטיבית\".<\/li>\n<li><strong>מריאקטיבי לפרואקטיבי<\/strong>: המטלות שבחובה (אבחונים, ועדות השמה ושילוב, הערכות להישארות בגן) מושכות את הפסיכולוג לעמדה ריאקטיבית, שמובילה לשחיקה. הרחבת \"טווח ההשהיה\" בין הגירוי לתגובה, בעזרת שאלות כמו \"לשם מה? מהי המטרה? האם אפשר אחרת? מה חסר?\", מאפשרת בחירה ודיאלוג.<\/li>\n<li><strong>שלוש רמות מידע ופערים ביניהן<\/strong>: הצהרות (הרצוי), התרחשויות (המצוי) ופירושים. כשיש הלימה בין המצוי לרצוי והסכמה בין המוצהר למתפרש, יש תרבות ארגונית חזקה. איתור פערים הוא כלי אבחון, ומצמצום הפערים נגזרת התערבות.<\/li>\n<li><strong>המנהל הוא המפתח<\/strong>: לפסיכולוג יתרון ייחודי, כי הוא \"בו-זמנית יועץ פנים וחוץ, צופה ומשתתף\". לפי פופר יש ליועץ החיצוני שלושה יתרונות מול המנהל: פרספקטיבת זמן, פרספקטיבת הסתכלות, ומענה ל\"בדידות המנהל\". לכן חשוב לקיים מפגשים קבועים עם המנהל גם בלי שותפים נוספים.<\/li>\n<li><strong>ייחוס משמעות חיובית<\/strong>: לכל דפוס חוזר יש תפקיד במערכת. רק אחרי שמכירים בתועלת שלו (\"מזכים\" את האדם), ואחר כך מציגים את המחיר שלו, אפשר לחפש חלופות. בדוגמה של המנהלת \"הסמכותית\", ההכרה בהישגיה פתחה דרך לדון במחיר שהצוות משלם.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>מערכת<\/strong> – אוסף פריטים בעלי יחסי גומלין, בסדר פנימי מסוים, שמשפיעים זה על זה ופועלים למטרה משותפת. היא מורכבת מתת-מערכות תלויות זו בזו. שינוי בתת-מערכת אחת משנה את האחרות. המערכת שואפת לשיווי משקל, אבל חייבת לקיים יחסי גומלין עם סביבתה (סמואל 1996; לוי 2000).<\/li>\n<li><strong>מודל המערכות הפתוחות<\/strong> – תשומות, תהליכים ותפוקות, עם היזון חוזר מעגלי (Katz &amp; Kahn, 1966).<\/li>\n<li><strong>המפה המערכתית (פוקס, 1995)<\/strong> – שישה רכיבים של בית הספר שמקיימים קשרי גומלין. ראו פירוט בהמשך.<\/li>\n<li><strong>SWOT<\/strong> – ניתוח עוצמות, חולשות, הזדמנויות ואיומים, שמשמש לריכוז המידע על בית הספר ולגזירת אסטרטגיות.<\/li>\n<li><strong>אבחון תוך כדי תנועה<\/strong> – למידה על המערכת מתוך הפעולות השוטפות, ההכרחיות והמוסכמות, במקום אבחון מקדים נפרד.<\/li>\n<li><strong>מחקר פעולה (Action Research)<\/strong> – תהליך מעגלי שמשלב לימוד שיטתי של הבעיה עם המאמצים לפתור אותה. לפי לוין, פעולה, מחקר והכשרה הם \"משולש אחד\".<\/li>\n<li><strong>פרואקטיביות<\/strong> – לפי קובי (1995): נשיאה באחריות, בחירת התגובה והרחבת \"טווח ההשהיה\" בין גירוי לתגובה. ההפך הוא ריאקטיביות, שמונעת מדאגה ומ\"רצון לרצות\".<\/li>\n<li><strong>משוב (לפי סנג'י)<\/strong> – לא רק החזרת מידע, אלא \"זרימה הדדית של השפעה\". מעקב אחר מעגלי ההשפעה מאפשר לזהות דפוסים חוזרים.<\/li>\n<li><strong>ארגון לומד<\/strong> – ארגון שאנשיו משפרים כל הזמן את יכולתם ליצור את התוצאות שהם שואפים אליהן. הוא אינו רואה בבעיות דבר שמישהו גרם, אלא שואל איך הפעולות עצמן יוצרות אותן (סנג'י, 1997).<\/li>\n<li><strong>רמת ההצהרות / ההתרחשויות / הפירושים<\/strong> – שלוש רמות מידע: מה מוצהר (הרצוי), מה קורה בפועל (המצוי), ואיך האנשים מפרשים ותופסים.<\/li>\n<li><strong>תוצר גלוי<\/strong> – \"כל מה שרואים, שומעים וחשים בארגון\", מצורת הלבוש ועד סגנון הדיבור, כולל המבנה הפיזי ו\"ניירת\" ומסמכי חזון (Schein).<\/li>\n<li><strong>שאלות ממקום אחר<\/strong> – \"שאלות היכרות\" שמכוונות לכוחות, לערכים ולמשאלות שלא מומשו, ועוברות מ-doing ל-being.<\/li>\n<li><strong>ייחוס משמעות חיובית (Positive Connotation)<\/strong> – הצגת התפקיד החיובי שדפוס ממלא בשימור שיווי המשקל של המערכת, לפני הצגת המחיר שלו והחיפוש אחר חלופות (Palazzoli-Selvini ואחרים, 1978; בר סמך, 2001).<\/li>\n<\/ul>","models":"<p><strong>א. המפה המערכתית של בית הספר (פוקס, 1995): שישה רכיבים<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>רכיב<\/th>\n<th>תוכן<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>אידיאולוגי<\/td>\n<td>החזון החינוכי, המטרות<\/td>\n<\/tr>\n<tr>\n<td>אנושי<\/td>\n<td>המשאבים האנושיים: מינהלה, צוות מורים, תלמידים והורים<\/td>\n<\/tr>\n<tr>\n<td>פדגוגי<\/td>\n<td>תהליכי הלמידה וההוראה<\/td>\n<\/tr>\n<tr>\n<td>ארגוני<\/td>\n<td>ארגון משאבי הלמידה האנושיים והחומריים, חלוקת תפקידים וסמכויות, ארגון הזמן, ההדרכה וקשרי החוץ<\/td>\n<\/tr>\n<tr>\n<td>המרחב והחומר<\/td>\n<td>המשאבים הפיזיים והטכנולוגיים<\/td>\n<\/tr>\n<tr>\n<td>המנגנונים<\/td>\n<td>דרכי ההפעלה של המנגנונים: הפסקות ומסדרים, ישיבות צוות, אירועים ייחודיים<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>אבחון הרכיבים ויחסי הגומלין ביניהם יוצר מפה מערכתית, שהיא בסיס להתערבות ולתהליכי שינוי.<\/p>\n<p><strong>ב. ניתוח SWOT<\/strong>: עוצמות (Strengths) וחולשות (Weaknesses) פנימיות, והזדמנויות (Opportunities) ואיומים (Threats) מהסביבה. אסטרטגיות אפשריות: להשתמש בחוזקות כדי לקדם הזדמנויות, להתגבר על חולשות, או למנף חוזקות מול חולשות.<\/p>\n<p><strong>ג. מתי לערוך אבחון כולל ומתי לא (לפי לוי, 2000)<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>אבחון כולל ומובנה מתאים כאשר...<\/th>\n<th>שינוי בלי אבחון מקדים מתאים כאשר...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>הארגון אינו יודע להגדיר במדויק את בעיותיו<\/td>\n<td>הארגון מודע היטב לבעיותיו<\/td>\n<\/tr>\n<tr>\n<td>יש זמן ומשאבים<\/td>\n<td>הארגון במשבר ואין לו משאבים לאבחן<\/td>\n<\/tr>\n<tr>\n<td>מטרות השינוי אינן ברורות או אינן מוסכמות<\/td>\n<td>הארגון בחר מראש פתרונות מוכרים, \"פתרונות מדף\"<\/td>\n<\/tr>\n<tr>\n<td>הארגון יציב יחסית ואינו משתנה בזמן האבחון<\/td>\n<td>הארגון גמיש, משתנה עם הזמן, או עובר שינויים מהירים (אז רצוי לאבחן \"תוך כדי תנועה\")<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>מול הגישה הזו מוצגת הגישה של בטלר (1987): אבחון בית ספר כפרויקט נפרד, עם התחלה וסוף ברורים, כשלב הראשון בעבודת הפסיכולוג, ובדרך כלל לא יותר מחודש. אנגלרט מציינת שאבחון כזה נעשה היום בעיקר בידי פרקטיקנטים בתואר שני או פסיכולוגים בתחילת דרכם, שיש להם פרק זמן מוגדר לכך.<\/p>\n<p><strong>ד. כלים לאיסוף מידע על המערכת<\/strong>: בדיקת נתונים קיימים (מיצ\"ב, דוחות לפיקוח), תוצאות סקרים, תצפיות פסיביות ואקטיביות, ראיונות יחידים וקבוצות, ושאלונים (בטלר 1987; לוי 2000; רז 2004).<\/p>\n<p><strong>ה. שלוש רמות מידע ובדיקת פערים<\/strong><\/p>\n<ol>\n<li><strong>רמת ההצהרות<\/strong>: מהם הערכים, הנורמות וההתנהגויות המוצהרים? מהו המצב הרצוי?<\/li>\n<li><strong>רמת ההתרחשויות<\/strong>: אילו נורמות ודפוסי התנהגות קיימים בפועל? מהו המצב המצוי?<\/li>\n<li><strong>רמת הפירושים<\/strong>: מהם הפירושים והתפיסות של האנשים?<\/li>\n<\/ol>\n<p>אחר כך בודקים את ההלימה בין המוצהר למתרחש ואת ההסכמה בין המוצהר למתפרש. הלימה והסכמה מעידות על תרבות ארגונית חזקה. הפסיכולוג מאתר פערים ובוחן עם המנהל והצוות איך לצמצם אותם.<\/p>\n<p><strong>ו. ניתוח תוצרים גלויים ומסמכים: שאלות לדוגמה מתוך המאמר<\/strong><\/p>\n<ul>\n<li><em>\"מדיניות הדלת הפתוחה\"<\/em>: האם הדלת פתוחה במידה שווה להורים, למורים ולתלמידים? האם היא פתוחה תמיד, כך שאי אפשר להיפגש ברצף, או שצריך לקבוע מראש? מי קובע, וכמה זמן מראש? האם חדר המנהלת נגיש ומרכזי, או שצריך לעבור דרך המזכירות? האם המזכירה \"מסננת\"? האם פירוש המנהלת זהה לפירוש הצוות, ההורים והתלמידים? (ויש גם מחיר: המורים חשופים יותר לפיקוח.)<\/li>\n<li><em>\"ההצלחה היא נחלת הכלל\"<\/em>: האם בית הספר הגדיר מהי הצלחה? למי ההגדרה ידועה? מה קורה בעת כישלון, \"האם הוא יתום\"? האם יש מקום להחמצות?<\/li>\n<li><em>תעודת המחצית של נועם<\/em>: דף מחשב מקופל, בלי סמל בית הספר, עם הערות ממוחשבות מ\"מאגר המשפטים\" של המנב\"ס. הוא חשף פער בין ההצהרה ש\"ציונים הם לא הכול\" ושיש קשר אישי בין מורים לתלמידים לבין המתרחש בפועל. ההתערבות כללה בחינה מחודשת של הערכים ושל ההסכמה עליהם, ושינוי של התעודה: דף איכותי, תמונה וסמליל של בית הספר, והערכה אישית של המחנכת בהיבטים חברתיים וערכיים. ההתערבות נגעה ברכיב האידיאולוגי, הארגוני והפדגוגי.<\/li>\n<\/ul>\n<p><strong>ז. שלושת היתרונות של יועץ חיצוני בעבודה עם המנהל (פופר, 1991)<\/strong><\/p>\n<ol>\n<li><strong>פרספקטיבת הזמן<\/strong>: המנהל עסוק בטווח הקצר ובלחצים, ולא תמיד פנוי לחשוב על הטווח הארוך.<\/li>\n<li><strong>פרספקטיבת ההסתכלות<\/strong>: המנהל הוא חלק מהמערכת, ולכן קשה לו להתבונן בה מהמרחק הראוי.<\/li>\n<li><strong>בדידות המנהל<\/strong>: היא מחריפה במשבר ובהחלטות מכריעות. המנהל צריך להיראות חזק, וקרבת-יתר לעובדים יכולה להיתפס כמניפולציה. הפסיכולוג, שאינו שייך לארגון, יכול להיות \"עמית לגיטימי להרהורים, למחשבות ולספקות\".<\/li>\n<\/ol>\n<p><strong>ח. כלים למפגש האישי בין המנהל לפסיכולוג<\/strong><\/p>\n<ol>\n<li><strong>שאלות ממקום אחר<\/strong>, לדוגמה: מהו ההישג שאתה גאה בו מאוד? מה ממלא אותך? מה נותן לך תחושה של סיפוק וחיוניות? מה גורם לך לקום בבוקר במלוא המרץ? מה גורם לך ליטול סיכונים? מהו האתגר הגדול שאתה עומד בפניו היום? וגם שאלה שמכוונת ליעד: \"כשאת חושבת על סוף השנה, על טקס סיום השנה, את ניצבת על הבמה קוראת בשמות התלמידים, מה ייתן לך תחושה שהצלחת עם הכיתה הזאת?\" (\"התחל כשהסוף בדעתך\", קובי).<\/li>\n<li><strong>ייחוס משמעות חיובית<\/strong>, בארבעה צעדים: (1) לזהות את הדפוס החוזר ואת תפקידו במערכת; (2) \"לזכות\" את האדם ולהציג את ההיבט החיובי של הדפוס לשימור שיווי המשקל; (3) להראות את המחיר, כלומר שמשהדפוס הוטמע, המערכת כבר אינה משרתת את האדם ביעילות; (4) לחפש יחד חלופות יעילות יותר לאותה מטרה, ולפעמים להעביר תפקידים לחלקים אחרים במערכת.<\/li>\n<\/ol>\n<p><strong>ט. הרחבת טווח ההשהיה: שאלות מפתח<\/strong>: לשם מה? מהי המטרה? האם אפשר להגיע למטרות האלה בדרך אחרת? מה חסר?<\/p>\n<p><strong>י. הדוגמאות במאמר (לשימוש בהוראה)<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>דוגמה<\/th>\n<th>מה קרה<\/th>\n<th>העיקרון<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>השתלמות על לקויות למידה בחטיבת ביניים<\/td>\n<td>סדנה עם הצגת מקרים שינתה את המשגת המורים (\"לא יודע\" הפך ל\"מתקשה לקלוט מידע בערוץ השמיעתי\") וחשפה בעיות בבחירת ההשתלמויות ובתפקיד הצוות המקצועי<\/td>\n<td>אבחון והתערבות תוך כדי תנועה. פעולה אחת פותחת מעגלים נוספים<\/td>\n<\/tr>\n<tr>\n<td>פסיכולוגית חדשה ומנהלת שמבקשת \"דיווח על מקרים\"<\/td>\n<td>הפסיכולוגית פתחה את המפגש ב\"סוגיה שחזרה על עצמה בשכבות ד' ו-ה' – האם את מעוניינת לשמוע?\"<\/td>\n<td>מעבר מעמדה ריאקטיבית לפרואקטיבית, והחזרת מידע מה\"תחום העיוור\"<\/td>\n<\/tr>\n<tr>\n<td>\"מדיניות הדלת הפתוחה\" ו\"ההצלחה היא נחלת הכלל\"<\/td>\n<td>ניתוח מסמכי חזון<\/td>\n<td>אבחון פערים בין המוצהר לבין המתרחש והמתפרש<\/td>\n<\/tr>\n<tr>\n<td>תעודת המחצית של נועם (כיתה ח')<\/td>\n<td>התעודה חשפה פער ערכי<\/td>\n<td>חשיפת פער כאמצעי אבחון וכפתח להתערבות<\/td>\n<\/tr>\n<tr>\n<td>כיתה ו' אלימה (\"נמאס לי כבר מהכיתה הזאת\")<\/td>\n<td>שאלה על טקס סוף השנה הובילה לניסוח יעד חדש: להנחיל ערך של נתינה<\/td>\n<td>שאלות ממקום אחר והגדרת יעד<\/td>\n<\/tr>\n<tr>\n<td>דינה, המנהלת ה\"סמכותית\"<\/td>\n<td>אחרי מנהלת \"מתייחסת\" (Reddin, 1970), ההישגים עלו ושביעות רצון המורים ירדה<\/td>\n<td>ייחוס משמעות חיובית: \"זיכוי\" על ההישגים, ואז הצגת המחיר<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","practice":"<ul>\n<li><strong>אל תחכה/י לאבחון מערכת מלא<\/strong> לפני שאת/ה מתחיל/ה לפעול. בחר/י פעולה שוטפת ומוסכמת (ישיבה, סדנה, ועדה) והתייחס/י אליה גם כמקור מידע. אחרי כל פעולה, כדאי לרשום אילו מעגלים נוספים היא חשפה.<\/li>\n<li><strong>בנה/י מפה מערכתית מצטברת<\/strong> לפי ששת הרכיבים של פוקס, וסכם/י בטבלת SWOT. המפה יכולה לשמש בסיס לשיחת החוזה ולשיחות ההמשך עם המנהל.<\/li>\n<li><strong>קרא/י את \"הניירת\"<\/strong>: מסמכי חזון, תעודות, מכתבים להורים, לוחות מודעות. השווה/י בין ההצהרה, ההתרחשות והפירוש, וחפש/י פערים שאפשר להחזיר למנהל בעדינות.<\/li>\n<li><strong>קבע/י מפגש קבוע עם המנהל ביחידות<\/strong>, ולא רק בפורום עם היועצת או הצוות הטיפולי. אפשר להשתמש בו לחשיבה לטווח ארוך, לא רק לדיווח על מקרים.<\/li>\n<li><strong>כשמבקשים ממך \"דיווח\"<\/strong>, אפשר להוסיף נקודת מבט מערכתית: דפוס שחוזר בין המקרים, ומה הוא מלמד על בית הספר.<\/li>\n<li><strong>לפני שאת/ה נענה/ית לדרישה<\/strong> (עוד אבחון, עוד ועדה), עצור/י ושאל/י: לשם מה? מה המטרה? אפשר אחרת? מה חסר? כך מרחיבים את \"טווח ההשהיה\" ומפחיתים שחיקה.<\/li>\n<li><strong>מול מנהל \"תקוע\" או מתוסכל<\/strong>, נסה/י שאלה שמכוונת ליעד ולערכים (\"מה ייתן לך תחושה שהצלחת?\") במקום לחפש עוד פעולה לפתרון הבעיה.<\/li>\n<li><strong>כשאת/ה מזהה דפוס ניהולי בעייתי<\/strong>, התחל/י בהכרה בתפקידו ובהישגיו, ורק אחר כך הצג/י את המחיר. אחרת סביר שתיתקל/י בחסימה.<\/li>\n<\/ul>","questions":"<ol>\n<li>איזה \"סיפור מסתתר\" עומד מאחורי בעיה שחוזרת בבית הספר שלי? אילו מעגלים נוספים היא משפיעה עליהם?<\/li>\n<li>מתי אני פועל/ת באופן ריאקטיבי (\"רצון לרצות\"), ומתי באופן פרואקטיבי? מה יעזור לי להרחיב את טווח ההשהיה?<\/li>\n<li>אילו פערים זיהיתי בין מה שבית הספר מצהיר לבין מה שקורה בפועל? איך ומתי כדאי להחזיר אותם למנהל?<\/li>\n<li>האם יש לי מפגש אישי קבוע עם המנהל? מה עולה בו, ומה לא עולה?<\/li>\n<li>איזה דפוס במערכת אני מתקשה \"לזכות\"? מה התפקיד החיובי שהוא ממלא, ומה המחיר שלו?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"המפתח לראיית המציאות בצורה מערכתית הוא בראיית מעגלי השפעה ולא קווים ישרים. זהו הצעד הראשון להיחלצות מהלך המחשבה התגובתי הנובע באופן בלתי נמנע מחשיבה קווית\" (סנג'י, 1997, עמ' 85; המוטו של המאמר).<\/li>\n<li>\"המגירות במשרדי ארגונים רבים מלאות חוברות נאות ועבות כרס המסכמות אבחון של בעיות בארגון שלא נעשה בהן שימוש.\"<\/li>\n<li>\"חשיפת פער היא אמצעי אבחון המאפשר גיבוש התערבות מערכתית.\"<\/li>\n<li>\"לפסיכולוג החינוכי יתרונות על פני כל דמות אחרת במערכת בשל היותו בו-זמנית יועץ פנים וחוץ, צופה ומשתתף.\"<\/li>\n<\/ul>"},"level":"שנה א' (מתאים מאוד לכניסה לבית ספר חדש ולעבודה עם מנהל). מתאים גם לשנים ב'-ג'.","stype":"מאמר (פרק בספר)","tldr":"אנגלרט טוענת שבמציאות של היום רק לעיתים רחוקות יכול פסיכולוג חינוכי לערוך אבחון מערכת כולל ומובנה, כפרויקט נפרד, כשהוא נכנס לבית ספר. שעותיו מוגבלות, והתרבות הארגונית מחפשת פתרונות מיידיים. לכן היא מציעה לשלב אבחון והתערבות \"תוך כדי תנועה\": לבצע את…","search":"אנגלרט טוענת שבמציאות של היום רק לעיתים רחוקות יכול פסיכולוג חינוכי לערוך אבחון מערכת כולל ומובנה, כפרויקט נפרד, כשהוא נכנס לבית ספר. שעותיו מוגבלות, והתרבות הארגונית מחפשת פתרונות מיידיים. לכן היא מציעה לשלב אבחון והתערבות \"תוך כדי תנועה\": לבצע את הפעולות השוטפות וההכרחיות, ובאותו זמן ללמוד מהן על המערכת, בתהליך מעגלי שדומה ל\"מחקר פעולה\". המאמר מגדיר את בית הספר כמערכת פתוחה (תשומות, תהליכים, תפוקות), מציג את המפה המערכתית של פוקס (שישה רכיבים) ואת ניתוח SWOT, ודן בשאלה מתי אבחון כולל באמת נחוץ. אחר כך הוא מציג כלים ללמידה על המערכת: שלוש רמות מידע (הצהרות, התרחשויות, פירושים), חשיפת פערים בין המוצהר למתרחש, וניתוח תוצרים גלויים ומסמכים. החלק האחרון עוסק במנהל כ\"מפתח\" לאבחון ולהתערבות, ובמעבר של הפסיכולוג מעמדה ריאקטיבית לעמדה פרואקטיבית, באמצעות הרחבת \"טווח ההשהיה\", \"שאלות ממקום אחר\" וייחוס משמעות חיובית. לאורך המאמר משולבות דוגמאות מהשטח. חשיבה מעגלית ולא קווית: עבודה מערכתית אינה מוגדרת, והחשיבה שלה מעגלית. בכל מעגל צריך לחפש את \"הסיפור המסתתר\" שיוצר דפוס חוזר, שמקדם, מאט או מחמיר את המצב ומשפיע על מעגלים נוספים. בית הספר כמערכת פתוחה: תשומות (תלמידים, מורים, משאבים, טכנולוגיות; למנהל שליטה מוגבלת עליהן), תהליכים (חלקם מעוגנים בתקנות משרד החינוך; שלבי הביצוע עמומים וארוכים), ותפוקות (ציונים, בגרות, למידה עצמאית; מלבד הציונים קשה להגדיר ולמדוד אותן), עם היזון חוזר מעגלי ביניהן. אבחון כולל אינו תמיד הכרחי: לפי לוי (2000), אבחון כולל מתאים לארגון שאינו יודע להגדיר את בעיותיו, שיש לו זמן ומשאבים, שמטרות השינוי בו אינן ברורות או מוסכמות, או שהוא יציב. אבל אבחון הוא \"מנוף חלש לשינוי\", ו\"המגירות במשרדי ארגונים רבים מלאות חוברות... שלא נעשה בהן שימוש\". שיקול עלות-תועלת: בעיות שמשותפות לבתי ספר רבים (משמעת, אלימות, תקשורת, עבודת צוות, ניהול כיתה) לרוב אינן מצריכות אבחון כולל. צריך להבין ולהגדיר את הבעיה, ואפשר לאמץ \"פתרונות מדף\" (למשל \"התפריט הבסיסי\") ולהתאים אותם לבית הספר. את רוב הזמן כדאי להשקיע בהכשרה, בתרגול ובהטמעה. מחקר פעולה: פעולה ורפלקציה, תיאוריה ופרקטיקה, בשיתוף הנוגעים בדבר. זהו מעגל של איסוף נתונים, פעולה והערכה, עם משוב תמידי, מנקודת המבט של הפונה ובהתחשב בהקשרים האקולוגיים. הפסיכולוג הוא \"המוציא אל הפועל\" של מחקר הפעולה. פעולה אחת חושפת מעגלים נוספים: בדוגמת ההשתלמות על לקויות למידה, סדנה שנבנתה סביב הצגת מקרים שינתה את תפיסת המורים, וגם חשפה בעיות ברכיב הארגוני וברכיב המנגנוני (איך נבחרות השתלמויות, מה תפקיד הצוות המקצועי). כך נוצר אבחון \"חסכוני\" בלי אבחון מקדים. החזרת מידע מה\"תחום העיוור\" ממצבת את הפסיכולוג: כשהפסיכולוג מחזיר למנהל מידע שידוע לאחרים במערכת אבל לא למנהל, הוא נעשה דמות \"משמעותית ופרואקטיבית\". מריאקטיבי לפרואקטיבי: המטלות שבחובה (אבחונים, ועדות השמה ושילוב, הערכות להישארות בגן) מושכות את הפסיכולוג לעמדה ריאקטיבית, שמובילה לשחיקה. הרחבת \"טווח ההשהיה\" בין הגירוי לתגובה, בעזרת שאלות כמו \"לשם מה? מהי המטרה? האם אפשר אחרת? מה חסר?\", מאפשרת בחירה ודיאלוג. שלוש רמות מידע ופערים ביניהן: הצהרות (הרצוי), התרחשויות (המצוי) ופירושים. כשיש הלימה בין המצוי לרצוי והסכמה בין המוצהר למתפרש, יש תרבות ארגונית חזקה. איתור פערים הוא כלי אבחון, ומצמצום הפערים נגזרת התערבות. המנהל הוא המפתח: לפסיכולוג יתרון ייחודי, כי הוא \"בו-זמנית יועץ פנים וחוץ, צופה ומשתתף\". לפי פופר יש ליועץ החיצוני שלושה יתרונות מול המנהל: פרספקטיבת זמן, פרספקטיבת הסתכלות, ומענה ל\"בדידות המנהל\". לכן חשוב לקיים מפגשים קבועים עם המנהל גם בלי שותפים נוספים. ייחוס משמעות חיובית: לכל דפוס חוזר יש תפקיד במערכת. רק אחרי שמכירים בתועלת שלו (\"מזכים\" את האדם), ואחר כך מציגים את המחיר שלו, אפשר לחפש חלופות. בדוגמה של המנהלת \"הסמכותית\", ההכרה בהישגיה פתחה דרך לדון במחיר שהצוות משלם. מערכת – אוסף פריטים בעלי יחסי גומלין, בסדר פנימי מסוים, שמשפיעים זה על זה ופועלים למטרה משותפת. היא מורכבת מתת-מערכות תלויות זו בזו. שינוי בתת-מערכת אחת משנה את האחרות. המערכת שואפת לשיווי משקל, אבל חייבת לקיים יחסי גומלין עם סביבתה (סמואל 1996; לוי 2000). מודל המערכות הפתוחות – תשומות, תהליכים ותפוקות, עם היזון חוזר מעגלי (Katz & Kahn, 1966). המפה המערכתית (פוקס, 1995) – שישה רכיבים של בית הספר שמקיימים קשרי גומלין. ראו פירוט בהמשך. SWOT – ניתוח עוצמות, חולשות, הזדמנויות ואיומים, שמשמש לריכוז המידע על בית הספר ולגזירת אסטרטגיות. אבחון תוך כדי תנועה – למידה על המערכת מתוך הפעולות השוטפות, ההכרחיות והמוסכמות, במקום אבחון מקדים נפרד. מחקר פעולה (Action Research) – תהליך מעגלי שמשלב לימוד שיטתי של הבעיה עם המאמצים לפתור אותה. לפי לוין, פעולה, מחקר והכשרה הם \"משולש אחד\". פרואקטיביות – לפי קובי (1995): נשיאה באחריות, בחירת התגובה והרחבת \"טווח ההשהיה\" בין גירוי לתגובה. ההפך הוא ריאקטיביות, שמונעת מדאגה ומ\"רצון לרצות\". משוב (לפי סנג'י) – לא רק החזרת מידע, אלא \"זרימה הדדית של השפעה\". מעקב אחר מעגלי ההשפעה מאפשר לזהות דפוסים חוזרים. ארגון לומד – ארגון שאנשיו משפרים כל הזמן את יכולתם ליצור את התוצאות שהם שואפים אליהן. הוא אינו רואה בבעיות דבר שמישהו גרם, אלא שואל איך הפעולות עצמן יוצרות אותן (סנג'י, 1997). רמת ההצהרות / ההתרחשויות / הפירושים – שלוש רמות מידע: מה מוצהר (הרצוי), מה קורה בפועל (המצוי), ואיך האנשים מפרשים ותופסים. תוצר גלוי – \"כל מה שרואים, שומעים וחשים בארגון\", מצורת הלבוש ועד סגנון הדיבור, כולל המבנה הפיזי ו\"ניירת\" ומסמכי חזון (Schein). שאלות ממקום אחר – \"שאלות היכרות\" שמכוונות לכוחות, לערכים ולמשאלות שלא מומשו, ועוברות מ-doing ל-being. ייחוס משמעות חיובית (Positive Connotation) – הצגת התפקיד החיובי שדפוס ממלא בשימור שיווי המשקל של המערכת, לפני הצגת המחיר שלו והחיפוש אחר חלופות (Palazzoli-Selvini ואחרים, 1978; בר סמך, 2001)."},{"id":"alon2023","title":"רציפות בחרו\"ם (חשיבה, רגש, מעשה)","authors":"משה אלון, דורית גרוס ודן קונפינו","year":"2023","cite":"אלון, מ', גרוס, ד' וקונפינו, ד' (21 באוגוסט 2023). רציפות בחרו\"ם (חשיבה, רגש, מעשה): מודל עבודה והכשרה להתערבויות מיידיות במצבי חירום במסגרות חינוך. פסיכולוגיה עברית.","url":"https://www.hebpsy.net/articles.asp?id=4619","kind":"article","desc":null,"urlLabel":"המאמר באתר פסיכולוגיה עברית","file":{"orig":"רציפות בחירום משה אלון.doc","ext":"doc","pdf":"alon2023.pdf","pages":20,"bytes":403248},"placements":[["s1","emerg"]],"extra":false,"ref":"אלון ועמיתיו 2023","inFolder":true,"srcTitle":"רציפות בחרו\"ם (חשיבה, רגש, מעשה) – מודל עבודה והכשרה להתערבויות מיידיות במצבי חירום במסגרות חינוך","secs":{"abstract":"<p>המחברים טוענים שלמרות הידע שנצבר חסר בשטח מודל מארגן וממוקד, בנוי כפרוטוקול, שיעזור לפסיכולוג החינוכי בשעת חירום ובהכשרתו – בייחוד משום שהתחום אינו נלמד בתואר השני ויש ללמוד ולהתנסות בו בהתמחות. הם מציגים את מודל \"רציפות בחרו\"ם\" – חשיבה, רגש, מעשה (knowing, being, doing) – המבוסס על גישת הרצפים (עומר ואלון, 1994), הנשענת על ויניקוט: לאדם שמונה רצפים (הכרתי-חשיבתי, בין-אישי, תפקיד, היסטורי, דימויים, אמונות, פיזיולוגי, רגשי), ואירוע טראומטי קוטע את \"קו החיים\"; ההתערבות נועדה לחבר מחדש את החלקים לשלם. ברמת הפרט המודל נשען על עקרונות הקמ\"צ (קרבה, מיידיות, ציפייה) ועל הגישה האסטרטגית של מילטון אריקסון (נרמול סימפטומים, מסגור מחדש, הצטרפות והובלה, \"להיות עם\"). את גישת הרצפים הם מרחיבים לארגון: בית הספר או הגן כ\"שלם\" שנשבר, וההתערבות מחברת מחדש בהדרגה את \"איבריו\" – הצל\"ח, חדר המורים, התלמידים וההורים – לפי תרשים זרימה עם ציר זמן: היערכות מקדימה, צל\"ח בראשות המנהל, תדריך חדר מורים, כניסת המורים לכיתות, מכתב להורים, דיבוב מורים כשבוע לאחר האירוע והפקת לקחים. המנהל הוא הדמות המרכזית, והצוות הטיפולי מסייע לו. פרק נפרד מוקדש להתאמות לגני ילדים, ופרק אחר להכשרה ולשמירה על המתערבים מפני שחיקת חמלה וטראומטיזציה משנית.<\/p>","ideas":"<ul>\n<li>התערבות בחירום היא חלק מהגדרת התפקיד והזהות של הפסיכולוג החינוכי – לא תוספת; המיצוב שלו מחייב אותו לפעול גם ברמת מערכת החינוך והקהילה, להבדיל מדיסציפלינות הממוקדות בפרט.<\/li>\n<li>המודל פועל בשלוש רמות – חשיבה (ידע ותיאוריה), רגש (ההוויה הפנימית של הנפגעים וגם של המתערבים) ומעשה – וההכשרה צריכה להתייחס לשלושתן.<\/li>\n<li>בהתערבות מיידית \"הקו המנחה הוא עשייה\": ההתייחסות לרגש באה אחרי ההתערבות הראשונה; לא לוקחים אנמנזה, כי התגובות הן לרוב אופני התמודדות נורמליים למצב לא נורמלי ולא תולדה של ההיסטוריה האישית.<\/li>\n<li>אירוע טראומטי קוטע את רצף הקיום (\"קו החיים\") של הפרט ושל הארגון; מטרת ההתערבות היא לחבר מחדש את החלקים לשלם ולהשיב תחושת רציפות. רוב האנשים יתאוששו בכוחות עצמם ובסביבתם הטבעית, חלקם אף יצמחו; מעטים יזדקקו לסיוע קצר, ומיעוט קטן לסיוע ארוך טווח.<\/li>\n<li>עקרונות הקמ\"צ (קרבה, מיידיות, ציפייה) מותאמים למערכת: מקום ההתערבות יכול להיות בית הספר או הגן גם כשהאירוע התרחש הרחק משם; ההתערבות עשויה להתחיל גם מחוץ לשעות הפעילות; ומדגישים את זמניות החריגה מהשגרה.<\/li>\n<li>\"להיות עם\" – הנוכחות עצמה היא המענה; למורים חשוב לומר שגם בלי \"המילים הנכונות\" חוויית הביחד מחברת את החלקים לשלם. המתערב \"משאיל\" לנפגע את ה\"שלם\" שלו באופן זמני.<\/li>\n<li>הפסיכולוג תומך \"ליד\" – משאב לצוות ולמעגלים התומכים הטבעיים; רק כש\"אין ברירה\" הוא נכנס ל\"חזית\". מי שנכנסים לכיתות הם דמויות מוכרות לתלמידים, והפסיכולוג נכנס לכיתה רק במצב אקוטי מאוד.<\/li>\n<li>המנהל הוא הדמות המרכזית – \"מחזיק את השלם הבית ספרי\" בשגרה ובחירום – ותפקיד הצוות הטיפולי (כולל הפסיכולוג) הוא לסייע לו להוביל. בכל מפגש: התייחסות קצרה לרגשות המשותפים בלי לפתוח שיח רגשי כללי, ועיקר – עובדות, שמייצבות ומצמצמות שמועות.<\/li>\n<li>יש לזהות \"מעגלי פגיעות\" (כיתה, חברים, שכבה, אחים, מסגרות קודמות, תנועת נוער וכו') ולהתייחס לכל אחד מהם.<\/li>\n<li>הפסיכולוג צריך לצפות להתנגדות מנהלים – להיערכות המקדימה, לדיבוב המורים ולהפקת הלקחים – מתוך הכחשה והדחקה, ולעודד את קיומם (דיבוב – לקבוע מראש ולקיים ללא קשר למספר המשתתפים).<\/li>\n<li>בגן: שיח קצר ומותאם גיל הוא הכרחי (הימנעות מחלישה את הילדים ומעוררת פנטזיות מפחידות); שיקום המוגנות חשוב מהעובדות המלאות; הגננת זקוקה לתמיכה רבה בשל בדידותה ולהתמודדות עם התנגדות הורים.<\/li>\n<li>שמירה על המתערבים: התערבות בשניים, גיבוי מדריך/מנהל למתמחה, אפשרות החלפה, התייעצות ודיבוב, ורגישות למצבים אישיים (הורות, היריון, אבל). מעורבות בחירום גם מחזקת את אמון הצוות בפסיכולוג בשגרה.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>רציפות בחרו\"ם<\/strong> – מודל עבודה והכשרה להתערבות מיידית בחירום במסגרות חינוך, בשלוש רמות: חשיבה, רגש, מעשה (knowing, being, doing).<\/li>\n<li><strong>גישת הרצפים<\/strong> – תיאוריה (עומר ואלון, 1994) הנשענת על ויניקוט, שלפיה האדם חי לאורך שמונה רצפים, ואירוע טראומטי קוטע אותם.<\/li>\n<li><strong>קו החיים<\/strong> – החוויה של קיום רציף ושלם מהעבר דרך ההווה אל העתיד; בטראומה נוצר בו פער/חלל.<\/li>\n<li><strong>השלם (הפרטי/הארגוני)<\/strong> – תחושת השלמות של הפרט או של בית הספר/הגן, המתרסקת באירוע ושיש לחבר מחדש.<\/li>\n<li><strong>עקרונות הקמ\"צ<\/strong> – קרבה (LOCATION), מיידיות (TIMING), ציפייה (EXPECTANCY); מקורם בטיפול בתגובות קרב (מלחמת העולם הראשונה).<\/li>\n<li><strong>הגישה האסטרטגית<\/strong> – עקרונות התערבות בהשראת מילטון אריקסון: לגיטימציה לסימפטומים, מסגור מחדש, אי-עיסוק בעבר, הצטרפות והובלה, חיפוש נקודת אור, הסתייעות בסביבה הטבעית, \"להיות עם\".<\/li>\n<li><strong>הצטרפות והובלה (Pacing and Leading)<\/strong> – \"לרדת למקום הנמוך\" שבו נמצא הנפגע, להתאים קצב וטון, ומשם להוביל אותו מעלה.<\/li>\n<li><strong>מסגור מחדש (Reframing)<\/strong> – הגדרת הסימפטום כביטוי לבריאות (למשל, חולשה כחוזק); היעדר סימפטומים לחלוטין עשוי אף להדאיג.<\/li>\n<li><strong>\"להיות עם\"<\/strong> – נוכחות פיזית ורגשית לצד הנפגע, ללא חובה ב\"מילים חכמות\".<\/li>\n<li><strong>מעגלי פגיעות<\/strong> – הקבוצות שהאירוע מטלטל ומרחיק מהשלם (טמיר וחיימוב, 2005), הדורשות התייחסות ייעודית.<\/li>\n<li><strong>צל\"ח (צוות לשעת חירום)<\/strong> – צוות שנקבע מראש לפי חוזר המנכ\"ל, לרוב מקביל לצוות ההנהלה, המתכנס ראשון בראשות המנהל.<\/li>\n<li><strong>ערכת חירום<\/strong> – ערכה מוכנה מראש (רשימות, חומרים להנהלה ולמורים, מסמך עקרונות שיחה לפי גיל, מכתב גנרי להורים); לפסיכולוג – \"ערכת חירום אישית\".<\/li>\n<li><strong>דיבוב<\/strong> – כינוס לאוורור חוויות ולמתן מקום לרמת הרגש (לכיתות בסיכון, ולחדר המורים כשבוע לאחר האירוע).<\/li>\n<li><strong>שחיקת חמלה / טראומטיזציה משנית<\/strong> – סיכון למתערבים, המחייב שמירה מובנית עליהם.<\/li>\n<\/ul>","models":"<h3>1. שלוש רמות המודל והשלכותיהן להכשרה<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>רמה<\/th>\n<th>מה כוללת<\/th>\n<th>דגשים בהכשרת מתמחים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>חשיבה (knowing) – ידע, הבנה, תפיסה<\/td>\n<td>תיאוריות על מצבי חירום (גישת הרצפים), עקרונות התערבות בפרט ובמערכת לטווח גילאים רחב (רצפים, קמ\"צ)<\/td>\n<td>למידה, הפנמה ותרגול; אימוץ התפיסה שהתערבות בחירום היא חלק מהתפקיד והזהות<\/td>\n<\/tr>\n<tr>\n<td>רגש (being) – ההוויה הפנימית<\/td>\n<td>חרדה טבעית מול מוות ואיום קיומי, במיוחד כשמעורבים ילדים (\"הפרת הבטחה\" שהעולם מוגן) – גם אצל הפסיכולוגים<\/td>\n<td>פרק ייחודי לעולם הרגשי של המתערבים; מקום לדיון, ויכוח ואי-הסכמה; סימולציות, אסוציאציות, מטפורות והעלאת זיכרונות מחירום אישי – כמשאב<\/td>\n<\/tr>\n<tr>\n<td>מעשה (doing)<\/td>\n<td>ההבדלים בין התערבות מיידית לטיפול מתמשך בקליניקה; גם המלצות להימנעות מעשייה<\/td>\n<td>תרגול; עשייה קודם, רגש אחר כך; לא לוקחים אנמנזה<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>עקרונות לשמירה על המתערבים<\/strong>: התערבות בשניים; גיבוי וליווי מדריך או מנהל למתמחה; אפשרות החלפה בהתערבות ממושכת; מקום להתייעצות; השתתפות בדיבוב לאחר ההתערבות; רגישות למצב אישי פגיע (הורות, היריון, אבל ועוד).<\/p>\n<h3>2. שמונת הרצפים (גישת הרצפים)<\/h3>\n<ol>\n<li><strong>הכרתי-חשיבתי<\/strong> – תפיסת חוקיות קבועה בחיים ובטבע וסיבה-תוצאה צפויים (האוטובוס מגיע ליעד, המתג מדליק את האור, תכניות מתממשות).<\/li>\n<li><strong>יחסים בין-אישיים<\/strong> – תחושת המשכיות וקביעות במערכות היחסים ויכולת להמשיך \"מאותו מקום\" ללא הפתעות.<\/li>\n<li><strong>תפקיד<\/strong> – התפקידים המשפחתיים, התעסוקתיים והחברתיים כמסגרת המגדירה את האדם לאורך זמן.<\/li>\n<li><strong>היסטורי<\/strong> – חוויית עצמי רציפה ו\"קו חיים\" שלם מעבר לעתיד.<\/li>\n<li><strong>דימויים<\/strong> – מאגר הדימויים בשפה (למשל החיים כ\"דרך\") המאפשר לארגן ולהגדיר התנסויות.<\/li>\n<li><strong>אמונות<\/strong> – \"תיאוריה פרטית\" (דת, ערכים, תפיסת חיים, ואף תיאוריה פסיכולוגית) לפירוש החיים, כולל מקרי קיצון (\"ה' נתן, ה' לקח\").<\/li>\n<li><strong>פיזיולוגי<\/strong> – דימוי גוף רציף והנחה ששינויים יהיו הדרגתיים ותואמי גיל.<\/li>\n<li><strong>רגשי<\/strong> – רפרטואר תגובות רגשיות מוכר לאדם ולסביבתו.<\/li>\n<\/ol>\n<h3>3. עקרונות הקמ\"צ – לפרט ולמערכת<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>עיקרון<\/th>\n<th>ברמת הפרט<\/th>\n<th>התאמה למסגרת חינוך<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>קרבה (LOCATION)<\/td>\n<td>סיוע במקום האירוע, בקרבתו או במקום משמעותי הקשור אליו<\/td>\n<td>מקום ההתערבות יכול להיות בית הספר או כיתת הגן גם אם האירוע התרחש הרחק או מחוץ לשעות הלימודים<\/td>\n<\/tr>\n<tr>\n<td>מיידיות (TIMING)<\/td>\n<td>הזמן קריטי; מה שלא נעשה בסמיכות קשה או לא נכון לעשות אחר כך (כמו עזרה ראשונה)<\/td>\n<td>ייתכן שההתערבות תתחיל מחוץ לשעות הפעילות (למשל פגיעה בערב שבת – תלמידים מגיעים לבית הספר בשבת או במוצ\"ש לצורך הכלה)<\/td>\n<\/tr>\n<tr>\n<td>ציפייה (EXPECTANCY)<\/td>\n<td>התגובות המיידיות (בכי, תנועתיות, בלבול, כעס, הלם, ייאוש) תואמות וזמניות; להעביר בעדינות מסר של זמניות וחזרה לרצף (\"היום, תלמידים, לא נלמד כרגיל\")<\/td>\n<td>הדגשת הזמניות של התגובות ושל הסטייה מהשגרה<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>4. עקרונות הגישה האסטרטגית בהתערבות מיידית עם פרט<\/h3>\n<ol>\n<li>סימפטומים והתנהגויות חריגות – נורמליים בסמוך לאירוע; ללא שיפוט ערכי/פסיכולוגי; לגיטימציה לרוב התגובות.<\/li>\n<li>הסימפטומים מייצגים בריאות; מסגור מחדש של השלילי לחיובי (חולשה היא חוזק).<\/li>\n<li>בהתערבות המיידית אין משמעות לעבר הנפגע.<\/li>\n<li>הצטרפות והובלה – לרדת למקום הנמוך, להתאים קצב וטון, ומשם להוביל.<\/li>\n<li>בכל מצב יש נקודת אור, מוצא ופתרון – להאמין בכך ולחפש עם הנפגע.<\/li>\n<li>הסתייעות בסביבה הטבעית (משפחה, חברים, שכנים, כיתה, מורים); הפסיכולוג תומך \"ליד\", ורק באין ברירה ב\"חזית\".<\/li>\n<li>\"להיות עם\" – נוכחות פיזית בשטח לצד הנפגע, כמו בניחום אבלים.<\/li>\n<\/ol>\n<h3>5. הצעות מעשיות במסגרת חינוך (למשל באובדן)<\/h3>\n<ol>\n<li><strong>טקסים ופינות זיכרון<\/strong> – ביטוי סמלי לרגשות ואפיק לעשייה אקטיבית; תוחמים זמן ומקום לכאב ומאפשרים \"להשאיר אותו בפיקדון\" עד הטקס הבא.<\/li>\n<li><strong>הלוויות וניחום אבלים<\/strong> – ביקורי חברים ואנשי צוות מחברים מחדש את הנתק; בתיכון לעודד ביקורים (בעיקר לתלמידים שאינם במרכז החברתי); מסביבות כיתה ו' ואילך – לאפשר השתתפות בהלוויות בהסכמת ההורים ולעיתים בליווים.<\/li>\n<li><strong>משאבים תרבותיים ודתיים<\/strong> – למשל פרקי תהלים ותפילות בבתי ספר יהודיים-דתיים.<\/li>\n<\/ol>\n<h3>6. תרשים 1 – סדר העבודה באירועי חירום בית ספריים<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>ציר זמן (טור שמאלי)<\/th>\n<th>שלב מרכזי<\/th>\n<th>שלב ביניים אופציונלי (טור ימני)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>לפני האירוע<\/td>\n<td>היערכות מקדימה של מערכת החינוך וכוחות מסייעים (הרכבת הצל\"ח)<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>—<\/td>\n<td><strong>אירוע חירום<\/strong><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>סמוך להתרחשות האירוע<\/td>\n<td>פגישת צוות לשעת חירום בראשות המנהל – לחבירה, הערכה ותכנון ההתמודדות<\/td>\n<td>כינוס צוות טיפולי, רווחה, ברה\"נ ותחילת הערכת מצב וכיווני פעולה<\/td>\n<\/tr>\n<tr>\n<td>עד 24 שעות מהאירוע ולפני חידוש הלימודים<\/td>\n<td>כינוס של חדר המורים לתדריך<\/td>\n<td>תדריכים ספציפיים למורי כיתות בסיכון<\/td>\n<\/tr>\n<tr>\n<td>מיד עם חידוש הלימודים<\/td>\n<td>כניסת המורים לכל הכיתות<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>בטווח של יומיים–שלושה מחידוש הלימודים<\/td>\n<td>–<\/td>\n<td>דיבוב לכיתות בסיכון<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>שליחת מכתב מההנהלה להורי התלמידים<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>בעיקרון לאחר כל שלב בתכנית; בשלב זה שילוב הרווחה במשפחה ובקהילות<\/td>\n<td>הערכת מצב צוות טיפולי והנהלה<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>כשבוע לאחר האירוע<\/td>\n<td>דיבוב לכל חדר המורים<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>שבוע מהאירוע ואילך<\/td>\n<td>המשך סיוע לכיתות, לפרטים ולמשפחותיהם<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>שבועיים והלאה<\/td>\n<td>התערבות מערכתית הנובעת מהחירום<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>7. הפרוטוקול המפורט – תפקיד המנהל והפסיכולוג בכל שלב<\/h3>\n<p><strong>שלב מקדים – היערכות (לפני האירוע)<\/strong><\/p>\n<ul>\n<li>הכנה ממשית של הצוות: הרצאות, מתן ידע ותרגול בסימולציות.<\/li>\n<li>קביעת חברי הצל\"ח ותפקידיהם (לפי חוזר מנכ\"ל נוהלי שעת חירום, 2019).<\/li>\n<li>\"ערכת חירום\" במקום ידוע ובהפצה דיגיטלית להנהלה: רשימות עדכניות, חומרים להנהלה ולמורים (כולל מסמך עקרונות שיחה עם תלמידים לפי גיל), מכתב גנרי להורים. לפסיכולוג – \"ערכת חירום אישית\".<\/li>\n<li>לצפות להתנגדות מנהלים מתוך הכחשה והדחקה; במקרים אלה – להנכיח את נושא החירום דרך התמודדות עם מקרים שגרתיים שיש בהם אלמנט חירום. ההכנה מרגיעה ונוטעת ביטחון בטווח הרחוק.<\/li>\n<\/ul>\n<p><strong>שלב 1 – כינוס הצל\"ח<\/strong> (במהירות האפשרית, גם וירטואלית)<\/p>\n<ul>\n<li>המנהל מוביל: הערכת מצב, זיהוי מעגלי פגיעות, חשיבה על המסרים לחדר המורים וחשיבה ראשונית על השלבים הבאים.<\/li>\n<li>הפסיכולוג: בקשר עם המנהל, שומע מה קרה ומציע הצעות ראשונות; מתאם עם היועץ וחולק משימות; <strong>מתמחה – יוצר קשר עם המדריך האישי ואולי גם עם מנהל השפ\"ח<\/strong>; מעריך את היקף ההתערבות הנדרש מהשפ\"ח ומבקש תגבור; מעלה נושאים ולוקח משימות. לפי הצורך – כינוס צוות טיפולי וקשר עם רווחה/בריאות הנפש.<\/li>\n<li>רמת המעשה דומיננטית: המנהל פותח בהתייחסות קצרה לרגש המשותף (\"לאחד מתלמידנו קרה אירוע קשה ביותר וכולנו אבלים וכואבים...\") אך לא מזמין שיח רגשי; העיקר – עובדות ובירורן (מכנה משותף, התמודדות עם שמועות, החזרת שליטה).<\/li>\n<\/ul>\n<p><strong>שלב 2 – כינוס חדר המורים לתדריך<\/strong><\/p>\n<ul>\n<li>היועץ והפסיכולוג, לצד המנהל, נותנים הנחיות לכניסה הראשונה לכיתות ומסבירים עקרונות שיח; מחלקים מסמך עקרונות שיחה לפי גיל.<\/li>\n<li>המנהל פותח במילים על המצב הרגשי אך לא פותח שיח רגשי; מציעים שיחת תמיכה למורים הזקוקים לה.<\/li>\n<li>לשאוף שכל המורים ייכנסו לכיתות; למורה שמתקשה – \"מה התנאים הנדרשים לך כדי להצליח להיכנס לכיתה?\", \"מי מהצוות תרצה שיצטרף אליך?\".<\/li>\n<\/ul>\n<p><strong>שלב 3 – כניסת המורים לכל הכיתות<\/strong><\/p>\n<ul>\n<li>השיעור הראשון מוקדש לשיח, ללא גבולות זמן מוגדרים מראש (חלק מהשיעור, כולו או שיעורים נוספים); הסבר על השינוי הזמני בסדר היום ועל החזרה לשגרה.<\/li>\n<li>שיחה מותאמת גיל לפי הנחיות הצוות הטיפולי; הדגשת \"להיות עם\"; עיסוק בעובדות (חושף חרדות והיקף שמועות); הפסיכולוג מסייע לזהות סימנים מדאיגים.<\/li>\n<li>בהפסקה שאחרי השיעור השני – התכנסות בחדר המורים לדיווח: הכלת הצוות וזיהוי מעגלי פגיעות ומוקדים חדשים.<\/li>\n<\/ul>\n<p><strong>שלב 4 – מכתב מההנהלה להורים<\/strong><\/p>\n<ul>\n<li>מסר מרכזי: בית הספר נפגע, אך הוא בשליטה ושומר על הילדים.<\/li>\n<li>תוכן: מה קרה, מה נעשה, מה צפוי; לשים לב לתגובות חריגות; אפשרות להתייעץ עם המורים, היועץ והפסיכולוג. מכתב גנרי מוכן מראש בערכה; הפצה במכתב, דוא\"ל או מסרון, בחתימת המנהל.<\/li>\n<\/ul>\n<p><strong>שלב 5 – דיבוב חדר המורים (עד שבוע מהאירוע) והפקת לקחים<\/strong><\/p>\n<ul>\n<li>אוורור חוויות ומתן מקום לרמת הרגש; השארת התהליך \"לא סגור\" עלולה להקשות.<\/li>\n<li>מנהלים נוטים לוותר (בעיקר באירועי מוות) – לקבוע מראש ולקיים ללא קשר למספר המשתתפים.<\/li>\n<li>בתום ההתמודדות – למידה והפקת לקחים: האירוע \"מצלם\" את מצב בית הספר והיחסים בו, והזדמנות לבחור תחום לחיזוק (תכנית/השתלמות ארוכת טווח).<\/li>\n<\/ul>\n<h3>8. התאמות להתערבות בחירום בגני ילדים<\/h3>\n<ul>\n<li>החרדה של המבוגרים נובעת מתחושת \"הפרת הבטחה\" לילדים שהעולם בטוח; לכן גננות נתקלות לעיתים בהתנגדות הורים לשיח.<\/li>\n<li>יש לנהל שיח עם ילדים בכל גיל: ילדים חשים שקרה משהו ומדברים ביניהם; הימנעות מחלישה, משדרת חוסר אמון במבוגרים ועלולה להוביל לאי-שקט,
