רמים חינוכיים; העברת סוללת מבחנים; ציינון; ניתוח ממצאים; כתיבת דו\"חות; מתן משוב; השתתפות בוועדות השמה ושילוב. העומס גדל בתקופות מסוימות בשנה.<\/p>\n<h3>4. שימושים חלופיים במשאבי הפסיכולוג (הצעה היפותטית)<\/h3>\n<p>להקצות לאוכלוסייה עם קשיים תפקודיים משאבים לפי חלקה באוכלוסייה הכללית, ואת השאר להפנות ל:<\/p>\n<ul>\n<li>ייעוץ לצוותי ניהול ולמנהלים;<\/li>\n<li>מעורבות בחשיבה על דילמות חינוכיות;<\/li>\n<li>קידום חשיבה פסיכולוגית בקרב כל הצוות וההורים;<\/li>\n<li>מעורבות ויוזמה בשינויים ארגוניים;<\/li>\n<li>עבודה ממשקית עם גורמים טיפוליים (מתי\"א, אופק חדש, שירותים אזוריים).<\/li>\n<\/ul>\n<h3>5. שלוש זוויות מבט ארגוניות – השוואה ודוגמאות<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>זווית<\/th>\n<th>הנחת יסוד<\/th>\n<th>תפקיד הפסיכולוג וכלים<\/th>\n<th>דוגמאות מהמאמר<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>אסטרטגית-פונקציונלית<\/strong><\/td>\n<td>ארגון שואף ליעילות מרבית, ומבני העבודה הם הכלי לביצוע המשימות<\/td>\n<td>לבחון תחומי אחריות, מבני עבודה (צוות ניהול, ישיבות בין-מקצועיות, ועדות, הדרכות) והתאמתם למטרות<\/td>\n<td>(א) <strong>\"אופק חדש\"<\/strong>: המורים לא מבינים מה העבודה הפרטנית. הפסיכולוג מציע צוות רב-מקצועי (נציגי מחנכים, מנהלת, יועצת, פסיכולוג) שיגדיר את העבודה ואת הצרכים, כמו הדרכה למורים ונושאים להשתלמויות. (ב) <strong>מורה בכיתת חנ\"מ לילדים עם הפרעות התנהגות<\/strong> חוששת מהתפרצויות תוקפניות. מגדירים איש צוות נוסף, או כמה אנשי צוות זמינים, לאירועים קיצוניים. כך נוצרים \"גב של גוף סמכותי\" ותחושת העצמה. (ג) <strong>בחינת יעילות המבנים<\/strong>: תדירות ישיבות ההנהלה מול העומס, בהירות משימתית, והאם הצוות ייצוגי או רק \"נוח למנהל\". בצוות \"נוח\" ההתנגדויות נשארות בחוץ, וההטמעה קשה.<\/td>\n<\/tr>\n<tr>\n<td><strong>פסיכואנליטית<\/strong><\/td>\n<td>כשהמערכת לא עומדת במשימות הראשוניות שלה, מאחורי זה חרדה לא מודעת<\/td>\n<td>הקאונטר-טרנספרנס של הפסיכולוג משמש כלי הבנה. ההתערבות: שיקוף ופירוש. ובמכיוון לקאניאני: הכרה בתשוקות כמקור חיוניות<\/td>\n<td>(א) <strong>חטיבת ביניים עם אלימות<\/strong>: סגנית המנהל תוקפת את הפסיכולוג, והוא משיב בתקיפות שאיננה אופיינית לו. <strong>תהליך מקביל<\/strong>: מי שלא מוגן הופך לבריון, ושיתוק המנהל נתפס כ\"אוזלת יד\". אפשר לשתף את הצוות בחוויה ולפרש את הקשר בין שיתוק לתוקפנות, או לעבוד עם המנהל על מקורות החרדה שלו. (ב) <strong>בית ספר לחנ\"מ<\/strong>: מטפלת מבקשת להנחות קבוצת הדרכה עם חברה, וההנהלה מבקרת אותה. הפסיכולוגית מציעה לראות ב\"איווי\" כלי הנעה. התוצאה: המנחים מציעים קבוצות לפי תחומי העניין שלהם, והצוות בוחר ביניהן. מבנה שהיה על סף ביטול קיבל חיוניות, והצוות נעשה רגיש יותר להעדפות הילדים.<\/td>\n<\/tr>\n<tr>\n<td><strong>פוסט-מודרנית<\/strong><\/td>\n<td>ערעור על אקסיומות: עליונות המומחה, ההנחה שבכירות היא ידע, וסדר היררכי. חשיפת אינטרסים של בעלי כוח<\/td>\n<td>לפתוח מבני עבודה, להפעיל ביקורת חברתית ולהתאגד מקצועית<\/td>\n<td>(א) <strong>פתיחת פורומים<\/strong>: לפרסם מראש את נושאי ישיבות ההנהלה ולאפשר לאנשי צוות פחות בכירים להצטרף או להעביר עמדה. ההחלטה מתי לעשות זאת היא דיפרנציאלית, כי יש מתח עם אקונומיות. (ב) <strong>אינטליגנציה כציר מיון<\/strong>: לפי Gergen (2003), המגזר המשכיל קובע את המדד ואת דרכי המדידה. חלופות כמו יוזמה, העזה, רגישות בין-אישית וגמישות לא נמדדות. (ג) <strong>קשב וריכוז<\/strong>: הפך למרכזי בתנאים של כ-40 ילדים בכיתה ולחץ להישגים. השאלה היא אם לקבל את תפקיד המאבחן. (ד) <strong>פרסום אחוזי בגרות בשלטי חוצות<\/strong> הוביל להנשרה ולוועדות להוצאת ילדים, ופסיכולוגים נותנים להן \"גושפנקא אתית\". אחת הפסיכולוגיות הגיבה ב\"שביתה איטלקית\". האפשרויות שמוצעות: סירוב קולקטיבי של כל פסיכולוגי השפ\"ח, או שיתוף פעולה רק אם בית הספר הוכיח מאמצי שילוב ותמיכה. (ה) <strong>אופק חדש<\/strong>: לשאול אם הקשר בהוראה פרטנית משחזר את דפוס הכיתה, או שיש בו הזדמנות למימד דיאלוגי. השפ\"ח יכול ליזום השתלמויות או ועדות בין-מקצועיות אזוריות.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>6. שפ\"ח שדרות – רצף הכניסה והבנייה (מתוך הסיפור בגוף ראשון)<\/h3>\n<ol>\n<li><strong>מצב פתיחה (פברואר 2008)<\/strong>:\n        - המנהלת נכנסה כממלאת מקום, אחרי תקופה ארוכה בלי מנהל.\n        - דימוי פנימי של חוסר אונים, ודימוי חיצוני של ארגון ש\"לא ניתן לתת בו אמון\".\n        - בצוות היו שתי פסיכולוגיות ותיקות, ולצידן \"צוות מסייע\" של שפ\"י: תשעה פרילנסרים שטיפלו בנפגעי חרדה, לא היו כפופים לשפ\"ח ונקראו על שם הפסיכולוג האחראי.\n        - הייתה הצפה של ארגוני סיוע, עם כפילויות ובלבול. הקריאה ששמעה מכל עבר: \"תעשו לנו סדר!\".<\/li>\n<li><strong>הכרעה<\/strong>: לבנות מודל עבודה חדש במקום להמשיך את הקודם. הבלבול נתפס כהזדמנות לשינוי.<\/li>\n<li><strong>צעדים ראשונים<\/strong>:\n        - יום עיון לכל המטפלים בעיר, כ-60 משתתפים, כדי שיראו את עצמם כקשורים זה לזה ולא כמתחרים.\n        - הכפפת ה\"צוות המסייע\" לשפ\"ח.\n        - הגדרת השפ\"ח כ\"שער כניסה\" לתחום הטיפולי, יחד עם הפסיכולוג המחוזי.\n        - הצטרפות לצוות העירוני המוביל.<\/li>\n<li><strong>היבטים לחיזוק<\/strong>:\n        - (א) מעמד השפ\"ח והקול הפסיכולוגי בפורומים עירוניים: צוות תמיכה טיפולית עירוני וצוות ילדים עירוני, שבהם השפ\"ח מרכז ומאגם משאבים.\n        - (ב) שותפויות עם גורמים עירוניים.\n        - (ג) מקום לשפ\"ח גם במצבי חירום, שקודם היו בעיקר בידי עמותות.<\/li>\n<li><strong>גיוס<\/strong>:\n        - בהתחלה: קשיים בגלל המצב הביטחוני והקפאת תקנים (\"אין איוש, ויש הרבה ייאוש\").\n        - שיתופי פעולה עם אשלים, הג'וינט, הקואליציה הישראלית לטראומה ומרכז חוסן הפיצו את השמועה על שפ\"ח מתחדש.\n        - משרד החינוך והעירייה תמכו: שיפוץ המבנה, תמריצים ותנאים מיוחדים.\n        - עד סוף יוני אוישו כל המשרות: פסיכולוג לכל בית ספר ולכל גן.<\/li>\n<li><strong>שני פסיכולוגים בכל מערכת<\/strong> (חינוכי ומסייע):\n        - עלו דילמות של תחומי אחריות, חלוקת עבודה, טיפול במשבר וטראומה, גבולות ופיצולים.\n        - מנהלי בתי הספר החלו לחלק בעצמם: המסייע אחראי על \"חדר שלווה\" ועניינים רגשיים, והחינוכי על שילוב והשמה. המנהלת ראתה בזה סכנה לצמצום התפקיד ולעצם קיום השפ\"ח.\n        - הפתרון שמתמסד: מפגשים תקופתיים של שני הצוותים.\n        - נשארה אי-נוחות אתית מהעדפת הצוות המסייע על פני מטפלים אחרים.<\/li>\n<li><strong>\"מודל עבודה חדש\"<\/strong> (נבנה עם היועצת הבכירה בעיר, ביום דיון משותף ליועצות ולפסיכולוגים, ואושר בפיקוח):\n        - המדינה ונציגיה צריכים לסנן את הארגונים שמציעים טיפול, להתאים בין ילדים לסוגי תמיכה ולעקוב אחר האיכות.\n        - <strong>פורום תמיכה בכל בית ספר<\/strong>: מנהל, פסיכולוג חינוכי, יועצת ומורת שילוב. הוא מתכנס באופן קבוע למיפוי צרכים, לבחינת כניסה של גורמים טיפוליים, להפניית מקרים חדשים ולמעקב אחר התערבויות.\n        - <strong>צוות מורחב פעם ברבעון<\/strong>, עם כל הגורמים המטפלים בבית הספר.\n        - הקשיים בהטמעה: הפסיכולוגים מתקשים ליזום את המבנה, והמערכות מתנגדות.<\/li>\n<li><strong>בקרה על אבחונים<\/strong>:\n        - בדיקה עם היועצת הבכירה העלתה ש<strong>כ-70%<\/strong> מהתלמידים אובחנו, רובם בידי גורמים פרטיים. אחוזי הזכאות לבגרות עלו, אבל נשאלה השאלה אם אבחנת-יתר משדרת \"התמסכנות\".\n        - <strong>בכל בית ספר<\/strong>: ועדה של הפסיכולוג והיועצת בוחנת את נחיצות האבחון. רשימה סופית, עם שאלוני הורים וויתור על סודיות, עוברת לאישור מנהלת השפ\"ח. בלי האישור העירייה לא מממנת אבחון פרטי.\n        - <strong>ביסודי<\/strong> (בשיתוף הפיקוח): צמצום משמעותי של מספר המועמדים לאבחון והפניית הכסף לטיפול בלקויות הלמידה עצמן, כמו הוראה מתקנת וטיפולים פרא-רפואיים.<\/li>\n<li><strong>תוכניות עבודה<\/strong>: תוכנית של המנהלת, ותוכנית אישית לכל פסיכולוג בבית הספר שלו (ראו סעיף 7).<\/li>\n<li><strong>מסגרות למידה<\/strong>: סמינר שנתי לכל הצוות על חשיבה ארגונית, ומפגשים אישיים שבועיים או דו-שבועיים עם המנהלת שמכוונים ומעודדים. בצד זה נשמר מרחב לכל פסיכולוג למצוא את \"המידה הנכונה עבורו\".<\/li>\n<\/ol>\n<h3>7. תוכנית העבודה של מנהלת שפ\"ח שדרות (שני מוקדים)<\/h3>\n<p><strong>יעדים צוותיים:<\/strong><\/p>\n<ol>\n<li>חיזוק הלכידות של צוות השפ\"ח, שרובו עובדים חדשים בלי היסטוריה משותפת.<\/li>\n<li>בניית צוות שיתן שירות אופטימלי בתנאים הייחודיים של המקום. כל פסיכולוג יפתח תחום התמחות משלו, כך ששיתוף הפעולה ביניהם יענה על מגוון רחב של צרכים.<\/li>\n<li>פיתוח מנהיגות.<\/li>\n<li>גיבוש תפיסת עבודה פסיכולוגית-חינוכית שמכירה בחשיבות של שיתוף פעולה בין-מקצועי ושל עבודה עם גורמי חוץ.<\/li>\n<li>הכשרת הצוות לעבודה עם תלמידים וצוותים בחירום מתמשך.<\/li>\n<\/ol>\n<p><strong>יעדים מערכתיים-ארגוניים:<\/strong><\/p>\n<ol>\n<li>המשך חקירה וזיהוי של הצרכים הפסיכולוגיים והארגוניים-חינוכיים של מערכת החינוך בשדרות.<\/li>\n<li>המשך עבודה מתוך תפיסת השפ\"ח כ\"שער כניסה\" לכל השירותים הטיפוליים והתמיכתיים.<\/li>\n<li>ביסוס מבני עבודה בית-ספריים שבהם עובדי שפ\"י (פסיכולוגים ויועצים) אחראים על המערך הטיפולי הבית-ספרי (\"מודל עבודה חדש\").<\/li>\n<li>פסיכולוג בית הספר כשותף לפיתוח ולליווי של תוכניות טיפוליות וחינוכיות ייחודיות (אבחונים חיצוניים, הפגות וכד').<\/li>\n<li>המשך עבודה ופיתוח תוכניות משותפות עם מרכז חוסן.<\/li>\n<li>שפ\"ח כ\"חדר מצב\" בזמן הסלמה.<\/li>\n<\/ol>\n<p><strong>דוגמה לתוכנית עבודה אישית בתיכון המקיף:<\/strong><\/p>\n<ul>\n<li><strong>הממצא<\/strong>: בימי הסלמה הנוכחות במקיף הייתה עד 40%, לעומת כ-80% בעיר.<\/li>\n<li><strong>הבירור<\/strong>: הפסיכולוג פנה ליועצות, להנהלה, למחנכים ולתלמידים, ומצא תחושת שייכות נמוכה.<\/li>\n<li><strong>התוכנית<\/strong>: עבודה על תחושת השייכות, עם יעדים אופרטיביים שנקבעו עם היועצים.<\/li>\n<\/ul>\n<h3>8. מקרה ההשמה בכיתת ל\"ל – הפסיכולוג כ\"מפרש\" של תהליכים לא מודעים<\/h3>\n<p><strong>השתלשלות האירועים:<\/strong><\/p>\n<ol>\n<li>ועדת השמה החליטה על כיתת ל\"ל, וההחלטה אושרה שנתיים ברצף. התלמידה הגיעה בכל זאת לכיתתה הקודמת. ההורים לא הגיעו לוועדה ולא ערערו.<\/li>\n<li>הפסיכולוגית בדקה את העניין ביוזמתה ופנתה לקב\"ס. הוחלט להפעיל את החוק.<\/li>\n<li>ההורים השאירו את הילדה בבית יותר מחודשיים. אגף החינוך החזיר אותה לכיתה רגילה \"לטובת הילדה\", בלי להתייעץ עם השפ\"ח.<\/li>\n<\/ol>\n<p><strong>הניתוח בצוות השפ\"ח:<\/strong><\/p>\n<ul>\n<li>ההורים למדו שלמערכת יש \"נקודת שבירה\": השארת הילדה בבית.<\/li>\n<li>המערכת חששה מתביעות ומהשמצה, בעיר קטנה שבה אנשי החינוך פוגשים את ההורים במכולת ובבית הכנסת.<\/li>\n<li>\"תפוח האדמה הלוהט\" עבר מגורם לגורם, ו\"טובת הילדה\" כבר לא הייתה על הפרק.<\/li>\n<\/ul>\n<p><strong>ההצעות:<\/strong><\/p>\n<ul>\n<li>הפסיכולוג \"מעז לדבר על החרדות בקול רם\" ומפרש את מה שקרה.<\/li>\n<li>הוא לא מסתפק בפירוש ומציע חלופות ארגוניות: התאגדות במקום פיצול, ואסרטיביות ועקביות כשיש ביטחון בשיקול הדעת המקצועי.<\/li>\n<li>או שהוא לא מזדהה עם אף צד, ומזמין את הצדדים להמשך שיח, כדי שאף צד לא יממש את כוונותיו בכוח.<\/li>\n<\/ul>\n<h3>9. ההיערכות הפנים-שפ\"חית שמוצעת בדיון<\/h3>\n<ul>\n<li>השתלמויות מתאימות.<\/li>\n<li>דגשים חדשים בהדרכה ובמבחני ההתמחות.<\/li>\n<li>מבני עבודה משתנים לפי תחומי עניין, למשל צוותים זמניים הטרוגניים שמתארגנים סביב דילמה משותפת.<\/li>\n<li>עידוד מחקר בסוגיות מערכתיות.<\/li>\n<li>ליווי השלב שאחרי המחקר: תרגום התובנות לכיווני עבודה עם המערכת, מתוך הכרה בכוחותיה ובמגבלותיה.<\/li>\n<li>עדכון ה-textbook לבחינת ההתמחות, \"עבודה פסיכולוגית בבית הספר\" (1987), שלא השתנה שני עשורים. היום הוא מייצג את המבט הארגוני בעיקר במאמר של רות בטלר על אבחון בית הספר.<\/li>\n<\/ul>","practice":"<ul>\n<li><strong>לבנות תוכנית עבודה אישית לכל בית ספר.<\/strong> היא צריכה לבטא אמירה מקצועית על חלוקת הזמן ועל מוקדי העבודה, ולא רק להיענות לפניות. לפי המאמר, הדימוי של השפ\"ח כלפי חוץ נבנה מהדימוי שכל פסיכולוג יוצר בבית הספר שלו.<\/li>\n<li><strong>לבדוק את חלוקת הזמן בפועל.<\/strong> כמה מהזמן הולך לאבחון, להשמה ולקונסולטציה על ילדים \"בקצה\", וכמה לתרבות הבית-ספרית, לצוות הניהול ולדילמות שנוגעות לכל הילדים? כדאי לשאול אם זו בחירה מודעת.<\/li>\n<li><strong>להסתכל על מבני העבודה בבית הספר<\/strong> (צוות ניהול, ישיבות בין-מקצועיות, ועדות): הרכב, תדירות ובהירות משימה. כשמזהים פער אפשר להציע מבנה. לדוגמה, צוות רב-מקצועי לסוגיה חדשה, או כמה אנשי צוות זמינים כגיבוי למורה מול התפרצויות.<\/li>\n<li><strong>להשתמש בתגובות הרגשיות שלי בישיבות כמידע.<\/strong> תגובה לא אופיינית, כמו תוקפנות, יכולה להצביע על תהליך מקביל במערכת. את התובנה כדאי לעבד בהדרכה לפני שמשתפים בה את הצוות.<\/li>\n<li><strong>לא להסתפק בפירוש.<\/strong> כשהמערכת מוצפת חרדה, אפשר לצרף לפירוש הצעה אסטרטגית שמווסתת את החרדה, כמו צוות חשיבה משותף להורים ולמורים או פורום קבוע. כך \"תופרים\" המלצות למערכת הספציפית במקום להמליץ המלצות \"סטנדרטיות\".<\/li>\n<li><strong>לשאול על כל הפניה לאבחון מה הנחיצות שלה ומה ייעשה עם הממצאים.<\/strong> כדאי לשים לב לסכנה של אבחנת-יתר ושל מסר של \"התמסכנות\". ובאופן רחב יותר: לשאול לשירות מי עומדת הפרקטיקה, למשל כשמשתתפים בוועדות הוצאה או השמה.<\/li>\n<li><strong>להכיר את מערך הגורמים הטיפוליים בבית הספר ובעיר<\/strong> (מתי\"א, מרכזי חוסן, עמותות) ולהציע תכלול, כמו \"פורום תמיכה\", במקום לעבוד \"בד' אמות\". בעבודה עם עוד פסיכולוג באותה מערכת חשוב לסכם גבולות וחלוקת עבודה ולא לסמוך רק על רצון טוב.<\/li>\n<\/ul>","questions":"<ol>\n<li>בבית הספר שלי, האם אני פועל/ת יותר כ\"פסיכולוג של המתקשים\" או כ\"פסיכולוג של מערכת החינוך\"? איך זה בא לידי ביטוי בחלוקת הזמן שלי, ומה הייתי רוצה לשנות?<\/li>\n<li>איזה מבנה עבודה בבית הספר (צוות ניהול, ועדה, ישיבה בין-מקצועית) הייתי בוחן/ת דרך העדשה האסטרטגית? ואיזו חרדה לא מודעת אולי פועלת בו לפי העדשה הפסיכואנליטית?<\/li>\n<li>האם נקלעתי למצב שבו חשתי שהנוכחות שלי מעניקה \"גושפנקא אתית\" למהלך שאני לא שלם/ה איתו? מה היו האפשרויות שלי כפרט, ומה האפשרויות של השפ\"ח כארגון?<\/li>\n<li>מתי שילוב של פירוש עם הצעה אסטרטגית \"מרגיעה\" מפרה את העבודה, ומתי הוא מונע מפגש עם החרדה (עקרון ה\"הינזרות\")?<\/li>\n<li>איך אני מבחין/ה בין \"פסיכולוגיה\" ל\"טסטולוגיה\" בעבודה האבחונית שלי? מה הופך אבחון לכלי עבודה משמעותי לצוות ולא רק למסמך?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"הפכנו מפסיכולוגים לטסטולוגים\". מובא בשם אחד הפסיכולוגים (עמ' 18).<\/li>\n<li>\"נראה כי ברבות השנים הפסיכולוגיה החינוכית מיקמה את עצמה לא כפסיכולוגיה של מערכת החינוך אלה כפסיכולוגיה של המתקשים בחינוך ובהסתגלות.\" (עמ' 19)<\/li>\n<li>\"האם מישהו יכול להגיד לי מה התפקיד של פסיכולוג-חינוכי?\". מובא בשם אחת ממנהלות השפ\"חים (עמ' 19).<\/li>\n<li>\"ביקורות פוסט-מודרניות מצביעות על כך שהימנעות אינה פעולה ניטראלית! אלא משחקת לידיהם של בעלי הכוח.\" (עמ' 23)<\/li>\n<\/ul>"},"level":"שנים ב'-ג'. החלקים על ניהול שפ\"ח, תוכניות עבודה והתאגדות מקצועית מתאימים גם לשנה ד'.","stype":"מאמר. משלב עיון ביקורתי עם תיאור מקרה ניהולי בגוף ראשון, ומציג בו \"מודל עבודה\" מתהווה בשפ\"ח שדרות.","tldr":"המאמר מזמין את הפסיכולוגיה החינוכית לבחון באופן ביקורתי את הנחות היסוד של הפרקטיקה שלה. הכותבות מציגות שלושה ממדים מקובלים להבחנה בין פרופסיות: גוף ידע, קוד אתי וסוציאליזציה מקצועית. הן מוסיפות להם ממד רביעי, עיסוק בביקורת עצמית. על סמך התרשמות…","search":"המאמר מזמין את הפסיכולוגיה החינוכית לבחון באופן ביקורתי את הנחות היסוד של הפרקטיקה שלה. הכותבות מציגות שלושה ממדים מקובלים להבחנה בין פרופסיות: גוף ידע, קוד אתי וסוציאליזציה מקצועית. הן מוסיפות להם ממד רביעי, עיסוק בביקורת עצמית. על סמך התרשמות שלהן, ולא על סמך מחקר, הן מתארות דימוי של פסיכולוגים מוערכים שנשארים בשוליים בהכרעות הארגוניות של בית הספר. מבפנים יש תסכול מכך שהעבודה הוסטה לאבחון ולהשמה (\"הפכנו מפסיכולוגים לטסטולוגים\"). מכאן עולה שאלה אתית: התחום הפך ל\"פסיכולוגיה של המתקשים\" במקום \"פסיכולוגיה של מערכת החינוך\". הכותבות מציעות שלוש זוויות להתכווננות ארגונית: אסטרטגית-פונקציונלית, פסיכואנליטית ופוסט-מודרנית, ומדגימות כל אחת מהן. החלק השני הוא סיפור בגוף ראשון של מנהלת שנכנסה לשפ\"ח שדרות בפברואר 2008, בעיצומה של הסלמה ביטחונית. הוא מתאר: מיצוב השפ\"ח כ\"גוף מתכלל\" וכ\"שער כניסה\" לשירותים הטיפוליים; הקמת \"פורום תמיכה\" בכל בית ספר; בקרה על האבחונים; תוכניות עבודה; ניתוח של מקרה השמה דרך תהליכים לא מודעים. בדיון נבחנים היתרונות והסיכונים של \"אריגת\" שלוש הגישות. הכותבות מציעות שינויים בהכשרה ובהדרכה בשפ\"ח, ובכלל זה עדכון גוף הידע לבחינת ההתמחות. ממד רביעי להבחנה בין פרופסיות. לשלושת הממדים המקובלים (ספציפיות גוף הידע, חוזק הקוד האתי, הידוק הסוציאליזציה) מוצע להוסיף, ברוח פוסט-מודרנית, את מידת העיסוק בביקורת עצמית. כלומר: באיזו מידה הפרופסיה בוחנת את הערכים החברתיים שעומדים מאחורי עקרונות הפעולה שלה. חשיבה כזאת מעוררת אי-נחת, כי היא חושפת את הפרופסיה כיחסית ותלוית תרבות. אבל היא גם הזדמנות לבחור מחדש בעקרונות המקצוע. הדימוי מבחוץ. הפסיכולוגים נתפסים כמתוחכמים, מיומנים, אתיים וזמינים בעת משבר. הביקורת עליהם מתמקדת בשני דברים: קושי לתרגם תובנות פסיכולוגיות לשפה חינוכית ולתוכניות מותאמות, ו\"עצות חוזרות\". היעדר מעורבות מרכזית בהכרעות ארגוניות. זה מתבטא בפנייה ליועצים, למנחים ולעמותות חיצוניים. אי-נחת מבפנים. פסיכולוגים רבים חשים שהיכולות שלהם אינן ממומשות ושהאבחון וההשמה תופסים חלק גדול מדי מהעבודה. ההכרה החוקית בבלעדיות שלהם באבחונים אולי הפכה ל\"מלכודת\". ככל שגוף הידע בלעדי יותר והסוציאליזציה הדוקה יותר, דרגות החופש המקצועיות עלולות להיות נמוכות יותר. תחושת השפעה נמוכה על הגדרת התפקיד. פסיכולוגים רבים מניחים שהגדרת התפקיד ניתנת מלמעלה: ממנהלת השפ\"ח, משפ\"י ומשרד החינוך. לא מספיק שהמנהלים יתמכו ביוזמה \"עקרונית\". צריך להקצות לכך מרחבי עבודה וחשיבה של ממש. השאלה האתית: למי מחויב הפסיכולוג? המשאבים שמושקעים בילדים \"בקצה\" (אבחון, השמה, קונסולטציה) גדולים בהרבה מאלה שמושקעים בתרבות הבית-ספרית ובדילמות שנוגעות לכל הילדים. זו בחירה מקצועית, ולכן אפשר להעמיד אותה לבחינה. ההצעה ההיפותטית: להקצות לאוכלוסייה המתקשה משאבים לפי חלקה באוכלוסייה, ואת השאר להפנות לייעוץ להנהלה, לדילמות חינוכיות, לשינוי ארגוני ולעבודה ממשקית. עבודה ארגונית דורשת הכשרה ייחודית. היא דורשת גם מבני הדרכה ושפה פנים-שפ\"חית מתאימים. ייתכן שהדרכה אינדיבידואלית מתאימה לעבודה פרטנית יותר מאשר לעבודה ארגונית. כדי להבין ארגונים, השפ\"ח צריך קודם כול ללמוד את עצמו כארגון. שלוש זוויות מבט ארגוניות (אסטרטגית-פונקציונלית, פסיכואנליטית ופוסט-מודרנית). כל אחת מזמינה שאלות אחרות ומקום אחר ליועץ או לפסיכולוג. ביקורת פוסט-מודרנית על האבחון. המאמר שואל מי מרוויח מכך שאינטליגנציה, ובשנים האחרונות קשב וריכוז, הם צירי המיון של ילדים. הוא מציין ש\"הימנעות אינה פעולה ניטראלית\", וטוען שהשפ\"ח יכול לפעול כארגון וככוח מקצועי מאוגד ולא רק כמצבור של אנשי מקצוע. מקרה שפ\"ח שדרות. הוא מדגים מעבר מעבודה \"בד' אמות\" לשפ\"ח שמתכלל את מערך הסיוע העירוני בזמן חירום מתמשך. הצעדים: יום עיון לכל המטפלים בעיר, השתתפות בצוות העירוני המוביל, \"פורום תמיכה\" בכל בית ספר, ועדות שבוחנות את נחיצות האבחונים, תוכניות עבודה אישיות וסמינר שנתי. \"אריגת\" שלוש הגישות. היא מאפשרת להתערב גם ברמה הרגשית (שיקוף ופירוש) וגם ברמה הפונקציונלית (מבנים אסטרטגיים שמווסתים חרדה). אבל היא עלולה לפגוע בקוהרנטיות של כל גישה. לכן צריך לבדוק כל הזמן אם השילוב \"משטיח או מפרה\". ממדי הפרופסיה – גוף ידע עיוני ומעשי (עד כמה הוא מובחן ועצמאי), חוזק הקוד האתי (כללי התנהגות וסנקציות), סוציאליזציה מקצועית (הגדרת ההכשרה, משכה ומנגנוני הפיקוח עליה), ועיסוק בביקורת עצמית (הממד שהכותבות מוסיפות). סוציאליזציה מקצועית – הדרך שבה הפרופסיה מכשירה ומפקחת על המתלמדים. לפי המאמר היא כוללת גם מבני הדרכה ושפה ארגונית פנים-שפ\"חית, ולא רק גופי ידע. \"טסטולוגים\" – ביטוי של פסיכולוג שמתמצת את החוויה שהאבחון וההשמה השתלטו על העבודה. פסיכולוגיה של מערכת החינוך מול פסיכולוגיה של המתקשים – שתי הגדרות עצמיות של התחום. המאמר טוען שהשנייה השתלטה, ושזו בחירה שאפשר לבחון מחדש. התכווננות ארגונית – הרחבת המבט של הפסיכולוג מהפרט אל הארגון. היא נשענת על \"מפות תיאורטיות\" של מה אנחנו עושים (פרקטיקות) ולאן אנחנו חותרים (אתיקה). תפיסה אסטרטגית-פונקציונלית – הארגון כשואף ליעילות מרבית. ההתערבות מתמקדת בתחומי אחריות ובמבני עבודה: הרכב, תדירות ובהירות משימתית. תפיסה ארגונית-פסיכואנליטית – בחינת מקורות החרדה הלא מודעת כשהמערכת לא עומדת במשימות הראשוניות שלה (primary tasks). הכלי: הגילויים הקאונטר-טרנספרנסיאליים של הפסיכולוג. דרכי ההתערבות: שיקוף ופירוש, כולל זיהוי של תהליך מקביל. איווי/תשוקה (מכיוון לקאניאני) – הפסיכולוג מכיר בתשוקות הפרטים כבעלות ערך לפרט וכמקור אפשרי לחיוניות ולהתחדשות של הארגון (לוי, 1996). תפיסה פוסט-מודרנית – ערעור על אקסיומות, כמו עליונות המומחה וזהות בין בכירות לידע, וחשיפת האינטרסים החברתיים שמאחורי פרקטיקות, למשל מיון לפי אינטליגנציה. \"גוף מתכלל\" / \"שער כניסה\" – מיצוב השפ\"ח כגוף שמרכז, מאגם ומסנן את כל השירותים הטיפוליים והתמיכתיים שנכנסים למערכת החינוך בעיר. \"פורום תמיכה\" – צוות קבוע בכל בית ספר: מנהל, פסיכולוג חינוכי, יועצת ומורת שילוב. הוא ממפה צרכים, בוחן כניסה של גורמים טיפוליים, מפנה מקרים ועוקב אחרי ההתערבויות. \"תפיסות נגזרות\" (אופיר, בעקבות בורדייה) – הפעולות המקצועיות בפועל משקפות תפיסות ערכיות, ולפעמים סותרות את הערכים שהאדם מצהיר עליהם."},{"id":"tauber","title":"חוויית השנה הראשונה בשפ\"ח","authors":"טל טאובר","year":"","cite":"טאובר, ט'. חוויית השנה הראשונה בשירות הפסיכולוגי החינוכי.","url":null,"kind":"article","desc":null,"file":{"orig":"חוויית השנה הראשונה בשרות -הפסיכולוגי החינוכי.doc","ext":"doc","pdf":"tauber.pdf","pages":22,"bytes":334678},"placements":[["s1","general"]],"extra":false,"ref":"טאובר","inFolder":true,"srcTitle":"חוויית השנה הראשונה בשירות הפסיכולוגי החינוכי: היבטים מרכזיים בחוויית ה\"הגירה\" של פסיכולוגים שסיימו הכשרה אקדמית שאינה פסיכולוגיה חינוכית","secs":{"abstract":"<p>המאמר עוסק בשנה הראשונה בשפ\"ח של פסיכולוגים שסיימו הכשרה אקדמית שאינה חינוכית (קלינית מבוגרים, קלינית ילדים, פסיכולוגיה רפואית), ומשתמש בחוויית ה\"הגירה\" כמטפורה. במבוא סוקרת המחברת את התפתחות התחום בארה\"ב, באנגליה ובישראל: צמיחתו מצורכי מערכות החינוך לאתר ילדים מתקשים, הקשר שלו לאבחון ולחינוך המיוחד, היעדר מעטפת תיאורטית מגובשת, וה\"דה-אקדמיזציה\" שגרמה לכך שרבים מגיעים לשפ\"ח בלי הכשרה חינוכית ולעיתים עוזבים אחרי שנתיים-שלוש. המחקר כלל שישה ראיונות חצי-מובנים בסוף השנה הראשונה, שנותחו בניתוח תמטי. הממצאים: חוויית \"קפיצה למים\" ובדידות מול בית הספר; ניגוד בין מרחב בית הספר המציף לבין התחנה ה\"ביתית\"; השנה הראשונה כיחידת זמן קריטית שבסופה מופנמת \"מפה\" ראשונית; יתרונות כמו עצמאות, יצירתיות וחשיבה מחוץ לקופסה; התלבטות בזהות המקצועית ו\"ויתור\" כואב על הטיפול; ודיאלוג טעון בין ותיקים לחדשים. בדיון מודגש הצורך ב\"רשת ביטחון\" (הדרכה, ידע תיאורטי וצוות תומך) ובגורמים מתווכים לפני הקליטה ובמהלכה. המחברת ממליצה להקים צוות חשיבה לבניית מודל קליטה ולפתח מודלים תיאורטיים אינטגרטיביים לתחום.<\/p>","ideas":"<ul>\n<li><strong>שורש בעיית הזהות הוא היסטורי<\/strong>: הפסיכולוגיה החינוכית צמחה במחלקות החינוך של ערים ומדינות כמענה לצורך לאתר ילדים לחינוך מיוחד, ולא באקדמיה. הדבר יצר \"קטיעה ובלבול\" בזהותה, ותפקיד \"שומר הסף\" שבין החינוך הרגיל לחינוך המיוחד דבק בה.<\/li>\n<li><strong>בישראל הוגדר מלכתחילה ייעוד רחב<\/strong>: \"הצרכן\" הוא הקהילה כולה, מהגיל הרך ועד הרחוב, עם עבודה צמודה עם משפחות. עם זאת, חסרה מעטפת תיאורטית שמחברת בין פסיכולוגיה, חינוך וסוציולוגיה, והמקצוע נותר זמן רב \"בעמדה מתנצלת\" לעומת חדר הטיפולים.<\/li>\n<li><strong>השנה הראשונה היא \"קפיצה למים\"<\/strong>: המערכת אינה מבחינה בין ותיק לחדש ומצפה למענים מיידיים, כולל משימות בשפה לא מוכרת (\"עבודה מערכתית\"), משימות לא פסיכולוגיות במהותן (ועדות שילוב והשמה), בירוקרטיה ואירועי חירום.<\/li>\n<li><strong>אי אפשר לבנות במקצוע הזה רצף הדרגתי של פניות<\/strong>: הפניות אינן מותאמות לרמת הידע של המתחיל. לכן התחנה צריכה להרחיב את אפשרויות ההתייעצות, עד כדי מעורבות ישירה של פסיכולוגים נוספים באירוע.<\/li>\n<li><strong>התחנה כ\"בית\" ובית הספר כשטח מאיים<\/strong>: הצוות, העזרה ההדדית וההתייעצות הפורמלית והספונטנית הם עוגן מרכזי. כשהתחנה אינה יוצרת מרחב סיוע רחב מעבר למדריך האישי, החוסר מורגש ופוגע בהתפתחות.<\/li>\n<li><strong>השנה הראשונה היא יחידת זמן מספקת לבניית \"מפה\" ראשונית<\/strong>: בסופה המרואיינים הרגישו שהפנימו את השפה המקצועית ואת המענים הבסיסיים, ויש מי שהרגישה שרק בסופה יכלה להתחיל עבודה מערכתית.<\/li>\n<li><strong>המתחילים מזהים יתרונות במקצוע<\/strong>: עצמאות, אוטונומיה, יצירתיות, חשיבה מחוץ לקופסה, קשר פחות פורמלי עם הלקוח, חשיפה לתחומי ידע רבים, ויכולת לחולל שינוי \"מחלחל\" ולא נקודתי.<\/li>\n<li><strong>הזהות המקצועית נותרת שאלה פתוחה<\/strong>: המרואיינים לא ויתרו על הזהות שהביאו ועל ההתמחות האחרת, ועבורם הוויתור העיקרי והמתסכל הוא על הטיפול. יש מי שמצאה דרך לחבר: \"אפשר לקחת את התיק הקליני גם לתחנה החינוכית\".<\/li>\n<li><strong>בין ותיקים לחדשים מתקיימת דינמיקה של הגירה<\/strong>: הוותיקים מצפים להיטמעות מהירה, והחדשים מבקשים לגיטימציה לזהות הקודמת. המתחילים דיווחו על \"השתקות\", \"השטחות\" ותחושה שדיון פתוח בזהות מאיים.<\/li>\n<li><strong>העבודה החינוכית היא עבודה \"בחיבורים\"<\/strong>, וכדי לעבוד בה נכון צריך ידע תיאורטי, הבנה של היחיד ושל הקבוצה, יכולת להתעקש על זמן חשיבה בסביבת לחץ, הדרכה מקיפה ו\"רשת ביטחון\".<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>חוויית ה\"הגירה\"<\/strong>: המטפורה המרכזית. מעבר מתחום הכשרה אחד לתחום חדש, עם \"הלם תרבותי\", איום על הזהות ואף היבטים של אבל, שמצליח יותר כשיש גורמים מתווכים לפניו ואחריו.<\/li>\n<li><strong>\"קפיצה למים\" / \"זריקה למים\"<\/strong>: תיאור החוויה של התחלת העבודה, כשמהיום הראשון נדרשים מענים לא מוכרים.<\/li>\n<li><strong>מרחב התחנה לעומת מרחב הגן/בית הספר<\/strong>: התחנה נחווית כידידותית, עם שפה פסיכולוגית מוכרת וגבולות. בית הספר נחווה כמציף, מבלבל, ועם פער בין ציפיות ליכולות.<\/li>\n<li><strong>רשת ביטחון<\/strong>: הדרכות, ידע תיאורטי ותשתית של צוות תומך בתוך השירות. לפי המחברת זו גם תפיסה מובילה בעבודת הפסיכולוגים במערכות.<\/li>\n<li><strong>גורמים מתווכים (לפני הקליטה ובמהלכה)<\/strong>: מבנים שמסייעים לעבד את המעבר, בהתחשב במוטיבציה, ברמת הבחירה, בציפיות ובאסטרטגיות קודמות.<\/li>\n<li><strong>סוציאליזציה בתחנה / מודל קליטה<\/strong>: תהליך קליטה ברור ומתמשך שמשתף את כלל הפסיכולוגים ובעלי תפקידים נוספים (כולל מזכירת התחנה), ולא רק את המנהל והמדריך.<\/li>\n<li><strong>דה-אקדמיזציה<\/strong>: סגירת מחלקות לפסיכולוגיה חינוכית באוניברסיטאות וצמצום ההכשרה האקדמית, מה שמגדיל את הפער בין תיאוריה למעשה.<\/li>\n<li><strong>פסיכולוג בית ספר / פסיכולוג חינוכי<\/strong>: שני מושגים (School Psychology בארה\"ב, Educational Psychology באנגליה) שמשקפים תיאורי תפקיד שונים.<\/li>\n<li><strong>שומר סף<\/strong>: תפקיד הפסיכולוג במעבר בין החינוך הרגיל לחינוך המיוחד, מורשת של ההקשר האבחוני ההיסטורי.<\/li>\n<li><strong>\"האוהל והשדה\" / היציאה לשדה<\/strong>: המעבר מחדר הטיפולים אל השדה. לפי הטקסט, את המונח טבע פרופ' קלמן בנימיני.<\/li>\n<li><strong>הציר חדר-בית ספר-קהילה<\/strong>: ציר ששרטטו בעבר קלמן בנימיני ועמירם רביב, ושהמחברת מציעה לחדד כעוגן תיאורטי.<\/li>\n<li><strong>אוריינטציה חינוכית-חברתית<\/strong>: הרגישות להקשר החינוכי והחברתי שנדרשת כמעט בכל מעגל עשייה, ושצריך לחדד בהכשרה דרך תיאוריה ומעשה.<\/li>\n<\/ul>","models":"<p><strong>ציוני דרך היסטוריים (לפי המאמר):<\/strong><\/p>\n<ul>\n<li><em>ארה\"ב<\/em>: הפסיכולוגיה החינוכית נולדה בתחילת המאה ה-20 מצורך של בתי ספר ציבוריים בערים גדולות לזהות ילדים שאינם עומדים בדרישות הזרם המרכזי, בקשר לצמיחת האבחונים אחרי מלחמת העולם הראשונה. בשנות ה-50 היו 13 מדינות שהעניקו לתפקיד תארים שונים (\"פסיכולוג קליני\", \"פסיכולוג בית ספר\", \"בוחן\").<\/li>\n<li><em>ציטוט על שלוש התשובות<\/em> לשאלה \"מה עושה פסיכולוג בית ספר\": מורים והורים לא יודעים, או אומרים שהוא מאבחן ילדים בעייתיים, או מתארים פסיכיאטר או קלינאי. קלינאים ויועצים אומרים שהוא מאבחן לחינוך מיוחד. הפסיכולוג עצמו מתאר פעילות ענפה \"אם תינתן לו ההזדמנות\".<\/li>\n<li><em>אנגליה<\/em>: התפקיד היה מתן ידע פסיכומטרי על יכולות לימודיות. עד שנות ה-60 העבודה התנהלה בקליניקות מחוץ למערכת, ומשנות ה-60 במעין כפילות, בחוץ ובתוך שירותי ייעוץ במערכת. התפקיד מוגדר עד היום כשומר סף לחינוך המיוחד.<\/li>\n<li><em>ישראל<\/em>: ב-1937 הוקם בת\"א המכון לפסיכו-הגיינה (פרופ' שניאורסון), עם שני כיוונים: איתור ילדים מתקשים והכוונה מקצועית למסיימי כיתות ח'. אחר כך הוקם המכון הפסיכו-טכני (לוי מלינובסקי), שערך מבחני כושר והישג קבוצתיים. הדגש עבר ממיון לייעוץ ולהתערבות מוקדמת, וב-1959 הפך המכון ל\"השירות הפסיכולוגי-החינוכי\".<\/li>\n<li><em>ערוצי הפעולה של הפסיכולוג החינוכי בישראל (סקירה)<\/em>: ייעוץ לקובעי מדיניות, פעולות מנע, אבחון והערכה ואיתור מוקדם, הדרכת צוותי חינוך, טיפול, ומחקר ועבודות מעקב.<\/li>\n<li><em>מחקר זיו (1980)<\/em>: רק 35% מהפסיכולוגים בתחנות סיימו פסיכולוגיה חינוכית, ו-33% פסיכולוגיה קלינית. הפסיכולוגים דירגו טיפול ואבחון גבוה ונושאי חינוך נמוך, והחוקר קישר זאת לכך שרוב המרצים באקדמיה קלינאים. הוא המליץ לשתף בבניית תוכניות הלימודים נציגים מהשדה ומשפ\"י.<\/li>\n<\/ul>\n<p><strong>מבנה שפ\"ח תל אביב (כפי שמתואר במאמר)<\/strong>: שש תחנות אזוריות; שני מדורים לחינוך מיוחד (גנים ובתי ספר); מדור פנימיות; יחידה קלינית; מדור מחקר; ומרכזים בתחומים הבאים: הורות עכשווית, מניעת אובדנות, לקויות למידה, ריכוז קהילת האתיופים, עבודה קהילתית, טיפול בילדים חולים במערכת, טיפול בפגיעות מיניות, ונוער להט\"ב.<\/p>\n<p><strong>נתוני הכשרה<\/strong>: מסלול ההכשרה עד שלב ההדרכה נמשך 10 עד 12 שנים. פרישה באמצע קוטעת את הרצף הארגוני, פוגעת באיזון בין קבוצות המתמחים, המומחים והמדריכים, ומשבשת את הסוציאליזציה בתחנות.<\/p>\n<p><strong>שיטת המחקר<\/strong>: מחקר פנומנולוגי (2012) עם 6 ראיונות חצי-מובנים בסוף השנה הראשונה, שהוקלטו, תומללו ונותחו בניתוח תמטי. נעשתה בדיקת עמיתים בקבוצת קורס המחקר האיכותני, ונעשה שימוש גם בסיכום דיון מוקלט בהנהלת השפ\"ח (אפריל 2012) על השתלמות שנה ראשונה לפסיכולוגים מתחילים. המרואיינים המצוטטים הם בוגרי קלינית מבוגרים, קלינית ילדים ופסיכולוגיה רפואית.<\/p>\n<p><strong>תמות הממצאים:<\/strong><\/p>\n<ol>\n<li>\"הקפיצה למים\"<\/li>\n<li>בין המרחב התחנתי למרחב הגן/בית הספר<\/li>\n<li>משמעות השנה הראשונה כיחידת זמן<\/li>\n<li>אפיונים (יתרונות שהמתחילים מזהים)<\/li>\n<li>זהות מקצועית<\/li>\n<li>דיאלוג עמיתים בין פסיכולוגים חינוכיים ותיקים לחדשים<\/li>\n<\/ol>\n<p><strong>מה נדרש כדי לפעול נכון \"באזור החיבורים\" (מתוך הדיון):<\/strong><\/p>\n<ul>\n<li>תובנות מקצועיות קודמות בעלות רקע תיאורטי<\/li>\n<li>ידע רחב בהתנהלות היחיד והקבוצה<\/li>\n<li>יכולת להתעקש על זמן חשיבה ועל החלטה בסביבת לחץ<\/li>\n<li>התנהלות שמלווה בהדרכות מקיפות<\/li>\n<li>פרמטרים נוספים לבניית רשת ביטחון מספקת לפסיכולוג הצעיר<\/li>\n<\/ul>\n<p><strong>היבטים שיש לשקול במיון ובקליטה (על בסיס תאוריות ההגירה):<\/strong> סיבה ומוטיבציה לשינוי, רמת הבחירה, ציפיות והיכרות עם הנושא, ואסטרטגיות אישיות קודמות במעברים.<\/p>\n<p><strong>המלצות המחברת:<\/strong><\/p>\n<ol>\n<li>להרחיב את המענים הבסיסיים בשנה הראשונה, כדי שהמתחיל יוכל לתת שירות מתאים, \"לשרוד\" ולבחור להמשיך בתחום.<\/li>\n<li>ללמוד מניסיון התחנות ולבנות רשת ביטחון בשנות העבודה הראשונות, בנוסף לחיבורים הקיימים עם בית הספר הגבוה לפסיכולוגיה חינוכית.<\/li>\n<li>להקים צוות חשיבה בכל השפ\"חים, עם נציגות של ניהול, הדרכה, הוראה ומחקר וגם של הפסיכולוגים הצעירים, שיפתח מודל קליטה ויבחן את יעילותו לאורך זמן.<\/li>\n<li>לעודד כתיבה ופיתוח של מודלים אינטגרטיביים בצומת הפסיכולוגי-חינוכי-חברתי (\"אמירת-על מאורגנת\" במקום מענים אקלקטיים), למשל לחדד את הציר חדר-בית ספר-קהילה.<\/li>\n<\/ol>","practice":"<ul>\n<li>חשוב לדעת מראש שתחושת ההצפה, הבדידות מול בית הספר ו\"הקפיצה למים\" בשנה הראשונה נורמטיביות ומשותפות לרבים, ואינן סימן לכישלון אישי.<\/li>\n<li>כשמגיעה פנייה שחורגת מהידע שלך (למשל מוות של הורה), אין לנסות להתמודד לבד. יש לפנות מיד להתייעצות בתחנה, וכשצריך לבקש מעורבות ישירה של פסיכולוג ותיק.<\/li>\n<li>כדאי להשתמש באופן פעיל במשאבי התחנה מעבר למדריך האישי: עמיתים, ותיקים, קבוצות, מזכירות. ההתייעצות הספונטנית היא חלק מהקליטה.<\/li>\n<li>בטיפולים שאת/ה לוקח/ת בשנה הראשונה, יש לוודא שיש להם הדרכה. מרואיינת אחת בחרה מראש מקרים פשוטים כי ידעה שלא תהיה הדרכה צמודה, ו\"כל טיפול צריך הדרכה\".<\/li>\n<li>מומלץ לחפש דרכים לחבר את הידע מההכשרה הקודמת לעבודה החינוכית (\"לקחת את התיק הקליני לתחנה\") במקום לבחור בין זהויות.<\/li>\n<li>כדאי להכיר את המשימות הבירוקרטיות (טפסים, ועדות שילוב והשמה) בשלב מוקדם, כי שם הורגשו הפערים הראשונים מול בית הספר.<\/li>\n<li>אם יש לך התלבטות בעניין הזהות המקצועית או ההתמחות, כדאי להעלות אותה במפורש בהדרכה, במקום לחוות \"השתקה\" או להשאיר אותה כמתח סמוי מול הוותיקים.<\/li>\n<li>כדאי לזכור שהצוות בבית הספר \"לא אשם\" בחילופי המתמחים, ולהביא בחשבון את התסכול שהחילופים מעוררים אצלו.<\/li>\n<\/ul>","questions":"<ol>\n<li>מה הבאתי איתי מההכשרה הקודמת (קלינית, רפואית, התפתחותית או אחרת), ומה מזה מסייע לי או מתנגש עם העבודה בשפ\"ח?<\/li>\n<li>מה מבחינתי ה\"ויתור\" העיקרי בשנה הראשונה, ואיך אני מתמודד/ת איתו? האם מדובר בוויתור אמיתי או בשינוי צורה של העשייה הטיפולית?<\/li>\n<li>היכן אני חש/ה \"זריקה למים\", ומה הייתה רשת הביטחון שלי (או מה חסר בה)? מה אני צריך/ה מהתחנה כדי לעבור את זה?<\/li>\n<li>איך אני חווה את הדיאלוג עם הפסיכולוגים הוותיקים סביב הזהות המקצועית? האם יש נושאים שאני נמנע/ת מלהעלות?<\/li>\n<li>מה הייתה \"המפה\" שבניתי לעצמי עד כה (שפה, מענים, אנשי קשר), ומה עוד חסר בה כדי להתחיל עבודה מערכתית?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"לגבי העבודה - אין ספק שזורקים אותך למים...\" (ע., בוגרת קלינית מבוגרים)<\/li>\n<li>\"הבנתי שלא צריך לבחור, אפשר לחבר את הַיֶּדַע הקודם עם הַיֶּדַע החדש... אפשר לקחת את התיק הקליני גם לתחנה החינוכית, לא צריך להשאיר אותו בבית...\" (ב., בוגרת קלינית מבוגרים)<\/li>\n<li>\"מראש לקחתי מקרים פשוטים כי ידעתי שלא תהיה הדרכה שתלווה אותי וכל טיפול צריך הדרכה אפילו הוא נראה פשוט על פניו...\" (ט., בוגרת קלינית ילדים)<\/li>\n<li>\"משמעות העשייה של הפסיכולוגיה החינוכית, כפי שציינה פסיכולוגית צעירה, היא בחיבורים.\"<\/li>\n<\/ul>"},"level":"שנה א'","stype":"מאמר (מחקר איכותני-פנומנולוגי עם מבוא היסטורי והמלצות ארגוניות)","tldr":"המאמר עוסק בשנה הראשונה בשפ\"ח של פסיכולוגים שסיימו הכשרה אקדמית שאינה חינוכית (קלינית מבוגרים, קלינית ילדים, פסיכולוגיה רפואית), ומשתמש בחוויית ה\"הגירה\" כמטפורה. במבוא סוקרת המחברת את התפתחות התחום בארה\"ב, באנגליה ובישראל: צמיחתו מצורכי מערכות…","search":"המאמר עוסק בשנה הראשונה בשפ\"ח של פסיכולוגים שסיימו הכשרה אקדמית שאינה חינוכית (קלינית מבוגרים, קלינית ילדים, פסיכולוגיה רפואית), ומשתמש בחוויית ה\"הגירה\" כמטפורה. במבוא סוקרת המחברת את התפתחות התחום בארה\"ב, באנגליה ובישראל: צמיחתו מצורכי מערכות החינוך לאתר ילדים מתקשים, הקשר שלו לאבחון ולחינוך המיוחד, היעדר מעטפת תיאורטית מגובשת, וה\"דה-אקדמיזציה\" שגרמה לכך שרבים מגיעים לשפ\"ח בלי הכשרה חינוכית ולעיתים עוזבים אחרי שנתיים-שלוש. המחקר כלל שישה ראיונות חצי-מובנים בסוף השנה הראשונה, שנותחו בניתוח תמטי. הממצאים: חוויית \"קפיצה למים\" ובדידות מול בית הספר; ניגוד בין מרחב בית הספר המציף לבין התחנה ה\"ביתית\"; השנה הראשונה כיחידת זמן קריטית שבסופה מופנמת \"מפה\" ראשונית; יתרונות כמו עצמאות, יצירתיות וחשיבה מחוץ לקופסה; התלבטות בזהות המקצועית ו\"ויתור\" כואב על הטיפול; ודיאלוג טעון בין ותיקים לחדשים. בדיון מודגש הצורך ב\"רשת ביטחון\" (הדרכה, ידע תיאורטי וצוות תומך) ובגורמים מתווכים לפני הקליטה ובמהלכה. המחברת ממליצה להקים צוות חשיבה לבניית מודל קליטה ולפתח מודלים תיאורטיים אינטגרטיביים לתחום. שורש בעיית הזהות הוא היסטורי: הפסיכולוגיה החינוכית צמחה במחלקות החינוך של ערים ומדינות כמענה לצורך לאתר ילדים לחינוך מיוחד, ולא באקדמיה. הדבר יצר \"קטיעה ובלבול\" בזהותה, ותפקיד \"שומר הסף\" שבין החינוך הרגיל לחינוך המיוחד דבק בה. בישראל הוגדר מלכתחילה ייעוד רחב: \"הצרכן\" הוא הקהילה כולה, מהגיל הרך ועד הרחוב, עם עבודה צמודה עם משפחות. עם זאת, חסרה מעטפת תיאורטית שמחברת בין פסיכולוגיה, חינוך וסוציולוגיה, והמקצוע נותר זמן רב \"בעמדה מתנצלת\" לעומת חדר הטיפולים. השנה הראשונה היא \"קפיצה למים\": המערכת אינה מבחינה בין ותיק לחדש ומצפה למענים מיידיים, כולל משימות בשפה לא מוכרת (\"עבודה מערכתית\"), משימות לא פסיכולוגיות במהותן (ועדות שילוב והשמה), בירוקרטיה ואירועי חירום. אי אפשר לבנות במקצוע הזה רצף הדרגתי של פניות: הפניות אינן מותאמות לרמת הידע של המתחיל. לכן התחנה צריכה להרחיב את אפשרויות ההתייעצות, עד כדי מעורבות ישירה של פסיכולוגים נוספים באירוע. התחנה כ\"בית\" ובית הספר כשטח מאיים: הצוות, העזרה ההדדית וההתייעצות הפורמלית והספונטנית הם עוגן מרכזי. כשהתחנה אינה יוצרת מרחב סיוע רחב מעבר למדריך האישי, החוסר מורגש ופוגע בהתפתחות. השנה הראשונה היא יחידת זמן מספקת לבניית \"מפה\" ראשונית: בסופה המרואיינים הרגישו שהפנימו את השפה המקצועית ואת המענים הבסיסיים, ויש מי שהרגישה שרק בסופה יכלה להתחיל עבודה מערכתית. המתחילים מזהים יתרונות במקצוע: עצמאות, אוטונומיה, יצירתיות, חשיבה מחוץ לקופסה, קשר פחות פורמלי עם הלקוח, חשיפה לתחומי ידע רבים, ויכולת לחולל שינוי \"מחלחל\" ולא נקודתי. הזהות המקצועית נותרת שאלה פתוחה: המרואיינים לא ויתרו על הזהות שהביאו ועל ההתמחות האחרת, ועבורם הוויתור העיקרי והמתסכל הוא על הטיפול. יש מי שמצאה דרך לחבר: \"אפשר לקחת את התיק הקליני גם לתחנה החינוכית\". בין ותיקים לחדשים מתקיימת דינמיקה של הגירה: הוותיקים מצפים להיטמעות מהירה, והחדשים מבקשים לגיטימציה לזהות הקודמת. המתחילים דיווחו על \"השתקות\", \"השטחות\" ותחושה שדיון פתוח בזהות מאיים. העבודה החינוכית היא עבודה \"בחיבורים\", וכדי לעבוד בה נכון צריך ידע תיאורטי, הבנה של היחיד ושל הקבוצה, יכולת להתעקש על זמן חשיבה בסביבת לחץ, הדרכה מקיפה ו\"רשת ביטחון\". חוויית ה\"הגירה\": המטפורה המרכזית. מעבר מתחום הכשרה אחד לתחום חדש, עם \"הלם תרבותי\", איום על הזהות ואף היבטים של אבל, שמצליח יותר כשיש גורמים מתווכים לפניו ואחריו. \"קפיצה למים\" / \"זריקה למים\": תיאור החוויה של התחלת העבודה, כשמהיום הראשון נדרשים מענים לא מוכרים. מרחב התחנה לעומת מרחב הגן/בית הספר: התחנה נחווית כידידותית, עם שפה פסיכולוגית מוכרת וגבולות. בית הספר נחווה כמציף, מבלבל, ועם פער בין ציפיות ליכולות. רשת ביטחון: הדרכות, ידע תיאורטי ותשתית של צוות תומך בתוך השירות. לפי המחברת זו גם תפיסה מובילה בעבודת הפסיכולוגים במערכות. גורמים מתווכים (לפני הקליטה ובמהלכה): מבנים שמסייעים לעבד את המעבר, בהתחשב במוטיבציה, ברמת הבחירה, בציפיות ובאסטרטגיות קודמות. סוציאליזציה בתחנה / מודל קליטה: תהליך קליטה ברור ומתמשך שמשתף את כלל הפסיכולוגים ובעלי תפקידים נוספים (כולל מזכירת התחנה), ולא רק את המנהל והמדריך. דה-אקדמיזציה: סגירת מחלקות לפסיכולוגיה חינוכית באוניברסיטאות וצמצום ההכשרה האקדמית, מה שמגדיל את הפער בין תיאוריה למעשה. פסיכולוג בית ספר / פסיכולוג חינוכי: שני מושגים (School Psychology בארה\"ב, Educational Psychology באנגליה) שמשקפים תיאורי תפקיד שונים. שומר סף: תפקיד הפסיכולוג במעבר בין החינוך הרגיל לחינוך המיוחד, מורשת של ההקשר האבחוני ההיסטורי. \"האוהל והשדה\" / היציאה לשדה: המעבר מחדר הטיפולים אל השדה. לפי הטקסט, את המונח טבע פרופ' קלמן בנימיני. הציר חדר-בית ספר-קהילה: ציר ששרטטו בעבר קלמן בנימיני ועמירם רביב, ושהמחברת מציעה לחדד כעוגן תיאורטי. אוריינטציה חינוכית-חברתית: הרגישות להקשר החינוכי והחברתי שנדרשת כמעט בכל מעגל עשייה, ושצריך לחדד בהכשרה דרך תיאוריה ומעשה."},{"id":"sapiryogev","title":"סכמה להתערבות דיאגנוסטית","authors":"סמדר ספיר-יוגב","year":"2016","cite":"ספיר-יוגב, ס' (2016). סכמה להתערבות דיאגנוסטית. שפ\"י, משרד החינוך.","url":"https://meyda.education.gov.il/files/shefi/alon_melakut_lelemida/smadar_sapir_yogev%20(1).pdf","kind":"article","desc":null,"urlLabel":"המסמך באתר שפ\"י (PDF)","file":{"orig":"סכמה להתערבות דיאגנוסטית.pdf","ext":"pdf","pdf":"sapiryogev.pdf","pages":9,"bytes":391458},"placements":[["s1","diag"]],"extra":false,"ref":"ספיר-יוגב 2016","inFolder":true,"srcTitle":"סכמה להתערבות דיאגנוסטית","secs":{"abstract":"<p>המחברת פותחת ב\"לקח\" אישי: נער שאבחנה בעבר הגיע לאבחון חוזר בטוח שאינו טוב במשימות חזותיות – בעקבות המשוב שקיבל ממנה – בעוד שבפועל תפקד בהן היטב. מכאן היא מסיקה שהאבחון עצמו הוא \"התערבות דיאגנוסטית\": הראיונות, העבודה עם הילד והמשוב מניעים תהליך ומשפיעים, ולכן יש לשאול מה המטרה ואיך הילד, הוריו וצוותו יצאו מחוזקים, עם תחושת יכולת ותקווה. היא מציעה סכמה בת שבעה שלבים: (1) גיבוש שאלות אבחון ספציפיות יחד עם המורה, ההורים והילד – ואבחון רק כשיש שאלה אמיתית; (2) תכנון – מעבר מ\"תלבושת אחידה\" של סוללה קבועה ל\"תפירת חליפה\" לפי השערות על יכולות קוגניטיביות ורגשיות; (3) מפגש ראשון כבדיקה ראשונית של ההשערות, שבו הילד שותף ל\"חקירת הבעיה\"; (4) מפגש שני להעמקה לפי הממצאים; (5) אינטגרציה – ניסוח התשובה לשאלות בכמה משפטים; (6) משוב כ\"מפגש בין מומחים\" שבו בונים יחד הבנה ותכנית עבודה, ללא מסירת דו\"ח מוכן; (7) כתיבת דו\"ח סופי המשקף את המשוב, ומעקב. היא מדגישה שהאבחון הוא תמונת מצב נקודתית, ומסיימת בקריאה לפסיכולוגים לא לראות בכך אוטופיה: \"זה בידינו\".<\/p>","ideas":"<ul>\n<li>האבחון הוא התערבות: לשאלות בראיונות, לעבודה עם הילד ולמשוב יש השפעה – גם ארוכת טווח – על הדימוי העצמי של הילד ועל ההורים והמורים. לכן יש להגדיר את מטרת ההתערבות הדיאגנוסטית: שהמעורבים יצאו מחוזקים ומועצמים, עם תחושת יכולת ותקווה.<\/li>\n<li>נקודת המוצא היא \"מה מטריד את הקליינטים\": המורה, ההורים והילד – כל אחד בנפרד – ושאלות האבחון מגובשות יחד איתם.<\/li>\n<li>שאלות האבחון צריכות להיות ספציפיות; שאלה כללית (\"מה יש לילד?\") מובילה להעברת כל המבחנים ולתוצאה לא ממוקדת. התערבות דיאגנוסטית מוצדקת רק כשיש שאלה אבחונית אמיתית ונכונות לסייע לילד באמצעותה.<\/li>\n<li>מעבר מחשיבה ממוקדת בטריה/בכלים (\"וכסלר, ציורים, בנדר, ריי חזותי, מסלול\") לחשיבה ממוקדת בשאלה: העלאת השערות על יכולות נמוכות/גבוהות ובחירת כלים בהתאם.<\/li>\n<li>מפתח התכנון: הבנת הקשרים ההדדיים בין יכולות קוגניטיביות, יכולות רגשיות ותפקוד לימודי וחברתי – \"הילד הוא אחד\", הקוגניציה והרגש משפיעים זה על זה.<\/li>\n<li>שימוש מושכל בשני המפגשים: לא \"ממשיכים מאיפה שעצרנו\", אלא מפגש ראשון לבדיקת השערות ומפגש שני להעמקה מתוכננת. אבחון בפגישה אחת עלול \"לתפוס\" את הילד ביום לא טוב.<\/li>\n<li>הילד אינו \"נבדק\" אלא שותף פעיל לחקירה; שואלים אותו כיצד ניגש למשימה ומה עזר לו.<\/li>\n<li>משוב אינו מסירת תוצאות אלא \"מפגש בין מומחים\" (מומחית לדיאגנוסטיקה, מורה – לפדגוגיה ולילד הספציפי, הורים – להורות שלהם, ילד – לעצמו), שמטרתו לחולל שינוי מעצים ולבנות במשותף הבנה ותכנית.<\/li>\n<li>המחברת נמנעת ממסירת דו\"ח מודפס בסוף המשוב, כי הדבר משדר שדברי ההורים לא השפיעו ומעמיד אותם בעמדה פסיבית; הדו\"ח הסופי נכתב אחרי המשוב וכולל את מה שעלה בו – כולל עמדות שונות של הקליינטים.<\/li>\n<li>המסר החשוב ביותר במשוב: האבחון הוא תמונת מצב נקודתית; מצב הילד אינו סטטי ותמיד ניתן להשתפר.<\/li>\n<li>מעקב הוא חלק מההתערבות: קובעים פגישת מעקב כבר במשוב.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>התערבות דיאגנוסטית<\/strong> – תפיסת האבחון כולו (ראיונות, מפגשים, משוב, דו\"ח ומעקב) כהתערבות המחוללת שינוי, ולא רק כאיסוף מידע.<\/li>\n<li><strong>שאלת אבחון<\/strong> – שאלה ספציפית, שגובשה עם המורה, ההורים והילד, המכוונת את תכנון האבחון.<\/li>\n<li><strong>\"תלבושת אחידה\"<\/strong> – חשיבה ממוקדת בטריה, שבה כל ילד עובר את אותה סוללת מבחנים.<\/li>\n<li><strong>\"תפירת חליפה אבחונית\"<\/strong> – תכנון אבחון לפי השערות הנגזרות משאלות האבחון, עם דגש יחסי על היכולות הרלוונטיות.<\/li>\n<li><strong>השערות<\/strong> – ניבוי מוקדם אילו יכולות קוגניטיביות/רגשיות יהיו נמוכות או גבוהות; נבדקות (ואולי מוטב – מופרכות) במפגש הראשון.<\/li>\n<li><strong>בדיקה ראשונית<\/strong> – המפגש הראשון: ראיון עם הילד, בדיקה ראשונית של תחומי הישג (רק לפי הצורך) ושל יכולות קוגניטיביות לפי ההשערות.<\/li>\n<li><strong>העמקה<\/strong> – המפגש השני, המתוכנן לפי השאלות שנותרו פתוחות (למשל מבחן שלישי כששני מבחנים לא עלו בקנה אחד).<\/li>\n<li><strong>אינטגרציה<\/strong> – גיבוש התשובה לשאלות האבחון, \"עמוד השדרה\" של המשוב והדו\"ח, בחמישה–עשרה משפטים.<\/li>\n<li><strong>משוב כמפגש בין מומחים<\/strong> – משוב דיאלוגי שבו כל צד מביא את ה\"תיאוריה\" שלו על הבעיה, ומגיעים להבנה משותפת ולתכנית עבודה.<\/li>\n<li><strong>הילד כשותף<\/strong> – הילד משתתף בתהליך הגילוי על עצמו, ומחשבותיו ואבחנותיו על עצמו הן מידע מבוקש.<\/li>\n<li><strong>יכולת פלואידית וידע מגובש<\/strong> – יכולות קוגניטיביות שאליהן מכוונות שאלות האבחון בדוגמת ילד הגן; תפקודים ניהוליים הם חלק מהיכולת הפלואידית.<\/li>\n<li><strong>תפקודים ניהוליים \"חמים\" ו\"קרים\"<\/strong> – קושי בהתאפקות ובדחיית סיפוקים קשור לתפקודים \"חמים\"; אינהיביציה קוגניטיבית – ל\"קרים\".<\/li>\n<\/ul>","models":"<h3>תמונת העל של הסכמה (כפי שמוצגת בפתיחה ובסיום)<\/h3>\n<ol>\n<li>גיבוש שאלות אבחון עם המורה, ההורים והילד.<\/li>\n<li>תכנון: העלאת השערות ותפירת חליפה אבחונית למידותיו של הילד.<\/li>\n<li>העברת המבחנים – מפגש ראשון: בדיקה ראשונית של ההשערות. הילד שותף לתהליך הגילוי על עצמו.<\/li>\n<li>העברת המבחנים – מפגש שני: העמקה במקומות מסוימים, בהתאם לתוצאות המפגש הראשון.<\/li>\n<li>אינטגרציה: האם השבנו על שאלות האבחון? מהי התשובה? מיהו הילד?<\/li>\n<li>משוב כמפגש בין מומחים עם המורה, ההורים והילד – בנייה משותפת של תשובות לשאלות האבחון ותכנית עבודה.<\/li>\n<li>כתיבת דו\"ח סופי לאחר המשוב; הדו\"ח יבטא גם את תהליך המשוב.<\/li>\n<li>מעקב: מה עבד? מה צריך לשנות? האם מתעוררות שאלות חדשות?<\/li>\n<\/ol>\n<p>(בגוף הטקסט השלבים ממוספרים כשבעה: שלב שביעי מאחד \"כתיבת דו\"ח סופי ומעקב\".)<\/p>\n<h3>שלב 1 – יצירת שאלות אבחון<\/h3>\n<p>שאלות מנחות לראיונות:<\/p>\n<ul>\n<li><strong>מורה<\/strong>: מה מטריד אותה לגבי הילד? לגבי הקשר שלה איתו? כיצד עבדה איתו והיכן \"נתקעה\"? מהן שאלותיה? על מה היא רוצה שההתערבות תענה?<\/li>\n<li><strong>הורים<\/strong>: מה מטריד אותם לגבי ילדם ולגבי הקשר איתו? מהן שאלותיהם? מה היו רוצים לדעת או לקבל כתוצר?<\/li>\n<li><strong>ילד<\/strong>: מה מטריד אותו לגבי עצמו? לגבי הקשר עם הוריו, מוריו וחבריו? במה הוא מבחין, אילו שאלות הוא שואל? על מה היה רוצה שההתערבות תענה?<\/li>\n<li>כללים: לגבש את השאלות יחד איתם; שאלות ספציפיות שמאפשרות תכנון; לא לערוך התערבות דיאגנוסטית כשאין שאלה אבחונית אמיתית או נכונות לסייע לילד באמצעותה.<\/li>\n<\/ul>\n<h3>שלב 2 – תכנון (\"תפירת חליפה\")<\/h3>\n<p>שאלות לפסיכולוג:<\/p>\n<ul>\n<li>איך אשיב על השאלה – בראיון בלבד? במבחנים?<\/li>\n<li>אילו יכולות קוגניטיביות אני משערת שיהיו נמוכות? גבוהות? על מה נשים דגש?<\/li>\n<li>באילו מבחנים נבחר לבדוק יכולות אלה? ובאילו – את המצב והיכולות הרגשיים?<\/li>\n<\/ul>\n<p>הבנת הקשרים שמאפשרת לתכנן (חמישה כיוונים):<\/p>\n<ol>\n<li>כיצד כל יכולת קוגניטיבית משפיעה על התפקוד הלימודי הכללי ועל קריאה, כתיבה וחשבון.<\/li>\n<li>כיצד היכולות הקוגניטיביות משפיעות על היכולות הרגשיות ועל התפקוד החברתי.<\/li>\n<li>כיצד היכולות הרגשיות משפיעות על כל אחת מהיכולות הקוגניטיביות.<\/li>\n<li>כיצד היכולות הרגשיות משפיעות על התפקוד החברתי והלימודי.<\/li>\n<li>כיצד התפקוד הלימודי והחברתי משפיע על התפתחות היכולות הקוגניטיביות והרגשיות.<\/li>\n<\/ol>\n<p><strong>דוגמה – ילד גן<\/strong> (שאלות אבחון ← השערה):<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>שאלת אבחון<\/th>\n<th>יכולת משוערת<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>מדוע מתקשה להבין תכנים הנלמדים בגן?<\/td>\n<td>שפה/ידע מגובש, או תהליכי הבנה כלליים יותר<\/td>\n<\/tr>\n<tr>\n<td>מדוע מתקשה למיין אובייקטים לקבוצות?<\/td>\n<td>הפשטה והכללה – תהליכים פלואידיים<\/td>\n<\/tr>\n<tr>\n<td>מדוע מתקשה לעבור ממשימה למשימה ולהתמודד עם שינויים בסדר היום?<\/td>\n<td>Shifting וגמישות מחשבתית – תפקודים ניהוליים<\/td>\n<\/tr>\n<tr>\n<td>מדוע מתקשה להתאפק ולדחות סיפוקים?<\/td>\n<td>תפקודים ניהוליים \"חמים\" (לעומת אינהיביציה קוגניטיבית – \"קרים\")<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>מסקנה: לוודא שהיכולת הפלואידית והידע המגובש נבדקים בהרחבה יחסית – בלי לוותר על בדיקת יכולות אחרות ומצב רגשי – ולעמוד על האינטראקציה בין המבנה הקוגניטיבי לחוויה הרגשית ולהתפתחות החברתית.<\/p>\n<h3>שלב 3 – בדיקה ראשונית (מפגש ראשון)<\/h3>\n<ul>\n<li><strong>ראיון עם הילד<\/strong>: איך הוא רואה ומבין את הבעיה, אילו חוזקות הוא רואה בעצמו, מצבו החברתי, היחסים במשפחה – משמש בדיקה ראשונית בתחום הרגשי-חברתי.<\/li>\n<li><strong>בדיקה ראשונית של תחומי הישג<\/strong> (קריאה/כתיבה/חשבון) – רק אם שאלות האבחון מחייבות, ובדגשים לפיהן (למשל: הפניה בגלל הבנת הנקרא עם קריאה טכנית תקינה – להתחיל מטקסט עם שאלות הבנה, ולהרחיב רק לפי הצורך).<\/li>\n<li><strong>בדיקה ראשונית של יכולות קוגניטיביות<\/strong> – הרחבה יחסית ביכולות הקשורות לשאלות, צמצום ביכולות פחות קשורות.<\/li>\n<li>הילד כשותף – שאלות לדוגמה: \"איך ניגשת לזה?\", \"איך חשבת?\", \"מה במה שעשיתי עכשיו עזר לך?\", \"בוא נחשוב ביחד מה אנחנו לומדים ממה שקרה עכשיו\".<\/li>\n<\/ul>\n<h3>שלב 4 – העמקה (מפגש שני)<\/h3>\n<p>שאלות לתכנון:<\/p>\n<ul>\n<li>האם איששנו (או הפרכנו) את ההשערות? מה נשאר פתוח?<\/li>\n<li>באילו יכולות קוגניטיביות להעמיק? (למשל, מבחן שלישי כששני מבחנים לאותה יכולת אינם עולים בקנה אחד)<\/li>\n<li>האם להעמיק בתחום הרגשי? מה עוד צריך לדעת?<\/li>\n<li>האם להעמיק בתחומי ההישג? מה חסר לתמונה ברורה?<\/li>\n<li>ובכלל: מה צריך לעשות או לדעת כדי להשיב על שאלות האבחון?<\/li>\n<\/ul>\n<h3>שלב 5 – אינטגרציה<\/h3>\n<p>שלושה סוגי שאלות:<\/p>\n<ol>\n<li>איך אני קושרת בין תפקוד הילד בתחומי ההישג לבין מצב יכולותיו הקוגניטיביות?<\/li>\n<li>איך אני קושרת בין מצבו הרגשי לבין תפקודו בתחומי ההישג ובתחום הקוגניטיבי?<\/li>\n<li>האם אני רואה את הילד מבעד למבחנים – אישיותו, התמודדויותיו, מקור קשייו, תחומי החוזק – והאם אוכל לתקשר זאת בבהירות?\nתוצר: ניסוח התשובה לשאלות האבחון בחמישה–עשרה משפטים – הגרעין של המשוב והדו\"ח.<\/li>\n<\/ol>\n<h3>שלב 6 – משוב ובניית תכנית התערבות<\/h3>\n<ul>\n<li>מטרה: לא \"למסור תוצאות\" אלא לחולל שינוי מעצים בהורים, במורה ובילד (שינוי שהחל כבר בראיונות ובמפגשים).<\/li>\n<li>לא למסור דו\"ח מודפס וחתום בסוף הפגישה (מסר שדברי ההורים אינם משפיעים; עמדה פסיבית).<\/li>\n<li>מפגש בין מומחים: לכל אחד \"תיאוריה\" על הבעיה, מקורותיה, מתי היא חריפה או קלה, וניסיונות ההתמודדות – כולן \"תקפות באותה מידה\".<\/li>\n<li>רצף עם המורה: (א) הצגת ההבנות והתשובות; (ב) \"איך זה מתיישב עם מה שאת רואה? ... באילו נסיבות הוא מתפקד כפי שאני ראיתי / כפי שאת רואה?\" – להבנה משותפת או חדשה; (ג) \"מה מתוך הניסיון והכלים שלך יכול לעזור? ... מה עזר לילדים אחרים במצב דומה? מה את יכולה לקחת על עצמך?\" – חשיבה משותפת על דרכי עבודה שייכתבו כהמלצות.<\/li>\n<li>תהליך דומה עם ההורים ועם הילד: כל אחד חושב מה יוכל לקחת על עצמו כדי לחזק את החוזקות ולהתחזק בתחומי הקושי.<\/li>\n<li>מדדי הצלחה: המורה יוצאת בתחושה \"יש לי מה לעשות עם הילד הזה\"; הילד מכיר בחוזקותיו ובקשייו וחדור אמונה ואופטימיות; כך גם ההורים.<\/li>\n<li>המסר החשוב ביותר: האבחון הוא תמונת מצב נקודתית; המצב אינו סטטי.<\/li>\n<\/ul>\n<h3>שלב 7 – דו\"ח סופי ומעקב<\/h3>\n<ul>\n<li>מגיעים למשוב עם דו\"ח כתוב אך לא מוסרים אותו; מוסיפים לדו\"ח: דרכי עבודה שסוכמו (בהמלצות), תובנות חדשות, ואף מחלוקות – כולל כיצד הקליינט רואה את הדברים. שפה ברורה ותקשורתית.<\/li>\n<li>קובעים במשוב פגישת מעקב: מה עבד? מה לא ומדוע? מה לשנות? האם עולות שאלות חדשות?<\/li>\n<\/ul>","practice":"<ul>\n<li>לפתוח כל תיק אבחון בניסוח בכתב של שאלות האבחון – בנפרד מנקודת המבט של המורה, ההורים והילד – ולוודא שהן ספציפיות דיין כדי להכתיב תכנון.<\/li>\n<li>לפני המפגש הראשון לכתוב \"תכנית אבחון\": השערות (אילו יכולות צפויות להיות חלשות/חזקות ולמה) והכלים שנבחרו לבדיקתן – במקום סוללה קבועה; להביא את התכנית להדרכה.<\/li>\n<li>לבנות את המפגש הראשון כבדיקה ראשונית (ראיון עם הילד + בדיקות ממוקדות), ובין המפגשים לעצור ולבדוק אילו השערות אוששו או הופרכו ומה נותר לבדוק.<\/li>\n<li>לשתף את הילד בתהליך: לשאול אותו כיצד ניגש למשימה ומה עזר לו, ולהתייחס לתשובותיו כמידע אבחוני.<\/li>\n<li>לנסח לפני המשוב את \"התשובה בחמישה–עשרה משפטים\" ולוודא שהיא כוללת חוזקות, קשיים ואת הקשר בין קוגניציה, רגש והישגים.<\/li>\n<li>לנהל משוב דיאלוגי: להציג הבנות, לשאול \"איך זה מתיישב עם מה שאת/ם רואים?\", ולבנות את ההמלצות יחד עם המורה וההורים, תוך הקפדה על המסר שהאבחון הוא תמונת מצב נקודתית.<\/li>\n<li>להקפיד על ניסוח משוב לילד שלא \"יקבע\" לו זהות של \"לא טוב ב...\" – לחשוב איך המשוב ישפיע על הדימוי העצמי שלו גם בעוד שנים.<\/li>\n<li>לכתוב את הדו\"ח הסופי אחרי המשוב, לשלב בו את מה שסוכם ואת עמדות הקליינטים, ולקבוע מראש פגישת מעקב.<\/li>\n<\/ul>","questions":"<ol>\n<li>בתיק האבחון הנוכחי שלי – מהי שאלת האבחון \"האמיתית\" של כל אחד מהמעורבים? האם יש בכלל שאלה שמצדיקה אבחון?<\/li>\n<li>אילו השערות היו לי לפני האבחון, ואיך הן השפיעו על בחירת הכלים? היכן נשארתי ב\"תלבושת אחידה\"?<\/li>\n<li>מה הילד עלול \"לקחת איתו\" מהמשוב שאתן לו? איך אנסח את הממצאים כך שיחזקו תחושת יכולת ותקווה ולא יקבעו תווית?<\/li>\n<li>מה מקשה עליי לוותר על מסירת דו\"ח מוכן במשוב, ומה עלול להשתנות ביחסים עם ההורים והמורה אם אבנה את ההמלצות יחד איתם?<\/li>\n<li>כיצד המודל מתיישב עם מגבלות הזמן והמשאבים בשפ\"ח, ואילו מרכיבים ממנו אוכל ליישם כבר עכשיו?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"אירוע זה הבהיר לי שמה שאנו עושים בדיאגנוסטיקה זה סוג של התערבות.\"<\/li>\n<li>\"הילד אינו 'נבדק' ואינו 'נבחן'. הוא אינו פאסיבי, הוא אינו אובייקט שאנו עורכים לו בדיקות.\"<\/li>\n<li>\"אני רואה את פגישת המשוב כמפגש בין מומחים\"<\/li>\n<li>\"האבחון מתאר תמונת מצב נקודתית, שנכונה לנקודת זמן זו. המצב של הילד אינו סטטי. תמיד ניתן להשתפר ולהתחזק.\"<\/li>\n<\/ul>"},"level":"שנים ב'-ג' (מומלץ להציג כבר בשנה א', לקראת האבחונים הראשונים)","stype":"מאמר (מסמך מקצועי קצר בגוף ראשון, המציג מודל עבודה)","tldr":"המחברת פותחת ב\"לקח\" אישי: נער שאבחנה בעבר הגיע לאבחון חוזר בטוח שאינו טוב במשימות חזותיות – בעקבות המשוב שקיבל ממנה – בעוד שבפועל תפקד בהן היטב. מכאן היא מסיקה שהאבחון עצמו הוא \"התערבות דיאגנוסטית\": הראיונות, העבודה עם הילד והמשוב מניעים תהליך…","search":"המחברת פותחת ב\"לקח\" אישי: נער שאבחנה בעבר הגיע לאבחון חוזר בטוח שאינו טוב במשימות חזותיות – בעקבות המשוב שקיבל ממנה – בעוד שבפועל תפקד בהן היטב. מכאן היא מסיקה שהאבחון עצמו הוא \"התערבות דיאגנוסטית\": הראיונות, העבודה עם הילד והמשוב מניעים תהליך ומשפיעים, ולכן יש לשאול מה המטרה ואיך הילד, הוריו וצוותו יצאו מחוזקים, עם תחושת יכולת ותקווה. היא מציעה סכמה בת שבעה שלבים: (1) גיבוש שאלות אבחון ספציפיות יחד עם המורה, ההורים והילד – ואבחון רק כשיש שאלה אמיתית; (2) תכנון – מעבר מ\"תלבושת אחידה\" של סוללה קבועה ל\"תפירת חליפה\" לפי השערות על יכולות קוגניטיביות ורגשיות; (3) מפגש ראשון כבדיקה ראשונית של ההשערות, שבו הילד שותף ל\"חקירת הבעיה\"; (4) מפגש שני להעמקה לפי הממצאים; (5) אינטגרציה – ניסוח התשובה לשאלות בכמה משפטים; (6) משוב כ\"מפגש בין מומחים\" שבו בונים יחד הבנה ותכנית עבודה, ללא מסירת דו\"ח מוכן; (7) כתיבת דו\"ח סופי המשקף את המשוב, ומעקב. היא מדגישה שהאבחון הוא תמונת מצב נקודתית, ומסיימת בקריאה לפסיכולוגים לא לראות בכך אוטופיה: \"זה בידינו\". האבחון הוא התערבות: לשאלות בראיונות, לעבודה עם הילד ולמשוב יש השפעה – גם ארוכת טווח – על הדימוי העצמי של הילד ועל ההורים והמורים. לכן יש להגדיר את מטרת ההתערבות הדיאגנוסטית: שהמעורבים יצאו מחוזקים ומועצמים, עם תחושת יכולת ותקווה. נקודת המוצא היא \"מה מטריד את הקליינטים\": המורה, ההורים והילד – כל אחד בנפרד – ושאלות האבחון מגובשות יחד איתם. שאלות האבחון צריכות להיות ספציפיות; שאלה כללית (\"מה יש לילד?\") מובילה להעברת כל המבחנים ולתוצאה לא ממוקדת. התערבות דיאגנוסטית מוצדקת רק כשיש שאלה אבחונית אמיתית ונכונות לסייע לילד באמצעותה. מעבר מחשיבה ממוקדת בטריה/בכלים (\"וכסלר, ציורים, בנדר, ריי חזותי, מסלול\") לחשיבה ממוקדת בשאלה: העלאת השערות על יכולות נמוכות/גבוהות ובחירת כלים בהתאם. מפתח התכנון: הבנת הקשרים ההדדיים בין יכולות קוגניטיביות, יכולות רגשיות ותפקוד לימודי וחברתי – \"הילד הוא אחד\", הקוגניציה והרגש משפיעים זה על זה. שימוש מושכל בשני המפגשים: לא \"ממשיכים מאיפה שעצרנו\", אלא מפגש ראשון לבדיקת השערות ומפגש שני להעמקה מתוכננת. אבחון בפגישה אחת עלול \"לתפוס\" את הילד ביום לא טוב. הילד אינו \"נבדק\" אלא שותף פעיל לחקירה; שואלים אותו כיצד ניגש למשימה ומה עזר לו. משוב אינו מסירת תוצאות אלא \"מפגש בין מומחים\" (מומחית לדיאגנוסטיקה, מורה – לפדגוגיה ולילד הספציפי, הורים – להורות שלהם, ילד – לעצמו), שמטרתו לחולל שינוי מעצים ולבנות במשותף הבנה ותכנית. המחברת נמנעת ממסירת דו\"ח מודפס בסוף המשוב, כי הדבר משדר שדברי ההורים לא השפיעו ומעמיד אותם בעמדה פסיבית; הדו\"ח הסופי נכתב אחרי המשוב וכולל את מה שעלה בו – כולל עמדות שונות של הקליינטים. המסר החשוב ביותר במשוב: האבחון הוא תמונת מצב נקודתית; מצב הילד אינו סטטי ותמיד ניתן להשתפר. מעקב הוא חלק מההתערבות: קובעים פגישת מעקב כבר במשוב. התערבות דיאגנוסטית – תפיסת האבחון כולו (ראיונות, מפגשים, משוב, דו\"ח ומעקב) כהתערבות המחוללת שינוי, ולא רק כאיסוף מידע. שאלת אבחון – שאלה ספציפית, שגובשה עם המורה, ההורים והילד, המכוונת את תכנון האבחון. \"תלבושת אחידה\" – חשיבה ממוקדת בטריה, שבה כל ילד עובר את אותה סוללת מבחנים. \"תפירת חליפה אבחונית\" – תכנון אבחון לפי השערות הנגזרות משאלות האבחון, עם דגש יחסי על היכולות הרלוונטיות. השערות – ניבוי מוקדם אילו יכולות קוגניטיביות/רגשיות יהיו נמוכות או גבוהות; נבדקות (ואולי מוטב – מופרכות) במפגש הראשון. בדיקה ראשונית – המפגש הראשון: ראיון עם הילד, בדיקה ראשונית של תחומי הישג (רק לפי הצורך) ושל יכולות קוגניטיביות לפי ההשערות. העמקה – המפגש השני, המתוכנן לפי השאלות שנותרו פתוחות (למשל מבחן שלישי כששני מבחנים לא עלו בקנה אחד). אינטגרציה – גיבוש התשובה לשאלות האבחון, \"עמוד השדרה\" של המשוב והדו\"ח, בחמישה–עשרה משפטים. משוב כמפגש בין מומחים – משוב דיאלוגי שבו כל צד מביא את ה\"תיאוריה\" שלו על הבעיה, ומגיעים להבנה משותפת ולתכנית עבודה. הילד כשותף – הילד משתתף בתהליך הגילוי על עצמו, ומחשבותיו ואבחנותיו על עצמו הן מידע מבוקש. יכולת פלואידית וידע מגובש – יכולות קוגניטיביות שאליהן מכוונות שאלות האבחון בדוגמת ילד הגן; תפקודים ניהוליים הם חלק מהיכולת הפלואידית. תפקודים ניהוליים \"חמים\" ו\"קרים\" – קושי בהתאפקות ובדחיית סיפוקים קשור לתפקודים \"חמים\"; אינהיביציה קוגניטיבית – ל\"קרים\"."},{"id":"gantz2016","title":"פסיכותרפיה במרחבי הפסיכולוגיה החינוכית","authors":"ירדנה גנץ","year":"2016","cite":"גנץ, י' (ינואר, 2016). פסיכותרפיה במרחבי הפסיכולוגיה החינוכית. פסיכואקטואליה, 15-21.","url":"https://www.psychology.org.il/sites/psycho/UserContent/files/psychotherapy1_01_2016.pdf","kind":"article","desc":null,"urlLabel":"המאמר באתר הסתדרות הפסיכולוגים (PDF)","file":{"orig":"פסיכותרפיה במרחב הפסיכולוגיה החינוכית.pdf","ext":"pdf","pdf":"gantz2016.pdf","pages":7,"bytes":148557},"placements":[["s1","therapy"]],"extra":false,"ref":"גנץ 2016","inFolder":true,"srcTitle":"פסיכותרפיה במרחבי הפסיכולוגיה החינוכית","secs":{"abstract":"<p>המאמר מבקש להגדיר מה ייחודי בפסיכותרפיה שמתקיימת בקליניקה של הפסיכולוג החינוכי, כלומר בחדר הטיפולים בשפ\"ח או בקליניקה פרטית. הוא נפתח בקריאה ביקורתית בתיאור של אוגדן על טיפול אנליטי במטופלת אנורקטית (\"ת'\"): כעבור שמונה שנים של פגישות יומיות נבט רק עכשיו \"זרע\" של שינוי, ועל חייה הממשיים של המטופלת כמעט לא ידוע דבר. גנץ נשענת על מושג המרחב הפוטנציאלי של ויניקוט ואוגדן ומציעה \"ציר דמיוני\" שבין קוטב המציאות החיצונית לקוטב העולם הפנימי. לטענתה, הקליניקה של הפסיכולוגיה החינוכית יוצרת מרחב טיפולי במתח דיאלקטי גבוה, ששני הקטבים נוכחים בו בעוצמה. ארבעה גורמים יוצרים את המרחב הזה: המטופל הוא תמיד \"אדם בתפקיד\"; ההקשר החינוכי מכוון לתפקוד ולהתפתחות; המטפל נע בין הפרט למערכת ובין הקליניקה לשדה; והקליניקה \"אינה סטרילית\". את המתח הזה היא מדגימה דרך מושג הזמן: \"החזקה בזמן\" (אוגדן), \"זמן אמא\" מול \"זמן אבא\" ומחויבות ל\"זמן-ילד\". המאמר מסתיים בשלושה נתיבים לפיתוח הידע המקצועי ובשאלות שמבקשות לתרגם מושגים דינמיים לעבודה בשפ\"ח.<\/p>","ideas":"<ul>\n<li>יש שלוש הגדרות אפשריות לפסיכותרפיה בפסיכולוגיה החינוכית: (1) קליניקה רב-מערכתית בנקודת החיתוך שבין הפרט, המשפחה ומערכת החינוך; (2) קליניקה כאיכות של חשיבה דינמית שהפסיכולוג הפנים, והיא מלווה אותו גם בעבודה מערכתית, באבחון ובחירום; (3) קליניקה במובן המסורתי של חדר טיפולים. המאמר מרחיב ומחדד את ההגדרה השלישית.<\/li>\n<li>המרחב הפוטנציאלי נמצא בין פנטזיה שמנותקת מהמציאות לבין הוויה רפלקטיבית ש\"אוחזת נואשות\" במציאות. הפתולוגיה היא קריסה לאחד הקטבים. מי שקורס לקוטב המציאות מאבד את הדמיון, את היכולת לשחק ואת תחושת החיות. מי שקורס לקוטב הפנטזיה מאבד את האחיזה במציאות.<\/li>\n<li>שיקום המרחב הפוטנציאלי הוא מוקד הטיפול, ובאותו זמן זה המרחב שבתוכו הטיפול מתקיים. הוא נפרש בין הסימפטום לדינמיקה שבבסיסו, בין הפרעת ההתנהגות לבין תוויות \"השיגעון והרוע\", בין ההווה לעבר ובין המטפל למטופל.<\/li>\n<li>אפשר למקם טיפולים שונים על ציר שבין קוטב המציאות החיצונית לקוטב העולם הפנימי. בקליניקה של הפסיכולוג החינוכי יש פוטנציאל למרחב \"במתח דיאלקטי גבוה, עם קיום דומיננטי של שני הקטבים\".<\/li>\n<li>בשפ\"ח מטופלות שלוש אוכלוסיות: הורים, אנשי חינוך ותלמידים, וכולם \"אנשים בתפקיד\". לקיום הכפול הזה (ממלא תפקיד במציאות ואדם עם עולם פנימי) צריך טיפול שנותן מקום לשני הרבדים. מענה ייעוצי או התנהגותי בלבד נבנה על \"קרקע רעועה\", וצלילה דינמית בלבד משאירה את המטופל בלי כלים לתפקידו, כמו ב\"בועה אוטיסטית\".<\/li>\n<li>ההקשר החינוכי עוסק בהתפתחות, למידה ומדידה. בניגוד למערכת הבריאות הוא אינו מציע \"פסק זמן\" מהחיים, ויש בו ציפייה מובהקת לתפקוד שוטף. בשביל הפסיכולוג החינוכי מערכת החינוך היא גם הקשר וגם שדה עבודה נוסף, מקביל ובו-זמני.<\/li>\n<li>הפסיכולוג החינוכי חי ב\"לולאה מוזרה\" (כמו הנמלים של אשר על טבעת מביוס). שאלות כמו בחירת המטופל, אופן ההקשבה, המטרות, מידת האקטיביות ומשך הטיפול עלולות להיטשטש בין שירות לפרט לבין שירות למערכת. השאלות האלה עלולות להוביל לחוסר אונים, אבל הן יכולות גם לעודד דיאלקטיקה אקטיבית וזהירה.<\/li>\n<li>הקליניקה \"אינה סטרילית\". הפסיכולוג מגיע עם \"זיכרון\" (מידע מהשדה), עם \"תשוקה\" (נורמות של התפתחות ותפקוד) ועם \"הבנה\" (גורמים שמשבשים תפקוד ובונים חוסן). לצד כל אלה עליו להצטייד ב\"אי ידיעה\". כלפי פנים, דפנות הקליניקה מגבילות את ההכלה וגם מגבות אותה. כלפי חוץ, הגבולות צריכים להיות איתנים מול לחצי הסביבה וחדירים לעקרון המציאות.<\/li>\n<li>הזמן בילדות קצר, כי הוא מחולק לשלבים התפתחותיים עמוסי משימות. הוא גם ארוך, כי בחוויה הפנימית של הילד הסבל הוא אינסופי. מכאן נגזרת מחויבות ל\"זמן-ילד\": לא בהכרח טיפול קצר, אלא טיפול שמחויב גם לשינוי בתפקוד בטווח הקצר. התנועה הטיפולית מתקיימת לא רק מבפנים החוצה אלא גם מבחוץ פנימה.<\/li>\n<li>לפי אוגדן, ההחזקה המוקדמת של האם מבודדת את התינוק מ\"אחרות הזמן\", ובהדרגה התינוק מפנים את פונקציית ההחזקה בזמן. הפסיכולוגיה החינוכית פונה לרבדים התפתחותיים גבוהים ומעבריים יותר. לכן היא אינה מרחיקה את המציאות והזמן מהטיפול, אלא \"מזמינה אותם פנימה בכבוד\" כדי שהמטופל לא יישאר איתם לבד.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>מרחב פוטנציאלי<\/strong> – מושג של ויניקוט שאוגדן פירש. זה האזור שבו מתקיימים רוב חיי הנפש הבריאה (משחק, יצירה, תופעות מעבר, משמעות אישית, חלימה), בין פנטזיה מנותקת לבין אחיזה נוקשה במציאות. זו \"ממלכת הסמלים\".<\/li>\n<li><strong>הסמלה<\/strong> – ייצוג של מציאות \"אובייקטיבית\" באמצעות מושג \"סובייקטיבי\" שטעון במשמעות מציאותית. בין המסומל לסמל קיים מתח דיאלקטי שמונע קריסה לאחד הקטבים.<\/li>\n<li><strong>מתח דיאלקטי גבוה<\/strong> – מצב שבו שני הקטבים, העולם הפנימי והמציאות החיצונית, נוכחים בעוצמה במרחב הטיפולי בלי קריסה, התערבבות או נתק. לפי המאמר, זה מה שמאפיין את הקליניקה החינוכית.<\/li>\n<li><strong>אדם בתפקיד<\/strong> – המכנה המשותף של הורים, אנשי חינוך ותלמידים. לכל אחד מהם יש רכיב אובייקטיבי של ממלא תפקיד (מציאות חיצונית) ורכיב סובייקטיבי של אדם (עולם פנימי).<\/li>\n<li><strong>מיהו הלקוח<\/strong> – לפי המחברת, התלמיד הוא \"לקוח הקצה\". עם זאת, מרגע שהורה או מורה נכנסים לטיפול, גם אם הם ממלאים פונקציה עבור אחר, \"הוא הוא הקליינט\".<\/li>\n<li><strong>טבעת מביוס / \"לולאה מוזרה\"<\/strong> – מטפורה לטשטוש בין פנים לחוץ, בין פרט למערכת ובין דמות לרקע, בחוויית הפסיכולוג החינוכי.<\/li>\n<li><strong>קליניקה לא סטרילית<\/strong> – קליניקה שאינה \"נטולת תשוקה, זיכרון או הבנה\" (ביון), אלא מגיעה עם מידע מהשדה, עם נורמות של תפקוד ועם הבנה דינמית, ולצידם אי ידיעה.<\/li>\n<li><strong>החזקה בזמן<\/strong> (אוגדן) – פונקציה של ההחזקה ההורית המוקדמת. האם סופגת את \"אחרות הזמן\" ויוצרת אשליה של עולם שבו הזמן נמדד במקצבי התינוק. בהמשך הפונקציה מופנמת.<\/li>\n<li><strong>\"זמן אמא\" ו\"זמן אבא\"<\/strong> (מאן וגולדמן) – הזמן הילדי והנצחי מול הזמן הבוגר והמציאותי. בין השניים מתקיים מתח דיאלקטי.<\/li>\n<li><strong>זמן-ילד<\/strong> – מחויבות הקליניקה החינוכית לקצב ההתפתחות של הילד. ההמתנה להבשלה איטית של תהליכים פנימיים עלולה להיות מחירה הצטברות פערים.<\/li>\n<li><strong>מהלכים \"מבחוץ כלפי פנים\"<\/strong> – התערבויות שמכוונות לשינוי במציאות ומשלימות את העבודה הדינמית.<\/li>\n<\/ul>","models":"<p><strong>שלוש הגדרות לפסיכותרפיה במרחבי הפסיכולוגיה החינוכית:<\/strong><\/p>\n<ol>\n<li>קליניקה רב-מערכתית: בנקודת החיתוך, ואולי האיחוד, של הפרט, המשפחה ומערכת החינוך. הטיפול מתקיים בו-זמנית עם כל אחת מהמערכות.<\/li>\n<li>קליניקה כאיכות של חשיבה דינמית מעמיקה שהפסיכולוג הפנים. היא מלווה כל התערבות, כולל עבודה מערכתית, אבחון ומצבי חירום.<\/li>\n<li>קליניקה במובן המסורתי: סטינג של חדר טיפולים בשפ\"ח או בקליניקה פרטית, כשהמטפל פסיכולוג חינוכי. זו ההגדרה שהמאמר מרחיב.<\/li>\n<\/ol>\n<p><strong>ארבעת הגורמים שמגדירים את המרחב הטיפולי הייחודי:<\/strong><\/p>\n<ol>\n<li>מאפייני המטופלים: \"אדם בתפקיד\".<\/li>\n<li>איכויות ההקשר החינוכי: סביבה נורמטיבית, אינטנסיבית ותובענית, עם ציפייה לתפקוד שוטף, מתפתח ואחיד למדי.<\/li>\n<li>מורכבות עמדת המטפל: תנועה בין הפרט למערכת ובין הקליניקה לשדה, פנימית (במיינד) וחיצונית (גיאוגרפית).<\/li>\n<li>ייחודיות מקומה של הקליניקה: סטינג לא סטרילי שממוקם בשדה המערכתי.<\/li>\n<\/ol>\n<p><strong>התפתחות המרחב הפוטנציאלי (לפי המאמר):<\/strong><\/p>\n<ol>\n<li>אשליית אחדות בין התינוק לסביבה האמהית הבלתי מורגשת.<\/li>\n<li>\"היות שניים\": תחילת ההיפרדות והתהוות מרחב חיצוני בין התינוק לאמו.<\/li>\n<li>\"היות שלושה\": עצמי, אחר והזיקה האינטר-סובייקטיבית ביניהם; עולם פנימי סמוי, מציאות חיצונית גלויה ומרחב תמרון סובייקטיבי ביניהם.<\/li>\n<\/ol>\n<p><strong>שתי צורות של קריסה פתולוגית:<\/strong><\/p>\n<ul>\n<li>קריסה לקוטב המציאות: אחיזה במציאות, הפקעת הדמיון, אובדן יכולת המשחק וירידה בחיות.<\/li>\n<li>קריסה לקוטב הפנטזיה: חיים בעולם הפנטזיות או הישענות על פרשנויות לא יעילות, ואובדן האחיזה במציאות.<\/li>\n<\/ul>\n<p><strong>איך מטופלים בשפ\"ח \"כלואים במחוזות הדברים כשלעצמם\" (דוגמאות מהמאמר):<\/strong><\/p>\n<ul>\n<li>תלמיד עם בעיות התנהגות שחווה את עצמו כ\"רע\", \"משוגע\", חריג ואבוד.<\/li>\n<li>הורים שחווים את עצמם כנכשלים, חסרי אונים, מואשמים על ידי מערכת החינוך וקורבנות לילד.<\/li>\n<li>מורה שחווה את עצמו כבלתי כשיר וחלש מול תלמיד מתנגד ופגוע ומול הורים תוקפניים.<\/li>\n<\/ul>\n<p><strong>\"זיכרון, תשוקה והבנה\" בגרסה של הקליניקה החינוכית:<\/strong><\/p>\n<ul>\n<li>זיכרון = מידע שנאסף מהשדה.<\/li>\n<li>תשוקה = נורמות של התפתחות ותפקוד מצופים.<\/li>\n<li>הבנה = גורמים דינמיים שמשבשים תפקוד ובונים חוסן.<\/li>\n<li>ולצידם: אי ידיעה ופתיחות ללמוד מהמטופל (אוגדן).<\/li>\n<\/ul>\n<p><strong>מהלכים טיפוליים \"מבחוץ כלפי פנים\":<\/strong><\/p>\n<ol>\n<li>התעניינות של המטפל בתהליך השינוי במציאות החיים.<\/li>\n<li>בחינה משותפת של יכולת המטופל לתרגם תהליכים דינמיים להתנהגויות במציאות חייו.<\/li>\n<li>הצעה של ליווי מתמשך במלאכת התרגום.<\/li>\n<li>עבודה על מיומנויות קוגניטיביות, התנהגותיות או בין-אישיות.<\/li>\n<\/ol>\n<p><strong>היבטים שצריכים לקבל \"מקום של כבוד\" במרחב הטיפולי (לצד העולם הפנימי):<\/strong> גיל המטופל, הסימפטומים, הכוחות, הקשרים המשפחתיים והחברתיים, העבודה או הלימודים, מידת העצמאות וקצב ההתקדמות.<\/p>\n<p><strong>שלושה נתיבים להמשך התפתחות החוכמה המקצועית:<\/strong><\/p>\n<ol>\n<li>המשך רכישה של כישורים טיפוליים דינמיים ומכווני שינוי, ופיתוח דרכים לבטא אותם באופן משלים. יש כאן סיכון ל\"בינוניות (עד כדי רשלנות)\" (\"תפסת מרובה לא תפסת\"), וגם סיכוי לרווח מקצועי משמעותי.<\/li>\n<li>אימוץ גישות שפונות לאזורי הביניים המעבריים: פסיכולוגיית העצמי של קוהוט, הגישה הנרטיבית של וייט ומנטליזציה (פונגי).<\/li>\n<li>פיתוח ידע שממיר מושגים דינמיים מהקליניקה הפסיכואנליטית למושגים שישמשו את הקליניקה החינוכית.<\/li>\n<\/ol>\n<p><strong>דוגמאות לשאלות תרגום (נתיב 3), כפי שהן מופיעות במאמר:<\/strong><\/p>\n<ul>\n<li>איך להשתמש באינטראקציות מכיל-מוכל בטיפול בילד עם בעיות התנהגות?<\/li>\n<li>איך לבצע החזקה בזמן בטיפול במתבגר שמגלה אמביוולנטיות כלפי הטיפול?<\/li>\n<li>איך להיעזר במושגים הרס האובייקט ושימוש באובייקט כדי להבין יחסים בין בת מתבגרת זועמת ותוקפת לאם מפוחדת ומרצה?<\/li>\n<li>איך להשתמש בהעברה ובהעברה נגדית בטיפול במורה שמעורר תחושות של שיפוט וניכור?<\/li>\n<li>איך להשתמש בהזדהות השלכתית בטיפול בהורות, כשבמטפלת מתעוררות תחושות של חוסר ערך, כישלון וחוסר אונים?<\/li>\n<\/ul>","practice":"<ul>\n<li>בתחילת כל טיפול שאל/י במפורש: \"מיהו הלקוח?\" ובשירות של מי נקבעים בחירת המטופל, המטרות, מידת האקטיביות ומשך הטיפול: הפרט או המערכת? נסח/י את התשובה לעצמך.<\/li>\n<li>כשמטופל הוא הורה או מורה, התייחס/י גם לתפקיד וגם לאדם. הימנע/י מהדרכה טכנית בלבד, וגם מצלילה לעולם הפנימי שמתעלמת מהתפקוד שלו מחר בבוקר.<\/li>\n<li>הגדר/י גם מטרות תפקודיות קצרות טווח לצד תהליך דינמי ארוך יותר. שאל/י באופן שוטף מה השתנה בבית או בכיתה, ועזור/י למטופל לתרגם תובנות להתנהגות.<\/li>\n<li>היה/י ער/ה לקצב: אצל ילדים, המתנה ממושכת להבשלה של תהליך הורי עלולה להיות כרוכה בהצטברות פערים. ל\"זמן-ילד\" יש משקל טיפולי.<\/li>\n<li>השתמש/י במידע מהשדה (מורים, צוות, נורמות התפתחותיות) כ\"זיכרון\" ו\"תשוקה\" לגיטימיים, ובאותו זמן שמור/י על עמדה של אי ידיעה מול מה שמתגלה בחדר.<\/li>\n<li>הגן/י על פרטיות הקליניקה מפני לחצי המערכת, אבל אפשר/י לעקרון המציאות לחלחל פנימה. זהה/י את \"נקודות המעבר\" שבהן מרכז הכובד עובר מזהות פרטנית לזהות מערכתית.<\/li>\n<li>מול צוות בית הספר: הבע/י אמפתיה לציפייה לשינוי מהיר, ובו-זמנית הדוף/י את הלחץ לתוצאות מיידיות וגייס/י הכלה לקצב האישי של המטופל.<\/li>\n<li>בהצגת מקרה או בתיעוד, ודא/י שמופיעים נתוני המציאות של המטופל (גיל, תפקוד, קשרים, לימודים). זו בדיוק הביקורת של המחברת על תיאור המקרה של אוגדן.<\/li>\n<\/ul>","questions":"<ol>\n<li>בטיפול הנוכחי שלי, איפה הייתי ממקם/ת את המרחב הטיפולי על הציר שבין המציאות החיצונית לעולם הפנימי? האם יש סימנים לקריסה לאחד הקטבים?<\/li>\n<li>מי הלקוח בטיפול הזה, ואילו החלטות טיפוליות (מטרות, משך, אקטיביות) התקבלו בפועל כדי לשרת את המערכת ולא את הפרט, או להפך?<\/li>\n<li>איך אני מחזיק/ה את \"זמן אמא\" ואת \"זמן אבא\" בטיפול הזה? איפה אני מרגיש/ה לחץ לתוצאות, ואיפה אני אולי נמנע/ת מלהזמין את המציאות פנימה?<\/li>\n<li>אילו מהלכים \"מבחוץ כלפי פנים\" (תרגול מיומנויות, ליווי בתרגום תובנות) יכולים להשלים את העבודה הדינמית בלי לבטל אותה?<\/li>\n<li>איך אוכל לתרגם מושג דינמי אחד (מכיל-מוכל, הזדהות השלכתית, החזקה בזמן) לעבודה עם ההורה או המורה שאני מטפל/ת בהם?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"בקליניקה של הפסיכולוגיה החינוכית מטופלות שלוש אוכלוסיות: הורים, אנשי חינוך ותלמידים. המשותף ביניהם שבכולם מתקיים אדם בתפקיד.\"<\/li>\n<li>\"לפסיכולוג החינוכי אין את הלגיטימציה לצלול למעמקי העולם הפנימי, ללא מגבלות זמן וללא מחויבות למציאות, שכן מטופליו הם אנשים מתפקדים, גם כשהם בעלי צרכים מיוחדים, ועליו לאחוז בחבל בשני קצותיו.\"<\/li>\n<li>\"הקליניקה של הפסיכולוגיה החינוכית, הממוקמת באופן זה או אחר בשדה המערכתי, אינה סטרילית.\"<\/li>\n<li>\"בקליניקה החינוכית, שבה למציאות קיום משמעותי, מתקיימת מחויבות לזמן-ילד. אין זה אומר טיפול קצר טווח בהכרח.\"<\/li>\n<\/ul>"},"level":"שנים ב'-ג' (רעיונות היסוד – \"אדם בתפקיד\", \"מיהו הלקוח\", \"זמן-ילד\" – מתאימים כבר לשנה א')","stype":"מאמר","tldr":"המאמר מבקש להגדיר מה ייחודי בפסיכותרפיה שמתקיימת בקליניקה של הפסיכולוג החינוכי, כלומר בחדר הטיפולים בשפ\"ח או בקליניקה פרטית. הוא נפתח בקריאה ביקורתית בתיאור של אוגדן על טיפול אנליטי במטופלת אנורקטית (\"ת'\"): כעבור שמונה שנים של פגישות יומיות נבט רק…","search":"המאמר מבקש להגדיר מה ייחודי בפסיכותרפיה שמתקיימת בקליניקה של הפסיכולוג החינוכי, כלומר בחדר הטיפולים בשפ\"ח או בקליניקה פרטית. הוא נפתח בקריאה ביקורתית בתיאור של אוגדן על טיפול אנליטי במטופלת אנורקטית (\"ת'\"): כעבור שמונה שנים של פגישות יומיות נבט רק עכשיו \"זרע\" של שינוי, ועל חייה הממשיים של המטופלת כמעט לא ידוע דבר. גנץ נשענת על מושג המרחב הפוטנציאלי של ויניקוט ואוגדן ומציעה \"ציר דמיוני\" שבין קוטב המציאות החיצונית לקוטב העולם הפנימי. לטענתה, הקליניקה של הפסיכולוגיה החינוכית יוצרת מרחב טיפולי במתח דיאלקטי גבוה, ששני הקטבים נוכחים בו בעוצמה. ארבעה גורמים יוצרים את המרחב הזה: המטופל הוא תמיד \"אדם בתפקיד\"; ההקשר החינוכי מכוון לתפקוד ולהתפתחות; המטפל נע בין הפרט למערכת ובין הקליניקה לשדה; והקליניקה \"אינה סטרילית\". את המתח הזה היא מדגימה דרך מושג הזמן: \"החזקה בזמן\" (אוגדן), \"זמן אמא\" מול \"זמן אבא\" ומחויבות ל\"זמן-ילד\". המאמר מסתיים בשלושה נתיבים לפיתוח הידע המקצועי ובשאלות שמבקשות לתרגם מושגים דינמיים לעבודה בשפ\"ח. יש שלוש הגדרות אפשריות לפסיכותרפיה בפסיכולוגיה החינוכית: (1) קליניקה רב-מערכתית בנקודת החיתוך שבין הפרט, המשפחה ומערכת החינוך; (2) קליניקה כאיכות של חשיבה דינמית שהפסיכולוג הפנים, והיא מלווה אותו גם בעבודה מערכתית, באבחון ובחירום; (3) קליניקה במובן המסורתי של חדר טיפולים. המאמר מרחיב ומחדד את ההגדרה השלישית. המרחב הפוטנציאלי נמצא בין פנטזיה שמנותקת מהמציאות לבין הוויה רפלקטיבית ש\"אוחזת נואשות\" במציאות. הפתולוגיה היא קריסה לאחד הקטבים. מי שקורס לקוטב המציאות מאבד את הדמיון, את היכולת לשחק ואת תחושת החיות. מי שקורס לקוטב הפנטזיה מאבד את האחיזה במציאות. שיקום המרחב הפוטנציאלי הוא מוקד הטיפול, ובאותו זמן זה המרחב שבתוכו הטיפול מתקיים. הוא נפרש בין הסימפטום לדינמיקה שבבסיסו, בין הפרעת ההתנהגות לבין תוויות \"השיגעון והרוע\", בין ההווה לעבר ובין המטפל למטופל. אפשר למקם טיפולים שונים על ציר שבין קוטב המציאות החיצונית לקוטב העולם הפנימי. בקליניקה של הפסיכולוג החינוכי יש פוטנציאל למרחב \"במתח דיאלקטי גבוה, עם קיום דומיננטי של שני הקטבים\". בשפ\"ח מטופלות שלוש אוכלוסיות: הורים, אנשי חינוך ותלמידים, וכולם \"אנשים בתפקיד\". לקיום הכפול הזה (ממלא תפקיד במציאות ואדם עם עולם פנימי) צריך טיפול שנותן מקום לשני הרבדים. מענה ייעוצי או התנהגותי בלבד נבנה על \"קרקע רעועה\", וצלילה דינמית בלבד משאירה את המטופל בלי כלים לתפקידו, כמו ב\"בועה אוטיסטית\". ההקשר החינוכי עוסק בהתפתחות, למידה ומדידה. בניגוד למערכת הבריאות הוא אינו מציע \"פסק זמן\" מהחיים, ויש בו ציפייה מובהקת לתפקוד שוטף. בשביל הפסיכולוג החינוכי מערכת החינוך היא גם הקשר וגם שדה עבודה נוסף, מקביל ובו-זמני. הפסיכולוג החינוכי חי ב\"לולאה מוזרה\" (כמו הנמלים של אשר על טבעת מביוס). שאלות כמו בחירת המטופל, אופן ההקשבה, המטרות, מידת האקטיביות ומשך הטיפול עלולות להיטשטש בין שירות לפרט לבין שירות למערכת. השאלות האלה עלולות להוביל לחוסר אונים, אבל הן יכולות גם לעודד דיאלקטיקה אקטיבית וזהירה. הקליניקה \"אינה סטרילית\". הפסיכולוג מגיע עם \"זיכרון\" (מידע מהשדה), עם \"תשוקה\" (נורמות של התפתחות ותפקוד) ועם \"הבנה\" (גורמים שמשבשים תפקוד ובונים חוסן). לצד כל אלה עליו להצטייד ב\"אי ידיעה\". כלפי פנים, דפנות הקליניקה מגבילות את ההכלה וגם מגבות אותה. כלפי חוץ, הגבולות צריכים להיות איתנים מול לחצי הסביבה וחדירים לעקרון המציאות. הזמן בילדות קצר, כי הוא מחולק לשלבים התפתחותיים עמוסי משימות. הוא גם ארוך, כי בחוויה הפנימית של הילד הסבל הוא אינסופי. מכאן נגזרת מחויבות ל\"זמן-ילד\": לא בהכרח טיפול קצר, אלא טיפול שמחויב גם לשינוי בתפקוד בטווח הקצר. התנועה הטיפולית מתקיימת לא רק מבפנים החוצה אלא גם מבחוץ פנימה. לפי אוגדן, ההחזקה המוקדמת של האם מבודדת את התינוק מ\"אחרות הזמן\", ובהדרגה התינוק מפנים את פונקציית ההחזקה בזמן. הפסיכולוגיה החינוכית פונה לרבדים התפתחותיים גבוהים ומעבריים יותר. לכן היא אינה מרחיקה את המציאות והזמן מהטיפול, אלא \"מזמינה אותם פנימה בכבוד\" כדי שהמטופל לא יישאר איתם לבד. מרחב פוטנציאלי – מושג של ויניקוט שאוגדן פירש. זה האזור שבו מתקיימים רוב חיי הנפש הבריאה (משחק, יצירה, תופעות מעבר, משמעות אישית, חלימה), בין פנטזיה מנותקת לבין אחיזה נוקשה במציאות. זו \"ממלכת הסמלים\". הסמלה – ייצוג של מציאות \"אובייקטיבית\" באמצעות מושג \"סובייקטיבי\" שטעון במשמעות מציאותית. בין המסומל לסמל קיים מתח דיאלקטי שמונע קריסה לאחד הקטבים. מתח דיאלקטי גבוה – מצב שבו שני הקטבים, העולם הפנימי והמציאות החיצונית, נוכחים בעוצמה במרחב הטיפולי בלי קריסה, התערבבות או נתק. לפי המאמר, זה מה שמאפיין את הקליניקה החינוכית. אדם בתפקיד – המכנה המשותף של הורים, אנשי חינוך ותלמידים. לכל אחד מהם יש רכיב אובייקטיבי של ממלא תפקיד (מציאות חיצונית) ורכיב סובייקטיבי של אדם (עולם פנימי). מיהו הלקוח – לפי המחברת, התלמיד הוא \"לקוח הקצה\". עם זאת, מרגע שהורה או מורה נכנסים לטיפול, גם אם הם ממלאים פונקציה עבור אחר, \"הוא הוא הקליינט\". טבעת מביוס / \"לולאה מוזרה\" – מטפורה לטשטוש בין פנים לחוץ, בין פרט למערכת ובין דמות לרקע, בחוויית הפסיכולוג החינוכי. קליניקה לא סטרילית – קליניקה שאינה \"נטולת תשוקה, זיכרון או הבנה\" (ביון), אלא מגיעה עם מידע מהשדה, עם נורמות של תפקוד ועם הבנה דינמית, ולצידם אי ידיעה. החזקה בזמן (אוגדן) – פונקציה של ההחזקה ההורית המוקדמת. האם סופגת את \"אחרות הזמן\" ויוצרת אשליה של עולם שבו הזמן נמדד במקצבי התינוק. בהמשך הפונקציה מופנמת. \"זמן אמא\" ו\"זמן אבא\" (מאן וגולדמן) – הזמן הילדי והנצחי מול הזמן הבוגר והמציאותי. בין השניים מתקיים מתח דיאלקטי. זמן-ילד – מחויבות הקליניקה החינוכית לקצב ההתפתחות של הילד. ההמתנה להבשלה איטית של תהליכים פנימיים עלולה להיות מחירה הצטברות פערים. מהלכים \"מבחוץ כלפי פנים\" – התערבויות שמכוונות לשינוי במציאות ומשלימות את העבודה הדינמית."},{"id":"playbook","title":"הספר הראשון שלי על טיפול במשחק","authors":"מרק נמירוף וג'יין אנונציאטה","year":"1990","cite":"Nemiroff, M. A. & Annunziata, J. (1990). A Child's First Book About Play Therapy. APA. (ספר ילדים, עם תרגום עברי)","url":null,"kind":"book","desc":null,"file":{"orig":"הספר הראשון שלי בטיפול במשחק.pdf","ext":"pdf","pdf":"playbook.pdf","pages":56,"bytes":2138541},"placements":[["s1","therapy"]],"extra":false,"ref":"הספר הראשון על טיפול במשחק","inFolder":true,"srcTitle":"הספר הראשון שלי על טיפול במשחק (A Child's First Book About Play Therapy)","secs":{"abstract":"<p>זהו ספר ילדים מאויר בשחור-לבן שנועד להסביר לילדים בני 4 עד 7 בערך, שנשקל עבורם טיפול פסיכולוגי, מה זה טיפול במשחק. אפשר להקריא אותו לילד, או לקרוא אותו יחד עם ילד שכבר קורא. בפתח הספר יש שתי הקדמות באנגלית: אחת להורים ולאפוטרופוסים, ואחת לאנשי מקצוע בבריאות הנפש. לפי ההקדמות, הטקסט משקף \"בשפה מאוד מפושטת\" את הגישה הפסיכודינמית של הכותבים לטיפול במשחק, ונכתב מנקודת המבט של המטופל הצעיר. הספר עובר בסדר כרונולוגי על מהלך הטיפול: אילו התנהגויות מעידות על \"בעיות\" (מריבות, קושי לחלוק, ביישנות, דאגה), למה צריך \"עזרה מיוחדת\", מי הם המטפלים (\"רופאי דאגות\"), ומה קורה בפנייה לטיפול (המטפל נפגש קודם עם ההורים, אחר כך עם הילד, ואז נבנית \"התוכנית\"). הוא מסביר גם את התדירות, את המפגשים עם ההורים, את הסודיות (\"סוד של כיוון אחד\"), את חדר הטיפול ואת הצעצועים, ואת האופן שבו המשחק עוזר להבין רגשות. הוא מכין את הילד לכך שלפעמים יהיה קשה ולא נעים להקשיב למטפל, לכך שהשיפור לוקח זמן, ולפרידה בסוף הטיפול, שבה הבעיות עשויות לחזור לזמן קצר.<\/p>","ideas":"<ul>\n<li><strong>נרמול הבעיה<\/strong>: הספר פותח בשאלה \"שמת לב שלפעמים יש לילדים בעיות?\", ומונה התנהגויות מוכרות (מריבות ומכות, קושי לחלוק ולחכות לתור, ביישנות וחשש מילדים אחרים, דאגה מתמדת). במקור האנגלי, \"Doing one of these things a lot\" הוא סימן לבעיה.<\/li>\n<li><strong>הגדרה פשוטה של בעיה<\/strong>: \"בעיה היא משהו שמדאיג אותך, או גורם לך להרגיש רע\". היא יכולה לגרום לרצות לבכות, להרביץ, או להיות \"לגמרי לגמרי לבד\".<\/li>\n<li><strong>למה צריך עזרה<\/strong>: הילדים \"לא יודעים מאיפה הבעיות האלה באו\", ולכן אינם מצליחים להיפטר מהן. לפעמים אמא או אבא יכולים לעזור, ולפעמים צריך \"עזרה מיוחדת\".<\/li>\n<li><strong>מי המטפל<\/strong>: \"עוזרים מסוג מיוחד\". יש שקוראים להם \"רופאי דאגות\", אבל שמם האמיתי \"מטפלים\". הם עוזרים לילדים \"ללמוד על דאגות ורגשות שגורמים לבעיות להופיע\". זו המילה הגדולה הראשונה בספר.<\/li>\n<li><strong>מענה לפחדים לפני הטיפול<\/strong>: הספר מעלה את חששות הילד (\"האם הוא ידבר כמו המורה שלי?\", \"האם היא תיתן לי זריקה כמו הרופאה?\", \"האם אני אלך לגמרי לבדי?\") ועונה עליהם דרך תיאור התהליך.<\/li>\n<li><strong>שלושה שלבים לכניסה לטיפול<\/strong>: המטפל נפגש קודם עם ההורים כדי להבין את הבעיות, אחר כך ההורים מביאים את הילד, ואז ההורים והמטפל מתכננים יחד את הדרך הטובה לעזור (\"התוכנית!\").<\/li>\n<li><strong>המסגרת<\/strong>: בדרך כלל פעם או פעמיים בשבוע. הילד מדבר עם המטפל לבד, ומותר לו לדבר על \"כל מה שתרצה\".<\/li>\n<li><strong>ההורים חלק מהטיפול<\/strong>: ההורים נפגשים מדי פעם עם המטפל. \"הבעיות של ילדים עוברות מהר יותר כשגם ההורים נפגשים עם המטפל\". ההורים עוזרים למטפל להבין את הילד, והמטפל מלמד אותם דרכים חדשות לעזור.<\/li>\n<li><strong>סודיות היא \"סוד של כיוון אחד\"<\/strong>: זו המילה הגדולה השנייה בספר. מטפלים לא מספרים לאף אחד על הרעיונות והרגשות שהילד עובד עליהם, אבל הילד רשאי לספר עליהם אם הוא רוצה.<\/li>\n<li><strong>ההיגיון של טיפול במשחק<\/strong>: \"ילדים יודעים לשחק את הרגשות שלהם יותר בקלות מאשר לדבר עליהם\". המטפל מבין את הרגשות והדאגות דרך המשחק. יש רגשות \"שהם אפילו לא ידעו שיש להם\", וכשהילדים מבינים אותם, הבעיות משתפרות.<\/li>\n<li><strong>מה עושה המטפל<\/strong>: מקשיב, מתבונן, מבין, לפעמים משחק גם, מפענח רגשות ומשוחח עליהם עם הילד.<\/li>\n<li><strong>הכנה לקושי ולהתנגדות<\/strong>: בטיפול ילדים מרגישים סקרנים, מבולבלים, עצובים, כועסים, שמחים ועוד. לפעמים הם לא אוהבים להקשיב למטפל, במיוחד כשהם כועסים, עצובים או מבולבלים, \"אבל זה בסדר\". ככל שמדברים יותר על הרגשות, הבעיות נהיות \"קטנות ויותר ויותר קטנות\". זה קשה ולוקח זמן, אבל \"בסופו של דבר ילדים מרגישים יותר טוב!\".<\/li>\n<li><strong>סיום ופרידה<\/strong>: הפרידה מהמטפל, \"העוזר המיוחד\" ו\"חבר מיוחד\", יכולה להיות קשה ומפחידה, כי היא \"כמו להגיד להתראות להרבה זמן\". בסוף יש רגשות חשובים לדבר עליהם, ולפעמים הבעיות חוזרות קצת, \"אבל רק לקצת זמן\". שלב הסיום נמשך בדרך כלל כמה שבועות.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>טיפול במשחק (Play Therapy)<\/strong> – טיפול שבו הילד משחק, מדבר ומצייר, והמטפל מבין דרך המשחק את הרגשות ואת הדאגות שגורמים לבעיות. בספר הגישה מוצגת כפסיכודינמית.<\/li>\n<li><strong>בעיה<\/strong> – בלשון הספר: \"משהו שמדאיג אותך, או גורם לך להרגיש רע\". בהקדמה להורים: \"presenting problems\", כלומר הבעיות המוצגות.<\/li>\n<li><strong>מטפל (\"רופא דאגות\")<\/strong> – עוזר מיוחד שעוזר לילדים ללמוד על הדאגות והרגשות שגורמים לבעיות.<\/li>\n<li><strong>התוכנית (The Plan)<\/strong> – התוכנית שההורים והמטפל בונים יחד אחרי מפגש ההיכרות.<\/li>\n<li><strong>סודיות (Confidentiality)<\/strong> – \"סוד של כיוון אחד\": המטפל שומר בסוד, והילד חופשי לספר.<\/li>\n<li><strong>רגשות לא מודעים<\/strong> – \"רגשות שהם אפילו לא ידעו שיש להם\". הבנתם מביאה לשיפור.<\/li>\n<li><strong>סיום הטיפול<\/strong> – פרידה ארוכה שמעוררת רגשות חשובים, ולעיתים חזרה זמנית של הבעיות (בהקדמה: temporary regression).<\/li>\n<li><strong>הפניה (referral)<\/strong> – הדרך שבה ילד נכנס לטיפול, כפי שמוגדרת בהקדמה להורים.<\/li>\n<\/ul>","models":"<p><strong>א. מבנה הספר (רצף הנושאים, לפי עמודי הספר)<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>עמ'<\/th>\n<th>נושא<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1-4<\/td>\n<td>כריכה, פרטי הוצאה, הקדמה להורים, הקדמה לאנשי מקצוע (באנגלית בלבד)<\/td>\n<\/tr>\n<tr>\n<td>5-8<\/td>\n<td>סימנים לבעיות: מריבות ומכות, קושי לחלוק ולחכות לתור, ביישנות וחשש, דאגה. \"בעיה היא משהו שמדאיג אותך...\"<\/td>\n<\/tr>\n<tr>\n<td>9-12<\/td>\n<td>למה צריך עזרה; \"לפעמים אמא או אבא יכולים לעזור, אבל לפעמים צריך עזרה מיוחדת\"; \"רופאי דאגות\" = מטפלים<\/td>\n<\/tr>\n<tr>\n<td>13-14<\/td>\n<td>חששות לפני הביקור: האם ידבר כמו המורה? האם תיתן זריקה כמו הרופאה? האם אלך לבד?<\/td>\n<\/tr>\n<tr>\n<td>15-19<\/td>\n<td>(1) המטפלת נפגשת עם ההורים, (2) ההורים מביאים את הילד, (3) ההורים והמטפלת מתכננים: \"התוכנית!\"<\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td>פעם או פעמיים בשבוע, לבד עם המטפל, מותר לדבר על הכול<\/td>\n<\/tr>\n<tr>\n<td>21-22<\/td>\n<td>ההורים נפגשים מדי פעם עם המטפלת, עוזרים לה להבין את הילד ולומדים דברים חדשים<\/td>\n<\/tr>\n<tr>\n<td>23-28<\/td>\n<td>\"זוכר שאמרנו שמותר לספר הכול?\" הסודיות: \"סוד של כיוון אחד\", \"אבל לילדים מותר לספר עליהם אם הם רוצים\"<\/td>\n<\/tr>\n<tr>\n<td>29-32<\/td>\n<td>מה יש בחדר הטיפול: צעצועים, חומרי יצירה ועוד (איורים של חדר משחק: בובות, כלי מטבח, קוביות, מכוניות, צבעים, דינוזאורים, ארגז חול)<\/td>\n<\/tr>\n<tr>\n<td>33-36<\/td>\n<td>למה משחק: \"ילדים יודעים לשחק את הרגשות שלהם יותר בקלות מאשר לדבר עליהם\". רגשות שהילד לא ידע שיש לו<\/td>\n<\/tr>\n<tr>\n<td>37-40<\/td>\n<td>איך מגלים את הרגשות: הילדים משחקים, מדברים ומציירים. המטפלת: (1) מקשיבה, (2) מתבוננת, (3) מבינה, (4) לפעמים משחקת גם, (5) מפענחת רגשות, (6) משוחחת עליהם עם הילד<\/td>\n<\/tr>\n<tr>\n<td>41-44<\/td>\n<td>מה ילדים מרגישים: (1) סקרנים, (2) מבולבלים, (3) עצובים, (4) כועסים, (5) שמחים, (6) וכל מיני רגשות אחרים. לפעמים לא אוהבים להקשיב למטפל, \"אבל זה בסדר...\"<\/td>\n<\/tr>\n<tr>\n<td>45-48<\/td>\n<td>הבעיות נהיות קטנות יותר ויותר. זה קשה ולוקח זמן. \"בסופו של דבר ילדים מרגישים יותר טוב!\"<\/td>\n<\/tr>\n<tr>\n<td>49-52<\/td>\n<td>הפרידה: קשה ואפילו מפחידה, \"להתראות להרבה זמן\". רגשות חשובים בסוף, הבעיות חוזרות קצת לזמן קצר. שלב הסיום לוקח \"שבועות\" (באיור: קוביות ממוספרות 1-8)<\/td>\n<\/tr>\n<tr>\n<td>53-56<\/td>\n<td>שאלות של ילדים לקראת הסוף: \"האם המטפל שלי הולך?\" (לא, המטפל נשאר, פשוט אתה לא תמשיך לבוא); \"האם אראה אותו שוב?\" (אם תצטרך, ההורים יכולים להתקשר ולקבוע ביקור); \"ה
