<li>תהליכים סמויים מייצרים פיצולים והתקפות הדדיות (האלטון, קליין).<\/li>\n<li>קואליציות חוצות גבולות פוגעות בניהול הגבולות (וגה-זאגר).<\/li>\n<li>חילופי מנהל מערערים את הדימוי העצמי והמקצועי של הצוות ועלולים להוביל לתהליכים דיסאינטגרטיביים.<\/li>\n<li><strong>מטרת ההתערבות היא אינטגרציה במקום פיצול<\/strong>: מעבר מהעמדה הסכיזו-פרנואידית לעמדה הדיכאונית.<\/li>\n<li>ייעוץ חיצוני הוא \"עין\" שרואה בעיקר את התהליכים הסמויים (שיין).<\/li>\n<li><strong>האלימות היא סימפטום<\/strong>: לא רק הילדים לא מוחזקים, גם הצוות והמנהל מרגישים מאוימים. במונחי האישיות המערכתית מדובר בתפקודי אגו רופפים וקווים פרנואידיים, ולכן הסימפטום הוא איום ותוקפנות.<\/li>\n<li><strong>השלב הבא<\/strong> הוא עבודה על התפיסה הערכית המשותפת, ובמיוחד <strong>שיקום האמון<\/strong> כערך שנפגע.<\/li>\n<\/ul>\n<hr />\n<h3>6. שינוי נרטיב בית ספרי: יכולת המנהל ותפקיד הפסיכולוג (טל גרין אפל)<\/h3>\n<p><strong>הבסיס התיאורטי<\/strong>: הגישה הנרטיבית (ווייט ואפסטון). סיפור חדש נוצר כשמוצאים \"נקודות אור\", מרחיבים אותן ומחברים אותן לסיפור כולל, אחר ורציף.\n<strong>ההקשר<\/strong>: בית-ספר מצטמק עם מעט נרשמים, סכנת סגירה, צוות לא מרוצה, שם שנפגע ונתק מהממשקים (כולל השפ\"ח). הגיע מנהל חדש.<\/p>\n<p><strong>היכולת של מנהל ליצור שינוי (שבעה מרכיבים):<\/strong><\/p>\n<ol>\n<li><strong>חזון חינוכי, ערכי וחברתי<\/strong> ואמונה ביכולת להשתנות. השקעה בתוכניות מגוונות: הרחבת תוכניות למידה, מגמות, ופעילות חברתית וערכית.<\/li>\n<li><strong>שינוי האווירה<\/strong>: עם המורים \"דלת פתוחה\", הקשבה, קבלה ותמיכה. עם התלמידים הקשבה \"בגובה העיניים\", שיחות יומיומיות והיכרות אישית של המנהל איתם (חינוך כיתה, לימוד בכיתות המקדמות).<\/li>\n<li><strong>הנהגת הצוות ופיתוחו המקצועי<\/strong>: גיוס הצוות להאמין בשינוי, ימי היערכות, ישיבות מליאה על למידה משמעותית, מקום המורה ומוטיבציה, ושיחות אישיות בין ההנהלה למורים. השקעה <strong>בצוות טיפולי<\/strong>: פסיכולוגיות, יועצים (כולל יועץ עולים לאוכלוסייה האתיופית), תרפיסטיות ומדריך מוגנות.<\/li>\n<li><strong>התמקדות בתלמידים<\/strong>: הקשבה לצורכיהם וחיבור ההורים. מיפוי, איתור צרכים ומענים מותאמים.<\/li>\n<li><strong>ניהול הקשר עם הקהילה<\/strong>: חיבור לבתי הספר היסודיים המזינים, שיעורים בבתי הכנסת, פרויקטים אחר הצהריים, חיבור לתוכניות המשך (צבא ומכינות), \"לאורו נלך\" (התנדבות), וקשר שוטף עם מנח\"י והפיקוח.<\/li>\n<li><strong>יצירת מבנים קבועים (מנגנונים) להובלת השינוי<\/strong>: צוות מוביל, ישיבות צב\"מ, <strong>פגישה קבועה בין הפסיכולוג למנהל<\/strong>, ישיבות מליאה ומפגשי צוות טיפולי. <strong>כדי שהמנגנונים יהפכו לכלי ניהולי צריך להגדיר<\/strong>: מי יוזם את המפגשים, מי מוביל אותם, מי מזמן את האנשים, ומי קובע ובוחן את היתכנותם לאורך השנה.<\/li>\n<li><strong>התחברות לאוכלוסייה הייחודית<\/strong>: להכיר אותה, להעצים אותה ולהיענות לצרכיה.<\/li>\n<\/ol>\n<p><strong>מה הצליח<\/strong>: מנהל ש\"קרא נכון את המפה\", התחבר לאוכלוסייה ממקום מאמין ומכבד ויצר תקווה. הוא נענה לצורך של המורים להיות מונהגים על ידי מי שמאמין בהם ובונה איתם מטרות ברות השגה, ולצורך של התלמידים בתקשורת, בלמידה מותאמת, בנראות ובהקשבה.<\/p>\n<p><strong>תפקיד הפסיכולוג בליווי השינוי:<\/strong><\/p>\n<ul>\n<li>תמיכה במנהל בפגישות קבועות: שיח שמתבונן בתהליכים מנקודות מבט שונות, נוכחות תומכת, שיקוף ומשוב על אירועים.<\/li>\n<li>סיוע וחשיבה בהקמת מבנים ומנגנונים לחשיבה רב-מערכתית, בקרה ותוכניות עבודה, לפרט ולמסגרות.<\/li>\n<li>ליווי תהליכים עם חדר המורים, הנחיית סדנאות והקניית תכנים וכלים.<\/li>\n<\/ul>\n<hr />\n<h3>7. \"תמונת עתיד\" ו-re-membering: ליווי בית-ספר לסגירה (נורית סהר)<\/h3>\n<p><strong>ההקשר<\/strong>: בית-ספר ממלכתי קטן בשכונה מוחלשת. <strong>הסיפור הדומיננטי<\/strong> היה של קורבנות וחוסר תקווה, \"למרות משאבים רבים שהוזרמו\". מנהלת חדשה הגיעה, ונעשה ייעוץ תהליכי למנהלת על ידי פסיכולוגיות בית-הספר ומדריכה חיצונית. התיוג השתנה מ\"בעייתי\" למוסד עם מומחיות בתלמידים עם צרכים התנהגותיים ורגשיים.<\/p>\n<p><strong>שלב א': \"תמונת עתיד\".<\/strong> המושג כולל חזון, מוטיבציה, כוחות והכרה באחרים משמעותיים. בתוכנית לשנתיים נבנו:<\/p>\n<ul>\n<li>סדנאות למורים, שבהן כל מורה יוצרת תמונת עתיד אישית ומקצועית.<\/li>\n<li>סדנאות בכיתות: תמונת עתיד של כל תלמיד, אחר כך תמונה כיתתית, ואחר כך תמונה של בית-הספר כישות שלמה.<\/li>\n<li><strong>שלוש השאלות<\/strong>: (1) מהו החלום שלך? (2) מה יש בך שיכול לסייע לך להגשים את תמונת העתיד הזו? (3) מי יכול לעזור לך להגשים אותה, ומה אתה צריך ממנו?<\/li>\n<li>הדרכה קבוצתית של הצוות הבין-מקצועי למורים, לליווי פרטני של ילדים נבחרים בפיתוח החלומות שלהם, עם דגש על ההורים כתומכים.<\/li>\n<\/ul>\n<p><strong>שלב ב': אחרי ההחלטה העירונית לסגור את בית-הספר.<\/strong><\/p>\n<ul>\n<li>הצוות הטיפולי \"נשאב\" לייאוש לזמן מה, ואז החליט ש\"משהו צריך להיעשות\".<\/li>\n<li><strong>שני תהליכים מקבילים<\/strong>: מתן משמעות לעבר, ומתן תקווה והתלהבות לעתיד. במקביל <strong>תמיכה במורים<\/strong> כדי שיוכלו לתמוך בילדים: המורים הם היעד של הצוות הטיפולי, והילדים הם היעד של המורים.<\/li>\n<li><strong>re-membering<\/strong> (Morgan, 2000): סיפור זיכרונות מועדפים כדי להתחבר מחדש לשייכות ולמשמעות.<\/li>\n<li><strong>הפעילויות<\/strong>:<ul>\n<li>דיונים כיתתיים ושיחות פרטניות על כוחות פנימיים, על התמודדויות קודמות עם שינויים ועל מה שעזר בהן (כוחות פנימיים ואחרים משמעותיים).<\/li>\n<li>איתור ילדים במתח מוגבר ותמיכה בהם ובהוריהם.<\/li>\n<li>דגש על <strong>בקשת עזרה<\/strong>, על זיהוי מי יכול לעזור ועל אמון במבוגרים.<\/li>\n<li>מורים חולקים סיפורי התמודדות אישיים ואת הפחדים שלהם, כדי לנרמל אותם.<\/li>\n<li><strong>ספר זיכרון<\/strong> לכל תלמיד, שבו מורים ותלמידים כותבים זיכרונות ותכונות חיוביות.<\/li>\n<li><strong>קיר זיכרונות<\/strong> במסדרון, בשיתוף ההורים.<\/li>\n<li><strong>תעודות מיוחדות<\/strong>, תמונה בית ספרית, ו<strong>תיבת אוצר מעץ<\/strong> שכל ילד מקשט. בתוכה מסרים אישיים על הכוחות שלו \"שאותם ייקח לבית-הספר החדש\", למשל \"אני חבר טוב, אני אוהב לעזור לאחרים\".<\/li>\n<li><strong>טקס סיום<\/strong> של כיתות ו' שהורחב לאירוע לכל בית-הספר, כולל בוגרים מהעבר.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<hr />\n<h3>8. מקבוצת הנחה בסיסית לקבוצת עבודה: שלבי התערבות בכיתה במשבר מעבר (רבקה שפיגלמן)<\/h3>\n<p><strong>שלוש הנחות היסוד של ביון:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>הנחת יסוד<\/th>\n<th>תיאור<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>תלות<\/strong><\/td>\n<td>הקבוצה תולה תקווה במנהיג כל-יכול וכל-יודע שיגן עליה ממגע מכאיב עם המציאות<\/td>\n<\/tr>\n<tr>\n<td><strong>מאבק או בריחה<\/strong><\/td>\n<td>הקבוצה מתמודדת עם החרדה דרך מאבק פנימי, מאבק במנהיג, או נסיגה פסיכולוגית \"משדה הקרב\". אין בה עיסוק בהתקדמות<\/td>\n<\/tr>\n<tr>\n<td><strong>זיווג<\/strong><\/td>\n<td>הקבוצה תולה תקווה בעתיד טוב יותר דרך איחוד בין שניים (שני חברים, או המנהיג וגורם חיצוני), תוך הימנעות מהמפגש עם ההווה<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>ההקשר<\/strong>: תיכון ותיק וסלקטיבי פתח חטיבת ביניים בעקבות חובת האינטגרציה בירושלים, כיחידה נפרדת עם הנהלה ומזכירות משלה. במעבר הראשון לתיכון, כיתה שהייתה מגובשת ומתפקדת נקלעה למשבר: כעס על המערכת, \"מלחמה\" בתוך הכיתה, קושי ללמד ושיקולי עזיבה. <strong>האבחנה<\/strong> הייתה קבוצת הנחה בסיסית של מאבק-בריחה, עם ייאוש, חוסר מוטיבציה ו\"הקול הנעדר\" שהיה יכול לקרוא להתמודדות עם המציאות.<\/p>\n<p><strong>מה גרם למשבר:<\/strong><\/p>\n<ul>\n<li>חוסר תשומת לב של צוות החטיבה וצוות התיכון לכך שהתלמידים עוברים לבית-ספר חדש לגמרי, שעוטף פחות ודורש יותר עצמאות.<\/li>\n<li>זו הייתה ההיכרות הראשונה של התיכון עם אוכלוסייה הטרוגנית.<\/li>\n<li>הקושי הלימודי השפיע על המבנה החברתי.<\/li>\n<li><strong>במקביל, גם הצוות היה בחרדה<\/strong> והתקשה לתפקד כקבוצת עבודה.<\/li>\n<\/ul>\n<p><strong>שלבי ההתערבות:<\/strong><\/p>\n<ol>\n<li><strong>היועצת נכנסת עם המחנכת<\/strong> ומאפשרת לתלמידים לבטא את תחושותיהם.<\/li>\n<li><strong>הפסיכולוגית מצטרפת לצוות הבין-מקצועי<\/strong>, כ\"חוליה מקשרת\" מהחטיבה. נוצר <strong>פורום קבוע<\/strong> (מנהלת, יועצת, מחנכת ופסיכולוגית) שמשמש <strong>מיכל<\/strong> לחרדה ומאפשר לצוות להתארגן כקבוצת עבודה.<\/li>\n<li><strong>מפגש עם הכיתה<\/strong> שבו היועצת והמחנכת משדרות <strong>אמונה ביכולת להסתגל<\/strong> ומזכירות הצלחה קודמת של הכיתה ואת הניסיון שלהן. הקול הזועם עדיין דומיננטי.<\/li>\n<li><strong>שיחות אישיות<\/strong> של המחנכת, היועצת והמנהלת עם תלמידים רבים. במונחי קוהוט, המבוגרים מתפקדים כ<strong>זולת-עצמי<\/strong>, משקמים את הערך העצמי שעורער ומפחיתים את תחושת הפירוק. הקול הקבוצתי משתנה ל\"מעוניין בשינוי\", והקול המיואש עובר לרקע.<\/li>\n<li><strong>מפגש סיכום ובחירת נציגות<\/strong> של שמונה תלמידים, שמסמנת את \"תחילת המעבר\" לקבוצת עבודה.<\/li>\n<li><strong>הנציגות מגישה רשימת בקשות<\/strong> מהמערכת ומהמורים: בקשות לנראות (שיקוף) ולשמירה והחזקה (אידאליזציה). היא מגישה גם <strong>רשימת נושאים באחריות התלמידים<\/strong>, למשל שמירה על השקט בשיעורים.<\/li>\n<li><strong>מפגש של הצוות הבין-מקצועי עם כל מורי הכיתה<\/strong>, לביטוי תחושותיהם ולהסבר על ההבנה של התמונה הכיתתית.<\/li>\n<li><strong>תוכנית דף משוב<\/strong>:\n        - מדדי תפקוד מוגדרים, שכל תלמיד ממלא בסוף שיעורים נבחרים, גם על התפקוד האישי שלו וגם על תפקוד הכיתה.\n        - המורים בשיעורים הנבחרים נותנים משוב על התפקוד הכיתתי.\n        - המחנכת מרכזת את הנתונים ופעם בשבוע עוברת עליהם עם התלמידים, משווה בין נתוני התלמידים לנתוני המורים, ונקבעות מטרות משותפות.\n        - הנציגות שותפה לכל שלב, כולל הצד הטכני.\n        - \"המגע וההתייחסות השוטפת ברמת התהליך היו חשובים לא פחות מהתוכן המעשי\".<\/li>\n<\/ol>\n<p><strong>התוצאה<\/strong>: תוך כמה שבועות חל שיפור דרמטי בתפקוד הלימודי ושיפור ניכר בהתארגנות החברתית. קולות הניכור הפכו לקולות שאפשר להכיל.<\/p>\n<p><strong>תובנות:<\/strong><\/p>\n<ul>\n<li>המסורת של כבוד לתלמיד ודיאלוג איתו תרמה להתערבות.<\/li>\n<li><strong>תסריטים חלופיים שנמנעו<\/strong>: מבוגר שמרגיע ומגן \"מפני עצמם\" היה יוצר <strong>תלות<\/strong>. שני מבוגרים שמחפשים פתרון מעל ראשי התלמידים היו יוצרים <strong>זיווג<\/strong>.<\/li>\n<li>המפתח הוא <strong>דיאלוג שיתופי ומכבד שבו המבוגר לוקח את הסמכות והאחריות<\/strong>.<\/li>\n<li>דיבור על החרדה ופורום מכיל עוזרים לקבוצה לתפקד באופן פחות הגנתי.<\/li>\n<li>השתתפות הכותבת בקבוצת הדרכה מערכתית (בהנחיית צילה תורי-מגדסי) עזרה לה לשמור על \"מקום חושב ומתבונן\".<\/li>\n<\/ul>\n<hr />\n<h3>9. התערבויות במצבי צמיחה בריאים (ענת קדר)<\/h3>\n<p><strong>מתי מגיעה הזמנה כזו?<\/strong> אחרי שבית-הספר כבר יצא מנקודת שפל או ממשבר, או מתוך תחושה של \"אי-צמיחה\" ממושכת. השנה נכלל בזה גם פרויקט בית-ספר בקהילה.\n<strong>המנהלים<\/strong> בהתערבויות כאלה מעוניינים ומסוגלים לחשוב מחדש על תפיסות מושרשות, לבדוק אם הן מתאימות למציאות הנוכחית ולפתוח כיווני עבודה חדשים.\n<strong>הטריגרים<\/strong>: שינויים במדיניות משרד החינוך, בחלוקת האחריות בין בית-הספר להורים וביחסי הכוח ביניהם, ושינוי דמוגרפי שיוצר פער גדול מדי בין דרכי ההוראה למה שהאוכלוסייה החדשה צריכה.<\/p>\n<p><strong>הפערים המערכתיים שמתוארים:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>מוצהר (משרד החינוך)<\/th>\n<th>בפועל<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>השכלה רחבה וערכית; סוציאליזציה מורכבת לחברה<\/td>\n<td>דגש על מיומנויות יסוד ומקצועות בסיס. הימנעות מעיסוק בערכים שנויים במחלוקת, מחשש להטיה פוליטית ולסנקציות (פרט לערכים של יחסים בין ילדים)<\/td>\n<\/tr>\n<tr>\n<td>תלמיד חושב, יצירתיות, חשיבה מורכבת, סקרנות<\/td>\n<td>הקניית חומר והחזרתו במבחנים<\/td>\n<\/tr>\n<tr>\n<td>בית-הספר וגם ההורים מוכרזים כאחראים לחינוך<\/td>\n<td>אין הגדרה ברורה של חלוקת האחריות והשיתוף<\/td>\n<\/tr>\n<tr>\n<td>חינוך פורמלי ובלתי פורמלי<\/td>\n<td>שיתוף פעולה נמוך. הילד \"מחולק ל'חתיכות חינוכיות'\". החינוך הבלתי פורמלי וולונטרי, ולכן המדינה מוותרת בפועל על חלקים בסוציאליזציה<\/td>\n<\/tr>\n<tr>\n<td>קוד נורמטיבי מוצהר להתנהגות הורים<\/td>\n<td>בקונפליקט מקבלים התנהגויות חורגות ומפנים את האשמה לבית-הספר ולמנהל, וזה עלול לגרום למשבר מערכתי<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>על מה הצוות המערכתי עובד בתהליכים כאלה:<\/strong><\/p>\n<ul>\n<li>תפיסות מושרשות וחרדות משינוי.<\/li>\n<li>שינוי בתפיסה העצמית של המורות.<\/li>\n<li><strong>unlearning ו-relearning<\/strong> של דרכי הוראה שעליהן נשענת הזהות המקצועית.<\/li>\n<li>בניית מעמד המורה מחדש מול ילדים והורים, ומעבר להוראה יצירתית.<\/li>\n<li>חרדות מהמפגש עם הורים כשותפים לחשיבה, במקום מורה ש\"קובעת דרך\".<\/li>\n<li>חרדות מדיאלוג עם הורים בעלי השכלה, ממון ודעה, שנתפסים כמאיימים.<\/li>\n<li><strong>הגדרה מחדש והגמשה של הגבולות<\/strong> בין בית-הספר להורים, ליחסים אופקיים יותר.<\/li>\n<li>במקביל, עבודה על <strong>ערך סמכות המורה<\/strong> ועל שמירת האוטונומיה של בית-הספר והמורות.<\/li>\n<\/ul>\n<p><strong>סימני הצלחה<\/strong>: שינוי עמוק באווירה, במוטיבציה ובהתגייסות, תחושה ש\"השמים הם הגבול\", יותר מענים מותאמים לילדים ולצוות, למידה כמקור לסקרנות וחקר, גאווה, לכידות והזדהות. <strong>תפקיד הפסיכולוג המערכתי<\/strong>: יצירת המפגש, בירור ופתרון קונפליקטים, והובלה ל\"בחירה מושכלת של מטרות ומשימה מרכזית\".<\/p>\n<hr />\n<h3>10. הקבוצה הגדולה (דוד סימצקין, על פי חיים וינברג)<\/h3>\n<ul>\n<li><strong>הגדרה<\/strong>: קבוצה שבה אי אפשר להקיף את כל המשתתפים במבט אחד. <strong>דוגמאות<\/strong>: כיתות, חדרי מורים, שכבות, הורי הכיתה, ובית-הספר כולו.<\/li>\n<li><strong>החוויה של היחיד<\/strong>: ניכור וזרות, חרדה, תחושה שהוא \"שקוף\" ו\"בורג במכונה\", ותחושה שגם הכוחות הקיימים שלו אינם זמינים לו. <strong>מנגד<\/strong>, אם הוא נכנס לדינמיקה, הוא חש חלק ממשהו גדול שמחזק את הביטחון העצמי. המחיר הוא ויתור על חלק מהזהות האישית והתמזגות ב\"אישיות ההמון\".<\/li>\n<li><strong>המנהיגות קובעת את הכיוון<\/strong>: מנהיגות חיובית הופכת את הקבוצה לכוח שתורם לדימוי העצמי. מנהיגות לא חיובית מובילה לכוחניות, לשעירים לעזאזל ולדחייה. <strong>למורה כמנהיג<\/strong> יש חשיבות מכרעת, במיוחד בגילים הצעירים.<\/li>\n<li><strong>ההתמודדות היא דרך תתי-קבוצות<\/strong>. יחיד שמוצא תת-קבוצה מקבל אינטימיות לצד שייכות לדבר גדול. נוצרת \"מערכת השתייכות מורכבת\", וככל שהיחיד שייך ליותר תתי-קבוצות, נוח לו יותר בקבוצה הגדולה.<\/li>\n<li><strong>העיקרון האבחוני<\/strong>: \"כשמדברים על קבוצה גדולה, לא חושבים על הפרט, אלא על תתי-קבוצות, וכל קול שעולה מהקבוצה מייצג קול של תת-קבוצה\".<\/li>\n<li><strong>יישומים שמופיעים בטקסט:<\/strong><ul>\n<li><strong>ילד בודד<\/strong>: טעות לגרום לילדים \"להתייחס אליו\", כי זה מחריג אותו עוד יותר. עדיף לעזור לו למצוא ילדים דומים לו. \"לא המורה יצר את השידוך... אלא המכנה המשותף\".<\/li>\n<li><strong>ויכוח בחדר המורים<\/strong>: אם נוצרת אווירה בקרב שאר המורים, המתווכחים הם נציגים של קולות של תתי-קבוצות. פתרון נקודתי \"מפספס הזדמנות\" לראות אג'נדות שונות, תקשורת, קבלת החלטות ודרכי תקשורת בקבוצה הגדולה.<\/li>\n<li><strong>המטרה<\/strong>: לאפשר לכל אחד להרגיש שייך לקבוצה הגדולה בלי להרגיש שאסור לו להשתייך לתת-הקבוצה שלו, \"מבלי להרגיש אשם\".<\/li>\n<li><strong>כיתה גדולה ועמוסה<\/strong>: לעודד קבוצות קטנות בתוך קבוצת הלמידה, כמענה לצורך בשיקוף, בהחזקה, בהשתייכות ובזהות.<\/li>\n<\/ul>\n<\/li>\n<li><strong>ההסתייגות<\/strong>: הפסיכולוג אינו אמור להפוך למנחה של קבוצות גדולות, אבל עליו להכיר את התהליכים בכל הרמות: הפרטנית, הקבוצתית והמערכתית.<\/li>\n<\/ul>\n<hr />\n<h3>11. חטיבת הביניים: קבוצות ל\"תלמידים השקטים\" וחקר מוקיר (שרון קייזר)<\/h3>\n<ul>\n<li><strong>המטפורה המארגנת<\/strong>: אליס בארץ הפלאות. הבדידות של המתבגר במעבר מהיסודי לחטיבה, ואיתה הבלבול של ההורים ושל הצוות (על פי דור-חיים, \"הקשבה בבית-הספר\").<\/li>\n<li><strong>המטרה<\/strong>: דיאלוג בונה בין שלושת קצוות המשולש: הורים, תלמידים וצוות.<\/li>\n<li><strong>רכיבי התוכנית:<\/strong><ol>\n<li><strong>תכנון בחופשת הקיץ<\/strong> יחד עם שותף מהצוות.<\/li>\n<li><strong>ארבע קבוצות תלמידים<\/strong> משכבות שונות, שנבחרו על ידי הצוות הייעוצי לפי קריטריונים שנקבעו מראש. הקבוצות כוונו ל\"תלמידים השקטים\" (\"הפרחים החבויים\"). המפגשים נבנו להיכרות ולחשיפה מדורגת. חלק מהילדים הופנו לטיפול פרטני וחלק לאבחון. מה שהיה משמעותי הוא הפגת הבדידות במסגרת בטוחה עם כללים ברורים. הקבוצות הפכו ל\"מצרך מבוקש\" וגם מיצבו את הפסיכולוגים בצוות.<\/li>\n<li><strong>סדנאות לצוות חדר המורים ולצוות החינוך המיוחד<\/strong> בימי ההיערכות, על בסיס גישת <strong>החקר המוקיר<\/strong>. לגישה תשעה עקרונות, שאינם מפורטים בגיליון. מוזכרים העיקרון <strong>הפואטי<\/strong> ו<strong>רב-הסיפוריות<\/strong> של כל תלמיד, הבחירה להסתכל על אלמנטים חיוביים, ועקרון <strong>ההבנייה והשפה<\/strong> כמעצבי מציאות. הסדנאות נשענו גם על תוכנית \"דיאלוג עם תלמידים\" של צוות פסגת זאב.<\/li>\n<\/ol>\n<\/li>\n<li><strong>המשימה המרכזית בעיני הכותבת<\/strong>: \"מערכת החושבת ופועלת יחדיו למען טובתו של הילד\".<\/li>\n<li><strong>הקושי<\/strong>: בהתחלה הייתה היענות נמוכה לעבודה הקבוצתית ולחשיבה המערכתית.<\/li>\n<\/ul>\n<hr />\n<h3>12. הכיתה המקדמת כפריזמה לאבחון המערכת (טל גרין אפל)<\/h3>\n<p><strong>טענת הבסיס<\/strong>: היחס לחינוך המיוחד ולכיתה המקדמת מייצג את ערכי בית-הספר והמנהל לגבי האפשרות של תלמידים להתקדם. <strong>הפרמטר המשפיע ביותר<\/strong> לדעת הכותבת הוא עמדת המנהל כלפי תלמידי החינוך המיוחד.<\/p>\n<h4>א. אבחון המערכת: מדדים ושאלות<\/h4>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>מדד<\/th>\n<th>שאלות לבדיקה (מהטקסט)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מיקום הכיתה<\/strong><\/td>\n<td>היכן היא במרחב? האם המיקום מאפשר שילוב? האם היא חלק מהשכבה? מוחבאת? האם מבנה הכיתה מכבד את יושביה?<\/td>\n<\/tr>\n<tr>\n<td><strong>מקום המחנכת בחדר המורים ובצוות השכבה<\/strong><\/td>\n<td>עד כמה תת-המערכת מבודדת ובעלת גבול סגור, ועד כמה יש חיבורים? (דוגמה: תלמידות מהכיתה המקדמת העבירו שיעור בכיתה רגילה, וזה שיקף את מקום הכיתה ואת שיתוף הפעולה בין המחנכות)<\/td>\n<\/tr>\n<tr>\n<td><strong>הקשר בין המחנכת למנהל<\/strong><\/td>\n<td>עד כמה יש פתיחות, התייעצות, דיאלוג, שיתוף וחשיבה משותפת על תלמידים, משפחות ואירועים?<\/td>\n<\/tr>\n<tr>\n<td><strong>תהליכים מקבילים<\/strong><\/td>\n<td>עמדת בית-הספר והמנהל כלפי הכיתה מול תפיסת צוות הכיתה את התלמידים. תפקוד הכיתה (למידה, אווירה, מצב רגשי, קשר עם הורים וקשר עם כיתות אחרות) מעיד על ההתארגנות הבית ספרית סביבה<\/td>\n<\/tr>\n<tr>\n<td><strong>הקשר בין אנשי הצוות בכיתה<\/strong><\/td>\n<td>שיתוף פעולה בצוות הרב-מקצועי ועם הכוחות המסייעים, שגם משמש מודלינג לתלמידים<\/td>\n<\/tr>\n<tr>\n<td><strong>שילוב<\/strong><\/td>\n<td>האם השילוב הוא ערך? האם בנויות מערכות שמאפשרות שילוב: כיתתי-הומוגני (למשל ספורט משותף), יחידני (מחייב שעות מקצועיות מקבילות) וחברתי (מקהלה, טיולים)?<\/td>\n<\/tr>\n<tr>\n<td><strong>ישיבות צוות בין-מקצועי<\/strong><\/td>\n<td>האם הוקדשו שעות במערכת לישיבות רב-מקצועיות ולישיבות פסיכולוגית–מחנכת (להחזקה, תמיכה, זימון הורים)? לפי וגה-זאגר, המבנים הם הכלי לבחינת ההתקדמות למשימה<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>ב. הסביבה החינוכית והשפעותיה<\/h4>\n<ul>\n<li><strong>המחנכת<\/strong> היא <strong>מיכל<\/strong> (ויניקוט) ו<strong>זולת-עצמי<\/strong> שמספק מירורינג חיובי (קוהוט). היא מרגיעה את החרדה ומאפשרת לחלקי עצמי מפוזרים להתחבר ל\"עצמי לכיד\". היא גם <strong>קוטב לאידאליזציה<\/strong> שמאפשר לחלום על העתיד ולבנות שאיפות.<\/li>\n<li><strong>בית-הספר כמיכל מורחב<\/strong>: כשהמנהל והצוות רואים בכיתה חלק אינטגרלי, הם מחזקים את התהליכים. כשהם רואים בה \"נטע זר\", בית-הספר פועל נגד המיכל שבונה המורה ומחזק את תחושת הזרות.<\/li>\n<li><strong>שלושת הצרכים לפי תיאוריית ההכוונה העצמית<\/strong> (Deci &amp; Ryan):<ul>\n<li><strong>שייכות וביטחון<\/strong>: קשר, אכפתיות והקשבה. הגיבוש קשה, כי התלמידים מגיעים מאזורים שונים בעיר.<\/li>\n<li><strong>מסוגלות<\/strong>: למידה מותאמת ומתווכת, תוכנית אישית ו\"גרף התקדמות\" הדרגתי.<\/li>\n<li><strong>בחירה ואוטונומיה<\/strong>: ההשמה בכיתה לא תמיד נבחרה על ידי התלמיד, אבל בתוך הכיתה יש בחירה של דרך הלמידה, הקשבה ודיאלוג.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<h4>ג. תקשורת בין גורמים: \"מי האמא של הכיתה המקדמת?\"<\/h4>\n<ul>\n<li><strong>השאלות<\/strong>: כשיש קושי עם תלמיד, מי יודע? למי פונים? מה עושים?<\/li>\n<li><strong>רשימת הגורמים שהמחנכת אמורה לדווח להם<\/strong>: יועצת, פסיכולוגית, תרפיסטית, סייעת, הורים, מדריכת מת\"י, האחראית על הכיתות המקדמות, מנהלת, פיקוח רגיל, פיקוח על החינוך המיוחד, ולפעמים רווחה, מועדונית ועוד. \"מרבה אנשים מרבה דעות\".<\/li>\n<li><strong>הפתרון<\/strong>: מבנה של ישיבת צוות רב-מקצועית עם הגדרת תפקידים, חשיבה על ממשקים ושיפור תהליכים, כלומר \"מנגנונים ברורים עם משימות ידועות\" (וגה-זאגר).<\/li>\n<li><strong>האתגר לפסיכולוג<\/strong>: לא להסתפק בעבודה פרטנית (תלמידים, הורים, צוות), אלא לראות דרך הכיתה את המערכת כולה.<\/li>\n<\/ul>\n<hr />\n<h3>13. ערכים, התנהגות הורית ועבודה מערכתית (שרון קייזר-הלר)<\/h3>\n<p><strong>הגדרה<\/strong>: ערכים הם ייצוגים קוגניטיביים של מטרות מוטיבציוניות ועקרונות מנחים שחוצים מצבים (Schwartz, 1994). הם משלבים צרכים ביולוגיים, צרכים חברתיים ובחירה אישית. המבנה שלהם אוניברסלי, אבל סדר החשיבות שונה מאדם לאדם.<\/p>\n<p><strong>עשרת סוגי הערכים של שוורץ:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>ערך<\/th>\n<th>הגדרה בטקסט<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>א<\/td>\n<td>כוח<\/td>\n<td>שאיפה למעמד חברתי, יוקרה, סמכות ושליטה<\/td>\n<\/tr>\n<tr>\n<td>ב<\/td>\n<td>הישגיות<\/td>\n<td>שאפתנות ורצון להצטיין<\/td>\n<\/tr>\n<tr>\n<td>ג<\/td>\n<td>הדוניזם<\/td>\n<td>רצון לחוות הנאה או סיפוק חושי<\/td>\n<\/tr>\n<tr>\n<td>ד<\/td>\n<td>גרייה<\/td>\n<td>רצון לחוות שינויים מתמידים והתרגשות<\/td>\n<\/tr>\n<tr>\n<td>ה<\/td>\n<td>הכוונה עצמית<\/td>\n<td>עצמאות ופתיחות לשינויים<\/td>\n<\/tr>\n<tr>\n<td>ו<\/td>\n<td>אוניברסליזם<\/td>\n<td>דאגה לרווחת כלל האנשים<\/td>\n<\/tr>\n<tr>\n<td>ז<\/td>\n<td>בנוולנטיות (טוב לב)<\/td>\n<td>דאגה לרווחת אנשים קרובים וקשרים אישיים<\/td>\n<\/tr>\n<tr>\n<td>ח<\/td>\n<td>מסורת<\/td>\n<td>העדפת המוכר והימנעות מהחדש והשונה<\/td>\n<\/tr>\n<tr>\n<td>ט<\/td>\n<td>קונפורמיות<\/td>\n<td>ציות לנורמות ולציפיות חברתיות<\/td>\n<\/tr>\n<tr>\n<td>י<\/td>\n<td>ביטחון<\/td>\n<td>שאיפה לביטחון, הרמוניה ויציבות<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>הטיעון:<\/strong><\/p>\n<ul>\n<li>ההורים הם סוכני הסוציאליזציה המרכזיים, ו\"תפקוד טוב\" מוגדר אצלם לפי הערכים שלהם.<\/li>\n<li><strong>הרבה קונפליקטים בין הורים לבית-הספר נובעים מפערי ערכים לא מודעים<\/strong>. דוגמה: הורים שמדגישים הישגיות, מצוינות, הכוונה עצמית וכוח, מול מערכת שמדגישה מסורת וקונפורמיות. הילד נמצא במרכז הקונפליקט.<\/li>\n<li>\"האתגר הגדול הוא חוסר המודעות לערכים, לפערים ולקונפליקטים\".<\/li>\n<li><strong>ריבוי גישות חינוכיות<\/strong>: ההורה עלול להיקלע ל\"shopping\" בין מודלים (Alwin, 2008). התנועה בין גישות מחלישה את הסמכות ההורית, ויוצרת ציפייה לתנודתיות דומה מבית-הספר וכעס על \"נוקשות המערכת\". דווקא בגלל הבלבול יש צורך בביסוס ערכים משותפים כייצוגים פנימיים מנחים.<\/li>\n<li><strong>ההסתייגות<\/strong>: לא \"איחוד\" מערכות ערכים. שונות וחשיפה לערכים שונים חשובות, וכך גם הבחירה האינדיבידואלית של הילד.<\/li>\n<li><strong>הכיוון<\/strong>: לבנות ולשמור על עקרונות של <strong>שיח פתוח על משמעות הערכים<\/strong> בבית ובבית-הספר.<\/li>\n<\/ul>\n<hr />\n<h3>14. תרגום השפה הפסיכולוגית למורים: מודל עבודה תהליכית-קבוצתית (יערה מרחבי)<\/h3>\n<p><strong>שתי הדרכים הכושלות לתרגם:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>דרך<\/th>\n<th>מאפיינים<\/th>\n<th>המחיר<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>\"ערפל מושגי\"<\/strong><\/td>\n<td>מעביר את מורכבות המושגים כפי שהפסיכולוג מכיר אותם, בשפה מקצועית ובמשפטים עמומים<\/td>\n<td>ביקורת רבה (גרינולד-קשאני ומטיחס, 2009)<\/td>\n<\/tr>\n<tr>\n<td><strong>\"מושג קשור לכיסא\"<\/strong><\/td>\n<td>תרגום מיידי לפרקטיקה: הנחיות, רשימת \"עשה ואל תעשה\"<\/td>\n<td>מוריד חרדה, אבל \"מעקר\" את המושג ומרוקן אותו מחיותו (כמו בשיר של בילי קולינס)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>הדרך המוצעת היא עבודה תהליכית, דיאלוגית ומתמשכת.<\/strong> חוזרים לקשר ומשתמשים בו כבסיס להבנת קשרים אחרים. הפסיכולוג הוא \"שותף אמיתי ונוכח\". חושבים יחד על הפערים בין פנטזיה לאפשרי, בין רצוי למצוי ובין תסכול ואשמה להצלחה, ושני הצדדים \"מתלכלכים\" יחד. זאת בניגוד למפגש בודד, שבו הפסיכולוג \"נשאר מוגן מהצורך להבריג את הפתרונות לתוך המציאות\".<\/p>\n<p><strong>הבסיס התיאורטי<\/strong> הוא המודל של אנה אורנשטיין (1981) לעבודה עם הורים מתוך פסיכולוגיית העצמי. כדי שההורה יהיה selfobject מרפא לילדו, הוא עצמו צריך selfobject אמפתי ועקבי, כי היכולת הזו \"cannot be grafted\". <strong>ההשלכה לבית-הספר<\/strong>: גם מורה שמתקשה בקשר עם תלמיד מאתגר צריך הרחבה של התמיכה הרגשית בו, ולא הנחיות.<\/p>\n<p><strong>השאלה הפתוחה בספרות<\/strong>: \"מי משמש למורה מכל\" לייאוש, לעלבון, לזעם ולחוסר האונים? המחקר מתמקד בתלמיד, ומשאבי המורה נבחנים רק \"כמצב נתון\".<\/p>\n<p><strong>הפרויקט: סדנאות למורות בבתי ספר חרדיים לבנות בירושלים (צוות חרדים בשפ\"ח)<\/strong><\/p>\n<ul>\n<li><strong>רקע<\/strong>: 35 בתי ספר יסודיים חרדיים לבנות בירושלים, 17 מהם של רשת בית יעקב. כיתות של עד 40 תלמידות, בחלק מבתי הספר יותר מאלף בנות, וצפיפות. המורות בעלות יכולת גבוהה ומעמד מבוסס, עם עומס משפחתי וקהילתי, סקרנות לפסיכולוגיה ו\"עייפות מצטברת ותסכולים לא מדוברים\".<\/li>\n<li><strong>שלבי ההטמעה:<\/strong><ol>\n<li><strong>מסורת של מפגשים<\/strong> בין הנהלת השירות למנהלות: אמון, תיאום ציפיות ומיפוי צרכים.<\/li>\n<li><strong>שני מפגשים עם המנהלות<\/strong> בשנה שלפני התוכנית. בראשון הוקדשה חצי שעה לנושאים בוערים, ואחר כך הוצגו עקרונות פסיכולוגיית העצמי בקצרה, ונערך דיון. הוסכם על הצורך, ונשארה פתוחה השאלה איך מיישמים.<\/li>\n<li><strong>ההנחה הסמויה של השירות<\/strong>: תהליכים מקבילים יחלחלו מהשירות למנהלות, למורות ולתלמידות.<\/li>\n<li><strong>הבקשה מהמנהלות<\/strong>: להציע דרכים יצירתיות לקיים 10–12 מפגשים בשעות הלימודים. הדיון היה \"סוער ואמוציונלי\". הוצעו למשל סמינריסטיות שיחליפו בכיתה, או שעות חלון מקבילות. נקבע תאריך יעד, ו\"מנהלות שיצליחו לאפשר... יזכו בה\".<\/li>\n<li><strong>שלושה מערכי סדנאות<\/strong>: מוטיבציה, המורה כמנהיגה ויחסים חברתיים בכיתה. ההיגיון הוא ש\"השפה של ידע נרכש\" מוכרת במערכת ומפחיתה חרדה. המנהלות בחרו נושא יחד עם המורות.<\/li>\n<\/ol>\n<\/li>\n<li><strong>היקף (תשע\"ג, 2012–2013)<\/strong>: עשרה בתי ספר (שמונה רגילים ושניים בחינוך המיוחד), יותר מ-60 מורות, והשפעה עקיפה על כ-1,500 תלמידות.<\/li>\n<li><strong>ממצאים<\/strong>: המורות דיווחו על למידה, אבל בעיקר התרגשו מכך ש\"פינו להן מרחב\", הקשיבו להן ונתנו להן \"חיבוק אוהד\". הפסיכולוגים חשו ש\"התפנה מקום כנה וחם (מרחב פוטנציאלי?)\". בחלק מבתי הספר פחתו פניות \"חירום\" של המורות המשתתפות. הכותבת מסייגת שהמסקנה \"מחייבת בדיקה מעמיקה יותר\".<\/li>\n<li><strong>תיאור מקרה, מורה א'<\/strong>: בקבוצה \"המורה כמנהיגה\" (תשע מחנכות), במפגש החמישי, הנושא היה \"מה מטעין אותי ומה מחליש אותי כמורה\". המורה שיתפה בכאב על שיחות ערב עם הורים על חשבון בנה. <strong>התערבות המנחה<\/strong>: \"נראה שהרגשת שאין לך בחירה... אולי אם הייתה לך תחושה של אפשרות לעצור רגע ולבחור זה יכול היה לתת לך כוח\". חברות הקבוצה תמכו בה ונתנו לה \"כוח לבחור\". בהמשך דיווחה על גבול שהציבה למורה מקצועית ועל הצבת מסגרת ברורה ותומכת לתלמידה מתקשה. <strong>ההמשגה<\/strong>: הקבוצה שימשה לה משענת ומושא לאידאליזציה, והרחיבה את המשאבים הרגשיים שלה, כך שנעשתה \"דמות ברורה ומווסתת יותר\" לתלמידה.<\/li>\n<li><strong>כישלונות חלקיים<\/strong>: בקבוצה אחת המורות \"נודבו\" על חשבון הזמן האישי שלהן, וזה יצר נשירה סמויה. בקבוצה אחרת ההנהלה חשה מאוימת מהתחזקות הקבוצה ומהביקורת שעלתה בה.<\/li>\n<li><strong>הדרכה למנחים<\/strong>: שעת הדרכה דו-שבועית. <strong>הדילמות שעלו<\/strong>: עד כמה לאפשר למורות להביא מקרים אישיים שאינם קשורים לבית-הספר, עד כמה לדבוק בתכנים המקוריים, מה מקומן של המנהלת והיועצת בקבוצה, ואיך להגיב להיעדרויות ולאיחורים.<\/li>\n<\/ul>\n<hr />\n<h3>15. התערבות נרטיבית במעגלים מערכתיים, קבוצתיים ופרטניים (ד\"ר נורית פלזנטל-ברגר, \"אילנות\")<\/h3>\n<p><strong>ההקשר<\/strong>: בית-ספר לחינוך מיוחד לילדים עם נכויות פיזיות קשות וליקויים קוגניטיביים, בגילים 6–21, יהודים, נוצרים ומוסלמים. החוויה הנפוצה של אנשים עם מוגבלות היא השתקה חברתית. מוסדות החינוך המיוחד התפתחו היסטורית מתוך סגרגציה ופטרונות.<\/p>\n<p><strong>המושגים:<\/strong><\/p>\n<ul>\n<li><strong>קול<\/strong> (Gilligan): \"כמהות האני... ערוץ המקשר עולמות פנימיים וחיצוניים\".<\/li>\n<li><strong>מושגי הגישה הנרטיבית<\/strong> (White; Morgan): סיפור דומיננטי רווי בעיות מול סיפור אלטרנטיבי מועדף בשולי השיח, unique outcomes, <strong>עדים<\/strong> שהופכים ל-re-members, ו<strong>חיבור נוף הפעולה ונוף הזהות<\/strong>. זהות חדשה נבנית \"מהחוץ פנימה ומהפנים החוצה\".<\/li>\n<\/ul>\n<p><strong>שלושה מעגלי התערבות:<\/strong><\/p>\n<ol>\n<li><strong>המעגל המערכתי<\/strong>: תהליך של הגדרת זהות משותפת וחזון בית ספרי בצוות הרב-מקצועי המוביל. המקצועות הפרא-רפואיים הביאו \"פונקציות ניהוליות\", והמקצועות הטיפוליים הביאו \"סיפור אחר לצד הנכות\", \"אוטונומיה מול בושה וספק\" ומוטיבציה. כך התגבשה <strong>שפה משותפת: \"ניהול עצמי\"<\/strong>. ההנחה: כדי לקדם ילד צריך חזון ושפה משותפים, שבתוכם כל איש מקצוע עושה את חלקו. חזון משותף נותן משמעות לעבודה השוחקת.<\/li>\n<li><strong>המעגל הפרטני<\/strong>:\n        - <strong>אריאל<\/strong>, עם תסמונת דושן, טופל לאורך 11 שנים. בסוף כתב ואייר עם הפסיכולוגית את סיפורו, \"מחשבות מסביב לזמן\". המשחק הסמלי של \"החייאת גיבור מלחמת הכוכבים\" נעשה בשיתוף מזכירת בית-הספר ואב הבית.\n        - <strong>מירב<\/strong>, עם שיתוק מוחין, בת 18, לא התקבלה לשירות לאומי. הסבירה לזרים בבית קפה מהו שיתוק מוחין וקיבלה מחיאות כפיים. זה היה unique outcome שהורחב לסיפור אלטרנטיבי בעזרת עדים, והיא הפכה ל\"מסבירה לקהלים\".<\/li>\n<li><strong>המעגל הקבוצתי<\/strong>: קבוצת בוגרים (18–21) נרטיבית-טיפולית. ביטוי בכתיבה, במוזיקה ובאמנות, ואחר כך שותפות עם תיכון האקדמיה למוזיקה (כיתה י\"א): מפגש שבועי במשך חודשיים, הלחנת השירים, ומופע משותף לקהל רחב.<\/li>\n<\/ol>\n<p><strong>הסיכום<\/strong>: \"לא די בפתיחת דלת להשמעת נרטיב אישי... יש צורך בחיפוש דרך להשפעה רחבה של הנרטיב\". הגישה החינוכית-נרטיבית מאתרת כוחות אנושיים במערכת, מוצאת להם שותפים ונותנת להם כיוון ומשמעות ברמת הזהות והפעולה, מתוך עמדה של שותפות.<\/p>\n<hr />\n<h3>16. תכנית \"בית-ספר בקהילה\": תפקיד השפ\"ח (ענת קדר וצילה תורי-מגדסי)<\/h3>\n<p><strong>התוכנית<\/strong>: תכנית הדגל של מנהל מנח\"י. מטרתה \"לחזק את הקהילתיות בירושלים, על ידי שילוב ידיים אמיץ בין מערכת החינוך... לבין הקהילות\". השתתפו 50 בתי ספר מכל המגזרים, יסודיים ועל-יסודיים, עם שותפים כמו הורים, מינהל קהילתי, בתי ספר אחרים ורווחה. <strong>הליווי של השפ\"ח<\/strong> היה בגיבוש הפרויקטים, בוועדות ההיגוי ובליווי מנהלים, רכזים, צוותי ניהול ומרכזים קהילתיים. הרציפות של הפסיכולוגים בבתי הספר הופכת את הליווי ל\"טבעי ואינטגרלי\".<\/p>\n<p><strong>הסוגיות שעלו:<\/strong><\/p>\n<ul>\n<li>השאיפה לשלב את הדור הצעיר בחברה הכללית תוך מתן מקום למסורות שלו. זה בולט במגזר החרדי, בהגירה, באוכלוסיות מוחלשות ובהורים משכילים ודעתנים.<\/li>\n<li>פערים בין המסרים שהילד מקבל במסגרות השונות, ובין ההצהרות לבין ההתנהגות שהוא פוגש ברחוב. דוגמאות: תוקפנות בתורים ובכבישים, עוצמת סאונד, בריונות, ו\"ויתורים\" של משרד החינוך להורים אלימים.<\/li>\n<li>אינדיבידואליזם, הישג ותחרות מול היכולת לראות את עצמך כחבר בחברה.<\/li>\n<li>פירוק המבנה הקהילתי שמותיר ילדים ומבוגרים באווירת \"תלישות\".<\/li>\n<li><strong>המסקנה<\/strong>: יש לייצר המשכיות בין המסגרות, \"מטרייה רחבה של נורמות\", לעצב מחדש את הגבולות ו\"לאגם אוטונומיות\" של בית-הספר, החינוך הבלתי פורמלי והמינהל הקהילתי.<\/li>\n<\/ul>\n<p><strong>ארבעה תחומים שבהם התוכנית נוגעת בפסיכולוגים:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>תחום<\/th>\n<th>מה נדרש (ועל מי נשענים)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>המשימה המרכזית<\/strong><\/td>\n<td>בחינה מדוקדקת של ההגדרות \"בשלוש הרמות: ההצהרתית, הלא מודעת וזו שבפועל עובדים עליה\" (וגה-זאגייר)<\/td>\n<\/tr>\n<tr>\n<td><strong>עיצוב הגבולות<\/strong><\/td>\n<td>פתיחה ועיצוב מחדש של גבולות, אוטונומיה, אזורי השפעה, מבנים, איזונים והיררכיות (מינצברג, וגה-זאגייר). ליווי של התהליכים הסמויים: חרדות בצוות, קושי לראות את נקודת המבט של האחר, ניהול מסוג אחר<\/td>\n<\/tr>\n<tr>\n<td><strong>הסתגלות לשינויים מרובים<\/strong><\/td>\n<td>בחינת תפיסות, כניסת שותפים, פתיחת \"הכיתה הסגורה\", שינויים בתפיסה העצמית והמקצועית ובמעמד של המורים (אמברוז). המנהלים זקוקים לליווי מול התנגדות הצוות<\/td>\n<\/tr>\n<tr>\n<td><strong>ערכים, חינוך והתפתחות נפשית בריאה<\/strong><\/td>\n<td>גזירת ערכים מהחזון (שיין), גזירת עשייה מהערכים ובניית המשימה המרכזית (וגה-זאגר). קישור לפיתוח מצפן פנימי, מוקד שליטה פנימי ועצמי קוהסיבי יותר (קוהוט, קולברג)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>מה עשו בפועל:<\/strong><\/p>\n<ul>\n<li>גויסה קבוצת פסיכולוגים שלמדה את התחום \"תוך כדי תנועה\". <strong>לכל פסיכולוג הוצמדו חמישה בתי ספר<\/strong>.<\/li>\n<li>כל פסיכולוג נפגש עם המנהל, הצוות הניהולי ורכזי התוכנית כדי לברר צרכים ואת סוג הליווי המבוקש. הם נכנסו \"מאמצע\" התהליך.<\/li>\n<li><strong>שלושה סוגי שכונות<\/strong>:<ul>\n<li>שכונות עם שיתוף פעולה קיים בהובלת המתנ\"ס: התוכנית אפשרה העמקה.<\/li>\n<li>שכונות שבהן התוכנית יצרה מפגש ראשון בין בית-הספר למתנ\"ס: נדרש ליווי מתמשך.<\/li>\n<li>שכונות עם תחרות קשה בין בתי ספר על מעט תלמידים: דגש על הישרדות ועל \"חיים בהישרדות מתמשכת\" (מינצברג).<\/li>\n<\/ul>\n<\/li>\n<li><strong>שני סוגי דגשים בבתי הספר<\/strong>: פנימי (שיתוף הצוות), או פיתוח הקשר עם ההורים (שפה משותפת ושותפות בחשיבה החינוכית). בסוג השני הקושי המרכזי היה החרדות שהתעוררו בצוותים.<\/li>\n<li><strong>מפגשי מנהלים<\/strong> של מנח\"י יצרו קרבה בין מנהלים ממערב העיר וממזרחה ומהמגזר החרדי.<\/li>\n<\/ul>\n<p><strong>הלקחים:<\/strong><\/p>\n<ul>\n<li>יש פער בין השפה של הפסיכולוגים לשפה של המנהלים. צריך לקרב ביניהן ולרתום את הדגש על תהליכים לפתרונות מעשיים.<\/li>\n<li><strong>דילמת החיסיון<\/strong>: הצורך של המערכת (מנח\"י) לדעת על תפקוד בתי הספר מבפנים, מול חובת החיסיון של הפסיכולוג. הדילמה עלתה \"בחריפות גוברת\".<\/li>\n<li><strong>ההשלכה לתפקיד<\/strong>: הרחבת התפיסה המקצועית לחיבורים בין בית-הספר למערכות נוספות ולתפיסות שמנחות את תפקוד בית-הספר.<\/li>\n<\/ul>\n<hr />\n<h3>17. מנהיגות בית-ספר–קהילה: סקירת ספרות (אבי גירלי)<\/h3>\n<p><strong>Glanz (2006), <em>School community leadership<\/em><\/strong><\/p>\n<ul>\n<li>\"There cannot be a border between the school and the community\". הגבולות נזילים, והקהילה נכללת בתוכם.<\/li>\n<li><strong>הדגם המסורתי<\/strong> (בית-הספר הוא המומחה, וההורים מחוץ לגבולות) מתאים לאוכלוסייה הומוגנית. הוא מתאים פחות לאוכלוסייה הטרוגנית.<\/li>\n<li><strong>שאלות למנהל<\/strong>:<ul>\n<li>האם הוא לוקח בחשבון את ההשפעה של הקהילה?<\/li>\n<li>האם הוא רותם אותה?<\/li>\n<li>האם פיתח דרכים לשמוע את השותפים?<\/li>\n<li>האם הוא רואה כתפקידו לפגוש את הקהילה?<\/li>\n<li>האם הוא מקשר עם הקהילה העסקית?<\/li>\n<li>האם הוא ממפה כוחות בקהילה?<\/li>\n<\/ul>\n<\/li>\n<li><strong>\"לשלוט בסביבה\"<\/strong> (מינצברג): יחסים הדדיים וזרימת תשומות פנימה והחוצה.<\/li>\n<li><strong>הורים כשותפים מלאים<\/strong>:<ul>\n<li>שיתוף בתוכניות הלימודים ובוועדות הוראה.<\/li>\n<li>נציגות הורים בכל שכבה.<\/li>\n<li>מידע על כל ילד זמין להורים בזמן אמת.<\/li>\n<li>\"מניפה\" של מסלולי קשר בין המנהל לכל ההורים.<\/li>\n<li>מעקב אחר שינויים דמוגרפיים \"בזמן אמת ולא רק לאחר שנוצר משבר\".<\/li>\n<\/ul>\n<\/li>\n<li><strong>ההשלכה על הפסיכולוג<\/strong>: \"כבר אינו פסיכולוג בית-ספר אלא הופך לפסיכולוג קהילתי\".<\/li>\n<\/ul>\n<p><strong>\"נקודות לבדיקה עצמית של המנהל המעוניין בעבודה על פי תפיסה זו\"<\/strong> (25 פריטים, כפי שמופיעים):<\/p>\n<ol>\n<li>אני בודק פעם בשנה מה ההורים חושבים על בית-הספר.<\/li>\n<li>אני תמיד מוכן לשמוע הצעות מההורים ומחברים של הקהילה.<\/li>\n<li>אני נותן פעם בחודש בממוצע הרצאה לקבוצות בקהילה.<\/li>\n<li>אני מעודד את ההורים להיות מעורבים בתכנון של תכנית הלימודים.<\/li>\n<li>אני מאוד פעיל בקהילה, או שפוליטיקאים מקומיים הם חברים משמעותיים בקהילה שלנו.<\/li>\n<li>יש לי תכנית קהילתית מבוססת, ואנחנו בודקים אותה פעם בשנה.<\/li>\n<li>אני מודע מאוד להכנסות הכלכליות הממוצעות של ההורים בקהילה שלנו.<\/li>\n<li>אני חושב שאני מכיר טוב את הרקע שממנו ההורים מגיעים ובאילו תרבויות הם גדלו.<\/li>\n<li>אני מכיר טוב מאוד את האנשים בעמדות מפתח בקהילה שלנו.<\/li>\n<li>אני מכיר טוב מאוד את השכונה שבה אנו ממוקמים, ומה יש ומה אין בה.<\/li>\n<li>אני חבר בוועדה שמשפיעה או מנסה להשפיע על איך אנחנו מלמדים בבית-הספר.<\/li>\n<li>אני מכיר את סוג הבעיות הרפואיות שיש בקהילה שלנו ואת האפשרויות שיש בה.<\/li>\n<li>אני מכיר טוב מאוד את מקומות הבילוי בשכונה שעומדים לרשותנו.<\/li>\n<li>אני חבר בכמה עמותות שמנסות לעזור לילדים עם קשיים.<\/li>\n<li>אני רואה את עצמי כאיש קשר בין הקהילה שלנו לבין בית-הספר.<\/li>\n<li>אנחנו בצוות מדברים הרבה על החשיבות של הקשר בין בית-הספר לקהילה.<\/li>\n<li>אני מאמין שהמורים יכולים ליצור קשרים קהילתיים ולתרום הרבה לקשר בין בית-הספר לקהילה.<\/li>\n<li>אני מזמין חברי קהילה ואנשים בעמדות מפתח לבקר בבית-הספר.<\/li>\n<li>אני יודע אילו עוד אלטרנטיבות לימודיות יש לילדים באזור שלנו.<\/li>\n<li>אני מעודד את המשפחות להיות מעורבות בתהליך קבלת ההחלטות.<\/li>\n<li>הבניין שלנו עומד הרבה פעמים לרשות פעילויות בקהילה, בהתאם לנהלים המקומיים.<\/li>\n<li>אני מעודד את המורים לקחת את התלמידים לפעילויות תרבותיות במוזיאונים, בטבע וכו'.<\/li>\n<li>אנחנו נותנים להורים ספרון קטן שמתאר את המשאבים והאפשרויות באזור.<\/li>\n<li>אני מקבל תרומה גם מקהילה של פנסיונרים.<\/li>\n<li>אני מבקש מעסקים קטנים להיות מעורבים במה שנעשה בבית-הספר, לפי הנהלים.<\/li>\n<\/ol>\n<p><strong>Chaltain (2014), <em>Our School<\/em><\/strong><\/p>\n<ul>\n<li><strong>ההקשר<\/strong>: בית-ספר ציבורי כושל בשיקגו, עם דימוי ירוד, הזנחה ותוכניות לימודים לא רלוונטיות.<\/li>\n<li><strong>מהלך השינוי<\/strong>:<ol>\n<li>גיוס אמהות, ואחר כך אבות.<\/li>\n<li>גיוס עסקים קטנים בעזרת ההורים.<\/li>\n<li>הבטחה להביא בחשבון את מה שחשוב להורים, ובנייה משותפת של תוכניות לימודים, פעילויות ושיקום פיזי.<\/li>\n<li>בתוך כחצי שנה בית-הספר הפך \"חי ותוסס\".<\/li>\n<li>גיוס התקשורת המקומית, ובשנה שאחרי עלייה ברישום.<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<p><strong>היישום של הכותב כפסיכולוג בית-ספר:<\/strong><\/p>\n<ul>\n<li>בירור איזה מקום המנהלים נותנים להורים, והאם יש נציג הורים בכל שכבה וכיתה.<\/li>\n<li>רשת תקשורת דרך הורים, כדי להגיע להורים מרוחקים.<\/li>\n<li>בניית תפיסה של <strong>הורים כשותפים<\/strong>.<\/li>\n<li>כתוצאה מכך, בית-הספר מוכן לבחון את עצמו ולדבר על נושאים של ייעוץ מערכתי, כמו שינויים נדרשים והחששות מפניהם.<\/li>\n<\/ul>\n<hr />\n<h3>18. ביבליוגרפיה כללית לעבודה פסיכולוגית מערכתית (כפי שמופיעה בעלון)<\/h3>\n<ul>\n<li>בטלר, ר. (תשמ\"ז). \"אבחון מערכת\". בתוך: לסט, א. (עורך), <em>עבודה פסיכולוגית בבית-הספר<\/em>. ירושלים.<\/li>\n<li>האלטון, ו. (2003). \"על אחדים מההיבטים הלא מודעים בחיים הארגוניים: תרומות מן הפסיכואנליזה\". <em>אנליזה ארגונית<\/em>, 6.<\/li>\n<li>וויטקר, ד.ס. וליברמן, מ.א. (1964). \"מודל הקונפליקט המוקדי\". בתוך: רוזנוסר, נ., <em>הנחיית קבוצות<\/em>.<\/li>\n<li>ויינברג, ח. ושניידר, ס. (2007). <em>הקבוצה הגדולה, תהליכים<\/em>.<\/li>\n<li>מינצברג, ג. (תשמ\"ג). \"מטרות ספציפיות בארגונים\". <em>כוח בתוך ומסביב לארגונים<\/em>.<\/li>\n<li>רויטמן, מ. (1989). \"הזדהות השלכתית: מפתח להבנת תהליכים בין-אישיים וקבוצתיים\". <em>שיחות<\/em>, ג'.<\/li>\n<li>שיין, א. (2003). <em>פילוסופיה כללית של סיוע: ייעוץ לתהליך<\/em>. אתר פסיכולוגיה עברית.<\/li>\n<li>שרון, מ. (2010). <em>חוויית הכניסה לתפקיד ניהול בית-ספר מנקודת מבטן של מנהלות \"צומחות\" ו\"צונחות\"<\/em>. אורנים.<\/li>\n<li>Rioch, N.J. (1997). עבודתו של ביון על קבוצות. בתוך: רוזנוסר, <em>הנחיית קבוצות<\/em>.<\/li>\n<li>Ambrose, A. (2001). <em>An introduction to transitional thinking<\/em>.<\/li>\n<li>Vega Zagier, R. (2000). <em>The organization of work: Contributions from open systems theory<\/em>. In <em>The unconscious at work<\/em>.<\/li>\n<li>הערה בעלון: מאמרים נוספים נמצאים בבנק המאמרים בפורטל ובשני קלסרים שהכין המרכז המערכתי בכל תחנות השפ\"ח.<\/li>\n<\/ul>\n<hr />\n<h3>19. מה מתחדש בדיאגנוסטיקה (סמדר ספיר-יוגב)<\/h3>\n<ul>\n<li><strong>צוות הפיתוח בדיאגנוסטיקה<\/strong> מנחה קבוצות הדרכה לסטודנטים ולמתמחים, מלמד ליקויי למידה ומפתח ימי עיון.<\/li>\n<li><strong>יום עיון<\/strong> בנושא \"מבט דיאגנוסטי מחודש על העולם הרגשי ועל הקשר בינו לבין הקוגניציה\". חומרים השלכתיים נבחנו מנקודת המבט של תאוריית הסלף (מרשל סילברסטיין) ושל יחסי אובייקט (סולם <strong>SCORS<\/strong> של דרו ווסטן). נלמד גם מבחן <strong>אכנבך<\/strong>.<\/li>\n<li><strong>CHC<\/strong>: נלמדו תיאוריות משכל ומושג g, ואחר כך היכולות: <strong>יכולת פלואידית, זיכרון לטווח קצר, מהירות עיבוד, אחסון ושליפה לטווח ארוך, ידע מגובש, עיבוד חזותי ועיבוד שמיעתי<\/strong>. <strong>לכל יכולת<\/strong> עברו על ארבעה צעדים: (1) ההגדרה והתאוריה ומה השפעתה על הלמידה. (2) אילו רמזים לקושי עולים באינטייק עם המורה, ההורים והילד. (3) מה נראה בתהליך האבחון, מעבר למבחנים הספציפיים. (4) מה ממליצים למורה, להורים ולילד.<\/li>\n<li><strong>וודקוק-ג'ונסון<\/strong> נמצא בפיתוח מתקדם ומבוסס על CHC. הוא מיועד לגילים 4–18, ליהודים ולערבים.<\/li>\n<li><strong>תקן ארצי לכתיבת חוות דעת פסיכולוגית<\/strong> פורסם, ומבוסס \"רובו ככולו\" על התקן שהשפ\"ח הירושלמי פרסם ב-2011. <strong>התקן מחייב<\/strong>.<\/li>\n<li><strong>התאמות בבחינות<\/strong>: המצב הנוכחי פוגע בליקויי הלמידה עצמם ומעמיק פערים בין מרכז לפריפריה, בין עניים לעשירים ובין יהודים לערבים. התאמות עלולות לפגוע בדימוי העצמי ובתחושת המסוגלות. <strong>המגמה במשרד החינוך<\/strong> היא הגבלה נוספת של ההתאמות לצד הרחבת ההוראה המותאמת (מסמך של ד\"ר חיה לשם, \"התאמות על רצף הלמידה וההיבחנות\").<\/li>\n<\/ul>\n<hr />\n<h3>20. ריכוז שאלות מנחות לאבחון מערכת שעולות מהגיליון<\/h3>\n<ul>\n<li><strong>ערכים (סופר-אגו)<\/strong>:<ul>\n<li>האם מורה או תלמיד אקראיים יודעים לנקוב בשלושת הערכים המרכזיים?<\/li>\n<li>האם הערכים עולים בדיוני הצוות?<\/li>\n<li>האם הם מתבטאים במבנים?<\/li>\n<li>האם יש מודעות לפערים בין מוצהר למורגש, בין תתי-קבוצות, ובין ערכי המייסדים לאוכלוסייה הנוכחית?<\/li>\n<li>האם הסופר-אגו מאוזן, מנופח או נוקשה?<\/li>\n<li>האם יש איזון בין ערכים מוסריים, כלכליים ורגשיים?<\/li>\n<\/ul>\n<\/li>\n<li><strong>משימות ומבנים (אגו)<\/strong>:<ul>\n<li>האם יש מבנים מותאמים למשימות?<\/li>\n<li>האם ישיבות מתקיימות ומרגישות משמעותיות?<\/li>\n<li>האם התפקידים מוגדרים?<\/li>\n<li>מהם המשאבים, מהו הדימוי העצמי ומה ההיסטוריה שמשפיעה עליו?<\/li>\n<li>האם יש גמישות ויצירתיות?<\/li>\n<\/ul>\n<\/li>\n<li><strong>מנגנונים<\/strong>: מי יוזם, מי מוביל, מי מזמן, ומי בוחן את היתכנות המפגשים לאורך השנה?<\/li>\n<li><strong>הגנות<\/strong>: האם יש הכחשת שינוי באוכלוסייה? השלכת אשמה החוצה? פיצול של חדר המורים? הימנעות מישיבות? עיסוק אובססיבי בנהלים? תנודות בין אידאליזציה לדה-ולואציה?<\/li>\n<li><strong>איד והיסטוריה<\/strong>:<ul>\n<li>מה ההיסטוריה של בית-הספר, למשל פיטורי מנהלים?<\/li>\n<li>איזה תלמיד או תופעה \"מקבלים מקום\" במערכת?<\/li>\n<li>האם הצוותים תקועים בהנחות בסיסיות?<\/li>\n<li>האם יש תהליכים מקבילים לאוכלוסייה הנשרתת?<\/li>\n<\/ul>\n<\/li>\n<li><strong>ניהול<\/strong>:<ul>\n<li>האם יש צוות ניהול אפקטיבי?<\/li>\n<li>האם יש קואליציות חוצות גבולות?<\/li>\n<li>האם יש האצלת סמכויות?<\/li>\n<li>האם המנהל מוכן לבדוק את עצמו?<\/li>\n<\/ul>\n<\/li>\n<li><strong>חילופי מנהל<\/strong>:<ul>\n<li>האם המנהל צומח או מוצנח?<\/li>\n<li>מה מצב \"הגוף הקולט\"?<\/li>\n<li>אילו קונפליקטים רדומים מתעוררים?<\/li>\n<li>האם יש ליווי מבחוץ?<\/li>\n<\/ul>\n<\/li>\n<li><strong>כיתה מקדמת וחינוך מיוחד<\/strong>: מיקום הכיתה, מקום המחנכת, הקשר עם המנהל, השילוב, והאם יש ישיבות רב-מקצועיות.<\/li>\n<li><strong>קבוצה גדולה<\/strong>: אילו תתי-קבוצות מיוצגות בקולות שעולים?<\/li>\n<li><strong>גלוי וסמוי<\/strong> (רוזנבליט): מה אסור לדעת? מה מפחיד לדעת? מה לא נרצה שהיועץ יגלה?<\/li>\n<li><strong>קהילה<\/strong>: גבולות, שותפות עם הורים, מתנ\"ס ומינהל קהילתי, והאם המשימה המרכזית מובנת בשלוש הרמות.<\/li>\n<\/ul>\n<hr />","practice":"<ol>\n<li><strong>כשמגיעה הפניה על \"עץ\" אחד, להסתכל על \"היער\"<\/strong>. כשמפנים תלמיד, הורה, כיתה או מורה \"בעייתיים\", כדאי לשאול לצד הבירור הפרטני: \"על מה זה עשוי להיות סימפטום במערכת?\" אפשר להיעזר בטבלת התרגום (סעיף 2א), ולזכור שכשילד אחד יוצא, אחר תופס את מקומו.<\/li>\n<li><strong>להשתמש במודל האישיות הבית ספרית ככלי היכרות שנתי<\/strong> עם בית-ספר חדש. כדאי למפות סופר-אגו, אגו, הגנות ואיד בעזרת השאלות שבסעיף 20, ולעשות זאת <strong>יחד עם המנהל<\/strong> ככל האפשר, כי לפי הטקסט תהליך ההערכה המשותף מחזק את בית-הספר.<\/li>\n<li><strong>לקבוע פגישה קבועה עם המנהל<\/strong> ולברר מי יוזם, מוביל ומזמן את המנגנונים (צב\"מ, צוות טיפולי, צוות מוביל). כך המבנים הופכים לכלי ניהולי ולא נשארים על הנייר.<\/li>\n<li><strong>לשים לב ל\"היסחפות\" שלך<\/strong> לדפוסי המערכת: קואליציה רגשית עם הצוות נגד המנהל, ייאוש, תחושה שהתפקיד \"מנוטרל\". אפשר להיעזר בטבלת רוזנבליט (רמת \"אני\") לרפלקציה, ולהביא את זה להדרכה או להתייעצות מערכתית. ההתייעצות היא שאפשרה להחזיר את האמפתיה.<\/li>\n<li><strong>בצוות או בכיתה שתקועים בחרדה, לזהות את הנחת היסוד<\/strong> (תלות, מאבק-בריחה, זיווג) ולבנות <strong>פורום מכיל קבוע<\/strong>. כדאי להשתמש במגע אישי ובדיאלוג מכבד שבו המבוגר לא מוותר על סמכותו, ולהימנע מהגנה יתרה (תלות) או מפתרונות \"מעל הראש\" (זיווג). מודל דף המשוב של שפיגלמן הוא דוגמה ישימה.<\/li>\n<li><strong>בעבודה עם מורים, להימנע גם מ\"ערפל מושגי\" וגם מרשימות \"עשה ואל תעשה\"<\/strong>. עדיף לבנות קשר תהליכי, ולעיתים קבוצת מורות, שבו את משמשת זולת-עצמי למורה. כדאי לשקול קבוצה כדי להגיע ליותר מורות בשעות המעטות, ולהקפיד שהיא תתקיים בשעות העבודה ולא \"בהתנדבות\".<\/li>\n<li><strong>בכיתה מקדמת או בחינוך מיוחד, להשתמש בכיתה כ\"פריזמה\"<\/strong>: היכן היא ממוקמת, מה מקום המחנכת, מי \"האמא\" של הכיתה. כדאי לקדם ישיבה רב-מקצועית מסודרת עם הגדרת תפקידים.<\/li>\n<li><strong>בקונפליקט עם הורים, לבדוק פערי ערכים<\/strong> לפי עשרת ערכי שוורץ ולקדם שיח פתוח על ערכים, בלי לשאוף ל\"איחוד\".<\/li>\n<li><strong>במעברים ובמשברים (חילופי מנהל, סגירה, מעבר בין מסגרות) לצפות לאבל ולהתעוררות של קונפליקטים רדומים<\/strong>. כדאי להציע ליווי מבחוץ ולהשתמש בכלים נרטיביים: נקודות אור, תמונת עתיד, re-membering, ספרי זיכרון ועדים.<\/li>\n<li><strong>בעבודה עם הקהילה ועם מנח\"י, לזכור את שאלת החיסיון<\/strong> מול הצורך של הממשקים לדעת. כדאי להבהיר מראש עם ההדרכה מה משתפים ועם מי.<\/li>\n<\/ol>\n<hr />","questions":"<ol>\n<li>בחר/י בית-ספר שאת/ה עובד/ת בו ונסה/י לתאר את \"האישיות\" שלו לפי המודל המבני. האם הסופר-אגו שלו מגובש, עמום, מנופח או נוקשה? אילו הגנות בולטות בו? איזה סימפטום מערכתי אולי \"מתחפש\" להפניה פרטנית שקיבלת לאחרונה?<\/li>\n<li>השתמש/י בשורת \"אני\" ובשורת \"ארגון\" בטבלת רוזנבליט: מה את/ה לא רוצה לשאול או לדעת על בית-הספר שלך? מה אסור לדבר עליו שם? איך זה משפיע על העבודה שלך?<\/li>\n<li>האם קרה לך שנשאבת לקואליציה עם צד אחד במערכת (צוות נגד מנהל, מחנכת נגד הנהלה)? מה עזר או היה יכול לעזור לך לחזור לעמדה אינטגרטיבית, במונחי קליין?<\/li>\n<li>בצוות או בכיתה שאת/ה מכיר/ה ש\"לא מצליחים לקדם את הנושאים שלשמם התכנסו\": איזו הנחת יסוד פועלת שם, ומה יכול לשמש \"מיכל\" שיאפשר מעבר לקבוצת עבודה?<\/li>\n<li>איך את/ה מתרגם/ת מושג פסיכולוגי (למשל מיכל, זולת-עצמי או השלכה) למורה, בלי ליפול ל\"ערפל מושגי\" ובלי \"לקשור את המושג לכיסא\"? מה המורה צריכה כדי להיות זולת-עצמי לתלמיד, ומי מחזיק אותה?<\/li>\n<li>מה גבולות התפקיד שלך כשבית-הספר נפתח לקהילה, למנח\"י או לפיקוח? איך היית מתמודד/ת עם בקשה של גורם עירוני לדעת \"מה באמת קורה\" בבית-ספר שאת/ה מלווה?<\/li>\n<\/ol>\n<hr />","quotes":"<ol>\n<li>\"לפעמים ההורה הנוקשה הוא סימפטום למערכת לא גמישה, התלמיד הבעייתי - למערכת לא מכילה או חסרת גבולות, והכיתה הלא מרוסנת - לקשיים ביחסים בתוך הצוות.\" (שטיינברג)<\/li>\n<li>\"לפעמים התחושה היא שהחזון תלוי על הקיר בחדר המנהל אך נעדר במסדרונות בית-הספר.\" (שטיינברג)<\/li>\n<li>\"למדנו גם שבמקום בו מופיעות פגיעות ביחסים יופיעו גם פגיעות במשימה המרכזית של בית-הספר ובמימוש ערכים ומטרות החשובים לו.\" (קדר)<\/li>\n<li>\"כשמדברים על קבוצה גדולה, לא חושבים על הפרט, אלא על תתי קבוצות, וכל קול שעולה מהקבוצה, מייצג קול של תת קבוצה.\" (סימצקין)<\/li>\n<li>\"לא די בפתיחת דלת להשמעת נרטיב אישי, זהו צעד ראשון, יש צורך בחיפוש דרך להשפעה רחבה של הנרטיב.\" (פלזנטל-ברגר)<\/li>\n<\/ol>\n<hr />"},"level":"שנים ב'-ג' לרוב הגיליון. מאמרי היסוד מתאימים כבר לשנה א': \"האישיות הבית ספרית\", \"הפסיכולוג החינוכי והקבוצה הגדולה\" ו\"תרגום השפה הפסיכולוגית\". שנה ד' מתאימה לחלקים על קונסולטציה למנהל, ליווי חילופי מנהלים ותכנית בית-ספר בקהילה.","stype":"מאמר. ליתר דיוק זו אסופת מאמרים בעלון מקצועי ולא מדריך שיטתי אחד. היא כוללת מאמרים תיאורטיים, תיאורי מקרים של התערבויות מערכתיות, סקירת ספרות וכמה מודלי עבודה (כמו \"האישיות הבית ספרית\", הכיתה המקדמת ככלי לאבחון מערכת, תרגום השפה הפסיכולוגית למורים וטבלת שאלות מנחות לתהליכים לא מודעים).","tldr":"הגיליון מוקדש כולו לעבודה מערכתית של הפסיכולוג החינוכי בבית-הספר. שמו, \"לראות את היער...\", מבטא את הקריאה להסתכל מעבר ל\"עצים\" הבודדים (התלמיד הבעייתי, ההורה הנוקשה, המנהל השתלטן) אל המערכת כולה. הוא נפתח בתיאור \"המרכז לעבודה מערכתית\" שהוקם בשפ\"ח…","search":"הגיליון מוקדש כולו לעבודה מערכתית של הפסיכולוג החינוכי בבית-הספר. שמו, \"לראות את היער...\", מבטא את הקריאה להסתכל מעבר ל\"עצים\" הבודדים (התלמיד הבעייתי, ההורה הנוקשה, המנהל השתלטן) אל המערכת כולה. הוא נפתח בתיאור \"המרכז לעבודה מערכתית\" שהוקם בשפ\"ח ירושלים ב-2008. למרכז שני קווי פעולה: התערבות במשברים מערכתיים וליווי תהליכי צמיחה בריאים. למשברים מוצגות שלוש קטגוריות סיבות: ניהול, שינויים בסביבה, ושינויים פנימיים או התנגדות לשינוי. המאמר המרכזי, \"האישיות הבית ספרית\" של יעל שטיינברג, מציע להשתמש במודל הסטרוקטורלי של פרויד כמבנה מארגן להערכת בית-ספר. הסופר-אגו הוא הערכים, החזון והאיסורים. האגו הוא המשימות, המבנים, המשאבים, הדימוי העצמי והגמישות. ההגנות הן הכחשה, השלכה, פיצול וכדומה. האיד הוא ההיסטוריה, הדחפים והתהליכים הלא מודעים ברמת הפרט והקבוצה. לפי המאמר, לעיתים קרובות הבעיה המוצגת היא סימפטום מערכתי. סביב המסגרת הזו מובאים כלים ומושגים פסיכודינמיים-ארגוניים: הלא-מודע הארגוני והחברתי (האלטון, הופר/וינברג), טבלת שאלות מנחות לגלוי ולסמוי (רוזנבליט), הנחות היסוד של ביון, העמדה הסכיזו-פרנואידית מול הדיכאונית (קליין) והקבוצה הגדולה (וינברג). לצידם מובאים כלים נרטיביים: סיפור דומיננטי מול אלטרנטיבי, unique outcomes, re-membering ועדים. בגיליון כמה תיאורי מקרה: קונסולטציה זוגית למנהל חדש בבית-ספר אלים, שינוי נרטיב בבית-ספר מצטמק, ליווי סגירה של בית-ספר, מעבר מחטיבה לתיכון שהוביל למשבר כיתתי, קבוצות מורות בחינוך החרדי, ובית-ספר לילדים עם נכויות קשות. לצידם מאמרים על חילופי מנהלים כ\"השתלת איבר\", על הכיתה המקדמת כ\"פריזמה\" לאבחון המערכת, על פערי ערכים בין הורים לבית-הספר (שוורץ), ועל תכנית \"בית-ספר בקהילה\" שבה הפסיכולוג מתרחב ל\"פסיכולוג קהילתי\". הגיליון נחתם בביבליוגרפיה מערכתית ובעדכוני דיאגנוסטיקה (CHC, תקן ארצי לחוות דעת והתאמות בבחינות). לבית-ספר יש \"אישיות\", כולל מצוקות, טראומות, סימפטומים והגנות. לכן אפשר להבין אותו ולהתערב בו בדומה לפרט, וגם הוא יכול להיתרם מהתערבות פסיכולוגית. הבעיה המוצגת היא לעיתים קרובות סימפטום מערכתי ולא \"הבעיה עצמה\". כשמוציאים את \"הילד הבעייתי\", מישהו אחר תופס את מקומו. האתגר המרכזי של הפסיכולוג הוא לזהות אירועים כסימפטומים ולהבין אותם לאור האישיות הבית ספרית. המודל הסטרוקטורלי של פרויד מתאים כמבנה מארגן להערכה: ערכים (סופר-אגו), משימות ומבנים (אגו), הגנות, והיסטוריה ודחפים לא מודעים (איד). תהליך ההערכה כשלעצמו מחזק את בית-הספר, במיוחד כשהוא נעשה יחד עם המנהל והצוות. פגיעה ביחסים מובילה לפגיעה במשימה. משברים פוגעים במערכות היחסים בין קבוצות ובתוכן, ובמבנים הארגוניים: צוות ניהול, צוות בין-מקצועי, הגדרות תפקיד וחלוקת סמכויות. טיפול במשבר מתאפשר בעיקר בשני מצבים: כשהמנהל מוכן לבדוק את עצמו, או כשהמשבר כבר \"מתפוצץ\" החוצה. מנהל מודע שהגנותיו אינן נוקשות יכול להתחיל בבדיקה ושינוי עוד לפני שנוצר משבר. צמיחה בריאה היא \"שינוי ממעלה שלישית\". בית-הספר חושב מחדש על מוסכמות, בוחן את הפער בין מטרות מוצהרות למטרות בפועל, פונה לכוחות הפנימיים שלו ומפחית את התלות במערכת החיצונית (משרד החינוך). המשימה המרכזית קיימת בשלוש רמות: ההצהרתית, הלא-מודעת וזו שעובדים עליה בפועל (וגה-זאגייר). הפער בין המשימה שמשרד החינוך מצהיר עליה (השכלה רחבה, ערכים, חשיבה) לבין מה שנעשה בפועל (מיומנויות יסוד ומבחנים) מטשטש את ערכי בתי הספר ומטרותיהם. גם הפסיכולוג הוא חלק מהשדה. הוא נושא חרדות, הגנות וציפיות, שלו ושל השפ\"ח, ועלול \"להישאב\" לדפוסי המערכת (קואליציה רגשית, פיצול). התייעצות מערכתית חיצונית עוזרת לו להשיב את האמפתיה ולבנות תמונה אינטגרטיבית. בקבוצה בחרדה, המטרה היא מעבר מ\"קבוצת הנחה בסיסית\" ל\"קבוצת עבודה\" (ביון). מה שעוזר הוא יצירת פורום מכיל שמדבר על החרדה, מגע אישי (תפקודי זולת-עצמי) ודיאלוג מכבד שבו המבוגר אינו מוותר על סמכותו. בקבוצה גדולה (כיתה, חדר מורים, בית-ספר) כל קול מייצג תת-קבוצה. ויכוח \"אישי\" בחדר המורים הוא לעיתים ביטוי של קולות רחבים יותר. ילד בודד נעזר בחיפוש מכנה משותף עם ילדים דומים לו ולא בכפיית קשר. חילוף מנהל הוא כמו \"השתלת איבר חיוני\". הוא כרוך באבל, בחרדה, בדחייה, בצורך בהתאמה ובליווי מבחוץ, ובהתעוררות של קונפליקטים רדומים. מנהלים \"מוצנחים\" נוטים יותר למהלכים כוחניים. יחס בית-הספר לכיתה המקדמת משקף את ערכיו ואת יכולת ההכלה שלו. מיקום הכיתה, מעמד המחנכת וקיום ישיבות בין-מקצועיות הם מדדים אבחוניים למערכת כולה. הבנת הקשר מורה–תלמיד אינה עוברת בהנחיות \"עשה ואל תעשה\" ולא ב\"ערפל מושגי\". היא עוברת בעבודה תהליכית שבה הפסיכולוג משמש זולת-עצמי למורה, בדומה למודל של אורנשטיין לעבודה עם הורים. קונפליקטים בין הורים לבית-הספר נובעים לא פעם מפערי ערכים לא מודעים (שוורץ). הפתרון אינו \"איחוד ערכים\" אלא שיח פתוח על ערכים. נרטיב בית ספרי ואישי אפשר לשנות. מוצאים נקודות אור ו-unique outcomes, מגייסים עדים ומחברים את נוף הפעולה לנוף הזהות. עם זאת, \"לא די בפתיחת דלת להשמעת נרטיב אישי\": צריך השפעה רחבה במערכת. כשבית-הספר נפתח לקהילה, תפקיד הפסיכולוג מתרחב מ\"פסיכולוג בית-ספר\" ל\"פסיכולוג קהילתי\" העוסק בגבולות, בשותפויות ובחרדות הצוות מפני שינוי. התפקיד המורחב מעורר גם דילמות של חיסיון מול הממשקים. האישיות הבית ספרית: ה\"רוח\" והאווירה של בית-ספר, במונחים פסיכולוגיים. היא נבחנת דרך תפקוד המערכת, החלקים הלא מודעים, הדימוי העצמי ותחושת הקוהסיביות. סימפטום מערכתי: קושי שנראה פרטני (הורה, תלמיד, כיתה, מורה, מנהל) ומבטא \"קול במערכת\", כלומר קושי של המערכת כולה. הסופר-אגו הבית ספרי: הערכים, האידאולוגיה, החזון, החוקים והאיסורים. הוא יכול להיות מגובש ונוכח, עמום, מנופח או נוקשה. האגו הבית ספרי: החלק הפועל במציאות. הוא כולל את המשימות המרכזיות, המבנים הארגוניים, המשאבים, הדימוי העצמי, הגמישות, היצירתיות והאותנטיות. האיד הבית ספרי: החלקים הלא מודעים של הפרט, הקבוצה והקהילה. \"מה שנמסר בתורשה\" הוא ההיסטוריה והדפוסים של בית-הספר. כאן נמצאים גם הדחפים (מיניות ותוקפנות). הגנות מערכתיות: מנגנונים לא מודעים שתפקידם למנוע הצפה ופירוק ולשמר תחושת ערך: הכחשה, השלכה, השלכה הזדהותית, פיצול, רציונליזציה, הימנעות, אובססיביות, אידאליזציה ודה-ולואציה. לא-מודע ארגוני (האלטון; קטס דה-וריס): גם לארגון יש \"מבנים נפשיים\", מנגנוני הגנה, השלכות והזדהויות. לא-מודע חברתי (הופר, אצל וינברג): הסדרים חברתיים, תרבותיים ותקשורתיים שאנשים אינם מודעים להם. הוא משותף ו\"מובנה-יחדיו\" (co-constructed), וכולל חרדות, הגנות, פנטזיות, מיתוסים, זיכרונות, טראומות ו\"רגעי תהילה\". קבוצת עבודה מול קבוצת הנחה בסיסית (ביון): קבוצה הפועלת למשימה (מקבילה לאגו) לעומת קבוצה שבחרדה נסוגה לתפקוד הגנתי אנטי-משימתי. הנחות היסוד (ביון): תלות (תקווה במנהיג כל-יכול), מאבק-בריחה (fight-flight: מאבק פנימי או נסיגה) וזיווג (pairing: תקווה שאיחוד של שניים יביא ישועה, תוך הימנעות מההווה). עמדה סכיזו-פרנואידית מול עמדה דיכאונית (קליין): מטרת ההתערבות היא מעבר מפיצול, מחנות והאשמות לאינטגרציה וחיבור. קואליציות חוצות גבולות: בריתות של המנהל עם ממשקים חיצוניים (כמו הפיקוח) במקום עם הצוות שלו. הן פוגעות בנאמנויות ובניהול הגבולות (וגה-זאגייר). המשימה המרכזית (וגה-זאגייר): המשימה שלשמה קיים הארגון. היא נבחנת בשלוש רמות: הצהרתית, לא-מודעת ובפועל. בשבילה נדרשים מבנים ומנגנונים ברורים עם משימות ידועות. שינוי ממעלה שלישית: שינוי שבו בית-הספר מגדיר מחדש את מטרותיו מתוך הכוחות שלו ומפחית את ההישענות על המערכת החיצונית. קבוצה גדולה (וינברג): קבוצה שאי אפשר להקיף את כל משתתפיה במבט אחד. היא מעוררת ניכור, חרדה ו\"שקיפות\", ומתמודדים בה דרך תתי-קבוצות ו\"מערכת השתייכות מורכבת\". זולת-עצמי (selfobject) (קוהוט): דמות שממלאת עבור הפרט תפקודים נפשיים שאינו יכול למלא בעצמו: שיקוף (mirroring) וקוטב לאידאליזציה. המחנכת, המבוגרים בבית-הספר ואפילו הקבוצה יכולים למלא תפקיד כזה. מיכל / מיכל מורחב (ויניקוט): המחנכת משמשת מיכל לילדים, ובית-ספר מכיל הוא \"מיכל מורחב\" למיכל שלה. בית-ספר מדיר פועל נגד המיכל. סיפור דומיננטי / סיפור אלטרנטיבי / unique outcomes (ווייט): הסיפור המקובל שנתפס כ\"מציאות\", לעומת סיפור מועדף שנבנה מאירועים יוצאי דופן. re-membering ועדים: זכירה מחדש של אנשים ואירועים מועדפים כדי להתחבר לשייכות ולמשמעות. העדים הופכים שותפים פעילים לסיפור האלטרנטיבי. נוף הפעולה ונוף הזהות הם החיבור בין עשייה במציאות לבין מתן משמעות לה. \"ערפל מושגי\" מול \"מושג קשור לכיסא\": שתי דרכים כושלות לתרגם ידע פסיכולוגי למורים: עמימות מקצועית, או רשימת הנחיות מעשיות שמרוקנת את המושג. הדרך המוצעת היא דיאלוג תהליכי."},{"id":"reflection","title":"חשיבה טיפולית במסגרת חינוכית: מסמך רפלקציה על הכלה","authors":"לא צוין","year":"","cite":"מסמך סיכום ורפלקציה (כותב/ת לא צוין/ה), סביב גרינולד, נוטקביץ, בירן ופרלוב.","url":null,"kind":"article","desc":null,"file":{"orig":"חשיבה טיפולית במסגרת חינוכית- מתח והשלמה ברמה קלינית ארגונית.pdf","ext":"pdf","pdf":"reflection.pdf","pages":7,"bytes":144567},"placements":[["s2","system"]],"extra":true,"ref":"מסמך הרפלקציה על הכלה","inFolder":true,"srcTitle":"חשיבה טיפולית במסגרת חינוכית: מתח והשלמה ברמה קלינית וארגונית (מסמך סיכום ורפלקציה; כולל גם \"המיכל והכלתו\", הכלה לפי בירן, ו\"החזקה והכלה ומה שביניהן\")","secs":{"abstract":"<p>המסמך מתחיל בסיכום קצר, מגוף שלישי, של מאמרה של גרינוולד. ההבחנה בין עמדה חינוכית-מסתגלת לעמדה טיפולית-רפלקטיבית מיוחסת בו למנוני (1993). הוא מציג את הנושאים העיקריים: המטפל כאובייקט טרנספרנסיאלי מול אובייקט התפתחותי, הסביבה החינוכית כאובייקט התפתחותי, הצורך במנטליזציה וביכולת \"לשחק עם המציאות\", והמטפל כ\"שותף למערך התערבותי רחב\". הוא מזכיר גם את המתח בין DOING ל-BEING, שבמאמר המקורי משמש רקע להבחנה בין שני סוגי האובייקטים. מכאן הכותב/ת עובר/ת לטענה משלו/ה: רפורמת ההכלה אינה בונה את היכולות האלה בצוותים, ולכן היא \"תקרה על גבם של צוותים חינוכיים לא מוכנים מספיק ועל כתפיהם של התלמידים החלשים בחברה\". אחר כך מסוכמים מושגי המיכל וההכלה (נוטקביץ, ביון, סטוקס, אובהולצר, ויניקוט), כולל הישום לארגונים ולתפקיד המנהל בניהול גבולות המיכל. מוצגות חמש הזירות של יחסי מכיל-מוכל לפי בירן, וההבחנה של פרלוב בין החזקה (ויניקוט) להכלה (ביון). בסוף הכותב/ת משתמש/ת במושגים כדי לתאר את מערכת החינוך: הצוותים הם \"תינוק צורח\", משרד החינוך הוא \"אם\" שמגיבה באימה ולא בהכלה, והשפ\"חים \"עושי דברה של האם\" בוועדות. הכותב/ת מציע/ה להשתהות עם העלייה במספר הילדים עם הצרכים המיוחדים ולחקור את משמעותה.<\/p>","ideas":"<ul>\n<li><strong>מה נוסף או הודגש לעומת המאמר<\/strong>:<ul>\n<li>גרינוולד \"נשארה עם תחושת החמצה\" לגבי השאלה אם השינוי ההתנהגותי שהשיגה ביטא שינוי בעולמו הפנימי של הילד.<\/li>\n<li>שתי עמדות \"מהותיות\" של הפסיכולוג: DOING ו-BEING. במאמר המקורי מוצג המתח בין doing ל-being (או בין פירוש לסיפוק) כרקע להבחנה בין אובייקט טרנספרנסיאלי לאובייקט התפתחותי.<\/li>\n<li>הסיכום מתרגם את שתי העמדות לעמדה <strong>התפתחותית<\/strong> ולעמדה <strong>טרנספרנסיאלית<\/strong>, וקובע שכדי להכיל תלמידים עם צרכים מיוחדים צריך לעזור לצוות החינוכי לפתח את שתיהן. זו \"משימה מורכבת מאד ותדרוש זמן ומשאבים רבים\".<\/li>\n<\/ul>\n<\/li>\n<li><strong>ביקורת על רפורמת ההכלה<\/strong>: לדעת הכותב/ת, הוגי הרפורמה לא בחנו אותה מספיק מנקודת מבט תיאורטית ויישומית. ה\"סל השקלי\" אינו עוסק ביצירת היכולות הנדרשות (מנטליזציה, משחק עם המציאות, תנועה בין עמדות). לשם כך דרושים מרחבים לחשוב, לעבד רגשות, להביא דילמות, ואנשים שיעזרו \"בהחזקה\" של הילדים.<\/li>\n<li><strong>ההשוואה לחינוך המיוחד<\/strong>: בחינוך המיוחד יש מספר תלמידים קטן יותר, צוות גדול ורב-מקצועי, מסורות עבודה, והתאמה של הצוות לחריגויות. בכיתה גדולה עם מורה אחת, שצריכה להשיג הישגים ולשמור על אקלים, כל התשומות מופנות לתפקוד ולא לעולם הפנימי. הדוגמה: מורה בבית ספר לתלמידים עם בעיות התנהגות שמקדישה שעה שלמה לתלמיד בהתפרצות זעם, ומעבירה לו את המסר \"אתה חשוב לי\".<\/li>\n<li><strong>המיכל בארגון (לפי נוטקביץ)<\/strong>: כמו מטפל, גם קבוצה וארגון יכולים להכיל חלקים מעוררי חרדה, כאב ואשמה, או להיפטר מהם בהשלכה לתוך תת-ישות. ההנהלה צריכה לספק \"מיכל אמין\" (סטוקס, 1994), ולשם כך לברר את המשימה המרכזית ולהגדיר תפקידים בהלימה לה. מוסדות שאינם מודעים לתפקידם כמיכלים בונים מבני הגנה שפוגעים בעבודה ובבריאות העובדים (אובהולצר, 1994).<\/li>\n<li><strong>שאלות לבית הספר בעידן הרפורמה<\/strong>: איך בית הספר מגדיר לעצמו משימה מרכזית מותאמת, ואיך הוא שומר עליה? מה תפקיד הפסיכולוג בהכלת החרדה של הצוות וההנהלה מול שינוי המשימה? אילו מבנים צריכים להתפתח? איך מנהלים את גבולות המיכל ויוצרים \"רשת ביטחון\" להורים, למורים ולתלמידים?<\/li>\n<li><strong>הכלה היא פעולה אקטיבית<\/strong>: היא \"לא כפי שנוטים לחשוב פונקציה פסיבית של ספיגה\", אלא פעולה שדורשת יצירתיות, סקרנות וגילוי. במצב בריא המכיל והמוכל מגדלים זה את זה, ובמצב פתולוגי הם מתקיפים ומחלישים זה את זה. תנאי להכלה הוא \"פניות\": להשתחרר מידע מוקדם (תיאוריות, זיכרונות, תשוקה לשינוי) ולהקשיב קשב דק.<\/li>\n<li><strong>החזקה מול הכלה (פרלוב)<\/strong>: החזקה, לפי ויניקוט, היא כלל העשייה האימהית, הפיזית והנפשית, ששומרת על \"רצף המשכיות החיים\" (going on being) ומגינה מפני \"חדירויות\" (impingements). כשהחדירויות רבות, עלול להיווצר נתק בין עצמי אמיתי לעצמי כוזב. ויניקוט החזיק מטופלים גם פיזית ושינה בשבילם את הסטינג. הכלה, לפי ביון, היא קבלת החלקים המושלכים (ובעיקר חרדת המוות), עיבודם בלי להחזיר אותם לתינוק, וחשיבה על משמעות הרגש שמתעורר. כך מתפתחת אצל הילד יכולת הכלה משלו.<\/li>\n<li><strong>מערכת החינוך כדיאדה אם-תינוק<\/strong>: לפי הכותב/ת, הצוותים \"צורחים\" את חוסר יכולתם להתמודד עם כל הילדים. משרד החינוך (\"האם\") מגיב \"באימה\" ו\"בפרשנות ודחייה\": \"אתם אינכם אנשי חינוך טובים\", חסימת המעבר לחינוך מיוחד, וכסף \"כדי שתפסיקו לצרוח\". זו \"אינה 'הכלה'\". השפ\"חים משתפים פעולה עם \"סתימת פיו של התינוק\" (ועדות), ואולי עליהם לסייע לדיאדה להגיע לקשר טוב יותר. גם מנהלי השפ\"חים נמצאים, לפי הכותב/ת, בעמדה סכיזו-פרנואידית מול המטה ומשליכים עליו את חרדותיהם.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>עמדה חינוכית-מסתגלת / עמדה טיפולית-רפלקטיבית<\/strong> – כמו במאמר המקורי. כאן ההבחנה מיוחסת למנוני (1993).<\/li>\n<li><strong>DOING / BEING<\/strong> – לפי המסמך, \"שתי עמדות מהותיות\" שמלוות את הפסיכולוג בעבודתו. במאמר המקורי זה המתח שעומד ביסוד ההבחנה בין אובייקט טרנספרנסיאלי (פירוש) לאובייקט התפתחותי.<\/li>\n<li><strong>אובייקט טרנספרנסיאלי / אובייקט התפתחותי<\/strong> – המטפל כמושא להשלכות, שחושף ומפרש, לעומת דמות שמספקת הכרה אמפתית ומשלימה צרכים התפתחותיים. הסביבה החינוכית היא אובייקט התפתחותי \"במובנו הרחב\", שמחזק את כוחות האגו (שליטה, איפוק, ריסון, תכנון).<\/li>\n<li><strong>הזדהות השלכתית<\/strong> – אצל קליין תופעה תוך-נפשית, ואצל ביון בין-אישית. היא יכולה לכלול גם השלכה של חלקים אידיאליים וגרנדיוזיים, שהאובייקט חווה \"כשולטת ולא בטוחה\".<\/li>\n<li><strong>אלמנט בטא / פונקציית אלפא / רֵוֶורי<\/strong> – בטא הוא אלמנט נפשי שאי אפשר לחשוב אותו. פונקציית אלפא נותנת לו משמעות (\"תרגום\"). רוורי הוא היכולת לעבד בטא שאינו ניתן לתרגום מילולי, דרך זרם מחשבה חופשי ולא מילולי (חלימה). בירן מוסיפה את הלך הרוח האופטימי, \"הידיעה שיהיה טוב\".<\/li>\n<li><strong>הפרט ה\"מיסטי\"<\/strong> – לפי ביון, פרט חריג שעלול לאיים על הקבוצה. הקבוצה עלולה לנדות אותו, אבל אם הוא אינו מוכל, הדבר עלול להוביל להרס הקבוצה. ההכלה שלו מוטלת בעיקר על ההנהלה. גם \"המימסד המכיל זקוק לגיניוס או למיסטי (לחריג) על מנת לגדול\".<\/li>\n<li><strong>מיכל טוב דיו<\/strong> – מיכל שמכיל את החלקים מעוררי החרדה, מאפשר הצטיינות אישית וצוותית ומימוש פוטנציאל, ומאפשר את קיומו של ה\"מיסטי\".<\/li>\n<li><strong>גבולות המיכל<\/strong> – לפי תיאוריית המערכות הפתוחות, המנהל מנהל את גבולות המשימה, התפקיד והסמכות. הבהרתם וניהולם הם \"רשת ביטחון\" לקיום המרחב, לשלמותו וליעילותו.<\/li>\n<li><strong>פניות<\/strong> – תנאי להכלה: היכולת של המכיל לחשוב על עצמו כמיכל, ולהשתחרר מידע מוקדם (תיאוריות, זיכרונות, תשוקה לשינוי) לטובת קשב לייחודי.<\/li>\n<li><strong>החזקה (Holding)<\/strong> – מושג של ויניקוט (\"אין תינוק בלי אם\"): שמירה על רצף המשכיות החיים (going on being) והגנה מפני חדירויות (impingements).<\/li>\n<\/ul>","models":"<p><strong>א. מבנה המסמך<\/strong><\/p>\n<ol>\n<li>\"חשיבה טיפולית במסגרת חינוכית: מתח והשלמה ברמה קלינית וארגונית\" – מאת נעמה גרינוולד (סיכום ורפלקציה על רפורמת ההכלה).<\/li>\n<li>\"המיכל והכלתו\" – אבי נוטקביץ (פסיכולוג קליני): קישור בין התיאוריות הפסיכואנליטיות לתיאוריית המערכות הפתוחות. הכותב/ת מציע/ה לחשוב לפי שתי התיאוריות גם על מקומו של הפסיכולוג החינוכי ועל מקומו של מנהל בית הספר.<\/li>\n<li>הכלה כיכולת (לפי בירן), ו\"החזקה והכלה ומה שביניהן\" (פרלוב).\n- \"כמה מחשבות בעקבות המאמר ושאר הדברים\": רפלקציה של הכותב/ת.<\/li>\n<\/ol>\n<p><strong>ב. הפונקציות המרכזיות שמאפשרות הכלה (לפי בירן)<\/strong><\/p>\n<ul>\n<li>א. <strong>תרגום<\/strong>: פונקציית אלפא, שנותנת משמעות לרכיבי בטא שאינם ניתנים לחשיבה.<\/li>\n<li>ב. <strong>רוורי<\/strong>: היכולת לעבד רכיבי בטא שאינם ניתנים לתרגום מילולי, דרך זרם המחשבה החופשית הלא מילולית (חלימה), בדרך כלל חזותית.<\/li>\n<\/ul>\n<p><strong>ג. חמש זירות שבהן מתקיימים יחסי מכיל-מוכל (לפי בירן)<\/strong><\/p>\n<ol>\n<li>אם-תינוק<\/li>\n<li>מטפל-מטופל<\/li>\n<li>מיכל פנימי תוך-אישי<\/li>\n<li>המילה כמיכל<\/li>\n<li>התרבות או הממסד כמיכל. הפרט זקוק לזהות חברתית, לקודים ולכללים כמיכלים להוויה האישית. הממסד זקוק ל\"מיסטי\" (החריג) כדי לגדול. \"קבלת השונה כרוכה באופן בריא בהתנגדות (אחרת אין מיכל) ובהמשך בצמיחה (אחרת המיכל יתנוון)\".<\/li>\n<\/ol>\n<p><strong>ד. החזקה מול הכלה (לפי פרלוב)<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>החזקה (ויניקוט)<\/th>\n<th>הכלה (ביון)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>מוצא<\/td>\n<td>מהאסכולה של קליין, אבל בהתנגדות לכך שההתפתחות מושפעת רק ממנגנונים פנימיים (\"אין תינוק בלי אם\")<\/td>\n<td>ביון היה מטופל של קליין, והשתמש במנגנון ההזדהות ההשלכתית<\/td>\n<\/tr>\n<tr>\n<td>מהות<\/td>\n<td>כלל העשייה האימהית, הפיזית והנפשית: שמירה על \"רצף המשכיות החיים\" והגנה מפני חדירויות הסביבה<\/td>\n<td>קבלת החלקים שהתינוק או המטופל משליכים, ובעיקר חרדת המוות, ועיבודם בלי להשליך אותם בחזרה. \"הגורם המאיים... 'מופקד' אצלה\"<\/td>\n<\/tr>\n<tr>\n<td>כשל<\/td>\n<td>חדירויות רבות בגיל הרך עלולות ליצור נתק בין העצמי האמיתי לכוזב ו\"חוסר תוחלת בחיים\"<\/td>\n<td>המטפל אינו מצליח לקבל על עצמו חוויות של המטופל<\/td>\n<\/tr>\n<tr>\n<td>בטיפול<\/td>\n<td>החזקה פיזית (החזקת יד, תמיכה בראש) והתאמת הסטינג (פגישות בבית, הארכת זמן)<\/td>\n<td>פתיחות לרגשות שמתעוררים במטפל, ועבודה איתם. יש מחלוקת אם לפרש את ההשלכה, כי המטופל עלול לחוות פירוש כפעולה תוקפנית<\/td>\n<\/tr>\n<tr>\n<td>תוצאה התפתחותית<\/td>\n<td>שמירה על העצמי האמיתי<\/td>\n<td>התפתחות של יכולת הכלה עצמית בעתיד<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>ה. שאלות לבית הספר ולפסיכולוג מול שינוי המשימה (מתוך החלק על נוטקביץ)<\/strong><\/p>\n<ul>\n<li>איך בית הספר מגדיר לעצמו משימה מרכזית מותאמת יותר? איך הוא שומר עליה ופועל לפיה?<\/li>\n<li>מה תפקיד הפסיכולוג החינוכי בהכלת החרדה של צוותי החינוך וההנהלה לנוכח שינוי המשימה המרכזית?<\/li>\n<li>אילו מבנים צריכים להתפתח כדי להכיל את השינוי נכון?<\/li>\n<li>איך ינהלו את גבולות המיכל, ייצרו רשת ביטחון להורים, למורים ולתלמידים ויאפשרו את ביצוע העבודה?<\/li>\n<\/ul>\n<p><strong>ו. המטפורה המערכתית של הכותב/ת<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>\"תפקיד\" בדיאדה<\/th>\n<th>מי<\/th>\n<th>ההתנהגות לפי הכותב/ת<\/th>\n<th>מה הוצע במקום<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>תינוק צורח<\/td>\n<td>צוותי החינוך<\/td>\n<td>\"צורחים\" את חוסר יכולתם להתמודד עם כל הילדים, מתוך העמדה החינוכית בלבד<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>אם<\/td>\n<td>משרד החינוך<\/td>\n<td>מגיב באימה, \"בפרשנות\" ובדחייה, וחוסם את המעבר לחינוך מיוחד. \"זו אינה 'הכלה'\"<\/td>\n<td>להשתהות עם הנתונים על העלייה בכמות הילדים עם צרכים מיוחדים, ולחקור את משמעות התופעה<\/td>\n<\/tr>\n<tr>\n<td>\"עושי דברה של האם\"<\/td>\n<td>השפ\"חים<\/td>\n<td>משקיעים זמן רב ב\"תהליך הטיפול בתינוק\" (ועדות)<\/td>\n<td>לאמץ את גישת ביון ולסייע לדיאדה להגיע לקשר טוב יותר, כך שהתינוק יוכל לבצע את משימתו (הכלת הילדים המאתגרים במערכת הקיימת)<\/td>\n<\/tr>\n<tr>\n<td>תינוק צורח (רמה נוספת)<\/td>\n<td>מנהלי השפ\"חים מול מטה השפ\"ח<\/td>\n<td>בעמדה סכיזו-פרנואידית (\"מכינים את עצמנו לקרב\"), משליכים חרדות על המטה בתקווה שיכיל<\/td>\n<td>(נשאל כשאלה פתוחה)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","practice":"<ul>\n<li><strong>למקם את עצמך במפה<\/strong>: כשצוות \"צורח\" על ילד או על כיתה, אפשר לראות בכך השלכה שמחפשת מיכל. במקום להגיב מייד בפתרון, בהפניה לוועדה או ב\"פרשנות\", אפשר קודם להשתהות עם הרגש שמתעורר ולחשוב על משמעותו.<\/li>\n<li><strong>בשילוב ילדים עם צרכים מיוחדים בכיתה רגילה<\/strong>, לבדוק עם הצוות לא רק \"מה עושים\" אלא גם אם יש לצוות מרחב לחשוב, לעבד רגשות ולהביא דילמות. בניית מרחב כזה היא חלק מתפקידך.<\/li>\n<li><strong>לזכור שהכלה היא פעולה אקטיבית<\/strong>, לא ספיגה פסיבית. הכלה של צוות פירושה לתרגם את החרדה לחשיבה ולמשמעות, ואחר כך לפעולה.<\/li>\n<li><strong>\"פניות\" לפני ישיבה קשה<\/strong>: לשים בצד לרגע את התיאוריה, את הזיכרון מהמקרה הקודם ואת התשוקה לשינוי מהיר, ולהקשיב לייחודי במקרה.<\/li>\n<li><strong>מול המנהל<\/strong>, לחשוב יחד על המשימה המרכזית של בית הספר אחרי שינויים (למשל קליטת ילדים עם צרכים מיוחדים), ועל הגבולות, התפקידים והמבנים שיאפשרו להכיל אותם.<\/li>\n<li><strong>לשים לב לתפקידך בוועדות<\/strong>: האם את/ה משמש/ת \"כלי לסתימת הפה\", או גם מחזיר/ה למערכת את השאלה מה הצרכים מבטאים?<\/li>\n<\/ul>","questions":"<ol>\n<li>בבית הספר שלי, מי \"מכיל\" את הצוות כשהוא מוצף מילדים מאתגרים? האם זה אני, המנהל, היועצת, או אף אחד?<\/li>\n<li>מתי הגבתי לצוות או להורים \"באימה\" או בפתרון מהיר, במקום להשתהות עם הרגש? מה היה קורה אילו השתהיתי?<\/li>\n<li>האם אני מסכים/ה עם הקביעה שהשפ\"חים \"עושים את דברה של האם\" בוועדות? מה היה נראה אחרת אם הייתי מסייע/ת לדיאדה?<\/li>\n<li>מה ההבדל בעבודה שלי בין \"החזקה\" (שמירה על רצף והגנה מחדירויות) לבין \"הכלה\" (עיבוד והחזרת משמעות)? איפה כל אחת נחוצה בבית הספר?<\/li>\n<li>מי ה\"מיסטי\" (החריג) בבית הספר או בכיתה שלי, ואיך המערכת מגיבה אליו: נידוי, או הכלה שמאפשרת צמיחה?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"נעמה מציעה עמדה שאינה רואה בדמות הטיפולית מי שמקיימת קליניקה בתוך כותלי בתי הספר, אלא שותפה למערך התערבותי רחב.\"<\/li>\n<li>\"עד שזה יקרה, הרפורמה תקרה על גבם של צוותים חינוכיים לא מוכנים מספיק ועל כתפיהם של התלמידים החלשים בחברה.\"<\/li>\n<li>\"הכלה הינה היכולת של הפרט לחשוב את מחשבותיו, גם אלו המאיימות והקשות לחשיבה ולתת להן משמעות. לחלום את חלומותיו, גם אלו מדירי השינה, ולדעת שיהיה בסדר.\"<\/li>\n<li>\"בעיני, היה נכון להשתהות עם הנתונים על העלייה בכמות הילדים עם צרכים מיוחדים ולנסות לחקור ולהבין את משמעות התופעה ולא רק להגיב אליה.\"<\/li>\n<\/ul>"},"level":"שנים ב'-ג' (מתאים גם לשנה ד' ולדיון בהדרכה על רפורמת ההכלה)","stype":"מאמר. בפועל זה מסמך סיכום-קריאה והגות פנימי, ולא המאמר המקורי.","tldr":"המסמך מתחיל בסיכום קצר, מגוף שלישי, של מאמרה של גרינוולד. ההבחנה בין עמדה חינוכית-מסתגלת לעמדה טיפולית-רפלקטיבית מיוחסת בו למנוני (1993). הוא מציג את הנושאים העיקריים: המטפל כאובייקט טרנספרנסיאלי מול אובייקט התפתחותי, הסביבה החינוכית כאובייקט…","search":"המסמך מתחיל בסיכום קצר, מגוף שלישי, של מאמרה של גרינוולד. ההבחנה בין עמדה חינוכית-מסתגלת לעמדה טיפולית-רפלקטיבית מיוחסת בו למנוני (1993). הוא מציג את הנושאים העיקריים: המטפל כאובייקט טרנספרנסיאלי מול אובייקט התפתחותי, הסביבה החינוכית כאובייקט התפתחותי, הצורך במנטליזציה וביכולת \"לשחק עם המציאות\", והמטפל כ\"שותף למערך התערבותי רחב\". הוא מזכיר גם את המתח בין DOING ל-BEING, שבמאמר המקורי משמש רקע להבחנה בין שני סוגי האובייקטים. מכאן הכותב/ת עובר/ת לטענה משלו/ה: רפורמת ההכלה אינה בונה את היכולות האלה בצוותים, ולכן היא \"תקרה על גבם של צוותים חינוכיים לא מוכנים מספיק ועל כתפיהם של התלמידים החלשים בחברה\". אחר כך מסוכמים מושגי המיכל וההכלה (נוטקביץ, ביון, סטוקס, אובהולצר, ויניקוט), כולל הישום לארגונים ולתפקיד המנהל בניהול גבולות המיכל. מוצגות חמש הזירות של יחסי מכיל-מוכל לפי בירן, וההבחנה של פרלוב בין החזקה (ויניקוט) להכלה (ביון). בסוף הכותב/ת משתמש/ת במושגים כדי לתאר את מערכת החינוך: הצוותים הם \"תינוק צורח\", משרד החינוך הוא \"אם\" שמגיבה באימה ולא בהכלה, והשפ\"חים \"עושי דברה של האם\" בוועדות. הכותב/ת מציע/ה להשתהות עם העלייה במספר הילדים עם הצרכים המיוחדים ולחקור את משמעותה. מה נוסף או הודגש לעומת המאמר: גרינוולד \"נשארה עם תחושת החמצה\" לגבי השאלה אם השינוי ההתנהגותי שהשיגה ביטא שינוי בעולמו הפנימי של הילד. שתי עמדות \"מהותיות\" של הפסיכולוג: DOING ו-BEING. במאמר המקורי מוצג המתח בין doing ל-being (או בין פירוש לסיפוק) כרקע להבחנה בין אובייקט טרנספרנסיאלי לאובייקט התפתחותי. הסיכום מתרגם את שתי העמדות לעמדה התפתחותית ולעמדה טרנספרנסיאלית, וקובע שכדי להכיל תלמידים עם צרכים מיוחדים צריך לעזור לצוות החינוכי לפתח את שתיהן. זו \"משימה מורכבת מאד ותדרוש זמן ומשאבים רבים\". ביקורת על רפורמת ההכלה: לדעת הכותב/ת, הוגי הרפורמה לא בחנו אותה מספיק מנקודת מבט תיאורטית ויישומית. ה\"סל השקלי\" אינו עוסק ביצירת היכולות הנדרשות (מנטליזציה, משחק עם המציאות, תנועה בין עמדות). לשם כך דרושים מרחבים לחשוב, לעבד רגשות, להביא דילמות, ואנשים שיעזרו \"בהחזקה\" של הילדים. ההשוואה לחינוך המיוחד: בחינוך המיוחד יש מספר תלמידים קטן יותר, צוות גדול ורב-מקצועי, מסורות עבודה, והתאמה של הצוות לחריגויות. בכיתה גדולה עם מורה אחת, שצריכה להשיג הישגים ולשמור על אקלים, כל התשומות מופנות לתפקוד ולא לעולם הפנימי. הדוגמה: מורה בבית ספר לתלמידים עם בעיות התנהגות שמקדישה שעה שלמה לתלמיד בהתפרצות זעם, ומעבירה לו את המסר \"אתה חשוב לי\". המיכל בארגון (לפי נוטקביץ): כמו מטפל, גם קבוצה וארגון יכולים להכיל חלקים מעוררי חרדה, כאב ואשמה, או להיפטר מהם בהשלכה לתוך תת-ישות. ההנהלה צריכה לספק \"מיכל אמין\" (סטוקס, 1994), ולשם כך לברר את המשימה המרכזית ולהגדיר תפקידים בהלימה לה. מוסדות שאינם מודעים לתפקידם כמיכלים בונים מבני הגנה שפוגעים בעבודה ובבריאות העובדים (אובהולצר, 1994). שאלות לבית הספר בעידן הרפורמה: איך בית הספר מגדיר לעצמו משימה מרכזית מותאמת, ואיך הוא שומר עליה? מה תפקיד הפסיכולוג בהכלת החרדה של הצוות וההנהלה מול שינוי המשימה? אילו מבנים צריכים להתפתח? איך מנהלים את גבולות המיכל ויוצרים \"רשת ביטחון\" להורים, למורים ולתלמידים? הכלה היא פעולה אקטיבית: היא \"לא כפי שנוטים לחשוב פונקציה פסיבית של ספיגה\", אלא פעולה שדורשת יצירתיות, סקרנות וגילוי. במצב בריא המכיל והמוכל מגדלים זה את זה, ובמצב פתולוגי הם מתקיפים ומחלישים זה את זה. תנאי להכלה הוא \"פניות\": להשתחרר מידע מוקדם (תיאוריות, זיכרונות, תשוקה לשינוי) ולהקשיב קשב דק. החזקה מול הכלה (פרלוב): החזקה, לפי ויניקוט, היא כלל העשייה האימהית, הפיזית והנפשית, ששומרת על \"רצף המשכיות החיים\" (going on being) ומגינה מפני \"חדירויות\" (impingements). כשהחדירויות רבות, עלול להיווצר נתק בין עצמי אמיתי לעצמי כוזב. ויניקוט החזיק מטופלים גם פיזית ושינה בשבילם את הסטינג. הכלה, לפי ביון, היא קבלת החלקים המושלכים (ובעיקר חרדת המוות), עיבודם בלי להחזיר אותם לתינוק, וחשיבה על משמעות הרגש שמתעורר. כך מתפתחת אצל הילד יכולת הכלה משלו. מערכת החינוך כדיאדה אם-תינוק: לפי הכותב/ת, הצוותים \"צורחים\" את חוסר יכולתם להתמודד עם כל הילדים. משרד החינוך (\"האם\") מגיב \"באימה\" ו\"בפרשנות ודחייה\": \"אתם אינכם אנשי חינוך טובים\", חסימת המעבר לחינוך מיוחד, וכסף \"כדי שתפסיקו לצרוח\". זו \"אינה 'הכלה'\". השפ\"חים משתפים פעולה עם \"סתימת פיו של התינוק\" (ועדות), ואולי עליהם לסייע לדיאדה להגיע לקשר טוב יותר. גם מנהלי השפ\"חים נמצאים, לפי הכותב/ת, בעמדה סכיזו-פרנואידית מול המטה ומשליכים עליו את חרדותיהם. עמדה חינוכית-מסתגלת / עמדה טיפולית-רפלקטיבית – כמו במאמר המקורי. כאן ההבחנה מיוחסת למנוני (1993). DOING / BEING – לפי המסמך, \"שתי עמדות מהותיות\" שמלוות את הפסיכולוג בעבודתו. במאמר המקורי זה המתח שעומד ביסוד ההבחנה בין אובייקט טרנספרנסיאלי (פירוש) לאובייקט התפתחותי. אובייקט טרנספרנסיאלי / אובייקט התפתחותי – המטפל כמושא להשלכות, שחושף ומפרש, לעומת דמות שמספקת הכרה אמפתית ומשלימה צרכים התפתחותיים. הסביבה החינוכית היא אובייקט התפתחותי \"במובנו הרחב\", שמחזק את כוחות האגו (שליטה, איפוק, ריסון, תכנון). הזדהות השלכתית – אצל קליין תופעה תוך-נפשית, ואצל ביון בין-אישית. היא יכולה לכלול גם השלכה של חלקים אידיאליים וגרנדיוזיים, שהאובייקט חווה \"כשולטת ולא בטוחה\". אלמנט בטא / פונקציית אלפא / רֵוֶורי – בטא הוא אלמנט נפשי שאי אפשר לחשוב אותו. פונקציית אלפא נותנת לו משמעות (\"תרגום\"). רוורי הוא היכולת לעבד בטא שאינו ניתן לתרגום מילולי, דרך זרם מחשבה חופשי ולא מילולי (חלימה). בירן מוסיפה את הלך הרוח האופטימי, \"הידיעה שיהיה טוב\". הפרט ה\"מיסטי\" – לפי ביון, פרט חריג שעלול לאיים על הקבוצה. הקבוצה עלולה לנדות אותו, אבל אם הוא אינו מוכל, הדבר עלול להוביל להרס הקבוצה. ההכלה שלו מוטלת בעיקר על ההנהלה. גם \"המימסד המכיל זקוק לגיניוס או למיסטי (לחריג) על מנת לגדול\". מיכל טוב דיו – מיכל שמכיל את החלקים מעוררי החרדה, מאפשר הצטיינות אישית וצוותית ומימוש פוטנציאל, ומאפשר את קיומו של ה\"מיסטי\". גבולות המיכל – לפי תיאוריית המערכות הפתוחות, המנהל מנהל את גבולות המשימה, התפקיד והסמכות. הבהרתם וניהולם הם \"רשת ביטחון\" לקיום המרחב, לשלמותו וליעילותו. פניות – תנאי להכלה: היכולת של המכיל לחשוב על עצמו כמיכל, ולהשתחרר מידע מוקדם (תיאוריות, זיכרונות, תשוקה לשינוי) לטובת קשב לייחודי. החזקה (Holding) – מושג של ויניקוט (\"אין תינוק בלי אם\"): שמירה על רצף המשכיות החיים (going on being) והגנה מפני חדירויות (impingements)."},{"id":"tlv_smallclasses","title":"תפיסת העבודה של הפסיכולוג החינוכי בכיתות הקטנות","authors":"פורום חנ\"מ, שפ\"ח תל אביב-יפו","year":"2010","cite":"שירות פסיכולוגי חינוכי תל-אביב-יפו (2010). תפיסת העבודה של הפסיכולוג החינוכי בכיתות לילדים עם צרכים מיוחדים בביה\"ס הרגיל: ערכים, עקרונות ויישום.","url":null,"kind":"outline","desc":null,"file":{"orig":"תפיסת העבודה של הפסיכולוג החינוכי בכתות הקטנות.pdf","ext":"pdf","pdf":"tlv_smallclasses.pdf","pages":5,"bytes":136183},"placements":[["s2","sped"]],"extra":false,"ref":"הכיתות הקטנות 2010","inFolder":true,"srcTitle":"תפיסת העבודה של הפסיכולוג החינוכי בכיתות לילדים עם צרכים מיוחדים בביה\"ס הרגיל – ערכים, עקרונות ויישום","secs":{"abstract":"<p>המסמך הוא טיוטת מדיניות של פורום החינוך המיוחד בשפ\"ח תל אביב-יפו (2010). הוא מגדיר איך עובד הפסיכולוג החינוכי בכיתות חינוך מיוחד (\"כיתות קטנות\") שפועלות בתוך בית ספר רגיל. הנחת המוצא היא שקליטת תלמידים עם זכאות לחינוך מיוחד היא תהליך מורכב, ושהיא מצליחה רק כשבית הספר מתפקד היטב מבחינה מערכתית, פדגוגית ודידקטית, וכשכל הגורמים, בבית הספר ומחוצה לו, מתואמים. החלק הראשון מתאר את \"תפיסת העולם החינוכית\" הרצויה בבית ספר שיש בו כיתה כזו. ברמה הערכית: סובלנות וקבלת השונה, אחריות לכלל התלמידים, שילוב כמטרה, אמונה ביכולת הילדים, עבודה רב-מקצועית אינטגרטיבית, ושינוי עמדות סטיגמטיות דרך מיקום הכיתה ותנאיה. ברמה האופרטיבית: בחירת צוות, הכנת הצוות, התלמידים וההורים, תוכנית שילוב, ומנהל שמוביל עבודת צוות. החלק השני מגדיר את עבודת הפסיכולוג: לפחות שעה שבועית קבועה בכיתה במסגרת החוזה, תרגום החריגויות לעבודת הצוות, וקידום אווירה של שילוב. אחר כך מפורט לוח עבודה כרונולוגי: לפני פתיחת הכיתה, בחודשים הראשונים, בהמשך השנה ובסופה.<\/p>","ideas":"<ul>\n<li><strong>הצלחת הכיתה תלויה בבית הספר כולו<\/strong>: קליטה מוצלחת דורשת היערכות ברמה הערכית, העקרונית והיישומית, ותיאום בין כל הגורמים החינוכיים-טיפוליים בבית הספר ובין הגורמים החינוכיים-קהילתיים שמחוצה לו.<\/li>\n<li><strong>עבודה עם כיתות החנ\"מ היא ערך מרכזי<\/strong> בתפיסת העבודה של הפסיכולוג החינוכי, כלפי הילדים ומשפחותיהם וכלפי המערכת המשלבת. לכן הפסיכולוג צריך להיות שותף פעיל כבר לפני פתיחת הכיתה, ולא רק להצטרף אחרי שהיא נפתחה.<\/li>\n<li><strong>עבודה קבועה מעוגנת בחוזה<\/strong>: המסמך קובע עבודה קבועה ושיטתית של לפחות שעה בשבוע בכיתת החנ\"מ. החוזה צריך לשקף גם את האג'נדה של המנהל ובית הספר וגם את האג'נדה המקצועית-טיפולית של הפסיכולוג.<\/li>\n<li><strong>הפסיכולוג כמתרגם<\/strong>: הוא מסייע לצוות להבין באופן אינטגרטיבי את החריגויות ואת השלכותיהן, ולתרגם את ההבנה לעבודה חינוכית-טיפולית בתחום הקוגניטיבי, הרגשי, החברתי וההתנהגותי.<\/li>\n<li><strong>מאבק בסטיגמה דרך המרחב והמעמד<\/strong>: לכיתה צריך להיות מקום מרכזי ולא צדדי, ולמחנכת מקום במערך השכבתי. צריך להתייחס אליהן כאל \"אחת ממכלול כתות ביה\"ס\", לתת לכיתה מרחב שמאפשר עבודה דיפרנציאלית, ולשלב את צוות הכיתה בחדר המורים הכללי.<\/li>\n<li><strong>עיבוד רגשי לפני השינוי<\/strong>: לפני פתיחת הכיתה הפסיכולוג שותף לדיון עם המנהל ואחר כך עם חדר המורים, כדי ליצור \"תשתית להבעה ועיבוד של מגוון הרגשות, הדעות והמחשבות\" כלפי הכנסת הכיתה ושילוב הילדים.<\/li>\n<li><strong>המנהל מוביל<\/strong>: המנהל משמש מוביל צוות ועוקב אחר התקדמות הכיתה. הוא בונה למחנכת מעמד של מומחית, מקיים עבודה משותפת קבועה על התל\"א (שלוש פעמים בשנה, בשיתוף ההורים), ומחבר בין מחנכת הכיתה המיוחדת לצוות הכיתות המשלבות.<\/li>\n<li><strong>ההורים שותפים מלאים<\/strong>: במפגש הראשון עם הורי הכיתה הפסיכולוג מציג את עצמו ואת סל השירותים ופותח ערוץ זמינות. המנהל מבהיר שבית הספר אחראי לקידום כלל התלמידים לפי צורכיהם הדיפרנציאליים, ושההורים הם \"חלק בלתי נפרד\" מהמאמץ החינוכי.<\/li>\n<li><strong>עבודה במחזור שנתי<\/strong>: הכנה לפני פתיחה, ליווי בבניית התל\"א, מעקב אחר תוכניות השילוב, ייעוץ, אבחונים לקראת ועדות השמה, וסיכום שנתי ברמת הפרט, הכיתה כמערכת והקשר עם המחנכת.<\/li>\n<li><strong>מילייה מקצועי<\/strong>: מומלץ לפתוח בבית הספר יותר מכיתת חנ\"מ אחת, כדי לאפשר התמקצעות, למידה ויצירת \"מילייה מקצועי\".<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>כיתת ח\"מ / כיתה קטנה בבית ספר רגיל<\/strong> – כיתה לתלמידים בעלי זכאות לחינוך מיוחד שפועלת בתוך בית ספר רגיל. המסמך עוסק בקליטתה ובשילובה במערכת.<\/li>\n<li><strong>תפיסת עולם חינוכית הומניסטית<\/strong> – בסיס הערכים הנדרש מבית ספר שקולט כיתה כזו: סובלנות, אחריות לכלל התלמידים, שילוב, אמונה ביכולת, ועבודה רב-מקצועית.<\/li>\n<li><strong>שילוב<\/strong> – יצירת קשר והשתייכות בין תלמידי הכיתה לכלל בית הספר: מערכת שעות קבועה לשילוב, כניסה דו-כיוונית בין כיתות, תוכניות עמיתים, ופעילויות, אירועים וטיולים משותפים.<\/li>\n<li><strong>כניסה דו-כיוונית<\/strong> – מעבר של תלמידים מכיתה לכיתה, בשני הכיוונים, לפי תוכנית שהוגדרה מראש, למטרות לימודיות (כלל-שכבתיות) או חברתיות.<\/li>\n<li><strong>תל\"א (תוכנית לימודים אישית)<\/strong> – תוכנית אישית לכל תלמיד. הפסיכולוג מלווה את בנייתה ומעורר מודעות לאספקטים הפסיכולוגיים שבה, ובהמשך עוקב אחר יישומה.<\/li>\n<li><strong>תוכנית שילוב אישית וכיתתית<\/strong> – התוכנית שקובעת באילו מקצועות ישתלב כל ילד ואיך. הפסיכולוג מעורב בתכנון, במעקב ובהתאמות.<\/li>\n<li><strong>מעמד מומחה למחנך/ת הכיתה<\/strong> – מעמד שהמנהל בונה למחנכת (באמצעות השתלמויות והדרכה שוטפת), כדי שתוכל להעשיר את שאר הצוות.<\/li>\n<li><strong>צוות חשיבה וביצוע<\/strong> – צוות אופציונלי, שאפשר להקים יחד עם המנהל, של נציגי הצוות הניהולי-טיפולי, מורי הכיתה ומורים מבית הספר שיהיו מעורבים בקליטת הכיתה.<\/li>\n<li><strong>תחנות פולטות<\/strong> – המסגרות שמהן מגיעים התלמידים. מהן מזמינים את התיקים הפסיכולוגיים עם קבלת טופס ועדת ההשמה.<\/li>\n<li><strong>יום ההיערכות<\/strong> – יום הצוות שלפני תחילת שנת הלימודים. בו מוצגת הכיתה לכלל המורים, והפסיכולוג מציג את אפיוני התלמידים.<\/li>\n<\/ul>","models":"<h3>חלק א': תפיסת העולם החינוכית בבתי ספר שיש בהם כיתות חנ\"מ<\/h3>\n<p><strong>ברמה הערכית<\/strong><\/p>\n<p>א. עקרונות של תפיסת עולם חינוכית הומניסטית:<\/p>\n<ol>\n<li>חינוך לסובלנות ולקבלת השונה.<\/li>\n<li>תפיסה שבית הספר אחראי לכלל תלמידיו, ועליו להבטיח תנאים לרווחתם, לצמיחתם ולהתפתחותם הקוגניטיבית, הרגשית והחברתית, עם דגש על הייחודיות והשונות.<\/li>\n<li>אוריינטציה ני
