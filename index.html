ע לפי גודלו, כיתות חנ\"מ, קהילות ייחודיות (למשל ילדי הקהילה האתיופית, ילדי מהגרי עבודה ומבקשי מקלט, הרכב יהודי-ערבי) והיותו ב\"שלב רגיש\". יש להותיר מקום לבלתי צפוי וליצירתיות, גם מחוץ לתוכנית שנקבעה מראש. ליבת העבודה — הנושאים שחייבים להיכלל בתוכנית העבודה השנתית של הפסיכולוג בבית הספר. רמת שירות א'/ב'/ג' — שלוש רמות שירות שמאפשר מתווה השירות של משה\"ח; שאיפת השפ\"ח היא רמה א' (מרבית), שאינה ממומשת במלואה בשל התקינה. ישיבה בין-מקצועית שבועית — דיון שוטף על כלל כיתות בית הספר לפי סדר עדיפויות שהמערכת קובעת. שפ\"מ (שירות פסיכולוגי משלים) — מאפשר להרחיב אבחונים, טיפולים והתערבויות מערכתיות מעבר לשעות התקן. \"השפה הבית ספרית\" — הכרת האפיונים הייחודיים של בית הספר והשתתפות בשיח שלו."},{"id":"outline_sec","title":"ליבת העבודה בעל-יסודי","authors":"אפרת רבין ודורית טל, שפ\"ח ת\"א-יפו","year":"","cite":"שפ\"ח תל אביב-יפו. ליבת העבודה – על יסודי.","url":null,"kind":"outline","desc":null,"file":{"orig":"ליבת העבודה - על יסודי.docx","ext":"docx","pdf":"outline_sec.pdf","pages":3,"bytes":169164},"placements":[],"extra":false,"ref":"ליבת העבודה בעל-יסודי","inFolder":true,"srcTitle":"ליבת העבודה של הפסיכולוג החינוכי בביה\"ס העל-יסודי","secs":{"abstract":"<p>מסמך קצר ומעשי שמגדיר את ליבת העבודה של הפסיכולוג החינוכי בחטיבות הביניים ובתיכונים בשפ\"ח תל אביב-יפו. הוא נפתח בייעוד השירות כפי שנוסח במתווה שפ\"י (2010) ובהגדרת הפסיכולוג כגורם חוץ-בית-ספרי שעובד עם כלל בית הספר ומחויב לאתיקה ולסודיות. לאחר מכן הוא מונה ארבעה מאפיינים של בית הספר העל-יסודי והשלכותיהם: היקף גדול ומבנה ארגוני מורכב שמחייבים כמה פסיכולוגים וקשר עם בעלי תפקידים רבים; מרכזיות המחנכים והמורים כדמויות רגשיות עבור התלמידים; גיל ההתבגרות על משימותיו ועל התנהגויות הסיכון שלו; והמתח בין העלאת אחוזי הבגרות לבין עקרון ההתמדה. מכאן נגזרים תחומי הליבה: עבודה מערכתית עם המנהל ובעלי התפקידים, התערבות בחירום, עבודה עקיפה וישירה ממוקדת בפרט, ותחומי חובה שמעוגנים בחוק (ועדות אפיון וזכאות, ועדות שילוב וכיתות חינוך מיוחד). כל אלה מושלמים בשירותים המשלימים (שפ\"מ). לפי המסמך, הוא אמור לשמש בסיס לדיאלוג עם מנהל בית הספר על יעדים, סדרי עדיפויות והיקפי השקעה, תוך נאמנות לליבה וגמישות לצורכי כל מערכת.<\/p>","ideas":"<ul>\n<li><strong>הפסיכולוג הוא \"גורם חוץ בית ספרי\" שעובד עם כלל בית הספר<\/strong>: הוא מכיר את הסביבה הלימודית, החברתית והמשפחתית של התלמיד, מתכנן את עבודתו לפי צורכי הפרט ובהתחשב במאפייני המערכת, ומחויב לאתיקה ולסודיות.<\/li>\n<li><strong>הפסיכולוג מביא איתו ידע מהמסגרות הקודמות<\/strong>: הוא מבין את צורכי התלמידים על רקע היכרות מוקדמת איתם מהמסגרות החינוכיות שמהן הגיעו.<\/li>\n<li><strong>מבנה בית הספר הגדול מחייב עבודת צוות<\/strong>: בבית ספר על-יסודי (חטיבות, שכבות, \"בתים\") עובד בדרך כלל יותר מפסיכולוג אחד, ויש צורך בקשר עם בעלי תפקידים רבים מעבר למנהל העל, ובאינטגרציה ושיתוף פעולה ביניהם.<\/li>\n<li><strong>המחנכים והמורים הם דמויות רגשיות משמעותיות<\/strong>: התלמידים מפקידים בידיהם חלקים רגשיים וחברתיים. לכן הפסיכולוג, יחד עם היועצת והצוות הבכיר, מפתח מבנים להכלה ולהעצמה של הצוות, כדי לחזק את יכולת ההחזקה וההכלה שלו.<\/li>\n<li><strong>גיל ההתבגרות קובע את התוכן<\/strong>: צריך להתייחס למשימות התפתחותיות נורמטיביות (צבא, זוגיות, קשר עם בני הגיל ועם ההורים, זהות עצמית ומינית, חרדת בחינות) ולהציע ידע פסיכו-חינוכי על הרצף שבין נורמטיבי לפתולוגי (סמים ואלכוהול, בריונות, פגיעות ברשת, הפרעות אכילה, סיכון אובדני). המאפיינים האלה מזמנים משברים ואירועי חירום פרטניים ומערכתיים.<\/li>\n<li><strong>מטרות שאינן מתיישבות זו עם זו<\/strong>: העלאת אחוזי הבגרות ועקרון ההתמדה (נשירה מינימלית) עלולים להתנגש, והפסיכולוג מסייע לבית הספר לנהל את המרחב הקונפליקטואלי שביניהם.<\/li>\n<li><strong>ארבעה תחומי ליבה<\/strong>: עבודה מערכתית, התערבות בחירום, עבודה ממוקדת בפרט (עקיפה וישירה) ותחומי חובה שבחוק. הטיפול הישיר הוא בדרך כלל קצר מועד, ורק בחלקו הקטן ארוך.<\/li>\n<li><strong>השירות המשלים (שפ\"מ) הוא כלי להשלמת חסרים<\/strong>: הפסיכולוג מתווך למערכת את האפשרות להיעזר בשפ\"מ, ובמקביל \"מעשיר\" את השפ\"מ בפתיחת שירותים לפי הצרכים שהוא פוגש בשטח.<\/li>\n<li><strong>המסמך הוא בסיס לדיאלוג עם המנהל<\/strong>: על יעדים שנתיים או רב-שנתיים, סדרי עדיפויות, תזמונים והיקפי ההשקעה בכל מרכיב. העבודה צריכה להיות נאמנה לליבה ובה בעת דינמית.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>גורם חוץ בית ספרי<\/strong>: הגדרת מעמדו של הפסיכולוג. הוא אינו איש צוות בית הספר, אבל עובד עם כלל בית הספר.<\/li>\n<li><strong>יכולת ההחזקה וההכלה של הצוות<\/strong>: היכולת של המחנכים והמורים לשאת את החלקים הרגשיים והחברתיים שהתלמידים מפקידים בידיהם, שהפסיכולוג מבקש לפתח.<\/li>\n<li><strong>עקרון ההתמדה<\/strong>: מחויבות בית הספר לנשירה מינימלית, שעלולה להתנגש עם החתירה להעלאת אחוזי הבגרות.<\/li>\n<li><strong>הרצף שבין הנורמטיבי לפתולוגי<\/strong>: המסגרת שדרכה מוצע ידע פסיכו-חינוכי על תופעות של גיל ההתבגרות.<\/li>\n<li><strong>עבודה מערכתית<\/strong>: מפגשים עם המנהל ועם גורמי חינוך מרכזיים (יועצות, רכזי שכבות) לייעוץ, לשותפות במדיניות ולהפעלת תוכניות מניעה והתערבות.<\/li>\n<li><strong>עבודה ממוקדת בפרט, עקיפה או ישירה<\/strong>: עקיפה היא ייעוץ לצוות והדרכת מטפלים. ישירה היא טיפול, הדרכת הורים, הערכה ואבחון.<\/li>\n<li><strong>ועדות אפיון וזכאות<\/strong>: ועדות לפי חוק החינוך המיוחד, שבהן הפסיכולוג שותף בחשיבת הצוות הבין-מקצועי ומכין מסמכים קבילים לפי הצורך.<\/li>\n<li><strong>ועדות שילוב<\/strong>: ועדות בין-מקצועיות בבית הספר על ילדים שמועמדים לשילוב.<\/li>\n<li><strong>כיתות ח\"מ (חינוך מיוחד) בבית הספר<\/strong>: כיתות שהפסיכולוג מכיר, עוקב אחריהן ושותף בבניית תוכניות עבודה עבורן.<\/li>\n<li><strong>שפ\"מ (שירותים משלימים)<\/strong>: הרחבת השירותים של השפ\"ח מעבר לתקן הבסיסי, שמשלימה את החסר הנובע מהיקפי הכיסוי ומעומס המטלות.<\/li>\n<li><strong>ליבה<\/strong>: המטרות שלשמן נשלח הפסיכולוג לבית הספר, שהעבודה צריכה להיות נאמנה להן ובה בעת להיות דינמית.<\/li>\n<\/ul>","models":"<p><strong>א. ייעוד השירות (מתוך המתווה, חוזר מנכ\"ל, ספטמבר 2010)<\/strong>: \"ייעודו של השירות הפסיכולוגי החינוכי-ייעוצי (שפ\"י) בישראל הוא לקדם את רווחתם ואת בריאותם הנפשית של כלל התלמידים במערכת החינוך\". הייעוד מתממש ברמת מערכת החינוך והקהילה, הפרט והמשפחה, בשגרה ובחירום, עבור תלמידים, הורים, צוותי חינוך וגורמים קהילתיים. המתווה מדגיש גם את חשיבות הנגישות של הפסיכולוגים כגורמי בריאות ורווחה נפשית.<\/p>\n<p><strong>ב. אפיוני בית הספר העל-יסודי והשלכותיהם:<\/strong><\/p>\n<ol>\n<li><strong>גודל ומבנה לא אחיד<\/strong> (חטיבת ביניים ועליונה, שכבות, \"בתים\"): בדרך כלל יותר מפסיכולוג אחד, קשר עם בעלי תפקידים רבים, ושיתוף פעולה.<\/li>\n<li><strong>המחנכים והמורים כדמויות משמעותיות<\/strong>: עבודה עם הצוותים יחד עם היועצת והצוות הבכיר, ופיתוח מבנים להכלה ולהעצמה של הצוות.<\/li>\n<li><strong>גילאי ההתבגרות<\/strong>:\n        - <em>מרכיבים נורמטיביים<\/em>: הכנה לצבא, קשר זוגי, תקשורת עם בני הגיל ועם ההורים, גיבוש זהות עצמית ומינית, וחרדת בחינות.\n        - <em>תופעות על הרצף נורמטיבי-פתולוגי<\/em>: שימוש בסמים ובאלכוהול, התנהגויות סיכון (בריונות, פגיעות ברשת), הפרעות אכילה וסיכון אובדני.\n        - כל אלה מזמנים משברים ואירועי חירום פרטניים ומערכתיים.<\/li>\n<li><strong>מטרות נוספות<\/strong>: העלאת אחוזי ההצלחה בבגרות ועקרון ההתמדה. הן לא תמיד מתיישבות זו עם זו, והפסיכולוג מסייע לנהל את המרחב הקונפליקטואלי.<\/li>\n<\/ol>\n<p><strong>ג. תחומי הליבה<\/strong>:<\/p>\n<ol>\n<li><strong>עבודה מערכתית בבית הספר<\/strong>, במפגשים עם המנהל ועם גורמי חינוך מרכזיים (יועצות, רכזי שכבות ועוד), לצורך:\n        - ייעוץ למנהל ומעורבות בתהליכים מערכתיים, כמו הטמעת תוכניות חדשות (\"בוחרים בחיים\", SEL), קידום \"סדר יום חדש\" (תוכניות לימוד חדשות והגברת המוטיבציה של מורים ותלמידים) וקידום הקשר עם ההורים.\n        - שותפות בחשיבה על מדיניות עירונית ובית-ספרית וביישומה: עקרון ההתמדה, שילוב, איתור תלמידים לקויי למידה ועוד.\n        - שותפות בהפעלת תוכניות מניעה (חינוך מיני, זהות מינית, מניעת אובדנות, שיפור אקלים) ותוכניות התערבות טיפוליות כוללניות (עבודה עם ילדים עם הפרעות התנהגות, עבודה קבוצתית על חרדת מבחן ועוד).<\/li>\n<li><strong>התערבות בחירום<\/strong>: מצבי חירום ומשבר במערכת או אצל פרטים בה (איומים בהתאבדות, מוות ואובדן, גירושין ואלימות במשפחה, פגיעה מינית ועוד), ועד אירועים קהילתיים ולאומיים (פיגוע טרור, מלחמה).<\/li>\n<li><strong>עבודה ממוקדת בפרט (עקיפה או ישירה)<\/strong>:\n        - ייעוץ למחנכי כיתות, למרכזי תחומים ולבעלי תפקידים אחרים, והדרכת מטפלים בהבעה ויצירה לגבי תלמידים מתקשים, כולל בנייה משותפת של תוכניות התערבות פרטניות טיפוליות ולימודיות.\n        - עבודה עם היועצות על איתור תלמידים בסיכון וניהול התהליך הטיפולי שלהם בבית הספר: מיקוד הצרכים המרכזיים, החלטה על הגורם המטפל ועל איש הקשר.\n        - קשר עם גורמי חוץ (רווחה, ביקור סדיר, מרפאות לבריאות הנפש) לצורך הפניות, מעקב ושמירה על הרצף הטיפולי.\n        - טיפול פרטני ישיר בילדים והדרכת הורים, בדרך כלל קצרי מועד ורק בחלקם הקטן ארוכים.\n        - הערכה ואבחון לצורך אבחנה מבדלת, הבנת הקשיים והשתלבות תקינה: איתור לקויות למידה, הפרעות קשב וריכוז וקשיים רגשיים-התנהגותיים. תיווך הממצאים להורים ולגורמי החינוך, וסיוע בגיבוש המלצות לטיפול.<\/li>\n<li><strong>תחומי חובה שמעוגנים בחוק<\/strong> (בעיקר בגילאי חטיבת הביניים):\n        - <em>ועדות אפיון וזכאות<\/em>: שותפות בחשיבת הצוות הבין-מקצועי, הכנת מסמכים קבילים לפי הצורך, קשר עם ההורים והתלמיד, ותיווך ההמלצות ודרך יישומן.\n        - <em>ועדות שילוב<\/em>: השתתפות בוועדות הבין-מקצועיות בבית הספר, והכנת מסמכים קבילים לתלמידים שמוכרים בשירות, לפי הצורך.\n        - <em>כיתות ח\"מ בבית הספר<\/em>: היכרות, מעקב ושותפות בבניית תוכניות עבודה מותאמות, מעקב אחר תפקוד התלמידים, ייעוץ וליווי לצוות, והתערבות טיפולית עם ילדים והוריהם לפי הצורך.<\/li>\n<\/ol>\n<p><strong>ד. שירותים משלימים (שפ\"מ)<\/strong>: הפסיכולוג מכיר את צורכי בית הספר ואת מגוון השירותים המשלימים, מתווך למערכת את האפשרות להיעזר בהם, ומעשיר את השפ\"מ בפתיחת שירותים לפי הצרכים בשטח. דוגמאות: טיפול קצר מועד לילדים בסכנת נשירה, הערכות אובדנות, טיפול בפגיעות מיניות, חרדת בחינות ואבחונים פסיכודידקטיים.<\/p>\n<p><strong>סיכום המסמך<\/strong>: הוא מגדיר את הליבה ברמת הפרט והמערכת, בשגרה ובחירום, בתחומי האבחון, הטיפול, הייעוץ וההדרכה. הוא נועד לשמש בסיס לדיאלוג עם המנהל על יעדים שנתיים או רב-שנתיים, סדרי עדיפויות, תזמונים והיקפי השקעה יחסיים. החסר הנובע מהיקפי הכיסוי ומעומס המטלות, שמעוגנים במתווה, יכול להיות מושלם באמצעות השפ\"מ.<\/p>","practice":"<ul>\n<li>בתחילת השנה, אפשר להשתמש במסמך כבסיס לשיחת חוזה עם המנהל: לעבור יחד על ארבעת תחומי הליבה, להגדיר יעדים שנתיים, לקבוע סדרי עדיפויות ולחלק את היקף ההשקעה בין התחומים.<\/li>\n<li>כדאי למפות מוקדם את בעלי התפקידים מעבר למנהל העל (מנהלי חטיבות, רכזי שכבות, יועצות, מחנכים) ואת הפסיכולוגים הנוספים שעובדים באותו בית ספר, ולתאם ביניהם.<\/li>\n<li>מומלץ לבנות עם היועצת מנגנון קבוע לאיתור תלמידים בסיכון ולניהול התהליך: מה הצורך המרכזי, מי מטפל, ומי איש הקשר.<\/li>\n<li>כדאי להכיר מראש את גורמי החוץ (רווחה, ביקור סדיר, מרפאות לבריאות הנפש) ואת דרכי ההפניה אליהם, כדי לשמור על רצף טיפולי.<\/li>\n<li>יש להתכונן לנושאי ההתבגרות ולתופעות הסיכון (אובדנות, הפרעות אכילה, סמים, פגיעות ברשת) מבחינת ידע ומבחינת נהלי חירום, כי לפי המסמך הם \"מזמנים משברים ואירועי חירום\".<\/li>\n<li>כשעולה מתח בין לחצי הבגרות לבין שמירה על תלמידים מתקשים בבית הספר, אפשר לראות בתפקידך לעזור לבית הספר לנהל את הקונפליקט, ולא לבחור צד באופן אוטומטי.<\/li>\n<li>כדאי לחשוב על התערבויות עקיפות כמו ייעוץ למחנכים והדרכת מטפלים בהבעה ויצירה, ולזכור שהטיפול הישיר בתיכון הוא בדרך כלל קצר מועד.<\/li>\n<li>כשהצרכים חורגים מהיקף השעות, כדאי לבדוק אילו שירותים משלימים (שפ\"מ) אפשר להציע לבית הספר, ולדווח לשפ\"ח על צרכים חוזרים שמצדיקים פתיחת שירות.<\/li>\n<\/ul>","questions":"<ol>\n<li>איך מתחלקת בפועל ההשקעה שלי בין ארבעת תחומי הליבה בבית הספר שלי, ואיך היא אמורה להתחלק לפי מה שסוכם עם המנהל? היכן הפער ומה מקורו?<\/li>\n<li>איך אני מסייע/ת לבית הספר להחזיק את המתח בין אחוזי הבגרות לבין עקרון ההתמדה, בלי להפוך ל\"שותף\" לדחיקת תלמידים או ל\"מתנגד\" קבוע?<\/li>\n<li>אילו מבנים קיימים (או חסרים) בבית הספר כדי להכיל ולהעצים את המחנכים, שהתלמידים מפקידים בידיהם חלקים רגשיים? מה אני יכול/ה ליזום יחד עם היועצת?<\/li>\n<li>במצב של סיכון אובדני או פגיעה מינית אצל תלמיד/ה, האם ברור לי מי עושה מה (יועצת, פסיכולוג, גורמי חוץ) ומי איש הקשר?<\/li>\n<li>מה המשמעות של היותי \"גורם חוץ בית ספרי\" ביחסים שלי עם הצוות? מתי זה מסייע ומתי מקשה?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"הפסיכולוג הוא גורם חוץ בית ספרי, העובד עם כלל ביה\"ס.\"<\/li>\n<li>\"עקרונות אלה לא תמיד מתיישבים זה עם זה ופסיכולוג ביה\"ס מסייע לביה\"ס לנהל את המרחב הקונפליקטואלי המתקיים ביניהם\"<\/li>\n<li>\"על עבודת הפסיכולוג להיות נאמנה לליבה – למטרות בעטיים נשלח לתת את שירותיו- אך עם זאת עליה להיות דינאמית ונתונה לשינויים עפ\"י הצרכים הייחודיים של כל מערכת.\"<\/li>\n<\/ul>"},"level":"שנה א' (לכל מתמחה ששובץ לבית ספר על-יסודי), וגם שנים ב'-ג'","stype":"מתווה מדיניות / מודל עבודה (מסמך הגדרת תפקיד)","tldr":"מסמך קצר ומעשי שמגדיר את ליבת העבודה של הפסיכולוג החינוכי בחטיבות הביניים ובתיכונים בשפ\"ח תל אביב-יפו. הוא נפתח בייעוד השירות כפי שנוסח במתווה שפ\"י (2010) ובהגדרת הפסיכולוג כגורם חוץ-בית-ספרי שעובד עם כלל בית הספר ומחויב לאתיקה ולסודיות. לאחר מכן…","search":"מסמך קצר ומעשי שמגדיר את ליבת העבודה של הפסיכולוג החינוכי בחטיבות הביניים ובתיכונים בשפ\"ח תל אביב-יפו. הוא נפתח בייעוד השירות כפי שנוסח במתווה שפ\"י (2010) ובהגדרת הפסיכולוג כגורם חוץ-בית-ספרי שעובד עם כלל בית הספר ומחויב לאתיקה ולסודיות. לאחר מכן הוא מונה ארבעה מאפיינים של בית הספר העל-יסודי והשלכותיהם: היקף גדול ומבנה ארגוני מורכב שמחייבים כמה פסיכולוגים וקשר עם בעלי תפקידים רבים; מרכזיות המחנכים והמורים כדמויות רגשיות עבור התלמידים; גיל ההתבגרות על משימותיו ועל התנהגויות הסיכון שלו; והמתח בין העלאת אחוזי הבגרות לבין עקרון ההתמדה. מכאן נגזרים תחומי הליבה: עבודה מערכתית עם המנהל ובעלי התפקידים, התערבות בחירום, עבודה עקיפה וישירה ממוקדת בפרט, ותחומי חובה שמעוגנים בחוק (ועדות אפיון וזכאות, ועדות שילוב וכיתות חינוך מיוחד). כל אלה מושלמים בשירותים המשלימים (שפ\"מ). לפי המסמך, הוא אמור לשמש בסיס לדיאלוג עם מנהל בית הספר על יעדים, סדרי עדיפויות והיקפי השקעה, תוך נאמנות לליבה וגמישות לצורכי כל מערכת. הפסיכולוג הוא \"גורם חוץ בית ספרי\" שעובד עם כלל בית הספר: הוא מכיר את הסביבה הלימודית, החברתית והמשפחתית של התלמיד, מתכנן את עבודתו לפי צורכי הפרט ובהתחשב במאפייני המערכת, ומחויב לאתיקה ולסודיות. הפסיכולוג מביא איתו ידע מהמסגרות הקודמות: הוא מבין את צורכי התלמידים על רקע היכרות מוקדמת איתם מהמסגרות החינוכיות שמהן הגיעו. מבנה בית הספר הגדול מחייב עבודת צוות: בבית ספר על-יסודי (חטיבות, שכבות, \"בתים\") עובד בדרך כלל יותר מפסיכולוג אחד, ויש צורך בקשר עם בעלי תפקידים רבים מעבר למנהל העל, ובאינטגרציה ושיתוף פעולה ביניהם. המחנכים והמורים הם דמויות רגשיות משמעותיות: התלמידים מפקידים בידיהם חלקים רגשיים וחברתיים. לכן הפסיכולוג, יחד עם היועצת והצוות הבכיר, מפתח מבנים להכלה ולהעצמה של הצוות, כדי לחזק את יכולת ההחזקה וההכלה שלו. גיל ההתבגרות קובע את התוכן: צריך להתייחס למשימות התפתחותיות נורמטיביות (צבא, זוגיות, קשר עם בני הגיל ועם ההורים, זהות עצמית ומינית, חרדת בחינות) ולהציע ידע פסיכו-חינוכי על הרצף שבין נורמטיבי לפתולוגי (סמים ואלכוהול, בריונות, פגיעות ברשת, הפרעות אכילה, סיכון אובדני). המאפיינים האלה מזמנים משברים ואירועי חירום פרטניים ומערכתיים. מטרות שאינן מתיישבות זו עם זו: העלאת אחוזי הבגרות ועקרון ההתמדה (נשירה מינימלית) עלולים להתנגש, והפסיכולוג מסייע לבית הספר לנהל את המרחב הקונפליקטואלי שביניהם. ארבעה תחומי ליבה: עבודה מערכתית, התערבות בחירום, עבודה ממוקדת בפרט (עקיפה וישירה) ותחומי חובה שבחוק. הטיפול הישיר הוא בדרך כלל קצר מועד, ורק בחלקו הקטן ארוך. השירות המשלים (שפ\"מ) הוא כלי להשלמת חסרים: הפסיכולוג מתווך למערכת את האפשרות להיעזר בשפ\"מ, ובמקביל \"מעשיר\" את השפ\"מ בפתיחת שירותים לפי הצרכים שהוא פוגש בשטח. המסמך הוא בסיס לדיאלוג עם המנהל: על יעדים שנתיים או רב-שנתיים, סדרי עדיפויות, תזמונים והיקפי ההשקעה בכל מרכיב. העבודה צריכה להיות נאמנה לליבה ובה בעת דינמית. גורם חוץ בית ספרי: הגדרת מעמדו של הפסיכולוג. הוא אינו איש צוות בית הספר, אבל עובד עם כלל בית הספר. יכולת ההחזקה וההכלה של הצוות: היכולת של המחנכים והמורים לשאת את החלקים הרגשיים והחברתיים שהתלמידים מפקידים בידיהם, שהפסיכולוג מבקש לפתח. עקרון ההתמדה: מחויבות בית הספר לנשירה מינימלית, שעלולה להתנגש עם החתירה להעלאת אחוזי הבגרות. הרצף שבין הנורמטיבי לפתולוגי: המסגרת שדרכה מוצע ידע פסיכו-חינוכי על תופעות של גיל ההתבגרות. עבודה מערכתית: מפגשים עם המנהל ועם גורמי חינוך מרכזיים (יועצות, רכזי שכבות) לייעוץ, לשותפות במדיניות ולהפעלת תוכניות מניעה והתערבות. עבודה ממוקדת בפרט, עקיפה או ישירה: עקיפה היא ייעוץ לצוות והדרכת מטפלים. ישירה היא טיפול, הדרכת הורים, הערכה ואבחון. ועדות אפיון וזכאות: ועדות לפי חוק החינוך המיוחד, שבהן הפסיכולוג שותף בחשיבת הצוות הבין-מקצועי ומכין מסמכים קבילים לפי הצורך. ועדות שילוב: ועדות בין-מקצועיות בבית הספר על ילדים שמועמדים לשילוב. כיתות ח\"מ (חינוך מיוחד) בבית הספר: כיתות שהפסיכולוג מכיר, עוקב אחריהן ושותף בבניית תוכניות עבודה עבורן. שפ\"מ (שירותים משלימים): הרחבת השירותים של השפ\"ח מעבר לתקן הבסיסי, שמשלימה את החסר הנובע מהיקפי הכיסוי ומעומס המטלות. ליבה: המטרות שלשמן נשלח הפסיכולוג לבית הספר, שהעבודה צריכה להיות נאמנה להן ובה בעת להיות דינמית."},{"id":"outline_gan","title":"מודל עבודה בגנים","authors":"שפ\"י, משרד החינוך","year":"2013","cite":"שפ\"י, משרד החינוך (ינואר 2013). מודל עבודה של הפסיכולוג החינוכי בגני הילדים.","url":null,"kind":"outline","desc":null,"file":{"orig":"מודל עבודה בגנים.pdf","ext":"pdf","pdf":"outline_gan.pdf","pages":57,"bytes":3572836},"placements":[],"extra":false,"ref":"מודל העבודה בגנים","inFolder":true,"srcTitle":"שירות פסיכולוגי חינוכי בגני-הילדים – תפיסה תיאורטית וקווים מנחים לעבודה","secs":{"toc":"<ul>\n<li>פתח דבר (עמ' 4); הקדמה (עמ' 6)<\/li>\n<li>פרק א' – גישה אקולוגית-מערכתית לעבודת הפסיכולוג החינוכי בגן-הילדים (עמ' 7)<\/li>\n<li>פרק ב' – עקרונות העבודה של הפסיכולוג החינוכי בגן-הילדים (עמ' 10)<\/li>\n<li>פרק ג' – היבטים ניהוליים וארגוניים בעבודת השפ\"ח בגני-הילדים (עמ' 18)<\/li>\n<li>פרק ד' – גישות וכלים לאיתור ולהערכת ילדי גן (עמ' 20)<\/li>\n<li>פרק ה' – עבודת הפסיכולוג החינוכי בגן-הילדים על-פי תכנית שנתית (עמ' 26)<\/li>\n<li>פרק ו' – היבטים אתיים בעבודת הפסיכולוג החינוכי בגן-הילדים (עמ' 29)<\/li>\n<li>נספחים (עמ' 31): א' איגרת להורים; ב'1 מיפוי גן חובה; ב'2 מיפוי גן טרום-חובה; ג' ויתור סודיות; ד' שאלון/ריאיון הורים; ה' סיכום נתונים על ילד גן-חובה (מוכנות לכיתה א'); ו'1 תיק גן; ו'2 סיכום עבודה שנתית בגן; ו'3 דף פעילות חודשי<\/li>\n<li>פרק ז' – קישורים (עמ' 50); פרק ח' – מראי מקום (עמ' 54); פרק ט' – ביבליוגרפיה מומלצת נוספת (עמ' 57)<\/li>\n<\/ul>","abstract":"<p>החוברת מציעה מתכונת לעבודה מיטבית (Best practice) של השירות הפסיכולוגי החינוכי בגני-הילדים, בעיקר בגני-חובה, מתוך הנחה שהגיל הרך – עם השינויים המהירים בתפקוד וגמישות המוח – הוא \"חלון הזדמנויות\" למניעה ולהתערבות מוקדמת. הבסיס התיאורטי הוא הגישה האקולוגית-מערכתית (ברונפנברנר) ותפיסת \"הליווי ההתפתחותי\": הילד נתפס כחלק ממערכת משפחתית, חינוכית וקהילתית, ומוקד ההתערבות המרכזי של פסיכולוג הגן הוא מערכת היחסים בין הילד למבוגרים המטפלים בו – ההורים והגננת. המסמך מפרט עקרונות עבודה בחמישה תחומי פעולה (הגננת וצוות הגן; ילדי הגן; ההורים; שותפי תפקיד ומערך תמיכה; מצבי לחץ, חירום ומשבר), היבטים ניהוליים לשפ\"ח (שיבוץ רציף, רכז גיל רך, \"תיק גן\"), ופרק על איתור והערכה בגיל הרך לפי מודל RTI בשלוש רמות, כולל דגשים לאבחון ילדים צעירים וסקירת כלים לפי קטגוריות. לב המסמך המעשי הוא תכנית עבודה שנתית מחולקת לחמש תקופות (אוגוסט–יוני) ולארבעה צירים (גננת, ליווי התפתחותי, הורים, שותפי תפקיד), עם מועדי ועדות ומוכנות לכיתה א'. פרק אתי מדגיש הסכמת הורים, סודיות כלפי צוות הגן, ריבוי נאמנויות וזהירות מתיוג-יתר. הנספחים כוללים טפסים מוכנים לשימוש: איגרת להורים, טופסי מיפוי, ויתור סודיות, ריאיון הורים, סיכום נתוני מוכנות ותיק גן.<\/p>","ideas":"<ul>\n<li>הגיל הרך הוא \"חלון הזדמנויות\" למניעה: בהיעדר חסך קיצוני או פגיעה אורגנית חמורה רוב הילדים מתגברים על קשיים מוקדמים, והתערבות מוקדמת מתאימה יכולה לשנות מהלך התפתחות חריגה. נוכחות כמעט כל ילדי 3–6 במערכת הציבורית מאפשרת איתור ותכניות התערבות לאורך שנה עד שלוש.<\/li>\n<li>הגישה האקולוגית-מערכתית מחייבת התייחסות בו-זמנית לשלושה תחומים: היבטים התפתחותיים אישיים ובין-אישיים של הילד; מערכת היחסים הורים–גננת; והמדיניות החינוכית (חוזרי מנכ\"ל, נהלים, והאופן שבו הגננת מיישמת אותם).<\/li>\n<li>מוקד ההתערבות הוא מערכת היחסים בין הילד למבוגרים המשמעותיים; הפסיכולוג משמש גורם תמיכה מקצועי לכל אחד מהשותפים ומאזן בין צורכי ההורה, הילד והגננת. ל\"התאמה\" (Goodness of fit) בין הילד לאפשרויות ההכלה של סביבתו משקל רב בדפוס ההתמודדות שלו, ולאיכות הקשר גננת–ילד השפעה ארוכת טווח (עד כיתה ח').<\/li>\n<li>העבודה עם הגננת נשענת על מיפוי משותף בתחילת השנה, \"חוזה עבודה\" (מטרות, תכנים, דרכי תקשורת, לוחות זמנים), חזרה למיפוי במהלך השנה ולא רק בסופה, היוועצות שוטפת, ובחירה שנתית של תחום אחד להתערבות מערכתית.<\/li>\n<li>הליווי ההתפתחותי של כלל הילדים (מיפוי, איתור, תכנית, מעקב אחר התגובה להתערבות) קודם להערכה פסיכולוגית פרטנית; הערכה מעמיקה נדרשת כשההתקדמות מעטה לאחר בחינת חלופות.<\/li>\n<li>מוכנות לכיתה א' אינה סוגיה עצמאית אלא חלק מהליווי ההתפתחותי; הישארות שנה נוספת היא \"תהליך ולא אירוע חד-פעמי\", אפשרות אחת ממכלול מענים, וההמלצה צריכה לשקלל עמדת משפחה, מאפייני הגן ומאפייני המערכת הקולטת.<\/li>\n<li>המפגש עם פסיכולוג הגן הוא לרוב המפגש הראשון של ההורים עם השפ\"ח – \"כרטיס הביקור של הפסיכולוגיה החינוכית\"; נדרשים קבלה ותמיכה מוגברים, ליווי בתהליכי הכרה בצרכים מיוחדים והפניה לוועדות, וזהירות מתיוג-יתר שעלול לייצר נבואה המגשימה את עצמה.<\/li>\n<li>הערכה בגיל הרך מאורגנת לפי RTI בשלוש רמות (כלל הילדים – קבוצות/פרט בגן – הערכה מעמיקה בכלים סטנדרטיים לצורכי זכאות), ודורשת רגישות לחוויית הילד באבחון, שקילת תוקף ומהימנות, וזהירות בפרשנות כלים ללא נורמות ישראליות.<\/li>\n<li>היערכות לחירום בגן מבוססת על שלוש רמות מניעה (קפלן) ועל הבנת האופן הייחודי שבו ילדים צעירים חווים לחץ – דרך תגובת המבוגר, בחשיבה חד-משמעית, בקושי בסיבה-תוצאה ובהשלמת פערי מידע בדמיון.<\/li>\n<li>ברמת השפ\"ח: שותפות במדיניות הגיל הרך ברשות, שיבוץ רציף של אותו פסיכולוג באותו גן כמה שנים ובגנים ה\"מזינים\" את בית-הספר שלו, מינוי רכז גיל רך, הכשרה יזומה, ותיעוד שיטתי ב\"תיק גן\".<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>גישה אקולוגית-מערכתית<\/strong> – תפיסה (ברונפנברנר) הרואה בילד חלק ממערכת משפחתית, חינוכית וקהילתית שבין מרכיביה יחסי גומלין והשפעות הדדיות (\"אפקט של אדוות\").<\/li>\n<li><strong>ליווי התפתחותי<\/strong> – מעקב שיטתי ורציף אחר התפתחות כלל ילדי הגן לאורך זמן, הכולל איתור חוזקות וחולשות, מניעה, בניית תכניות ומעקב אחר יעילותן.<\/li>\n<li><strong>ס-ק-י-ר-ת התפתחות<\/strong> – שילוב (מי-טל ושר) של הגישה האקולוגית עם המודל הרב-ממדי של לאזרוס: סביבה, קוגניציה (עמדות, תפיסות, כישורים), יחסים בין-אישיים, ביטויי רגשות, תגובות התנהגותיות, והתאמה התפתחותית לשלב.<\/li>\n<li><strong>Goodness of fit (התאמה)<\/strong> – מידת ההתאמה בין הילד לאפשרויות ההכלה של סביבתו המשפחתית והחינוכית, המשפיעה על דפוס ההתמודדות שלו גם כשמקור הקושי ביולוגי.<\/li>\n<li><strong>חוזה עבודה עם הגננת<\/strong> – הסכמה בתחילת השנה על מטרות, תכנים, דרכי תקשורת ולוחות זמנים, הנבנית מתוך מיפוי משותף של הגן.<\/li>\n<li><strong>מיפוי גן<\/strong> – תהליך משותף לגננת ולפסיכולוג למיפוי מאפייני הגן, הצוות והתכניות, ומיפוי כלל הילדים לאיתור מי שזקוק להתייחסות (ייחודי לעבודה בגנים).<\/li>\n<li><strong>תיק גן<\/strong> – תיק מתעדכן שנתית המתעד את העבודה המערכתית והפרטנית בגן, ומאפשר רציפות גם כשמתחלף פסיכולוג.<\/li>\n<li><strong>RTI – תגובה להתערבות<\/strong> – מודל הערכה מעגלי ודינמי: איתור צרכים, החלטה על התערבות, ניטור התגובה ובדיקה חוזרת, בשלוש רמות עוצמה.<\/li>\n<li><strong>מבטים<\/strong> – כלי תצפית של האגף לחינוך קדם-יסודי לגננת, בסביבה הטבעית, בתחומים רגשי-חברתי, תחושתי-מוטורי, שפתי וקוגניטיבי.<\/li>\n<li><strong>הערכה מבוססת קריטריונים<\/strong> – כלים להעמקת ההיכרות עם ילדים מאותרים בלבד; לא להעברה גורפת, כדי למנוע מיון-יתר.<\/li>\n<li><strong>אקלים גן מיטבי<\/strong> – שישה סטנדרטים לפי חוזר מנכ\"ל (2009) שהפסיכולוג מייעץ לגננת בקידומם.<\/li>\n<li><strong>שלוש רמות מניעה (Caplan)<\/strong> – ראשונית (הכנה והיערכות), שניונית (זיהוי והתערבות סמוך לאירוע), שלישונית (הפחתת משקעים לטווח ארוך).<\/li>\n<li><strong>שותפי תפקיד<\/strong> – גורמי משרד החינוך (מפקחת, מדריכה פדגוגית, יועצת גיל רך, מתי\"א, גננת שילוב), בריאות, רווחה, הרשות המקומית ועמותות.<\/li>\n<li><strong>ריבוי נאמנויות<\/strong> – מחויבות אתית בו-זמנית לילד, להוריו, לגננת, למפקחת ולגורמי הרשות.<\/li>\n<li><strong>תיוג-יתר<\/strong> – מתן הגדרה של תסמין להתנהגות שבגיל זה עשויה להעיד על קושי זמני; עלול ליצור נבואה המגשימה את עצמה.<\/li>\n<\/ul>","models":"<h3>1. שלושת התחומים להתייחסות בו-זמנית (פרק א')<\/h3>\n<ol>\n<li>היבטים התפתחותיים אישיים ובין-אישיים של הילד (שונות רבה בקצב ההתפתחות; קושי להבחין בין וריאציה נורמטיבית לבין הפרעה; עדיפות להתייחסות כוללנית גם לבעיה ספציפית – גרינספן).<\/li>\n<li>מערכת היחסים הורים–גננת (עומס על ההורים ועל הגננות; הפסיכולוג בונה ערוצי תקשורת ושיתוף פעולה).<\/li>\n<li>מדיניות חינוכית (הכרת חוזרי מנכ\"ל ונהלים, וערנות לאופן יישומם בידי הגננת ולעמדותיה).<\/li>\n<\/ol>\n<h3>2. חמשת תחומי הפעולה – עקרונות עבודה (פרק ב')<\/h3>\n<p><strong>תחום 1 – הגננת וצוות הגן<\/strong><\/p>\n<ul>\n<li>מכירים את מבנה הגן: גננת (מנהלת הגן, עובדת משרד החינוך), סייעת (עובדת הרשות), רכזת חטיבה צעירה, גננת/סייעת סבב (משלימה), גננת שילוב, גורמים טיפוליים, מתנדבים ומפעילי תכניות. הגננת במקום מרכזי אך לעיתים חשה בדידות.<\/li>\n<li>תחילת שנה: מיפוי משותף של אפיוני הגן וצורכי הצוות + חוזה עבודה (מטרות, תכנים, תקשורת, לוחות זמנים). למפות: מבנה הגן ומיקומו (עצמאי / בחט\"צ / אשכול), אוכלוסייה, סביבה, תרבות עבודה, תכניות, בעלי תפקידים ויחסי הגומלין ביניהם – חוזקות כמשאבים לצד תחומים לקידום.<\/li>\n<li>במהלך השנה: חזרה למיפוי לבחינת התקדמות, דרכי עבודה וקבלת החלטות; פתיחות לביקורת מצד הגננת. סוף שנה: אילו מטרות הושגו והגדרת צרכים לשנה הבאה.<\/li>\n<li>היוועצות (קונסולטציה) כבסיס; בחירת תחום שנתי להתערבות מערכתית (מתוך המיפוי, צורך שהגננת מציגה, או ראיית הפסיכולוג).<\/li>\n<li>העשרת הצוות בנושאים כגון: פחדים, גבולות וסמכות גננת, כישורים חברתיים, מוכנות לגן חובה.<\/li>\n<li>ערנות לסגנון הגננת, עבודת הצוות, דפוסי תקשורת, מעורבות הורים ויחסי הורים–גננת (במפגש אישי או בקבוצת גננות).<\/li>\n<li>ייעוץ לבניית תכניות לאקלים מיטבי – שישה סטנדרטים (חוזר מנכ\"ל 2009, פרק ג'): (1) מוגנות ובטיחות; (2) תקשורת בין-אישית בין באי הגן; (3) התפתחות רגשית וחברתית; (4) אקלים למידה; (5) מענה לילדים בעלי צרכים ייחודיים; (6) יחסי גומלין בין צוות הגן להורים ומכוונות לקהילה. כולל פיתוח אמפתיה, הצטרפות לקבוצה ופתרון בעיות בין-אישיות.<\/li>\n<\/ul>\n<p><strong>תחום 2 – ילדי הגן<\/strong><\/p>\n<ul>\n<li>ליווי הגננת במיפוי כלל הילדים (שאלות על תפקוד קוגניטיבי, שפתי, רגשי-חברתי, חזותי-מוטורי) ואיתור ילדים/קבוצות בעלי צרכים ייחודיים; ההורים שותפים משמעותיים.<\/li>\n<li>אחרי האיתור: בניית תכנית התערבות, הדרכת הגננת לשונות בקצב ההתפתחות ולהתאמת הסביבה, סיוע בתקשורת עם ההורים, חלוקת תפקידים ובחינת יעילות.<\/li>\n<li>אם ההתקדמות מעטה לאחר בדיקת חלופות – הערכה פסיכולוגית (בידי פסיכולוג הגן או גורם אחר); לעיתים הפניה למכון להתפתחות הילד / מרכז תמיכה יישובי, וליווי ההורים בהפניה.<\/li>\n<li>ילדים עם צרכים מיוחדים בגן (עם/בלי סייעת) או משולבים מחנ\"מ – השתתפות בישיבות בין-מקצועיות ובבניית תכניות סיוע.<\/li>\n<li>טיפול: מטרה – רווחת הילד והחזרתו לתפקוד מסתגל; לערב לפחות הורה אחד (משותף או נפרד). מקורות הקושי: נסיבות חיים (טראומה, גירושין, תפקוד הורי לא מותאם); משברים נורמטיביים בתגובה מוקצנת (לידת אח, מעבר דירה); מקור קונסטיטוציוני/ביולוגי. בתיאום עם ההורים – שיתוף הגננת בעקרונות והנחייתה.<\/li>\n<li>מוכנות לכיתה א': מעקב כחלק מהליווי; הערכה פסיכולוגית כשנדרש בירור; ערוב הורים מוקדם; ההחלטה – תהליך, הכוללת שיקולים אקולוגיים (עמדת משפחה, מאפייני גן, מאפייני מערכת קולטת; נספח ה').<\/li>\n<li>מעברים (טרום-חובה→חובה→כיתה א'): ליווי הגננת וההורים, סדנה/הרצאה להורים, תיאום בין המערכת המוציאה לקולטת.<\/li>\n<li>צרכים מיוחדים והפניה לוועדות: קשב לרגשות ההורים (קושי לקבל חריגות, תחושת כישלון, חרדה מסטיגמה, חשש מהעתיד); תכלול עמדות שונות; באי-הסכמה – לפעול לפי החוק וחוזרי מנכ\"ל לטובת הילד; הכנת הילד לוועדה (מוזמן, השתתפותו לפי החלטת ההורים); ליווי לאחר ההחלטה.<\/li>\n<\/ul>\n<p><strong>תחום 3 – ההורים<\/strong><\/p>\n<ul>\n<li>ההורים בעלי הסמכות החוקית והטבעית; הצגת תפקיד הפסיכולוג ודרכי הפנייה בתחילת שנה (באסיפת הורים דרך הגננת, באיגרת – נספח א', או במפגש עם כלל ההורים).<\/li>\n<li>פנייה ראשונה – קבלה ותמיכה מוגברות; ליווי בהכרת הבעיה, בבחירת תכניות, והפניה לגורמים נוספים.<\/li>\n<li>סיוע בשיתוף פעולה הורים–גננת (בכפוף לוויתור סודיות); זהירות מתיוג-יתר.<\/li>\n<li>מפגשים לכלל ההורים (לפי משאבי השפ\"ח): פרידה, חשיבות המשחק, גבולות וסמכות הורית, כישורים חברתיים, הכנה למעברים, מוכנות לכיתה א'.<\/li>\n<\/ul>\n<p><strong>תחום 4 – שותפי תפקיד ומערך תמיכה<\/strong><\/p>\n<ul>\n<li>משרד החינוך: מפקחת (מטמיעה מדיניות קדם-יסודי, מפקחת ומסייעת); מדריכות פדגוגיות; יועצת חינוכית לגיל הרך (אקלים גן, תכניות התפתחותיות ומניעה, משבר וסיכון, למידה מותאמת; עבודה מכוונת צוות – <strong>לא<\/strong> עבודה ישירה בעניין ילד/הורה ספציפי); מדריכות אח\"מ; מתי\"א (מרכז תמיכה יישובי/אזורי לחנ\"מ, 3–21, מקצה שעות שילוב ושח\"ם); גננת שילוב.<\/li>\n<li>בריאות: קופות חולים, מכונים להתפתחות הילד, טיפות חלב. רווחה: עו\"ס, פקידי סעד. הרשות המקומית: היבטים מבניים, פיזיים, ביטחוניים, סייעות; מנהל חינוך ורכז גיל רך. עמותות, גופים פרטיים ותכניות לאומיות.<\/li>\n<li>עבודה משותפת מחויבת עם המפקחת במקרים כגון: בעיות התנהגות חוזרות, אי-הסכמה על דחיית המעבר לכיתה א', פגיעות מיניות.<\/li>\n<li>יש להגדיר עם היועצות חלוקת עבודה בשגרה ובחירום ולהציגה לפיקוח, לרשות ולצוותים.<\/li>\n<\/ul>\n<p><strong>תחום 5 – מצבי לחץ, חירום ומשבר<\/strong><\/p>\n<ul>\n<li>בתחילת השנה: דיון עם הגננת בנהלים, מיפוי משאבים, בחינת דרכי עבודה.<\/li>\n<li>שלוש רמות מניעה: ראשונית (הכנת הצוות והמבקרים, בחינת המערך הארגוני והמשאבים, הדרכה לגננת, לצוות ולהורים); שניונית (עם התרחשות האירוע – זיהוי קשיי הסתגלות ותגובות קיצוניות ומניעת החרפה); שלישונית (אחרי שהמשבר האקוטי חלף – הפחתת משקעים לאורך זמן).<\/li>\n<li>הפסיכולוג נותן מענה מערכתי ומשמש כתובת לגננת; מסייע פרטנית לפי סוג האירוע, היקפו והמשאבים.<\/li>\n<li>דגשים על תגובת ילדים צעירים ללחץ: (1) חווים את הלחץ דרך המבוגר; מבוגרים מבוהלים ולא פנויים פוגעים בתחושת המוגנות; (2) תפיסה חד-משמעית (טוב/רע, שחור/לבן), קושי בנקודת מבט של אחר; (3) קושי בסיבה-תוצאה, דמיון מגביר סכנה, ופחדים שלא מקבלים ביטוי מעלים חרדה; (4) קליטת מידע חלקי מהתקשורת ומשיחות מבוגרים והשלמתו בדמיון – לכן הסבר מותאם גיל וחשיפה סלקטיבית.<\/li>\n<\/ul>\n<h3>3. היבטים ניהוליים בשפ\"ח (פרק ג')<\/h3>\n<ol>\n<li>מקום השפ\"ח ברשות – שותפות בקביעת מדיניות לגיל הרך (מענים, משאבים, שיתוף פעולה, רצף חינוכי, הורים).<\/li>\n<li>תקנים – לפי \"מתווה השירות הפסיכולוגי החינוכי\" (חוזר מנכ\"ל תש\"ע/8(א), 2010); נוכחות סדירה בגן; שאיפה להרחבה לגני טרום-חובה.<\/li>\n<li>שיבוץ – אותו פסיכולוג באותו גן כמה שנים; שירות לגנים ה\"מזינים\" את בית-הספר שלו; רצף מגנים צעירים לחובה ולבית-הספר.<\/li>\n<li>רכז גיל רך – קידום התחום, כתובת להיוועצות, עדכון ידע, קשר עם פורום מחוזי, פיקוח ורשות, ועדות היגוי.<\/li>\n<li>פיתוח והכשרה – הכשרה יזומה למדריכים ולפסיכולוגים; ריכוז חומרים תיאורטיים, כלי איתור, חוזרי מנכ\"ל וחומרי האגף הקדם-יסודי.<\/li>\n<li>תיק גן – פרטים כלליים, דמוגרפיה, מיפוי שותפים, תכניות, מטרות ומוקדי התערבות; דיון סיכום עם הגננת בסוף השנה.<\/li>\n<\/ol>\n<h3>4. איתור והערכה בגיל הרך (פרק ד')<\/h3>\n<p><strong>אתגרים ייחודיים<\/strong>: שונות רבה ושינויים התפתחותיים מהירים; תלות בסביבה ובדמויות מוכרות; קושי לשתף פעולה במטלות פורמליות עם אדם זר.<\/p>\n<p><strong>מודל RTI – שלוש רמות<\/strong> (כולל נתוני התרשים במקור):<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>רמה<\/th>\n<th>למי<\/th>\n<th>מה עושים<\/th>\n<th>תפקיד הפסיכולוג<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>I ראשונית (כ-75%–85%)<\/td>\n<td>כלל ילדי הגן<\/td>\n<td>התערבות לכלל הילדים, עבודה דיפרנציאלית מותאמת בידי הגננת, מעקב אחר התקדמות<\/td>\n<td>סיוע לגננת במיפוי שיטתי (למשל \"מבטים\"), גיבוש דרכי התערבות בפעילות הכללית, מעקב ותיעוד שינויים<\/td>\n<\/tr>\n<tr>\n<td>II שניונית (כ-10%)<\/td>\n<td>ילדים מאותרים הזקוקים לעזרה ממוקדת<\/td>\n<td>הוראה/סיוע בקבוצות קטנות או פרטנית, בידי גננת בעלת הכשרה, מעקב התקדמות<\/td>\n<td>בחינה עם הגננת ושותפי התפקיד של התאמות; לעיתים גורמים נוספים (גננת שילוב, קלינאית תקשורת, מרפאה בעיסוק, מטפלת באומנות, פסיכולוג)<\/td>\n<\/tr>\n<tr>\n<td>III שלישונית (כ-5%–10%)<\/td>\n<td>ילדים שקשייהם נמשכים למרות התערבויות<\/td>\n<td>התערבות פרטנית או בקבוצות קטנות, ממושכת ובתכיפות גבוהה, בצוות רב-מקצועי מהחינוך הרגיל והמיוחד<\/td>\n<td>הערכה מעמיקה בכלים סטנדרטיים, בעיקר לצורך החלטה על זכאות לשירותים מיוחדים<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>דגשים בהערכת ילדים צעירים<\/strong>:<\/p>\n<ol>\n<li>חשש מהמפגש הבין-אישי – ערך להיכרות קודמת מהביקורים בגן; חלק ראשון של ההערכה מוקדש להיכרות ואמון (שיחה ומשחק, פרטני או בקבוצה קטנה).<\/li>\n<li>חשש משאלות/\"חקירות\" ומכישלון – לעודד מאמץ ללא קשר לטיב הביצוע; להיות ערים לקושי עם רצפי כישלון שבנויים בחלק מהמבחנים.<\/li>\n<li>הבניית-יתר וקושי בהתמדה – לשים לב למשך ההערכה, לאפשר הפסקות והפוגות משחק, ולשמור על סטנדרטים תוך קשב לתגובות הייחודיות.<\/li>\n<\/ol>\n<p><strong>שיקולים בבחירת כלים<\/strong>: התאמה למטרת ההערכה ולצרכים ההתפתחותיים; תוקף ומהימנות; מדיניות שפ\"י המתעדכנת ודרישות האגף הקדם-יסודי; יעילות (מידע מול השקעה). שלושה סוגי כלים בארגז: כלים עם סטנדרטיזציה ישראלית; כלים עם תיקוף פורמלי ללא נורמות ישראליות; כלים מתורגמים לתפקודים \"אוניברסליים\" (למשל נורמות אמריקאיות לפעלתנות-יתר). בכלים לא מתוקפים – להימנע משיפוט כמותי ולהצליב מקורות והתרשמות קלינית. לכתיבת הערכות לוועדות – \"מסמך הסטנדרטים להערכה פסיכולוגית לוועדות על-פי חוק\". לא ליטול תת-מבחנים בודדים לקבלת החלטות משמעותיות (אלא אם הנחיות המבחן מתירות).<\/p>\n<p><strong>כלים לדוגמה לפי קטגוריות (רשימה חלקית לפי המסמך, 2013)<\/strong>:<\/p>\n<ul>\n<li><strong>א. סקירת כלל ילדי הגן (בשימוש הגננת)<\/strong>: א.1 \"מבטים\" (תצפית בסביבה הטבעית בכל תחומי ההתפתחות); א.2 תכנית הלימודים לגן הממלכתי והממלכתי-דתי (למשל \"תשתית לקראת קריאה וכתיבה\": מודעות פונולוגית, הכרת אותיות, מכוונות לספר).<\/li>\n<li><strong>ב. כלים מבוססי קריטריונים לפרט/קבוצה קטנה<\/strong> (לא להעברה גורפת): ב.1 איתורן (חובה) / איתורון (טרום-חובה) + הערכת מוכנות לכיתה א' (שפה, מוטוריקה, מוכנות לחשבון, תפיסה, זכירה; המנבאים העיקריים: ידע אותיות ומספרים, שיום אותיות, מודעות פונולוגית, מוטוריקה עדינה ותחומים רגשיים); ב.2 מסל\"ג ומשלים מסל\"ג (קבוצות של 4–6 ילדים, גילאי 4–6; מושגי יסוד, כושר מספרי, הבחנה חזותית, תכלול בין-חושי, תיאום תפיסתי-מוטורי; המשלים – יחידני).<\/li>\n<li><strong>ג. שאלונים להורים/גננת<\/strong>: ג.1 קונרס (נורמות אמריקאיות, 3–18, בעיקר קשב והיפראקטיביות); ג.2 ערכת אכנבך לגיל הרך (1.5–5, נורמות אמריקאיות); ג.3 שלג\"י – שאלון להערכת ילד גן למילוי הגננת (4 חלקים: שכיחות התנהגויות מקשות – קשיי למידה, התנהגות מקשה, חרדה וביישנות; משאבים חיוביים; הערכה כללית; מידע כללי); ג.4 SDQ – שאלון יכולות וקשיים (3–16; חמישה סולמות: סימפטומים רגשיים, בעיות התנהגות, היפראקטיביות, בעיות ביחסים חברתיים, התנהגות פרו-חברתית + ציון קשיים כולל); ג.5 סולמות סמילנסקי ושפטיה (איכות המשחק והמשחק הסוציו-דרמטי).<\/li>\n<li><strong>ד. כלים פורמליים בהנחיית הפסיכולוג<\/strong>: ד.1 K-ABC (3–12; עיבוד סדרתי, עיבוד סימולטני, מכלול עיבוד מנטלי, הישגים; נורמות ישראליות, תרגום 1995); ד.2 WPPSI (3 שנים ו-10 ח' עד 6 שנים ו-7 ח'; מילולי/ביצועי/כללי; נורמות ישראליות מ-1968); ד.3 סטנפורד-בינה (2003) (מגיל שנתיים; הסקה פלואידית, ידע, הסקה כמותית, זיכרון עבודה; ללא נורמות ישראליות).<\/li>\n<li><strong>ה. תפיסתי-מוטורי<\/strong>: ה.1 בנדר I ובנדר II (מגיל 3; העתקה וזכירה; בנדר II מבחין בין קושי בתפיסה חזותית לקושי בביצוע ויזו-מוטורי); ה.2 ציור איש (DAP) – נורמות גודאנוף (מ-3 ש' ו-3 ח') וקופיץ (מגיל 5).<\/li>\n<li><strong>ו. רגשי-חברתי<\/strong> (שימוש זהיר בהשלכתיים בגיל הרך): ו.1 CAT / CAT-H (3–10; CAT-H מתאים בעיקר לגיל גן); ו.2 השלמת משפטים (הצעה לפרשנות לגילאי 5–6 – יגאל עמנואל); ו.3 מבחן בר-אילן (מוכנות לכיתה א': מודעות לבית-הספר, חרדה כללית/סביב בית-הספר, העדפה לימודית/משחקית).<\/li>\n<\/ul>\n<h3>5. תכנית עבודה שנתית (פרק ה') – מלאה<\/h3>\n<p>עקרון-על: בכל התערבות הקשורה לפרט יש לשתף את ההורים ולקבל הסכמתם; בילד בסיכון – לשקול ערוב רווחה/פקידת סעד.<\/p>\n<p><strong>אוגוסט–אוקטובר | מוקד: היכרות ומיפוי ראשוני<\/strong><\/p>\n<ul>\n<li><em>גננת וצוות<\/em>: (1) היערכות – לפתוח \"תיק גן\" בכל שפ\"ח, לקרוא את המידע שהצטבר ולעדכן עם הכניסה לגן; (2) חוזה עבודה עם הגננת – מטרות, דרכי עבודה ותקשורת, תכנים ולוחות זמנים; (3) הצגת תהליך הליווי ההתפתחותי (הרציונל וכלי ההערכה); (4) הגדרת שיתוף הפעולה עם ההורים – יידוע על תפקיד הפסיכולוג ודרכי הפנייה; (5) התארגנות למניעה ולהתמודדות עם מצבי לחץ וחירום, היכרות עם נהלים; (6) בגני חובה – מעקב אחר המוכנות לכיתה א' כחלק מהליווי.<\/li>\n<li><em>ליווי התפתחותי<\/em>: (1) מיפוי ילדי הגן (נספח ב'1) – תמונה ברמת הגן והפרט, חוזקות לצד קשיים; (2) תחילת הליווי; (3) התחלת בניית תכניות ברמה מערכתית ופרטנית; (4) הפניות חריגות לוועדות שילוב – עד סוף ספטמבר.<\/li>\n<li><em>הורים<\/em>: (1) היכרות עם עבודת הפסיכולוג בגן – איגרת להורים (נספח א'), עדכון בידי הגננת ו/או הפסיכולוג במפגש הורים; (2) מפגשי היכרות, הדרכה וייעוץ לפי צרכים או פניות ישירות.<\/li>\n<li><em>שותפי תפקיד<\/em>: (1) עדכון שותפי התפקיד בתיק הגן; (2) לפי הצורך – מפגשי היכרות וקביעת דרכי עבודה.<\/li>\n<\/ul>\n<p><strong>נובמבר–דצמבר | מוקד: איתור ובניית תכנית התערבות ברמה פרטנית ומערכתית<\/strong><\/p>\n<ul>\n<li><em>גננת וצוות<\/em>: (1) מענה לצרכים שוטפים (בעיות משמעת, עבודת הצוות, התחום הרגשי-חברתי); (2) בחירת תחום להתערבות מערכתית; (3) סיוע בליווי ההתפתחותי – איתור ותכניות בשיתוף הורים; (4) אקלים גן – ייעוץ לפיתוח אקלים מיטבי ומניעת אלימות; (5) הרצאה/סדנה לגננות בתיאום עם הפיקוח ובהתאם למתווה.<\/li>\n<li><em>ליווי התפתחותי<\/em>: (1) השתתפות בליווי ובמעקב, בתצפית ובבניית תכנית לפי מודל RTI; (2) שותפות בבניית תכניות קבוצתיות ופרטניות.<\/li>\n<li><em>הורים<\/em>: (1) מפגשי היכרות, הדרכה וייעוץ; (2) סדנה/הרצאה לכלל הורי הגן בנושאים התפתחותיים (בהתאם למתווה).<\/li>\n<li><em>שותפי תפקיד<\/em>: (1) קשרי עבודה עם כל המטפלים בילד לבניית תכנית התערבות/טיפול; (2) הפניה לגורמי טיפול לילד ולמשפחה לפי מוקדי הקושי.<\/li>\n<\/ul>\n<p><strong>ינואר–פברואר | מוקד: מיקוד בילדים מאותרים והמשך ליווי התפתחותי לכלל הילדים<\/strong><\/p>\n<ul>\n<li><em>גננת וצוות<\/em>: (1) המשך; (2) דיון משותף גננת–פסיכולוג–הורים על ילדים עם קשיים משמעותיים, לצורך מילוי שאלון ההפניה לוועדות שילוב/השמה בידי הגננת; (3) סיוע בהפניה לוועדת שילוב – <strong>עד 1 במרס<\/strong> להעביר שאלון למתי\"א; (4) בגני חובה – כשנדרש בירור מוכנות, להפנות שאלון לשפ\"ח <strong>עד 1 במרס<\/strong>.<\/li>\n<li><em>ליווי התפתחותי<\/em>: (1) המשך; (2) הערכת תכניות ההתערבות ויעילותן; (3) המשך איתור ובניית תכניות; (4) הערכות פסיכולוגיות לילדים עם קשיים משמעותיים.<\/li>\n<li><em>הורים<\/em>: (1) המשך; (2) לוודא שההורים מעודכנים ומסכימים להמשך ההתערבות.<\/li>\n<li><em>שותפי תפקיד<\/em>: (1) המשך; (2) מפגשים בין-מקצועיים לפי הצורך.<\/li>\n<\/ul>\n<p><strong>מרס–אפריל | מוקד: גיבוש המלצות להמשך<\/strong><\/p>\n<ul>\n<li><em>גננת וצוות<\/em>: (1) המשך; (2) קשב לצורכי הגן והגננת; (3) ילדים שמופנים בשלב מאוחר – לבחון עם הגננת את השיקולים/החסרים כדי למנוע הישנות; (4) הערכת ילדים הזקוקים להפניה לחנ\"מ; (5) סיוע בהפניה למסגרת חנ\"מ – ערנות למורכבות וסיוע לגננת אישית ומקצועית; הפניה לוועדת השמה <strong>עד אפריל<\/strong>.<\/li>\n<li><em>ליווי התפתחותי<\/em>: (1) הערכות פסיכולוגיות לילדים המועמדים לחנ\"מ, לוועדות השמה, לשילוב (בגן או במעבר לכיתה א') ולהערכת מוכנות; (2) החלטות על מסגרת/סיוע בשיתוף הורים, גננת וגורמי טיפול; המלצות על הישארות ניתן לדחות למאי.<\/li>\n<li><em>הורים<\/em>: (1) מסירת תוצאות ההערכה; (2) החלטות על מסגרת/סיוע; (3) ליווי בהפניה לוועדות (שילוב מתכנסות <strong>1.03–15.05<\/strong>; השמה <strong>לא יאוחר מ-31.05<\/strong>); (4) בחילוקי דעות משמעותיים – לערב מפקחת ו/או גורמי רשות; בילד בסיכון – לשקול רווחה/פקידת סעד.<\/li>\n<li><em>שותפי תפקיד<\/em>: (1) איסוף ותכלול מידע וקבלת החלטות לשנה הבאה; (2) דיון בין-מקצועי לפי הצורך.<\/li>\n<\/ul>\n<p><strong>מאי–יוני | מוקד: תהליכי מעקב וסיכום<\/strong><\/p>\n<ul>\n<li><em>גננת וצוות<\/em>: (1) המשך מענה; (2) סיכום שנתי מערכתי ופרטני – בחינת מטרות והגדרת צרכים לשנה הבאה; (3) תיעוד המסקנות בתיק הגן.<\/li>\n<li><em>ליווי התפתחותי<\/em>: (1) המשך מעקב וסיוע; (2) סיום קבלת ההחלטות – המלצות הישארות <strong>עד סוף מאי<\/strong>; (3) תיעוד: סיכום חוות דעת, כתיבת דוחות ותיוק.<\/li>\n<li><em>הורים<\/em>: (1) מפגשי סיכום ותיעוד; (2) הערכת מצב הילד והמלצות להמשך – המלצת הישארות עד סוף מאי; (3) סיוע בהפניה לגורמי טיפול; (4) סיוע במעברים (למשל בקשת סיוע בכיתה א').<\/li>\n<li><em>שותפי תפקיד<\/em>: (1) סיכום עבודה שנתית עם השותפים; (2) בחינת מטרות ודרכים לשיפור הקשר בשנה הבאה.<\/li>\n<\/ul>\n<h3>6. היבטים אתיים (פרק ו')<\/h3>\n<ul>\n<li>א. <strong>המפגש הישיר עם ילדי הגן<\/strong> – מידע מתקבל גם באופן לא מכוון; ילד שאותר ולא הופנה – להזמין הורים ולשתף את הגננת לפי הסכמתם; לכל תצפית ממוקדת, מפגש או הערכה – הסכמת הורים מתועדת (בהורים פרודים – שניהם); איגרת לכל ההורים בתחילת השנה.<\/li>\n<li>ב. <strong>מחויבות אתית לצוות הגן<\/strong> – רגישות למידע מהתצפית על התנהלות הגן וסודיות.<\/li>\n<li>ג. <strong>עבודה עם כמה גורמים<\/strong> – ריבוי נאמנויות (ילד, הורים, גננת, מפקחת, רשות).<\/li>\n<li>ד. <strong>מיומנות מקצועית<\/strong> – עדכון מתמיד בהתפתחות הילד, אבחון וטיפול.<\/li>\n<li>ה. <strong>אחריות חברתית<\/strong> – רגישות רב-תרבותית, מודעות ליכולת השינוי ולמנגנוני \"פיצוי\", מניעת אבחנות-יתר וסטיגמה.<\/li>\n<li>ו. <strong>שמירת החומר המקצועי<\/strong> – תיק גן (ביקורים, שיחות, ועדות); פגישות פרטניות מתועדות גם על שם הילד; כל ילד בוועדת שילוב/השמה – תיעוד מלא בשפ\"ח.<\/li>\n<\/ul>\n<h3>7. מבנה הנספחים (טפסים לשימוש)<\/h3>\n<ul>\n<li><strong>א' – איגרת להורים<\/strong>: מי הפסיכולוג, תפיסה מערכתית רב-ממדית, מטרה – ליווי התפתחותי לכלל הילדים; ביקורים רציפים, תצפיות וייעוץ לגננת; הזמנת הורים לפי צורך; פנייה דרך הגננת או ישירות לשפ\"ח.<\/li>\n<li><strong>ב'1 – מיפוי גן חובה<\/strong>: נתוני גן ומספר ילדים; טבלת \"ילידי סתיו\" (ספט'–דצמ') – האם מתעורר קושי ובאיזה תחום (שפתי, מוטורי, קוגניטיבי, רגשי, התנהגותי, חברתי) והמלצות (העמקת הערכה וגורם מבצע, תכנית בגן, המלצות להורים, הפניה לטיפול); ילדים שנשארו שנה נוספת (סיבה, המלצות); ילידי ינואר–אוגוסט עם קשיים/התלבטות; ילדים המטופלים במסגרות שונות (סוג ומסגרת, האם יש חומר, המלצות).<\/li>\n<li><strong>ב'2 – מיפוי טרום-חובה<\/strong>: ילדים עם קשיים/שאלה התפתחותית לפי סדר כרונולוגי, מוקד הקושי, המלצות, שנתון (3–4 טרום-טרום / 4–5 טרום-חובה); ילדים המטופלים במסגרות.<\/li>\n<li><strong>ג' – ויתור סודיות<\/strong>: רשות לשפ\"ח למסור מידע לגורם מוגדר; ההסכמה אינה הסכמה מראש להחלטות; חתימת שני ההורים ועד.<\/li>\n<li><strong>ד' – שאלון/ריאיון הורים<\/strong>: פרטים ומשפחה; גורם מפנה וסיבה; אבני דרך: (1) הריון ולידה; (2) התפתחות חושית-מוטורית (כולל ויסות תחושתי ודומיננטיות יד); (3) שפה; (4) אוטונומיה ועצמאות (אכילה, חפץ מעבר, שינה, גמילה); (5) רקע רפואי (ראייה, שמיעה, תרופות, מחלות במשפחה); (6) מסגרות חינוך והסתגלות; (7) תפקוד רגשי-חברתי-התנהגותי (משפחה, חברים, פנאי, שינויים במשפחה) + סולם תדירות ל-15 התנהגויות (משמעת, מצב רוח, סקרנות, ריכוז, תוקפנות, עקשנות, דחיית סיפוקים, תסכול, בכי, תקשורת עם בני גיל ומבוגרים, פרידה, פחדים, טיקים, התנהגות מינית חריגה); סיכום – חוזקות, קשיים, כיצד לסייע.<\/li>\n<li><strong>ה' – סיכום נתונים על ילד גן-חובה (מוכנות לכיתה א')<\/strong>: (1) גורמים המכוונים להישארות – איחור בהתפתחות מוקדמת, גורמי לחץ מרובים; (2) גורמים הנוגדים הישארות – בעיות התנהגות, קשב וריכוז, רמזים ללקויות למידה, ילד גדול בשנתון, אינטליגנציה נמוכה/חשד; (3) כוחות המסייעים ללמידה – מודעות פונולוגית, שיום אותיות, שיום ספרות, יכולת מוטורית לכתיבה, שפה ואוצר מילים, זיכרון עבודה; (4) כוחות רגשיים-חברתיים – עמידות אגו, ויסות דחפים ותסכול, קבלת סמכות, כישורים חברתיים, מוטיבציה; (5) כוחות משפחתיים – משפחה מגויסת, מאפשרת עצמאות, סמכות הורית, גרייה מתאימה; (6) כוחות במערכת – גננת מגויסת, סיוע גננת שילוב/קלינאית/ריפוי בעיסוק, מערך סיוע בבית-הספר הקולט; + מידת התקדמות, עמדת גננת, עמדת הורים, המלצה מסכמת.<\/li>\n<li><strong>ו'1 – תיק גן (ריכוז נתונים)<\/strong>: 10 פרטים כלליים (גן, גננת, סייעת, מפקחת, בית-ספר מוזן, מספרי ילדים, גננת שילוב ומספר ילדי שילוב, מאפייני אוכלוסייה, תכניות, שותפים); מטרות שנקבעו עם הגננת; דגשים.<\/li>\n<li><strong>ו'2 – סיכום עבודה שנתית<\/strong>: א. עבודה מערכתית (תהליך עם הגננת, מוקדים, הורים, חירום, הרצאות/סדנאות); ב. הערכות ואבחונים (מספרי מופנים להערכת מוכנות, שהוערכו, הומלצו להישארות / לכיתה א' + שילוב / לכיתה א'; אבחונים מלאים, הפניות לוועדת השמה, זכאויות); ג. התערבויות פרטניות (ראשי תיבות, סיבה, סוג, מספר מפגשים); ד. המלצות לשנה הבאה.<\/li>\n<li><strong>ו'3 – דף פעילות חודשי<\/strong>: יום, תאריך, שעה, סוג פעילות/קליינטים/נושא, קוד.<\/li>\n<\/ul>","practice":"<ul>\n<li>לפתוח את השנה ב\"תיק גן\": לקרוא מה הצטבר, לעדכן נתונים, ולבנות עם כל גננת חוזה עבודה כתוב (מטרות, תכנים, ערוצי תקשורת, תדירות ביקורים).<\/li>\n<li>לדאוג שאיגרת להורים (נספח א') תופץ בתחילת השנה – זו גם דרישה אתית וגם \"כרטיס הביקור\" של השירות.<\/li>\n<li>לא לבצע תצפית ממוקדת, מפגש פרטני או הערכה בלי הסכמת הורים מתועדת (בהורים פרודים – שניהם); ילד ש\"נקלט בעין\" בביקור – להזמין את ההורים לשיחה לפני כל צעד.<\/li>\n<li>לבנות את הליווי ההתפתחותי לפי RTI: קודם מיפוי כלל הילדים עם הגננת וסיוע דיפרנציאלי בגן, מעקב אחר התגובה, ורק כשההתקדמות מעטה – הערכה פסיכולוגית מעמיקה.<\/li>\n<li>לסמן ביומן את מועדי המפתח: הפניות חריגות לשילוב עד סוף ספטמבר; שאלון למתי\"א ושאלון מוכנות לשפ\"ח עד 1 במרס; הפניה לוועדת השמה עד אפריל; ועדות שילוב 1.03–15.05; ועדות השמה עד 31.05; המלצות הישארות עד סוף מאי (לבדוק מול הנהלים העדכניים).<\/li>\n<li>בשאלת הישארות בגן – להשתמש בנספח ה' כמסגרת חשיבה (גורמים בעד/נגד וכוחות הילד, המשפחה והמערכת), לערב הורים מוקדם ולהתייחס להחלטה כתהליך.<\/li>\n<li>באבחון ילדי גן: להקדיש את תחילת המפגש להיכרות ומשחק, לעודד מאמץ ולא הצלחה, לאפשר הפסקות, ולהיזהר מפרשנות כמותית בכלים ללא נורמות ישראליות ומשימוש בתת-מבחנים בודדים.<\/li>\n<li>לבחור עם הגננת תחום שנתי להתערבות מערכתית (למשל אקלים, כישורים חברתיים, גבולות) ולחזור למיפוי באמצע השנה – לא רק בסופה.<\/li>\n<li>להכיר את שותפי התפקיד ביישוב (מפקחת, יועצת גיל רך, מתי\"א, גננת שילוב, מכונים, רווחה) ולהבחין ביניהם – למשל שהיועצת לגיל רך אינה עובדת ישירות על ילד ספציפי.<\/li>\n<li>בתחילת השנה לשוחח עם הגננת על נוהלי חירום ומשאבים, ובאירוע – להנחות את המבוגרים להסביר מידע באופן מותאם גיל ולצמצם חשיפת ילדים לתקשורת ולשיחות מבוגרים.<\/li>\n<\/ul>","questions":"<ol>\n<li>כיצד אני מאזן/ת בין ההקשבה לצורכי הגננת, ההורים והילד כשהעמדות ביניהם סותרות (למשל בשאלת הפניה לוועדה או הישארות בגן)? למי נאמנותי בכל שלב?<\/li>\n<li>מה ההבדל בין וריאציה התפתחותית נורמטיבית לבין קושי הדורש התערבות – ואיך המסמך מציע להימנע מתיוג-יתר בשלב מוקדם?<\/li>\n<li>איזה תחום מערכתי אבחר השנה בגן שלי, ועל סמך איזה מידע מהמיפוי? כיצד אדע בסוף השנה אם הושגה המטרה?<\/li>\n<li>מה אני לומד/ת על מצבו של ילד מתוך תגובתו להתערבות בגן (RTI) – ומתי זה מצדיק מעבר להערכה פסיכולוגית פורמלית?<\/li>\n<li>כיצד היכרות קודמת שלי עם הילדים מהביקורים בגן משפיעה על מהלך ההערכה ועל תוקפה – לטובה ולרעה?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"מוקד ההתערבות המשמעותי של פסיכולוג הגן הוא מערכת היחסים בין הילד לבין המבוגרים המטפלים בו, הוריו והמחנכים שלו.\"<\/li>\n<li>\"קבלת ההחלטה בדבר הישארותו של ילד בגן חובה שנה נוספת היא תהליך ולא אירוע חד-פעמי.\"<\/li>\n<li>\"תיוג שאינו במקומו עלול ליצור דינמיקה של נבואה המגשימה את עצמה.\"<\/li>\n<li>\"יש לראות בכך הזדמנות להציג את 'כרטיס הביקור של הפסיכולוגיה החינוכית', ולשאוף להיכרות רחבה עם מספר גדול ככל הניתן של הורים.\"<\/li>\n<\/ul>"},"level":"שנה א' (מסמך יסוד לכל מתמחה שעובד בגנים; נספחי האבחון והמוכנות רלוונטיים גם לשנים ב'-ג')","stype":"מתווה מדיניות / מודל עבודה (חוברת הנחיות רשמית של שפ\"י, כולל נספחים וטפסים)","tldr":"החוברת מציעה מתכונת לעבודה מיטבית (Best practice) של השירות הפסיכולוגי החינוכי בגני-הילדים, בעיקר בגני-חובה, מתוך הנחה שהגיל הרך – עם השינויים המהירים בתפקוד וגמישות המוח – הוא \"חלון הזדמנויות\" למניעה ולהתערבות מוקדמת. הבסיס התיאורטי הוא הגישה…","search":"החוברת מציעה מתכונת לעבודה מיטבית (Best practice) של השירות הפסיכולוגי החינוכי בגני-הילדים, בעיקר בגני-חובה, מתוך הנחה שהגיל הרך – עם השינויים המהירים בתפקוד וגמישות המוח – הוא \"חלון הזדמנויות\" למניעה ולהתערבות מוקדמת. הבסיס התיאורטי הוא הגישה האקולוגית-מערכתית (ברונפנברנר) ותפיסת \"הליווי ההתפתחותי\": הילד נתפס כחלק ממערכת משפחתית, חינוכית וקהילתית, ומוקד ההתערבות המרכזי של פסיכולוג הגן הוא מערכת היחסים בין הילד למבוגרים המטפלים בו – ההורים והגננת. המסמך מפרט עקרונות עבודה בחמישה תחומי פעולה (הגננת וצוות הגן; ילדי הגן; ההורים; שותפי תפקיד ומערך תמיכה; מצבי לחץ, חירום ומשבר), היבטים ניהוליים לשפ\"ח (שיבוץ רציף, רכז גיל רך, \"תיק גן\"), ופרק על איתור והערכה בגיל הרך לפי מודל RTI בשלוש רמות, כולל דגשים לאבחון ילדים צעירים וסקירת כלים לפי קטגוריות. לב המסמך המעשי הוא תכנית עבודה שנתית מחולקת לחמש תקופות (אוגוסט–יוני) ולארבעה צירים (גננת, ליווי התפתחותי, הורים, שותפי תפקיד), עם מועדי ועדות ומוכנות לכיתה א'. פרק אתי מדגיש הסכמת הורים, סודיות כלפי צוות הגן, ריבוי נאמנויות וזהירות מתיוג-יתר. הנספחים כוללים טפסים מוכנים לשימוש: איגרת להורים, טופסי מיפוי, ויתור סודיות, ריאיון הורים, סיכום נתוני מוכנות ותיק גן. הגיל הרך הוא \"חלון הזדמנויות\" למניעה: בהיעדר חסך קיצוני או פגיעה אורגנית חמורה רוב הילדים מתגברים על קשיים מוקדמים, והתערבות מוקדמת מתאימה יכולה לשנות מהלך התפתחות חריגה. נוכחות כמעט כל ילדי 3–6 במערכת הציבורית מאפשרת איתור ותכניות התערבות לאורך שנה עד שלוש. הגישה האקולוגית-מערכתית מחייבת התייחסות בו-זמנית לשלושה תחומים: היבטים התפתחותיים אישיים ובין-אישיים של הילד; מערכת היחסים הורים–גננת; והמדיניות החינוכית (חוזרי מנכ\"ל, נהלים, והאופן שבו הגננת מיישמת אותם). מוקד ההתערבות הוא מערכת היחסים בין הילד למבוגרים המשמעותיים; הפסיכולוג משמש גורם תמיכה מקצועי לכל אחד מהשותפים ומאזן בין צורכי ההורה, הילד והגננת. ל\"התאמה\" (Goodness of fit) בין הילד לאפשרויות ההכלה של סביבתו משקל רב בדפוס ההתמודדות שלו, ולאיכות הקשר גננת–ילד השפעה ארוכת טווח (עד כיתה ח'). העבודה עם הגננת נשענת על מיפוי משותף בתחילת השנה, \"חוזה עבודה\" (מטרות, תכנים, דרכי תקשורת, לוחות זמנים), חזרה למיפוי במהלך השנה ולא רק בסופה, היוועצות שוטפת, ובחירה שנתית של תחום אחד להתערבות מערכתית. הליווי ההתפתחותי של כלל הילדים (מיפוי, איתור, תכנית, מעקב אחר התגובה להתערבות) קודם להערכה פסיכולוגית פרטנית; הערכה מעמיקה נדרשת כשההתקדמות מעטה לאחר בחינת חלופות. מוכנות לכיתה א' אינה סוגיה עצמאית אלא חלק מהליווי ההתפתחותי; הישארות שנה נוספת היא \"תהליך ולא אירוע חד-פעמי\", אפשרות אחת ממכלול מענים, וההמלצה צריכה לשקלל עמדת משפחה, מאפייני הגן ומאפייני המערכת הקולטת. המפגש עם פסיכולוג הגן הוא לרוב המפגש הראשון של ההורים עם השפ\"ח – \"כרטיס הביקור של הפסיכולוגיה החינוכית\"; נדרשים קבלה ותמיכה מוגברים, ליווי בתהליכי הכרה בצרכים מיוחדים והפניה לוועדות, וזהירות מתיוג-יתר שעלול לייצר נבואה המגשימה את עצמה. הערכה בגיל הרך מאורגנת לפי RTI בשלוש רמות (כלל הילדים – קבוצות/פרט בגן – הערכה מעמיקה בכלים סטנדרטיים לצורכי זכאות), ודורשת רגישות לחוויית הילד באבחון, שקילת תוקף ומהימנות, וזהירות בפרשנות כלים ללא נורמות ישראליות. היערכות לחירום בגן מבוססת על שלוש רמות מניעה (קפלן) ועל הבנת האופן הייחודי שבו ילדים צעירים חווים לחץ – דרך תגובת המבוגר, בחשיבה חד-משמעית, בקושי בסיבה-תוצאה ובהשלמת פערי מידע בדמיון. ברמת השפ\"ח: שותפות במדיניות הגיל הרך ברשות, שיבוץ רציף של אותו פסיכולוג באותו גן כמה שנים ובגנים ה\"מזינים\" את בית-הספר שלו, מינוי רכז גיל רך, הכשרה יזומה, ותיעוד שיטתי ב\"תיק גן\". גישה אקולוגית-מערכתית – תפיסה (ברונפנברנר) הרואה בילד חלק ממערכת משפחתית, חינוכית וקהילתית שבין מרכיביה יחסי גומלין והשפעות הדדיות (\"אפקט של אדוות\"). ליווי התפתחותי – מעקב שיטתי ורציף אחר התפתחות כלל ילדי הגן לאורך זמן, הכולל איתור חוזקות וחולשות, מניעה, בניית תכניות ומעקב אחר יעילותן. ס-ק-י-ר-ת התפתחות – שילוב (מי-טל ושר) של הגישה האקולוגית עם המודל הרב-ממדי של לאזרוס: סביבה, קוגניציה (עמדות, תפיסות, כישורים), יחסים בין-אישיים, ביטויי רגשות, תגובות התנהגותיות, והתאמה התפתחותית לשלב. Goodness of fit (התאמה) – מידת ההתאמה בין הילד לאפשרויות ההכלה של סביבתו המשפחתית והחינוכית, המשפיעה על דפוס ההתמודדות שלו גם כשמקור הקושי ביולוגי. חוזה עבודה עם הגננת – הסכמה בתחילת השנה על מטרות, תכנים, דרכי תקשורת ולוחות זמנים, הנבנית מתוך מיפוי משותף של הגן. מיפוי גן – תהליך משותף לגננת ולפסיכולוג למיפוי מאפייני הגן, הצוות והתכניות, ומיפוי כלל הילדים לאיתור מי שזקוק להתייחסות (ייחודי לעבודה בגנים). תיק גן – תיק מתעדכן שנתית המתעד את העבודה המערכתית והפרטנית בגן, ומאפשר רציפות גם כשמתחלף פסיכולוג. RTI – תגובה להתערבות – מודל הערכה מעגלי ודינמי: איתור צרכים, החלטה על התערבות, ניטור התגובה ובדיקה חוזרת, בשלוש רמות עוצמה. מבטים – כלי תצפית של האגף לחינוך קדם-יסודי לגננת, בסביבה הטבעית, בתחומים רגשי-חברתי, תחושתי-מוטורי, שפתי וקוגניטיבי. הערכה מבוססת קריטריונים – כלים להעמקת ההיכרות עם ילדים מאותרים בלבד; לא להעברה גורפת, כדי למנוע מיון-יתר. אקלים גן מיטבי – שישה סטנדרטים לפי חוזר מנכ\"ל (2009) שהפסיכולוג מייעץ לגננת בקידומם. שלוש רמות מניעה (Caplan) – ראשונית (הכנה והיערכות), שניונית (זיהוי והתערבות סמוך לאירוע), שלישונית (הפחתת משקעים לטווח ארוך). שותפי תפקיד – גורמי משרד החינוך (מפקחת, מדריכה פדגוגית, יועצת גיל רך, מתי\"א, גננת שילוב), בריאות, רווחה, הרשות המקומית ועמותות. ריבוי נאמנויות – מחויבות אתית בו-זמנית לילד, להוריו, לגננת, למפקחת ולגורמי הרשות. תיוג-יתר – מתן הגדרה של תסמין להתנהגות שבגיל זה עשויה להעיד על קושי זמני; עלול ליצור נבואה המגשימה את עצמה."}],"tools":[{"id":"first-meeting-school","title":"הפגישה הראשונה עם בית הספר ועם המנהל","domain":"system","sources":["italy2019","englert"],"when":"בכניסה לבית ספר חדש, מקביעת הפגישה הראשונה עם המנהל ועד החודשים הראשונים.","html":"<h4>לפני הפגישה<\/h4>\n<ul>\n<li>לרשום את התחושות שעולות (מבוכה, כעס, רצון לרצות, תחושה של \"ילדה קטנה אל מול מנהלת גדולה\") ולהביא אותן להדרכה כמידע על המערכת, לא רק כ\"לחץ של מתחילים\".<\/li>\n<li>לשאול את עצמך אילו חוויות שלך מבית הספר, כתלמיד/ה וכהורה, נכנסות איתך לפגישה.<\/li>\n<li>לברר מה היה עם הפסיכולוג/ית הקודם/ת ואיך נפרדו. פרידה שלא עובדה מקשה על קשר חדש.<\/li>\n<\/ul>\n<h4>לסמן אירועי \"קבלת פנים\"<\/h4>\n<ul>\n<li>המתנה במזכירות, איחור, ביטול, בלבול בשעה או ביום, דחייה בגלל אירוע דחוף.<\/li>\n<li>אנשים שהצטרפו בלי תכנון, או הפניה לרכזת או ליועצת במקום פגישה עם המנהל.<\/li>\n<li>על כל אירוע לשאול: מה הוא מלמד על היחסים, על המשולשים בהנהלה ועל מה שהמערכת צריכה ממני?<\/li>\n<\/ul>\n<h4>בפגישה<\/h4>\n<ul>\n<li>להתעקש בנועם על פגישה אישית עם המנהל. על עצם קיומה אין גמישות; אם צריך, להיעזר בראש הצוות.<\/li>\n<li>לענות בפשטות על שאלות בסיסיות (היקף שעות, ימי עבודה, דרכי התקשרות), ולשים לב מה הן מבטאות.<\/li>\n<li>לתת למנהל לספר בדרכו לפני איסוף נתוני רקע שיטתי, ולשים לב גם למה שלא מסופר.<\/li>\n<li>אפשר להיעזר ב\"שאלות ממקום אחר\": מהו ההישג שאת/ה גאה בו? מה ממלא אותך? מהו האתגר הגדול שאת/ה עומד/ת בפניו היום?<\/li>\n<\/ul>\n<h4>אחרי<\/h4>\n<ul>\n<li>לבנות רצף של פגישות קבועות. לדעת איטלי: פעם בשבוע, ולא פחות משלוש בשנה (כניסה, אמצע, סיכום).<\/li>\n<li>להחזיק עמדה סקרנית, לא מתגוננת, תוקפנית או מרצה.<\/li>\n<li>להיזהר מ\"לאבחן\" אנשי חינוך כפרסונות. ההבנה הדינמית נועדה להבנה מערכתית, לא לתיוג אישי.<\/li>\n<\/ul>"},{"id":"principal-contract","title":"בניית חוזה עבודה ותוכנית שנתית עם המנהל","domain":"system","sources":["turi_contract","outline_elem","outline_sec"],"when":"בסוף שנת הלימודים לקראת השנה הבאה, ושוב בתחילת השנה, כשמגדירים עם המנהל תחומי התערבות, סדרי עדיפויות ותוכנית עבודה.","html":"<p>החוזה הוא תהליך מתמשך ולא אירוע חד-פעמי. מומלץ להתחיל בסוף השנה, כשיש עוד גמישות בלוחות הזמנים, ולבחון אותו מחדש בתחילת השנה.<\/p>\n<h4>א. נתוני רקע<\/h4>\n<ul>\n<li>סוג המסגרת, אפיוני האוכלוסייה, מספר תלמידים, כיתות ומורים.<\/li>\n<li>הרכב הצוות, בעלי תפקידים, גורמים טיפוליים, חלוקת סמכויות.<\/li>\n<li>מספר שעות העבודה השבועיות שלך.<\/li>\n<\/ul>\n<h4>ב. הערכת צרכים<\/h4>\n<ul>\n<li>מהו החזון, ומהי המשימה המרכזית שנגזרת ממנו? האם יש שונות בצוות או בקרב ההורים בהגדרתה?<\/li>\n<li>מה המנהל והצוות מצפים מהפסיכולוג, ובאיזה סדר עדיפויות? ומה את/ה מצפה לתרום?<\/li>\n<li>אילו משימות מחייב החוק (למשל ועדות)?<\/li>\n<li>אילו פערים יש בין החזון לפרקטיקה ובין תפיסות המשימה של השותפים? מכאן בונים הגדרה משותפת של סדרי העדיפויות.<\/li>\n<\/ul>\n<h4>ג. תוכנית העבודה<\/h4>\n<ul>\n<li>כמה מהשעות לעבודה מערכתית, טיפולית ואבחונית; פריסה שנתית; שותפים לכל משימה.<\/li>\n<li>בשפ\"ח ת\"א-יפו, ביסודי: ליבה לפי חמישה עקרונות (מערכתית, טיפולית עם תלמידים והורים, מניעתית, לפי חוק, צרכים דחופים וחירום). בעל-יסודי: מערכתית, חירום, עבודה ממוקדת בפרט ותחומי חובה שבחוק.<\/li>\n<\/ul>\n<h4>ד. דפוסי עבודה ותנאים<\/h4>\n<ul>\n<li>מועד קבוע לפגישות עם המנהל; צוות רב-מקצועי; נוהלי איתור, הפניה ומעקב.<\/li>\n<li>מה עושים מול \"כיבוי שריפות\", כדי לשמור זמן לעבודה מניעתית?<\/li>\n<li>אבני נגף צפויות, כמו העברה והעברה נגדית.<\/li>\n<li>בקרה: פגישות מעקב לפחות פעמיים בשנה, משוב בסוף השנה, אחראי מענה לנושאים.<\/li>\n<li>תנאים: חדר (גודל, שקט, מקום קבוע); מועדי הפניה לאבחון, כולל המועד האחרון; טופס הפניה של המחנכת כתנאי לתחילת אבחון.<\/li>\n<\/ul>"},{"id":"learning-on-the-move","title":"למידת בית הספר \"תוך כדי תנועה\"","domain":"system","sources":["englert"],"when":"כשנכנסים לבית ספר בלי זמן לאבחון מערכתי מלא, ורוצים ללמוד על המערכת מתוך העבודה השוטפת.","html":"<h4>האם צריך אבחון כולל? (לוי, 2000, אצל אנגלרט)<\/h4>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>אבחון כולל מתאים כש...<\/th>\n<th>שינוי בלי אבחון מקדים מתאים כש...<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>הארגון אינו יודע להגדיר את בעיותיו<\/td>\n<td>הארגון מודע היטב לבעיותיו<\/td>\n<\/tr>\n<tr>\n<td>יש זמן ומשאבים<\/td>\n<td>הארגון במשבר ואין לו משאבים לאבחון<\/td>\n<\/tr>\n<tr>\n<td>מטרות השינוי אינן ברורות או מוסכמות<\/td>\n<td>נבחרו מראש \"פתרונות מדף\"<\/td>\n<\/tr>\n<tr>\n<td>הארגון יציב יחסית<\/td>\n<td>הארגון משתנה מהר (אז לאבחן תוך כדי תנועה)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>ללמוד מתוך הפעולה<\/h4>\n<ul>\n<li>לבחור פעולה שוטפת ומוסכמת (ישיבה, סדנה, ועדה) ולהתייחס אליה גם כמקור מידע. אחרי כל פעולה לרשום אילו מעגלים נוספים היא חשפה.<\/li>\n<li>לקרוא את \"הניירת\": מסמכי חזון, תעודות, מכתבים להורים.<\/li>\n<\/ul>\n<h4>שלוש רמות מידע<\/h4>\n<ol>\n<li>הצהרות: מה מוצהר? מהו הרצוי?<\/li>\n<li>התרחשויות: מה קורה בפועל? מהו המצוי?<\/li>\n<li>פירושים: איך האנשים מפרשים ותופסים?<\/li>\n<\/ol>\n<p>פער בין המוצהר למתרחש או למתפרש הוא כלי אבחון. ממנו נגזרת התערבות לצמצומו, יחד עם המנהל והצוות.<\/p>\n<h4>לפני שנענים לדרישה<\/h4>\n<p>להרחיב את \"טווח ההשהיה\": לשם מה? מהי המטרה? אפשר להגיע אליה בדרך אחרת? מה חסר?<\/p>\n<h4>כשמזהים דפוס בעייתי: ייחוס משמעות חיובית<\/h4>\n<ol>\n<li>לזהות את הדפוס החוזר ואת תפקידו במערכת.<\/li>\n<li>\"לזכות\" את האדם ולהציג את ההיבט החיובי של הדפוס.<\/li>\n<li>להראות את המחיר שהמערכת משלמת עליו.<\/li>\n<li>לחפש יחד חלופות יעילות יותר לאותה מטרה.<\/li>\n<\/ol>"},{"id":"systemic-map","title":"המפה המערכתית ושבעה ממדים לאבחון בית הספר","domain":"system","sources":["fuchs","englert"],"when":"כתבנית להיכרות שיטתית עם בית ספר, שממלאים לאורך השנה מתוך שיחות, תצפיות וקריאת מסמכים.","html":"<h4>ששת רכיבי המפה (פוקס, 1995)<\/h4>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>רכיב<\/th>\n<th>מה בודקים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>אידיאולוגי (במרכז)<\/td>\n<td>חזון ו\"אני מאמין\", מטרות, פילוסופיה חינוכית, מדיניות<\/td>\n<\/tr>\n<tr>\n<td>אנושי<\/td>\n<td>הנהלה, מורים, צוות טיפולי, מנהלה, תלמידים, הורים; וגם פיקוח, רשות, רשת וקהילה<\/td>\n<\/tr>\n<tr>\n<td>פדגוגי<\/td>\n<td>תוכניות ושיטות הוראה, בחינות, חינוך בלתי פורמלי, הערכת לומדים<\/td>\n<\/tr>\n<tr>\n<td>ארגוני<\/td>\n<td>תפקידים וסמכויות, סגנון מנהיגות, מערכת שעות, תקשורת, קבלת החלטות<\/td>\n<\/tr>\n<tr>\n<td>מרחב וחומר<\/td>\n<td>תשתיות, סל שעות, כספי הורים, צוות נוסף, ארגון פיזי<\/td>\n<\/tr>\n<tr>\n<td>מנגנונים<\/td>\n<td>טקסים, טיפול במשמעת, ערוצי דיווח, מנגנוני הערכה ובקרה<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>בודקים גם את יחסי הגומלין: האם החזון משתקף בנהלים ובמשאבים בפועל?<\/p>\n<h4>שבעה ממדים לאבחון תהליכי (טרנטייב)<\/h4>\n<ol>\n<li>קצב ויציבות השגרה: תכנון, גבולות זמן, תגובה לשבירת שגרה, זמן לחשיבה.<\/li>\n<li>תפקוד: הגדרת תפקידים, מעגלי תקשורת, אחריות, איזון בין לימודי ל\"אנושי\".<\/li>\n<li>תחושת מוגנות: איך מבינים מוגנות ופגיעה, למי פונים, מי לוקח אחריות במשבר, הפקת לקחים.<\/li>\n<li>מערכת יחסים: נורמות, מתחים, מנהיגים גלויים ונסתרים, לכידות.<\/li>\n<li>המשגה והבנות משותפות: הנרטיב של בית הספר (עבר, הווה, עתיד), חזון, ציפיות.<\/li>\n<li>מוטיבציה להתפתחות: התאמת ערכים, העשרה, הומור ושמחה, פתיחות להשפעות.<\/li>\n<li>תרבות ואווירה: אסתטיקה, הרגלים, סגנון תקשורת, המנהל כ-public figure, סמלים.<\/li>\n<\/ol>"},{"id":"first-session","title":"הפגישה הראשונה עם מטופל או עם הורים","domain":"therapy","sources":["miller","gantz2016"],"when":"לקראת פגישה ראשונה עם ילד, מתבגר, הורים או איש צוות שמגיעים לטיפול או להדרכה.","html":"<p>הפגישה הראשונה \"נותנת את הטון\". יש בה בו-זמנית הערכה ויצירת מעורבות.<\/p>\n<h4>עקרונות<\/h4>\n<ul>\n<li>להימנע מהנחות מוקדמות על הבעיה, האמונות והמשאלות של הפונה.<\/li>\n<li>לבחור מילים בזהירות.<\/li>\n<li>עמדה ריאלית לגבי מה שאפשר להשיג ולגבי הזמינות שלך.<\/li>\n<li>יחס מכבד ולא שיפוטי לדרכי ההתמודדות של הפונה.<\/li>\n<\/ul>\n<h4>רצף הפגישה<\/h4>\n<ol>\n<li>פתיחה: מי אני, כמה זמן יש לנו, מה מטרת הפגישה (הערכה ראשונית וחשיבה על כיוון), ואם רושמים, למה.<\/li>\n<li>זיהוי הקשיים מוקדם ככל האפשר, במילים של הפונה. לחדד אמירות כלליות: \"אמרת שאתה כל הזמן מדוכא. למה התכוונת? האם יש גם רגעים בהם אתה מרגיש אחרת?\"<\/li>\n<li>איסוף מידע וקישורים: ממתי זה קיים, איך זה משפיע, ומה קרה סמוך להופעת הקושי (אובדן, מעבר, מחלה, פרידה). לזהות גם כוחות ומשאבים, ולנסח מחדש בלי להבטיח הקלה מיידית.<\/li>\n<li>סיכום קצר של ההבנה שלך.<\/li>\n<li>הצעת כיוון (שיטה, תדירות, משך, פרטני או אחר) ושאלה ישירה: \"יש לך שאלות או מחשבות על מה שהצעתי?\" אם אינך המענה המתאים, להפנות.<\/li>\n<\/ol>\n<p>לאורך הפגישה: עמדה ידידותית אך מקצועית, בלי חשיפה עצמית, ותשומת לב לתגובות הלא רצוניות שלך מול בכי או כעס.<\/p>\n<h4>שאלה נוספת בשפ\"ח: מיהו הלקוח?<\/h4>\n<p>התלמיד הוא \"לקוח הקצה\", אבל הורה או מורה שנכנסים לטיפול הם הקליינט. כל אחד מהם הוא \"אדם בתפקיד\", ושני הרבדים, התפקיד והעולם הפנימי, צריכים מקום.<\/p>"},{"id":"therapeutic-contract","title":"החוזה הטיפולי: מרכיבים ושיקולים","domain":"therapy","sources":["kellner2000"],"when":"בסוף שלב ההערכה, על סף תחילת טיפול, וכשחוזרים לחוזה אחרי הפרה או במשבר.","html":"<p>החוזה הוא הסכם עבודה על הכללים המינימליים שהתהליך צריך כדי להתפתח. השאיפה היא לחוזה רציונלי (מותאם לתהליך, הוגן ואתי), לא סמכותי (נוחות המטפל קודמת) ולא דמגוגי (מרצה את המטופל).<\/p>\n<h4>חמשת המרכיבים<\/h4>\n<ol>\n<li>הסדרי תשלום: תעריף, מדיניות לגבי פגישות מוחמצות (להבהיר כבר בחוזה), מועד ואופן תשלום.<\/li>\n<li>הסדרי זמן: תכיפות (מינימום פעם בשבוע), משך של 45-50 דקות, יום ושעה קבועים, הודעה מראש על כל היעדרות צפויה.<\/li>\n<li>סודיות וגבולותיה: התחייבות מפורשת, ציון שיש לה גבולות בחוק (לפרט אם שואלים), ואמירה שאת/ה מתייעץ/ת בעילום שם.<\/li>\n<li>כלל היסוד או עיקרון מנחה חלופי: הסבר על החלק של המטופל בעבודה.<\/li>\n<li>ציון שיש כללי מסגרת נוספים, שיוסברו כשיהיה צורך.<\/li>\n<\/ol>\n<h4>שיקולים<\/h4>\n<ul>\n<li>לא להציף בכל הכללים: חוזה קצר ופשוט, אבל ברור מספיק כדי שאפשר יהיה להסכים לו.<\/li>\n<li>הסכמה בתחילת הדרך אינה תמיד אמיתית. הפרה היא חומר טיפולי: חוזרים לחוזה בפירוש ובשמירת מסגרת, ומרעננים אותו לפי הצורך.<\/li>\n<li>היענות \"נדיבה\" לשינוי זמנים עלולה לזכות בתודה מודעת וב\"ביטויים שליליים מוצפנים\".<\/li>\n<li>מי שאינו מסוגל עדיין לחוזה מלא (משבר, בלבול): \"חוזה ביניים\" בסיסי שיתעדכן.<\/li>\n<\/ul>\n<h4>בשפ\"ח<\/h4>\n<p>הפרק עוסק בפסיכותרפיה פסיכואנליטית ומניח הסדרי תשלום של טיפול פרטי; הוא אינו עוסק בילדים, בהורים או בבית ספר. בשפ\"ח אין תשלום, ומעורבים הורים ובית ספר, אבל העיקרון נשאר: מסגרת ברורה, מדיניות ביטולים מוצהרת, חופשות שנאמרות מראש, סודיות והדרכה, ודיון בהפרות בתוך הטיפול.<\/p>"},{"id":"diagnostic-intervention","title":"שבעת שלבי ההתערבות הדיאגנוסטית","domain":"diag","sources":["sapiryogev"],"when":"בכל תיק אבחון, מהראיון הראשון עם המורה וההורים ועד פגישת המעקב.","html":"<p>האבחון עצמו הוא התערבות: הוא משפיע על הדימוי העצמי של הילד ועל ההורים והמורים. המטרה היא שכולם יצאו מחוזקים, עם תחושת יכולת ותקווה.<\/p>\n<ol>\n<li><strong>שאלות אבחון<\/strong>: לברר בנפרד מה מטריד את המורה, את ההורים ואת הילד, ולגבש איתם שאלות ספציפיות. אין שאלה אבחונית אמיתית? לא לאבחן.<\/li>\n<li><strong>תכנון (\"תפירת חליפה\", לא \"תלבושת אחידה\")<\/strong>: אילו יכולות אני משערת שיהיו נמוכות או גבוהות? באילו כלים אבדוק אותן ואת המצב הרגשי?<\/li>\n<li><strong>מפגש ראשון, בדיקה ראשונית<\/strong>: ראיון עם הילד (איך הוא מבין את הבעיה, חוזקות, מצב חברתי ומשפחתי), הישגים רק אם השאלות מחייבות, ויכולות לפי ההשערות. הילד שותף: \"איך ניגשת לזה? מה עזר לך?\"<\/li>\n<li><strong>מפגש שני, העמקה<\/strong>: מה אושש, מה הופרך, מה נשאר פתוח? להעמיק רק היכן שצריך.<\/li>\n<li><strong>אינטגרציה<\/strong>: לקשור בין הישגים, קוגניציה ורגש, ולנסח את התשובה לשאלות בכמה משפטים (חמישה עד עשרה). זה הגרעין של המשוב והדו\"ח.<\/li>\n<li><strong>משוב כ\"מפגש בין מומחים\"<\/strong>: להציג את ההבנות, לשאול \"איך זה מתיישב עם מה שאת רואה?\", ולבנות יחד דרכי עבודה. לא למסור דו\"ח מודפס בסוף הפגישה. המסר המרכזי: זו תמונת מצב נקודתית, והמצב יכול להשתנות.<\/li>\n<li><strong>דו\"ח ומעקב<\/strong>: לכתוב אחרי המשוב, כולל מה שסוכם ועמדות שונות שעלו; לקבוע במשוב פגישת מעקב (מה עבד, מה לשנות, אילו שאלות חדשות עלו).<\/li>\n<\/ol>"},{"id":"emergency-continuity","title":"פרוטוקול רציפות בחרו\"ם: שלבים וציר זמן","domain":"emerg","sources":["alon2023"],"when":"בהיערכות לחירום בתחילת השנה, וכשמתרחש אירוע חירום שנוגע לבית הספר.","html":"<p>הקו המנחה הוא עשייה, והרגש מגיע אחרי ההתערבות הראשונה. המנהל מוביל ו\"מחזיק את השלם\". הפסיכולוג מסייע לו, תומך \"ליד\" המורים, ונכנס לכיתה בעצמו רק במצב אקוטי מאוד.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>מתי<\/th>\n<th>מה קורה<\/th>\n<th>תפקיד הפסיכולוג<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>לפני האירוע<\/td>\n<td>צל\"ח מוגדר; ערכת חירום (רשימות, עקרונות שיחה לפי גיל, מכתב גנרי להורים)<\/td>\n<td>לעודד היערכות; \"ערכת חירום אישית\"<\/td>\n<\/tr>\n<tr>\n<td>סמוך לאירוע<\/td>\n<td>כינוס צל\"ח בראשות המנהל: הערכת מצב, מעגלי פגיעות, מסרים<\/td>\n<td>מתמחה: קשר עם המדריך; הערכת היקף ותגבור<\/td>\n<\/tr>\n<tr>\n<td>עד 24 שעות, לפני חידוש הלימודים<\/td>\n<td>תדריך לחדר המורים<\/td>\n<td>עקרונות שיח; למורה שמתקשה: מה התנאים שהוא צריך כדי להיכנס לכיתה, ומי יצטרף אליו<\/td>\n<\/tr>\n<tr>\n<td>עם חידוש הלימודים<\/td>\n<td>כל המורים נכנסים לכיתות; התכנסות בהפסקה שאחרי השיעור השני<\/td>\n<td>זיהוי סימנים מדאיגים ומעגלי פגיעות חדשים<\/td>\n<\/tr>\n<tr>\n<td>בטווח המיידי שאחרי האירוע<\/td>\n<td>מכתב מההנהלה להורים<\/td>\n<td>סיוע בניסוח: מה קרה, מה נעשה, מה צפוי<\/td>\n<\/tr>\n<tr>\n<td>יומיים-שלושה מחידוש הלימודים (לפי התרשים)<\/td>\n<td>דיבוב לכיתות בסיכון<\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td>עד שבוע מהאירוע<\/td>\n<td>דיבוב לחדר המורים<\/td>\n<td>לקבוע מראש ולקיים בלי קשר למספר המשתתפים<\/td>\n<\/tr>\n<tr>\n<td>בתום ההתמודדות<\/td>\n<td>למידה והפקת לקחים; בחירת תחום לחיזוק<\/td>\n<td>לעודד את המנהל להוביל<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>בכל כינוס<\/h4>\n<p>משפט קצר על הרגש המשותף, בלי לפתוח שיח רגשי כללי. העיקר עובדות: הן מייצבות ומצמצמות שמועות.<\/p>\n<h4>עם פרט<\/h4>\n<p>לנרמל תגובות, לא לקחת אנמנזה, להצטרף ולהוביל, לחפש נקודת אור, \"להיות עם\".<\/p>\n<h4>שמירה על המתערבים<\/h4>\n<p>התערבות בשניים, גיבוי מדריך, אפשרות החלפה, השתתפות בדיבוב.<\/p>"},{"id":"kindergarten-year","title":"תוכנית עבודה שנתית בגן","domain":"general","sources":["outline_gan"],"when":"לתכנון השנה בגן, מאוגוסט ועד יוני, מול הגננת, ההורים ושותפי התפקיד.","html":"<p>מוקד ההתערבות הוא מערכת היחסים בין הילד למבוגרים המטפלים בו. עקרון-על: בכל התערבות שקשורה לילד מסוים, הסכמת הורים מתועדת (בהורים פרודים, של שניהם).<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>תקופה<\/th>\n<th>מוקד<\/th>\n<th>צעדים מרכזיים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>אוגוסט-אוקטובר<\/td>\n<td>היכרות ומיפוי<\/td>\n<td>לפתוח \"תיק גן\"; חוזה עבודה עם הגננת; איגרת להורים; מיפוי ילדי הגן; נוהלי חירום; הפניות חריגות לשילוב עד סוף ספטמבר<\/td>\n<\/tr>\n<tr>\n<td>נובמבר-דצמבר<\/td>\n<td>איתור ותוכנית<\/td>\n<td>בחירת תחום להתערבות מערכתית; תוכניות לפי RTI; אקלים גן; סדנה להורים<\/td>\n<\/tr>\n<tr>\n<td>ינואר-פברואר<\/td>\n<td>מיקוד בילדים מאותרים<\/td>\n<td>דיון גננת-פסיכולוג-הורים; שאלון למתי\"א ושאלון מוכנות לשפ\"ח עד 1 במרס; הערכות<\/td>\n<\/tr>\n<tr>\n<td>מרס-אפריל<\/td>\n<td>המלצות להמשך<\/td>\n<td>הערכות לחנ\"מ, לשילוב ולמוכנות; מסירת תוצאות; הפניה לוועדת השמה עד אפריל<\/td>\n<\/tr>\n<tr>\n<td>מאי-יוני<\/td>\n<td>מעקב וסיכום<\/td>\n<td>המלצות הישארות עד סוף מאי; סיכום שנתי עם הגננת ותיעוד בתיק הגן<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>RTI בשלוש רמות<\/h4>\n<ol>\n<li>כלל הילדים: מיפוי והתאמות בידי הגננת.<\/li>\n<li>ילדים מאותרים: עזרה ממוקדת בקבוצה קטנה או פרטנית.<\/li>\n<li>קשיים שנמשכים למרות ההתערבות: הערכה מעמיקה, בעיקר לצורך זכאות.<\/li>\n<\/ol>\n<h4>בהערכת ילדי גן<\/h4>\n<p>להתחיל בהיכרות ובמשחק, לעודד מאמץ ולא הצלחה, לאפשר הפסקות, ולהיזהר מתיוג-יתר. הישארות בגן היא תהליך ולא אירוע חד-פעמי.<\/p>"},{"id":"small-class-year","title":"לוח עבודה שנתי בכיתה קטנה","domain":"sped","sources":["tlv_smallclasses"],"when":"כשיש בבית הספר שלך כיתת חינוך מיוחד, מלפני פתיחתה ועד סיכום השנה.","html":"<p>בחוזה עם המנהל: לפחות שעה שבועית קבועה בכיתה. החוזה צריך לשקף גם את האג'נדה של המנהל וגם את האג'נדה המקצועית-טיפולית שלך.<\/p>\n<h4>לפני פתיחת הכיתה<\/h4>\n<ol>\n<li>ישיבה עם המנהל: תכנון הצרכים והצגת הכיתה ביום ההיערכות; לשקול צוות חשיבה וביצוע.<\/li>\n<li>עם קבלת טופס ועדת ההשמה: להזמין וללמוד את התיקים מהמסגרות הקודמות.<\/li>\n<li>מפגש עם מחנכת הכיתה: לוח מפגשים שנתי, הדילמות שלה, ושילובה ושל כיתתה בבית הספר.<\/li>\n<li>ביום ההיערכות: להציג לצוות את אפיוני תלמידי הכיתה.<\/li>\n<li>מפגש של הצוות הטיפולי והמנהל עם מחנכת הכיתה ומחנכות הכיתות המשלבות: צעדי שילוב ומערכת שעות.<\/li>\n<li>איסוף מידע על גורמים טיפוליים חיצוניים (עו\"ס, בריאות הנפש, חונכים).<\/li>\n<\/ol>\n<h4>בחודשים הראשונים<\/h4>\n<ul>\n<li>ליווי המחנכת בבניית התל\"א ובאספקטים הפסיכולוגיים שבה.<\/li>\n<li>השתתפות במפגש ההורים הראשון: הצגה עצמית, סל השירותים, ערוץ זמינות.<\/li>\n<\/ul>\n<h4>בהמשך השנה<\/h4>\n<ul>\n<li>מעקב אחר התל\"א ותוכנית השילוב (מקצועות, ביצוע, התאמות) והשתתפות בישיבות רב-מקצועיות.<\/li>\n<li>ייעוץ לצוות ולהורים; אבחונים לקראת ועדות; פרויקטים לפי צורכי הכיתה.<\/li>\n<\/ul>\n<h4>בסוף השנה<\/h4>\n<ul>\n<li>מפגשי סיכום עם הצוות וההורים ותכנון השנה הבאה.<\/li>\n<li>סיכום העבודה עם הכיתה כמערכת ועם המחנכת.<\/li>\n<\/ul>\n<h4>לשים לב<\/h4>\n<p>האם הכיתה ממוקמת במרכז או בצד? האם המחנכת חלק מחדר המורים ומצוות השכבה? האם יש עבודה משותפת על התל\"א שלוש פעמים בשנה, בשיתוף ההורים?<\/p>"},{"id":"parents-team-meeting","title":"ישיבת צוות והורים בחנ\"מ: צ'קליסט לשיתוף פעולה","domain":"sped","sources":["manor2004","sped_multi"],"when":"לפני ישיבת מעבר (קליטה או פרידה), ישיבת תל\"א או כל ישיבה רב-מקצועית עם הורים, ובמהלכה.","html":"<p>ישיבות מעבר טעונות במיוחד להורים. ההתנהגויות שכאן נמצאו בצוותים שהצליחו, והן אינן דורשות משאבים נוספים.<\/p>\n<h4>לפני<\/h4>\n<ul>\n<li>להכיר את הילד היטב ולהגיע מוכן/ה, כדי להיות פנוי/ה להסתכל על ההורים ולא על הניירות.<\/li>\n<li>להכין את ההורים להשתתפות, לא רק להעביר להם מידע.<\/li>\n<\/ul>\n<h4>במהלך<\/h4>\n<ul>\n<li>פתיחה לבבית; ניהול ממוקד, כל איש מקצוע בתורו, סיום בזמן.<\/li>\n<li>לפתוח בנקודות החוזק ולהצמיד לכל קושי חוזק. לא להסתיר קשיים: להורים יש זכות לשמוע, בדרך לא שיפוטית.<\/li>\n<li>מונחים מקצועיים רק עם הסבר, ולבדוק הבנה במבט ובשאלות.<\/li>\n<li>דוגמאות קונקרטיות מהעבודה עם הילד, ולבקש גם מההורים.<\/li>\n<li>מקום לרגשות ההורים: שאלה ישירה להורה חרד, התייחסות רצינית לכל הערה.<\/li>\n<li>כבוד: הקשבה, טון נינוח, בלי האשמה, גם בין אנשי הצוות עצמם.<\/li>\n<\/ul>\n<h4>בסוף ואחרי<\/h4>\n<ul>\n<li>סיכום קצר של הנושאים.<\/li>\n<li>תיעוד, הפצה למשתתפים ומעקב אחר ההחלטות. לפתוח את המפגש הבא בהחלטות הקודמות.<\/li>\n<\/ul>\n<h4>כלי תצפית (נספח 1)<\/h4>\n<p>לצפות באיש צוות לאורך ישיבה ולספור התנהגויות: הסבר מונחים, סיכום ומעקב, דוגמאות, בדיקת הבנה, שאילת שאלות, שפה חיובית, מומחיות, התמקדות, איזון במבנה הכוח, הגדרת תפקיד ההורה, מרחב לרגשות, כבוד.<\/p>\n<h4>לזכור<\/h4>\n<p>נוכחות של צוות רב-מקצועי אינה מבטיחה שיתוף פעולה. לשים לב לסימני \"הם ואנחנו\" בין ההורים לצוות, כי הילד נפגע כשהם \"נלחמים\".<\/p>"},{"id":"pedagogical-meeting","title":"הקול של הילד בישיבה פדגוגית ובתוכנית התנהגותית","domain":"therapy","sources":["greenwald2012"],"when":"בישיבות פדגוגיות ורב-מקצועיות, וכשאת/ה שותף/ה לבניית תוכנית התנהגותית לתלמיד.","html":"<p>יש שתי עמדות משלימות: חינוכית-הסתגלותית (תפקוד נורמטיבי שנמדד מבחוץ) וטיפולית-רפלקטיבית (המשמעות שהילד נותן לדברים). שינוי באחת אינו מעיד בהכרח על שינוי בשנייה, ולכן כדאי להשמיע בכוונה את הקול הסובייקטיבי.<\/p>\n<h4>שאלות לישיבה פדגוגית<\/h4>\n<ul>\n<li>האם הילד עצמו מוטרד ממצבו התפקודי?<\/li>\n<li>באילו תחומים הוא מרגיש מסוגל, ובאילו הוא חווה קושי?<\/li>\n<li>האם יש לו מוטיבציה לשינוי, ובאיזה תחום?<\/li>\n<li>מהי תפיסת העתיד שלו? למה הוא שואף?<\/li>\n<li>האם הוא מחבר בין התפקוד היום לבין האפשרות לממש את רצונותיו בהמשך?<\/li>\n<\/ul>\n<h4>שאלות לתוכנית התנהגותית<\/h4>\n<ul>\n<li>האם הילד תופס את התוכנית כמסייעת או כמדכאת?<\/li>\n<li>עם אילו חלקים בה הוא מזדהה, ועם אילו פחות?<\/li>\n<li>באיזו מידה הוא מרגיש שותף לעיצובה?<\/li>\n<li>האם השינוי נתפס בעיניו כחלק ממנו או כזר לו?<\/li>\n<li>אילו משימות מוגדרות מתאימות למוטיבציה ולכוחות שלו עכשיו?<\/li>\n<\/ul>\n<h4>לשים לב לעצמך<\/h4>\n<ul>\n<li>הלחץ \"להגיד מה יש לו\" עלול להוביל לשימוש הגנתי באבחנה.<\/li>\n<li>גיוס ל\"קו אחיד\" מול ההורים, או הצטרפות מהירה מדי לאג'נדה של הצוות.<\/li>\n<li>\"זה סודי\": אטימות מוחלטת (\"גבול עבה\") מגבירה פיצול ופנטזיות. \"גבול דק\" מאפשר דיאלוג תוך שמירה על פרטיות.<\/li>\n<li>תזמון: להתערב לפני שהצוות והילד גיבשו עמדה סגורה. אם זה כבר מאוחר, לחפש \"שותף לתקווה\", למשל המנהלת.<\/li>\n<\/ul>"},{"id":"parent-therapy-impasse","title":"טיפול בהורים: כשהפתולוגיה תוקפת את הטיפול","domain":"therapy","sources":["gantz2021"],"when":"כשטיפול או הדרכת הורים נתקעים: ביטולים, איחורים, \"למה אנחנו ולא הילד\", זלזול או איום לעזוב.","html":"<h4>קודם הפשט<\/h4>\n<p>לא כל קושי הוא מתקפה. לבדוק קודם קושי מציאותי, כשל אמפתי שלך, או קושי של המטפל עצמו.<\/p>\n<h4>מנעד המתקפות, מהקל לכואב<\/h4>\n<ol>\n<li>על הסטינג: איחורים וביטולים.<\/li>\n<li>\"מדוע אנחנו ההורים צריכים להגיע ולא הילד?\"<\/li>\n<li>צמצום המרחב הטיפולי.<\/li>\n<li>הפחתת ערך המטפל.<\/li>\n<li>נטישה מוקדמת.<\/li>\n<\/ol>\n<h4>חמשת השלבים<\/h4>\n<ol>\n<li>מתקפה גלויה או סמויה על הטיפול.<\/li>\n<li>המטפל מגיב בכניעה וריצוי, או בהכנעה ושליטה, ומתפתח מאבק (שכנוע, ויכוח, מאבקי כוח, מניפולציות רגשיות, ועד הפסקה תוקפנית של הטיפול).<\/li>\n<li>המתקפה היא לעיתים קרובות ביטוי של הפתולוגיה, והמטפל מלוהק (אנאקטמנט) לדפוס הקשר. זו הזדמנות לעבודה בכאן ועכשיו.<\/li>\n<li>המטפל \"מטפס ראשון למרפסת\" בעזרת \"סולמות\" (תיאוריה, הדרכה, ולפעמים טיפול אישי), ואז מזמין את ההורים להתבונן יחד במה שקורה ביניהם.<\/li>\n<li>זה אינו \"פרומו\" לטיפול. זה הטיפול עצמו.<\/li>\n<\/ol>\n<h4>בפועל<\/h4>\n<ul>\n<li>להשתמש בכעס, בייאוש או בדחף להפסיק כמידע על דפוס הקשר, ולא כהצדקה לפעולה.<\/li>\n<li>להזמין להתבוננות בלי שיפוטיות, בהתמדה, וכשמתאים בהומור.<\/li>\n<li>סטינג כהתערבות: כשמגיע רק הורה אחד, לא לבטל ולא להמשיך כרגיל, אלא לחקור איתו את המשמעות. עם הורים גרושים, לשקול פגישות נפרדות ומפגש משותף שממוקד ב\"גשר בין שני הבתים\".<\/li>\n<li>חשיפה עצמית זהירה (\"אני מרגישה ברורה מאליו\") רק בשירות ההורים.<\/li>\n<li>להביא להדרכה את השאלה \"מה ההתנהגות של הילד מספרת?\" אם קשה לענות, ייתכן שזה מקביל לקושי של ההורים.<\/li>\n<\/ul>"},{"id":"school-personality","title":"האישיות הבית ספרית: מיפוי לפי המודל המבני","domain":"system","sources":["forest2014"],"when":"כשמגיעה הפניה על \"עץ\" אחד ורוצים לראות את \"היער\", או כמסגרת להיכרות שנתית עם בית ספר, רצוי יחד עם המנהל.","html":"<p>הבעיה המוצגת היא לעיתים סימפטום מערכתי. כשהילד \"הבעייתי\" יוצא, אחר תופס את מקומו.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>הבעיה כפי שנראית<\/th>\n<th>קריאה מערכתית אפשרית<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ההורה הנוקשה<\/td>\n<td>מערכת לא גמישה<\/td>\n<\/tr>\n<tr>\n<td>התלמיד הבעייתי<\/td>\n<td>מערכת לא מכילה או חסרת גבולות<\/td>\n<\/tr>\n<tr>\n<td>הכיתה הבלתי מרוסנת<\/td>\n<td>קשיים ביחסים בתוך הצוות<\/td>\n<\/tr>\n<tr>\n<td>המורה המיושן<\/td>\n<td>חוסר מוגנות של הצוות<\/td>\n<\/tr>\n<tr>\n<td>המנהל השתלטן<\/td>\n<td>תחושת איום מבפנים או מבחוץ<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>סופר-אגו: ערכים וחזון<\/h4>\n<ul>\n<li>האם מורה או תלמיד אקראיים יודעים לנקוב בשלושת הערכים המרכזיים? האם החזון \"על הקיר\" בלבד?<\/li>\n<li>האם הערכים עולים בדיוני הצוות ומתבטאים במבנים?<\/li>\n<li>האם הוא מגובש, עמום, מנופח או נוקשה? האם יש ערנות לפערים?<\/li>\n<\/ul>\n<h4>אגו: משימות, מבנים, משאבים<\/h4>\n<ul>\n<li>האם יש מבנים מותאמים למשימות? האם הישיבות מתקיימות ומרגישות משמעותיות?<\/li>\n<li>האם התפקידים מוגדרים? מה הדימוי העצמי של בית הספר? יש גמישות ויצירתיות?<\/li>\n<\/ul>\n<h4>הגנות<\/h4>\n<p>הכחשה, השלכה, השלכה הזדהותית, פיצול, רציונליזציה, הימנעות, אובססיביות, אידאליזציה ודה-ולואציה.<\/p>\n<h4>איד: היסטוריה ודחפים<\/h4>\n<ul>\n<li>מה ההיסטוריה של בית הספר (למשל פיטורי מנהלים)? איזה תלמיד או תופעה \"מקבלים מקום\"?<\/li>\n<li>האם צוותים תקועים בהנחות בסיסיות? יש תהליכים מקבילים לאוכלוסייה שבית הספר משרת?<\/li>\n<\/ul>\n<p>תהליך ההערכה כשלעצמו מחזק את בית הספר, במיוחד כשהוא נעשה יחד עם המנהל והצוות.<\/p>"},{"id":"containing-function","title":"חמשת התנאים לפונקציה מכילה בארגון","domain":"system","sources":["nutkevitch2003","turi_unconscious"],"when":"בעבודה עם הנהלה או צוות שבהם החרדה \"נשפכת\" להאשמות, לפיצולים ולקונפליקטים, כדי לבדוק מה חסר בהחזקה.","html":"<p>את פונקציית ההכלה בארגון ממלא בעל הסמכות; בבית ספר זו ההנהלה. הפסיכולוג עוזר לה לתפקד כ\"מיכל\". כשהתנאים חסרים והמשימה עמומה, מופיעות תגובות הגנתיות.<\/p>\n<h4>חמשת התנאים (Obholzer)<\/h4>\n<ol>\n<li>דיון מתמשך במשימה המרכזית.<\/li>\n<li>מבנה סמכות ברור, כולל מי מחליט בסוף הדיון מהי המשימה.<\/li>\n<li>תקשורת פתוחה בין חלקי הארגון, ופורום קבוע לדיון במה שקורה בו ובקשריו עם מערכות אחרות.<\/li>\n<li>מפגשי צוות סדירים שבהם מדברים גם על רגשות ועל קשיים בעבודה.<\/li>\n<li>תמיכה במנהלים עצמם.<\/li>\n<\/ol>\n<h4>הנהלה כ\"מיכל אמין\" (Stokes)<\/h4>\n<ul>\n<li>עבודה מתמשכת על הבהרת המשימה המרכזית.<\/li>\n<li>הגדרת תפקידים שתואמים אותה.<\/li>\n<\/ul>\n<p>כשההנהלה נתפסת כחלשה, הכעס והקנאה מופנים לחלקים אחרים בארגון ויוצרים קונפליקטים בין אנשים ובין קבוצות.<\/p>\n<h4>הגבולות שהמנהל מחזיק<\/h4>\n<p>משימה, זמן, טריטוריה, חברות (מי שייך), תפקיד, סמכות וקבלת החלטות. הגבולות גם מחזיקים את המנהל, כ\"רשת ביטחון\".<\/p>\n<h4>בפועל<\/h4>\n<ul>\n<li>עבודה עם המנהל על סדר יום, זמני ישיבות, תפקידים ו\"מי מחליט\" אינה \"טכנית\"; זו עבודת הכלה.<\/li>\n<li>כשמנחים פורום, לשמור על גבולות הזמן והמשימה גם תחת לחץ של \"רק עוד קצת\".<\/li>\n<li>נושאים טעונים (אמון, עוינות) לפתוח רק אחרי שנבנתה מסגרת יציבה של מפגשים.<\/li>\n<li>לבדוק איזה מהתנאים חסר, ולהציע לבנות אותו.<\/li>\n<\/ul>"},{"id":"dynamic-formulation","title":"משולש הפורמולציה הדינמית ו\"מבחן ברנום\"","domain":"therapy","sources":["bahat"],"when":"בכתיבת המשגה בדו\"ח אבחון, בסיכום טיפול, בהצגת מקרה או לקראת בחינת הסיום.","html":"<p>ההמשגה היא השערת עבודה שמתפתחת (\"עמוד ענן לפני המחנה\"), לא אבחנה סופית. המשולש עומד על ראשו, והתיאוריה מחברת בין עבר להווה ובין גלוי לסמוי.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>קדקוד<\/th>\n<th>מה בודקים<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>אנמנזה<\/td>\n<td>קונסטיטוציה (טמפרמנט, מגדר, אינטליגנציה, לקויות); סביבה משפחתית; אירועים נסיבתיים; אירועים טראומטיים או מעצבים; הקשר חברתי, תרבותי וכלכלי; יחסי הגומלין ביניהם<\/td>\n<\/tr>\n<tr>\n<td>הווה<\/td>\n<td>הסימפטום (\"בחירתו\" מספרת משהו); ההתנהגות הכוללת, גם במוסד; העברה; העברה נגדית<\/td>\n<\/tr>\n<tr>\n<td>תיאוריה מחברת<\/td>\n<td>מה מחבר בין ה\"למה\" ל\"מה\": מבנה אישיות, יחסי אובייקט מופנמים, הגנות; תיאוריה פורמלית וגם מושגים שעולים מהטיפול<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>מבחן ברנום<\/h4>\n<p>על כל משפט בהמשגה לשאול: האם הוא היה מתאים כמעט לכל מטופל (\"סביבה לא מחזיקה דיה\", \"העדר זולת-עצמי אמפתי\")? אם כן, לחפש את מה שייחודי למטופל הזה.<\/p>\n<h4>לקראת המשגה \"תפורה ביד\"<\/h4>\n<ul>\n<li>לחפש מטאפורות, מילים ודימויים שחוזרים בטיפול. הם יכולים להפוך למושג המארגן.<\/li>\n<li>להשתמש בהתנהגות בטיפול (היעדרויות, כעס, השמצה) ובהעברה הנגדית כמקור מידע.<\/li>\n<li>לא להשמיט פרטי רקע שאינם \"מסתדרים\" עם התיאוריה.<\/li>\n<li>כשהורה אומר \"הייתה ילדות רגילה\", לשאול: \"איזו מין רגילה?\"<\/li>\n<li>לבדוק אם אני כופה תיאוריה אהובה, או שהמקרה \"מקפיץ\" תיאוריה.<\/li>\n<li>לא להשתמש ב\"אי ידיעה\" כתירוץ להימנע מהמשגה.<\/li>\n<\/ul>"},{"id":"school-defenses","title":"מנגנוני הגנה בבית הספר והגנות חברתיות","domain":"system","sources":["turi_unconscious","forest2014","menzies"],"when":"כשנוהל, טקס או דפוס חוזר בבית הספר נראים לא יעילים ועקשניים, כדי לשאול מפני איזו חרדה הם מגנים.","html":"<p>הגנות מערכתיות מרגיעות לזמן קצר, אבל פוגעות בתפקוד ובמשימה.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>הגנה<\/th>\n<th>איך היא נראית בבית הספר<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>הכחשה<\/td>\n<td>ממשיכים לשאוף למצוינות אחרי שהאוכלוסייה השתנתה וצרכיה מורכבים יותר<\/td>\n<\/tr>\n<tr>\n<td>השלכה<\/td>\n<td>\"זה לא אנחנו, זה הם\": הורים, משרד החינוך, העירייה; או איש צוות שמאשים אחר<\/td>\n<\/tr>\n<tr>\n<td>בידול והרחקה<\/td>\n<td>כיתת החנ\"מ מבודלת פיזית וחברתית, ומחנכתה מודרת<\/td>\n<\/tr>\n<tr>\n<td>פיצול<\/td>\n<td>מחנות סביב מנהל חדש; חדר מורים של \"טובים\" ו\"רעים\"<\/td>\n<\/tr>\n<tr>\n<td>רציונליזציה<\/td>\n<td>הסברים אינטלקטואליים מפותלים לכישלונות<\/td>\n<\/tr>\n<tr>\n<td>הימנעות<\/td>\n<td>ישיבות שאינן מתקיימות, צעדים שאינם ננקטים<\/td>\n<\/tr>\n<tr>\n<td>אובססיביות<\/td>\n<td>עיסוק-יתר בפרטים, בנהלים ובבירוקרטיה<\/td>\n<\/tr>\n<tr>\n<td>אידאליזציה ודה-ולואציה<\/td>\n<td>הערכה שהופכת בן רגע לזלזול<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>הגנות מובנות חברתית (מנזיס-לית', שירות סיעוד)<\/h4>\n<p>פיצול הקשר עם המטופל לרשימות משימות; דה-פרסונליזציה וקטגוריזציה; ריחוק והכחשת רגשות; ביצוע טקסי שמבטל החלטות; בדיקות ובדיקות-נגד; חלוקה קולוזיבית של אחריות וחוסר-אחריות; ערפול מכוון בחלוקת האחריות; האצלה כלפי מעלה; אידיאליזציה והערכת חסר של אפשרויות ההתפתחות האישית; הימנעות משינוי. ההגנות האלה מייצרות \"חרדה משנית\" ומקשות על שינוי.<\/p>\n<h4>שאלות לעבודה<\/h4>\n<ul>\n<li>מפני איזו חרדה הנוהל או הדפוס הזה מגן?<\/li>\n<li>האם יש פיצול של \"אחראים\" מול \"חסרי אחריות\" בין דרגים, ואני נמשך/ת לקחת צד?<\/li>\n<li>האם ההפניה אליי משמשת להעברת החרדה והאחריות?<\/li>\n<li>איזה תלמיד, מורה או כיתה נושאים עבור כו
