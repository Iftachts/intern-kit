<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>קיט ההתמחות בפסיכולוגיה חינוכית</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700;800;900&family=Assistant:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: the kit as a Bauhaus-style grid (stages × domains) on cool "white city" paper;
   a calm reading column for summaries; one bold moment = the menu-course headings of the matrix. */
:root{
  --paper:#FFFFFF; --gold:#D29A12; --gold-soft:#FBF1D6; --on-gold:#2A1E00;
  --bg:#F3F6FA; --surface:#FFFFFF; --surface-2:#E8EEF6; --ink:#0F2340; --muted:#51607A; --line:#D2DCE9;
  --accent:#1A4FA0; --accent-soft:#E1EAF7; --on-accent:#FFFFFF;
  --font-ui:"Heebo","Assistant","Segoe UI",Arial,sans-serif; --done:#2C7A4C; --done-soft:#DDEFE4; --warn:#9A5B0B;
  --d-general:#857559; --d-diag:#2B7A76; --d-therapy:#AE4C66; --d-system:#3D5BA5; --d-emerg:#BE4E28; --d-sped:#58873A; --d-community:#8458A4;
  --font-display:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
  --font-body:"Assistant","Segoe UI","Arial Hebrew",Arial,sans-serif;
  --radius:10px; --gutter-l:max(16px, env(safe-area-inset-left, 0px)); --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#F4F4F2; --gold:#F0C04E; --gold-soft:#3A2E10; --on-gold:#1E1600; --bg:#0A1426; --surface:#101D33; --surface-2:#17273F; --ink:#E6ECF5; --muted:#9BAAC2; --line:#22344F;
  --accent:#86B2F2; --accent-soft:#15294A; --on-accent:#0A1426; --done:#6CC08F; --done-soft:#17301F; --warn:#E3B062;
  --d-general:#BCA986; --d-diag:#5DB6AF; --d-therapy:#E08BA2; --d-system:#8FA7E8; --d-emerg:#EE8B63; --d-sped:#96C66F; --d-community:#BE94DB;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#F4F4F2; --gold:#F0C04E; --gold-soft:#3A2E10; --on-gold:#1E1600; --bg:#0A1426; --surface:#101D33; --surface-2:#17273F; --ink:#E6ECF5; --muted:#9BAAC2; --line:#22344F;
  --accent:#86B2F2; --accent-soft:#15294A; --on-accent:#0A1426; --done:#6CC08F; --done-soft:#17301F; --warn:#E3B062;
  --d-general:#BCA986; --d-diag:#5DB6AF; --d-therapy:#E08BA2; --d-system:#8FA7E8; --d-emerg:#EE8B63; --d-sped:#96C66F; --d-community:#BE94DB;
  color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
#app{direction:rtl}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin-inline:auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;line-height:1.2;margin:0}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- header ---------- */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top-in{display:flex;align-items:center;gap:20px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--font-display);font-weight:900;font-size:21px;white-space:nowrap}
.brand svg{flex:none}
.nav{display:flex;gap:2px;flex-wrap:wrap;flex:1;min-width:0}
.nav a{padding:6px 10px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px}
.nav a:hover{color:var(--ink);background:var(--surface-2)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--accent-soft)}
.search{display:flex;min-width:0}
.search input{font:inherit;font-size:15px;width:210px;max-width:100%;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
@media (max-width:820px){
  .top{position:static}
  .top-in{gap:8px}
  .search{order:2;flex:1 1 100%} .search input{width:100%}
  .nav{order:3;flex:1 1 100%;gap:0}
  .nav a{padding:5px 8px;font-size:14px}
}

main{padding-block:28px 56px;min-height:60vh}

/* ---------- generic pieces ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink);text-decoration:none;white-space:nowrap}
.chip .dot,.dot{width:8px;height:8px;border-radius:2px;display:inline-block;flex:none;background:var(--c,var(--muted))}
.tag{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 6px;white-space:nowrap}
.tag.link{border-style:dashed}
.btn{font:inherit;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.is-read{background:var(--done-soft);color:var(--done);border-color:var(--done)}
.readbtn{font:inherit;width:30px;height:30px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:transparent;cursor:pointer;display:grid;place-items:center}
.readbtn:hover{border-color:var(--done)}
.readbtn[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--surface)}
.readbtn svg{width:16px;height:16px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--done);border-radius:3px;transition:width .3s}
@media (prefers-reduced-motion:reduce){.bar > i{transition:none}}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block:40px 14px}
.section-head h2{font-size:26px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
.hero h1{font-size:clamp(34px,5vw,54px);font-weight:900;letter-spacing:-.01em}
.hero .lede{font-size:18px;color:var(--muted);max-width:56ch;margin:12px 0 0}
.orient{max-width:72ch}
.orient h4{display:none}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.progress-panel h2{font-size:20px;margin-bottom:6px}
.big-num{font-family:var(--font-display);font-weight:900;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.prog-rows{display:grid;gap:10px;margin-top:16px}
.prog-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:14px}
.prog-row .bar{grid-column:1/-1}
.prog-row span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.store-note{font-size:13px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.next-up{margin-top:14px;font-size:15px}
.next-up a{font-weight:600}

/* matrix */
.mx-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.matrix{display:grid;grid-template-columns:minmax(118px,.62fr) repeat(3,minmax(0,1fr))}
.matrix > div{border-bottom:1px solid var(--line);padding:12px 14px;min-width:0}
.matrix > div:not(.mx-rowhead):not(.mx-corner){border-inline-start:1px solid var(--line)}
.mx-corner{background:var(--surface-2);font-size:13px;color:var(--muted);display:flex;align-items:flex-end}
.mx-stagehead{background:var(--surface-2);padding-block:16px 12px!important}
.mx-stagehead a{text-decoration:none;color:inherit;display:block}
.mx-stagehead .course{font-family:var(--font-display);font-weight:900;font-size:28px;line-height:1.05;display:block}
.mx-stagehead .yr{font-size:14px;font-weight:600;color:var(--muted)}
.mx-stagehead .bar{margin-top:10px}
.mx-rowhead{display:flex;flex-direction:column;gap:6px}
.mx-rowhead a{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--ink);text-decoration:none}
.mx-rowhead a:hover{color:var(--accent)}
.mx-rowhead .dot{width:11px;height:11px}
.mx-rowhead small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mx-cell ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.mx-cell li{display:flex;gap:7px;align-items:flex-start;font-size:14px;line-height:1.35}
.mx-cell li a{color:var(--ink);text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mx-cell li a:hover{color:var(--accent);text-decoration:underline}
.mx-cell li.linkonly a{color:var(--muted)}
.mx-cell .st{flex:none;width:9px;height:9px;margin-top:4px;border-radius:50%;border:1.5px solid var(--muted)}
.mx-cell li.read .st{background:var(--done);border-color:var(--done)}
.mx-cell .lk{flex:none;font-size:11px;color:var(--muted);margin-top:1px}
.mx-empty{font-size:13px;color:var(--muted)}
.mx-open{font-size:13px;color:var(--warn);font-weight:600}
.mx-res{background:var(--surface-2)}
.mx-res ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.mx-cell[data-stage]::before,.mx-res[data-stage]::before{display:none}
@media (max-width:760px){
  .matrix{display:block}
  .matrix > div{border-inline-start:0!important}
  .mx-corner,.mx-stagehead{display:none}
  .mx-rowhead{background:var(--surface-2);padding-top:14px!important}
  .mx-cell[data-stage]::before,.mx-res[data-stage]::before{display:block;content:attr(data-stage);font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend .st{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);display:inline-block}
.legend .st.on{background:var(--done);border-color:var(--done)}

.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.quick a{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.quick a:hover{border-color:var(--accent)}
.quick b{display:block;font-family:var(--font-display);font-size:20px}
.quick span{font-size:14px;color:var(--muted)}
@media (max-width:900px){.hero{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- year-first ---------- */
.nav .yr-link{color:var(--ink);font-weight:500}
.nav .yr-link b{font-weight:700}
.nav-sep{width:1px;background:var(--line);margin:4px 6px;align-self:stretch}
.home-hero h1{font-size:clamp(34px,5vw,54px);font-weight:900}
.home-hero .lede{font-size:18px;color:var(--muted);max-width:62ch;margin:12px 0 0}
.myyear{display:flex;gap:10px;align-items:center;margin-top:18px;font-size:15px}
.myyear select{font:inherit;font-size:15px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.year-track{display:flex;align-items:stretch;gap:10px;margin-top:26px}
.yt-arrow{align-self:center;font-size:26px;color:var(--muted);flex:none}
.yt-card{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;position:relative}
.yt-card:hover{border-color:var(--accent)}
.yt-card.is-cur{border:2px solid var(--accent);padding:17px 17px 15px}
.yt-yr{font-size:14px;font-weight:700;color:var(--muted)}
.yt-course{font-family:var(--font-display);font-weight:900;font-size:32px;line-height:1.05}
.yt-meta{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.yt-here{position:absolute;top:12px;inset-inline-end:12px;font-size:12px;font-weight:700;color:var(--on-accent);background:var(--accent);border-radius:999px;padding:2px 9px}
@media (max-width:760px){.year-track{flex-direction:column}.yt-arrow{transform:rotate(-90deg)}}
.home-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-top:20px;align-items:start}
@media (max-width:900px){.home-grid{grid-template-columns:1fr}}
.nextup h2{font-size:24px;margin-top:6px}
.nextup h2 a{color:var(--ink);text-decoration:none}
.nextup h2 a:hover{color:var(--accent)}
.nextup .by{color:var(--muted);font-size:15px;margin-top:4px}
.nextup p{font-size:16px;color:var(--muted);max-width:68ch}
.ysw{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:22px;color:var(--muted)}
.ysw a{text-decoration:none;color:var(--muted);font-size:14px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.ysw a b{color:var(--ink)}
.ysw a[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ysw a[aria-current="page"] b{color:var(--bg)}
.year-head{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:end}
@media (max-width:900px){.year-head{grid-template-columns:1fr}}
.panel.before{margin-top:26px;max-width:860px}
.panel.before h2{font-size:22px;margin:4px 0 6px}
.panel.before p{margin:0 0 10px;color:var(--muted)}
.pgroup{margin-top:8px}
.pgroup .group-title{font-family:var(--font-body)}
.glink{font-size:13px;font-weight:500;margin-inline-start:8px}
.path{list-style:none;margin:0;padding:0;display:grid;gap:0;max-width:900px;border-top:1px solid var(--line)}
.prow{display:flex;gap:12px;align-items:flex-start;padding:14px 4px;border-bottom:1px solid var(--line)}
.pnum{flex:none;width:28px;font-family:var(--font-display);font-weight:900;font-size:20px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums;line-height:30px}
.pmain{flex:1;min-width:0}
.ptitle{font-weight:700;font-size:17px;color:var(--ink);text-decoration:none;line-height:1.35}
.ptitle:hover{color:var(--accent);text-decoration:underline}
.prow .by{font-size:14px;color:var(--muted)}
.prow p{margin:6px 0 0;font-size:15px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prow .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.prow.read .ptitle{color:var(--muted)}
.prow.read .pnum{color:var(--done)}
.path.compact{border-top:0}
.path.compact .prow{padding:8px 0}
.ypos{font-size:14px;color:var(--muted);margin-bottom:8px}
.ypos a{font-weight:700;text-decoration:none}

/* ---------- cards / lists ---------- */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;gap:12px;align-items:flex-start;min-width:0}
.card-main{flex:1;min-width:0}
.card h3{font-family:var(--font-body);font-size:17px;font-weight:700;line-height:1.35}
.card h3 a{color:var(--ink);text-decoration:none}
.card h3 a:hover{color:var(--accent);text-decoration:underline}
.card .by{font-size:14px;color:var(--muted);margin-top:2px}
.card p{margin:8px 0 0;font-size:15px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.group-title{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;margin:26px 0 10px}

/* ---------- page heads ---------- */
.pagehead{max-width:820px}
.pagehead h1{font-size:clamp(30px,4.2vw,44px);font-weight:900}
.pagehead .lede{font-size:18px;color:var(--muted);margin:10px 0 0}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

/* ---------- item page ---------- */
.item-layout{display:grid;grid-template-columns:minmax(0,780px) 220px;justify-content:space-between;gap:40px;align-items:start}
.item-toc{position:sticky;top:90px;font-size:14px}
.item-toc b{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em;margin-bottom:8px}
.item-toc button{display:block;width:100%;text-align:start;background:none;border:0;border-inline-start:2px solid var(--line);padding:5px 12px;color:var(--muted);font:inherit;font-size:14px;cursor:pointer}
.item-toc button:hover{color:var(--ink);border-color:var(--accent)}
@media (max-width:980px){.item-layout{grid-template-columns:1fr}.item-toc{display:none}}
.item-head h1{font-size:clamp(28px,4vw,40px);font-weight:900}
.item-head .by{font-size:17px;color:var(--muted);margin-top:8px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.abstract{font-size:18px;line-height:1.8;margin-top:26px;padding:20px 22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);max-width:72ch}
.abstract p{margin:0}
.sec{margin-top:36px;max-width:72ch;scroll-margin-top:90px}
.sec > h2{font-size:24px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.sec > h2 .n{font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.prose{font-size:17px;line-height:1.75}
.prose p{margin:.6em 0}
.prose ul,.prose ol{padding-inline-start:1.4em;margin:.5em 0}
.prose li{margin:.3em 0}
.prose li > ul,.prose li > ol{margin:.2em 0}
.prose h3{font-size:19px;margin:1.5em 0 .4em}
.prose h4{font-size:16px;font-family:var(--font-body);font-weight:700;margin:1.3em 0 .3em}
.prose strong{font-weight:700}
.prose blockquote{margin:.8em 0;padding:.7em 1em;background:var(--surface-2);border-radius:8px;color:var(--muted);font-size:15px}
.prose blockquote p{margin:.2em 0}
.prose code{font-size:.9em}
.tablewrap{overflow-x:auto;margin:.8em 0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.prose table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.5}
.prose th,.prose td{text-align:start;vertical-align:top;padding:.55em .75em;border-bottom:1px solid var(--line)}
.prose th{background:var(--surface-2);font-weight:700}
.prose tr:last-child td{border-bottom:0}
.sec-quotes .prose li,.sec-quotes .prose p{font-family:var(--font-display);font-size:19px;line-height:1.6}
.sec-quotes .prose ul{list-style:none;padding:0}
.sec-quotes .prose li{padding-block:8px;border-bottom:1px solid var(--line)}
details.more{margin-top:28px;max-width:72ch;border-top:1px solid var(--line);padding-top:12px}
details.more summary{cursor:pointer;font-weight:700;font-size:16px;color:var(--muted)}
details.more .prose{font-size:15px}
.cite{margin-top:30px;max-width:72ch;font-size:14px;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
.cite p{margin:0;flex:1}
.linkonly-box{margin-top:24px;max-width:68ch;padding:18px 20px;border:1px dashed var(--line);border-radius:var(--radius);background:var(--surface)}
.linkonly-box p{margin:0 0 10px;font-size:17px}
.related{margin-top:44px;max-width:72ch}
.related h2{font-size:20px;margin-bottom:10px}
.related .row{display:flex;gap:8px;flex-wrap:wrap}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;max-width:72ch;flex-wrap:wrap}
.pager a{font-size:15px;text-decoration:none;max-width:48%}

<script type="application/json" id="kit-data">{"stages":[{"id":"s1","label":"שנה א'","course":"מתאבנים","blurb":"היכרות עם המקצוע, עם השירות ועם הכלים הבסיסיים."},{"id":"s2","label":"שנים ב'-ג'","course":"מנה עיקרית","blurb":"העמקה בטיפול, בעבודה עם הורים ובעבודה המערכתית."},{"id":"s3","label":"שנה ד'","course":"קינוח","blurb":"תיאוריה מעמיקה, אינטגרציה והכנה לבחינת הסיום."}],"domains":[{"id":"general","label":"כללי","long":"זהות מקצועית"},{"id":"diag","label":"אבחון","long":"אבחון פסיכולוגי"},{"id":"therapy","label":"טיפול","long":"טיפול ועבודה עם הורים"},{"id":"system","label":"מערכת","long":"עבודה מערכתית"},{"id":"emerg","label":"חירום","long":"חירום ומשבר"},{"id":"sped","label":"חנ\"מ","long":"חינוך מיוחד"},{"id":"community","label":"קהילה","long":"עבודה קהילתית"}],"items":[{"id":"tene2011","title":"ללמוד להיות פסיכולוג, לגדול להיות פסיכולוג","authors":"צילה טנא","year":"2011","cite":"טנא, צ' (יולי, 2011). ללמוד להיות פסיכולוג, לגדול להיות פסיכולוג. פסיכואקטואליה, 51-53.","url":"https://www.psychology.org.il/sites/psycho/UserContent/files/psycho-actualia/july2011.pdf","kind":"article","desc":null,"urlLabel":"הגיליון המלא של פסיכואקטואליה (PDF), עמ' 51","file":{"orig":"ללמוד להיות פסיכולוג לגדול להיות פסיכולוג צילה טנא.pdf","ext":"pdf","pdf":"tene2011.pdf","pages":3,"bytes":1092684},"placements":[["s1","general"]],"extra":false,"ref":"טנא 2011","inFolder":true,"srcTitle":"ללמוד להיות פסיכולוג – לגדול להיות פסיכולוג","secs":{"abstract":"<p>המאמר נכתב בידי סגנית מנהל שפ\"ח תל אביב-יפו. הוא מתאר את התפתחות הפסיכולוג כתהליך שמתקדם על שני צירים שלובים: למידה וגדילה אישית. המחברת מעדיפה את המושגים האלה על פני \"הכשרה\". לדבריה הפסיכולוגיה איננה רק מיומנות אלא תפיסת עולם ודרך חיים, ולכן הלמידה איננה מסתיימת לעולם. המאמר בנוי מארבעה \"נדבכים\":<\/p>\n<ul>\n<li><strong>ידע תיאורטי<\/strong>: הלימודים האקדמיים הם תשתית הכרחית לבחירות תבוניות בהמשך הדרך.<\/li>\n<li><strong>למידה מתוך התנסות בשדה<\/strong>: הלמידה הזאת כואבת ומתסכלת (בעקבות ביון), ולכן היא מחייבת הדרכה ולמידת עמיתים. תקופת ההתמחות מוצגת כמרחב לצמיחה אישית ולא כאילוץ מנהלי.<\/li>\n<li><strong>התעדכנות מתמדת גם אחרי קבלת המומחיות<\/strong>: תיאוריות חדשות, כלי אבחון וטיפול חדשים, ותופעות חברתיות חדשות כמו משפחות מסוגים חדשים, האינטרנט, אלימות חריגה וחברות מהגרים.<\/li>\n<li><strong>ויתור על ידיעה מוקדמת<\/strong>: זה הנדבך האחרון. המטרה היא התבוננות פתוחה ב\"כאן ועכשיו\", בהשראת ה-Reverie של ביון וה\"שלישי האנליטי\" של אוגדן.<\/li>\n<\/ul>\n<p>לפי המחברת, את העמדה הזאת צריך להפעיל לא רק בטיפול אלא בכל מפגש מקצועי: הדרכתי, אבחוני, ייעוצי ומערכתי. בסיום המאמר המפגש האינטר-סובייקטיבי מוצג כ\"גולת הכותרת\" של הלמידה.<\/p>","ideas":"<ul>\n<li><strong>הכשרת הפסיכולוג מתקדמת על שני צירים, למידה וגדילה אישית.<\/strong> רק שילוב של שניהם יוצר איש מקצוע שיש לו גם ידע ומיומנויות וגם יכולת אמפתית ותפיסת אדם בשלה. \"הכשרה\" מסתיימת כשהאדם \"כשיר\", אבל למידה של פסיכולוג לא מסתיימת אף פעם.<\/li>\n<li><strong>רגישות וסקרנות אינן מספיקות.<\/strong> לימודים אקדמיים הם \"דרישה בלתי מתפשרת\". ההצפה בידע בשנים הראשונות כמעט בלתי נמנעת, אבל ידע רחב הוא הבסיס לבחירה מושכלת בדרכי פירוש ובטכניקות התערבות. בהמשך הפסיכולוג משתמש בכלים באופן סלקטיבי, לפי צורכי הלקוחות ולפי כישוריו ונטיותיו.<\/li>\n<li><strong>למידה משמעותית נשענת על חוויה רגשית.<\/strong> לפי ביון היא נוצרת מהחיבור בין אהבה (L), שנאה (H) וידיעה (K). היא כרוכה תמיד בכאב של ההכרה באי-ידיעה ובתסכול שמלווה את ההיעדר.<\/li>\n<li><strong>הזיקה שלנו לתיאוריות מסוימות איננה רק מדעית.<\/strong> היא מושפעת גם מההיסטוריה האישית והמשפחתית שלנו, מתכונות האישיות שלנו ומתפיסת האדם שגיבשנו.<\/li>\n<li><strong>המפגש בשדה הוא תנאי הכרחי לבדיקת הידע ולהתאמתו.<\/strong> הפרקטיקום הוא \"טבילה\" ראשונה, וההתנסויות שבאות אחריו הן \"חומרי הלמידה הטובים ביותר\".<\/li>\n<li><strong>הדרכה היא מרכיב חיוני<\/strong>, כי הלמידה בשדה כרוכה בתסכול, באי-ידיעה, בתחושות כישלון ובהשלכות של אחרים על הפסיכולוג. המדריך תומך ומקנה ידע, אבל גם משקף, מבקר ומעריך. גם ישיבות צוות וקבוצות הדרכה מפתחות חשיבה ביקורתית ורב-כיוונית.<\/li>\n<li><strong>תקופת ההתמחות איננה רק \"אילוץ אדמיניסטרטיבי-מנהלי\".<\/strong> היא מרחב וזמן להתפתחות אישית. ההבשלה איננה תחומה בזמן, והקצב שלה שונה מאדם לאדם. יש לה השלכות על מידת האינטגרציה בין הידע לשדה ועל מידת הפניות והאמפתיה ללקוחות.<\/li>\n<li><strong>גם המומחה חייב להמשיך ללמוד<\/strong>, משתי סיבות: כדי להעמיק בדברים שלמד בעבר רק ברמה הקוגניטיבית, וכדי לרכוש ידע חדש. התעדכנות איננה רק צבירה. היא כוללת גם התאמה של המוכר לחדש ו\"בריאה\" מקורית של רעיונות דרך קישורים חדשים.<\/li>\n<li><strong>הכלים העיקריים של הפסיכולוג הם התבוננות והקשבה.<\/strong> לכן כדאי לפעמים להניח בצד תיאוריות ופרה-קונספציות ולא \"לקפוץ\" לפירושים. המשמעות צריכה להיווצר \"באמצעותנו, אך לאו-דווקא על-ידינו\".<\/li>\n<li><strong>מושגי ביון ואוגדן נוגעים לכל מפגש מקצועי, לא רק לחדר הטיפול.<\/strong> הפסיכולוג מגיע עם \"רשת\" של מושגים, אבל בלי סטיגמות ודעות קדומות. כל למידה מחודשת כרוכה בוויתור על ידע קיים ובהשלמה עם אי-ידיעה, אף שהיא מעוררת חרדה.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>למידה מול הכשרה<\/strong> – \"הכשרה\" מסתיימת בהיות האדם \"כשיר\" לתפקיד. \"למידה\" ו\"גדילה\" הן תהליך שלא נגמר, ובכל פעם לומדים מחדש את מה שכביכול כבר ידענו, \"ממקום פנימי אחר\".<\/li>\n<li><strong>L, H, K (ביון)<\/strong> – אהבה, שנאה וידיעה: שלושה סוגי חיבור של האישיות לסביבתה. למידה משמעותית נוצרת רק מהחיבור בין שלושתם.<\/li>\n<li><strong>פרקטיקום / \"טבילה\" בשדה<\/strong> – ההתנסות הראשונה בשדה בתחילת הדרך המקצועית. ההתנסויות שאחריה הן חומר הלמידה הטוב ביותר.<\/li>\n<li><strong>הדרכה (Supervision)<\/strong> – ליווי שבו המדריך תומך, מעשיר ומקנה ידע, וגם משקף, מבקר ומעריך.<\/li>\n<li><strong>התעדכנות<\/strong> – חובה מקצועית ללמוד גם אחרי קבלת המומחיות. היא כוללת הוספת ידע וכלים, אבל גם בחינה מחדש של המוכר ויצירת קישורים חדשים.<\/li>\n<li><strong>\"העובדה הנבחרת\" (ביון)<\/strong> – הפירוש או ההבנה. היא לא נובעת בהכרח מקשר מדעי-לוגי, ויכולה להיווצר כהפשטה של חוויה רגשית בו-זמנית.<\/li>\n<li><strong>Reverie (ביון)<\/strong> – מצב של \"שיטוט חשיבתי\": המטפל קשוב למטופל וגם למצבים רגשיים מפוצלים שחלחלו מהמטופל אל עולמו שלו.<\/li>\n<li><strong>\"השלישי האנליטי\" (אוגדן)<\/strong> – הסובייקטיביות המשותפת החדשה שנוצרת בחדר הטיפול. היא הופכת חוויות תוך-אישיות לבין-אישיות, ומנגישה חלקים של המטופל שפוצלו או הודחקו.<\/li>\n<li><strong>\"הזרה\" (אוגדן)<\/strong> – תהליך שבו המטפל עוזר למטופל להסתכל על המוכר \"בעיניים חדשות\" ולהעניק לו משמעות בהתבוננות משותפת.<\/li>\n<li><strong>ויתור על הידיעה המוקדמת<\/strong> – נכונות להניח בצד תיאוריות ופרה-קונספציות ולשהות באי-ידיעה, למרות החרדה, כדי לאפשר \"התבוננות צרופה\".<\/li>\n<\/ul>","models":"<p><strong>ארבעת הנדבכים בלמידת הפסיכולוג<\/strong> (כל פרק נפתח במוטו):<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>פרק<\/th>\n<th>הנדבך<\/th>\n<th>מוטו<\/th>\n<th>עיקר התוכן<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>א'<\/td>\n<td>התשתית הראשונית – ידע תיאורטי<\/td>\n<td>\"אין חכם בלי ספרים. חכם בלי ספרים כמוהו כאמן בלי כלים\"<\/td>\n<td><strong>בתואר הראשון<\/strong>: תהליכים התפתחותיים נורמטיביים ופתולוגיים; תורשה וסביבה; אישיות ולמידה; הפרט והקבוצה. <strong>בתואר השני<\/strong>: מקצועות ליבה בתחום ההתמחות והקניה שיטתית של כלי אבחון וטיפול.<\/td>\n<\/tr>\n<tr>\n<td>ב'<\/td>\n<td>למידה תוך כדי התנסות<\/td>\n<td>\"הניסיון הוא יועץ משכיל; הניסיון הוא אבי המדע\"<\/td>\n<td>למידה חווייתית (סנג'י, ביון); מפגש בשדה; פרקטיקום; הדרכה ולמידת עמיתים; ההתמחות כמרחב לצמיחה אישית.<\/td>\n<\/tr>\n<tr>\n<td>ג'<\/td>\n<td>התעדכנות תמידית בידע – מחובותיו של איש המקצוע<\/td>\n<td>\"המפסיק ללמוד – כמפסיק לשחות. זרם הנהר יחזירו לאחור\"<\/td>\n<td>למידה אחרי קבלת המומחיות: להעמיק בישן ולרכוש את החדש (ראו רשימה בהמשך).<\/td>\n<\/tr>\n<tr>\n<td>ד'<\/td>\n<td>הנדבך האחרון – ויתור על הידיעה המוקדמת לצורך התבוננות צרופה<\/td>\n<td>\"תכלית הידיעה – שנדע שלא נדע\"<\/td>\n<td>התבוננות והקשבה ב\"כאן ועכשיו\"; Reverie; השלישי האנליטי; יישום בכל מפגש מקצועי.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>תחומי ההתעדכנות הנדרשים (פרק ג'):<\/strong><\/p>\n<ol>\n<li>תיאוריות חדשות שמסבירות אחרת תופעות נורמטיביות ופתולוגיות בהתפתחות האישיות.<\/li>\n<li>כלים וטכניקות חדשים:\n        - <strong>באבחון<\/strong>: הערכה של פרטים, קבוצות ומערכות. כלי האבחון מתעדכנים כל כמה שנים, ולכן נדרשים למידה מחודשת ואימון ממושך.\n        - <strong>בטיפול<\/strong>: דרכים לא קונבנציונליות, לפעמים מהירות יותר, שמשתמשות בטכנולוגיות חדשות.<\/li>\n<li>תופעות חברתיות חדשות:\n        - משפחות חדשות: חד-מיניות, חד-הוריות, ילדי פונדקאות, הפריה חוץ-גופית ו\"תרומת\" זרע.\n        - האינטרנט והתקשורת הווירטואלית, שמחייבים ללמוד מחדש את צורכי ההתקשרות של האדם, ו\"פותחים\" דרכי טיפול חדשות.\n        - אלימות חריגה, רצח בתוך המשפחה, חברות מהגרים וחברות שוליים.<\/li>\n<li>התאמה לשינויים תרבותיים, למשל טכניקות טיפול קצרות מועד ושיטות אבחון מבוססות ראיות (data based). המחברת מצטטת את הרב קוק: \"בכל דור-ודור צריך ללמוד את דרכי השימוש בכלים המשפיעים על הדור\".<\/li>\n<\/ol>\n<p><strong>הסיכום (\"סוף-דבר\"): ארבעת הרכיבים ותפקידם<\/strong><\/p>\n<ul>\n<li><strong>הידע המוקדם<\/strong> – \"תשתית ראשונית הכרחית\", עולם רחב של מושגים והסברים אפשריים.<\/li>\n<li><strong>ההתנסות<\/strong> – כר לאימון מיומנויות וליישום הידע, תוך בחינה של המקום, הכישורים, הנטיות והבחירות של הפסיכולוג. זה קורה בליווי צמוד של הדרכה ולמידת עמיתים.<\/li>\n<li><strong>ההתעדכנות בידע חדש<\/strong> – שומרת על הרלוונטיות של הידע וההתנסות בהבנת תופעות חדשות.<\/li>\n<li><strong>המפגש האינטר-סובייקטיבי<\/strong> – \"גולת-הכותרת\" של הלמידה, שמאפשרת להמשיך לגדול ולצמוח.<\/li>\n<\/ul>","practice":"<ul>\n<li><strong>להתייחס לשנות ההתמחות כמרחב לצמיחה אישית ולא רק כמכסת שעות.<\/strong> כדאי לשאול באופן קבוע מה השתנה בתפיסה האישית, ולא רק אילו דרישות פורמליות כבר מולאו.<\/li>\n<li><strong>להביא להדרכה לא רק \"מקרים\"<\/strong>, אלא גם רגעים של אי-ידיעה, תחושות כישלון והשלכות של אחרים: הורים, צוותים ומנהלים. כדאי לזכור שההדרכה כוללת גם ביקורת והערכה, ולהשתמש בשני הצדדים שלה.<\/li>\n<li><strong>לנצל את ישיבות הצוות ואת קבוצות ההדרכה<\/strong> לפיתוח חשיבה ביקורתית ורב-כיוונית, ולא להסתפק בהדרכה האישית.<\/li>\n<li><strong>לבחון את הזיקה האישית לתיאוריות.<\/strong> ממה נובעת המשיכה לגישה מסוימת? האם היא מסבירה טוב יותר, או שהיא קשורה לחוויות ולאישיות שלי?<\/li>\n<li><strong>לבנות תוכנית התעדכנות אישית.<\/strong> למשל: לימוד ואימון בגרסאות חדשות של כלי אבחון, היכרות עם מבנים משפחתיים חדשים ועם השפעות העולם הווירטואלי, ושיטות קצרות מועד ומבוססות ראיות.<\/li>\n<li><strong>להגיע לכל מפגש, טיפולי או לא, עם \"רשת\" מושגית אבל בלי פרה-קונספציות.<\/strong> זה כולל ישיבה בבית ספר, פגישת הורים, אבחון והתייעצות. כדאי לדחות פירוש ומסקנה ולתת למשמעות להיווצר במפגש.<\/li>\n<li><strong>להשתמש בתגובות הרגשיות שלי במפגש (Reverie) כמידע<\/strong> על מה שמתרחש אצל המטופל או אצל המערכת, ולא רק כהפרעה.<\/li>\n<li><strong>לזהות את הדחף ל\"ידיעה חפוזה\" שנובע מחרדה.<\/strong> האנלוגיה במאמר היא לאם שממהרת לזהות את צורכי התינוק ומזהה בעצם את ההשלכות שלה. כדאי לעזור גם למטופל או לצוות להסתכל על המוכר \"בעיניים חדשות\".<\/li>\n<\/ul>","questions":"<ol>\n<li>לאילו תיאוריות אני מתחבר/ת יותר, ומה בהיסטוריה האישית או בתפיסת האדם שלי עשוי להסביר את הבחירה?<\/li>\n<li>מתי לאחרונה \"קפצתי\" לפירוש או למסקנה, באבחון, בישיבת צוות או בפגישת הורים? מה היה קורה אילו נשארתי עוד קצת באי-ידיעה?<\/li>\n<li>איך אני חווה את השילוב בהדרכה בין הצד התומך לצד המעריך והביקורתי? מה מקל עליי להביא להדרכה גם כישלונות?<\/li>\n<li>איזו תופעה חברתית חדשה במערכות שבהן אני עובד/ת מחייבת אותי ללמוד מחדש, ואיך אעשה זאת?<\/li>\n<li>איך אפשר להחיל את מושגי ה-Reverie וה\"שלישי האנליטי\" על מפגש מערכתי שאיננו טיפולי במוצהר, למשל התייעצות עם מחנכת?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"הלמידה של פסיכולוג, בעצם, אינה מסתיימת אף פעם ובכל פעם הוא לומד מחדש את אשר ידע כביכול כבר קודם-לכן, ממקום פנימי אחר ומתוך חוויית המפגשים הייחודיים הנקרים בדרכו המקצועית והאישית.\" (עמ' 51)<\/li>\n<li>\"המדריך מהווה בעבורו דמות מלווה ותומכת, מעשירה ומקנה ידע אך גם משקפת, ביקורתית ומעריכה.\" (עמ' 52)<\/li>\n<li>\"גורם הזמן נתפס בדרך-כלל על-ידי המתמחים כאילוץ אדמיניסטרטיבי-מנהלי המתחייב בחוק ותו-לא, אלא שלא כך הדבר בכל הקשור ללמידה של הדיסציפלינה המיוחדת שלנו.\" (עמ' 52)<\/li>\n<li>\"בכל למידה מחודשת קיים ויתור על ידע קיים, בכל מפגש מחודש יש קבלה של אי הידיעה למרות החרדה שהדבר מעורר בנו לפרקים והקושי 'לשהות' במקום זה.\" (עמ' 53)<\/li>\n<\/ul>"},"level":"שנה א' (רלוונטי לאורך כל ההתמחות ואחריה)","stype":"מאמר (מאמר עמדה קצר, שלושה עמודים, עם רשימת מקורות)","tldr":"המאמר נכתב בידי סגנית מנהל שפ\"ח תל אביב-יפו. הוא מתאר את התפתחות הפסיכולוג כתהליך שמתקדם על שני צירים שלובים: למידה וגדילה אישית. המחברת מעדיפה את המושגים האלה על פני \"הכשרה\". לדבריה הפסיכולוגיה איננה רק מיומנות אלא תפיסת עולם ודרך חיים, ולכן הלמידה…","search":"המאמר נכתב בידי סגנית מנהל שפ\"ח תל אביב-יפו. הוא מתאר את התפתחות הפסיכולוג כתהליך שמתקדם על שני צירים שלובים: למידה וגדילה אישית. המחברת מעדיפה את המושגים האלה על פני \"הכשרה\". לדבריה הפסיכולוגיה איננה רק מיומנות אלא תפיסת עולם ודרך חיים, ולכן הלמידה איננה מסתיימת לעולם. המאמר בנוי מארבעה \"נדבכים\": ידע תיאורטי: הלימודים האקדמיים הם תשתית הכרחית לבחירות תבוניות בהמשך הדרך. למידה מתוך התנסות בשדה: הלמידה הזאת כואבת ומתסכלת (בעקבות ביון), ולכן היא מחייבת הדרכה ולמידת עמיתים. תקופת ההתמחות מוצגת כמרחב לצמיחה אישית ולא כאילוץ מנהלי. התעדכנות מתמדת גם אחרי קבלת המומחיות: תיאוריות חדשות, כלי אבחון וטיפול חדשים, ותופעות חברתיות חדשות כמו משפחות מסוגים חדשים, האינטרנט, אלימות חריגה וחברות מהגרים. ויתור על ידיעה מוקדמת: זה הנדבך האחרון. המטרה היא התבוננות פתוחה ב\"כאן ועכשיו\", בהשראת ה-Reverie של ביון וה\"שלישי האנליטי\" של אוגדן. לפי המחברת, את העמדה הזאת צריך להפעיל לא רק בטיפול אלא בכל מפגש מקצועי: הדרכתי, אבחוני, ייעוצי ומערכתי. בסיום המאמר המפגש האינטר-סובייקטיבי מוצג כ\"גולת הכותרת\" של הלמידה. הכשרת הפסיכולוג מתקדמת על שני צירים, למידה וגדילה אישית. רק שילוב של שניהם יוצר איש מקצוע שיש לו גם ידע ומיומנויות וגם יכולת אמפתית ותפיסת אדם בשלה. \"הכשרה\" מסתיימת כשהאדם \"כשיר\", אבל למידה של פסיכולוג לא מסתיימת אף פעם. רגישות וסקרנות אינן מספיקות. לימודים אקדמיים הם \"דרישה בלתי מתפשרת\". ההצפה בידע בשנים הראשונות כמעט בלתי נמנעת, אבל ידע רחב הוא הבסיס לבחירה מושכלת בדרכי פירוש ובטכניקות התערבות. בהמשך הפסיכולוג משתמש בכלים באופן סלקטיבי, לפי צורכי הלקוחות ולפי כישוריו ונטיותיו. למידה משמעותית נשענת על חוויה רגשית. לפי ביון היא נוצרת מהחיבור בין אהבה (L), שנאה (H) וידיעה (K). היא כרוכה תמיד בכאב של ההכרה באי-ידיעה ובתסכול שמלווה את ההיעדר. הזיקה שלנו לתיאוריות מסוימות איננה רק מדעית. היא מושפעת גם מההיסטוריה האישית והמשפחתית שלנו, מתכונות האישיות שלנו ומתפיסת האדם שגיבשנו. המפגש בשדה הוא תנאי הכרחי לבדיקת הידע ולהתאמתו. הפרקטיקום הוא \"טבילה\" ראשונה, וההתנסויות שבאות אחריו הן \"חומרי הלמידה הטובים ביותר\". הדרכה היא מרכיב חיוני, כי הלמידה בשדה כרוכה בתסכול, באי-ידיעה, בתחושות כישלון ובהשלכות של אחרים על הפסיכולוג. המדריך תומך ומקנה ידע, אבל גם משקף, מבקר ומעריך. גם ישיבות צוות וקבוצות הדרכה מפתחות חשיבה ביקורתית ורב-כיוונית. תקופת ההתמחות איננה רק \"אילוץ אדמיניסטרטיבי-מנהלי\". היא מרחב וזמן להתפתחות אישית. ההבשלה איננה תחומה בזמן, והקצב שלה שונה מאדם לאדם. יש לה השלכות על מידת האינטגרציה בין הידע לשדה ועל מידת הפניות והאמפתיה ללקוחות. גם המומחה חייב להמשיך ללמוד, משתי סיבות: כדי להעמיק בדברים שלמד בעבר רק ברמה הקוגניטיבית, וכדי לרכוש ידע חדש. התעדכנות איננה רק צבירה. היא כוללת גם התאמה של המוכר לחדש ו\"בריאה\" מקורית של רעיונות דרך קישורים חדשים. הכלים העיקריים של הפסיכולוג הם התבוננות והקשבה. לכן כדאי לפעמים להניח בצד תיאוריות ופרה-קונספציות ולא \"לקפוץ\" לפירושים. המשמעות צריכה להיווצר \"באמצעותנו, אך לאו-דווקא על-ידינו\". מושגי ביון ואוגדן נוגעים לכל מפגש מקצועי, לא רק לחדר הטיפול. הפסיכולוג מגיע עם \"רשת\" של מושגים, אבל בלי סטיגמות ודעות קדומות. כל למידה מחודשת כרוכה בוויתור על ידע קיים ובהשלמה עם אי-ידיעה, אף שהיא מעוררת חרדה. למידה מול הכשרה – \"הכשרה\" מסתיימת בהיות האדם \"כשיר\" לתפקיד. \"למידה\" ו\"גדילה\" הן תהליך שלא נגמר, ובכל פעם לומדים מחדש את מה שכביכול כבר ידענו, \"ממקום פנימי אחר\". L, H, K (ביון) – אהבה, שנאה וידיעה: שלושה סוגי חיבור של האישיות לסביבתה. למידה משמעותית נוצרת רק מהחיבור בין שלושתם. פרקטיקום / \"טבילה\" בשדה – ההתנסות הראשונה בשדה בתחילת הדרך המקצועית. ההתנסויות שאחריה הן חומר הלמידה הטוב ביותר. הדרכה (Supervision) – ליווי שבו המדריך תומך, מעשיר ומקנה ידע, וגם משקף, מבקר ומעריך. התעדכנות – חובה מקצועית ללמוד גם אחרי קבלת המומחיות. היא כוללת הוספת ידע וכלים, אבל גם בחינה מחדש של המוכר ויצירת קישורים חדשים. \"העובדה הנבחרת\" (ביון) – הפירוש או ההבנה. היא לא נובעת בהכרח מקשר מדעי-לוגי, ויכולה להיווצר כהפשטה של חוויה רגשית בו-זמנית. Reverie (ביון) – מצב של \"שיטוט חשיבתי\": המטפל קשוב למטופל וגם למצבים רגשיים מפוצלים שחלחלו מהמטופל אל עולמו שלו. \"השלישי האנליטי\" (אוגדן) – הסובייקטיביות המשותפת החדשה שנוצרת בחדר הטיפול. היא הופכת חוויות תוך-אישיות לבין-אישיות, ומנגישה חלקים של המטופל שפוצלו או הודחקו. \"הזרה\" (אוגדן) – תהליך שבו המטפל עוזר למטופל להסתכל על המוכר \"בעיניים חדשות\" ולהעניק לו משמעות בהתבוננות משותפת. ויתור על הידיעה המוקדמת – נכונות להניח בצד תיאוריות ופרה-קונספציות ולשהות באי-ידיעה, למרות החרדה, כדי לאפשר \"התבוננות צרופה\"."},{"id":"kochavi2018","title":"על שחיינים, צוללנים ומה שביניהם","authors":"הילי כוכבי","year":"2018","cite":"כוכבי, ה' (20 במרץ 2018). על שחיינים, צוללנים ומה שביניהם: התבוננות אינטגרטיבית על יופיו ועל מורכבותו של מקצוע הפסיכולוגיה החינוכית. פסיכולוגיה עברית.","url":"https://www.hebpsy.net/articles.asp?id=3665","kind":"article","desc":null,"urlLabel":"המאמר באתר פסיכולוגיה עברית","file":{"orig":"hebpsy.net-על שחיינים צוללנים ומה שביניהם התבוננות אינטגרטיבית על..pdf","ext":"pdf","pdf":"kochavi2018.pdf","pages":14,"bytes":159423},"placements":[["s1","general"]],"extra":false,"ref":"כוכבי 2018","inFolder":true,"srcTitle":"על שחיינים, צוללנים ומה שביניהם: התבוננות על יופיו ועל מורכבותו של מקצוע הפסיכולוגיה החינוכית","secs":{"abstract":"<p>המאמר נפתח בדיון סוער שהתנהל ב-2017 בקבוצת הפייסבוק של הפסיכולוגים החינוכיים, בעקבות השיר \"הכול\" של שימבורסקה, על השאלה אם ריבוי התחומים במקצוע הוא \"היבריס\" ו\"תפסת מרובה לא תפסת\" או דווקא ליבת הייחוד שלו. כוכבי בוחרת שבעה מאפיינים מרכזיים של המקצוע ובוחנת אותם: ראייה רחבה ואינטגרטיבית (\"לנצח על התזמורת\"), עבודה מערכתית (\"לא חייבים לכנס עשרה אנשים בחדר\"), רוחב היריעה ומגוון התחומים, קידום בריאות נפשית ומניעה, גמישות, יצירתיות ומרחב להתפתחות אישית, ו\"גאוות יחידה\" ויוקרה מקצועית. המטאפורה המרכזית היא של \"שחיינים\" מול \"צוללנים\": השחיין אינו היפוכו של הצוללן ואינו פחות מקצועי ממנו, אלא בעל מיומנות אחרת. \"רחב\" אינו \"שטחי\". מול הסכנות התאומות של בינוניות וגרנדיוזיות היא מציעה \"נוסחה\" של צניעות מקצועית לצד חתירה למצוינות. המאמר משלב תיאורי מקרים (יונתן, מנהלת התיכון, הנערה שיר), את קריאתם של Kazdin &amp; Blase להעביר את הפסיכולוגיה לעבר מניעה ועבודה ב\"סטינג\" יומיומי, ונקודות ציון בהתמקצעות התחום בישראל: תיקון החוק ב-2010, האקדמיזציה ודרישות הקבלה להתמחות מ-2015.<\/p>","ideas":"<ul>\n<li><strong>ראייה רחבה ואינטגרטיבית היא נכס מרכזי<\/strong>: הפסיכולוג החינוכי מחזיק בו-זמנית את העולם הפנימי של הילד ואת מציאות חייו החיצונית, ומושך \"בחוטים רבים בו-זמנית\". מכאן גם תפקידו כ\"מנהל המקרה\", המתאם בין אנשי מקצוע, הורים ומורים.<\/li>\n<li><strong>עבודה מערכתית היא קודם כול צורת חשיבה, לא לוגיסטיקה<\/strong>: אין צורך לכנס ישיבות רבות משתתפים. כל שיחה עם מנהל על מהות עבודתו היא עבודה מערכתית, ושיחות \"בגובה העיניים\" עם מנהלת יכולות לשנות את האקלים בבית הספר כולו.<\/li>\n<li><strong>\"אין ילד ללא מערכת\"<\/strong>: כמו ש\"אין תינוק ללא אם\" (ויניקוט), ילד שייך להוריו, למשפחתו, לבית הספר ולקהילה. לכן ההכלה וההתכווננות המלאה של הטיפול במבוגרים אינן אפשריות כשמדובר בילד. טיפול שמתנתק מהמערכות, ובראשן מההורים, עלול שלא להועיל ואף להזיק.<\/li>\n<li><strong>פעמים רבות טובת הילד מושגת ללא מעורבות ישירה איתו<\/strong>: עבודה עם המחנכת, היועצת, המנהלת ועם ההורים עשויה לקדם את רווחתו יותר מטיפול ישיר. זו הסיבה שהפסיכולוג החינוכי, ולא יועץ ארגוני חיצוני, מופקד על העבודה המערכתית: הוא אמון על בריאותם הנפשית של הילדים בארגון, ולא על \"בריאות הארגון\".<\/li>\n<li><strong>\"רחב\" אינו \"שטחי\"<\/strong>: לפי ניתוח מילוני, ההפך מ\"עמוק\" הוא \"שטחי\", אבל \"רחב\" פירושו מקיף, מלא ועשיר. השחיין והצוללן הם שני מקצועות שונים, ואף אחד מהם אינו נחות מהשני.<\/li>\n<li><strong>בינוניות וגרנדיוזיות הן שני צדדים של אותו מטבע<\/strong>: התשובה לשתיהן היא צניעות מקצועית (הכרה בגבולות הידע, התייעצות, הפניה ועבודה בשיתוף עם \"צוללנים\") יחד עם חתירה מתמדת למצוינות (הדרכה, השתלמויות, קריאה, סקרנות).<\/li>\n<li><strong>עקומת למידה ארוכה אינה בינוניות<\/strong>: ריבוי הדרישות מאריך את הזמן שנדרש כדי להגיע לרמה מקצועית גבוהה, וזו אחת הסיבות שקשה לסיים את ההתמחות בארבע שנים.<\/li>\n<li><strong>מקצועיות נבחנת לאור מטרת המקצוע, קידום רווחה נפשית באוכלוסייה<\/strong>: בדומה לרפואה מונעת, עיקר העיסוק הוא קידום בריאות, מניעה ואיתור מוקדם, וכן העברת ידע וחשיבה פסיכולוגית למנהלים, יועצות, מורים וגננות. גם כשאי אפשר למדוד את ההשפעה ישירות (כמו אחות שמחסנת), היא משמעותית.<\/li>\n<li><strong>גמישות היא יתרון וגם אתגר<\/strong>: המעבר בין סביבות ולקוחות מאפשר להגיע לרבים ומגן מפני שחיקה, אבל מעורר דילמות גבולות (למשל מורה שמתייעצת על ילדה הפרטי, או הזמנה לבת מצווה). אין לכך נוסחה, ויש לשמור על מודעות ועל מרחב בחירה.<\/li>\n<li><strong>\"גאוות יחידה\" נבנית מגורמים פנימיים וחיצוניים<\/strong>: לפי המחברת, המקצוע \"יצא מהארון\" בעשור האחרון בזכות תיקון החוק (2010), האקדמיזציה והעלאת דרישות הקבלה להתמחות (2015).<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>שחיינים / צוללנים<\/strong>: מטפורה לשני סוגי מומחיות. הצוללן יורד לעומק בתחום צר, השחיין שוחה למרחקים ומקשר ומחבר בין אירועים ומצבים \"על פני השטח, קרוב למציאות\". הפסיכולוגים החינוכיים הם בראש ובראשונה שחיינים, ורבים מהם הופכים עם הזמן גם לצוללנים.<\/li>\n<li><strong>\"לנצח על התזמורת\" / ניהול מקרה (מנהלי תיקים)<\/strong>: תיאום וויסות בין אנשי המקצוע, ההורים, המורים וכל מי שיכול לסייע לרווחת הילד.<\/li>\n<li><strong>\"אין ילד ללא מערכת\"<\/strong>: עיקרון המקביל ל\"אין תינוק ללא אם\" של ויניקוט. הילד לעולם שייך למערכות שעוטפות אותו.<\/li>\n<li><strong>עבודה מערכתית<\/strong>: בראש ובראשונה צורת חשיבה שמתפתחת בהדרגה. היא יכולה להתקיים בשיחה שקטה אחד על אחד ואינה מחייבת לוגיסטיקה מורכבת.<\/li>\n<li><strong>חשיבה מערכתית בטיפול \"פרטני\"<\/strong>: שילוב ההורים בטיפול במתבגר (פגישות הורים מדי כמה שבועות ופגישות משותפות לפי הצורך), בלי לבטל את הפרטיות והסודיות.<\/li>\n<li><strong>רחב לעומת שטחי<\/strong>: הבחנה מילונית (מילון ספיר). \"רחב\" פירושו מכיל פרטים רבים, מקיף ועשיר, ואינו היפוכו של \"עמוק\".<\/li>\n<li><strong>צניעות מקצועית ומצוינות<\/strong>: \"הנוסחה\" שמוצעת מול סכנת הבינוניות וסכנת ההיבריס.<\/li>\n<li><strong>קידום בריאות נפשית / מניעה<\/strong>: עיקר העיסוק של הפסיכולוג החינוכי, בדומה לרפואה מונעת, כולל איתור מוקדם והפצת ידע פסיכולוגי.<\/li>\n<li><strong>מודל \"רופא המשפחה\"<\/strong>: הפסיכולוג החינוכי ככתובת נגישה וזמינה שאליה פונים כשמתעורר קושי, עם ריווח בין פגישות, בלי סיום טיפול \"דרמטי\", ועם \"דלת פתוחה\".<\/li>\n<li><strong>גאוות יחידה<\/strong>: תחושת גאווה קבוצתית שנבנית מגורמים פנימיים (שייכות, משמעות, הכרה בחשיבות ובמקצועיות) ומגורמים חיצוניים (\"ייחודיות חיובית\" של הקבוצה).<\/li>\n<li><strong>פער שירות<\/strong>: הפער בין היקף התחלואה הנפשית לבין המעטים שמקבלים טיפול.<\/li>\n<\/ul>","models":"<p><strong>שבעת מאפייני המקצוע לפי כוכבי<\/strong> (המחברת מציינת שההפרדה ביניהם שרירותית למדי ושיש חפיפה):<\/p>\n<ol>\n<li><strong>ראייה רחבה ואינטגרטיבית: \"לנצח על התזמורת\"<\/strong>. מקרה יונתן: בן 11, אמו נטשה אותו בגיל 3, וחרדת נטישה מאב \"דל רגשית\". הוא קיבל טיפול דינמי במרפאה ציבורית במשך כשנה, והאב החסיר את רוב פגישות הדרכת ההורים. המטפלת סברה שהטיפול הצליח. שנתיים אחר כך, כפסיכולוגית חינוכית בוועדה, גילתה שהוא הצטרף לכנופיית נערים ושלמד כל שנות היסודי בכיתה \"רגשית\". השאלות שעלו בה בדיעבד: מדוע לא ידעה שהוא בחינוך מיוחד, מדוע לא יצרה קשר עם המחנכת, מדוע לא בדקה מקורות תמיכה טבעיים בקהילה ודמויות משמעותיות, מדוע לא חיפשה מסגרות אחר-צהריים, ומדוע לא פגשה אותו ואת אביו יחד.<\/li>\n<li><strong>עבודה מערכתית: \"לא חייבים לכנס עשרה אנשים בחדר\"<\/strong>. מקרה מנהלת התיכון האזורי בפריפריה: המנהלת השקיעה בקשר אישי עם כל תלמיד, ובינתיים חדר המורים התרוקן. מורה הסתירה שישבה שבעה, ומורה אחרת לא הביאה עוגה לחתונת בתה. הפסיכולוג שיקף זאת למנהלת, והם הבינו יחד שהמאמץ כלפי התלמידים הביא להזנחת המורים. אם המנהלת תראה את המורים, הם יוכלו לראות את התלמידים. בפרק זה גם תתי-הסעיפים \"אין ילד ללא מערכת\" ו\"חשיבה מערכתית גם בטיפול 'פרטני'\" (מקרה שיר, בת 16).<\/li>\n<li><strong>טווח רחב של תחומי עיסוק: \"תפסת מרובה לא תפסת\" (?)<\/strong>. רשימת התחומים שבטקסט: חינוך מיוחד, פגיעות מיניות, לקויות למידה, ADHD, אובדנות, ASD, מחוננים, אירועי חירום, \"משפחות חדשות\", רב-תרבותיות, מיומנויות חברתיות, נוער להט\"בי, עבודה קהילתית, עבודה מניעתית, היבטים התפתחותיים בגיל הרך, הבנה פסיכודינמית של מערכות. ודרכי פעולה: אבחון פסיכולוגי, אבחון פסיכודידקטי, טיפול דינמי בילדים ובני נוער, CBT, עבודה עם הורים, ועדות שילוב, ועדות השמה, אבחון מערכת, ייעוץ למערכת, התערבות מערכתית. תתי-סעיפים: \"המציאות מכילה 'הכול'\", \"רחב אינו שטחי\", \"שחיינים אל מול צוללנים\", \"סכנת הבינוניות והסכנות הנלוות לה\".<\/li>\n<li><strong>קידום בריאות נפשית<\/strong>. Kazdin &amp; Blase (2011): הפסיכולוגיה הקלאסית אינה מצליחה להפחית את התחלואה. ההצעות שלהם: הפצת ידע דרך אנשי מקצוע אחרים (מורים, גננות, רופאים, אחיות), השקעה במניעה ולא רק בטיפול, ועבודה ב\"סטינג\" יומיומי כמו בתי ספר.<\/li>\n<li><strong>גמישות<\/strong>. מעבר בין שפות מקצועיות, משימות וצורות חשיבה, ובין סביבות: חצר הגן, התחנה, חדר המנהל, חדר היועצת, חדר המורים, וגם \"דלת פתוחה\" במתנ\"ס, כתובת לשבט צופים, ואימהות טריות על ספסל ליד \"טיפת חלב\". בפרק זה גם מודל \"רופא המשפחה\".<\/li>\n<li><strong>יצירתיות ומרחב להתפתחות אישית<\/strong>. התמחות בתחומי תוכן (פגיעות מיניות, התמכרויות, כישורים חברתיים), באוכלוסיות (ASD, הורים, מחוננים, ADHD, נוער להט\"בי) ובשיטות (כתיבת ספרים, יצירת משחקים, תוכניות טיפול מקוונות, קבוצות טיפול ייחודיות).<\/li>\n<li><strong>\"גאוות יחידה\" ויוקרה מקצועית<\/strong>.<\/li>\n<\/ol>\n<p><strong>הגורמים לפיתוח \"גאוות יחידה\" (על בסיס Balliet, Wu &amp; De Dreu, 2014):<\/strong><\/p>\n<ul>\n<li><em>גורמים פנימיים<\/em>: תחושת שייכות לארגון ולתחום, תחושת משמעות, הכרה בחשיבות העיסוק, והכרה במקצועיות התחום.<\/li>\n<li><em>גורמים חיצוניים<\/em> (\"ייחודיות חיובית\" של הקבוצה): מידת החדירות (עד כמה הקבוצה סלקטיבית בקבלת חברים), הניידות החברתית (עד כמה חברים עוזבים לקבוצות אחרות), היררכיית הסטטוס הבין-קבוצתי, והלגיטימיות המקצועית.<\/li>\n<\/ul>\n<p><strong>נקודות ציון בהתמקצעות הפסיכולוגיה החינוכית בישראל (לפי המאמר):<\/strong><\/p>\n<ul>\n<li>דצמבר 2010: תיקון סעיף 9ב' (בטקסט: \"בחוק הפסיכותרפיה\"; החוק המקורי נחקק ב-1977). קודם לכן רק פסיכולוגים קליניים הורשו לעסוק בטיפול. התיקון קבע שכל פסיכולוג מומחה רשאי לטפל בתחום מומחיותו.<\/li>\n<li>אקדמיזציה: פתיחת תוכניות תואר שני בפסיכולוגיה חינוכית במכללות, כולל פרקטיקום.<\/li>\n<li>2015: דרישות חדשות של משרד הבריאות. רק בוגרי מגמה חינוכית או מגמה קלינית של הילד יכולים להתקבל להתמחות חינוכית, ואחרים נדרשים לתוכנית השלמה דו-שנתית הכוללת פרקטיקום חינוכי.<\/li>\n<\/ul>\n<p><strong>מה כוללת \"הנוסחה\" של צניעות ומצוינות:<\/strong><\/p>\n<ul>\n<li><em>צניעות<\/em>: יושרה מקצועית, הכרה בגבולות המקצוע והידע, התייעצות (עם מדריכים, עמיתים, גורמים כמו פקידת סעד), הפניה או עבודה בשיתוף צמוד עם \"צוללנים\": פסיכולוגים קליניים, התפתחותיים ושיקומיים, פסיכיאטרים, נוירולוגים, מטפלים זוגיים, מטפלים מיניים, מעצבי התנהגות ועוד.<\/li>\n<li><em>מצוינות<\/em>: הדרכה, השתלמויות וכנסים, קריאת ספרות מקצועית, סקרנות, התעדכנות במחקר, התפתחות אישית.<\/li>\n<\/ul>","practice":"<ul>\n<li>בכל הפניה, גם לטיפול \"פרטני\", כדאי לשאול את השאלות שנשאלו בדיעבד במקרה יונתן: באיזו מסגרת חינוכית הילד לומד, מי המחנכת, אילו מקורות תמיכה טבעיים ודמויות משמעותיות יש בקהילה, אילו מסגרות אחר-צהריים זמינות, והאם כדאי לפגוש את הילד יחד עם ההורה.<\/li>\n<li>אין לחכות לישיבה רבת משתתפים כדי \"לעשות עבודה מערכתית\". כל שיחה עם המנהלת על עבודתה היא הזדמנות. כדאי לשים לב לסימנים \"שקטים\" במערכת, כמו חדר מורים ריק או מורים שמסתירים אירועים אישיים, ולשקף אותם בעדינות.<\/li>\n<li>בטיפול במתבגרים, יש לבנות מראש מבנה שמשלב את ההורים (פגישות הורים מדי כמה שבועות ופגישות משותפות לפי הצורך) תוך שמירה על פרטיות וסודיות, במקום מודל \"ההורים מסיעים, משלמים ושותקים\".<\/li>\n<li>כשמקרה מעורר ספקות או חורג מהידע, יש להתייעץ עם המדריך, עם עמיתים או עם גורמים כמו פקידת סעד, ולשקול הפניה או עבודה משותפת עם \"צוללנים\". זו צניעות מקצועית, לא כישלון.<\/li>\n<li>מומלץ לבנות לעצמך תוכנית למידה מתמשכת (הדרכה, השתלמויות, קריאה), מתוך הבנה שעקומת הלמידה ארוכה ושאין פירוש הדבר בינוניות.<\/li>\n<li>כדאי לשקול ריווח פגישות, עבודה במודל \"רופא משפחה\" ו\"דלת פתוחה\" במקום סיום טיפול חד, במיוחד בעבודה עם הורים, ולהעמיד את הלקוח במרכז.<\/li>\n<li>יש לשים לב לדילמות גבולות שנוצרות מהגמישות (מורה שמבקשת להתייעץ על ילדה, הזמנה לאירוע משפחתי) ולהביא אותן להדרכה במקום להחליט אוטומטית.<\/li>\n<li>כשההשפעה אינה ניתנת למדידה (כמו בעבודה מניעתית), אין לראות בכך הוכחה שאין השפעה, וכדאי להזכיר לעצמך את מוטת ההשפעה הרחבה של עבודה במערכת של מאות תלמידים.<\/li>\n<\/ul>","questions":"<ol>\n<li>היכן אני מרגיש/ה \"שחיין/ית\" והיכן \"צוללן/ית\"? באילו תחומים אני רוצה להעמיק עם הזמן, ומה ההשלכות של זה על עבודתי השוטפת?<\/li>\n<li>בתיק שאני מחזיק/ה כעת, אילו מהשאלות שהמטפלת של יונתן שאלה בדיעבד עוד לא שאלתי? מה ימנע ממני \"לחטוא לטובת הילד\"?<\/li>\n<li>כיצד אני מאזן/ת בין כבוד לפרטיות ולסודיות של מתבגר/ת לבין שילוב ההורים בתהליך? מה הם הסימנים לכך שהיעדר קשר עם ההורים מזיק לטיפול?<\/li>\n<li>מתי אני חווה את ריבוי התחומים כ\"תפסת מרובה\" או כבינוניות? מה ההבדל, אצלי, בין צניעות מקצועית לבין תחושת חוסר מסוגלות?<\/li>\n<li>איזו דילמת גבולות שנבעה מהגמישות של העבודה (בגן, בבית הספר, בקהילה) פגשתי לאחרונה, וכיצד החלטתי אם להיענות או להציב גבול?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"ממש כפי ש\"אין תינוק ללא אם\", כדברי ויניקוט, כך \"אין ילד ללא מערכת\".\"<\/li>\n<li>\"למעשה, כל שיחה של פסיכולוג חינוכי עם מנהל בית ספר על מהות עבודתו היא עבודה מערכתית.\"<\/li>\n<li>\"הנוסחה שאני מציעה היא שילוב של צניעות מקצועית ושל מצוינות.\"<\/li>\n<li>\"לתפיסתי, הפסיכולוגים החינוכיים הם בראש ובראשונה \"שחיינים\" – אנשי מקצוע המצוידים בראייה רחבה ואינטגרטיבית של כל מקרה הבא לפתחם.\"<\/li>\n<\/ul>"},"level":"שנה א' (רלוונטי גם לשנים ב'-ג', בעיקר בשאלות של זהות מקצועית)","stype":"מאמר (עיוני-עמדה, מבוסס הרצאה ומלווה בתיאורי מקרים)","tldr":"המאמר נפתח בדיון סוער שהתנהל ב-2017 בקבוצת הפייסבוק של הפסיכולוגים החינוכיים, בעקבות השיר \"הכול\" של שימבורסקה, על השאלה אם ריבוי התחומים במקצוע הוא \"היבריס\" ו\"תפסת מרובה לא תפסת\" או דווקא ליבת הייחוד שלו. כוכבי בוחרת שבעה מאפיינים מרכזיים של המקצוע…","search":"המאמר נפתח בדיון סוער שהתנהל ב-2017 בקבוצת הפייסבוק של הפסיכולוגים החינוכיים, בעקבות השיר \"הכול\" של שימבורסקה, על השאלה אם ריבוי התחומים במקצוע הוא \"היבריס\" ו\"תפסת מרובה לא תפסת\" או דווקא ליבת הייחוד שלו. כוכבי בוחרת שבעה מאפיינים מרכזיים של המקצוע ובוחנת אותם: ראייה רחבה ואינטגרטיבית (\"לנצח על התזמורת\"), עבודה מערכתית (\"לא חייבים לכנס עשרה אנשים בחדר\"), רוחב היריעה ומגוון התחומים, קידום בריאות נפשית ומניעה, גמישות, יצירתיות ומרחב להתפתחות אישית, ו\"גאוות יחידה\" ויוקרה מקצועית. המטאפורה המרכזית היא של \"שחיינים\" מול \"צוללנים\": השחיין אינו היפוכו של הצוללן ואינו פחות מקצועי ממנו, אלא בעל מיומנות אחרת. \"רחב\" אינו \"שטחי\". מול הסכנות התאומות של בינוניות וגרנדיוזיות היא מציעה \"נוסחה\" של צניעות מקצועית לצד חתירה למצוינות. המאמר משלב תיאורי מקרים (יונתן, מנהלת התיכון, הנערה שיר), את קריאתם של Kazdin & Blase להעביר את הפסיכולוגיה לעבר מניעה ועבודה ב\"סטינג\" יומיומי, ונקודות ציון בהתמקצעות התחום בישראל: תיקון החוק ב-2010, האקדמיזציה ודרישות הקבלה להתמחות מ-2015. ראייה רחבה ואינטגרטיבית היא נכס מרכזי: הפסיכולוג החינוכי מחזיק בו-זמנית את העולם הפנימי של הילד ואת מציאות חייו החיצונית, ומושך \"בחוטים רבים בו-זמנית\". מכאן גם תפקידו כ\"מנהל המקרה\", המתאם בין אנשי מקצוע, הורים ומורים. עבודה מערכתית היא קודם כול צורת חשיבה, לא לוגיסטיקה: אין צורך לכנס ישיבות רבות משתתפים. כל שיחה עם מנהל על מהות עבודתו היא עבודה מערכתית, ושיחות \"בגובה העיניים\" עם מנהלת יכולות לשנות את האקלים בבית הספר כולו. \"אין ילד ללא מערכת\": כמו ש\"אין תינוק ללא אם\" (ויניקוט), ילד שייך להוריו, למשפחתו, לבית הספר ולקהילה. לכן ההכלה וההתכווננות המלאה של הטיפול במבוגרים אינן אפשריות כשמדובר בילד. טיפול שמתנתק מהמערכות, ובראשן מההורים, עלול שלא להועיל ואף להזיק. פעמים רבות טובת הילד מושגת ללא מעורבות ישירה איתו: עבודה עם המחנכת, היועצת, המנהלת ועם ההורים עשויה לקדם את רווחתו יותר מטיפול ישיר. זו הסיבה שהפסיכולוג החינוכי, ולא יועץ ארגוני חיצוני, מופקד על העבודה המערכתית: הוא אמון על בריאותם הנפשית של הילדים בארגון, ולא על \"בריאות הארגון\". \"רחב\" אינו \"שטחי\": לפי ניתוח מילוני, ההפך מ\"עמוק\" הוא \"שטחי\", אבל \"רחב\" פירושו מקיף, מלא ועשיר. השחיין והצוללן הם שני מקצועות שונים, ואף אחד מהם אינו נחות מהשני. בינוניות וגרנדיוזיות הן שני צדדים של אותו מטבע: התשובה לשתיהן היא צניעות מקצועית (הכרה בגבולות הידע, התייעצות, הפניה ועבודה בשיתוף עם \"צוללנים\") יחד עם חתירה מתמדת למצוינות (הדרכה, השתלמויות, קריאה, סקרנות). עקומת למידה ארוכה אינה בינוניות: ריבוי הדרישות מאריך את הזמן שנדרש כדי להגיע לרמה מקצועית גבוהה, וזו אחת הסיבות שקשה לסיים את ההתמחות בארבע שנים. מקצועיות נבחנת לאור מטרת המקצוע, קידום רווחה נפשית באוכלוסייה: בדומה לרפואה מונעת, עיקר העיסוק הוא קידום בריאות, מניעה ואיתור מוקדם, וכן העברת ידע וחשיבה פסיכולוגית למנהלים, יועצות, מורים וגננות. גם כשאי אפשר למדוד את ההשפעה ישירות (כמו אחות שמחסנת), היא משמעותית. גמישות היא יתרון וגם אתגר: המעבר בין סביבות ולקוחות מאפשר להגיע לרבים ומגן מפני שחיקה, אבל מעורר דילמות גבולות (למשל מורה שמתייעצת על ילדה הפרטי, או הזמנה לבת מצווה). אין לכך נוסחה, ויש לשמור על מודעות ועל מרחב בחירה. \"גאוות יחידה\" נבנית מגורמים פנימיים וחיצוניים: לפי המחברת, המקצוע \"יצא מהארון\" בעשור האחרון בזכות תיקון החוק (2010), האקדמיזציה והעלאת דרישות הקבלה להתמחות (2015). שחיינים / צוללנים: מטפורה לשני סוגי מומחיות. הצוללן יורד לעומק בתחום צר, השחיין שוחה למרחקים ומקשר ומחבר בין אירועים ומצבים \"על פני השטח, קרוב למציאות\". הפסיכולוגים החינוכיים הם בראש ובראשונה שחיינים, ורבים מהם הופכים עם הזמן גם לצוללנים. \"לנצח על התזמורת\" / ניהול מקרה (מנהלי תיקים): תיאום וויסות בין אנשי המקצוע, ההורים, המורים וכל מי שיכול לסייע לרווחת הילד. \"אין ילד ללא מערכת\": עיקרון המקביל ל\"אין תינוק ללא אם\" של ויניקוט. הילד לעולם שייך למערכות שעוטפות אותו. עבודה מערכתית: בראש ובראשונה צורת חשיבה שמתפתחת בהדרגה. היא יכולה להתקיים בשיחה שקטה אחד על אחד ואינה מחייבת לוגיסטיקה מורכבת. חשיבה מערכתית בטיפול \"פרטני\": שילוב ההורים בטיפול במתבגר (פגישות הורים מדי כמה שבועות ופגישות משותפות לפי הצורך), בלי לבטל את הפרטיות והסודיות. רחב לעומת שטחי: הבחנה מילונית (מילון ספיר). \"רחב\" פירושו מכיל פרטים רבים, מקיף ועשיר, ואינו היפוכו של \"עמוק\". צניעות מקצועית ומצוינות: \"הנוסחה\" שמוצעת מול סכנת הבינוניות וסכנת ההיבריס. קידום בריאות נפשית / מניעה: עיקר העיסוק של הפסיכולוג החינוכי, בדומה לרפואה מונעת, כולל איתור מוקדם והפצת ידע פסיכולוגי. מודל \"רופא המשפחה\": הפסיכולוג החינוכי ככתובת נגישה וזמינה שאליה פונים כשמתעורר קושי, עם ריווח בין פגישות, בלי סיום טיפול \"דרמטי\", ועם \"דלת פתוחה\". גאוות יחידה: תחושת גאווה קבוצתית שנבנית מגורמים פנימיים (שייכות, משמעות, הכרה בחשיבות ובמקצועיות) ומגורמים חיצוניים (\"ייחודיות חיובית\" של הקבוצה). פער שירות: הפער בין היקף התחלואה הנפשית לבין המעטים שמקבלים טיפול."},{"id":"peraui2013","title":"מה זה אומר להיות פסיכולוג חינוכי?","authors":"תמיר פראוי","year":"2013","cite":"פראוי, ת' (16 ביוני 2013). מה זה אומר להיות פסיכולוג חינוכי? משמעות המושג והחוויה בעיני העוסקים במלאכה. פסיכולוגיה עברית.","url":"https://www.hebpsy.net/articles.asp?id=2984","kind":"article","desc":null,"urlLabel":"המאמר באתר פסיכולוגיה עברית","file":{"orig":"מה זה אומר להיות פסיכולוג חינוכי.doc","ext":"doc","pdf":"peraui2013.pdf","pages":15,"bytes":160025},"placements":[["s1","general"]],"extra":false,"ref":"פראוי 2013","inFolder":true,"srcTitle":"מה זה אומר להיות פסיכולוג חינוכי? משמעות המושג והחוויה בעיני העוסקים במלאכה","secs":{"abstract":"<p>המחקר בחן כיצד פסיכולוגים חינוכיים תופסים את תפקידם ואת חווייתם המקצועית. נערכו ראיונות עומק פנומנולוגיים עם חמישה פסיכולוגים בדרגות שונות (מתמחה, פסיכולוג בהסמכה להדרכה, מדריך ומנהל), בעלי ותק של 4 עד 20 שנה, והם נותחו בניתוח תמטי. מהממצאים עולה שהמגוון הרחב של אפשרויות ההתערבות יוצר תחושת גדילה מקצועית אינסופית ואהבה למקצוע, אבל גם עומס ותחושה של שטחיות ו\"בינוניות\" במיומנויות ספציפיות. ההתפתחות המקצועית של המרואיינים כללה שינוי תפיסה: מעמדה שבה האתגר הוא לחולל שינוי בפרט, לעמדה שמבקשת להשפיע על המערכת. את ייחוד המקצוע הם מזהים בתפיסה הרב-ממדית והאקולוגית: התבוננות במקרה דרך כמה ערוצים בו-זמנית, ושימוש בהקשר כדי לחולל שינוי במערכת ובפרטים שבה. סביבת העבודה נתפסת כהומנית וחברית, ומפצה על העומס ועל התגמול הנמוך. הממצאים שונים מסקר שפ\"י מ-1996, שבו הפסיכולוגים החינוכיים העדיפו לעבוד כקלינאים. ההסבר המוצע הוא השינוי במקצוע לכיוון עבודה מערכתית. בסוף המאמר מובאות המלצות למנהלי שפ\"חים: לשמר את הגיוון, לסייע בניהול משאבים באמצעות תוכניות עבודה, ולשמור על סביבת העבודה.<\/p>","ideas":"<ul>\n<li><strong>גיוון הוא המאפיין הבולט והאהוב ביותר במקצוע<\/strong>: אבחון ביום אחד, ייעוץ למורה למחרת, תכנון התערבות וסדנה לצוות. גם התנועה בין המשרד, בית הספר, הגן והקהילה, והעבודה עם צוותים פורמליים ובלתי פורמליים (כמו תנועות נוער), יוצרות \"מרחב אין-סופי של אפשרויות\".<\/li>\n<li><strong>התפיסה הרב-ממדית היא ליבת המקצוע<\/strong>: כל בעיה נבחנת כ\"סודוקו\" או תשבץ, וצריך לחבר גורמים קוגניטיביים, רגשיים, משפחתיים וחברתיים לשלם אינטגרטיבי. גם ההתערבות עצמה חייבת לשלב את כל המעגלים שעוטפים את הילד, ולא להסתפק בציר אחד.<\/li>\n<li><strong>חשיבה מערכתית קיימת גם במפגש פרטני<\/strong>: \"אתה עובד מתוך הקשר גם כשאתה פוגש ילד\". ההיכרות עם מגבלות המערכת ועם מה שמורה מסוגל לתת מעשירה גם את הטיפול.<\/li>\n<li><strong>הייחוד לעומת התמחויות אחרות<\/strong> הוא השילוב בין חשיבה פסיכודינמית (התקשרות, יחסי אובייקט) לבין מציאות חייו של הילד, מה שמרואיינת אחת מכנה \"גישה פסיכו-דינאמית מערכתית\".<\/li>\n<li><strong>נוכחות יוצרת הזדמנויות התערבות<\/strong>: מודל של הגעה מוקדמת לבית הספר ושעות פנויות ל\"התערבויות מזדמנות\". ה\"סטינג\" הקלאסי של מטופל שמגיע לפסיכולוג אינו קיים כאן, והפסיכולוג \"יוצא אל השדה הפתוח\".<\/li>\n<li><strong>מימוש פוטנציאל ההשפעה דורש בניית אמון ארוכה<\/strong>, בעיקר עם המנהל. גם פסיכולוגית בכירה נתקלה במנהלת חדשה שחשה מאוימת, והקשר השתנה רק לאחר זמן, עד שהפכה ל\"יד ימין\".<\/li>\n<li><strong>ניהול משאבים הוא אתגר מובנה<\/strong>: כל בחירה באה על חשבון משהו אחר (עבודה קבוצתית על חשבון עבודה פרטנית). \"עומס – זה שם המשחק\", ויש צורך בוויסות מושכל של זמן.<\/li>\n<li><strong>משמעות עוברת מהפרט אל המערכת<\/strong>: בתחילת הדרך המשמעות נשאבה מקשר טיפולי פרטני טוב, ובהמשך מהשפעה על אווירת המערכת כולה. הטיפול נוגע \"בעולמו של אחד\" והעבודה החינוכית \"בעולמות של רבים\".<\/li>\n<li><strong>מקורות התסכול<\/strong>: עומס, משימות אדמיניסטרטיביות שנתפסות כחסרות תועלת (טפסים לוועדות שילוב והפניות גורפות), קושי להשפיע על הדרגים הגבוהים, קושי למדוד הצלחה, וחוויה של \"בורג קטן\" שמתקשה לבודד את תרומתו.<\/li>\n<li><strong>\"לוליינות\" ונאמנויות סותרות<\/strong>: גם בקשר טוב עם מנהל, הפסיכולוג נדרש לשמור על נפרדות ועל \"המצפן המקצועי\" כשמטרות בית הספר (הישגים, החרגה) מתנגשות עם טובת הילד (אווירה, הכלה). \"קשר טוב לא יהפוך להיות אזיקים\".<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>תפיסה רב-ממדית / אקולוגית<\/strong>: הבנת כל בעיה כתוצר של גורמים רבים שפועלים בו-זמנית, והתערבות במעגלים שעוטפים את הילד (משפחה, בית ספר, קהילה). לפי המחקר זהו ייחודו של המקצוע.<\/li>\n<li><strong>גישה פסיכו-דינאמית מערכתית<\/strong>: הפעלת חשיבה קלינית ודינמית בהקשר חינוכי ובתוך מערכות (בלשון אחת המרואיינות).<\/li>\n<li><strong>שלושת הרצפים (מתוך המתווה, חוזר מנכ\"ל 2010)<\/strong>: רצף התפתחות, רצף אוכלוסיות ורצף מניעה-התערבות.<\/li>\n<li><strong>חוזה עבודה עם הצוות החינוכי<\/strong>: ההסכמות שהפסיכולוג יוצר בתחילת השנה עם המסגרת שאליה שובץ. העבודה מתנהלת דרך אנשי קשר במערכת.<\/li>\n<li><strong>שעות פתוחות / התערבויות מזדמנות<\/strong>: מודל עבודה של נוכחות בבית הספר שאינה מתוכננת כולה מראש, ומאפשרת יוזמה ורלוונטיות.<\/li>\n<li><strong>פוטנציאל ההשפעה<\/strong>: היכולת להשפיע על מקבלי השירות ועל תהליכים חינוכיים וטיפוליים, שמותנית בבניית אמון ובנוכחות ברגעים קריטיים.<\/li>\n<li><strong>ניהול משאבים<\/strong>: בחירה מושכלת בין פעילויות במסגרת שעות מוגבלות, באמצעות תוכנית עבודה שנגזרת ממטרות ומשימות.<\/li>\n<li><strong>תחושת שטחיות / \"פסיכולוגיה בינונית\"<\/strong>: הצד השני של הגיוון, כלומר קושי להגיע למומחיות יסודית במיומנות ספציפית.<\/li>\n<li><strong>קשיי מדידה<\/strong>: שביעות רצון אינה בהכרח עדות לקידום, ותסכול אינו בהכרח עדות להיעדר שינוי.<\/li>\n<li><strong>חוויית \"בורג קטן\"<\/strong>: קושי לבודד את ההשפעה הספציפית של הפסיכולוג מתוך מכלול הגורמים, בעיקר בחינוך המיוחד, שבו הצוות \"מחזיק\" את הילד.<\/li>\n<li><strong>תחושת לוליינות<\/strong>: הליכה על \"חבל דק\" בין נאמנויות ומטרות סותרות, תוך הכלת ניגודים ו\"אפשור דיאלוג\".<\/li>\n<li><strong>מחקר פנומנולוגי / ניתוח תמטי<\/strong>: שיטת המחקר. ראיונות עומק שמטרתם להבין את החוויה הסובייקטיבית, ואחריהם זיהוי תמות.<\/li>\n<\/ul>","models":"<p><strong>מתווה השירות הפסיכולוגי-חינוכי (חוזר מנכ\"ל תש\"ע 8א, 2010), כפי שמובא במאמר:<\/strong><\/p>\n<ul>\n<li><em>ייעוד<\/em>: \"לקדם את רווחתם ואת בריאותם הנפשית של כלל התלמידים במערכת החינוך\", ברמת מערכת החינוך והקהילה, הפרט והמשפחה, בשגרה ובחירום. השירות מיועד לתלמידים, להורים, לצוותי חינוך בגנים ובבתי ספר ולגורמים קהילתיים.<\/li>\n<li><em>רצף התפתחות<\/em>: ליווי ההתפתחות של הילד (הוריו, משפחתו, סביבתו החינוכית והוא עצמו), בגילים 3 עד 18, ובחינוך המיוחד עד 21.<\/li>\n<li><em>רצף אוכלוסיות<\/em>: תפיסה אקולוגית, ושירות לכל מי שבא במגע עם הילד.<\/li>\n<li><em>רצף מניעה-התערבות<\/em>: איתור מוקדם ותוכניות לצמצום גורמי סיכון, ולא רק טיפול לאחר שהבעיה נוצרה.<\/li>\n<li>הפסיכולוג מיומן באבחון, בייעוץ ובטיפול בפרט, בהנחיית קבוצות ובייעוץ והתערבות בארגונים, ומשתף פעולה עם הרווחה, החינוך ובריאות הציבור. לפי הטקסט, התקן הוא \"שעת פסיכולוג לכל 10–30 תלמידים\", ויש פער בינו לבין צורכי השדה.<\/li>\n<\/ul>\n<p><strong>דוגמת הקשת של דרכי פעולה (אירוע אלים בין שני תלמידים):<\/strong><\/p>\n<ol>\n<li>הערכה פסיכולוגית של שני הילדים, תחילת תהליך טיפולי וייעוץ להורים ולצוות.<\/li>\n<li>עבודה פסיכו-חינוכית בכיתה בנושא \"מוגנות אישית\" (סדנה של כמה מפגשים).<\/li>\n<li>עבודה עם המנהל או עם צוות המורים על תוכנית התערבות כוללת לשיפור האקלים.<\/li>\n<\/ol>\n<p><strong>שיטת המחקר<\/strong>: מחקר פנומנולוגי. ראיונות עומק עם 5 פסיכולוגים חינוכיים (4 נשים וגבר אחד): מתמחה (4 שנים בהתמחות), פסיכולוג בהסמכה להדרכה, מדריך ומנהל. שלושה עבדו רק בשפ\"ח ושניים גם בפרקטיקה פרטית, ולאחד הייתה גם הכשרה קלינית. כל המומחים עבדו מעל 10 שנים בשפ\"ח, והראיונות נערכו במשרד השירות.<\/p>\n<p><strong>מבנה הממצאים: שתי קטגוריות של תמות<\/strong><\/p>\n<p><em>קטגוריה א': אפיוני המקצוע<\/em><\/p>\n<ul>\n<li>א. גיוון בסוגי הפעילויות<\/li>\n<li>ב. תפיסה מקצועית רב-ממדית<\/li>\n<li>ג. הייחודיות של הפסיכולוגיה החינוכית<\/li>\n<li>ד. גמישות בתהליכי התערבות (כולל מודל השעות הפתוחות)<\/li>\n<li>ה. פוטנציאל ההשפעה (כולל בניית אמון עם המנהלת, ועבודה קבוצתית עם צוות במשבר)<\/li>\n<li>ו. ניהול משאבים<\/li>\n<\/ul>\n<p><em>קטגוריה ב': תחושות הפסיכולוגים בקשר למקצועם<\/em><\/p>\n<ul>\n<li>א. חוויה של גדילה אינסופית<\/li>\n<li>ב. תחושת שטחיות מבחינה מקצועית<\/li>\n<li>ג. תחושת משמעות<\/li>\n<li>ד. תסכול עקב עומסים ופעולות אדמיניסטרטיביות<\/li>\n<li>ה. קשיי מדידה<\/li>\n<li>ו. חוויה של \"בורג קטן\"<\/li>\n<li>ז. תחושת לוליינות<\/li>\n<li>ח. סביבת עבודה אנושית<\/li>\n<\/ul>\n<p><strong>מקרה העבודה הקבוצתית עם צוות במשבר<\/strong>: שתי פסיכולוגיות התחילו בייעוץ פרטני לאנשי צוות סביב ילד שהופנה, וזיהו משבר ביחסים בצוות. הן הציעו למנהלת עבודה קבוצתית, שכללה מפגשים כואבים עם תחושה ש\"זה יותר מתפרק מאשר מתחבר\". בהמשך השתפרה האווירה (מפגשי בוקר, תקשורת, עוגה לפורים). התהליך נתן שם ולגיטימיות לתחרותיות ולקנאה, ובעזרתו הבין הצוות שהוא זקוק למרחב הקבוצתי.<\/p>\n<p><strong>ממצאי רקע מחקריים שהמאמר סוקר:<\/strong><\/p>\n<ul>\n<li>סקרים בארה\"ב: שביעות רצון גבוהה יחסית. הגבוהה ביותר מהיחסים עם עמיתים, מאינטנסיביות העיסוק, מהעצמאות ומהסיוע לאחר. נמוכה יותר ממדיניות בתי הספר, מהתגמול ומאפשרויות הקידום.<\/li>\n<li>סקר ISPA הבין-לאומי (Jimerson et al., 2008): התחומים המועדפים הם סיוע לתלמידים, להורים ולמורים. הגיוון והגמישות אהודים, ועבודה אדמיניסטרטיבית וחוסר משאבים הם תחומי קושי.<\/li>\n<li>סקר שפ\"י מ-1996 (רביב ושות'), שעליו השיבו כ-1,100 פסיכולוגים: הפסיכולוג החינוכי מעוניין בעיקר לעבוד כקלינאי בטיפול בילדים ובהדרכת הורים, ובמידה מסוימת גם בהדרכת מורים. סקר נוסף מ-2006 לא פורסם.<\/li>\n<\/ul>\n<p><strong>סייגי המחקר<\/strong>: המרואיינים ותיקים, ולכן ייתכנה הטיה חיובית (מי שעזב, אולי בגלל צורך בשליטה במיומנות ספציפית, לא רואיין). הקבוצה קטנה, והייתה התייחסות מועטה לתגמול ולקידום. ייתכן גם שמעמדו של החוקר כמנהל מדור המחקר והיכרותו המוקדמת עם המרואיינים השפיעו.<\/p>\n<p><strong>המלצות למנהלי שפ\"חים:<\/strong><\/p>\n<ol>\n<li>לשמר את הגיוון בעבודה, מרכיב חשוב בהתמדה בתפקיד.<\/li>\n<li>לסייע לפסיכולוגים בניהול משאבים ובהתמקצעות, באמצעות הטמעת תוכניות עבודה מסודרות שמתייחסות למשאבי הזמן לאור המטרות והמשימות, כדי שהפסיכולוג יוכל להבהיר לעצמו ולמקבלי השירות מה אפשר לבצע בזמן נתון.<\/li>\n<li>לשמור על סביבת העבודה התומכת והקולגיאלית.<\/li>\n<\/ol>","practice":"<ul>\n<li>בתחילת השנה, יש לבנות עם כל מסגרת חוזה עבודה ותוכנית עבודה שמתייחסת במפורש למשאבי הזמן מול המטרות. כך אפשר להבהיר לעצמך ולמקבלי השירות מה ניתן לבצע, ולהפחית תחושת עומס ותסכול הדדי.<\/li>\n<li>כדאי לשקול לשריין בשעות בבית הספר זמן \"פתוח\" (הגעה מוקדמת, שיחות בחדר המורים) כדי לאסוף מידע ולזהות הזדמנויות להתערבות, ולא להגיע רק כשנקבעו פגישות.<\/li>\n<li>כשמגיעה הפניה, מומלץ לפרוש את קשת האפשרויות (פרטני, כיתתי, מערכתי) לפני שבוחרים, ולבחור בדיאלוג עם מקבלי השירות ובהתחשב במשאבים.<\/li>\n<li>גם בפגישה פרטנית עם ילד, הורה או מורה, כדאי להחזיק בראש את ההקשר: גורמי תמיכה, גורמי הפרעה, ומה המורה באמת מסוגל לתת.<\/li>\n<li>אין לצפות לאמון מיידי מהמנהל, גם כשיש לך ניסיון. בניית מעמד היא תהליך, ובינתיים אפשר לעבוד עם מורים והורים ולהראות תרומה ממשית, למשל תיווך מול הורים.<\/li>\n<li>כדאי להיזהר מלפרש שביעות רצון או תסכול של נועץ כמדד הצלחה, ולחפש מדדים אחרים לשינוי.<\/li>\n<li>כשמתפתח קשר טוב עם הצוות, יש לשים לב שהוא לא יהפוך ל\"אזיקים\". צריך לשמור על נפרדות ועל המצפן המקצועי, במיוחד כשמטרות בית הספר (הישגים, הוצאת ילדים חריגים) מתנגשות עם טובת הילד.<\/li>\n<li>כדאי להיעזר בעמיתים בתחנה כמשאב: לפי הממצאים, קל יחסית למצוא שותפים ליוזמות, והסביבה התומכת מפצה על העומס.<\/li>\n<\/ul>","questions":"<ol>\n<li>איפה אני נמצא/ת כרגע על הציר שבין \"ליצור שינוי בפרט\" לבין \"להשפיע על המערכת\"? מה מקור תחושת המשמעות שלי בעבודה כיום?<\/li>\n<li>מתי הגיוון מעשיר אותי ומתי הוא מייצר אצלי תחושת שטחיות או \"בינוניות\"? באילו מיומנויות אני רוצה להעמיק השנה, ואיך זה ישתלב בתוכנית העבודה?<\/li>\n<li>כיצד אני מחליט/ה על חלוקת השעות בין עבודה פרטנית, קבוצתית ומערכתית במסגרת שלי? מה אני \"מוותר/ת\" עליו, ואיך אני מתמודד/ת עם זה?<\/li>\n<li>היכן אני חש/ה \"לוליינות\" או נאמנויות סותרות מול הנהלת בית הספר? איך שומרים על נפרדות בלי לפגוע בקשר?<\/li>\n<li>כיצד אני יודע/ת שהתערבות שלי השפיעה? אילו סימנים, מלבד שביעות רצון, אני יכול/ה לחפש?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"אני חושבת שאם אתה אינך נמצא בבי\"ס אתה מפסיד המון אינפורמציה והמון הזדמנויות להתערב.\"<\/li>\n<li>\"הפסיכולוגים אמרו כי העבודה המערכתית מאפשרת מוטת השפעה רחבה יותר – הטיפול נוגע \"בעולמו של אחד\" ואילו העבודה כפסיכולוג חינוכי נוגעת \"בעולמות של רבים\".\"<\/li>\n<li>\"לא תמיד מעידה שביעות הרצון מההתערבות על קידום, ומנגד – תסכול לא תמיד מעיד על כך שלא התקבלו תובנות חדשות או שלא התחוללו שינויים.\"<\/li>\n<li>\"הוא הסביר כי הוא מרגיש שעליו תמיד להיות \"ער למורכבות\" ולשים לב לכך ש\"קשר טוב לא יהפוך להיות אזיקים\".\"<\/li>\n<\/ul>"},"level":"שנה א' (מתאים גם לשנים ב'-ג', לבירור זהות מקצועית ולניהול עומס)","stype":"מאמר (מחקר איכותני-פנומנולוגי)","tldr":"המחקר בחן כיצד פסיכולוגים חינוכיים תופסים את תפקידם ואת חווייתם המקצועית. נערכו ראיונות עומק פנומנולוגיים עם חמישה פסיכולוגים בדרגות שונות (מתמחה, פסיכולוג בהסמכה להדרכה, מדריך ומנהל), בעלי ותק של 4 עד 20 שנה, והם נותחו בניתוח תמטי. מהממצאים עולה…","search":"המחקר בחן כיצד פסיכולוגים חינוכיים תופסים את תפקידם ואת חווייתם המקצועית. נערכו ראיונות עומק פנומנולוגיים עם חמישה פסיכולוגים בדרגות שונות (מתמחה, פסיכולוג בהסמכה להדרכה, מדריך ומנהל), בעלי ותק של 4 עד 20 שנה, והם נותחו בניתוח תמטי. מהממצאים עולה שהמגוון הרחב של אפשרויות ההתערבות יוצר תחושת גדילה מקצועית אינסופית ואהבה למקצוע, אבל גם עומס ותחושה של שטחיות ו\"בינוניות\" במיומנויות ספציפיות. ההתפתחות המקצועית של המרואיינים כללה שינוי תפיסה: מעמדה שבה האתגר הוא לחולל שינוי בפרט, לעמדה שמבקשת להשפיע על המערכת. את ייחוד המקצוע הם מזהים בתפיסה הרב-ממדית והאקולוגית: התבוננות במקרה דרך כמה ערוצים בו-זמנית, ושימוש בהקשר כדי לחולל שינוי במערכת ובפרטים שבה. סביבת העבודה נתפסת כהומנית וחברית, ומפצה על העומס ועל התגמול הנמוך. הממצאים שונים מסקר שפ\"י מ-1996, שבו הפסיכולוגים החינוכיים העדיפו לעבוד כקלינאים. ההסבר המוצע הוא השינוי במקצוע לכיוון עבודה מערכתית. בסוף המאמר מובאות המלצות למנהלי שפ\"חים: לשמר את הגיוון, לסייע בניהול משאבים באמצעות תוכניות עבודה, ולשמור על סביבת העבודה. גיוון הוא המאפיין הבולט והאהוב ביותר במקצוע: אבחון ביום אחד, ייעוץ למורה למחרת, תכנון התערבות וסדנה לצוות. גם התנועה בין המשרד, בית הספר, הגן והקהילה, והעבודה עם צוותים פורמליים ובלתי פורמליים (כמו תנועות נוער), יוצרות \"מרחב אין-סופי של אפשרויות\". התפיסה הרב-ממדית היא ליבת המקצוע: כל בעיה נבחנת כ\"סודוקו\" או תשבץ, וצריך לחבר גורמים קוגניטיביים, רגשיים, משפחתיים וחברתיים לשלם אינטגרטיבי. גם ההתערבות עצמה חייבת לשלב את כל המעגלים שעוטפים את הילד, ולא להסתפק בציר אחד. חשיבה מערכתית קיימת גם במפגש פרטני: \"אתה עובד מתוך הקשר גם כשאתה פוגש ילד\". ההיכרות עם מגבלות המערכת ועם מה שמורה מסוגל לתת מעשירה גם את הטיפול. הייחוד לעומת התמחויות אחרות הוא השילוב בין חשיבה פסיכודינמית (התקשרות, יחסי אובייקט) לבין מציאות חייו של הילד, מה שמרואיינת אחת מכנה \"גישה פסיכו-דינאמית מערכתית\". נוכחות יוצרת הזדמנויות התערבות: מודל של הגעה מוקדמת לבית הספר ושעות פנויות ל\"התערבויות מזדמנות\". ה\"סטינג\" הקלאסי של מטופל שמגיע לפסיכולוג אינו קיים כאן, והפסיכולוג \"יוצא אל השדה הפתוח\". מימוש פוטנציאל ההשפעה דורש בניית אמון ארוכה, בעיקר עם המנהל. גם פסיכולוגית בכירה נתקלה במנהלת חדשה שחשה מאוימת, והקשר השתנה רק לאחר זמן, עד שהפכה ל\"יד ימין\". ניהול משאבים הוא אתגר מובנה: כל בחירה באה על חשבון משהו אחר (עבודה קבוצתית על חשבון עבודה פרטנית). \"עומס – זה שם המשחק\", ויש צורך בוויסות מושכל של זמן. משמעות עוברת מהפרט אל המערכת: בתחילת הדרך המשמעות נשאבה מקשר טיפולי פרטני טוב, ובהמשך מהשפעה על אווירת המערכת כולה. הטיפול נוגע \"בעולמו של אחד\" והעבודה החינוכית \"בעולמות של רבים\". מקורות התסכול: עומס, משימות אדמיניסטרטיביות שנתפסות כחסרות תועלת (טפסים לוועדות שילוב והפניות גורפות), קושי להשפיע על הדרגים הגבוהים, קושי למדוד הצלחה, וחוויה של \"בורג קטן\" שמתקשה לבודד את תרומתו. \"לוליינות\" ונאמנויות סותרות: גם בקשר טוב עם מנהל, הפסיכולוג נדרש לשמור על נפרדות ועל \"המצפן המקצועי\" כשמטרות בית הספר (הישגים, החרגה) מתנגשות עם טובת הילד (אווירה, הכלה). \"קשר טוב לא יהפוך להיות אזיקים\". תפיסה רב-ממדית / אקולוגית: הבנת כל בעיה כתוצר של גורמים רבים שפועלים בו-זמנית, והתערבות במעגלים שעוטפים את הילד (משפחה, בית ספר, קהילה). לפי המחקר זהו ייחודו של המקצוע. גישה פסיכו-דינאמית מערכתית: הפעלת חשיבה קלינית ודינמית בהקשר חינוכי ובתוך מערכות (בלשון אחת המרואיינות). שלושת הרצפים (מתוך המתווה, חוזר מנכ\"ל 2010): רצף התפתחות, רצף אוכלוסיות ורצף מניעה-התערבות. חוזה עבודה עם הצוות החינוכי: ההסכמות שהפסיכולוג יוצר בתחילת השנה עם המסגרת שאליה שובץ. העבודה מתנהלת דרך אנשי קשר במערכת. שעות פתוחות / התערבויות מזדמנות: מודל עבודה של נוכחות בבית הספר שאינה מתוכננת כולה מראש, ומאפשרת יוזמה ורלוונטיות. פוטנציאל ההשפעה: היכולת להשפיע על מקבלי השירות ועל תהליכים חינוכיים וטיפוליים, שמותנית בבניית אמון ובנוכחות ברגעים קריטיים. ניהול משאבים: בחירה מושכלת בין פעילויות במסגרת שעות מוגבלות, באמצעות תוכנית עבודה שנגזרת ממטרות ומשימות. תחושת שטחיות / \"פסיכולוגיה בינונית\": הצד השני של הגיוון, כלומר קושי להגיע למומחיות יסודית במיומנות ספציפית. קשיי מדידה: שביעות רצון אינה בהכרח עדות לקידום, ותסכול אינו בהכרח עדות להיעדר שינוי. חוויית \"בורג קטן\": קושי לבודד את ההשפעה הספציפית של הפסיכולוג מתוך מכלול הגורמים, בעיקר בחינוך המיוחד, שבו הצוות \"מחזיק\" את הילד. תחושת לוליינות: הליכה על \"חבל דק\" בין נאמנויות ומטרות סותרות, תוך הכלת ניגודים ו\"אפשור דיאלוג\". מחקר פנומנולוגי / ניתוח תמטי: שיטת המחקר. ראיונות עומק שמטרתם להבין את החוויה הסובייקטיבית, ואחריהם זיהוי תמות."},{"id":"greenwald2009","title":"אתגרים ארגוניים בעבודת הפסיכולוג החינוכי","authors":"נעמה גרינולד-קשאני וולריה מטיחס","year":"2009","cite":"גרינולד-קשאני, נ' ומטיחס, ו' (ינואר 2009). אתגרים ארגוניים בעבודת הפסיכולוג החינוכי: מבט מחודש על הנחות היסוד של הפרקטיקה המקצועית. פסיכואקטואליה, 16-31.","url":"https://www.psychology.org.il/sites/psycho/UserContent/files/psycho-actualia/psycho1_09.pdf","kind":"article","desc":null,"urlLabel":"הגיליון המלא של פסיכואקטואליה (PDF), עמ' 16","file":{"orig":"אתגרים ארגוניים בעבודת הפסיכולוג החינוכי קשאני גרינוולד ומטיחאס.pdf","ext":"pdf","pdf":"greenwald2009.pdf","pages":16,"bytes":811474},"placements":[["s1","general"]],"extra":false,"ref":"גרינולד ומטיחס 2009","inFolder":true,"srcTitle":"אתגרים ארגוניים בעבודת הפסיכולוג החינוכי: מבט מחודש על הנחות היסוד של הפרקטיקה המקצועית","secs":{"abstract":"<p>המאמר מזמין את הפסיכולוגיה החינוכית לבחון באופן ביקורתי את הנחות היסוד של הפרקטיקה שלה. הכותבות מציגות שלושה ממדים מקובלים להבחנה בין פרופסיות: גוף ידע, קוד אתי וסוציאליזציה מקצועית. הן מוסיפות להם ממד רביעי, עיסוק בביקורת עצמית.<\/p>\n<p>על סמך התרשמות שלהן, ולא על סמך מחקר, הן מתארות דימוי של פסיכולוגים מוערכים שנשארים בשוליים בהכרעות הארגוניות של בית הספר. מבפנים יש תסכול מכך שהעבודה הוסטה לאבחון ולהשמה (\"הפכנו מפסיכולוגים לטסטולוגים\"). מכאן עולה שאלה אתית: התחום הפך ל\"פסיכולוגיה של המתקשים\" במקום \"פסיכולוגיה של מערכת החינוך\".<\/p>\n<p>הכותבות מציעות שלוש זוויות להתכווננות ארגונית: אסטרטגית-פונקציונלית, פסיכואנליטית ופוסט-מודרנית, ומדגימות כל אחת מהן.<\/p>\n<p>החלק השני הוא סיפור בגוף ראשון של מנהלת שנכנסה לשפ\"ח שדרות בפברואר 2008, בעיצומה של הסלמה ביטחונית. הוא מתאר:<\/p>\n<ul>\n<li>מיצוב השפ\"ח כ\"גוף מתכלל\" וכ\"שער כניסה\" לשירותים הטיפוליים;<\/li>\n<li>הקמת \"פורום תמיכה\" בכל בית ספר;<\/li>\n<li>בקרה על האבחונים;<\/li>\n<li>תוכניות עבודה;<\/li>\n<li>ניתוח של מקרה השמה דרך תהליכים לא מודעים.<\/li>\n<\/ul>\n<p>בדיון נבחנים היתרונות והסיכונים של \"אריגת\" שלוש הגישות. הכותבות מציעות שינויים בהכשרה ובהדרכה בשפ\"ח, ובכלל זה עדכון גוף הידע לבחינת ההתמחות.<\/p>","ideas":"<ul>\n<li><strong>ממד רביעי להבחנה בין פרופסיות.<\/strong> לשלושת הממדים המקובלים (ספציפיות גוף הידע, חוזק הקוד האתי, הידוק הסוציאליזציה) מוצע להוסיף, ברוח פוסט-מודרנית, את מידת העיסוק בביקורת עצמית. כלומר: באיזו מידה הפרופסיה בוחנת את הערכים החברתיים שעומדים מאחורי עקרונות הפעולה שלה. חשיבה כזאת מעוררת אי-נחת, כי היא חושפת את הפרופסיה כיחסית ותלוית תרבות. אבל היא גם הזדמנות לבחור מחדש בעקרונות המקצוע.<\/li>\n<li><strong>הדימוי מבחוץ.<\/strong> הפסיכולוגים נתפסים כמתוחכמים, מיומנים, אתיים וזמינים בעת משבר. הביקורת עליהם מתמקדת בשני דברים:<ol>\n<li>קושי לתרגם תובנות פסיכולוגיות לשפה חינוכית ולתוכניות מותאמות, ו\"עצות חוזרות\".<\/li>\n<li>היעדר מעורבות מרכזית בהכרעות ארגוניות. זה מתבטא בפנייה ליועצים, למנחים ולעמותות חיצוניים.<\/li>\n<\/ol>\n<\/li>\n<li><strong>אי-נחת מבפנים.<\/strong> פסיכולוגים רבים חשים שהיכולות שלהם אינן ממומשות ושהאבחון וההשמה תופסים חלק גדול מדי מהעבודה. ההכרה החוקית בבלעדיות שלהם באבחונים אולי הפכה ל\"מלכודת\". ככל שגוף הידע בלעדי יותר והסוציאליזציה הדוקה יותר, דרגות החופש המקצועיות עלולות להיות נמוכות יותר.<\/li>\n<li><strong>תחושת השפעה נמוכה על הגדרת התפקיד.<\/strong> פסיכולוגים רבים מניחים שהגדרת התפקיד ניתנת מלמעלה: ממנהלת השפ\"ח, משפ\"י ומשרד החינוך. לא מספיק שהמנהלים יתמכו ביוזמה \"עקרונית\". צריך להקצות לכך מרחבי עבודה וחשיבה של ממש.<\/li>\n<li><strong>השאלה האתית: למי מחויב הפסיכולוג?<\/strong> המשאבים שמושקעים בילדים \"בקצה\" (אבחון, השמה, קונסולטציה) גדולים בהרבה מאלה שמושקעים בתרבות הבית-ספרית ובדילמות שנוגעות לכל הילדים. זו בחירה מקצועית, ולכן אפשר להעמיד אותה לבחינה. ההצעה ההיפותטית: להקצות לאוכלוסייה המתקשה משאבים לפי חלקה באוכלוסייה, ואת השאר להפנות לייעוץ להנהלה, לדילמות חינוכיות, לשינוי ארגוני ולעבודה ממשקית.<\/li>\n<li><strong>עבודה ארגונית דורשת הכשרה ייחודית.<\/strong> היא דורשת גם מבני הדרכה ושפה פנים-שפ\"חית מתאימים. ייתכן שהדרכה אינדיבידואלית מתאימה לעבודה פרטנית יותר מאשר לעבודה ארגונית. כדי להבין ארגונים, השפ\"ח צריך קודם כול ללמוד את עצמו כארגון.<\/li>\n<li><strong>שלוש זוויות מבט ארגוניות<\/strong> (אסטרטגית-פונקציונלית, פסיכואנליטית ופוסט-מודרנית). כל אחת מזמינה שאלות אחרות ומקום אחר ליועץ או לפסיכולוג.<\/li>\n<li><strong>ביקורת פוסט-מודרנית על האבחון.<\/strong> המאמר שואל מי מרוויח מכך שאינטליגנציה, ובשנים האחרונות קשב וריכוז, הם צירי המיון של ילדים. הוא מציין ש\"הימנעות אינה פעולה ניטראלית\", וטוען שהשפ\"ח יכול לפעול כארגון וככוח מקצועי מאוגד ולא רק כמצבור של אנשי מקצוע.<\/li>\n<li><strong>מקרה שפ\"ח שדרות.<\/strong> הוא מדגים מעבר מעבודה \"בד' אמות\" לשפ\"ח שמתכלל את מערך הסיוע העירוני בזמן חירום מתמשך. הצעדים: יום עיון לכל המטפלים בעיר, השתתפות בצוות העירוני המוביל, \"פורום תמיכה\" בכל בית ספר, ועדות שבוחנות את נחיצות האבחונים, תוכניות עבודה אישיות וסמינר שנתי.<\/li>\n<li><strong>\"אריגת\" שלוש הגישות.<\/strong> היא מאפשרת להתערב גם ברמה הרגשית (שיקוף ופירוש) וגם ברמה הפונקציונלית (מבנים אסטרטגיים שמווסתים חרדה). אבל היא עלולה לפגוע בקוהרנטיות של כל גישה. לכן צריך לבדוק כל הזמן אם השילוב \"משטיח או מפרה\".<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>ממדי הפרופסיה<\/strong> – גוף ידע עיוני ומעשי (עד כמה הוא מובחן ועצמאי), חוזק הקוד האתי (כללי התנהגות וסנקציות), סוציאליזציה מקצועית (הגדרת ההכשרה, משכה ומנגנוני הפיקוח עליה), ועיסוק בביקורת עצמית (הממד שהכותבות מוסיפות).<\/li>\n<li><strong>סוציאליזציה מקצועית<\/strong> – הדרך שבה הפרופסיה מכשירה ומפקחת על המתלמדים. לפי המאמר היא כוללת גם מבני הדרכה ושפה ארגונית פנים-שפ\"חית, ולא רק גופי ידע.<\/li>\n<li><strong>\"טסטולוגים\"<\/strong> – ביטוי של פסיכולוג שמתמצת את החוויה שהאבחון וההשמה השתלטו על העבודה.<\/li>\n<li><strong>פסיכולוגיה של מערכת החינוך מול פסיכולוגיה של המתקשים<\/strong> – שתי הגדרות עצמיות של התחום. המאמר טוען שהשנייה השתלטה, ושזו בחירה שאפשר לבחון מחדש.<\/li>\n<li><strong>התכווננות ארגונית<\/strong> – הרחבת המבט של הפסיכולוג מהפרט אל הארגון. היא נשענת על \"מפות תיאורטיות\" של מה אנחנו עושים (פרקטיקות) ולאן אנחנו חותרים (אתיקה).<\/li>\n<li><strong>תפיסה אסטרטגית-פונקציונלית<\/strong> – הארגון כשואף ליעילות מרבית. ההתערבות מתמקדת בתחומי אחריות ובמבני עבודה: הרכב, תדירות ובהירות משימתית.<\/li>\n<li><strong>תפיסה ארגונית-פסיכואנליטית<\/strong> – בחינת מקורות החרדה הלא מודעת כשהמערכת לא עומדת במשימות הראשוניות שלה (primary tasks). הכלי: הגילויים הקאונטר-טרנספרנסיאליים של הפסיכולוג. דרכי ההתערבות: שיקוף ופירוש, כולל זיהוי של תהליך מקביל.<\/li>\n<li><strong>איווי/תשוקה (מכיוון לקאניאני)<\/strong> – הפסיכולוג מכיר בתשוקות הפרטים כבעלות ערך לפרט וכמקור אפשרי לחיוניות ולהתחדשות של הארגון (לוי, 1996).<\/li>\n<li><strong>תפיסה פוסט-מודרנית<\/strong> – ערעור על אקסיומות, כמו עליונות המומחה וזהות בין בכירות לידע, וחשיפת האינטרסים החברתיים שמאחורי פרקטיקות, למשל מיון לפי אינטליגנציה.<\/li>\n<li><strong>\"גוף מתכלל\" / \"שער כניסה\"<\/strong> – מיצוב השפ\"ח כגוף שמרכז, מאגם ומסנן את כל השירותים הטיפוליים והתמיכתיים שנכנסים למערכת החינוך בעיר.<\/li>\n<li><strong>\"פורום תמיכה\"<\/strong> – צוות קבוע בכל בית ספר: מנהל, פסיכולוג חינוכי, יועצת ומורת שילוב. הוא ממפה צרכים, בוחן כניסה של גורמים טיפוליים, מפנה מקרים ועוקב אחרי ההתערבויות.<\/li>\n<li><strong>\"תפיסות נגזרות\" (אופיר, בעקבות בורדייה)<\/strong> – הפעולות המקצועיות בפועל משקפות תפיסות ערכיות, ולפעמים סותרות את הערכים שהאדם מצהיר עליהם.<\/li>\n<\/ul>","models":"<h3>1. ממדים להבחנה בין פרופסיות<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>ממד<\/th>\n<th>הגדרה<\/th>\n<th>דוגמאות מהמאמר<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>גוף ידע עיוני ומעשי<\/td>\n<td>עד כמה העולם התיאורטי ברור, מובחן ועצמאי<\/td>\n<td>רפואה ופסיכולוגיה מובחנות. סיעוד נשען על רפואה. עבודה סוציאלית נשענת על דיסציפלינות שונות.<\/td>\n<\/tr>\n<tr>\n<td>חוזק הקוד האתי<\/td>\n<td>עיסוק בכללי התנהגות ראויים וסנקציות אפקטיביות<\/td>\n<td>רפואה ופסיכולוגיה (סודיות, חובה ליידע על חלופות טיפוליות). באקדמיה הקוד פחות חד.<\/td>\n<\/tr>\n<tr>\n<td>סוציאליזציה מקצועית<\/td>\n<td>הגדרת ההכשרה, משכה ומנגנוני הפיקוח עליה<\/td>\n<td>הדוקה בעריכת דין, ברפואה ובפסיכולוגיה. לא מוגדרת בהייטק.<\/td>\n<\/tr>\n<tr>\n<td>עיסוק בביקורת עצמית (מוצע)<\/td>\n<td>השקעה בחקירת הערכים החברתיים ובבחינת הנחות היסוד<\/td>\n<td>בזרם הפסיכואנליטי: בחינת תולדות הפסיכואנליזה וזיקתה לתרבות (מיטשל; מיטשל ובלאק).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>2. שאלות יסוד שהמאמר מציב לפרופסיה<\/h3>\n<ol>\n<li>למי מחויבים הפסיכולוגים החינוכיים, כלומר מי הלקוחות?<\/li>\n<li>מהן הפרקטיקות המרכזיות? איך מתחלק משאב הזמן, ואילו ערכים משתקפים בבחירות האלה?<\/li>\n<li>איך הפסיכולוגים ממקמים את עצמם מול אנשי מקצוע אחרים: מנהלים, מורים, מטפלים פרא-רפואיים ו\"פרילנסרים\"?<\/li>\n<li>האם הם במרכז העשייה החינוכית או בפריפריה שלה? האם ההתמקמות הזאת מכוונת, או שהיא תוצאה של חולשה או של הכשרה חסרה?<\/li>\n<li>האם ראוי לתת שירות פסיכולוגי באופן אוטומטי, לפי תקן כמו מורים? או רק בעקבות פנייה מודעת של המערכת, עם חוזה על סל השירותים והתחייבות שלה לתנאים מינימליים, כמו בפסיכותרפיה?<\/li>\n<\/ol>\n<h3>3. מרכיבי העבודה סביב אבחון והשמה (רשימת המאמר)<\/h3>\n<p>בירור פניות; מפגשים עם הורים; איסוף מידע מגו
