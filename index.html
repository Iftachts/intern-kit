ללים שמנחים את אופן הפעולה של שני המשתתפים: אסוציאציות חופשיות וקשב מרחף (\"הצמד הפרוידיאני\").<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<p><strong>חמשת מרכיבי החוזה הטיפולי (לפי הסדר המומלץ):<\/strong><\/p>\n<ol>\n<li><strong>הסדרי תשלום<\/strong>\n        - תעריף הפגישות. יש עמדות שונות: \"ביקוש והיצע\" (המחברת אינה מסכימה); אייסלר: התחשבות במטופל, ולעיתים טיפול בתשלום נמוך או ללא תשלום; לאנגס: תעריף קבוע לכולם, הפניה למטפל זול יותר במידת הצורך, ואם בכל זאת ניתנה הנחה, אין לומר שזו הנחה. הנחה ניתנת רק אחרי בירור המצב הכלכלי, סדרי העדיפויות וההתנהלות הכלכלית, אחרת המטפל עלול לחוש מרומה. פתרון ותיק: עבודה במרפאה ציבורית כמה שעות בשבוע, שמפרידה בין הרצון לעזור לבין הפרנסה.\n        - חיוב על פגישות מוחמצות. המחברת תומכת בחיוב מלא. בכל מקרה יש להבהיר את המדיניות בשלב החוזה.\n        - מועדי התשלום ואופנו (בכל פגישה או פעם בחודש). כדאי לגבות <strong>בתחילת הפגישה<\/strong>, כדי שתהיה אפשרות לעבד בתוך הפגישה כל הפרה או תגובה.<\/li>\n<li><strong>הסדרי זמן<\/strong>\n        - תכיפות: מינימום של פגישה אחת בשבוע. קרנברג שולל פחות משתי פגישות בשבוע. פעמיים בשבוע עדיף, אבל יש להתחשב ביכולות ובקשיים של המטופל. במחקרי הגישה התקשורתית נמצא שפעם או פעמיים בשבוע היא התכיפות המיטבית.\n        - משך: 45–50 דקות, בדיוק (\"לא דקה פחות ולא דקה יותר\"). גמישות רק במצבים חריגים של פתולוגיה קשה או רגרסיה חריפה.\n        - מועד: יום ושעה קבועים, שיש לציין במפורש. הקביעות משפיעה על מהימנות המטפל ועל \"המרחב\" הטיפולי.\n        - חגים, מועדים וחופשות: כל היעדרות צפויה נאמרת מראש. לאנגס ממליץ על הודעה של שמונה שבועות לפחות.<\/li>\n<li><strong>הסודיות המקצועית וגבולותיה<\/strong>: התחייבות מפורשת לסודיות, עם ציון ההגבלות בחוק. את החריגים מפרטים רק אם המטופל שואל. יש לציין גם את ההתייעצות עם עמיתים בעילום שם.<\/li>\n<li><strong>כלל היסוד או עיקרון מנחה חלופי<\/strong>: הסבר על חלקו של המטופל בעבודה. אסוציאציות חופשיות (פרויד), או עיקרון אחר שתואם את שיטת המטפל.<\/li>\n<li><strong>ציון קיומם של כללי מסגרת נוספים<\/strong>: לא מפרטים את כולם. אומרים שיש עוד, ושהם יוסברו כשיתעורר צורך (פרויד 1913, Etchegoyen 1991, Ogden 1996). דוגמה: סודיות מצד המטופל.<\/li>\n<\/ol>\n<p><strong>עקרונות נוספים במערך הטיפולי (רובם מחייבים את המטפל):<\/strong> איפוק אופטימלי; אנונימיות יחסית; שמירה על קור-רוח; קשב מרחף בצורה שווה או קשב נינוח; ביטוי במילים ולא בפעולה; הדדיות א-סימטרית; אקסקלוסיביות הקשר הטיפולי; מהימנות המטפל.<\/p>\n<p><strong>ההיבטים המעשיים של עריכת החוזה:<\/strong><\/p>\n<ol>\n<li>עיתוי ומשך:\n        - בדרך כלל, מרגע שהפונה הציג את הבעיה והמטפל מתרשם שהוא יכול לעזור. לפעמים זה קורה כבר אחרי כחצי שעה.\n        - כשיש ספק לגבי ההתאמה לטיפול, הבירור נמשך יותר. יומנס ועמיתיו (בטיפול בהפרעת אישיות גבולית) מקדישים זמן רב לבדיקה אם המטופל יקבל את תנאי החוזה.\n        - מטופל שאינו מסוגל לערוך חוזה: מציינים את הצורך ודוחים, או עורכים \"חוזה ביניים\" בסיסי שישתנה בהמשך.\n        - מטופל עם כוחות סבירים: החוזה נערך בסוף שלב ההערכה וההמלצה, על סף תחילת הטיפול.\n        - בעיתות משבר: חוזרים על כללים, ולעיתים מרעננים או משנים אותם, תוך התייחסות לצורך בשינוי.<\/li>\n<li>אופן ההצגה: יש מחלוקת. Etchegoyen ו-Langs מעדיפים חוזה ברור גם אם ארוך, וקרנברג, בוש ויומנס מעדיפים חוזה פשוט וקצר. אפשר לשלב: חוזה קצר ופשוט שלא מייגע את הפונה, אבל ברור מספיק כדי שיוכל לבדוק אם הוא מסכים לו.<\/li>\n<\/ol>\n<p><strong>דוגמה קלינית:<\/strong> מטופלת ביקשה להקדים פגישה והודתה על כך. במהלך הפגישה עלו בהעברה רגשותיה כלפי הרחמים של הוריה וכלפי חוסר יכולתה לעמוד ביעדים שהיא מציבה לעצמה. ההיענות לבקשה סייעה לדפוס של העמסת יתר. כשהמטפל הוא שמשנה את מועד הפגישה, המטופל מתקשה להשתמש בה ביעילות.<\/p>","practice":"<ul>\n<li>הכן/י \"רשימת חוזה\" לפגישה הראשונה: מועד קבוע, משך, תכיפות, ביטולים והיעדרויות (ומה המדיניות לגביהם בשירות), חופשות וחגים, סודיות וגבולותיה, הדרכה והתייעצות, ההסבר על חלקו של המטופל (\"עיקרון מנחה\"), ומשפט על כך שיש כללים נוספים שיוסברו בהמשך.<\/li>\n<li>ספר/י למטופל או להורים מראש שאת/ה מתייעץ/ת בהדרכה בעילום שם. זה חלק מהסודיות ולא חריגה ממנה.<\/li>\n<li>היה/י מדויק/ת בזמנים: התחל/י וסיים/י בזמן. הודע/י מראש על כל היעדרות צפויה (חגים, חופשות, ימי השתלמות).<\/li>\n<li>כשמטופל מאחר, מבטל או מבקש לשנות סטינג, התייחס/י לכך כחומר טיפולי ולא רק כעניין טכני. היענות \"נדיבה\" עלולה לגרור \"ביטויים שליליים מוצפנים\", ולכן הקשב/י לחומר שעולה אחריה.<\/li>\n<li>אל תניח/י שהסכמה בפגישה הראשונה היא הסכמה אמיתית. כשיש הפרה, חזור/חזרי לחוזה באמצעות פירוש ושמירת מסגרת, ורענן/י אותו לפי הצורך.<\/li>\n<li>בדוק/בדקי באיזה חוזה את/ה עובד/ת: האם הוא משרת את התהליך (רציונלי), את הנוחות שלך (סמכותי) או את הרצון לרצות (דמגוגי)?<\/li>\n<li>כשהמטופל עדיין לא מסוגל לחוזה מלא (משבר, בלבול), ערוך/ערכי \"חוזה ביניים\" בסיסי וציין/י שיתעדכן.<\/li>\n<li>התאם/י את החוזה לשירות הציבורי: הדיון על תעריפים מתייחס לפרקטיקה פרטית, אבל העיקרון (מסגרת ברורה, מדיניות ביטולים מוצהרת, דיון על הפרות בתוך הטיפול) רלוונטי גם בשפ\"ח.<\/li>\n<\/ul>","questions":"<ol>\n<li>איך הצגתי את החוזה בטיפולים שהתחלתי השנה? מה השמטתי (מדיניות ביטולים, חופשות, התייעצות), ומה ההשלכות?<\/li>\n<li>האם החוזה שלי קרוב יותר לרציונלי, לסמכותי או לדמגוגי? באילו מצבים אני נוטה לרצות (שינויי זמן, הארכת פגישה)?<\/li>\n<li>מה ההבדל בין מה שהמטופל אמר על שינוי מסגרת לבין מה שהופיע אחר כך בחומר שלו (תודה מודעת מול \"ביטויים מוצפנים\")?<\/li>\n<li>מהו \"העיקרון המנחה\" שאני מציג/ה למטופל, ובמיוחד לילד או להורה? האם הוא תואם את האופן שבו אני באמת עובד/ת?<\/li>\n<li>איך מתרגמים את רעיון החוזה לעבודה בשפ\"ח, שבה הטיפול ללא תשלום ומעורבים בה גם הורים ובית ספר?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"עריכת החוזה הטיפולי איננה עניין פשוט של טכניקה שצריך לשלוט בה, אלא כרוכה בהבנה של מהות הפסיכותרפיה הפסיכו דינמית והיצמדות אליה\" (Yeoman et al., כפי שמצוטט)<\/li>\n<li>\"כישלון האתיקה בפסיכואנליזה אחת דינו להוביל לכישלון טכני...\" (Etchegoyen, 1991, כפי שמצוטט)<\/li>\n<li>\"חריגות מהקביעות, יזכו בדרך כלל לתגובות חיוביות מודעות אולם לביטויים שליליים מוצפנים.\"<\/li>\n<li>\"בעיקרון, כל היעדרות ופספוס של פגישה שיכול להיצפות מראש- ראוי לאומרו מראש!\"<\/li>\n<\/ul>"},"level":"שנה א'","stype":"ספר (סיכום פרק)","tldr":"הפרק מגדיר את החוזה הטיפולי כ\"הסכם עבודה\" בין המטפל למטופל על הכללים המינימליים שהתהליך הטיפולי צריך כדי להתפתח. רק חלק מהכללים האלה מנוסחים במפורש. קלנר ממקמת את החוזה בתוך \"הסיטואציה הטיפולית\", שכוללת את התהליך הטיפולי (לב העניין) ואת המערך…","search":"הפרק מגדיר את החוזה הטיפולי כ\"הסכם עבודה\" בין המטפל למטופל על הכללים המינימליים שהתהליך הטיפולי צריך כדי להתפתח. רק חלק מהכללים האלה מנוסחים במפורש. קלנר ממקמת את החוזה בתוך \"הסיטואציה הטיפולית\", שכוללת את התהליך הטיפולי (לב העניין) ואת המערך הטיפולי (frame), שנועד לשרת את התהליך. למערך מיוחסות פונקציות פטרנליות (גבולות, עימות עם המציאות) ופונקציות מטרנליות (החזקה והגנה). הגישה התקשורתית של לאנגס מדגישה את הרגישות של המערכת הלא מודעת לשמירה על המסגרת ולהפרתה. לפי אטשגוז'ן יש שלושה סוגי חוזים: רציונלי, סמכותי ודמגוגי. השאיפה היא לחוזה רציונלי, הוגן ואתי, כי \"כישלון האתיקה... להוביל לכישלון טכני\". הפרק מפרט חמישה מרכיבים: הסדרי תשלום (תעריף, חיוב על פגישות מוחמצות, מועד ואופן תשלום), הסדרי זמן (תכיפות, משך, מועד קבוע, חגים וחופשות), סודיות וגבולותיה, כלל היסוד (אסוציאציות חופשיות) או עיקרון מנחה חלופי, וציון קיומם של כללי מסגרת נוספים. בסוף הוא דן בעיתוי עריכת החוזה (בדרך כלל בסוף שלב ההערכה) ובשאלה אם להציג חוזה קצר או מפורט. ההסכמה של מטופל בתחילת הדרך אינה תמיד אמיתית, והפרה של החוזה היא חומר טיפולי ולא שחרור מאחריות. החוזה אינו \"טכניקה\" בלבד. צריך להבין את התפקיד המתודי של כל אחד ממרכיביו בתוך הסיטואציה הטיפולית ובתוך מהות הפסיכותרפיה הדינמית (Yeoman et al.). החוזה נערך כשהמטופל חרד, מבולבל ואמביוולנטי, ולכן אין לפרש את הסכמתו \"כפשוטה\". הפרת כללים אינה משחררת את המטפל מאחריותו. היא מסמנת סטייה, ואליה חוזרים באמצעות מהלכים פרשניים ומהלכים של שמירת מסגרת. אפשר לחזור לחוזה, להשלים אותו, להתאים אותו ו\"לרענן\" אותו לאורך כל הטיפול. התהליך הטיפולי מבוסס על התפתחות אמון, הפחתת חרדה ותחושת ביטחון. אלה מאפשרים ירידה בהגנתיות, רגרסיה טיפולית והעברה. במקביל מתפתחות הברית הטיפולית והפנמת הפונקציה הטיפולית, וכל אלה מובילים לאינטרוספקציה, לפירוש ולתובנה. רוב הגישות (קלאסית ורומנטית, קונפליקט וחסר) רואות במערך הטיפולי רכיב חיוני ואף בעל השפעה מרפאת בפני עצמו (Modell). יחסו של המטפל למסגרת הוא \"יסוד בעל משקל כבד\" בתהליך השינוי. לפי לאנגס, המערכת הלא מודעת העמוקה רגישה מאוד לשמירה על מסגרת ולהפרתה, בעוד שהמערכת המודעת נוטה לזלזל בכללים. לכן שינויים \"לטובת\" המטופל זוכים לתודה מודעת אבל ל\"ביטויים שליליים מוצפנים\". כלל החיוב המלא על פגישות מוחמצות הוא \"הכלל הקשה ביותר לקבלה\" גם למטפלים וגם למטופלים. בכל זאת המחברת רואה בו יסוד של מסגרת בטוחה. כך או כך, את המדיניות צריך לומר בבירור בשלב החוזה. הקפדה על זמנים, \"לא דקה פחות ולא דקה יותר\", חשובה מאוד ברמה הלא מודעת. מטופלים בוחנים את המטפל בעניין הזמנים, ולוויניקוט ההקפדה על תחילת הפגישה וסופה היא ביטוי ל\"שנאה האובייקטיבית\" (הטיפולית) של המטפל. המטפל מתחייב במפורש לסודיות ומציין שיש לה הגבלות בחוק. את המקרים החריגים מפרטים רק אם המטופל שואל. כדאי לומר כבר בשלב החוזה שהמטפל נוהג להתייעץ עם עמיתים בעילום שם. אין להציף את המטופל בכל כללי המערך. אומרים את כללי היסוד, מציינים שיש עוד עקרונות שיוסברו כשיהיה צורך, וכך מעבירים מסר מובלע שהמטפל עובד לפי שיטה ידועה מראש. רוב העקרונות הנוספים מחייבים דווקא את המטפל. חוזה טיפולי – הסכם בין המטפל למטופל על הגבולות והמסגרת (המערך הטיפולי). רק חלקו מנוסח במפורש. חוזה רציונלי / סמכותי / דמגוגי (אטשגוז'ן) – חוזה שמותאם למה שעדיף לתהליך / חוזה שמקדים את נוחות המטפל למשימה הטיפולית / חוזה שמרצה את המטופל על חשבון המשימה. סיטואציה טיפולית – מכלול התופעות של היחס הטיפולי. כוללת את המערך הטיפולי ואת התהליך הטיפולי. תהליך טיפולי – לב הסיטואציה: סדרה של התרחשויות ושינויים הדרגתיים בדרך למטרות הטיפול. מערך טיפולי (frame) מול מסגרת טיפולית (setting) – הכותבת מבחינה ביניהם. \"מערך\" הוא \"דברים שנערכו יחדיו בסדר מסוים\" וכולל גם גבולות מסגרת וגם כללי הנחיה. פונקציות פטרנליות ומטרנליות של המערך – פטרנליות: חוקים וגבולות שמבחינים, מארגנים ומעמתים עם המציאות. מטרנליות: \"החזקה\" והגנה שמאפשרות התפתחות \"העצמי האמיתי\". הגישה התקשורתית (Langs) – גישה שמייחסת למערך ולכללי היסוד תפקיד מכריע, בגלל רגישות המערכת הלא מודעת לשמירתם או להפרתם. כלל היסוד (אסוציאציות חופשיות) – \"לומר כל מה שבדעתו ועל ליבו, בלי עריכה ובלי סלקציה\". לפי פרויד, כל שאר הכללים נועדו לאפשר אותו. עיקרון מנחה חלופי – למטפל שאינו מקבל את האסוציאציות החופשיות ככלל יסוד (אוגדן רואה בהפיכתן לכלל \"מעשה אנטי טיפולי\"). זה עיקרון אחר שמסביר למטופל את תפקידו, ויש לכלול אותו בחוזה. \"הצמד הפרוידיאני\" (בולאס) – כלל האסוציאציות החופשיות יחד עם כלל הקשב המרחף. נזילה בטיפול – לפי פרויד: כשמטופל משוחח על הטיפול עם חבר, \"ידלוף דווקא המיטב\". מכאן שאלת הסודיות מצד המטופל."},{"id":"dorhaim2013","title":"בית הספר כמערכת מורכבת","authors":"פ' דור-חיים","year":"2013","cite":"דור-חיים, פ' (24 בפברואר 2013). בית הספר כמערכת מורכבת. פסיכולוגיה עברית.","url":"https://www.hebpsy.net/articles.asp?id=2926","kind":"article","desc":"מאמר על התבוננות בבית הספר כמערכת מורכבת ועל המשמעות של מבט זה לעבודת הפסיכולוג.","urlLabel":"המאמר באתר פסיכולוגיה עברית","placements":[["s2","system"]],"extra":false,"ref":"דור-חיים 2013","inFolder":false,"tldr":"מאמר על התבוננות בבית הספר כמערכת מורכבת ועל המשמעות של מבט זה לעבודת הפסיכולוג.","search":"מאמר על התבוננות בבית הספר כמערכת מורכבת ועל המשמעות של מבט זה לעבודת הפסיכולוג."},{"id":"gaon2021","title":"מודל מח\"ר (מרחב חשיבה רב-מקצועי) בית ספרי","authors":"ע' גאון-הרשקו","year":"2021","cite":"גאון-הרשקו, ע' (5 בדצמבר 2021). מודל מח\"ר (מרחב חשיבה רב-מקצועי) בית ספרי: עבודה מערכתית של הפסיכולוג החינוכי בעזרת גישת המנטליזציה. פסיכולוגיה עברית.","url":"https://www.hebpsy.net/articles.asp?id=4245","kind":"article","desc":"מודל לעבודה מערכתית שמבוסס על גישת המנטליזציה: מרחב חשיבה רב-מקצועי קבוע בבית הספר.","urlLabel":"המאמר באתר פסיכולוגיה עברית","placements":[["s2","system"]],"extra":false,"ref":"גאון-הרשקו 2021","inFolder":false,"tldr":"מודל לעבודה מערכתית שמבוסס על גישת המנטליזציה: מרחב חשיבה רב-מקצועי קבוע בבית הספר.","search":"מודל לעבודה מערכתית שמבוסס על גישת המנטליזציה: מרחב חשיבה רב-מקצועי קבוע בבית הספר."},{"id":"yablon2017","title":"מה ל\"תסריטים נרקיסיסטיים של המורות\" ולעבודה מערכתית","authors":"י' יבלון","year":"2017","cite":"יבלון, י' (5 בספטמבר 2017). מה ל\"תסריטים נרקיסיסטיים של המוֹרוּת\" ולעבודה מערכתית. פסיכולוגיה עברית.","url":"https://www.hebpsy.net/articles.asp?id=3585","kind":"article","desc":"מאמר שמחבר בין התסריטים הנרקיסיסטיים שבתפקיד המורה לבין העבודה המערכתית של הפסיכולוג.","urlLabel":"המאמר באתר פסיכולוגיה עברית","placements":[["s2","system"]],"extra":false,"ref":"יבלון 2017","inFolder":false,"tldr":"מאמר שמחבר בין התסריטים הנרקיסיסטיים שבתפקיד המורה לבין העבודה המערכתית של הפסיכולוג.","search":"מאמר שמחבר בין התסריטים הנרקיסיסטיים שבתפקיד המורה לבין העבודה המערכתית של הפסיכולוג."},{"id":"luria2011","title":"תפיסת ההדרכה האישית למנהלי בתי ספר בראשית דרכם","authors":"איתמר לוריא, אריאל לוי ומתי בן צור","year":"2011","cite":"לוריא, א', לוי, א' ובן צור, מ' (2011). תפיסת ההדרכה האישית למנהלי בתי ספר בראשית דרכם. אבני ראשה.","url":"https://avneyrosha.org.il/Role/Documents/principal_tutoring.pdf","kind":"article","desc":null,"urlLabel":"המסמך באתר אבני ראשה (PDF)","file":{"orig":"תפיסת ההדרכה האישית למנהלים חדשים.pdf","ext":"pdf","pdf":"luria2011.pdf","pages":23,"bytes":429236},"placements":[["s2","system"]],"extra":false,"ref":"לוריא ועמיתיו 2011","inFolder":true,"srcTitle":"תפיסת ההדרכה האישית למנהלי בתי ספר בראשית דרכם","secs":{"abstract":"<p>הפרק מציג את התפיסה של מכון אבני ראשה להדרכה אישית של מנהלי בתי ספר חדשים. נקודת המוצא היא שהמנהל החדש \"קופץ לתוך המים הסוערים\", ונדמה שמשימתו העיקרית היא לשרוד. הוא מוצף ונקרע בין היבטי התפקיד, ובסופו של דבר נושא לבדו באחריות שאינה ניתנת לחלוקה. ההדרכה מוצגת כמסגרת למידה יציבה, שבנויה מ\"תיבה\" (גבולות פורמליים: מועדים, משך, חיסיון) ומ\"תבנית פעילה\" (שיח פתוח שמבוסס על צורכי המודרך). היא נבדלת מהיוועצות ואינה נועדה למצבי חירום. מרחב ההדרכה נבנה משלושה היבטים: ההדרכה כ\"מרחב פוטנציאלי\" במובן של ויניקוט, כלומר מקום למשחק וליצירתיות; המרחב הדיאלוגי לפי בובר, שבו המדריך נושא באחריות לדיאלוג; ו\"האומנות והליריקה\" של ההדרכה, לפי דנה אמיר. לצד אלה הפרק משתמש בשלושת סוגי ההתייחסות של קוהוט (מראה, האדרה ותאומות). הכותבים מציעים \"סכֵמת השלם ההדרכתי\" כמצפן מול \"הדיקטטורה של המיידי\". הסכֵמה כוללת שלושה מעגלים: יעדים ניהוליים ותפקודיים, תמונה שלמה של בית הספר, והתפתחות המנהל כאדם בתפקידו. הפרק מתאר גם שלוש עמדות של המדריך (מאחורי המנהל, לפניו ולצדו) ודן בחסימות ביחסי ההדרכה. לאורך הפרק מובאות ארבע דוגמאות מהשטח.<\/p>","ideas":"<ul>\n<li>ניהול בית ספר הוא אתגר רב-ממדי שחושף את המנהל ל\"הצפה תפקודית והיקרעות\". האחריות הכוללת רובצת עליו לבדו ואינה ניתנת לחלוקה. המנהל החדש נכנס לבית ספר שהחליף מנהל: הצוות חרד, הקהילה בוחנת, והמנהל עצמו עוד מגבש את זהותו הניהולית.<\/li>\n<li>המסגרת היא תנאי ללמידה. לפי גרין (2008), שמשאיל את המושגים ממסגרת טיפולית, למסגרת יש שני חלקים: \"התיבה\" (מספר הפגישות, אורכן, תכיפותן ומגבלות החיסיון) ו\"התבנית הפעילה\" (אופן הפעולה, השיח הפתוח). העמידות של התיבה מאפשרת לתבנית הפעילה לפעול במיטבה. גם דייקנות המדריך, הקפדתו על קיום המפגשים ושמירתו על פרטיות המודרך מייצבות את המסגרת.<\/li>\n<li>הדרכה אינה היוועצות. חקר האירועים הוא נדבך בהתפתחות המנהל ולא מטרה סופית, וההדרכה אינה מסגרת למענה על מצבי חירום. המדריך משתמש באירוע הספציפי כדי לעסוק בתהליך ההתפתחות של המנהל לאורך זמן.<\/li>\n<li>ההדרכה היא \"מרחב פוטנציאלי\" (ויניקוט), שמחייב סביבה מאפשרת: מוגנת, לא שיפוטית ובלי לחץ מיידי למעשיות. בה המודרך יכול \"לשחק\" ולהיות יצירתי. גם המדריך צריך להיות מסוגל לשחק ולהרפות מאחיזה ברעיון, בלי צורך לעצב את המנהל בדמותו. לפעמים המנהל צריך קודם \"לשחק לבד בנוכחות\" המדריך.<\/li>\n<li>הפרדוקס הוויניקוטיאני חל על המנהל החדש: הוא מגיע לבית ספר קיים, ובו בזמן לבית ספר שעליו לגלות ו\"לברוא\". רק כשההצפה הראשונית פוחתת המנהל מסוגל להשתמש בהדרכה כמרחב משחק.<\/li>\n<li>הדיאלוג (בובר) הוא זירת הפעולה המרכזית. בדיאלוג החינוכי ההדדיות אינה סימטריה באחריות: המדריך אחראי ליצור את תנאי הדיאלוג, ובמקביל עליו להיות מוכן לוותר על שליטה ולא לכפות \"פרוטוקול\".<\/li>\n<li>שלושת סוגי ההתייחסות של קוהוט מזינים את \"העצמי הניהולי\" המתפתח: מראה (שיקוף), האדרה (הכרה בכוחות ובערכים, לא התפעלות ריקה) ותאומות (חוויה משותפת שמפיגה את בדידות המנהל).<\/li>\n<li>לפי דנה אמיר, המנהל אינו \"לוח חלק\". יש בו יסודות מתמשכים (פרוזאיים) ויסודות מתהווים (פואטיים), והמדריך מצטרף ליסוד הלירי, כלומר לעיבוד התנועה ביניהם. \"יעדו של המדריך איננו לשכפל מנהלים בדמותו\".<\/li>\n<li>\"סכֵמת השלם ההדרכתי\" היא מצפן שמאפשר לבחון את הצרכים המיידיים מול מטרת ההדרכה השלמה, ולשים לב גם למה שנמנעים מלהעלות. מעגל היעדים נוטה להידחק באופן מוסווה, למשל דרך עיסוק יתר במאבקי כוח, ועל המדריך לוודא שההדרכה לא תפסח עליו.<\/li>\n<li>רגשות המנהל ותגובותיו הם כלי עבודה. לעתים הם \"ברומטר\" לתנודות בדינמיקה הבית-ספרית, ומשקפים את הלך הרוח של הצוות.<\/li>\n<li>יחסי ההדרכה עצמם צריכים להיות נושא להדרכה. תהליכים סמויים בין המדריך למודרך יכולים לחסום את ההדרכה (Lester &amp; Robertson, 1995), ו\"טעות אפשרית של המדריך חמורה פחות מהפחד שלו להתמודד עמה בשיח גלוי\". המדריך בוחר בגמישות בין שלוש עמדות: מאחורי המנהל, לפניו ולצדו.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>התיבה / התבנית הפעילה<\/strong> (גרין, 2008) – שני מרכיבי המסגרת. התיבה היא הגבולות הפורמליים והמבניים (מספר פגישות, אורכן, תכיפותן, חיסיון). התבנית הפעילה היא אופן הפעולה בתוך המסגרת (שיח פתוח, דיאלוג מכוון לפיתוח).<\/li>\n<li><strong>הדרכה לעומת היוועצות<\/strong> – בהדרכה חקר האירועים הוא אמצעי להתפתחות המנהל ולא מטרה סופית. היא אינה מסגרת למצבי חירום.<\/li>\n<li><strong>מרחב פוטנציאלי<\/strong> (ויניקוט) – מרחב ביניים בין הפנים לחוץ, בין הממשי למדומיין. בו נבנית חוויית העצמי דרך השתהות ומשחק, והוא מחייב \"סביבה מאפשרת\".<\/li>\n<li><strong>משחק בהדרכה<\/strong> – מצב שבו המודרך (וגם המדריך) יכול להיות יצירתי, לנסות פתרונות ועמדות. היכולת לשחק לבד בנוכחות המדריך קודמת למשחק בשניים.<\/li>\n<li><strong>הפרדוקס הוויניקוטיאני<\/strong> – המנהל מגיע לבית ספר קיים, ועליו לחוות אותו כאילו הוא בורא אותו.<\/li>\n<li><strong>דיאלוג מצמיח / \"חלל ביניים\"<\/strong> (בובר) – מפגש פתוח עם האחר, עם נכונות להשפיע ולהיות מושפע. בדיאלוג החינוכי האחריות אינה סימטרית.<\/li>\n<li><strong>שלוש התייחסויות לעצמי<\/strong> (קוהוט, 1977) – מראה (mirroring), האדרה (אידיאליזציה) ותאומות.<\/li>\n<li><strong>פרוזאי / פואטי / לירי<\/strong> (דנה אמיר, 2008) – היסודות המתמשכים, היסודות המתהווים, ועיבוד התנועה ביניהם. המדריך מצטרף ליסוד הלירי.<\/li>\n<li><strong>סכֵמת השלם ההדרכתי<\/strong> – מדריך ומנהל במרכז, ושלושה מעגלים סביבם: יעדים ניהוליים ותפקודיים, תמונה שלמה של בית הספר, התפתחות המנהל כאדם בתפקידו.<\/li>\n<li><strong>\"דיקטטורה של המיידי\" / \"כיבוי שרפות\"<\/strong> – הסכנה שההדרכה, כמו הניהול, תשתעבד ללחצים דחופים על חשבון התפתחות ארוכת טווח.<\/li>\n<li><strong>עמדות המדריך<\/strong> – מאחורי המנהל (\"נותן גב\", המנהל הוא בעל המצפן), לפניו (המדריך מציע את המצפן שלו, במשורה) ולצדו (מצפן משותף, שיח שיתופי).<\/li>\n<li><strong>\"העצמי הניהולי\"<\/strong> – הזהות הניהולית המתהווה של המנהל, שההדרכה נועדה לטפח.<\/li>\n<\/ul>","models":"<p><strong>1. מסגרת ההדרכה: מרכיבים<\/strong><\/p>\n<ul>\n<li>המסגרת הפיזית: מועדים, מקום, משך.<\/li>\n<li>גבולות החיסיון והפרטיות. אם הסודיות מוגבלת, מגדירים את המגבלות בבהירות כבר במפגשים הראשונים, כחלק מ\"התיבה\".<\/li>\n<li>תבנית העבודה במפגשים.<\/li>\n<li>התנהלות המדריך: דייקנות, הקפדה על קיום המפגשים, שמירה על פרטיות המודרך וכנות השיח.<\/li>\n<li>השאיפה: רצף, יציבות, ביטחון ומחויבות להתפתחות המנהל.<\/li>\n<\/ul>\n<p><strong>2. שלושה היבטים שמבנים את מרחב ההדרכה<\/strong><\/p>\n<ol>\n<li>ההדרכה כ\"מרחב פוטנציאלי\"<\/li>\n<li>המרחב הדיאלוגי בהדרכה<\/li>\n<li>האומנות והליריקה של ההדרכה<\/li>\n<\/ol>\n<p><strong>3. מאפייני \"סביבה מאפשרת\" למרחב פוטנציאלי (לפי ויניקוט, כפי שמובא בפרק)<\/strong><\/p>\n<ul>\n<li>היא מוגנת ומציעה \"תשתית של ביטחון\".<\/li>\n<li>היא אינה שיפוטית.<\/li>\n<li>יש בה השהיה של בחינת המעשיות והפרקטיות של רעיונות.<\/li>\n<li>היא אינה משועבדת לדחף הרסני, אגרסיבי או אחר.<\/li>\n<li>האחראי (הורה, מורה, מנהל, מדריך) מכיר בפגיעותו של מי שנמצא במרחב המעברי ומגן עליו.<\/li>\n<li>כשהמשחק אינו אפשרי, עבודת המדריך מכוונת להביא את המודרך ממצב של אי-יכולת לשחק למצב של יכולת לשחק.<\/li>\n<\/ul>\n<p><strong>4. שלוש התייחסויות של קוהוט שמזינות את העצמי הניהולי<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>התייחסות<\/th>\n<th>מה המדריך עושה<\/th>\n<th>תרומה למנהל<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>האחר כמראה<\/td>\n<td>רואה את המנהל כפי שהוא ומשקף את מעשיו ותחושותיו<\/td>\n<td>מגדיר ומתקף אותם, עוגן להגדרת העצמי הניהולי<\/td>\n<\/tr>\n<tr>\n<td>האחר כמקור להאדרה<\/td>\n<td>מכיר ביכולות, בכוונות ובערכים של המנהל (לא התפעלות ריקה)<\/td>\n<td>בונה אופק שאיפות. עם הזמן משמש להובלת בית הספר לפי חזונו<\/td>\n<\/tr>\n<tr>\n<td>האחר כתאום<\/td>\n<td>חווה יחד עם המנהל בלבול, קושי, מתח והתרגשות<\/td>\n<td>מעצים את החוויה האישית ומפיג את בדידות המנהל<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>5. היסודות לפי דנה אמיר, והמדריך<\/strong><\/p>\n<ul>\n<li><strong>פרוזאי (מתמשך)<\/strong>: העמדות, הדעות, ההתנסויות ונטיות הלב שהמנהל מביא איתו: ניסיון כתלמיד, כמחנך וכבעל תפקידים, הכשרה פורמלית ומטען אישי.<\/li>\n<li><strong>פואטי (מתהווה)<\/strong>: התחושות והתגובות החדשות שעולות בתפקיד.<\/li>\n<li><strong>לירי<\/strong>: עיבוד התנועה בין השניים. המדריך מצטרף כאן כגורם חיצוני. הוא נותן לחוויות החדשות מקום, שם ומשמעות, ומגשר בינן לבין המוכר. הוא גם עוזר למנהל לעבד את ההיבטים המתמשכים כדי לאפשר אינטגרציה.<\/li>\n<\/ul>\n<p><strong>6. סכֵמת השלם ההדרכתי (תרשים בעמ' 15 בספר)<\/strong><\/p>\n<ul>\n<li><strong>במרכז<\/strong>: המדריך והמנהל.<\/li>\n<li><strong>מעגל: יעדים ניהוליים ויעדים תפקודיים<\/strong>: הגדרת היעדים (דינמיים, ובתחילה מותאמים לשלב הכניסה) ומנגנוני הפעולה להשגתם. היעדים נקבעים לפי מטרות מערכת החינוך ולפי חזון המנהל. מעגל זה נוטה להיעקף בהימנעות מוסווית, למשל בעיסוק יתר במאבקי כוח, ולכן המדריך צריך לוודא שעוסקים בו.<\/li>\n<li><strong>מעגל: תמונה שלמה של בית הספר<\/strong>: הכוחות הפועלים בבית הספר, החוזקות והחולשות, השגרות, תהליכי ההוראה והלמידה, העבודה בצוותים, היחס לפרט ואזורי הקושי. המנהל לומד לשאול שאלות ולזהות נתונים רלוונטיים: איך לומדים את התהליכים, אילו שגרות מלמדות על בית הספר, מה צורכי התלמידים ואיך המסגרת נענית להם.<\/li>\n<li><strong>מעגל: התפתחות המנהל כאדם בתפקידו<\/strong>: בהיבט הפסיכולוגי, התחום התוך-אישי והבין-אישי. בהיבט המקצועי, היכולות להוביל, להישען, לשתף פעולה, לנהל צוות וללמוד תוך כדי עשייה, וכן ניהול פדגוגי, ניהול רגשי וניהול המסגרת והשגרות.<\/li>\n<li><strong>בסיכום הפרק המעגלים מנוסחים כך<\/strong>: (1) המדריך מלווה את המנהל בפיתוח היכולות הניהוליות והזהות הניהולית שלו; (2) המדריך עוזר למנהל לראות תמונה שלמה ומערכתית של בית הספר, \"במה שמדובר וגם במה שלא מדובר\"; (3) המדריך חושב גם על המערכת הגדולה יותר שבית הספר וההדרכה פועלים בתוכה, ומבחינה זו הוא \"המשך זרועה של הרשות המתפקדת – המנהל\". המדריך בוחר את העיתוי להעלאת כל ממד. בתחילה הוא נושא באחריות לכיוון ההדרכה, ובמיטבה ההדרכה הופכת את המנהל לשותף במבט על השלם.<\/li>\n<\/ul>\n<p><strong>7. נקודות מרכזיות בהוראה ובלמידה למנהל בתחילת דרכו<\/strong><\/p>\n<ul>\n<li>להכיר את הישגי בית הספר ולמפות אותם.<\/li>\n<li>להכיר את תהליכי ההוראה והלמידה בבית הספר ולמפות אותם.<\/li>\n<li>להכיר את מערכת השעות ואת שיקול הדעת שבבנייתה.<\/li>\n<li>להנהיג תהליכי איסוף נתונים, מידע וידע (תצפית ומשוב).<\/li>\n<li>לברר מהי האידיאולוגיה שמנחה את ההוראה והלמידה.<\/li>\n<li>להכיר את תהליכי ההיוועצות והלימוד של המורים בסוגיות פדגוגיות.<\/li>\n<li>לשאוף לכך שארגון ההוראה והלמידה יתבסס על גישה פדגוגית-חינוכית (לקראת השנה השנייה).<\/li>\n<li>מומלץ שהציר התוכני של הובלת ההוראה והלמידה יהיה הציר שעליו מתקדמים בהדרכה: לסמן נקודת מוצא ולזהות סימני התקדמות.<\/li>\n<\/ul>\n<p><strong>8. שלוש עמדות של המדריך<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>עמדה<\/th>\n<th>מה קורה<\/th>\n<th>סכנות ונקודות לתשומת לב<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>מאחורי המנהל<\/td>\n<td>\"נותן גב\", מחזק ומוקיר. המנהל מוביל את השיחה ואת הניתוח ו\"הוא בעל המצפן\". זה שדה ניסוי להובלה ולגיבוש מצפן פנימי<\/td>\n<td>אם המדריך כמעט אף פעם לא בעמדה הזו, צריך לברר למה: חרדה של המנהל מהובלה (רבים היו סמכות רק לילדים), יראה כלפי המדריך, או חוסר אמון של המדריך ופחד לאבד סמכות<\/td>\n<\/tr>\n<tr>\n<td>לפני המנהל<\/td>\n<td>המדריך מציע את המצפן שלו: מורה דרך, מדגים ניתוח ובניית תוכנית<\/td>\n<td>במשורה. דומיננטיות מתמשכת, בעיקר של מדריך שהיה מנהל מצליח, \"עלולה לחבל אנושות\". ייתכן שהמודרך מפעיל את המדריך כדי לחמוק מאחריות. אז כדאי להעלות זאת לדיון או לשבור את הדפוס<\/td>\n<\/tr>\n<tr>\n<td>לצד המנהל<\/td>\n<td>שיתוף פעולה שוויוני ולא כוחני, מצפן משותף. המדריך הוא \"הרחבה של השיח הפנימי\" של המנהל<\/td>\n<td>סכנה של \"נינוחות מטעה\" והימנעות מנושאים כדי לשמור על ההרמוניה. אפשר לומר במפורש: \"אני מרגיש שאנחנו נמנעים מלדון בנושא X...\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>9. ארבע דוגמאות בפרק<\/strong><\/p>\n<ul>\n<li><strong>ג'<\/strong> (מעגל היעדים): מנהלת חדשה, רכזת מקצוע מצטיינת לשעבר, נאבקת במזכירה מאיימת. אחרי חודש וחצי המדריך מעיר שלא דיברו כלל על הפעולה החינוכית. המנהלת מבינה שמאבקי הכוח הרחיקו אותה מהובלה פדגוגית ובוחרת להתמקד ביעדים פדגוגיים.<\/li>\n<li><strong>א'<\/strong> (מעגל תמונת בית הספר): מנהל חטיבה \"במשבר\" מגיע עם תוכנית אינטרדיסציפלינרית שאפתנית ונתקל בהתנגדות. המדריך מכוון אותו להכיר את הצוות ואת תהליכי ההוראה. המנהל מגלה נשירה סמויה וקושי בכיתות הטרוגניות, מקים פורום חשיבה, ובשנה השנייה יוצר הקבצות שיש ביניהן מוביליות.<\/li>\n<li><strong>פ'<\/strong> (מעגל המנהל כאדם בתפקידו): מנהלת צעירה שקיבלה חפיפה של שעתיים בלבד. היא תופסת את יו\"ר ועד ההורים כדמות מיטיבה, ובישיבת הוועד הוא תוקף אותה. בהדרכה היא מזהה נטייה \"סוליסטית\", הימנעות משיתוף ותגובה של \"שליפת ציפורניים\" כשהיא מתאכזבת.<\/li>\n<li><strong>מנהל ותיק שמדריך מנהלת חדשה<\/strong> (חסימה ביחסי ההדרכה): המנהלת ממלאת את השעה בתלונות והמדריך מתוסכל ומזדהה עם הצוות נגדה. אחרי דיון בקבוצת ההדרכה הוא מעלה בגלוי את \"ההחמצה ההדדית\". מתברר שהיא מצפה מ\"הוותיקים\" להתגייס לעזרתה ומתקשה לקבל פיקוד. זו הייתה פריצת דרך ביחסי ההדרכה.<\/li>\n<\/ul>","practice":"<ul>\n<li><strong>בניית מסגרת עם המנהל או עם הצוות<\/strong>: להגדיר מראש \"תיבה\" (מועד קבוע, משך, גבולות החיסיון) כדי שתתאפשר \"תבנית פעילה\". למשל, לקבוע מראש מה מהשיחה עם המנהל יישאר חסוי ומה לא.<\/li>\n<li><strong>להבחין בין ייעוץ נקודתי לליווי<\/strong>: כשמנהל או מורה מביאים אירוע דחוף, להשתמש בו גם כדי לחשוב על דפוסים ועל התפתחות לאורך זמן, ולא רק לתת מענה מיידי.<\/li>\n<li><strong>להשתמש ב\"שלם ההדרכתי\" כצ'קליסט<\/strong> לשיחות עם המנהל: האם דיברנו על יעדים? על התמונה המלאה של בית הספר? על המנהל כאדם בתפקידו? ומה נמנעים מלהעלות?<\/li>\n<li><strong>לבחור עמדה במודע<\/strong> (מאחורי, לפני או לצד) מול המנהל או המורה, ולשים לב אם \"נתקעים\" בעמדה אחת. מתמחים נוטים לפעמים לעמדת \"המומחה מלפנים\" או לנינוחות \"לצד\" שנמנעת מקונפליקט.<\/li>\n<li><strong>לקרוא את רגשות המנהל<\/strong>, וגם את רגשותיך כלפי המנהל, כמידע מערכתי. תסכול, איום או רצון להסתגר יכולים לשקף הלך רוח בצוות.<\/li>\n<li><strong>כשקשר עבודה נתקע, להעלות אותו לשיחה גלויה<\/strong>, כמו בדוגמת \"ההחמצה ההדדית\", ולהביא אותו להדרכה. זה עדיף על הימנעות ששני הצדדים משתפים בה פעולה.<\/li>\n<li><strong>לזכור שהמנהל החדש מוצף<\/strong> ושבתחילה פנויותו לחשיבה נמוכה. כדאי להתאים את רמת הדרישה ולתת \"לשחק לבד בנוכחות\" לפני חשיבה משותפת.<\/li>\n<li><strong>לחשוב במקביל על ההדרכה של המתמחה עצמו<\/strong>: המושגים (מסגרת, מרחב פוטנציאלי, שיקוף, האדרה ותאומות, עמדות המדריך) שימושיים גם להבנת יחסי ההדרכה בהתמחות.<\/li>\n<\/ul>","questions":"<ol>\n<li>באיזו עמדה (מאחורי, לפני או לצד) אתה נמצא לרוב מול המנהל שאיתו אתה עובד? מה זה מלמד על הדינמיקה ביניכם ועל הצרכים שלו?<\/li>\n<li>אילו נושאים \"נעדרים\" מהשיחות שלך עם המנהל או עם הצוות, ואילו מנגנוני הימנעות מוסווית (למשל עיסוק במאבקי כוח או ב\"שריפות\") עשויים להסביר זאת?<\/li>\n<li>איך נראית ה\"תיבה\" של הקשר שלך עם המנהל: מועדים, חיסיון, קביעות? האם היא מאפשרת \"תבנית פעילה\"?<\/li>\n<li>אילו מרגשותיך כלפי המנהל או בית הספר עשויים להיות \"ברומטר\" לתהליכים בצוות?<\/li>\n<li>בהדרכה שלך כמתמחה, איפה אתה חווה שיקוף, האדרה או תאומות, ואיפה חסר לך אחד מהם?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"אחריות זו, במובנה העמוק, רובצת על כתפיו של המנהל לבדו, כעומד בראש הפירמידה הבית-ספרית, ובסופו של יום היא איננה ניתנת לחלוקה.\" (עמ' 3)<\/li>\n<li>\"העמידות והקביעות של המסגרת החיצונית (התיבה) מאפשרות לתהליכי ההדרכה (התבנית הפעילה) להתקיים במיטבם.\" (עמ' 8)<\/li>\n<li>\"יעדו של המדריך איננו לשכפל מנהלים בדמותו, אלא לייצר מרחב שיאפשר למנהל החדש להפציע כאיש חינוך בעל החזון והיזמה שמקורם בעצמיותו.\" (עמ' 14)<\/li>\n<li>\"טעות אפשרית של המדריך חמורה פחות מהפחד שלו להתמודד עמה בשיח גלוי עם המודרך.\" (עמ' 23)<\/li>\n<\/ul>"},"level":"שנים ב'-ג' (רלוונטי במיוחד למתמחה שמלווה מנהל או מייעץ לו, וגם לחשיבה על ההדרכה של המתמחה עצמו)","stype":"מאמר (פרק בספר, תפיסה עקרונית ומודל עבודה של הדרכה אישית למנהלים)","tldr":"הפרק מציג את התפיסה של מכון אבני ראשה להדרכה אישית של מנהלי בתי ספר חדשים. נקודת המוצא היא שהמנהל החדש \"קופץ לתוך המים הסוערים\", ונדמה שמשימתו העיקרית היא לשרוד. הוא מוצף ונקרע בין היבטי התפקיד, ובסופו של דבר נושא לבדו באחריות שאינה ניתנת לחלוקה.…","search":"הפרק מציג את התפיסה של מכון אבני ראשה להדרכה אישית של מנהלי בתי ספר חדשים. נקודת המוצא היא שהמנהל החדש \"קופץ לתוך המים הסוערים\", ונדמה שמשימתו העיקרית היא לשרוד. הוא מוצף ונקרע בין היבטי התפקיד, ובסופו של דבר נושא לבדו באחריות שאינה ניתנת לחלוקה. ההדרכה מוצגת כמסגרת למידה יציבה, שבנויה מ\"תיבה\" (גבולות פורמליים: מועדים, משך, חיסיון) ומ\"תבנית פעילה\" (שיח פתוח שמבוסס על צורכי המודרך). היא נבדלת מהיוועצות ואינה נועדה למצבי חירום. מרחב ההדרכה נבנה משלושה היבטים: ההדרכה כ\"מרחב פוטנציאלי\" במובן של ויניקוט, כלומר מקום למשחק וליצירתיות; המרחב הדיאלוגי לפי בובר, שבו המדריך נושא באחריות לדיאלוג; ו\"האומנות והליריקה\" של ההדרכה, לפי דנה אמיר. לצד אלה הפרק משתמש בשלושת סוגי ההתייחסות של קוהוט (מראה, האדרה ותאומות). הכותבים מציעים \"סכֵמת השלם ההדרכתי\" כמצפן מול \"הדיקטטורה של המיידי\". הסכֵמה כוללת שלושה מעגלים: יעדים ניהוליים ותפקודיים, תמונה שלמה של בית הספר, והתפתחות המנהל כאדם בתפקידו. הפרק מתאר גם שלוש עמדות של המדריך (מאחורי המנהל, לפניו ולצדו) ודן בחסימות ביחסי ההדרכה. לאורך הפרק מובאות ארבע דוגמאות מהשטח. ניהול בית ספר הוא אתגר רב-ממדי שחושף את המנהל ל\"הצפה תפקודית והיקרעות\". האחריות הכוללת רובצת עליו לבדו ואינה ניתנת לחלוקה. המנהל החדש נכנס לבית ספר שהחליף מנהל: הצוות חרד, הקהילה בוחנת, והמנהל עצמו עוד מגבש את זהותו הניהולית. המסגרת היא תנאי ללמידה. לפי גרין (2008), שמשאיל את המושגים ממסגרת טיפולית, למסגרת יש שני חלקים: \"התיבה\" (מספר הפגישות, אורכן, תכיפותן ומגבלות החיסיון) ו\"התבנית הפעילה\" (אופן הפעולה, השיח הפתוח). העמידות של התיבה מאפשרת לתבנית הפעילה לפעול במיטבה. גם דייקנות המדריך, הקפדתו על קיום המפגשים ושמירתו על פרטיות המודרך מייצבות את המסגרת. הדרכה אינה היוועצות. חקר האירועים הוא נדבך בהתפתחות המנהל ולא מטרה סופית, וההדרכה אינה מסגרת למענה על מצבי חירום. המדריך משתמש באירוע הספציפי כדי לעסוק בתהליך ההתפתחות של המנהל לאורך זמן. ההדרכה היא \"מרחב פוטנציאלי\" (ויניקוט), שמחייב סביבה מאפשרת: מוגנת, לא שיפוטית ובלי לחץ מיידי למעשיות. בה המודרך יכול \"לשחק\" ולהיות יצירתי. גם המדריך צריך להיות מסוגל לשחק ולהרפות מאחיזה ברעיון, בלי צורך לעצב את המנהל בדמותו. לפעמים המנהל צריך קודם \"לשחק לבד בנוכחות\" המדריך. הפרדוקס הוויניקוטיאני חל על המנהל החדש: הוא מגיע לבית ספר קיים, ובו בזמן לבית ספר שעליו לגלות ו\"לברוא\". רק כשההצפה הראשונית פוחתת המנהל מסוגל להשתמש בהדרכה כמרחב משחק. הדיאלוג (בובר) הוא זירת הפעולה המרכזית. בדיאלוג החינוכי ההדדיות אינה סימטריה באחריות: המדריך אחראי ליצור את תנאי הדיאלוג, ובמקביל עליו להיות מוכן לוותר על שליטה ולא לכפות \"פרוטוקול\". שלושת סוגי ההתייחסות של קוהוט מזינים את \"העצמי הניהולי\" המתפתח: מראה (שיקוף), האדרה (הכרה בכוחות ובערכים, לא התפעלות ריקה) ותאומות (חוויה משותפת שמפיגה את בדידות המנהל). לפי דנה אמיר, המנהל אינו \"לוח חלק\". יש בו יסודות מתמשכים (פרוזאיים) ויסודות מתהווים (פואטיים), והמדריך מצטרף ליסוד הלירי, כלומר לעיבוד התנועה ביניהם. \"יעדו של המדריך איננו לשכפל מנהלים בדמותו\". \"סכֵמת השלם ההדרכתי\" היא מצפן שמאפשר לבחון את הצרכים המיידיים מול מטרת ההדרכה השלמה, ולשים לב גם למה שנמנעים מלהעלות. מעגל היעדים נוטה להידחק באופן מוסווה, למשל דרך עיסוק יתר במאבקי כוח, ועל המדריך לוודא שההדרכה לא תפסח עליו. רגשות המנהל ותגובותיו הם כלי עבודה. לעתים הם \"ברומטר\" לתנודות בדינמיקה הבית-ספרית, ומשקפים את הלך הרוח של הצוות. יחסי ההדרכה עצמם צריכים להיות נושא להדרכה. תהליכים סמויים בין המדריך למודרך יכולים לחסום את ההדרכה (Lester & Robertson, 1995), ו\"טעות אפשרית של המדריך חמורה פחות מהפחד שלו להתמודד עמה בשיח גלוי\". המדריך בוחר בגמישות בין שלוש עמדות: מאחורי המנהל, לפניו ולצדו. התיבה / התבנית הפעילה (גרין, 2008) – שני מרכיבי המסגרת. התיבה היא הגבולות הפורמליים והמבניים (מספר פגישות, אורכן, תכיפותן, חיסיון). התבנית הפעילה היא אופן הפעולה בתוך המסגרת (שיח פתוח, דיאלוג מכוון לפיתוח). הדרכה לעומת היוועצות – בהדרכה חקר האירועים הוא אמצעי להתפתחות המנהל ולא מטרה סופית. היא אינה מסגרת למצבי חירום. מרחב פוטנציאלי (ויניקוט) – מרחב ביניים בין הפנים לחוץ, בין הממשי למדומיין. בו נבנית חוויית העצמי דרך השתהות ומשחק, והוא מחייב \"סביבה מאפשרת\". משחק בהדרכה – מצב שבו המודרך (וגם המדריך) יכול להיות יצירתי, לנסות פתרונות ועמדות. היכולת לשחק לבד בנוכחות המדריך קודמת למשחק בשניים. הפרדוקס הוויניקוטיאני – המנהל מגיע לבית ספר קיים, ועליו לחוות אותו כאילו הוא בורא אותו. דיאלוג מצמיח / \"חלל ביניים\" (בובר) – מפגש פתוח עם האחר, עם נכונות להשפיע ולהיות מושפע. בדיאלוג החינוכי האחריות אינה סימטרית. שלוש התייחסויות לעצמי (קוהוט, 1977) – מראה (mirroring), האדרה (אידיאליזציה) ותאומות. פרוזאי / פואטי / לירי (דנה אמיר, 2008) – היסודות המתמשכים, היסודות המתהווים, ועיבוד התנועה ביניהם. המדריך מצטרף ליסוד הלירי. סכֵמת השלם ההדרכתי – מדריך ומנהל במרכז, ושלושה מעגלים סביבם: יעדים ניהוליים ותפקודיים, תמונה שלמה של בית הספר, התפתחות המנהל כאדם בתפקידו. \"דיקטטורה של המיידי\" / \"כיבוי שרפות\" – הסכנה שההדרכה, כמו הניהול, תשתעבד ללחצים דחופים על חשבון התפתחות ארוכת טווח. עמדות המדריך – מאחורי המנהל (\"נותן גב\", המנהל הוא בעל המצפן), לפניו (המדריך מציע את המצפן שלו, במשורה) ולצדו (מצפן משותף, שיח שיתופי). \"העצמי הניהולי\" – הזהות הניהולית המתהווה של המנהל, שההדרכה נועדה לטפח."},{"id":"nutkevitch2003","title":"המכל והמוכל (The Container and its Containment)","authors":"אבי נוטקביץ'","year":"2003","cite":"נוטקביץ, א' (2003). המכל והמוכל: מרחב למפגש של התיאוריה הפסיכואנליטית ותיאורית המערכות. פסיכולוגיה עברית.","url":"https://www.hebpsy.net/me_article.asp?article=92","kind":"article","desc":null,"urlLabel":"המאמר באתר פסיכולוגיה עברית","file":{"orig":"the container and its containment for kav ofek.doc","ext":"doc","pdf":"nutkevitch2003.pdf","pages":15,"bytes":94394},"placements":[["s2","system"]],"extra":false,"ref":"נוטקביץ' 2003","inFolder":true,"srcTitle":"The \"Container\" and its Containment: A Meeting Space for Psychoanalytic and Open Systems Theories","secs":{"abstract":"<p>המאמר יוצא מ\"התפנית\" של אליוט ז'אק (Jaques, 1995). ז'אק דחה את חשיבות הלא מודע להבנת ארגונים ואת השימוש בשיטות פסיכואנליטיות, והעדיף גישה שמבוססת על מבנה ועיצוב ארגוני. נוטקביץ' מפרש את המהלך הזה כ\"פיצול מושגי\" בין \"פסיכואנליזה רעה\" ל\"מערכתיות טובה\", ומציע את מושג \"המיכל\" והכלתו כמרחב מפגש בין שתי הגישות. הוא נשען על שתי חוויות. הראשונה היא כנס ISPSO ב-1996, שם גורדון לורנס הגדיר את הארגון כ\"מיכל זמין לחשיבה\". השנייה היא ייעוץ להנהלה של ארגון שירותי אנוש מפוצל. שם הבניית התפקידים והפגישות במשך יותר משנה אפשרה בסופו של דבר דיון סוער על \"אמון בעבודה\", והשמירה של היועץ על גבול הזמן הייתה עצמה פעולת הכלה. המאמר סוקר את הזדהות השלכתית, את מודל המכיל-מוכל של ביון ואת השיפורים של Stokes ו-Obholzer. הוא מגדיר \"מיכל טוב דיו\" כישות ארגונית שגם מכילה חרדות וגם מאפשרת עבודה יעילה ויצירתית. לפי מילר ורייס המנהל ממוקם על הגבול ומנהל את גבולות המשימה, הזמן, הטריטוריה, החברות וקבלת ההחלטות. הגבולות מחזיקים גם אותו, ומשמשים \"רשת ביטחון\". המסקנה היא שעבודה על מבנה ועיצוב מונחית לא פחות מכך מהבנה פסיכואנליטית.<\/p>","ideas":"<ul>\n<li>השינוי הדרמטי בעמדתו של ז'אק, שבו הפסיכואנליזה נעשתה \"רעה\" והמבנה, העיצוב והסמכות נעשו \"טובים\", עשוי לבטא \"פיצול מושגי\". הפיצול נובע בחלקו מהקושי לשלב בין חשיבה פסיכואנליטית לחשיבה מערכתית בתיאוריה ובפרקטיקה. ארמסטרונג שואל איזה סוג \"צימוד\" בין שתי המסגרות מתכוונים אליו.<\/li>\n<li>הזדהות השלכתית במובנה הבין-אישי (ביון) פירושה השלכה של חלק מהעצמי <em>לתוך<\/em> אובייקט (ולא <em>על<\/em> אובייקט), באופן שמשנה את המציאות הנפשית של המקבל. לכן המקבל הוא \"מיכל\". אפשר להשליך חלקים \"רעים\" שמקלקלים את האובייקט, או חלקים \"אידיאליים\" שמובילים לאידיאליזציה שנחווית כשולטת וכרעועה.<\/li>\n<li>המיכל אינו ריק. בגישה האינטרסובייקטיבית, תגובות המטפל הן תערובת של חלקים שהמטופל השליך ושל חלקים מוכחשים ומפוצלים של המטפל עצמו. הגבולות הברורים של הסיטואציה הטיפולית (זמן, שיטת עבודה, תשלום) עשויים לתמוך ביכולת ההכלה.<\/li>\n<li>גם יחיד, קבוצה, מערכת וארגון שלם הם ישויות שיכולות להכיל חלקים מעוררי חרדה, כאב ובושה, או להיפטר מהם בהשלכה לתת-ישות פנימית או לישות חיצונית. דוגמה: הנהלה שבמקום לדון בגלוי בלחישות ובהשמצות בין עובדים לחבריה, המשיכה בהאשמות הדדיות ו\"הנציחה את מצב אי-ההכלה\".<\/li>\n<li>לפי ביון (1977), הקבוצה צריכה להכיל את \"המיסטיקן\", הפרט שנתפס כמאיים, כי הוא עשוי להיות גם הרסני וגם יצירתי ומקדם. את התפקיד הזה ביון מייחס ל\"ממסד\", הישות בעלת הסמכות (למשל ההנהלה).<\/li>\n<li>לפי Stokes, היחיד צריך להיות מסוגל לייחס להנהלה את השנאה, העוינות והקנאה שהוא חש כלפי הארגון. כשההנהלה נתפסת כחלשה, הרגשות האלה מופנים לחלקים אחרים של הארגון ויוצרים קונפליקטים בין-אישיים ובין-קבוצתיים ומצוקה אישית. לכן ההנהלה צריכה להיות \"מיכל אמין\".<\/li>\n<li>\"מיכל טוב דיו\" הוא כל ישות ארגונית שגם מכילה חלקים מעוררי חרדה (מבפנים ומהסביבה) וגם מאפשרת ומקדמת עבודה יעילה ויצירתית במשימותיה. הוא לא רק \"בולם זעזועים\": הוא מאפשר מצוינות אישית וצוותית, מימוש פוטנציאל וקיום של \"המיסטיקן\".<\/li>\n<li>המנהל, בכל רמה, אינו נמצא \"מעל\" המערכת אלא על הגבול שלה, ותפקידו לנהל את גבולות המשימה, הזמן, הטריטוריה, החברות ותהליך קבלת ההחלטות. הוא כאילו \"מחזיק בידיו\" את המיכל ושומר על שלמות המעטפת שלו. כדמות סמכות הוא עצמו מושא להשלכות, ולכן גם הוא \"מיכל של איש אחד\".<\/li>\n<li>המנהל מנהל את הגבולות, והגבולות גם מחזיקים אותו. בהירות, מודעות וניהול של גבולות המשימה, הזמן, התפקיד, הסמכות וקבלת ההחלטות הם \"רשת ביטחון\" מעשה ידי אדם לשלמות המיכל. מכאן גם המסקנה: ההנהלה, כמיכל, צריכה בעצמה להיות מוכלת.<\/li>\n<li>כשיועץ עוזר להנהלה לנסח משימות ותפקידים ולקבוע נהלי פגישות (זמן, תדירות, סדר יום, קבלת החלטות), זו לא עבודה \"טכנית\" בלבד. היא מונחית מהבנה פסיכואנליטית לא פחות מאשר מתיאוריית המערכות. ככל שהמיכל סוער יותר והפתולוגיה קשה יותר, חשוב יותר לבנות את \"רשת הביטחון\".<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>מיכל (Container)<\/strong> – כל ישות (אם, מטפל, קבוצה, הנהלה, ארגון) שהשלכות מופנות לתוכה, ושיכולה להכיל אותן או להיפטר מהן. בנוסף, כל קבוצה או יחידה ארגונית בעלת משימה היא \"מיכל שבו מתבצעת עבודה\".<\/li>\n<li><strong>הכלה (Containment)<\/strong> – היכולת של ישות לשמור בתוכה חלקים שמעוררים חרדה, כאב ובושה, לעכל אותם ולהפוך אותם לבני-חשיבה, במקום להשליך אותם הלאה.<\/li>\n<li><strong>הזדהות השלכתית (Projective identification)<\/strong> – השלכה של חלק מהעצמי לתוך אובייקט, שמשנה את המציאות הנפשית של המקבל. המונח נטבע על ידי קליין כתופעה תוך-נפשית, וביון פיתח אותו כתופעה בין-אישית.<\/li>\n<li><strong>יסודות בטא ויסודות אלפא (Beta / Alpha elements)<\/strong> – יסוד בטא הוא יסוד נפשי שאדם שואף כל הזמן להיפטר ממנו בהשלכה. יסוד אלפא הוא יסוד בעל שם, שאפשר להשתמש בו לחשיבה.<\/li>\n<li><strong>פונקציית אלפא ורוורי (Alpha function, Reverie)<\/strong> – רוורי הוא המצב הרגשי-מנטלי של אם שמסוגלת לקלוט את מה שהושלך ולהישאר איתו. פונקציית אלפא הופכת בטא לאלפא ומאפשרת לפעול מתוך הבנה ולא מתוך צורך להיפטר מההשלכה.<\/li>\n<li><strong>מיכל אמין (Reliable container)<\/strong> – מונח של Stokes להנהלה יציבה מספיק כדי לספק מטרה ברורה ולהכיל את מה שמושלך לתוכה.<\/li>\n<li><strong>מיכל טוב דיו (Good enough container)<\/strong> – בהשאלה מוויניקוט: ישות ארגונית שמכילה חרדות וגם מאפשרת עבודה יעילה ויצירתית.<\/li>\n<li><strong>ניהול גבולות (Boundary management)<\/strong> – לפי מילר ורייס, ליבת תפקיד המנהל. הוא כולל ניהול גבולות של משימה, זמן, טריטוריה, חברות, תפקיד, סמכות ותהליך קבלת החלטות.<\/li>\n<li><strong>רשת ביטחון (Safety net)<\/strong> – המסגרת של גבולות מוגדרים ומנוהלים, שמסייעת למנהל לשמור על יכולת ההכלה שלו ועל שלמות המיכל.<\/li>\n<li><strong>סביבה ארגונית מחזיקה (Holding organizational environment)<\/strong> – הגדרת מטרת הייעוץ בחוזה עם הארגון בדוגמה השנייה, בהשאלה מוויניקוט.<\/li>\n<li><strong>\"המיסטיקן\" והממסד (The mystic / Establishment)<\/strong> – לפי ביון: פרט מאיים, הרסני ויצירתי בו-זמנית, שהממסד (הישות בעלת הסמכות) צריך להכיל ולא לגרש.<\/li>\n<li><strong>פיצול מושגי (Conceptual splitting)<\/strong> – פרשנותו של נוטקביץ' למעבר החד של ז'אק מגישה פסיכואנליטית לגישה מבנית בלבד.<\/li>\n<\/ul>","models":"<h3>1. שלוש דרכים אפשריות לצמד \"פסיכואנליטי ומערכתי\" (Armstrong, 1995)<\/h3>\n<ol>\n<li>חיבור של שתי מסגרות התייחסות, ששיטותיהן מופעלות כל אחת בנפרד על סוגיות הארגון.<\/li>\n<li>\"פרספקטיבה הפיכה\" של ביון: אותן תופעות נראות פעם כך ופעם אחרת, כמו באשליית דמות-רקע.<\/li>\n<li>דרך מגושמת וזמנית לכנות דבר חדש, לא \"פסיכואנליטי\" ולא \"מערכתי\" אלא \"פסיכואנליטי-ומערכתי\", \"שלישי\" מתהווה.<\/li>\n<\/ol>\n<h3>2. תהליך ההכלה (ביון), בסכמה של המאמר<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>שלב<\/th>\n<th>אם-תינוק<\/th>\n<th>ישות ארגונית<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>השלכה<\/td>\n<td>התינוק משליך יסוד בטא לתוך האם<\/td>\n<td>חלקים מעוררי חרדה מבפנים, או השלכות מתוך הארגון או מחוצה לו, מגיעים לישות (יחיד, קבוצה, הנהלה)<\/td>\n<\/tr>\n<tr>\n<td>הכלה<\/td>\n<td>האם ברוורי משאירה את החלק בתוכה למרות החרדה, מעכלת אותו והופכת אותו ליסוד אלפא<\/td>\n<td>הישות דנה בגלוי, מעלה השערות, לוקחת אחריות על חלקה ומחליטה. \"הפיכת בטא לאלפא\" מאפשרת פעולה בונה<\/td>\n<\/tr>\n<tr>\n<td>אי-הכלה<\/td>\n<td>האם אינה מסוגלת להכיל ומשליכה את החלק לתוך הילד או לתוך אדם אחר<\/td>\n<td>הישות משליכה לתת-ישות פנימית (תת-קבוצה) או לישות חיצונית: האשמות הדדיות, \"חשבונות\" ופגיעה בתפקוד<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>3. מה נדרש כדי שההנהלה תהיה \"מיכל אמין\" (Stokes, 1994)<\/h3>\n<ol>\n<li>עבודה מתמשכת של ההנהלה על הבהרת המשימה הראשית (primary task) של הארגון.<\/li>\n<li>עבודה של ההנהלה על תכנון והגדרת תפקידים באופן שתואם את המשימה הראשית.<\/li>\n<\/ol>\n<h3>4. מקורות החרדה ו\"הפונקציה המכילה של הארגון\" (Obholzer, 1994)<\/h3>\n<p><strong>מקורות החרדה שארגון צריך להכיל:<\/strong><\/p>\n<ul>\n<li>חרדות שהחברה משליכה על מוסדותיה (בעיקר מוסדות במגזר הציבורי). כשהמוסד אינו מכיר בתפקידו כמיכל, הוא יוצר מבנים ודפוסים שהם הגנה מפני החרדות, ואלה פוגעים בעבודה ובבריאות הנפשית והגופנית של העובדים ומשפחותיהם.<\/li>\n<li>חרדות שנובעות מעצם טבעה של העבודה.<\/li>\n<li>חרדות שנובעות מההיסטוריה האישית של העובדים.<\/li>\n<\/ul>\n<p><strong>חמישה גורמים שמקדמים את הפונקציה המכילה:<\/strong><\/p>\n<ol>\n<li>דיון מתמשך במשימה הראשית של הארגון.<\/li>\n<li>מבנה סמכות ברור, כולל זהות מי שמחליט בסוף הדיון מהי המשימה הראשית.<\/li>\n<li>תקשורת פתוחה בין חלקי הארגון, ופורום לדיון במה שקורה בארגון ובינו לבין מערכות אחרות.<\/li>\n<li>מפגשים סדירים של צוותים, שבהם מדברים על רגשות ועל קשיים בעבודה.<\/li>\n<li>תמיכה מיוחדת במנהלים.<\/li>\n<\/ol>\n<p>(Obholzer אינו מייחס תפקיד מפורש להנהלה, אבל נוטקביץ' מניח שמימוש הדרישות מחייב הנהלה שתיזום ותיישם אותן.)<\/p>\n<h3>5. ההנהלה בשתי פרספקטיבות<\/h3>\n<ol>\n<li><strong>מיכל לחלקים מאיימים<\/strong>: חלקים שנובעים מהדינמיקה הפנימית של ההנהלה ומהשלכות מתוך הארגון ומחוצה לו. הנהלה שהופכת בטא לאלפא מצמצמת נזק ומצוקה אישית וארגונית.<\/li>\n<li><strong>מיכל שבו מתבצעת עבודה<\/strong>: המשימות הנדרשות לקיום הארגון ולתפקודו. כל קבוצה, מערכת או ישות ארגונית שיש לה משימה היא מיכל כזה.<\/li>\n<\/ol>\n<h3>6. \"מיכל טוב דיו\": הגדרה<\/h3>\n<p>ישות ארגונית שיכולה:<\/p>\n<ol>\n<li>כמו אם או מטפל, להכיל חלקים מעוררי חרדה שמקורם בתוך המיכל או בהשלכות מהסביבה, הקרובה והרחוקה.<\/li>\n<li>לאפשר ולקדם עבודה יעילה ויצירתית שקשורה למשימות המיכל.<\/li>\n<\/ol>\n<p>ובנוסף: מאפשרת מצוינות אישית וצוותית, מימוש פוטנציאל אישי, קיום \"המיסטיקן\" (גם זה שבכל אחד מאיתנו), ורתימה של כל אלה למשימות המיכל.<\/p>\n<h3>7. הגבולות שהמנהל מחזיק (\"מעטפת המיכל\")<\/h3>\n<p>משימה, זמן, טריטוריה, חברות (מי שייך), תפקיד, סמכות ותהליכי קבלת החלטות.\nדוגמאות לאמירות של ניהול גבולות: \"בואו נעזוב את הנושא הזה ונעבור לאחר\", \"צריך לקצר את הפגישה\", \"עוזי בחופש, אז נבטל את ישיבת ההנהלה\". אמירות כאלה יכולות לבטא ניהול גבולות, אבל לפעמים הן נובעות מיריבות, מפילוג ומהשלכה שמאיימים על המיכל.<\/p>\n<h3>8. רצף העבודה עם הנהלת ארגון שירותי אנוש (הדוגמה השנייה)<\/h3>\n<ol>\n<li>אבחון ארגוני: פיצולים, קואליציות, עוינות וחוסר אמון. ההנהלה לא התכנסה יותר משנה.<\/li>\n<li>חודשים ראשונים: ניסוח תפקידי ההנהלה, החלטה מי חבר בה ומי לא, וקביעת המשימה, התדירות, האורך והמבנה של הישיבות ותהליך קבלת ההחלטות. הוצע \"זמן סקירה\" (review) בסוף כל ישיבה.<\/li>\n<li>במהלך השנה: סיוע למנהל ולהנהלה להטמיע את השינויים, ועבודה על נושאים נוספים.<\/li>\n<li>היועץ בחר במודע לא להקדיש ישיבה ליחסים הקשים, אף שהם חלחלו לכל דיון.<\/li>\n<li>אחרי יותר משנה, ביוזמת היועץ ובהסכמת המנהל: דיון בנושא \"אמון בעבודה\". הדיון היה סוער, ועלה לחץ להמשיך אותו מעבר לזמן. היועץ ביטל נושא נוסף שתוכנן, דילג על ההפסקה, ובכל זאת סגר את הדיון זמן קצר אחרי השעה שנקבעה.<\/li>\n<li>תוצאה: המשך הישיבה, בנושאים שוטפים, היה פרודוקטיבי. היועץ הבין שאי אפשר היה לקיים דיון כזה חצי שנה או שנה קודם. המסגרת היציבה שנבנתה היא שהכילה אותו.<\/li>\n<\/ol>\n<h3>9. עיקרון מסכם ו\"חזון ייעוצי\"<\/h3>\n<ul>\n<li>ככל שהמיכל סוער יותר, הפתולוגיה קשה יותר, היחסים בהנהלה גרועים יותר וההכלה קשה יותר לאישיות המנהל, כך חשוב יותר לבנות ולשמר את \"רשת הביטחון\".<\/li>\n<li>ככל שיש יותר \"מיכלים טובים דיים\" בכל הרמות (הנהלה, ניהול, מחלקה, צוות, קבוצת עבודה), הארגון יעיל יותר וחבריו יעילים, יצירתיים ומרוצים יותר.<\/li>\n<li>אסטרטגיית התערבות: לסייע להקים, לשמר ולנהל ישויות ארגוניות בכל הרמות כ\"מיכלים טובים דיים\". זו מסגרת מושגית וגם ערכית, שמציבה את הפרט ורווחתו כערך מפתח בעבודת היועץ.<\/li>\n<\/ul>","practice":"<ul>\n<li>לא לפטור כ\"טכנית\" עבודה עם מנהל או רכז על סדר יום, זמני ישיבות, הגדרת תפקידים ו\"מי מחליט\". כדאי לראות בה עבודת הכלה שמכינה את הקרקע לשיחות טעונות.<\/li>\n<li>כשאתה מנחה פורום (ישיבת צוות, קבוצת מחנכות), לשמור על גבולות הזמן והמשימה גם תחת לחץ \"רק עוד קצת\". ההחזקה בגבול עצמה מכילה, והגבול גם מחזיק אותך.<\/li>\n<li>לשים לב לתזמון: נושאים טעונים (אמון, עוינות בין אנשי צוות) כדאי לפתוח רק אחרי שנבנתה מסגרת יציבה של מפגשים סדירים.<\/li>\n<li>כשהצוות מפנה כעס וחשד אלה כלפי אלה או כלפי תת-קבוצות, לשאול אם ההנהלה נתפסת כחלשה (Stokes). לפעמים צריך לחזק את ההנהלה כ\"מיכל אמין\" ולא רק לטפל בקונפליקט עצמו.<\/li>\n<li>לזהות את \"המיסטיקן\" בבית הספר, המורה או התלמיד החריג והמאיים, ולעזור למערכת להכיל אותו ולרתום אותו במקום להוציא אותו.<\/li>\n<li>להבין שהתגובות שלך במערכת הן תערובת של השלכות ושל חלקים שלך עצמך. לכן חשוב להביא אותן להדרכה ולא להתייחס אליהן כ\"אמת\" על המערכת.<\/li>\n<li>בעבודה עם ההנהלה לבדוק אם מתקיימים חמשת התנאים של Obholzer, ולהציע לבנות את מה שחסר, למשל פורום קבוע או מפגשי צוות שבהם מדברים גם על רגשות.<\/li>\n<\/ul>","questions":"<ul>\n<li>אילו ישויות בבית הספר שלי מתפקדות כ\"מיכל טוב דיו\", ואילו \"נשפכות\" ומשליכות הלאה (לחדר המורים, להורים, לשפ\"ח)?<\/li>\n<li>אילו גבולות (זמן, משימה, תפקיד, חברות) אני מחזיק בעבודה שלי בבית הספר? מתי ויתרתי עליהם תחת לחץ, ומה קרה אחר כך?<\/li>\n<li>האם ההנהלה בבית הספר נתפסת כחזקה מספיק כדי לשאת את הכעס והקנאה של הצוות? אם לא, לאן מופנים הרגשות האלה?<\/li>\n<li>האם גם אצלי יש \"פיצול מושגי\" בין \"עבודה רגשית-דינמית\" לבין \"עבודה מבנית-ארגונית\"? איך אני יכול לחבר ביניהן?<\/li>\n<li>מה \"המיכל\" שמחזיק אותי עצמי בעבודה (הדרכה, צוות שפ\"ח, מסגרת זמנים), ומה קורה ליכולת ההכלה שלי כשהוא חלש?<\/li>\n<\/ul>","quotes":"<ul>\n<li>\n<p>\"A \"good enough container\" is not only \"a shock absorber\" (of projective identifications); it also enables personal and team excellence.\"\n  (בתרגום חופשי: \"מיכל טוב דיו\" אינו רק \"בולם זעזועים\" של הזדהויות השלכתיות; הוא גם מאפשר מצוינות אישית וצוותית.)<\/p>\n<\/li>\n<li>\n<p>\"I would like to suggest that while the manager, as part of his role, has to manage the boundaries of the \"container\", these boundaries also sustain him.\"\n  (בתרגום חופשי: בעוד שהמנהל, כחלק מתפקידו, צריך לנהל את גבולות \"המיכל\", הגבולות האלה גם מחזיקים אותו.)<\/p>\n<\/li>\n<li>\n<p>\"One obvious conclusion is that the board as a \"container\", or, for that matter, any other organizational entity, has also to be contained.\"\n  (בתרגום חופשי: ההנהלה כ\"מיכל\", וכך גם כל ישות ארגונית אחרת, צריכה בעצמה להיות מוכלת.)<\/p>\n<\/li>\n<li>\n<p>\"More than the Jewish people observes the Sabbath, the Sabbath preserves the Jewish people.\"\n  (המחבר מצטט את \"יותר משישראל שמרו את השבת, שמרה השבת אותם\" כמשל ליחס בין המיכל לגבולותיו.)<\/p>\n<\/li>\n<\/ul>"},"level":"שנים ב'-ג' (תיאוריה צפופה, מתאימה לעבודה מערכתית עם הנהלות). מתאים גם לשנה ד'.","stype":"מאמר (באנגלית)","tldr":"המאמר יוצא מ\"התפנית\" של אליוט ז'אק (Jaques, 1995). ז'אק דחה את חשיבות הלא מודע להבנת ארגונים ואת השימוש בשיטות פסיכואנליטיות, והעדיף גישה שמבוססת על מבנה ועיצוב ארגוני. נוטקביץ' מפרש את המהלך הזה כ\"פיצול מושגי\" בין \"פסיכואנליזה רעה\" ל\"מערכתיות…","search":"המאמר יוצא מ\"התפנית\" של אליוט ז'אק (Jaques, 1995). ז'אק דחה את חשיבות הלא מודע להבנת ארגונים ואת השימוש בשיטות פסיכואנליטיות, והעדיף גישה שמבוססת על מבנה ועיצוב ארגוני. נוטקביץ' מפרש את המהלך הזה כ\"פיצול מושגי\" בין \"פסיכואנליזה רעה\" ל\"מערכתיות טובה\", ומציע את מושג \"המיכל\" והכלתו כמרחב מפגש בין שתי הגישות. הוא נשען על שתי חוויות. הראשונה היא כנס ISPSO ב-1996, שם גורדון לורנס הגדיר את הארגון כ\"מיכל זמין לחשיבה\". השנייה היא ייעוץ להנהלה של ארגון שירותי אנוש מפוצל. שם הבניית התפקידים והפגישות במשך יותר משנה אפשרה בסופו של דבר דיון סוער על \"אמון בעבודה\", והשמירה של היועץ על גבול הזמן הייתה עצמה פעולת הכלה. המאמר סוקר את הזדהות השלכתית, את מודל המכיל-מוכל של ביון ואת השיפורים של Stokes ו-Obholzer. הוא מגדיר \"מיכל טוב דיו\" כישות ארגונית שגם מכילה חרדות וגם מאפשרת עבודה יעילה ויצירתית. לפי מילר ורייס המנהל ממוקם על הגבול ומנהל את גבולות המשימה, הזמן, הטריטוריה, החברות וקבלת ההחלטות. הגבולות מחזיקים גם אותו, ומשמשים \"רשת ביטחון\". המסקנה היא שעבודה על מבנה ועיצוב מונחית לא פחות מכך מהבנה פסיכואנליטית. השינוי הדרמטי בעמדתו של ז'אק, שבו הפסיכואנליזה נעשתה \"רעה\" והמבנה, העיצוב והסמכות נעשו \"טובים\", עשוי לבטא \"פיצול מושגי\". הפיצול נובע בחלקו מהקושי לשלב בין חשיבה פסיכואנליטית לחשיבה מערכתית בתיאוריה ובפרקטיקה. ארמסטרונג שואל איזה סוג \"צימוד\" בין שתי המסגרות מתכוונים אליו. הזדהות השלכתית במובנה הבין-אישי (ביון) פירושה השלכה של חלק מהעצמי לתוך אובייקט (ולא על אובייקט), באופן שמשנה את המציאות הנפשית של המקבל. לכן המקבל הוא \"מיכל\". אפשר להשליך חלקים \"רעים\" שמקלקלים את האובייקט, או חלקים \"אידיאליים\" שמובילים לאידיאליזציה שנחווית כשולטת וכרעועה. המיכל אינו ריק. בגישה האינטרסובייקטיבית, תגובות המטפל הן תערובת של חלקים שהמטופל השליך ושל חלקים מוכחשים ומפוצלים של המטפל עצמו. הגבולות הברורים של הסיטואציה הטיפולית (זמן, שיטת עבודה, תשלום) עשויים לתמוך ביכולת ההכלה. גם יחיד, קבוצה, מערכת וארגון שלם הם ישויות שיכולות להכיל חלקים מעוררי חרדה, כאב ובושה, או להיפטר מהם בהשלכה לתת-ישות פנימית או לישות חיצונית. דוגמה: הנהלה שבמקום לדון בגלוי בלחישות ובהשמצות בין עובדים לחבריה, המשיכה בהאשמות הדדיות ו\"הנציחה את מצב אי-ההכלה\". לפי ביון (1977), הקבוצה צריכה להכיל את \"המיסטיקן\", הפרט שנתפס כמאיים, כי הוא עשוי להיות גם הרסני וגם יצירתי ומקדם. את התפקיד הזה ביון מייחס ל\"ממסד\", הישות בעלת הסמכות (למשל ההנהלה). לפי Stokes, היחיד צריך להיות מסוגל לייחס להנהלה את השנאה, העוינות והקנאה שהוא חש כלפי הארגון. כשההנהלה נתפסת כחלשה, הרגשות האלה מופנים לחלקים אחרים של הארגון ויוצרים קונפליקטים בין-אישיים ובין-קבוצתיים ומצוקה אישית. לכן ההנהלה צריכה להיות \"מיכל אמין\". \"מיכל טוב דיו\" הוא כל ישות ארגונית שגם מכילה חלקים מעוררי חרדה (מבפנים ומהסביבה) וגם מאפשרת ומקדמת עבודה יעילה ויצירתית במשימותיה. הוא לא רק \"בולם זעזועים\": הוא מאפשר מצוינות אישית וצוותית, מימוש פוטנציאל וקיום של \"המיסטיקן\". המנהל, בכל רמה, אינו נמצא \"מעל\" המערכת אלא על הגבול שלה, ותפקידו לנהל את גבולות המשימה, הזמן, הטריטוריה, החברות ותהליך קבלת ההחלטות. הוא כאילו \"מחזיק בידיו\" את המיכל ושומר על שלמות המעטפת שלו. כדמות סמכות הוא עצמו מושא להשלכות, ולכן גם הוא \"מיכל של איש אחד\". המנהל מנהל את הגבולות, והגבולות גם מחזיקים אותו. בהירות, מודעות וניהול של גבולות המשימה, הזמן, התפקיד, הסמכות וקבלת ההחלטות הם \"רשת ביטחון\" מעשה ידי אדם לשלמות המיכל. מכאן גם המסקנה: ההנהלה, כמיכל, צריכה בעצמה להיות מוכלת. כשיועץ עוזר להנהלה לנסח משימות ותפקידים ולקבוע נהלי פגישות (זמן, תדירות, סדר יום, קבלת החלטות), זו לא עבודה \"טכנית\" בלבד. היא מונחית מהבנה פסיכואנליטית לא פחות מאשר מתיאוריית המערכות. ככל שהמיכל סוער יותר והפתולוגיה קשה יותר, חשוב יותר לבנות את \"רשת הביטחון\". מיכל (Container) – כל ישות (אם, מטפל, קבוצה, הנהלה, ארגון) שהשלכות מופנות לתוכה, ושיכולה להכיל אותן או להיפטר מהן. בנוסף, כל קבוצה או יחידה ארגונית בעלת משימה היא \"מיכל שבו מתבצעת עבודה\". הכלה (Containment) – היכולת של ישות לשמור בתוכה חלקים שמעוררים חרדה, כאב ובושה, לעכל אותם ולהפוך אותם לבני-חשיבה, במקום להשליך אותם הלאה. הזדהות השלכתית (Projective identification) – השלכה של חלק מהעצמי לתוך אובייקט, שמשנה את המציאות הנפשית של המקבל. המונח נטבע על ידי קליין כתופעה תוך-נפשית, וביון פיתח אותו כתופעה בין-אישית. יסודות בטא ויסודות אלפא (Beta / Alpha elements) – יסוד בטא הוא יסוד נפשי שאדם שואף כל הזמן להיפטר ממנו בהשלכה. יסוד אלפא הוא יסוד בעל שם, שאפשר להשתמש בו לחשיבה. פונקציית אלפא ורוורי (Alpha function, Reverie) – רוורי הוא המצב הרגשי-מנטלי של אם שמסוגלת לקלוט את מה שהושלך ולהישאר איתו. פונקציית אלפא הופכת בטא לאלפא ומאפשרת לפעול מתוך הבנה ולא מתוך צורך להיפטר מההשלכה. מיכל אמין (Reliable container) – מונח של Stokes להנהלה יציבה מספיק כדי לספק מטרה ברורה ולהכיל את מה שמושלך לתוכה. מיכל טוב דיו (Good enough container) – בהשאלה מוויניקוט: ישות ארגונית שמכילה חרדות וגם מאפשרת עבודה יעילה ויצירתית. ניהול גבולות (Boundary management) – לפי מילר ורייס, ליבת תפקיד המנהל. הוא כולל ניהול גבולות של משימה, זמן, טריטוריה, חברות, תפקיד, סמכות ותהליך קבלת החלטות. רשת ביטחון (Safety net) – המסגרת של גבולות מוגדרים ומנוהלים, שמסייעת למנהל לשמור על יכולת ההכלה שלו ועל שלמות המיכל. סביבה ארגונית מחזיקה (Holding organizational environment) – הגדרת מטרת הייעוץ בחוזה עם הארגון בדוגמה השנייה, בהשאלה מוויניקוט. \"המיסטיקן\" והממסד (The mystic / Establishment) – לפי ביון: פרט מאיים, הרסני ויצירתי בו-זמנית, שהממסד (הישות בעלת הסמכות) צריך להכיל ולא לגרש. פיצול מושגי (Conceptual splitting) – פרשנותו של נוטקביץ' למעבר החד של ז'אק מגישה פסיכואנליטית לגישה מבנית בלבד."},{"id":"sharel2014","title":"כאשר אמפתיה לתלמיד נחווית ככשל אמפתי כלפי המורה","authors":"ד' שראל","year":"2014","cite":"שראל, ד' (15 באוגוסט 2014). כאשר אמפתיה לתלמיד נחווית ככשל אמפתי כלפי המורה. פסיכולוגיה עברית.","url":"https://www.hebpsy.net/articles.asp?id=3170","kind":"article","desc":"מאמר על המתח שבין אמפתיה לתלמיד לבין האופן שבו המורה חווה אותה, ועל ההשלכות לעבודה עם צוותים.","urlLabel":"המאמר באתר פסיכולוגיה עברית","placements":[["s2","system"]],"extra":false,"ref":"שראל 2014","inFolder":false,"tldr":"מאמר על המתח שבין אמפתיה לתלמיד לבין האופן שבו המורה חווה אותה, ועל ההשלכות לעבודה עם צוותים.","search":"מאמר על המתח שבין אמפתיה לתלמיד לבין האופן שבו המורה חווה אותה, ועל ההשלכות לעבודה עם צוותים."},{"id":"mop2020","title":"בית ספר כארגון מורכב מסתגל","authors":"משרד החינוך, אגף מו\"פ ניסויים ויוזמות","year":"2020","cite":"משרד החינוך, אגף מו\"פ ניסויים ויוזמות. בית ספר כארגון מורכב מסתגל.","url":null,"kind":"outline","desc":null,"file":{"orig":"דוח_בית-ספר-כארגון-מורכב-מסתגל.cleaned.pdf","ext":"pdf","pdf":"mop2020.pdf","pages":30,"bytes":1091673},"placements":[["s2","system"]],"extra":false,"ref":"בית ספר כארגון מורכב מסתגל","inFolder":true,"srcTitle":"בית ספר כארגון מורכב מסתגל","secs":{"abstract":"<p>המסמך של אגף מו\"פ במשרד החינוך מציע לבתי הספר מסגרת תפישתית ארגונית שמבוססת על תורת המערכות המורכבות המסתגלות (Complex Adaptive Systems – CAS). נקודת המוצא היא שהמציאות של המאה ה-21 היא מציאות VUCA: תנודתית, לא ודאית, מורכבת ועמומה. משבר הקורונה המחיש זאת. במקביל פועלות מגמות שינוי חברתיות, טכנולוגיות, כלכליות, סביבתיות, חינוכיות ופוליטיות (STEEEP), והמורכבות הארגונית של בתי הספר גוברת. ארגון היררכי-ריכוזי, \"ארגון האיך\", הוא \"שביר\" (טאלב) בגלל ריכוזיות, ניתוק מגירויי הסביבה ואחידות. המענה המוצע הוא ארגון מורכב מסתגל, ובמיטבו \"אנטי-שביר\". מאפייניו הם גורמים פעלנים, התארגנות עצמית, התהוות \"מלמטה למעלה\", שליטה מבוזרת והתנהלות \"על סף הכאוס\". המודל לבית הספר כולל שלושה רכיבים שמקיימים יחסי גומלין: <strong>מצפן בית ספרי<\/strong> מותאם ועדכני (חזון, מודלים קוגניטיביים, חשיבת עתיד וסריקה סביבתית); <strong>בעלי עניין אוטונומיים ופעלנים<\/strong> (צוותים מתארגנים, יצירתיות וחדשנות, הנהלה כמאמנת וכמסירת חסמים); ו<strong>אקו-סיסטם תומך ומאפשר<\/strong> (מנהיגות, חיבוריות, תוכניות לימודים, מבנה, הון אנושי, תשתיות, תרבות, שירותים ותקציב). המסמך מסתיים בטענה שזהו \"שינוי ממעלה שנייה\" שמשנה את כללי המשחק של בתי הספר.<\/p>","ideas":"<ul>\n<li>מציאות ה-VUCA היא המציאות הקבועה של המאה ה-21 (The New Normal), ולא מצב חריג. היא מתחדדת בזמני משבר כמו הקורונה. כדי שהצעת הערך של בית הספר תישאר רלוונטית, עליו לאמץ תפישה ארגונית שמאפשרת הסתגלות.<\/li>\n<li>המורכבות של בתי הספר גוברת בגלל ביזור והאצלת סמכויות, ריבוי בעלי עניין, דרישה לחינוך מותאם אישית ומשילות רב-שכבתית (מטה, מחוז, רשות, בית ספר). המגמות האלה מקשות לתת מענה איכותי בזמן.<\/li>\n<li>ארגון היררכי-ריכוזי (\"ארגון האיך\", \"מכונה משומנת\") הוא שביר: שרשרת המידע, ההחלטות, הביצוע והפיקוח ארוכה ואיטית, ההנהלה מנותקת מהשטח, ואין דרכי פעולה חלופיות כשהדרך הסטנדרטית מפסיקה לעבוד.<\/li>\n<li>בארגון מורכב מסתגל אין קשר מובהק בין סיבה לתוצאה, וקשה לחזות בפרטנות. ובכל זאת אפשר למצוא סדר באמצעות חשיבה מערכתית. ההסתגלות נשענת על אוטונומיה של הגורמים הפעלנים, על הזיכרון המקומי שלהם ועל הלמידה מהניסיון.<\/li>\n<li>בית ספר מורכב מסתגל הוא \"ארגון הלמה\". ההנהלה מגדירה, בשיתוף בעלי העניין, מצפן ויעדי מדיניות (ה\"למה\"), ובעלי העניין מתארגנים בעצמם ובוחרים את ה\"איך\". המצפן יעיל רק אם הוא ברור, מוסכם וידוע לכולם.<\/li>\n<li>בניית המצפן נשענת על שתי אסטרטגיות משלימות: חשיבת עתיד לחזון ארוך טווח, וזמישות (agility) שנשענת על סריקה סביבתית שוטפת, פנימית וחיצונית, כדי להגיב מהר לשינויים בהווה.<\/li>\n<li>הצוותים האוטונומיים, ההטרוגניים והזמניים הם \"מנוע השינוי\". תפקיד ההנהלה עובר מהוצאת הנחיות ופיקוח לתפקידים של מאמנים, מנטורים, \"מנתחי לקוחות\" ומסירי חסמים, ולבניית אמון ותמיכה בפתרון בעיות בין-אישיות ובין-קבוצתיות.<\/li>\n<li>ניהול \"סף הכאוס\" פירושו לאזן בין סדר לאי-סדר. כשיש עודף אי-סדר מגבירים משמעת ושליטה, וכשהארגון מקובע מכניסים אי-סדר מבוקר. לפעמים כדאי דווקא להדגיש חילוקי דעות כדי לקדם דיאלוג אמיתי.<\/li>\n<li>המנהיגות צריכה לוותר על \"אשליית השליטה\" ועל \"ודאות כוזבת\". עליה להכיל את החרדה שמעוררות מגבלות התכנון, להחזיק פרדוקסים (\"גם... וגם\") ולבזר מנהיגות למורים. היא גם צריכה להגן על הצוות משחיקה ומלחצים חיצוניים, ולהמיר התנהגויות פוגעניות רגשית בדפוסים שבונים אמון.<\/li>\n<li>האקו-סיסטם התומך כולל רכיבים חיצוניים (משרד החינוך, מחוז, רשות, רשת) ופנימיים: מנהיגות, חיבוריות, תוכניות לימודים, מבנה ארגוני, הון אנושי, תשתיות, תרבות, שירותים ותקציב. בתרבות שהוא מטפח, טעויות ובעיות נתפסות כהזדמנויות ללמידה.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>VUCA<\/strong> – Volatility, Uncertainty, Complexity, Ambiguity: תנודתיות, חוסר ודאות, מורכבות ועמימות. תיאור המציאות של המאה ה-21.<\/li>\n<li><strong>STEEEP<\/strong> – מודל לסריקה שיטתית של מגמות שינוי: חברתיות, טכנולוגיות, כלכליות, סביבתיות, חינוכיות ופוליטיות.<\/li>\n<li><strong>מורכבות ארגונית<\/strong> – מגוון רחב של ישויות בארגון שמקיימות יחסי גומלין ומשפיעות על אירועים. סוגיה: אנכית, אופקית, מרחבית, טכנולוגית והסתגלותית.<\/li>\n<li><strong>\"ארגון האיך\" / \"ארגון הלמה\"<\/strong> – בארגון האיך ההנהלה קובעת \"לפרטי פרטים\" איך עושים כל דבר. בארגון הלמה ההנהלה מגדירה את היעדים (המצפן), ובעלי העניין בוחרים את הדרכים.<\/li>\n<li><strong>ארגון שביר / אנטי-שביר<\/strong> – לפי טאלב. ארגון שביר נפגע מהשינוי. ארגון אנטי-שביר מנצל את השינוי לצמיחה, ומאופיין בחיבור למציאות, בביזור השליטה וביתירות (redundancy) של דרכי פעולה.<\/li>\n<li><strong>ארגון מורכב מסתגל (CAS)<\/strong> – ארגון שבנוי כמערכת אקולוגית פתוחה ודינמית שמסוגלת ללמוד ולהסתגל למציאות משתנה.<\/li>\n<li><strong>גורמים פעלנים<\/strong> – ארגון, מחלקה, צוות או אדם שפועלים באופן עצמאי ומקיימים יחסי גומלין דינמיים.<\/li>\n<li><strong>התארגנות עצמית והתהוות<\/strong> – גורמים פעלנים מתארגנים בעצמם לשיתופי פעולה, ובתהליך \"מלמטה למעלה\" נוצרים דפוסים ארגוניים חדשים.<\/li>\n<li><strong>סף הכאוס<\/strong> – מצב ביניים בין \"יציבות קפואה ומנוונת\" לבין \"פעילות כאוטית ובלתי נשלטת\", שמניע יצירתיות וחדשנות.<\/li>\n<li><strong>זמישות ארגונית<\/strong> – יכולת להתאים את העשייה הארגונית במהירות לשינויים במציאות.<\/li>\n<li><strong>מצפן בית ספרי<\/strong> – עקרונות ויעדי מדיניות ברורים, מוסכמים ושקופים, שמבוססים על המצפן המערכתי של מערכת החינוך ועל חזון בית ספרי ומודלים קוגניטיביים ייחודיים.<\/li>\n<li><strong>סריקה סביבתית<\/strong> – מנגנון לניטור, זיהוי וניתוח מהירים של מידע פנימי וחיצוני, ולגזירת אתגרים והזדמנויות ממנו.<\/li>\n<\/ul>","models":"<h3>1. מאפייני מציאות ה-VUCA<\/h3>\n<ul>\n<li><strong>תנודתיות<\/strong>: שינויים מהירים וחדים בפרקי זמן קצרים. אתגרים והזדמנויות מופיעים בפתאומיות וללא התרעה.<\/li>\n<li><strong>חוסר ודאות<\/strong>: מחסור במידע מקשה להבין את המציאות. הרצון לייצר ודאות עלול להוביל להנחה ש\"מה שהיה הוא שיהיה\" ולהסתמכות-יתר על ניסיון העבר.<\/li>\n<li><strong>מורכבות<\/strong>: ריבוי גורמים פעילים בקשרי גומלין. אי אפשר לבודד גורמים משפיעים או אתגרים נפרדים.<\/li>\n<li><strong>עמימות<\/strong>: יש מידע, אבל אי אפשר להבין עד הסוף את משמעות המציאות ואת ההשפעה האפשרית של אירועים עתידיים.<\/li>\n<\/ul>\n<h3>2. קטגוריות STEEEP<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>קטגוריה<\/th>\n<th>דוגמאות לתכולה (מתוך המסמך)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>חברה (Social)<\/td>\n<td>דת, סגנונות חיים, ערכים, תודעה בריאותית, דמוגרפיה וגידול אוכלוסין, גילאים, קריירה, בטיחות, התנהגות צרכנית ופרסום<\/td>\n<\/tr>\n<tr>\n<td>טכנולוגיה (Technological)<\/td>\n<td>מו\"פ, אוטומציה, תמריצים טכנולוגיים וקצב השינוי, חדשנות, תקשורת, אנרגיה, תחבורה, פטנטים, מחזור חיי מוצרים<\/td>\n<\/tr>\n<tr>\n<td>כלכלה (Economic)<\/td>\n<td>צמיחה, ריבית, שערי חליפין, אינפלציה, סחר, מסים, חיסכון, סובסידיות, תעסוקה, מקצועות וכישורים חדשים, יזמות<\/td>\n<\/tr>\n<tr>\n<td>סביבה (Environmental)<\/td>\n<td>מים, רוח, אדמה, מזון, אנרגיה, זיהום, קיימות<\/td>\n<\/tr>\n<tr>\n<td>פוליטיקה (Political)<\/td>\n<td>רגולציה ונושאים משפטיים, הגבלים, שווקים ומסחר, מדיניות מס, הגנת הצרכן, שיפוט, איגודים מקצועיים, בריאות ובטיחות עובדים, אתיקה<\/td>\n<\/tr>\n<tr>\n<td>חינוך (Educational)<\/td>\n<td>תוכניות ותכני לימוד, פרקטיקות למידה והוראה, הערכה, מנהיגות ניהולית חינוכית, תכנון וארגון, חיבוריות, תשתיות פיזיות וטכנולוגיות<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>3. סוגי מורכבות ארגונית<\/h3>\n<p>אנכית (ריבוי רמות היררכיה); אופקית (מספר מחלקות או מומחים); מרחבית (פיזור גיאוגרפי); טכנולוגית; הסתגלותית (הצורך של מרכיבי הארגון להסתגל ולהתפתח יחד).<\/p>\n<p><strong>מגמות שמגבירות את המורכבות בבתי הספר<\/strong>: ביזור והאצלת סמכויות; ריבוי ומגוון בעלי עניין (רגולטור, הורים, איגודי מורים, אקדמיה, צבא, שוק התעסוקה); דרישה לחינוך מותאם אישית; משילות רב-שכבתית; ובנוסף ריבוי תקנות ובקרות ממשלתיות.<\/p>\n<h3>4. מאפייני הארגון השביר (\"ארגון האיך\")<\/h3>\n<ol>\n<li><strong>ריכוזיות<\/strong>: שרשרת ארוכה ואיטית של זרימת מידע במעלה ההיררכיה, החלטות, הנחיות במורד ההיררכיה ופיקוח. היא חשופה לחוסר יעילות ולאינטרסים פוליטיים.<\/li>\n<li><strong>ניתוק מגירויי הסביבה החיצונית<\/strong>: מרכז ההחלטות אינו מחובר \"באופן אינטימי\" לשטח ולבעלי העניין, ומתקשה להגיב בזמן.<\/li>\n<li><strong>אחידות<\/strong>: דרך אחת ויחידה \"מאושרת\", בלי חלופות זמינות כשהמציאות משתנה.<\/li>\n<\/ol>\n<h3>5. דרכי ההתמודדות של ארגון מורכב מסתגל עם VUCA<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>מאפיין<\/th>\n<th>דרכי התמודדות<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>תנודתיות<\/td>\n<td>הגדרת חזון שמאפשר לנווט במציאות הסוערת ולהישאר ממוקדים ביעד; פיתוח זמישות ארגונית להתאמה מהירה לשינויים<\/td>\n<\/tr>\n<tr>\n<td>חוסר ודאות<\/td>\n<td>פיתוח ערוצים לניטור, איסוף וניתוח מידע, כדי \"להתבונן ולהקשיב לסביבה\" ולגבש תמונת מצב כבסיס לתוכנית פעולה<\/td>\n<\/tr>\n<tr>\n<td>מורכבות<\/td>\n<td>מבנה ארגוני שהוא \"תמונת מראה לסביבה\"; יצירת בהירות על ידי המנהלים, עבורם ועבור הארגון<\/td>\n<\/tr>\n<tr>\n<td>עמימות<\/td>\n<td>השקעה בהתנסויות שמאפשרות ללמוד את יחסי הגומלין בסביבה, תוך לקיחת סיכונים; זמישות להתאמה מהירה כשהדברים מתבהרים<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>6. מאפייני ארגון מורכב מסתגל (איור 1)<\/h3>\n<ol>\n<li><strong>גורמים פעלנים<\/strong>: ארגון, מחלקה, צוות או אדם, שמקיימים קשרים ויחסי גומלין דינמיים.<\/li>\n<li><strong>התפתחות משולבת<\/strong> (באיור: \"התפתחות משותפת\"): הגורמים מתפתחים יחד דרך יחסי גומלין שמשלבים תחרות ושיתוף. ההבנה מתמקדת במכלול היחסים ולא בכל גורם בנפרד.<\/li>\n<li><strong>אי-ליניאריות<\/strong>: אין קשר מובהק בין סיבה לתוצאה. \"אפקט הפרפר\"; תוצאה אחת יכולה לנבוע מכמה סיבות; סיבה אחת יכולה להוביל לכמה תוצאות; תנאי פתיחה כמעט זהים יכולים להתפתח לכיוונים שונים לחלוטין.<\/li>\n<li><strong>קושי בחיזוי<\/strong>: אי אפשר לחזות בפרטנות, אבל חשיבה מערכתית יכולה לזהות \"המבנים הבסיסיים מחוללי השינוי\".<\/li>\n<li><strong>יכולת הסתגלות<\/strong>: למידה מהניסיון והסתגלות מהירה, על בסיס אוטונומיה וזיכרון מקומי.<\/li>\n<li><strong>התארגנות עצמית<\/strong>, בשתי גישות לקידומה:\n        - <em>מינימליסטית<\/em>: מפגשים ספונטניים ובלתי פורמליים, בלי משימה מוגדרת מראש, בלי קריטריון לבחירת משתתפים ובלי מבנה דיון. ההנחה היא שאי-הוודאות מעוררת רעיונות יצירתיים.\n        - <em>מובנית<\/em>: עיצוב מדיניות, מבנים ופרקטיקות שמעודדים התארגנות עצמית, כמו מצפן מנחה, אקו-סיסטם תומך, אוטונומיה לעובדים ושיתוף כל בעלי העניין.<\/li>\n<li><strong>התהוות<\/strong>: דפוסים חדשים נוצרים \"מלמטה למעלה\", ולא \"מלמעלה למטה\" בהנחיות ההנהלה.<\/li>\n<li><strong>שליטה מבוזרת<\/strong>: ביזור שליטה שמאפשר אוטונומיה והתארגנות עצמית.<\/li>\n<li><strong>הימצאות על סף הכאוס<\/strong>: יציבות ואי-יציבות, שגרה וחידוש, סדר ואי-סדר שזורים יחד.<\/li>\n<\/ol>\n<h3>7. גישות לניהול ארגון מורכב מסתגל (איור 2)<\/h3>\n<ol>\n<li><strong>חזון ארגוני<\/strong>: ברור, ידוע ומוסכם. משמש מצפן ומונע גלישה לאנרכיה.<\/li>\n<li><strong>רעיונות מושכים<\/strong>: מעבר מגישת \"דחיפה\" (הנחתת הוראות) לגישת \"משיכה\" (הצגת רעיונות ואתגרים מושכים ועידוד לפעול מולם).<\/li>\n<li><strong>כללים פשוטים<\/strong>: מעט כללים שמאפשרים ותומכים בפעילות שיתופית.<\/li>\n<li><strong>התנסות ורפלקציה<\/strong>: קודם מתנסים ואחר כך מפיקים תובנות, במקום הרצף המסורתי של ניתוח בעיה, תכנון ויישום.<\/li>\n<li><strong>פעולה במקטעים<\/strong>: ניסויים קטנים ופשוטים עם רפלקציה. מאמצים את מה שעובד, משמיטים את מה שלא, ומחברים בהדרגה למענה שלם.<\/li>\n<li><strong>משוב<\/strong>: גורם מפתח בלמידה ארגונית, בהתהוות ובהתארגנות עצמית.<\/li>\n<li><strong>ניהול המתח הארגוני<\/strong>: מיקום הארגון על \"סף הכאוס\". כשיש עודף אי-סדר שמאיים על היציבות, מגבירים משמעת ושליטה. כשהארגון מקובע, מכניסים אי-סדר ושינוי באמצעות:\n        - הגברת החופש באמצעות ביזור והאצלת סמכויות\n        - הגברה יזומה של המתח הקונסטרוקטיבי\n        - הגברת המגוון בין חברי הארגון, לנקודות מבט מאזנות ומפרות\n        - ניצול לחיוב של פרדוקסים ומתחים קיימים\n        - מתן אפשרות לסיטואציות לא יציבות \"לבעבע\" בלי לכפות פתרון\n        - עידוד יצירתיות<\/li>\n<\/ol>\n<h3>8. המודל: שלושת רכיבי בית הספר המורכב המסתגל (איור 3)<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>רכיב<\/th>\n<th>תיאור<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מצפן בית ספרי מותאם ועדכני<\/strong><\/td>\n<td>מוגדר ומנוהל על ידי ההנהלה בשיתוף בעלי העניין. בנוי על המצפן המערכתי (מטרות, ידע, מיומנויות, ערכים ועקרונות פעולה), ומעליו \"נדבך\" של חזון בית ספרי ומודלים קוגניטיביים ייחודיים. מבוסס על חשיבת עתיד<\/td>\n<\/tr>\n<tr>\n<td><strong>בעלי עניין אוטונומיים ופעלנים<\/strong><\/td>\n<td>הנהלה, מורים, תלמידים, הורים, קהילה ובעלי עניין חיצוניים. פועלים בדרכים חלופיות להשגת יעדי המצפן ומתארגנים בעצמם<\/td>\n<\/tr>\n<tr>\n<td><strong>אקו-סיסטם דינמי, תומך ומאפשר<\/strong><\/td>\n<td>\"מעטפת\" חיצונית (מטה, מחוז, רשות) ופנימית (בית הספר) שתומכת בפעולה העצמאית והיזמית<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>תועלות לפי המסמך<\/strong>: התאמה טובה יותר למציאות ולמשברים; הפיכה לארגון אנטי-שביר; יעילות, בזכות מיצוי משאבי כל בעלי העניין; שביעות רצון גבוהה יותר של בעלי העניין.<\/p>\n<h3>9. המצפן: חזון, מודלים קוגניטיביים וסריקה סביבתית<\/h3>\n<p><strong>פעילויות בעיצוב החזון<\/strong> (בתהליך שיתופי שמובילים ההנהלה וצוות ההוראה, בשיטת חשיבת עתיד):<\/p>\n<ul>\n<li>סריקת מגמות וזיהוי האתגרים וההזדמנויות שנגזרים מהן (אפשר להיעזר בתוצרי אגף מו\"פ)<\/li>\n<li>זיהוי תרחישי עתיד אפשריים<\/li>\n<li>עיצוב עתיד רצוי (חזון) בתוך תרחישי העתיד האפשריים<\/li>\n<li>בניית תוכנית פעולה בהווה להשגת העתיד הרצוי<\/li>\n<li>שילוב חוזקות רלוונטיות של בית הספר בחזון, תוך היכרות עם ההיבטים החיוביים והשליליים של ההיסטוריה שלו<\/li>\n<li>גזירה מהחזון של מיומנויות הליבה הנדרשות<\/li>\n<li>הערכה תקופתית, עדכון ושיפור של העתיד הרצוי<\/li>\n<\/ul>\n<p><strong>דרכים להטמיע את החזון<\/strong>: תקשורת בשפה ברורה ופשוטה (כתובה, אישית, וסימולציה של תרחישים מנקודות מבט של בעלי עניין שונים); הלימה בין החזון לבין המסרים שמעבירות הנוכחות והפעילות של המנהיגות; תקשורת ישירה של המנהיגות עם בעלי העניין; ניהול ובקרה יעילים של תוכניות העבודה.<\/p>\n<p><strong>מודלים קוגניטיביים, רעיונות מסדרים ומטאפורות<\/strong>: הם מפשטים את המורכבות, מגבירים את תחושת השליטה ונותנים שפה משותפת. מנגד, הם חלקיים ומוטים, ולכן כדאי להשתמש בכמה מודלים במקביל ולהסביר איך הם מתקיימים יחד.<\/p>\n<p><strong>סריקה סביבתית<\/strong>:<\/p>\n<ul>\n<li><em>מידע פנימי<\/em>: מורים, תלמידים, קשרים אישיים ואינטראקציות, פעילויות בית ספריות.<\/li>\n<li><em>מידע חיצוני<\/em>: הורים, איגודי מורים וארגונים חינוכיים, מדיניות לאומית, ומגמות STEEEP גלובליות ומקומיות.<\/li>\n<li><em>תדירות<\/em>: פעם בשנה בשגרה, ובזמן חירום (כמו הקורונה) לפעמים כל כמה חודשים.<\/li>\n<li><em>סוגים<\/em>: סריקה שגרתית-פסיבית (תמונת מצב מול מאפיינים קבועים) וסריקה אקטיבית (חיפוש פתרונות לאתגר מסוים).<\/li>\n<li><em>כלים<\/em>: שאלונים, קבוצות מיקוד, עידוד בעלי עניין לדווח על מגמות, אירועים ולקחים, איתור מחקרים, ושיתופי ידע עם בתי ספר ועם גורמים חיצוניים. המידע נשמר במאגר ממוחשב.<\/li>\n<li><em>ניתוח<\/em>: זיהוי דפוסים בהשוואה לעבר או באמצעות חשיבת עתיד. כדאי לחפש דפוסים לא ליניאריים, חריגים ואירועים בלתי צפויים, ולהימנע מהתקבעות בפתרונות העבר.<\/li>\n<\/ul>\n<h3>10. בעלי עניין אוטונומיים ופעלנים<\/h3>\n<ul>\n<li><strong>צוותים אוטונומיים<\/strong>: מתארגנים בעצמם, הטרוגניים בתפקידים וברקע המקצועי, פועלים לפי מעט כללים גמישים, מנוהלים בידי מנהיגים לא פורמליים או שגרות מעין-פורמליות, מחליטים יחד ומתפרקים בסוף המשימה. הם זקוקים למשוב מעמיק ולתצפית עמיתים, לא לשליטה מרכזית.<\/li>\n<li><strong>יצירתיות וחדשנות<\/strong>: יצירתיות היא פיתוח דרך חשיבה, המצאה או פתרון. חדשנות היא יישום שלהם.<\/li>\n<li><strong>תפקידי ההנהלה<\/strong>:<ul>\n<li>למקד את העשייה ביעדי המצפן וליצור סביבה מאפשרת<\/li>\n<li>לעבור מתפקידי הנחיה ופיקוח לתפקידים של מאמנים, מנטורים, מנתחי לקוחות ומסירי חסמים<\/li>\n<li>לקדם אמון ותיאום בין צוותי מורים ומנהלנים, קשר עם בעלי עניין חיצוניים ורשתות חברתיות<\/li>\n<li>לתמוך בפתרון בעיות בין-אישיות, תוך-קבוצתיות ובין-קבוצתיות<\/li>\n<li>לעודד יצירתיות: לעצב את המצפן בשיתוף, לנהל את \"סף הכאוס\", לפתח תרבות שמטפחת יצירה וזרימת מידע, לבנות מערכת הערכה ותגמול לחדשנות, לתת אוטונומיה, להעצים מורים ולהישען על נתונים ועל חשיבת עתיד<\/li>\n<\/ul>\n<\/li>\n<li><strong>הגנה על הצוות משחיקה ומלחצים חיצוניים<\/strong> (ובעיקר מהדרישה להתמקד בהערכה סטנדרטית):<ol>\n<li>הזרמת משאבים ו\"אנרגיה ארגונית חיובית\"<\/li>\n<li>העברת המיקוד ממטרות חיצוניות כפויות למטרות פנימיות מוסכמות<\/li>\n<li>ויסות המהירות וההיקף של יישום רפורמות לפי יכולת ההתמודדות של בית הספר<\/li>\n<li>שקיפות ארגונית<\/li>\n<li>המרת התנהגויות פוגעניות רגשית בדפוסים שבונים מחדש אמון, ביטחון, יכולת וגאווה<\/li>\n<\/ol>\n<\/li>\n<\/ul>\n<p>כל אלה נועדו ליצור תנאים שבהם הצלחה אפשרית.<\/p>\n<h3>11. האקו-סיסטם התומך והמאפשר (איור 4)<\/h3>\n<p>רכיבים: מנהיגות, חיבוריות, תוכניות לימודים, מבנה ארגוני, הון אנושי, תשתיות פיזיות וטכנולוגיות, תרבות ושירותים, ובטקסט גם תקציב ומשאבים. האקו-סיסטם החיצוני כולל את מערכת החינוך, המחוז, הרשות ורשת מוסדות (למשל אורט או אמי\"ת).<\/p>\n<p><strong>א. מנהיגות<\/strong>\n<em>זוויות מבט חדשות<\/em> (במקום \"ודאות כוזבת\" ו\"אשליית השליטה המוחלטת\"):<\/p>\n<ul>\n<li>התעניינות באינטראקציות ספציפיות שנוצרות בהקשר מסוים<\/li>\n<li>תשומת לב לדרכים שבהן מטפלים באי-ודאות בחיי היומיום, ולמידה מהן<\/li>\n<li>התעניינות בפערים בין תוכניות לתוצאות, בלי שיפוט מיידי ובלי להגדיר אותם ככישלון<\/li>\n<li>נכונות להכיר במורכבות ולפעול בה מתוך כוונה להבין, ולא למהר להחליף אותה ב\"מודלים פשוטים של ניהול\"<\/li>\n<li>החלפת הציפייה לשליטה ובקרה בעידוד פעילות מתוך כוונה ולקיחת אחריות<\/li>\n<\/ul>\n<p><em>דפוסי ניהול<\/em>:<\/p>\n<ol>\n<li><strong>הכלת המורכבות וניווט בהתאם<\/strong>: להתמודד עם החרדה שמעוררות מגבלות התכנון והשליטה, ובכל זאת לשמור על תחושת אחריות וכוונה.<\/li>\n<li><strong>אומץ<\/strong>: לפעול בלי לדעת מראש, \"אך לא בלי לחשוב, בלי לחקור או בלי לתכנן\".<\/li>\n<li><strong>הכלה של דואליות ושל פרדוקסים<\/strong>: להמיר \"או... או\" ב\"גם... וגם\". המנהיגות היא בו-זמנית \"יודעת\" ו\"אינה יודעת\", \"מעצבת\" ו\"מעוצבת\", \"מסוגלת\" ו\"שאינה מסוגלת\".<\/li>\n<li><strong>מנהיגות מבוזרת<\/strong>: \"מנהיגים גדולים יוצרים מונהגים גדולים\" (רובין שארמה). היא מגבירה למידה, משפרת החלטות, מקטינה את הנזק כשמנהל עוזב ומגבירה מורל ומחויבות. שלוש רמות ביזור:\n        - <em>מונחה<\/em>: המנהל יוצר ומנחה קהילות למידה מקצועיות.\n        - <em>מתהווה<\/em>: מורים לוקחים תפקידי מנהיגות בלי הכוונה, והמנהל מספק סביבה תומכת.\n        - <em>אסרטיבי<\/em>: מורים לוקחים תפקידי מנהיגות בלי הכוונה ומרגישים בנוח לאתגר את הנורמות.<\/li>\n<\/ol>\n<p><em>עקרונות למנהיגות<\/em>:<\/p>\n<ul>\n<li>להפגין ולהצמיח מנהיגות לומדת ומטפחת אצל כל בעלי העניין, כולל התלמידים<\/li>\n<li>לוודא שפעולות הארגון תואמות את החזון, המטרות והערכים<\/li>\n<li>להיות סוכני שינוי פרו-אקטיביים ויצירתיים<\/li>\n<li>לקדם למידה ארגונית, שינוי וחדשנות<\/li>\n<li>לעצב סביבה שתומכת באמון, בדיאלוג מקצועי ובשיתופי ידע ופעולה<\/li>\n<li>לקדם שיתופי פעולה עם בתי ספר אחרים, הורים, קהילה ושותפים<\/li>\n<li>לספק חינוך כולל והוגן בהיבטים של שלומות ולמידה<\/li>\n<\/ul>\n<p><strong>ב. חיבוריות<\/strong> – בית הספר:<\/p>\n<ol>\n<li>סורק את הסביבה החיצונית<\/li>\n<li>הוא מערכת פתוחה שמקבלת בברכה שיתופי פעולה<\/li>\n<li>מקיים שותפויות שוויוניות ולמידה הדדית<\/li>\n<li>מקיים מנגנוני שיתופיות (רשתות פורמליות ובלתי פורמליות, קהילות ידע ועשייה)<\/li>\n<li>מנהל ומפיץ ידע לבעלי העניין<\/li>\n<li>מטפח שיח בקבוצות הטרוגניות של בעלי עניין סביב אתגרים משותפים<\/li>\n<li>רואה בהורים ובקהילה שותפים<\/li>\n<li>מקיים שיתוף פעולה ולמידה עם עמיתים בבתי ספר אחרים ורשתות<\/li>\n<li>משתף פעולה עם מוסדות להשכלה גבוהה, צה\"ל, עסקים, ארגונים ציבוריים והמגזר השלישי<\/li>\n<li>משתמש בתקשוב לתקשורת ולשיתוף עם הסביבה<\/li>\n<\/ol>\n<p><strong>ג. תוכניות לימודים<\/strong> – פיתוח פדגוגי עצמאי של יוזמות, יחידות הוראה, מערכי שיעור ותוכניות אישיות. המערכת צריכה לספק תוכניות פתוחות וגמישות, משאבים, זמן, כלים, הדרכה וליווי.<\/p>\n<p><strong>ד. מבנה ארגוני<\/strong> – שיטוח ההיררכיה ושילוב בין מבנים היררכיים (לתיאום) לבין מבנים אופקיים (לתקשורת, לחדשנות וליצירתיות). צוותים מתארגנים אד-הוק.<\/p>\n<p><strong>ה. הון אנושי<\/strong> – היבטי הלמידה המקצועית:<\/p>\n<ol>\n<li>עוסקת בלמידה של התלמידים<\/li>\n<li>מקנה יכולת לפעול בבית ספר מורכב מסתגל<\/li>\n<li>מפתחת מיומנויות כמו יצירתיות, חדשנות, חשיבת עתיד וחוסן<\/li>\n<li>משלבת למידה תוך כדי עבודה עם למידה חיצונית<\/li>\n<li>הסגל שותף בהגדרת המטרות וסדרי העדיפויות של הלמידה<\/li>\n<li>תרבות בית הספר תומכת בה<\/li>\n<li>כל הסגל לומד באופן מתמשך<\/li>\n<li>סגל חדש מקבל הדרכה וחונכות<\/li>\n<li>מבוססת על הערכה ומשוב<\/li>\n<li>מוקצים לה זמן ומשאבים ייעודיים<\/li>\n<\/ol>\n<p><strong>ו. תשתיות פיזיות וטכנולוגיות<\/strong> – תשתיות שתומכות בפדגוגיה, בחשיבת עתיד ובסריקה, בצוותים שיתופיים וזמישים, בניהול והפצת ידע ובתקשורת עם בעלי העניין.<\/p>\n<p><strong>ז. תרבות<\/strong> – אימוץ התפישה שבעלי העניין הם מנוע השינוי, לגיטימציה ליישם את המצפן בדרכים ייחודיות, עידוד חיבורים, חשיבת עתיד וזמישות, ומעבר \"מתרבות של פיקוח... לתרבות של טיפוח\". מאפייני תרבות של חקר, יצירתיות וחדשנות:<\/p>\n<ul>\n<li>בעלי העניין פונים זה לזה להתייעצות<\/li>\n<li>התרבות תומכת בהתארגנות עצמית ליזמות<\/li>\n<li>אמון וכבוד הדדי הם ערכי ליבה<\/li>\n<li>התרבות מעודדת התנסות וחידוש תוך סיכונים מחושבים<\/li>\n<li>התרבות מעודדת חקר<\/li>\n<li>יש פתיחות לעשות דברים אחרת<\/li>\n<li>בעיות וטעויות נתפסות כהזדמנויות ללמידה<\/li>\n<\/ul>\n<p><strong>ח. שירותים<\/strong>\n<em>חיצוניים (ממערכת החינוך)<\/em>: מידע וידע בתחומי המצפן המערכתי; תמונת מצב של מגמות; מאגרי דוגמאות ליוזמות ולפרקטיקות; הדרכה ממערך הפסגות; ליווי והטמעה; \"אסדרה דינמית\" שמאפשרת חדשנות; <strong>שירותים שתומכים בשלומות הצוות החינוכי<\/strong>.\n<em>פנימיים (בית הספר)<\/em>: הנגשת דוגמאות לפרקטיקות; רשימת מחקרים רלוונטיים; תוכנית פיתוח מבוססת נתונים שמתעדכנת; פונקציית מו\"פ בית ספרית; מנגנוני דיאלוג וחילופי ידע; בחינת התקדמות היוזמות והערכת הפער בין ההשפעה הרצויה למצויה; הכשרת הסגל לעבודת צוות ולהערכה צוותית עצמית; הערכה ועדכון של תפישת הפעולה; הערכת הפיתוח המקצועי.<\/p>\n<p><strong>ט. תקציב ומשאבים<\/strong> – השקעה בהקמה (תשתיות, הכשרה והטמעה) ובהתנהלות השוטפת, למשל בסריקה סביבתית תקופתית.<\/p>\n<h3>12. סיכום המסמך: מה נדרש מבתי הספר<\/h3>\n<p>פיתוח מנגנוני חקר עתידים וסריקה סביבתית; הגדרת מצפן בית ספרי; מתן אוטונומיה ויכולת התארגנות עצמית לבעלי העניין; בניית אקו-סיסטם תומך; ומנהיגות שמשקיעה בחשיבת עתיד, \"נוטלת סיכונים ומנהלת את בית הספר באופן מודע ומתמיד על 'סף הכאוס'\". המעבר מתואר כ\"שינוי ממעלה שנייה\".<\/p>","practice":"<ul>\n<li>להכיר את המושגים (מצפן, זמישות, סף הכאוס, אקו-סיסטם, \"ארגון הלמה\"). מנהלים ומפקחים עשויים לחשוב ולדבר בשפה הזו, וההיכרות איתה מקלה לבנות שפה משותפת עם ההנהלה.<\/li>\n<li>המסמך מצפה מהמנהל \"להתמודד עם החרדה שמעוררת ההכרה במגבלות התכנון והשליטה\". כאן יש מקום טבעי לפגישות האישיות עם המנהל: לעזור לו להחזיק אי-ודאות ופרדוקסים (\"גם... וגם\") בלי לברוח לשליטת-יתר או לכאוס.<\/li>\n<li>להעריך יחד עם ההנהלה איפה בית הספר נמצא על הרצף בין \"יציבות קפואה\" ל\"כאוס\". לפי המסמך, ההמלצות שונות לכל מצב: להגביר סדר, או להכניס אי-סדר מבוקר.<\/li>\n<li>להציע התערבויות מערכתיות ברוח \"התנסות ורפלקציה\" ו\"פעולה במקטעים\": ניסוי קטן, משוב ורפלקציה, ואז הרחבה. זאת במקום תוכנית גדולה שנכפית מלמעלה.<\/li>\n<li>לשים לב שהמסמך מציין \"שירותים התומכים בשלומות הצוות החינוכי\" ואת הצורך להגן על הסגל משחיקה ולהמיר התנהגויות פוגעניות בדפוסים שבונים אמון. אלה נקודות שבהן אפשר למקם את העבודה הפסיכולוגית עם צוותים.<\/li>\n<li>לאמץ בעבודה שלך את העמדה ש\"פערים בין תוכניות לתוצאות\" ראויים להתעניינות בלי שיפוט מיידי, וש\"בעיות וטעויות נתפסות כהזדמנויות ללמידה\".<\/li>\n<li>להשתמש ברעיון של קבוצות שיח הטרוגניות (מורים, הורים, תלמידים, גורמי חוץ) סביב אתגר משותף ככלי מערכתי.<\/li>\n<\/ul>","questions":"<ul>\n<li>המסמך ממליץ לפעמים על עמימות מכוונת ועל \"סף הכאוס\", ומאמרים פסיכואנליטיים-מערכתיים מדגישים שמשימה עמומה מעוררת חרדה והגנות. איך מיישבים בין השניים? מה תפקידו של \"מצפן ברור\" כמיכל?<\/li>\n<li>איפה בית הספר שלי נמצא: \"ארגון האיך\" או \"ארגון הלמה\"? איך זה משפיע על האופן שבו מתקבלות בו התערבויות פסיכולוגיות?<\/li>\n<li>מה יכולות להיות ההשלכות הרגשיות על הצוות של ביזור, צוותים שנוצרים ומתפרקים ו\"סף כאוס\" מתמיד? איך אפשר לזהות מתי זה מפרה ומתי זה שוחק?<\/li>\n<li>איך אני יכול לעזור למנהל להחזיק את הדואליות \"יודע / אינו יודע\", בלי לחזק אצלו \"ודאות כוזבת\"?<\/li>\n<li>איזה מקום אני, כנציג השפ\"ח, תופס באקו-סיסטם החיצוני שתומך בבית הספר? האם אני נתפס כחלק מה\"שירותים\" או כשותף לחשיבה?<\/li>\n<\/ul>","quotes":"<ul>\n<li>\"ארגון מורכב מסתגל במיטבו הוא ארגון אנטי שביר שלא רק שאינו נפגע מהמציאות המשתנה והמורכבת אלא מנצל אותה לצורך צמיחה והתפתחות.\"<\/li>\n<li>\"מצופה מהמנהל להתמודד עם החרדה שמעוררת ההכרה במגבלות התכנון והשליטה, ועם זאת לשמור על תחושה חזקה של אחריות וכוונה, המשפיעה על המציאות, גם אם אינה מתממשת במלואה.\"<\/li>\n<li>\"לעיתים, על ההנהלה להדגיש דווקא את חילוקי הדעות שעולים מן הצוותים ולא את ההסכמות כדי לקדם דיאלוג אמיתי הגורם להתהוות של דפוסי התנהלות בית ספריים חדשים.\"<\/li>\n<li>\"בתרבות הבית ספרית בעיות וטעויות נתפסות כהזדמנויות ללמידה\"<\/li>\n<\/ul>"},"level":"שנה ד' (וגם למתמחים בשנים ב'-ג' שעובדים עם הנהלות על תהליכי שינוי ארגוני)","stype":"דו\"ח (מסמך מסגרת תפישתית-ארגונית של משרד החינוך, קרוב באופיו למתווה מדיניות ולמודל עבודה)","tldr":"המסמך של אגף מו\"פ במשרד החינוך מציע לבתי הספר מסגרת תפישתית ארגונית שמבוססת על תורת המערכות המורכבות המסתגלות (Complex Adaptive Systems – CAS). נקודת המוצא היא שהמציאות של המאה ה-21 היא מציאות VUCA: תנודתית, לא ודאית, מורכבת ועמומה. משבר הקורונה…","search":"המסמך של אגף מו\"פ במשרד החינוך מציע לבתי הספר מסגרת תפישתית ארגונית שמבוססת על תורת המערכות המורכבות המסתגלות (Complex Adaptive Systems – CAS). נקודת המוצא היא שהמציאות של המאה ה-21 היא מציאות VUCA: תנודתית, לא ודאית, מורכבת ועמומה. משבר הקורונה המחיש זאת. במקביל פועלות מגמות שינוי חברתיות, טכנולוגיות, כלכליות, סביבתיות, חינוכיות ופוליטיות (STEEEP), והמורכבות הארגונית של בתי הספר גוברת. ארגון היררכי-ריכוזי, \"ארגון האיך\", הוא \"שביר\" (טאלב) בגלל ריכוזיות, ניתוק מגירויי הסביבה ואחידות. המענה המוצע הוא ארגון מורכב מסתגל, ובמיטבו \"אנטי-שביר\". מאפייניו הם גורמים פעלנים, התארגנות עצמית, התהוות \"מלמטה למעלה\", שליטה מבוזרת והתנהלות \"על סף הכאוס\". המודל לבית הספר כולל שלושה רכיבים שמקיימים יחסי גומלין: מצפן בית ספרי מותאם ועדכני (חזון, מודלים קוגניטיביים, חשיבת עתיד וסריקה סביבתית); בעלי עניין אוטונומיים ופעלנים (צוותים מתארגנים, יצירתיות וחדשנות, הנהלה כמאמנת וכמסירת חסמים); ואקו-סיסטם תומך ומאפשר (מנהיגות, חיבוריות, תוכניות
