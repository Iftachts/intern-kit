יס ל\"מפת דרכים\", ואפשר לקרוא אותו כהמשך למשולש של בהט <a class=\"ref\" href=\"#i-yablon2019\" data-ref=\"yablon2019\">יבלון 2019<\/a>. קוהוט, ויניקוט ובולבי מופיעים כבסיס התיאורטי לשנה ד' <a class=\"ref\" href=\"#i-theorists\" data-ref=\"theorists\">קוהוט, ויניקוט, בולבי<\/a>.<\/p>\n<h4>רעיונות שחוזרים במקורות<\/h4>\n<ul>\n<li><strong>המסגרת היא חלק מהטיפול.<\/strong> קלנר מתייחסת להפרת החוזה כחומר טיפולי <a class=\"ref\" href=\"#i-kellner2000\" data-ref=\"kellner2000\">קלנר 2000<\/a>. גנץ מראה שהסטינג מעביר מסר, למשל פגישות משותפות קבועות להורים גרושים <a class=\"ref\" href=\"#i-gantz2021\" data-ref=\"gantz2021\">גנץ 2021<\/a>. מילר פותחת את הפגישה הראשונה בהגדרת זמן, מטרה ורישום <a class=\"ref\" href=\"#i-miller\" data-ref=\"miller\">הפגישה הראשונה (Miller)<\/a>. הספר לילדים מסביר לילד את המסגרת: תדירות, חדר וסודיות <a class=\"ref\" href=\"#i-playbook\" data-ref=\"playbook\">הספר הראשון על טיפול במשחק<\/a>.<\/li>\n<li><strong>ההורים בתוך הטיפול.<\/strong> הספר לילדים אומר שבעיות של ילדים עוברות מהר יותר כשגם ההורים נפגשים עם המטפל <a class=\"ref\" href=\"#i-playbook\" data-ref=\"playbook\">הספר הראשון על טיפול במשחק<\/a>. כוכבי ממליצה לשלב את ההורים בטיפול במתבגרים בלי לוותר על פרטיות וסודיות <a class=\"ref\" href=\"#i-kochavi2018\" data-ref=\"kochavi2018\">כוכבי 2018<\/a>. גנץ מסבירה למה הטיפול בהורים פגיע במיוחד: הסימפטום נמצא אצל הילד, והפתולוגיה בעיקר אצל ההורים <a class=\"ref\" href=\"#i-gantz2021\" data-ref=\"gantz2021\">גנץ 2021<\/a>. מתווה הגנים מבקש לערב לפחות הורה אחד בטיפול בילד <a class=\"ref\" href=\"#i-outline_gan\" data-ref=\"outline_gan\">מודל העבודה בגנים<\/a>.<\/li>\n<li><strong>סודיות ושיתוף.<\/strong> הספר לילדים מתאר סודיות כ\"סוד של כיוון אחד\" <a class=\"ref\" href=\"#i-playbook\" data-ref=\"playbook\">הספר הראשון על טיפול במשחק<\/a>. קלנר ממליצה לומר מראש שהמטפל מתייעץ עם עמיתים בעילום שם <a class=\"ref\" href=\"#i-kellner2000\" data-ref=\"kellner2000\">קלנר 2000<\/a>. גרינולד מזהירה מ\"גבול עבה\" שאינו משתף את הצוות, כי הוא מגביר פיצול ופנטזיות פרנואידיות, ומציעה \"גבול דק\" ששומר על פרטיות <a class=\"ref\" href=\"#i-greenwald2012\" data-ref=\"greenwald2012\">גרינולד 2012<\/a>.<\/li>\n<li><strong>הרגשות של המטפל כמידע.<\/strong> גנץ מציעה להשתמש בכעס, בייאוש או בדחף להפסיק את הטיפול כמידע על דפוס הקשר שההורים מביאים <a class=\"ref\" href=\"#i-gantz2021\" data-ref=\"gantz2021\">גנץ 2021<\/a>. בהט מכלילה את ההעברה הנגדית בקדקוד ההווה של ההמשגה <a class=\"ref\" href=\"#i-bahat\" data-ref=\"bahat\">בהט<\/a>. הטקסט על ביון מתאר מרכיבי ביתא, חומר רגשי לא מעובד שנפלט בהזדהות השלכתית ונקלט אצל האחר <a class=\"ref\" href=\"#i-bion\" data-ref=\"bion\">היכרות עם ביון<\/a>. טנא מתארת את ה-Reverie כקשב גם למצבים רגשיים שחלחלו מהמטופל אל המטפל <a class=\"ref\" href=\"#i-tene2011\" data-ref=\"tene2011\">טנא 2011<\/a>.<\/li>\n<li><strong>עולם פנימי ומציאות יחד.<\/strong> גנץ מבקשת להחזיק תהליך דינמי לצד מטרות תפקודיות קצרות טווח, ומציעה מהלכים \"מבחוץ כלפי פנים\" <a class=\"ref\" href=\"#i-gantz2016\" data-ref=\"gantz2016\">גנץ 2016<\/a>. גרינולד רואה בעמדה החינוכית ובעמדה הטיפולית שתי עמדות משלימות, ומבקשת לזהות מתי אחת מהן משתלטת <a class=\"ref\" href=\"#i-greenwald2012\" data-ref=\"greenwald2012\">גרינולד 2012<\/a>. רודד ועמיתיו כותבים ש\"לא כל טבלת מדבקות עושה את העבודה\", וממליצים להכיר לעומק גם עבודה התנהגותית <a class=\"ref\" href=\"#i-rodded2017\" data-ref=\"rodded2017\">רודד ועמיתיו 2017<\/a>.<\/li>\n<\/ul>\n<h4>מתחים ושאלות פתוחות<\/h4>\n<ul>\n<li><strong>\"ללא זיכרון וללא תשוקה\".<\/strong> הטקסט על ביון מציג את העיקרון כעמדה בפגישה <a class=\"ref\" href=\"#i-bion\" data-ref=\"bion\">היכרות עם ביון<\/a>. גנץ מתארת קליניקה חינוכית שמגיעה עם \"זיכרון\", כלומר מידע מהשדה, ועם \"תשוקה\", כלומר נורמות התפתחותיות, ולצדם אי-ידיעה <a class=\"ref\" href=\"#i-gantz2016\" data-ref=\"gantz2016\">גנץ 2016<\/a>. בהט מזהירה שהעיקרון משמש לפעמים הגנה מפני התחייבות להבנה <a class=\"ref\" href=\"#i-bahat\" data-ref=\"bahat\">בהט<\/a>. כל אחד מהם נותן משקל אחר לידע המוקדם.<\/li>\n<li><strong>טקסטים שנכתבו להקשר אחר.<\/strong> קלנר כתבה על פסיכותרפיה פסיכואנליטית, עם תעריפים וחיוב על פגישות שהוחמצו, ולא על ילדים, הורים או בית ספר <a class=\"ref\" href=\"#i-kellner2000\" data-ref=\"kellner2000\">קלנר 2000<\/a>. מילר כתבה להכשרה בייעוץ ובפסיכותרפיה <a class=\"ref\" href=\"#i-miller\" data-ref=\"miller\">הפגישה הראשונה (Miller)<\/a>. הספר לילדים מתאר טיפול במרפאה וסודיות בלי חריגים <a class=\"ref\" href=\"#i-playbook\" data-ref=\"playbook\">הספר הראשון על טיפול במשחק<\/a>. ההתאמה לשירות ציבורי, שבו מעורבים הורים ובית ספר, נשארת בידי הקורא.<\/li>\n<li><strong>שינוי מהיר.<\/strong> גרינולד פותחת במקרה מהשנה הראשונה שלה: ייעוץ למורה הביא לשינוי התנהגותי מהיר, והיא שאלה אם הסרת הסימפטום יצרה דיכוי רגשי <a class=\"ref\" href=\"#i-greenwald2012\" data-ref=\"greenwald2012\">גרינולד 2012<\/a>. גנץ מחייבת את הקליניקה החינוכית ל\"זמן-ילד\": מחויבות גם לשינוי בתפקוד בטווח הקצר, בלי שהטיפול יהיה בהכרח קצר <a class=\"ref\" href=\"#i-gantz2016\" data-ref=\"gantz2016\">גנץ 2016<\/a>. אין במקורות קריטריון ברור מתי שינוי מהיר הוא הישג.<\/li>\n<\/ul>\n<h4>איפה להתחיל<\/h4>\n<ul>\n<li>לקרוא את <a class=\"ref\" href=\"#i-gantz2016\" data-ref=\"gantz2016\">גנץ 2016<\/a>, ולשאול בתחילת כל טיפול מיהו הלקוח, ובשירות של מי נקבעים המטרות, מידת האקטיביות ומשך הטיפול.<\/li>\n<li>להכין פתיחה קבועה לפגישת היכרות לפי <a class=\"ref\" href=\"#i-miller\" data-ref=\"miller\">הפגישה הראשונה (Miller)<\/a>: מי אני, כמה זמן יש לנו, מה מטרת הפגישה, ובסוף סיכום והצעת כיוון.<\/li>\n<li>בטיפול בילד צעיר, לעבור עם ההורים על <a class=\"ref\" href=\"#i-playbook\" data-ref=\"playbook\">הספר הראשון על טיפול במשחק<\/a>, ולהסביר להם ולילד מה נשמר בסוד ומתי המבוגרים מדברים ביניהם.<\/li>\n<\/ul>","system":"<p>העבודה המערכתית היא תחום עשיר במיוחד. המקורות מתארים אותה קודם כול כצורת חשיבה. כוכבי כותבת שכל שיחה עם מנהל על מהות עבודתו היא עבודה מערכתית <a class=\"ref\" href=\"#i-kochavi2018\" data-ref=\"kochavi2018\">כוכבי 2018<\/a>. רוב המקורות רואים במנהל את השותף המרכזי <a class=\"ref\" href=\"#i-englert\" data-ref=\"englert\">אנגלרט<\/a>, <a class=\"ref\" href=\"#i-italy2019\" data-ref=\"italy2019\">איטלי 2019<\/a>, <a class=\"ref\" href=\"#i-outline_elem\" data-ref=\"outline_elem\">ליבת העבודה ביסודי<\/a>. רוב הטקסטים נשענים על הגישה הפסיכואנליטית-מערכתית: לבית הספר יש חרדות והגנות, והפסיכולוג עוזר להנהלה להכיל אותן <a class=\"ref\" href=\"#i-turi_unconscious\" data-ref=\"turi_unconscious\">תורי-מגדסי, הלא מודע<\/a>, <a class=\"ref\" href=\"#i-nutkevitch2003\" data-ref=\"nutkevitch2003\">נוטקביץ&#x27; 2003<\/a>. לצדה מופיעים כלים למיפוי בית הספר <a class=\"ref\" href=\"#i-fuchs\" data-ref=\"fuchs\">המפה של פוקס<\/a> והשפה הניהולית של משרד החינוך <a class=\"ref\" href=\"#i-mop2020\" data-ref=\"mop2020\">בית ספר כארגון מורכב מסתגל<\/a>. בסוף ההתמחות מצופה מהמתמחה להציג מקרה שבו מושא האבחון וההתערבות הוא המערכת, והילדים הם הלקוחות המרכזיים <a class=\"ref\" href=\"#i-rubric\" data-ref=\"rubric\">המחוון המערכתי<\/a>.<\/p>\n<h4>מה הקריאה בונה לאורך השנים<\/h4>\n<p><strong>שנה א'.<\/strong> הקריאה מתמקדת בכניסה לבית הספר ובקשר עם המנהל. איטלי מקבילה את הכניסה לבית ספר חדש לפגישה האנליטית הראשונה, וקובעת שעל עצם הפגישה הראשונה עם המנהל אין גמישות <a class=\"ref\" href=\"#i-italy2019\" data-ref=\"italy2019\">איטלי 2019<\/a>. אנגלרט מציעה לאבחן ולהתערב \"תוך כדי תנועה\", ונותנת כלים: המפה המערכתית של פוקס, שלוש רמות מידע ו\"שאלות ממקום אחר\" לשיחה עם המנהל <a class=\"ref\" href=\"#i-englert\" data-ref=\"englert\">אנגלרט<\/a>. פרק של דור-חיים עוסק בהיוועצות אישית עם מנהל בית הספר. הוא לקוח מהספר \"סוגיות בפסיכולוגיה חינוכית: מהלכה למעשה\", שגם הפרק של אנגלרט נמצא בו <a class=\"ref\" href=\"#i-dorhaim2018\" data-ref=\"dorhaim2018\">דור-חיים 2018<\/a>.<\/p>\n<p><strong>שנים ב'-ג'.<\/strong> כאן נמצא עיקר התחום. תורי-מגדסי נותנת כלי לבניית חוזה עם המנהל סביב \"המשימה המרכזית\" <a class=\"ref\" href=\"#i-turi_contract\" data-ref=\"turi_contract\">תורי-מגדסי, חוזה עם המנהל<\/a>, ומאמר מבוא לגישה הפסיכואנליטית-מערכתית <a class=\"ref\" href=\"#i-turi_unconscious\" data-ref=\"turi_unconscious\">תורי-מגדסי, הלא מודע<\/a>. נוטקביץ' מחבר את מושג המיכל לתיאוריית המערכות הפתוחות <a class=\"ref\" href=\"#i-nutkevitch2003\" data-ref=\"nutkevitch2003\">נוטקביץ&#x27; 2003<\/a>. העלון של שפ\"ח ירושלים מציע את מודל \"האישיות הבית ספרית\" ותיאורי מקרים <a class=\"ref\" href=\"#i-forest2014\" data-ref=\"forest2014\">לראות את היער 2014<\/a>. לוריא ועמיתיו מתארים הדרכה של מנהלים חדשים <a class=\"ref\" href=\"#i-luria2011\" data-ref=\"luria2011\">לוריא ועמיתיו 2011<\/a>. מסמך משרד החינוך מתאר את בית הספר כארגון מורכב מסתגל <a class=\"ref\" href=\"#i-mop2020\" data-ref=\"mop2020\">בית ספר כארגון מורכב מסתגל<\/a>. לצדם עומדים המאמר של גרינולד <a class=\"ref\" href=\"#i-greenwald2012\" data-ref=\"greenwald2012\">גרינולד 2012<\/a> ומסמך רפלקציה על הכלה ועל רפורמת ההכלה <a class=\"ref\" href=\"#i-reflection\" data-ref=\"reflection\">מסמך הרפלקציה על הכלה<\/a>. ארבעה פריטים נוספים: בית הספר כמערכת מורכבת <a class=\"ref\" href=\"#i-dorhaim2013\" data-ref=\"dorhaim2013\">דור-חיים 2013<\/a>, מודל מח\"ר <a class=\"ref\" href=\"#i-gaon2021\" data-ref=\"gaon2021\">גאון-הרשקו 2021<\/a>, התסריטים הנרקיסיסטיים של המורות <a class=\"ref\" href=\"#i-yablon2017\" data-ref=\"yablon2017\">יבלון 2017<\/a>, ואמפתיה לתלמיד שנחווית ככשל אמפתי כלפי המורה <a class=\"ref\" href=\"#i-sharel2014\" data-ref=\"sharel2014\">שראל 2014<\/a>.<\/p>\n<p><strong>שנה ד'.<\/strong> הקריאה מעמיקה בתיאוריה ומכינה לבחינה. מנזיס-לית' מתארת מערכת הגנה מובנית חברתית בשירות סיעוד <a class=\"ref\" href=\"#i-menzies\" data-ref=\"menzies\">Menzies Lyth 1960<\/a>. מפת המושגים מסדרת את אוצר המילים של הגישה הפסיכואנליטית-מערכתית <a class=\"ref\" href=\"#i-psa_map\" data-ref=\"psa_map\">מפת המושגים הפסיכואנליטית-מערכתית<\/a>. המצגת מציגה את המפה של פוקס, ולצדה חלק של מריה טרנטייב עם שבעה ממדים לאבחון מערכת <a class=\"ref\" href=\"#i-fuchs\" data-ref=\"fuchs\">המפה של פוקס<\/a>. המחוון מגדיר מה מצופה במקרה מערכתי בבחינה <a class=\"ref\" href=\"#i-rubric\" data-ref=\"rubric\">המחוון המערכתי<\/a>. שלושה פריטים נוספים: פרק עדכני של נוטקביץ' על אתגר ההכלה <a class=\"ref\" href=\"#i-nutkevitch2025\" data-ref=\"nutkevitch2025\">Nutkevitch 2025<\/a>, \"הארגון בראש\" של ארמסטרונג <a class=\"ref\" href=\"#i-armstrong\" data-ref=\"armstrong\">Armstrong<\/a>, ופרק של מור על הרחבת המרחב החינוכי של המורה והצוות <a class=\"ref\" href=\"#i-mor2006\" data-ref=\"mor2006\">מור 2006<\/a>.<\/p>\n<h4>רעיונות שחוזרים במקורות<\/h4>\n<ul>\n<li><strong>פגישה קבועה עם המנהל.<\/strong> איטלי ממליצה על פגישה שבועית, ולכל הפחות שלוש פגישות בשנה <a class=\"ref\" href=\"#i-italy2019\" data-ref=\"italy2019\">איטלי 2019<\/a>. אנגלרט ממליצה על מפגשים קבועים עם המנהל בלי שותפים נוספים <a class=\"ref\" href=\"#i-englert\" data-ref=\"englert\">אנגלרט<\/a>. תורי-מגדסי מכניסה לחוזה קשר סדיר ופגישות מעקב לפחות פעמיים בשנה <a class=\"ref\" href=\"#i-turi_contract\" data-ref=\"turi_contract\">תורי-מגדסי, חוזה עם המנהל<\/a>. מתווה היסודי רואה בעבודה הרציפה עם המנהל את אחד התנאים החשובים להצלחה <a class=\"ref\" href=\"#i-outline_elem\" data-ref=\"outline_elem\">ליבת העבודה ביסודי<\/a>. פראוי מזכיר שבניית אמון עם מנהל לוקחת זמן <a class=\"ref\" href=\"#i-peraui2013\" data-ref=\"peraui2013\">פראוי 2013<\/a>.<\/li>\n<li><strong>פער בין המוצהר למה שקורה.<\/strong> אנגלרט מבחינה בין הצהרות, התרחשויות ופירושים <a class=\"ref\" href=\"#i-englert\" data-ref=\"englert\">אנגלרט<\/a>. תורי-מגדסי מבחינה בין משימה מרכזית נורמטיבית, אקזיסטנציאלית ופנומנלית <a class=\"ref\" href=\"#i-turi_contract\" data-ref=\"turi_contract\">תורי-מגדסי, חוזה עם המנהל<\/a>, ורואה בפער בין המשימה הרשמית למשימה בפועל סימן לתהליכים לא מודעים <a class=\"ref\" href=\"#i-turi_unconscious\" data-ref=\"turi_unconscious\">תורי-מגדסי, הלא מודע<\/a>. בעלון של שפ\"ח ירושלים מתואר חזון ש\"תלוי על הקיר בחדר המנהל אך נעדר במסדרונות\" <a class=\"ref\" href=\"#i-forest2014\" data-ref=\"forest2014\">לראות את היער 2014<\/a>.<\/li>\n<li><strong>הרגשות של הפסיכולוג כמידע על המערכת.<\/strong> איטלי רואה במתח של הכניסה מקור מידע על בית הספר <a class=\"ref\" href=\"#i-italy2019\" data-ref=\"italy2019\">איטלי 2019<\/a>. תורי-מגדסי משתמשת בהעברה הנגדית ובהתנגדות של המערכת כמידע, ומזהירה מ\"מלכודת דבש\" <a class=\"ref\" href=\"#i-turi_unconscious\" data-ref=\"turi_unconscious\">תורי-מגדסי, הלא מודע<\/a>. גרינולד-קשאני ומטיחס מתארות פסיכולוג שהגיב בתקיפות לא אופיינית לו, ומפרשות זאת כתהליך מקביל <a class=\"ref\" href=\"#i-greenwald2009\" data-ref=\"greenwald2009\">גרינולד ומטיחס 2009<\/a>. בעלון של ירושלים מתוארות פסיכולוגיות שנשאבו לקואליציה רגשית עם הצוות נגד המנהל, והתייעצות מערכתית החזירה להן את האמפתיה כלפיו <a class=\"ref\" href=\"#i-forest2014\" data-ref=\"forest2014\">לראות את היער 2014<\/a>.<\/li>\n<li><strong>מבנים, גבולות וחרדה.<\/strong> נוטקביץ' טוען שעבודה עם הנהלה על סדר יום, תפקידים וזמני ישיבות מונחית מהבנה פסיכואנליטית, ושהגבולות הם \"רשת ביטחון\" <a class=\"ref\" href=\"#i-nutkevitch2003\" data-ref=\"nutkevitch2003\">נוטקביץ&#x27; 2003<\/a>. מנזיס-לית' מראה שמבנים ונהלים יכולים לשמש הגנה מפני חרדה ולפגוע בעבודה <a class=\"ref\" href=\"#i-menzies\" data-ref=\"menzies\">Menzies Lyth 1960<\/a>. תורי-מגדסי מביאה את חמשת התנאים של אובהולצר לפונקציה מכילה בארגון <a class=\"ref\" href=\"#i-turi_unconscious\" data-ref=\"turi_unconscious\">תורי-מגדסי, הלא מודע<\/a>. גרינולד-קשאני ומטיחס מציעות לשלב עדשה אסטרטגית-פונקציונלית עם עדשה פסיכואנליטית <a class=\"ref\" href=\"#i-greenwald2009\" data-ref=\"greenwald2009\">גרינולד ומטיחס 2009<\/a>.<\/li>\n<li><strong>הבעיה המוצגת כסימפטום.<\/strong> שטיינברג, בעלון של ירושלים, מציעה לקרוא את \"התלמיד הבעייתי\" או את \"ההורה הנוקשה\" כסימפטום של המערכת <a class=\"ref\" href=\"#i-forest2014\" data-ref=\"forest2014\">לראות את היער 2014<\/a>. רודד ועמיתיו מתארים מקרים פרטניים שמצטברים לדפוס מערכתי <a class=\"ref\" href=\"#i-rodded2017\" data-ref=\"rodded2017\">רודד ועמיתיו 2017<\/a>. כוכבי מתארת מנהלת שהשקיעה בקשר עם כל תלמיד, ובינתיים חדר המורים התרוקן <a class=\"ref\" href=\"#i-kochavi2018\" data-ref=\"kochavi2018\">כוכבי 2018<\/a>.<\/li>\n<li><strong>הכניסה מעוררת התנגדות.<\/strong> איטלי מזכירה שבניגוד למטופל, המנהל לא בהכרח רואה בפסיכולוג מוביל שינוי, ולכן הפגישה הראשונה היא קרקע להתנגדות ולאנאקטמנט <a class=\"ref\" href=\"#i-italy2019\" data-ref=\"italy2019\">איטלי 2019<\/a>. תורי-מגדסי כותבת ש\"כניסה של פסיכולוג לארגון היא אקט חודרני\" <a class=\"ref\" href=\"#i-turi_unconscious\" data-ref=\"turi_unconscious\">תורי-מגדסי, הלא מודע<\/a>. מנזיס-לית' מסבירה את ההתנגדות לשינוי כהיאחזות בהגנות קיימות <a class=\"ref\" href=\"#i-menzies\" data-ref=\"menzies\">Menzies Lyth 1960<\/a>. במקרה של רודד ועמיתיו, הפסיכולוג נתן לתהליך זמן להבשיל אחרי שהמנהלת דחתה את היוזמה <a class=\"ref\" href=\"#i-rodded2017\" data-ref=\"rodded2017\">רודד ועמיתיו 2017<\/a>.<\/li>\n<\/ul>\n<h4>מתחים ושאלות פתוחות<\/h4>\n<ul>\n<li><strong>בהירות ועמימות.<\/strong> נוטקביץ' ותורי-מגדסי מדגישים משימה ברורה וגבולות מוגדרים כתנאי להכלה <a class=\"ref\" href=\"#i-nutkevitch2003\" data-ref=\"nutkevitch2003\">נוטקביץ&#x27; 2003<\/a>, <a class=\"ref\" href=\"#i-turi_unconscious\" data-ref=\"turi_unconscious\">תורי-מגדסי, הלא מודע<\/a>. מסמך משרד החינוך ממליץ לנהל את בית הספר \"על סף הכאוס\", ולפעמים להכניס אי-סדר מבוקר ולהדגיש חילוקי דעות <a class=\"ref\" href=\"#i-mop2020\" data-ref=\"mop2020\">בית ספר כארגון מורכב מסתגל<\/a>.<\/li>\n<li><strong>כמה רחוק ללכת עם ההקבלה לנפש.<\/strong> העלון של ירושלים מתאר \"אישיות בית ספרית\" לפי המודל הסטרוקטורלי של פרויד, ומציע להתערב בבית הספר בדומה לפרט <a class=\"ref\" href=\"#i-forest2014\" data-ref=\"forest2014\">לראות את היער 2014<\/a>. איטלי, בעקבות יבלון, כותבת שאי אפשר ולא רצוי \"להשכיב את הארגון על הספה\", ומזהירה מאבחון של אנשי חינוך כפרסונות <a class=\"ref\" href=\"#i-italy2019\" data-ref=\"italy2019\">איטלי 2019<\/a>.<\/li>\n<li><strong>תרגום מארגונים אחרים.<\/strong> המאמר של מנזיס-לית' עוסק בבית חולים, והדוגמאות של נוטקביץ' לקוחות מייעוץ ארגוני כללי <a class=\"ref\" href=\"#i-menzies\" data-ref=\"menzies\">Menzies Lyth 1960<\/a>, <a class=\"ref\" href=\"#i-nutkevitch2003\" data-ref=\"nutkevitch2003\">נוטקביץ&#x27; 2003<\/a>. מסמך משרד החינוך אינו מזכיר כלל פסיכולוגים או שפ\"ח <a class=\"ref\" href=\"#i-mop2020\" data-ref=\"mop2020\">בית ספר כארגון מורכב מסתגל<\/a>. את התרגום לבית הספר הקורא צריך לעשות בעצמו.<\/li>\n<\/ul>\n<h4>איפה להתחיל<\/h4>\n<ul>\n<li>לפני פתיחת השנה, לקרוא את <a class=\"ref\" href=\"#i-italy2019\" data-ref=\"italy2019\">איטלי 2019<\/a>, לקבוע פגישה אישית ראשונה עם המנהל, ולרשום את כל מה שקורה סביב קביעתה: המתנה, דחייה, מי התקשר ומי הצטרף.<\/li>\n<li>לבנות מפה מצטברת של בית הספר לפי ששת הרכיבים של פוקס ולסכם אותה בטבלת SWOT, כפי שמציעה <a class=\"ref\" href=\"#i-englert\" data-ref=\"englert\">אנגלרט<\/a>. כדאי לקרוא גם את \"הניירת\" של בית הספר ולחפש פערים בין המוצהר למה שקורה.<\/li>\n<li>לשיחת החוזה עם המנהל, להשתמש במבנה של <a class=\"ref\" href=\"#i-turi_contract\" data-ref=\"turi_contract\">תורי-מגדסי, חוזה עם המנהל<\/a> כרשימת בדיקה: נתוני רקע, המשימה המרכזית, ציפיות, חלוקת שעות ומועדי מעקב.<\/li>\n<\/ul>","emerg":"<p>ההתערבות בחירום היא חלק מהגדרת התפקיד ומהזהות של הפסיכולוג החינוכי. אלון, גרוס וקונפינו מציגים מודל שפועל בשלוש רמות: חשיבה, רגש ומעשה <a class=\"ref\" href=\"#i-alon2023\" data-ref=\"alon2023\">אלון ועמיתיו 2023<\/a>. בהתערבות המיידית הקו המנחה הוא עשייה. המנהל מוביל, והפסיכולוג תומך בצוות ובמעגלים הטבעיים של הילדים. רודד ועמיתיו מסבירים למה הפסיכולוג החינוכי מתאים לתפקיד: הוא דמות מוכרת, הוא מכיר את האנשים מראש, והוא ממשיך ללוות אחרי המשבר <a class=\"ref\" href=\"#i-rodded2017\" data-ref=\"rodded2017\">רודד ועמיתיו 2017<\/a>. מתווי העבודה מגדירים התערבות בחירום כתחום ליבה, מאירוע אצל תלמיד אחד ועד אירוע לאומי <a class=\"ref\" href=\"#i-outline_sec\" data-ref=\"outline_sec\">ליבת העבודה בעל-יסודי<\/a>, <a class=\"ref\" href=\"#i-outline_elem\" data-ref=\"outline_elem\">ליבת העבודה ביסודי<\/a>.<\/p>\n<h4>מה הקריאה בונה לאורך השנים<\/h4>\n<p><strong>שנה א'.<\/strong> \"רציפות בחרו\"ם\" הוא הטקסט המרכזי בתחום <a class=\"ref\" href=\"#i-alon2023\" data-ref=\"alon2023\">אלון ועמיתיו 2023<\/a>. הוא מבוסס על גישת הרצפים ועל עקרונות הקמ\"צ: קרבה, מיידיות וציפייה. הוא כולל פרוטוקול עם ציר זמן: היערכות מקדימה, כינוס צוות לשעת חירום (צל\"ח) בראשות המנהל, תדריך לחדר המורים, כניסת המורים לכיתות, מכתב להורים, דיבוב לחדר המורים כשבוע אחרי האירוע והפקת לקחים. יש בו פרק על התאמות לגנים, ובפרק על ההכשרה גם עקרונות לשמירה על המתערבים. המחברים כותבים שהמודל מיועד גם להכשרת מתמחים, כי התחום אינו נלמד בתואר השני. בשנה א' יש גם תיאור של שפ\"ח שדרות בזמן הסלמה ביטחונית ב-2008, בתוך מאמר מהתחום הכללי <a class=\"ref\" href=\"#i-greenwald2009\" data-ref=\"greenwald2009\">גרינולד ומטיחס 2009<\/a>.<\/p>\n<p><strong>שנים ב'-ג'.<\/strong> חומר על חירום מופיע באותו שלב בתוך טקסטים מתחומים אחרים. מסמך משרד החינוך משתמש במשבר הקורונה כדוגמה למציאות תנודתית ולא ודאית <a class=\"ref\" href=\"#i-mop2020\" data-ref=\"mop2020\">בית ספר כארגון מורכב מסתגל<\/a>. בעלון של שפ\"ח ירושלים יש רק אזכור קצר של עקרונות העבודה בחירום, בלי פירוט <a class=\"ref\" href=\"#i-forest2014\" data-ref=\"forest2014\">לראות את היער 2014<\/a>.<\/p>\n<p><strong>שנה ד'.<\/strong> הפריט לשנה זו הוא מסמך עקרונות של החטיבה החינוכית בהסתדרות הפסיכולוגים לעבודה מערכתית בזמן הקורונה. הוא עשוי להיות רלוונטי לחשיבה על משברים מתמשכים <a class=\"ref\" href=\"#i-corona2020\" data-ref=\"corona2020\">מצפן הקורונה 2020<\/a>.<\/p>\n<h4>רעיונות שחוזרים במקורות<\/h4>\n<ul>\n<li><strong>המנהל מוביל, הפסיכולוג תומך.<\/strong> אלון ועמיתיו כותבים ש\"המנהל מחזיק את השלם הבית ספרי\", והפסיכולוג נכנס לכיתה רק במצב אקוטי מאוד <a class=\"ref\" href=\"#i-alon2023\" data-ref=\"alon2023\">אלון ועמיתיו 2023<\/a>. במתווה הגנים הפסיכולוג נותן מענה מערכתי ומשמש כתובת לגננת <a class=\"ref\" href=\"#i-outline_gan\" data-ref=\"outline_gan\">מודל העבודה בגנים<\/a>. ברמה העירונית, שפ\"ח שדרות הגדיר את עצמו \"שער כניסה\" לשירותים הטיפוליים ו\"חדר מצב\" בזמן הסלמה <a class=\"ref\" href=\"#i-greenwald2009\" data-ref=\"greenwald2009\">גרינולד ומטיחס 2009<\/a>.<\/li>\n<li><strong>ילדים צעירים חווים לחץ דרך המבוגרים.<\/strong> מתווה הגנים מסביר שילדים צעירים חווים את הלחץ דרך המבוגר ומשלימים פערי מידע בדמיון <a class=\"ref\" href=\"#i-outline_gan\" data-ref=\"outline_gan\">מודל העבודה בגנים<\/a>. אלון ועמיתיו מוסיפים ששיח קצר ומותאם גיל הוא הכרחי, ושבגן שיקום המוגנות חשוב יותר מהעובדות המלאות <a class=\"ref\" href=\"#i-alon2023\" data-ref=\"alon2023\">אלון ועמיתיו 2023<\/a>.<\/li>\n<li><strong>היערכות לפני האירוע.<\/strong> אלון ועמיתיו ממליצים על צל\"ח מוגדר, ערכת חירום ומכתב גנרי להורים שמוכן מראש <a class=\"ref\" href=\"#i-alon2023\" data-ref=\"alon2023\">אלון ועמיתיו 2023<\/a>. מתווה הגנים ממליץ לדבר עם הגננת על נהלים בתחילת השנה, כחלק ממניעה ראשונית <a class=\"ref\" href=\"#i-outline_gan\" data-ref=\"outline_gan\">מודל העבודה בגנים<\/a>. במסמך המפה המערכתית יש גם חלק של אבחון מערכת, ובו ממד \"תחושת מוגנות\" ששואל למי פונים, איך זורם המידע ומי לוקח אחריות במשבר <a class=\"ref\" href=\"#i-fuchs\" data-ref=\"fuchs\">המפה של פוקס<\/a>.<\/li>\n<li><strong>המשבר מלמד על בית הספר.<\/strong> אלון ועמיתיו כותבים שהאירוע \"מצלם\" את מצב בית הספר ואת היחסים בו, ומציעים לבחור אחריו תחום לחיזוק <a class=\"ref\" href=\"#i-alon2023\" data-ref=\"alon2023\">אלון ועמיתיו 2023<\/a>. חלק אבחון המערכת רואה במצבי משבר בדיקה של תפקוד בעלי התפקידים <a class=\"ref\" href=\"#i-fuchs\" data-ref=\"fuchs\">המפה של פוקס<\/a>. בעלון של ירושלים, בהקשר של משברים מערכתיים (חילופי מנהלים, שינויים בסביבה), מתוארת פגיעה ביחסים כמקור לפגיעה במשימה המרכזית <a class=\"ref\" href=\"#i-forest2014\" data-ref=\"forest2014\">לראות את היער 2014<\/a>.<\/li>\n<li><strong>שמירה על המתערבים.<\/strong> אלון ועמיתיו ממליצים להתערב בשניים, לתת למתמחה גיבוי של מדריך או מנהל, ולקיים דיבוב גם למתערבים <a class=\"ref\" href=\"#i-alon2023\" data-ref=\"alon2023\">אלון ועמיתיו 2023<\/a>. טאובר ממליצה שהתחנה תאפשר למתחילים התייעצות רחבה, עד מעורבות ישירה של פסיכולוג נוסף באירוע <a class=\"ref\" href=\"#i-tauber\" data-ref=\"tauber\">טאובר<\/a>.<\/li>\n<li><strong>חירום ושגרה.<\/strong> לפי אלון ועמיתיו, מעורבות בחירום מחזקת את אמון הצוות בפסיכולוג גם בשגרה <a class=\"ref\" href=\"#i-alon2023\" data-ref=\"alon2023\">אלון ועמיתיו 2023<\/a>. רודד ועמיתיו מסבירים שההיכרות המוקדמת עם האנשים מאפשרת התערבות מדויקת יותר מזו של גורם חיצוני <a class=\"ref\" href=\"#i-rodded2017\" data-ref=\"rodded2017\">רודד ועמיתיו 2017<\/a>.<\/li>\n<\/ul>\n<h4>מתחים ושאלות פתוחות<\/h4>\n<ul>\n<li><strong>חירום מתמשך.<\/strong> הפרוטוקול של אלון ועמיתיו בנוי סביב אירוע חד, וציר הזמן שלו מגיע לשבועיים אחרי האירוע <a class=\"ref\" href=\"#i-alon2023\" data-ref=\"alon2023\">אלון ועמיתיו 2023<\/a>. חירום מתמשך מתואר רק בסיפור של שפ\"ח שדרות <a class=\"ref\" href=\"#i-greenwald2009\" data-ref=\"greenwald2009\">גרינולד ומטיחס 2009<\/a> ובפריט על הקורונה <a class=\"ref\" href=\"#i-corona2020\" data-ref=\"corona2020\">מצפן הקורונה 2020<\/a>.<\/li>\n<li><strong>עשייה לפני רגש.<\/strong> אלון ועמיתיו ממליצים לא לקחת אנמנזה ולדחות את העיסוק ברגש עד אחרי ההתערבות הראשונה <a class=\"ref\" href=\"#i-alon2023\" data-ref=\"alon2023\">אלון ועמיתיו 2023<\/a>. טקסטים אחרים בנויים על השהיה ועל היסטוריה, למשל משולש ההמשגה של בהט, שאחד מקדקודיו הוא האנמנזה <a class=\"ref\" href=\"#i-bahat\" data-ref=\"bahat\">בהט<\/a>. אלון ועמיתיו מציעים לתת בהכשרה מקום לדיון, לוויכוח ולאי-הסכמה על העולם הרגשי של המתערבים.<\/li>\n<\/ul>\n<h4>איפה להתחיל<\/h4>\n<ul>\n<li>להכין ערכת חירום אישית, ולוודא שבכל בית ספר או גן שלך יש צל\"ח מוגדר, ערכת חירום ומכתב גנרי להורים <a class=\"ref\" href=\"#i-alon2023\" data-ref=\"alon2023\">אלון ועמיתיו 2023<\/a>.<\/li>\n<li>לסכם מראש עם המדריך מה עושים בשעה הראשונה של אירוע. לפי <a class=\"ref\" href=\"#i-alon2023\" data-ref=\"alon2023\">אלון ועמיתיו 2023<\/a>, כבר בשלב הראשון של האירוע, לצד הקשר עם המנהל, מתמחה יוצר קשר עם המדריך האישי ואולי גם עם מנהל השפ\"ח.<\/li>\n<li>מי שעובד בגנים, לשוחח עם הגננת בתחילת השנה על נהלים ומשאבים, ולקרוא את פרק החירום במתווה הגנים <a class=\"ref\" href=\"#i-outline_gan\" data-ref=\"outline_gan\">מודל העבודה בגנים<\/a>.<\/li>\n<\/ul>","sped":"<p>בשפ\"ח החינוך המיוחד הוא מחויבות מתוקף החוק <a class=\"ref\" href=\"#i-outline_elem\" data-ref=\"outline_elem\">ליבת העבודה ביסודי<\/a>. הקריאה בתחום מתמקדת בעיקר בכיתות לחינוך מיוחד שפועלות בתוך בית ספר רגיל. מסמך של פורום החנ\"מ בשירות מבקש לפחות שעה שבועית קבועה בכיתה כזו, כחלק מהחוזה עם המנהל <a class=\"ref\" href=\"#i-tlv_smallclasses\" data-ref=\"tlv_smallclasses\">הכיתות הקטנות 2010<\/a>. שני מקורות נוספים עוסקים בעבודה בצוות רב-מקצועי ובשותפות עם ההורים <a class=\"ref\" href=\"#i-sped_multi\" data-ref=\"sped_multi\">עבודה רב-מקצועית בחנ&quot;מ<\/a>, <a class=\"ref\" href=\"#i-manor2004\" data-ref=\"manor2004\">מנור-בנימיני 2004<\/a>. כמה מקורות מציעים לקרוא את היחס של בית הספר לכיתה המיוחדת כמידע על בית הספר כולו: היכן היא ממוקמת, ומה מקומה של המחנכת בחדר המורים <a class=\"ref\" href=\"#i-forest2014\" data-ref=\"forest2014\">לראות את היער 2014<\/a>, <a class=\"ref\" href=\"#i-turi_unconscious\" data-ref=\"turi_unconscious\">תורי-מגדסי, הלא מודע<\/a>.<\/p>\n<h4>מה הקריאה בונה לאורך השנים<\/h4>\n<p><strong>שנה א'.<\/strong> הפריט לשנה זו הוא מאמר של צילה טנא על המעבר לחינוך המיוחד, והוא קריאת חובה <a class=\"ref\" href=\"#i-tene_sped\" data-ref=\"tene_sped\">טנא, מעבר לחנ&quot;מ<\/a>.<\/p>\n<p><strong>שנים ב'-ג'.<\/strong> שלושה טקסטים. מסמך פורום החנ\"מ של שפ\"ח תל אביב-יפו מתאר את התפיסה הערכית הרצויה בבית ספר שקולט כיתה קטנה, ואת עבודת הפסיכולוג בארבעה שלבים: לפני פתיחת הכיתה, בחודשים הראשונים, בהמשך השנה ובסופה <a class=\"ref\" href=\"#i-tlv_smallclasses\" data-ref=\"tlv_smallclasses\">הכיתות הקטנות 2010<\/a>. מסמך על עבודה רב-מקצועית בחנ\"מ מגדיר את תפקיד הפסיכולוג בצוות ומציע הערכה מבוססת צרכים <a class=\"ref\" href=\"#i-sped_multi\" data-ref=\"sped_multi\">עבודה רב-מקצועית בחנ&quot;מ<\/a>. מנור-בנימיני חקרה צוותים שהצליחו לשתף פעולה עם הורים בישיבות מעבר <a class=\"ref\" href=\"#i-manor2004\" data-ref=\"manor2004\">מנור-בנימיני 2004<\/a>. בתחום המערכת באותו שלב, העלון של ירושלים משתמש בכיתה המקדמת כ\"פריזמה\" לאבחון בית הספר <a class=\"ref\" href=\"#i-forest2014\" data-ref=\"forest2014\">לראות את היער 2014<\/a>, ומסמך הרפלקציה מבקר את רפורמת ההכלה <a class=\"ref\" href=\"#i-reflection\" data-ref=\"reflection\">מסמך הרפלקציה על הכלה<\/a>.<\/p>\n<p><strong>שנה ד'.<\/strong> הפריט לשנה זו הוא פרק מתוך \"טיפול בהורות\" של אסתר כהן, על עבודה אינטגרטיבית עם הורים לילדים עם צרכים מיוחדים <a class=\"ref\" href=\"#i-cohen_parenting\" data-ref=\"cohen_parenting\">כהן, טיפול בהורות<\/a>.<\/p>\n<h4>רעיונות שחוזרים במקורות<\/h4>\n<ul>\n<li><strong>מיקום הכיתה ומעמד המחנכת.<\/strong> מסמך פורום החנ\"מ מבקש לתת לכיתה מקום מרכזי ולשלב את צוותה בחדר המורים <a class=\"ref\" href=\"#i-tlv_smallclasses\" data-ref=\"tlv_smallclasses\">הכיתות הקטנות 2010<\/a>. גרין אפל, בעלון של ירושלים, בודקת היכן הכיתה המקדמת ממוקמת ומה מקומה של המחנכת, כמדד לבית הספר כולו <a class=\"ref\" href=\"#i-forest2014\" data-ref=\"forest2014\">לראות את היער 2014<\/a>. תורי-מגדסי מתארת בידול של כיתת החנ\"מ כהגנה של הצוות, שמייחס לה את החולשות שלו <a class=\"ref\" href=\"#i-turi_unconscious\" data-ref=\"turi_unconscious\">תורי-מגדסי, הלא מודע<\/a>.<\/li>\n<li><strong>צוות רב-מקצועי ושיתוף פעולה.<\/strong> מסמך העבודה הרב-מקצועית מביא את ממצאי מנור-בנימיני: נוכחות של אנשי מקצוע רבים אינה מבטיחה שיתוף פעולה יעיל <a class=\"ref\" href=\"#i-sped_multi\" data-ref=\"sped_multi\">עבודה רב-מקצועית בחנ&quot;מ<\/a>. גרינולד מבחינה בין צוות מולטי-, אינטר- וטרנס-דיסציפלינרי <a class=\"ref\" href=\"#i-greenwald2012\" data-ref=\"greenwald2012\">גרינולד 2012<\/a>. בעלון של ירושלים נשאלת השאלה \"מי האמא של הכיתה המקדמת?\", והפתרון המוצע הוא ישיבה רב-מקצועית עם הגדרת תפקידים <a class=\"ref\" href=\"#i-forest2014\" data-ref=\"forest2014\">לראות את היער 2014<\/a>.<\/li>\n<li><strong>ההורים כשותפים.<\/strong> מנור-בנימיני מצאה שישיבות מעבר טעונות מאוד להורים, ושמרחב לרגשות, כבוד ופתיחה בחוזקות מעלים את השתתפותם <a class=\"ref\" href=\"#i-manor2004\" data-ref=\"manor2004\">מנור-בנימיני 2004<\/a>. מסמך העבודה הרב-מקצועית מתאר את מעורבות ההורים בצוות כ\"כר רחב מאוד לסיכוי ולסיכון\" <a class=\"ref\" href=\"#i-sped_multi\" data-ref=\"sped_multi\">עבודה רב-מקצועית בחנ&quot;מ<\/a>. מסמך פורום החנ\"מ רואה בהורים שותפים מלאים, ומבקש מהפסיכולוג להשתתף במפגש הראשון עם הורי הכיתה <a class=\"ref\" href=\"#i-tlv_smallclasses\" data-ref=\"tlv_smallclasses\">הכיתות הקטנות 2010<\/a>. מתווה הגנים מבקש קשב לרגשות ההורים כשמתבררים צרכים מיוחדים <a class=\"ref\" href=\"#i-outline_gan\" data-ref=\"outline_gan\">מודל העבודה בגנים<\/a>.<\/li>\n<li><strong>הכחשה של מוגבלות.<\/strong> בעלון של ירושלים מתוארים בתי ספר לילדים עם נכויות קשות שעובדים בעומס שוחק כדי להימנע מהמפגש עם הכאב, באופן שמשקף הכחשה של ההורים <a class=\"ref\" href=\"#i-forest2014\" data-ref=\"forest2014\">לראות את היער 2014<\/a>. תורי-מגדסי מתארת בית ספר לחנ\"מ שבו לא הייתה לגיטימציה לחולשה, והמוגבלויות של התלמידים הוכחשו <a class=\"ref\" href=\"#i-turi_unconscious\" data-ref=\"turi_unconscious\">תורי-מגדסי, הלא מודע<\/a>.<\/li>\n<li><strong>חובות שבחוק.<\/strong> מתווה היסודי מגדיר עבודה עם כיתות החנ\"מ, עם זכאים בכיתות רגילות ועם ועדות כעבודה הנדרשת על פי חוק <a class=\"ref\" href=\"#i-outline_elem\" data-ref=\"outline_elem\">ליבת העבודה ביסודי<\/a>. המתווה העל-יסודי כולל ועדות אפיון וזכאות, ועדות שילוב וכיתות חנ\"מ <a class=\"ref\" href=\"#i-outline_sec\" data-ref=\"outline_sec\">ליבת העבודה בעל-יסודי<\/a>. מסמך פורום החנ\"מ מבקש מהפסיכולוג ללוות את בניית התל\"א, ומתאר עבודה משותפת עליה שלוש פעמים בשנה בשיתוף ההורים <a class=\"ref\" href=\"#i-tlv_smallclasses\" data-ref=\"tlv_smallclasses\">הכיתות הקטנות 2010<\/a>.<\/li>\n<\/ul>\n<h4>מתחים ושאלות פתוחות<\/h4>\n<ul>\n<li><strong>שילוב ושמירת סף.<\/strong> מסמך פורום החנ\"מ רואה בשילוב מטרה חינוכית ראשונה במעלה <a class=\"ref\" href=\"#i-tlv_smallclasses\" data-ref=\"tlv_smallclasses\">הכיתות הקטנות 2010<\/a>. טאובר מתארת את תפקיד \"שומר הסף\" שדבק במקצוע מראשיתו <a class=\"ref\" href=\"#i-tauber\" data-ref=\"tauber\">טאובר<\/a>. מסמך הרפלקציה, שמביע עמדה אישית, טוען שרפורמת ההכלה תיפול על צוותים שאינם מוכנים מספיק, ושהשפ\"חים משתפים פעולה בוועדות עם \"סתימת פיו\" של הצוות <a class=\"ref\" href=\"#i-reflection\" data-ref=\"reflection\">מסמך הרפלקציה על הכלה<\/a>. גרינולד-קשאני ומטיחס מתארות ועדות להוצאת ילדים שפסיכולוגים נותנים להן \"גושפנקא אתית\" <a class=\"ref\" href=\"#i-greenwald2009\" data-ref=\"greenwald2009\">גרינולד ומטיחס 2009<\/a>.<\/li>\n<li><strong>מה התרומה הייחודית.<\/strong> פראוי מתאר בחינוך המיוחד חוויה של \"בורג קטן\", כי הצוות הוא שמחזיק את הילד וקשה לבודד את תרומת הפסיכולוג <a class=\"ref\" href=\"#i-peraui2013\" data-ref=\"peraui2013\">פראוי 2013<\/a>. מסמך העבודה הרב-מקצועית ומסמך פורום החנ\"מ מגדירים לפסיכולוג תפקיד רחב, מטיפול פרטני ועד תרגום החריגויות לעבודת הצוות <a class=\"ref\" href=\"#i-sped_multi\" data-ref=\"sped_multi\">עבודה רב-מקצועית בחנ&quot;מ<\/a>, <a class=\"ref\" href=\"#i-tlv_smallclasses\" data-ref=\"tlv_smallclasses\">הכיתות הקטנות 2010<\/a>. לתפקיד הזה מוקצית במסמך הפורום שעה שבועית אחת לפחות.<\/li>\n<\/ul>\n<h4>איפה להתחיל<\/h4>\n<ul>\n<li>לקרוא את המאמר של טנא על המעבר לחינוך המיוחד, שהוא קריאת חובה לשנה א' <a class=\"ref\" href=\"#i-tene_sped\" data-ref=\"tene_sped\">טנא, מעבר לחנ&quot;מ<\/a>.<\/li>\n<li>אם יש בבית הספר שלך כיתה קטנה, לקרוא את <a class=\"ref\" href=\"#i-tlv_smallclasses\" data-ref=\"tlv_smallclasses\">הכיתות הקטנות 2010<\/a>, לבקש בחוזה שעה שבועית קבועה בכיתה, ולבנות לוח שנה לפי ארבעת השלבים במסמך.<\/li>\n<li>לפני ישיבה עם הורים, לעבור על המרכיבים שמנור-בנימיני מצאה: הסבר מונחים, דוגמאות קונקרטיות, בדיקת הבנה, פתיחה בחוזקות, מרחב לרגשות וסיכום החלטות <a class=\"ref\" href=\"#i-manor2004\" data-ref=\"manor2004\">מנור-בנימיני 2004<\/a>.<\/li>\n<\/ul>","community":"<p>לתחום הקהילה מוקדש פריט אחד <a class=\"ref\" href=\"#i-benrey2016\" data-ref=\"benrey2016\">בן ריי וכנפי בליי 2016<\/a>, ובכל זאת הקהילה מופיעה בטקסטים רבים. לפי מתווה השירות, הייעוד של השפ\"ח מתממש גם ברמת מערכת החינוך והקהילה <a class=\"ref\" href=\"#i-peraui2013\" data-ref=\"peraui2013\">פראוי 2013<\/a>, <a class=\"ref\" href=\"#i-outline_sec\" data-ref=\"outline_sec\">ליבת העבודה בעל-יסודי<\/a>. טאובר מציינת שבשפ\"ח תל אביב יש מרכז לעבודה קהילתית ומרכז לריכוז קהילת האתיופים <a class=\"ref\" href=\"#i-tauber\" data-ref=\"tauber\">טאובר<\/a>. בשפ\"ח ירושלים, תוכנית \"בית ספר בקהילה\" הרחיבה את תפקיד הפסיכולוג לעבודה עם הורים, מתנ\"סים ומינהלים קהילתיים <a class=\"ref\" href=\"#i-forest2014\" data-ref=\"forest2014\">לראות את היער 2014<\/a>. רודד ועמיתיו מציינים שהמרחב הזה עדיין אינו חלק משגרת רוב הפסיכולוגים, בעיקר בגלל מגבלת המשאבים <a class=\"ref\" href=\"#i-rodded2017\" data-ref=\"rodded2017\">רודד ועמיתיו 2017<\/a>.<\/p>\n<h4>מה הקריאה בונה לאורך השנים<\/h4>\n<p><strong>שנה א'.<\/strong> כמה טקסטים מהתחום הכללי מתארים עבודה מחוץ לבית הספר. כוכבי מתארת \"דלת פתוחה\" במתנ\"ס, כתובת לשבט צופים ואימהות על ספסל ליד טיפת חלב <a class=\"ref\" href=\"#i-kochavi2018\" data-ref=\"kochavi2018\">כוכבי 2018<\/a>. פראוי מתאר תנועה בין המשרד, בית הספר, הגן והקהילה, ועבודה עם צוותים בלתי פורמליים כמו תנועות נוער <a class=\"ref\" href=\"#i-peraui2013\" data-ref=\"peraui2013\">פראוי 2013<\/a>.<\/p>\n<p><strong>שנים ב'-ג'.<\/strong> הפריט לשלב זה הוא מאמר על עבודת הפסיכולוג החינוכי בעדשה קהילתית <a class=\"ref\" href=\"#i-benrey2016\" data-ref=\"benrey2016\">בן ריי וכנפי בליי 2016<\/a>. בעלון של שפ\"ח ירושלים מתוארת תוכנית \"בית ספר בקהילה\". כל פסיכולוג ליווה חמישה בתי ספר, והתפקיד התרחב לגבולות, לשותפויות ולחרדות הצוות משינוי <a class=\"ref\" href=\"#i-forest2014\" data-ref=\"forest2014\">לראות את היער 2014<\/a>.<\/p>\n<p><strong>שנה ד'.<\/strong> בתחום הכללי באותו שלב, במקרה שמתארים רודד ועמיתיו, השאלה \"מדוע דווקא הוא ועוד שניים מכיתתו?\" חשפה שלושה ילדים שהם דור ראשון בארץ, והובילה לכיוון של פעילות משותפת עם הקהילה. המחברים מפנים כאן למאמר של בן ריי וכנפי בליי <a class=\"ref\" href=\"#i-rodded2017\" data-ref=\"rodded2017\">רודד ועמיתיו 2017<\/a>, <a class=\"ref\" href=\"#i-benrey2016\" data-ref=\"benrey2016\">בן ריי וכנפי בליי 2016<\/a>.<\/p>\n<h4>רעיונות שחוזרים במקורות<\/h4>\n<ul>\n<li><strong>הקהילה כרמת ניתוח.<\/strong> רודד ועמיתיו מונים את הקהילה בין רמות הניתוח, לפי ברונפנברנר <a class=\"ref\" href=\"#i-rodded2017\" data-ref=\"rodded2017\">רודד ועמיתיו 2017<\/a>. מתווה הגנים בנוי על הגישה האקולוגית-מערכתית, ומפרט שותפי תפקיד ברשות, ברווחה ובבריאות <a class=\"ref\" href=\"#i-outline_gan\" data-ref=\"outline_gan\">מודל העבודה בגנים<\/a>. המחוון לתחום המערכתי מבקש התאמה מקומית ותרבותית לקהילות שמקבלות את השירות <a class=\"ref\" href=\"#i-rubric\" data-ref=\"rubric\">המחוון המערכתי<\/a>.<\/li>\n<li><strong>קהילות מסוימות משנות את העבודה.<\/strong> במתווה היסודי היקף השעות נקבע גם לפי קהילות ייחודיות, כמו ילדי הקהילה האתיופית, ילדי מהגרי עבודה ומבקשי מקלט, והרכב יהודי-ערבי <a class=\"ref\" href=\"#i-outline_elem\" data-ref=\"outline_elem\">ליבת העבודה ביסודי<\/a>. טאובר מונה בשפ\"ח תל אביב מרכז לריכוז קהילת האתיופים ומרכז לעבודה קהילתית <a class=\"ref\" href=\"#i-tauber\" data-ref=\"tauber\">טאובר<\/a>.<\/li>\n<li><strong>הגבול בין בית הספר להורים ולקהילה.<\/strong> תורי-מגדסי כותבת שהגבול בין בית הספר להורים עדין במיוחד, ושניהולו מחייב להבין את ההיסטוריה של הצד השני <a class=\"ref\" href=\"#i-turi_unconscious\" data-ref=\"turi_unconscious\">תורי-מגדסי, הלא מודע<\/a>. בעלון של ירושלים מוצע לעצב מחדש את הגבולות בין בית הספר להורים, ולנהל שיח פתוח על פערי ערכים <a class=\"ref\" href=\"#i-forest2014\" data-ref=\"forest2014\">לראות את היער 2014<\/a>. מסמך משרד החינוך רואה בהורים ובקהילה שותפים <a class=\"ref\" href=\"#i-mop2020\" data-ref=\"mop2020\">בית ספר כארגון מורכב מסתגל<\/a>.<\/li>\n<li><strong>השפ\"ח ברמה העירונית.<\/strong> בשדרות, השפ\"ח ארגן יום עיון לכל המטפלים בעיר והצטרף לצוות העירוני המוביל <a class=\"ref\" href=\"#i-greenwald2009\" data-ref=\"greenwald2009\">גרינולד ומטיחס 2009<\/a>. בירושלים, השפ\"ח ליווה תוכנית עירונית שהשתתפו בה 50 בתי ספר <a class=\"ref\" href=\"#i-forest2014\" data-ref=\"forest2014\">לראות את היער 2014<\/a>.<\/li>\n<li><strong>חירום וקהילה.<\/strong> אלון ועמיתיו ממפים מעגלי פגיעות שכוללים גם אחים, מסגרות קודמות ותנועת נוער <a class=\"ref\" href=\"#i-alon2023\" data-ref=\"alon2023\">אלון ועמיתיו 2023<\/a>. במתווה העל-יסודי, ההתערבות בחירום מגיעה עד אירועים קהילתיים ולאומיים <a class=\"ref\" href=\"#i-outline_sec\" data-ref=\"outline_sec\">ליבת העבודה בעל-יסודי<\/a>.<\/li>\n<\/ul>\n<h4>מתחים ושאלות פתוחות<\/h4>\n<ul>\n<li><strong>בין חזון למשאבים.<\/strong> כוכבי רואה בעבודה בקהילה חלק מרוחב המקצוע <a class=\"ref\" href=\"#i-kochavi2018\" data-ref=\"kochavi2018\">כוכבי 2018<\/a>. רודד ועמיתיו כותבים שהמרחב הזה עדיין אינו בשגרה של רוב הפסיכולוגים, בעיקר בגלל מגבלת המשאבים <a class=\"ref\" href=\"#i-rodded2017\" data-ref=\"rodded2017\">רודד ועמיתיו 2017<\/a>. בירושלים הפסיכולוגים למדו את התחום \"תוך כדי תנועה\" <a class=\"ref\" href=\"#i-forest2014\" data-ref=\"forest2014\">לראות את היער 2014<\/a>.<\/li>\n<li><strong>חיסיון והצורך לדעת.<\/strong> בתוכנית \"בית ספר בקהילה\" עלתה \"בחריפות גוברת\" הדילמה בין הצורך של המערכת העירונית לדעת מה קורה בבתי הספר לבין חובת החיסיון של הפסיכולוג <a class=\"ref\" href=\"#i-forest2014\" data-ref=\"forest2014\">לראות את היער 2014<\/a>. מתווה הגנים מתאר ריבוי נאמנויות: לילד, להורים, לגננת, למפקחת ולרשות <a class=\"ref\" href=\"#i-outline_gan\" data-ref=\"outline_gan\">מודל העבודה בגנים<\/a>.<\/li>\n<\/ul>\n<h4>איפה להתחיל<\/h4>\n<ul>\n<li>לקרוא את המקרה המורחב אצל <a class=\"ref\" href=\"#i-rodded2017\" data-ref=\"rodded2017\">רודד ועמיתיו 2017<\/a> עד שלב ההרחבה לקהילה, ולקרוא את <a class=\"ref\" href=\"#i-benrey2016\" data-ref=\"benrey2016\">בן ריי וכנפי בליי 2016<\/a>, שהמחברים מפנים אליו.<\/li>\n<li>למפות את הקהילות שבית הספר או הגן שלך משרת, ואת השותפים מחוץ לבית הספר: רווחה, מתנ\"ס, מינהל קהילתי ובריאות. אפשר להיעזר ברשימת שותפי התפקיד במתווה הגנים <a class=\"ref\" href=\"#i-outline_gan\" data-ref=\"outline_gan\">מודל העבודה בגנים<\/a>.<\/li>\n<li>לסכם מראש בהדרכה מה משתפים עם גורמים עירוניים וקהילתיים ומה נשאר חסוי, לאור הדילמה שמתוארת בעלון של ירושלים <a class=\"ref\" href=\"#i-forest2014\" data-ref=\"forest2014\">לראות את היער 2014<\/a>.<\/li>\n<\/ul>"},"resources":[{"stage":"s1","title":"המפה המערכתית של אינה פוקס","note":"כלי לאבחון מערכתי","item":"fuchs"},{"stage":"s1","title":"שאלון סגנון ניהול (אדיג'ס)","note":"כלי לאבחון מערכתי","item":null},{"stage":"s1","title":"הספר הראשון שלי על טיפול במשחק","note":"ספר ילדים","item":"playbook"},{"stage":"s2","title":"PDI למורה","note":"כלי לאבחון מערכתי","item":null},{"stage":"s3","title":"הערכה דינמית של ההתנהלות המערכתית של בית הספר בשירות הכלת הפרט (פלורה מור)","note":"כלי לאבחון מערכתי","item":null}],"openCells":[["s2","general"],["s2","emerg"]],"outlines":[{"id":"gan","label":"גיל רך","item":"outline_gan"},{"id":"elem","label":"יסודי","item":"outline_elem"},{"id":"sec","label":"על-יסודי","item":"outline_sec"},{"id":"sped","label":"חינוך מיוחד","item":"tlv_smallclasses","note":null}],"kitFile":{"orig":"קיט להתמחות שפח תל אביב יפו.pptx","ext":"pptx","pdf":"kit.pdf","pages":8,"bytes":153677}}</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('kit-data').textContent);
const IT = Object.fromEntries(D.items.map(i => [i.id, i]));
const ST = Object.fromEntries(D.stages.map(s => [s.id, s]));
const DM = Object.fromEntries(D.domains.map(d => [d.id, d]));
const TL = Object.fromEntries(D.tools.map(t => [t.id, t]));
const ALL_IDS = D.items.map(i => i.id);
const $main = document.getElementById('main');
document.documentElement.lang = 'he';

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dcol = d => `var(--d-${d})`;
const CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const norm = s => String(s || '').replace(/[֑-ׇ]/g, '').replace(/["'״׳`\-–־]/g, '').replace(/\s+/g, ' ').toLowerCase().trim();
const stageOf = it => it.placements.length ? it.placements[0][0] : null;
const domainsOf = it => [...new Set(it.placements.map(p => p[1]))];
const itemsIn = (stage, domain) => D.items.filter(i => i.placements.some(p => (!stage || p[0] === stage) && (!domain || p[1] === domain)));
const ORDER = D.items.filter(i => i.placements.length).map(i => i.id);

/* ================= progress store ================= */
const Store = {
  KEY: 'kit-progress-v1', rec: {}, mode: 'local', ref: null, timer: null, inflight: false, again: false, subs: [],
  isRead(id){ return !!(this.rec[id] && this.rec[id].v); },
  count(ids){ return ids.filter(id => this.isRead(id)).length; },
  on(fn){ this.subs.push(fn); },
  emit(){ this.subs.forEach(fn => { try { fn(); } catch(e){} }); },
  load(){ try { const raw = localStorage.getItem(this.KEY); if (raw){ const o = JSON.parse(raw); if (o && o.rec && typeof o.rec === 'object') this.rec = o.rec; } } catch(e){} },
  saveLocal(){ try { localStorage.setItem(this.KEY, JSON.stringify({ rec: this.rec })); } catch(e){} },
  toggle(id){ const v = !this.isRead(id); this.rec[id] = { v, t: Date.now() }; this.saveLocal(); this.schedule(); this.emit(); },
  merge(other){
    let changed = false;
    for (const [id, r] of Object.entries(other || {})){
      if (!r || typeof r.t !== 'number' || !IT[id]) continue;
      const mine = this.rec[id];
      if (!mine || r.t > mine.t){ this.rec[id] = { v: !!r.v, t: r.t }; changed = true; }
    }
    return changed;
  },
  async connect(){
    const c = window.claude;
    if (!c || typeof c.use !== 'function') return;
    try {
      const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const ref = db.doc('data/users/' + uid + '/progress');
      const snap = await ref.get();
      const remote = snap.exists ? ((snap.data() || {}).rec || {}) : {};
      if (this.merge(remote)) this.saveLocal();
      const localNewer = Object.entries(this.rec).some(([id, r]) => !remote[id] || remote[id].t < r.t);
      this.ref = ref; this.mode = 'db'; this.emit();
      if (localNewer) this.schedule(0);
    } catch(e){ this.ref = null; this.mode = 'local'; this.emit(); }
  },
  schedule(ms){ if (!this.ref) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), ms == null ? 900 : ms); },
  async flush(){
    if (!this.ref) return;
    if (this.inflight){ this.again = true; return; }
    this.inflight = true;
    try { await this.ref.set({ rec: this.rec }); }
    catch(e){
      const code = e && e.code;
      if (code === 'unavailable'){ setTimeout(() => this.schedule(0), 1500 + Math.random() * 1500); }
      else { this.ref = null; this.mode = 'local'; this.emit(); }
    } finally {
      this.inflight = false;
      if (this.again){ this.again = false; this.schedule(300); }
    }
  }
};
Store.load();

function storeNote(){
  return Store.mode === 'db'
    ? 'ההתקדמות נשמרת בחשבון שלך ומסונכרנת בין מכשירים. רק את/ה רואה אותה.'
    : 'ההתקדמות נשמרת בדפדפן הזה בלבד. בדפדפן או במכשיר אחר היא תתחיל מאפס.';
}

/* ================= shared renderers ================= */
function readBtn(id, big){
  const r = Store.isRead(id);
  if (big) return `<button class="btn ${r ? 'is-read' : 'primary'}" data-toggle="${id}" aria-pressed="${r}">${r ? CHECK.replace('<svg', '<svg width="16" height="16"') + ' קראתי' : 'סימון כנקרא'}</button>`;
  return `<button class="readbtn" data-toggle="${id}" aria-pressed="${r}" aria-label="${r ? 'בטל סימון כנקרא' : 'סמן כנקרא'}: ${esc(IT[id].title)}" title="${r ? 'נקרא' : 'סמן כנקרא'}">${CHECK}</button>`;
}
function domainChip(d){ return `<a class="chip" href="#d-${d}" style="--c:${dcol(d)}"><span class="dot"></span>${esc(DM[d].label)}</a>`; }
function stageChip(s){ return `<a class="chip" href="#${s}">${esc(ST[s].label)} · ${esc(ST[s].course)}</a>`; }
function acc(title, html, id, cls){ return `<details class="acc${cls ? ' ' + cls : ''}"${id ? ` id="${id}"` : ''}><summary>${title}</summary><div class="acc-body prose">${html}</div></details>`; }
function miniTldr(t){ return t ? `<details class="mini"><summary>תקציר</summary><p>${esc(t)}</p></details>` : ''; }
function byline(it){ return [it.authors, it.year].filter(Boolean).map(esc).join(' · '); }
const FDIR = 'files/';
const ORIG_KIND = { doc: 'Word', docx: 'Word', pptx: 'PowerPoint' };
const mb = n => n >= 1e6 ? (n / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1e3)) + ' KB';
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch(e){ return ''; } };
const fileFor = key => key === 'kit' ? D.kitFile : (IT[key] && IT[key].file);
const pdfName = f => f.orig.replace(/\.(docx?|pptx)$/i, '.pdf');
function pdfLink(key, label, cls){ return `<button type="button" class="${cls || 'btn'}" data-read="${key}">${label}</button>`; }
function dlLink(key, label, cls){ const f = fileFor(key); return `<button type="button" class="${cls || 'btn'} dl-only" data-dl="${FDIR}${f.pdf}" data-name="${esc(pdfName(f))}">${label}</button>`; }
function srcTags(it){
  const t = [];
  if (it.file) t.push(pdfLink(it.id, 'PDF', 'tag'));
  if (it.url) t.push(`<a class="tag" href="${esc(it.url)}" target="_blank" rel="noopener">קישור ↗</a>`);
  return t.join('');
}
function srcBox(it){
  const rows = [];
  const f = it.file;
  if (f){
    const kind = ORIG_KIND[f.ext];
    const notes = [`<bdi>PDF</bdi> · ${f.pages} עמ' · <bdi dir="ltr">${mb(f.bytes)}</bdi>`];
    rows.push(`<div class="src-row"><span class="src-ico" aria-hidden="true">PDF</span>
      <div class="src-main"><b>קובץ המקור</b><span>${notes.join(' · ')}</span></div>
      <div class="src-btns">${pdfLink(it.id, 'פתיחה')}${dlLink(it.id, 'הורדה')}</div></div>`);
  }
  if (it.url){
    rows.push(`<div class="src-row"><span class="src-ico web" aria-hidden="true">↗</span>
      <div class="src-main"><b>${esc(it.urlLabel || 'קישור למקור')}</b><span dir="ltr" style="text-align:end">${esc(host(it.url))}</span></div>
      <div class="src-btns"><a class="btn" href="${esc(it.url)}" target="_blank" rel="noopener">למקור ↗</a></div></div>`);
  }
  if (!rows.length) return '';
  return `<section class="srcbox" aria-label="מקורות">${rows.join('')}</section>`;
}

/* ================= in-page PDF reader ================= */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfjsReady = null;
function loadScript(src){ return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = src; sc.onload = res; sc.onerror = () => rej(new Error('script')); document.head.appendChild(sc); }); }
function loadPdfJs(){
  if (!pdfjsReady) pdfjsReady = loadScript(PDFJS + 'pdf.worker.min.js').then(() => loadScript(PDFJS + 'pdf.min.js')).then(() => {
    const L = window.pdfjsLib; L.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; return L;
  }).catch(e => { pdfjsReady = null; throw e; });
  return pdfjsReady;
}
const RD = { key: null, doc: null, zoom: 1, obs: null, token: 0, back: null, ratio: 1.414 };
const $r = id => document.getElementById(id);
function readerBase(){ const b = $r('readerBody'); const w = b.clientWidth - 32; return Math.max(240, Math.min(900, w)); }
function sizePages(){
  const w = Math.round(readerBase() * RD.zoom);
  document.querySelectorAll('#readerPages .rpage').forEach(d => { d.style.width = w + 'px'; });
  $r('zoomVal').textContent = Math.round(RD.zoom * 100) + '%';
}
async function renderPage(div){
  const doc = RD.doc, tok = RD.token; if (!doc) return;
  const n = +div.dataset.p, w = div.clientWidth;
  if (div.dataset.w === String(w)) return;
  div.dataset.w = String(w);
  try {
    const page = await doc.getPage(n);
    if (tok !== RD.token) return;
    const v1 = page.getViewport({ scale: 1 });
    div.style.aspectRatio = v1.width + ' / ' + v1.height;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const vp = page.getViewport({ scale: (w / v1.width) * dpr });
    const c = document.createElement('canvas');
    c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    c.setAttribute('aria-label', 'עמוד ' + n);
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    if (tok !== RD.token) return;
    div.replaceChildren(c);
  } catch(e){ div.dataset.w = ''; }
}
async function openReader(key, trigger){
  const f = fileFor(key); if (!f) return;
  const tok = ++RD.token;
  RD.key = key; RD.back = trigger || null; RD.zoom = 1;
  const title = key === 'kit' ? 'קיט ההתמחות המקורי' : IT[key].title;
  $r('readerTitle').textContent = title;
  $r('readerMeta').innerHTML = `<bdi>${esc(f.orig)}</bdi> · ${f.pages} עמ'`;
  const dl = $r('readerDl'); dl.dataset.dl = FDIR + f.pdf; dl.dataset.name = pdfName(f);
  const ext = $r('readerExt'), url = key !== 'kit' && IT[key].url;
  ext.hidden = !url; if (url) ext.href = url;
  $r('readerPages').replaceChildren();
  const st = $r('readerStatus'); st.hidden = false; st.textContent = 'טוען את הקובץ…';
  $r('reader').hidden = false; document.body.style.overflow = 'hidden';
  $r('readerBody').scrollTop = 0; $r('readerClose').focus();
  $r('zoomVal').textContent = '100%';
  try {
    const [L, buf] = await Promise.all([loadPdfJs(), fetch(FDIR + f.pdf).then(r => { if (!r.ok) throw new Error('fetch'); return r.arrayBuffer(); })]);
    if (tok !== RD.token) return;
    const doc = await L.getDocument({ data: buf, isEvalSupported: false }).promise;
    if (tok !== RD.token){ doc.destroy(); return; }
    RD.doc = doc;
    const p1 = await doc.getPage(1); const v = p1.getViewport({ scale: 1 }); RD.ratio = v.height / v.width;
    const frag = document.createDocumentFragment();
    for (let i = 1; i <= doc.numPages; i++){
      const d = document.createElement('div'); d.className = 'rpage'; d.dataset.p = i;
      d.style.aspectRatio = v.width + ' / ' + v.height;
      d.innerHTML = `<span class="rpage-n">${i}</span>`;
      frag.appendChild(d);
    }
    $r('readerPages').replaceChildren(frag);
    st.hidden = true;
    sizePages();
    if (RD.obs) RD.obs.disconnect();
    RD.obs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) renderPage(e.target); }), { root: $r('readerBody'), rootMargin: '800px 0px' });
    document.querySelectorAll('#readerPages .rpage').forEach(d => RD.obs.observe(d));
  } catch(e){
    if (tok !== RD.token) return;
    st.textContent = 'לא הצלחנו להציג את הקובץ כאן.' + (DL ? ' אפשר להוריד אותו בכפתור "הורדה".' : ' כדאי לנסות שוב מאוחר יותר.');
  }
}
function closeReader(){
  RD.token++;
  if (RD.obs){ RD.obs.disconnect(); RD.obs = null; }
  if (RD.doc){ try { RD.doc.destroy(); } catch(e){} RD.doc = null; }
  $r('readerPages').replaceChildren();
  $r('reader').hidden = true; document.body.style.overflow = '';
  if (RD.back && document.contains(RD.back)) RD.back.focus();
}
function zoomBy(step){
  const z = Math.min(2.5, Math.max(0.5, Math.round((RD.zoom + step) * 100) / 100));
  if (z === RD.zoom || !RD.doc) return;
  RD.zoom = z; sizePages();
  document.querySelectorAll('#readerPages .rpage').forEach(d => { d.dataset.w = ''; if (RD.obs){ RD.obs.unobserve(d); RD.obs.observe(d); } });
}
let rsT = null;
window.addEventListener('resize', () => { if ($r('reader').hidden || !RD.doc) return; clearTimeout(rsT); rsT = setTimeout(() => zoomBy(0.0001), 250); });

function itemCard(it){
  const tags = [];
  domainsOf(it).forEach(d => tags.push(domainChip(d)));
  tags.push(srcTags(it));
  return `<article class="card${Store.isRead(it.id) ? ' read' : ''}">
    <div class="card-main">
      <h3><a href="#i-${it.id}">${esc(it.title)}</a></h3>
      <div class="by">${byline(it)}</div>
      ${miniTldr(it.tldr)}
      <div class="tags">${tags.join('')}</div>
    </div>
    ${readBtn(it.id)}
  </article>`;
}
function bar(n, total){ const p = total ? Math.round(100 * n / total) : 0; return `<div class="bar" role="img" aria-label="${n} מתוך ${total}"><i style="width:${p}%"></i></div>`; }
function nextUnread(){
  for (const id of ORDER) if (!Store.isRead(id)) return IT[id];
  return null;
}

/* ================= pages ================= */
const YEAR_SHORT = {
  s1: 'שנת היכרות: המקצוע, הכניסה לבית הספר, אבחון וטיפול ראשונים.',
  s2: 'העמקה בטיפול ובעבודה המערכתית, וכניסה לחינוך המיוחד ולקהילה.',
  s3: 'תיאוריה מעמיקה, ליבת המקצוע והכנה לבחינת הסיום.'
};
const YEAR_INTRO = {
  s1: 'השנה הראשונה היא שנת היכרות: מה זה להיות פסיכולוג חינוכי, איך נכנסים לבית ספר ולעבודה עם המנהל, ואיך נראים האבחון, הטיפול וההתערבות בחירום בפעם הראשונה. את מתווה העבודה של המסגרת שלך כדאי להכיר כבר בהתחלה; המתווים נמצאים בעמוד נפרד, מחוץ לשנים.',
  s2: 'בשנים ב\'-ג\' הקריאה מעמיקה. בטיפול: עבודה עם הורים, המשגה דינמית והחוזה הטיפולי. ובעיקר בעבודה המערכתית: בית הספר כארגון, החוזה עם המנהל, הלא מודע הארגוני וההכלה. כאן נכנסים גם החינוך המיוחד והקהילה.',
  s3: 'שנה ד\' סוגרת מעגל: תיאוריה מעמיקה (ביון, ההגנות הארגוניות, ההכלה), חשיבה על ליבת המקצוע, והכנה לבחינת הסיום בתחום המערכתי.'
};
const YKEY = 'kit-my-year';
function myYear(){ try { const y = localStorage.getItem(YKEY); if (ST[y]) return y; } catch(e){} return null; }
function setMyYear(y){ try { if (y) localStorage.setItem(YKEY, y); else localStorage.removeItem(YKEY); } catch(e){} }
const yearIds = sid => itemsIn(sid).map(i => i.id);
function yearPath(sid){ // ordered list of items in this year (domain order)
  const out = [];
  D.domains.forEach(d => D.items.forEach(i => { if (i.placements.some(p => p[0] === sid && p[1] === d.id) && !out.includes(i)) out.push(i); }));
  return out;
}
function currentYear(){
  const m = myYear(); if (m) return m;
  for (const s of D.stages){ const ids = yearIds(s.id); if (Store.count(ids) < ids.length) return s.id; }
  return 's3';
}
function nextInYear(sid){ return yearPath(sid).find(i => !Store.isRead(i.id)) || null; }
function stageOfItem(it){ return it.placements.length ? it.placements[0][0] : null; }

function pageHome(){
  const cur = currentYear(), mine = myYear();
  const total = ALL_IDS.length, done = Store.count(ALL_IDS);
  const nxt = nextInYear(cur);
  const track = D.stages.map((s, k) => {
    const ids = yearIds(s.id), n = Store.count(ids);
    const state = n === ids.length ? 'הושלמה' : n ? 'בתהליך' : 'טרם התחלת';
    return `${k ? '<span class="yt-arrow" aria-hidden="true">←</span>' : ''}<a class="yt-card${s.id === cur ? ' is-cur' : ''}" href="#${s.id}">
      <span class="yt-yr">${esc(s.label)}</span><span class="yt-course">${esc(s.course)}</span>
      <span class="yt-meta">${ids.length} פריטים · ${n} נקראו · ${state}</span>${bar(n, ids.length)}
      ${s.id === cur ? '<span class="yt-here">אתה/את כאן</span>' : ''}</a>`;
  }).join('');
  return `
  <section class="home-hero">
    <div class="stars" aria-hidden="true">${'<svg viewBox="0 0 10 10"><path d="M5 0l1.2 3.4H10L7 5.6l1.1 3.6L5 7.1 1.9 9.2 3 5.6 0 3.4h3.8z"/></svg>'.repeat(7)}</div>
    <div class="eyebrow">פסיכולוגיה חינוכית · שפ"ח תל אביב-יפו</div>
    <h1>קיט ההתמחות</h1>
    <p class="lede">רשימת קריאה שבנויה לפי שנות ההתמחות. מתחילים במאמרי שנה א' וממשיכים קדימה, שנה אחרי שנה. לכל מאמר יש סיכום, קובץ מקור או קישור, וכלים לעבודה בשטח.</p>
    <div class="myyear"><label for="myYearSel">אני בשנה:</label>
      <select id="myYearSel"><option value="">לפי ההתקדמות שלי</option>${D.stages.map(s => `<option value="${s.id}"${mine === s.id ? ' selected' : ''}>${esc(s.label)} · ${esc(s.course)}</option>`).join('')}</select></div>
  </section>
  <nav class="year-track" aria-label="שנות ההתמחות">${track}</nav>
  <div class="outl-strip"><b>מתווי עבודה</b><span class="m">לא שייכים לשנה מסוימת: מה נכלל בעבודה בכל מסגרת. כדאי להכיר את המתווה של המסגרת שלך כבר בהתחלה.</span>
    <div class="row">${D.outlines.map(o => `<a class="chip" href="#i-${o.item}">${esc(o.label)}</a>`).join('')}<a class="chip" href="#outlines">לכל המתווים</a></div></div>

  <section class="home-grid">
    <div class="panel nextup">
      <div class="eyebrow">הבא בתור · ${esc(ST[cur].label)}</div>
      ${nxt ? `<h2><a href="#i-${nxt.id}">${esc(nxt.title)}</a></h2><div class="by">${byline(nxt)}</div>
        ${miniTldr(nxt.tldr)}
        <div class="actions"><a class="btn primary" href="#i-${nxt.id}">לסיכום</a>${nxt.file ? pdfLink(nxt.id, 'פתיחת המקור') : nxt.url ? `<a class="btn" href="${esc(nxt.url)}" target="_blank" rel="noopener">למקור ↗</a>` : ''}${readBtn(nxt.id, true)}</div>`
      : `<h2>סיימת את ${esc(ST[cur].label)}</h2><p>כל הפריטים בשנה הזו סומנו כנקראו.</p><div class="actions">${cur !== 's3' ? `<a class="btn primary" href="#${D.stages[D.stages.findIndex(s => s.id === cur) + 1].id}">לשנה הבאה</a>` : `<a class="btn primary" href="#exam">להכנה לבחינה</a>`}</div>`}
      <div class="actions" style="margin-top:6px"><a href="#${cur}">לכל רשימת הקריאה של ${esc(ST[cur].label)} ←</a></div>
    </div>
    <aside class="panel progress-panel" aria-label="ההתקדמות שלי">
      <h2>ההתקדמות שלי</h2>
      <div><span class="big-num">${done}</span> <span class="muted">מתוך ${total} פריטים בקיט</span></div>
      <div style="margin-top:10px">${bar(done, total)}</div>
      <div class="store-note" id="storeNote">${storeNote()}</div>
    </aside>
  </section>



  <div class="section-head"><h2>לצד המסלול</h2></div>
  <div class="quick">
    <a href="#glossary"><b>מילון מושגים</b><span>${D.glossary.length} מושגים, עם הפניה למקורות</span></a>
    <a href="#domains"><b>תחומי העבודה</b><span>סקירה לכל אחד משבעת התחומים</span></a>
    <a href="#map"><b>מבט על</b><span>כל השנים מול תחומי העבודה בטבלה אחת</span></a>
    <a href="#sources"><b>מקורות</b><span>קבצי המקור וקישורים לכל הפריטים</span></a>
    <a href="#library"><b>ספרייה</b><span>כל הפריטים, עם סינון וחיפוש</span></a>
  </div>`;
}

function pageMap(){
  return `<div class="pagehead"><h1>מבט על</h1><p class="lede">כל שלוש שנות ההתמחות מול שבעת תחומי העבודה. העמודות הן השנים, לפי הסדר שבו קוראים.</p></div>
  <div style="margin-top:22px">${matrix()}</div>
  <div class="legend"><span><i class="st"></i> טרם נקרא</span><span><i class="st on"></i> נקרא</span></div>
  <p class="muted" style="margin-top:18px">לסקירה לפי תחום: ${D.domains.map(d => `<a href="#d-${d.id}">${esc(d.long)}</a>`).join(' · ')}</p>`;
}

function matrix(){
  const open = new Set(D.openCells.map(c => c.join('|')));
  let h = `<div class="mx-wrap"><div class="matrix" aria-label="שנים ותחומים">`;
  h += `<div class="mx-corner">תחום \\ שלב</div>`;
  D.stages.forEach(s => { const ids = itemsIn(s.id).map(i => i.id); const n = Store.count(ids);
    h += `<div class="mx-stagehead"><a href="#${s.id}"><span class="course">${esc(s.course)}</span><span class="yr">${esc(s.label)} · ${n}/${ids.length}</span></a>${bar(n, ids.length)}</div>`; });
  D.domains.forEach(d => {
    const dids = itemsIn(null, d.id).map(i => i.id);
    h += `<div class="mx-rowhead"><a href="#d-${d.id}" style="--c:${dcol(d.id)}"><span class="dot"></span>${esc(d.label)}</a><small>${Store.count(dids)}/${dids.length} נקראו</small></div>`;
    D.stages.forEach(s => {
      const list = D.items.filter(i => i.placements.some(p => p[0] === s.id && p[1] === d.id));
      let inner;
      if (list.length){
        inner = '<ul>' + list.map(i => `<li class="${Store.isRead(i.id) ? 'read' : ''}${i.inFolder ? '' : ' linkonly'}"><span class="st" aria-hidden="true"></span><a href="#i-${i.id}" title="${esc(i.title)}">${esc(i.title)}</a>${i.inFolder ? '' : '<span class="lk" aria-label="קישור בלבד">↗</span>'}</li>`).join('') + '</ul>';
      } else if (open.has(s.id + '|' + d.id)){
        inner = '<span class="mx-empty">—</span>';
      } else inner = '<span class="mx-empty">—</span>';
      h += `<div class="mx-cell" data-stage="${esc(s.label + ' · ' + s.course)}">${inner}</div>`;
    });
  });
  h += `<div class="mx-rowhead mx-res"><a href="#map"><span class="dot" style="background:var(--muted)"></span>משאבים</a><small>כלים מומלצים</small></div>`;
  D.stages.forEach(s => {
    const rs = D.resources.filter(r => r.stage === s.id);
    h += `<div class="mx-cell mx-res" data-stage="${esc(s.label + ' · משאבים')}"><ul>${rs.map(r => `<li>${r.item ? `<a href="#i-${r.item}">${esc(r.title)}</a>` : esc(r.title)} <span class="muted">· ${esc(r.note)}</span></li>`).join('') || '<li class="mx-empty">—</li>'}</ul></div>`;
  });
  return h + '</div></div>';
}

function pathRow(it, n){
  const r = Store.isRead(it.id);
  return `<li class="prow${r ? ' read' : ''}${it.inFolder ? '' : ' linkonly'}"><span class="pnum">${n}</span>${readBtn(it.id)}
    <div class="pmain"><a class="ptitle" href="#i-${it.id}">${esc(it.title)}</a><div class="by">${byline(it)}</div>${miniTldr(it.tldr)}<div class="tags">${srcTags(it)}</div></div></li>`;
}
function yearSwitch(sid){
  return `<nav class="ysw" aria-label="מעבר בין שנים">${D.stages.map(s => `<a href="#${s.id}"${s.id === sid ? ' aria-current="page"' : ''}><b>${esc(s.label)}</b> ${esc(s.course)}</a>`).join('<span aria-hidden="true">←</span>')}</nav>`;
}
function pageStage(sid){
  const s = ST[sid], k = D.stages.findIndex(x => x.id === sid);
  const ids = yearIds(sid), done = Store.count(ids);
  const nxt = nextInYear(sid);
  let n = 0, groups = '';
  D.domains.forEach(d => {
    const list = D.items.filter(i => i.placements.some(p => p[0] === sid && p[1] === d.id));
    const isOpen = D.openCells.some(c => c[0] === sid && c[1] === d.id);
    if (!list.length) return;
    groups += `<section class="pgroup"><h2 class="group-title" style="--c:${dcol(d.id)}"><span class="dot"></span>${esc(d.long)} <a class="muted glink" href="#d-${d.id}">סקירת התחום</a></h2>`;
    groups += list.length ? `<ol class="path">${list.map(i => pathRow(i, ++n)).join('')}</ol>` : '';
    groups += '</section>';
  });
  const yset = new Set(ids);
  const tools = D.tools.filter(t => t.sources.some(x => yset.has(x)));
  const terms = D.glossary.filter(g => g.sources.some(x => yset.has(x)));
  const res = D.resources.filter(r => r.stage === sid);
  const exam = sid === 's3' ? `<section class="panel before"><div class="eyebrow">סוף ההתמחות</div><h2>הבחינה בתחום המערכתי</h2><p>מה מצופה לדעת בסוף ההתמחות, ותרשים זרימה להצגת מקרה מערכתי, .</p><div class="actions"><a class="btn primary" href="#exam">להכנה לבחינה</a></div></section>` : '';
  const prevS = D.stages[k - 1], nextS = D.stages[k + 1];
  return `${yearSwitch(sid)}
  <div class="year-head">
    <div class="pagehead"><div class="eyebrow">${esc(s.label)}</div><h1>${esc(s.course)}</h1><p class="lede">${esc(YEAR_SHORT[sid])}</p><details class="mini"><summary>עוד על השנה</summary><p>${esc(YEAR_INTRO[sid] || s.blurb)}</p></details></div>
    <aside class="panel">
      <div class="prog-row"><span><b>${done}</b> מתוך ${ids.length} נקראו</span><span>${ids.length ? Math.round(100 * done / ids.length) : 0}%</span>${bar(done, ids.length)}</div>
      ${nxt ? `<div class="next-up"><span class="muted">הבא בתור:</span><br><a href="#i-${nxt.id}">${esc(nxt.title)}</a></div>` : `<div class="next-up"><b>סיימת את השנה הזו.</b>${nextS ? ` <a href="#${nextS.id}">ל${esc(nextS.label)} ←</a>` : ''}</div>`}
    </aside>
  </div>
  <div class="section-head"><h2>רשימת הקריאה</h2><span class="muted">${ids.length} פריטים, לפי תחומי העבודה</span></div>
  ${groups}
  ${res.length ? `<div class="section-head"><h2>משאבים לשנה הזו</h2></div><ul class="prose">${res.map(r => `<li>${r.item ? `<a href="#i-${r.item}">${esc(r.title)}</a>` : esc(r.title)} <span class="muted">· ${esc(r.note)}</span></li>`).join('')}</ul>` : ''}
  ${terms.length ? `<div class="section-head"><h2>מושגים של השנה</h2><a href="#glossary">למילון המלא</a></div><div class="related" style="margin-top:0;max-width:none"><div class="row">${terms.map(g => `<button class="chip" style="border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:600" data-term="${esc(g.term)}">${esc(g.term)}</button>`).join('')}</div></div>` : ''}
  ${exam}
  <nav class="pager" style="max-width:none" aria-label="שנים סמוכות">${prevS ? `<a href="#${prevS.id}"><small>השנה הקודמת</small>${esc(prevS.label)} · ${esc(prevS.course)}</a>` : '<span></span>'}${nextS ? `<a href="#${nextS.id}" style="text-align:end"><small>השנה הבאה</small>${esc(nextS.label)} · ${esc(nextS.course)}</a>` : ''}</nav>`;
}

function pageDomains(){
  return `<div class="pagehead"><h1>תחומים</h1><p class="lede">שבעת תחומי העבודה. בכל תחום: סקירה שמחברת בין המקורות, הקריאה לפי שלבים, כלים ומושגים.</p></div>
  <div class="tool-grid" style="margin-top:24px">${D.domains.map(d => { const ids = itemsIn(null, d.id).map(i => i.id);
    return `<a class="tool-card" href="#d-${d.id}" style="--c:${dcol(d.id)}"><b style="display:flex;gap:8px;align-items:center"><span class="dot" style="width:12px;height:12px"></span>${esc(d.long)}</b><span>${ids.length} פריטים · ${D.glossary.filter(g => g.domains.includes(d.id)).length} מושגים</span>${bar(Store.count(ids), ids.length)}</a>`; }).join('')}</div>`;
}

function domainAcc(h){
  const parts = h.split(/<h4>/);
  let out = parts[0] ? `<div class="prose dlead">${parts[0]}</div>` : '';
  out += '<div class="acc-group">' + parts.slice(1).map(p => { const i = p.indexOf('</h4>'); return acc(`<b>${p.slice(0, i)}</b>`, p.slice(i + 5)); }).join('') + '</div>';
  return out;
}
function pageDomain(did){
  const d = DM[did];
  const ids = itemsIn(null, did).map(i => i.id);
  let byStage = '';
  D.stages.forEach(s => {
    const list = D.items.filter(i => i.placements.some(p => p[0] === s.id && p[1] === did));
    const isOpen = D.openCells.some(c => c[0] === s.id && c[1] === did);
    byStage += `<div class="group-title">${esc(s.label)} · ${esc(s.course)}</div>`;
    byStage += list.length ? `<div class="cards">${list.map(itemCard).join('')}</div>` : `<p class="muted">—</p>`;
  });
  const tools = D.tools.filter(t => t.domain === did);
  const terms = D.glossary.filter(g => g.domains.includes(did));
  return `<div class="pagehead"><div class="crumbs"><a class="chip" href="#domains">תחומים</a></div>
    <div class="domain-hero" style="--c:${dcol(did)}"><span class="sw"></span><div><div class="eyebrow">תחום · ${esc(d.label)}</div><h1>${esc(d.long)}</h1></div></div>
    <div style="margin-top:14px;max-width:420px"><div class="prog-row"><span>נקראו</span><span>${Store.count(ids)}/${ids.length}</span>${bar(Store.count(ids), ids.length)}</div></div></div>
    <div class="domain-body">${domainAcc(D.domainText[did] || '')}</div>
    <div class="section-head"><h2>הקריאה לפי שלבים</h2></div>${byStage}
    ${terms.length ? `<div class="section-head"><h2>מושגים בתחום</h2><a href="#glossary">למילון המלא</a></div><div class="related"><div class="row">${terms.map(g => `<button class="chip" style="border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:600" data-term="${esc(g.term)}">${esc(g.term)}</button>`).join('')}</div></div>` : ''}`;
}

const SEC_ORDER = [
  ['ideas', 'רעיונות מרכזיים'], ['models', 'מודלים, שלבים וטבלאות'], ['practice', 'יישום למתמחה'],
  ['questions', 'שאלות להדרכה'], ['concepts', 'מושגי מפתח'], ['quotes', 'ציטוטים מהמקור'], ['toc', 'תוכן העניינים של המקור']
];
function pageItem(id){
  const it = IT[id];
  if (!it) return notFound();
  const crumbs = it.placements.length
    ? domainsOf(it).map(domainChip).join('')
    : `<a class="chip" href="#outlines">מתווי עבודה</a>`;
  const srcBtn = it.file ? pdfLink(it.id, 'פתיחת קובץ המקור') : it.url ? `<a class="btn" href="${esc(it.url)}" target="_blank" rel="noopener">למקור ↗</a>` : '';
  let body = '', toc = '';
  body += srcBox(it);
  if (it.inFolder){
    body += `<div class="acc-group">` + acc('<b>בקצרה</b>', it.secs.abstract || '', 'sec-abstract', 'lead');
    let n = 0;
    SEC_ORDER.forEach(([k, label]) => {
      const h = it.secs[k]; if (!h || !h.trim()) return;
      n++;
      body += acc(`<b>${esc(label)}</b>`, h, `sec-${k}`, `sec-${k}`);
      toc += `<button data-jump="sec-${k}">${esc(label)}</button>`;
    });
    D.tools.filter(t => t.sources.includes(id)).forEach(t => {
      body += acc(`<b>לעבודה בשטח: ${esc(t.title)}</b>`, `<p class="muted"><b>מתי להשתמש:</b> ${esc(t.when)}</p>` + t.html, `tool-${t.id}`, 'toolacc');
      toc += `<button data-jump="tool-${t.id}">לעבודה בשטח</button>`;
    });
    body += `</div>`;
  } else {
    body += `<div class="linkonly-box"><p>${esc(it.desc || '')}</p></div>`;
  }
  const tools = D.tools.filter(t => t.sources.includes(id));
  const terms = D.glossary.filter(g => g.sources.includes(id));
  const ysid = stageOfItem(it);
  const ypath = ysid ? yearPath(ysid) : D.outlines.map(o => IT[o.item]);
  const idx = ypath.indexOf(it);
  const prev = idx > 0 ? ypath[idx - 1] : null, next = idx >= 0 && idx < ypath.length - 1 ? ypath[idx + 1] : null;
  const yl = ysid ? ST[ysid].label : 'המתווים';
  const posNote = idx >= 0 ? `<div class="ypos"><a href="#${ysid || 'outlines'}">${esc(yl)}${ysid ? ' · ' + esc(ST[ysid].course) : ''}</a> · פריט ${idx + 1} מתוך ${ypath.length}</div>` : '';
  const level = it.inFolder && it.level ? `<div class="muted" style="font-size:14px;margin-top:6px">${esc(it.stype.split('(')[0].trim())}</div>` : '';
  return `<div class="item-layout"><div>
    <div class="crumbs">${crumbs}</div>
    ${posNote}
    <div class="item-head"><h1>${esc(it.title)}</h1><div class="by">${byline(it)}</div>${level}</div>
    <div class="actions">${readBtn(id, true)}${srcBtn.replace('class="btn"', 'class="btn"')}</div>
    ${body}
    ${terms.length ? `<div class="related">
      ${terms.length ? `<h2>מושגים מהפריט</h2><div class="row">${terms.map(g => `<button class="chip" style="border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:600" data-term="${esc(g.term)}">${esc(g.term)}</button>`).join('')}</div>` : ''}
    </div>` : ''}
    <div class="cite"><p><b>מראה מקום:</b> ${esc(it.cite)}</p><button class="btn" data-copy="${esc(it.cite)}" style="font-size:13px;padding:5px 10px">העתקה</button></div>
    <nav class="pager" aria-label="פריטים סמוכים">${prev ? `<a href="#i-${prev.id}"><small>הקודם ב${esc(yl)}</small>${esc(prev.title)}</a>` : '<span></span>'}${next ? `<a href="#i-${next.id}" style="text-align:end"><small>הבא ב${esc(yl)}</small>${esc(next.title)}</a>` : ''}</nav>
  </div>
  ${toc ? `<aside class="item-toc" aria-label="בדף הזה"><b>בדף הזה</b>${toc}</aside>` : '<span></span>'}
  </div>`;
}

/* library */
const LIB = { q: '', stage: '', domain: '', status: '', avail: '' };
function pageLibrary(){
  const fb = (key, val, label, extra) => `<button class="fbtn" data-f="${key}" data-v="${val}" aria-pressed="${LIB[key] === val}">${extra || ''}${esc(label)}</button>`;
  return `<div class="pagehead"><h1>ספרייה</h1><p class="lede">כל ${D.items.length} הפריטים, עם סינון לפי שלב, תחום וסטטוס קריאה.</p></div>
  <div class="filters"><label class="sr" for="libq">חיפוש בספרייה</label><input type="search" id="libq" placeholder="סינון לפי כותרת, מחבר או נושא" value="${esc(LIB.q)}"></div>
  <div class="filters"><div class="fgroup"><span>שלב</span>${fb('stage', '', 'הכל')}${D.stages.map(s => fb('stage', s.id, s.label)).join('')}${fb('stage', 'outline', 'מתווים')}</div></div>
  <div class="filters"><div class="fgroup"><span>תחום</span>${fb('domain', '', 'הכל')}${D.domains.map(d => fb('domain', d.id, d.label, `<span class="dot" style="--c:${dcol(d.id)}"></span>`)).join('')}</div></div>
  <div class="filters"><div class="fgroup"><span>סטטוס</span>${fb('status', '', 'הכל')}${fb('status', 'unread', 'טרם נקראו')}${fb('status', 'read', 'נקראו')}</div>
    <div class="fgroup"><span>מקור</span>${fb('avail', '', 'הכל')}${fb('avail', 'folder', 'קובץ PDF')}${fb('avail', 'url', 'קישור חיצוני')}</div></div>
  <div id="libResults"></div>`;
}
function renderLib(){
  const el = document.getElementById('libResults'); if (!el) return;
  const q = norm(LIB.q);
  const list = D.items.filter(i => {
    if (LIB.stage === 'outline' && i.placements.length) return false;
    if (LIB.stage && LIB.stage !== 'outline' && !i.placements.some(p => p[0] === LIB.stage)) return false;
    if (LIB.domain && !i.placements.some(p => p[1] === LIB.domain)) return false;
    if (LIB.status === 'read' && !Store.isRead(i.id)) return false;
    if (LIB.status === 'unread' && Store.isRead(i.id)) return false;
    if (LIB.avail === 'folder' && !i.file) return false;
    if (LIB.avail === 'url' && !i.url) return false;
    if (LIB.avail === 'none' && (i.file || i.url)) return false;
    if (q && !norm(i.title + ' ' + i.authors + ' ' + i.year + ' ' + i.search).includes(q)) return false;
    return true;
  });
  el.innerHTML = `<p class="muted" style="margin:18px 0 10px">${list.length} פריטים</p>` + (list.length ? `<div class="cards">${list.map(itemCard).join('')}</div>` : '<div class="empty-state">אין פריטים שמתאימים לסינון. אפשר לנקות חלק מהמסננים.</div>');
}

/* tools */
function toolCard(t){ return `<a class="tool-card" href="#t-${t.id}"><b>${esc(t.title)}</b><span>${esc(t.when)}</span><span style="display:flex;gap:6px;align-items:center;--c:${dcol(t.domain)}"><span class="dot"></span>${esc(DM[t.domain].label)}</span></a>`; }
function pageTools(){
  let h = `<div class="pagehead"><h1>ארגז כלים</h1><p class="lede">צ'קליסטים, רצפי עבודה ומודלים לעבודה בשטח, מסודרים בערך לפי סדר השנים. כל כלי מפנה למקורות שלו.</p></div>`;
  D.domains.forEach(d => { const ts = D.tools.filter(t => t.domain === d.id); if (!ts.length) return;
    h += `<div class="group-title" style="--c:${dcol(d.id)}"><span class="dot"></span>${esc(d.long)}</div><div class="tool-grid">${ts.map(toolCard).join('')}</div>`; });
  return h;
}
function pageTool(tid){
  const t = TL[tid]; if (!t) return notFound();
  return `<div class="pagehead"><div class="crumbs"><a class="chip" href="#tools">ארגז כלים</a>${domainChip(t.domain)}</div><h1>${esc(t.title)}</h1></div>
    <div class="when"><b>מתי להשתמש:</b> ${esc(t.when)}</div>
    <div class="sec prose">${t.html}</div>
    <div class="related"><h2>מקורות</h2><div class="row">${t.sources.map(s => `<a class="chip" href="#i-${s}">${esc(IT[s].title)}</a>`).join('')}</div></div>`;
}

/* glossary */
const GL = { q: '', domain: '' };
const LETTERS = 'אבגדהוזחטיכלמנסעפצקרשת'.split('');
const finalMap = { 'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ' };
const firstLetter = s => { const c = (s.replace(/^[^א-ת]+/, '')[0]) || '#'; return finalMap[c] || c; };
function pageGlossary(){
  return `<div class="pagehead"><h1>מילון מושגים</h1><p class="lede">${D.glossary.length} מושגים, כל אחד עם הפניה למקורות שבהם הוא מופיע.</p></div>
  <div class="filters"><label class="sr" for="glq">חיפוש מושג</label><input type="search" id="glq" placeholder="חיפוש מושג, בעברית או באנגלית" value="${esc(GL.q)}">
  <div class="fgroup"><button class="fbtn" data-g="" aria-pressed="${GL.domain === ''}">כל התחומים</button>${D.domains.map(d => `<button class="fbtn" data-g="${d.id}" aria-pressed="${GL.domain === d.id}"><span class="dot" style="--c:${dcol(d.id)}"></span>${esc(d.label)}</button>`).join('')}</div></div>
  <div class="letters" id="glLetters"></div><div id="glList"></div>`;
}
function renderGlossary(){
  const el = document.getElementById('glList'); if (!el) return;
  const q = norm(GL.q);
  const list = D.glossary.filter(g => (!GL.domain || g.domains.includes(GL.domain)) && (!q || norm(g.term + ' ' + g.en).includes(q) || norm(g.html.replace(/<[^>]+>/g, ' ')).includes(q)));
  const by = {};
  list.forEach(g => { const L = firstLetter(g.term); (by[L] = by[L] || []).push(g); });
  document.getElementById('glLetters').innerHTML = LETTERS.map(L => `<button data-letter="${L}" ${by[L] ? '' : 'disabled'}>${L}</button>`).join('');
  el.innerHTML = list.length ? Object.keys(by).sort((a, b) => LETTERS.indexOf(a) - LETTERS.indexOf(b)).map(L =>
    `<div class="gl-letter" id="gl-${L}">${L}</div>` + by[L].map(g => `<details class="gl" data-gterm="${esc(g.term)}"><summary><span class="t">${esc(g.term)}</span>${g.en ? `<span class="en">${esc(g.en)}</span>` : ''}</summary>
      <div class="prose">${g.html}</div>
      <div class="meta">${g.domains.map(d => `<span style="display:inline-flex;gap:5px;align-items:center;--c:${dcol(d)}"><span class="dot"></span>${esc(DM[d] ? DM[d].label : d)}</span>`).join('')}${g.sources.length ? ' · מקורות: ' + g.sources.map(s => `<a class="ref" href="#i-${s}">${esc(IT[s].ref)}</a>`).join(', ') : ''}</div></details>`).join('')).join('')
    : '<div class="empty-state">לא נמצא מושג. אפשר לנסות ניסוח אחר או לחפש בחיפוש הכללי.</div>';
}

/* outlines */
let OUT_TAB = 'elem';
function pageOutlines(){
  const o = D.outlines.find(x => x.id === OUT_TAB) || D.outlines[0];
  const it = IT[o.item];
  return `<div class="pagehead"><h1>מתווי עבודה</h1><p class="lede">המתווים עומדים בפני עצמם ואינם חלק מרשימת הקריאה של שנה מסוימת. הם המסמכים שמגדירים מה נכלל בעבודת הפסיכולוג בכל מסגרת. הם הבסיס לשיחה עם המנהל או הגננת על תוכנית העבודה השנתית.</p></div>
  <div class="tabs" role="tablist">${D.outlines.map(x => `<button role="tab" data-tab="${x.id}" aria-selected="${x.id === o.id}">${esc(x.label)}</button>`).join('')}</div>
  ${o.note ? `<p class="note">${esc(o.note)}</p>` : ''}
  <div class="item-head" style="margin-top:22px"><h2 style="font-size:28px">${esc(it.title)}</h2><div class="by">${byline(it)}</div></div>
  <div class="actions">${readBtn(it.id, true)}<a class="btn" href="#i-${it.id}">לסיכום המלא</a></div>
  ${srcBox(it)}
  <div class="acc-group">${acc('<b>בקצרה</b>', it.secs.abstract)}${acc('<b>מבנה, שלבים ולוחות זמנים</b>', it.secs.models)}${acc('<b>יישום למתמחה</b>', it.secs.practice)}</div>`;
}

/* exam */
function pageExam(){
  const r = IT.rubric, flow = TL['systemic-case-flow'];
  const reads = ['rubric', 'fuchs', 'psa_map', 'englert', 'turi_unconscious', 'nutkevitch2003', 'menzies', 'forest2014'].filter(x => IT[x]);
  return `<div class="pagehead"><div class="crumbs">${domainChip('system')}${stageChip('s3')}</div><h1>הבחינה בתחום המערכתי</h1>
    <p class="lede">מה מצופה לדעת בסוף ההתמחות, ואיך לארגן הצגה של מקרה מערכתי.</p></div>
  <div class="actions">${readBtn('rubric', true)}<a class="btn" href="#i-rubric">לסיכום המלא של המחוון</a></div>
  ${srcBox(r)}
  <div class="acc-group">${acc('<b>בקצרה</b>', r.secs.abstract)}${acc('<b>הציפיות ותרשים הזרימה</b>', r.secs.models)}${flow ? acc(`<b>${esc(flow.title)}</b>`, `<p><b>מתי להשתמש:</b> ${esc(flow.when)}</p>` + flow.html) : ''}${acc('<b>שאלות להכנה</b>', r.secs.questions)}</div>
  <div class="section-head"><h2>קריאה מומלצת לקראת הבחינה</h2></div>
  <div class="cards">${reads.map(x => itemCard(IT[x])).join('')}</div>`;
}

/* search */
let SEARCH_Q = '';
function pageSearch(){
  const q = norm(SEARCH_Q);
  if (!q) return `<div class="pagehead"><h1>חיפוש</h1><p class="lede">אפשר לחפש מאמר, מחבר או מושג בתיבת החיפוש למעלה.</p></div>`;
  const items = D.items.map(i => { const t = norm(i.title + ' ' + i.authors); const s = norm(i.search);
    return [i, t.includes(q) ? 3 : s.includes(q) ? 1 : 0]; }).filter(x => x[1]).sort((a, b) => b[1] - a[1]).map(x => x[0]);
  const tools = [];
  const terms = D.glossary.filter(g => norm(g.term + ' ' + g.en).includes(q) || norm(g.html.replace(/<[^>]+>/g, ' ')).includes(q));
  const none = !items.length && !tools.length && !terms.length;
  return `<div class="pagehead"><h1>תוצאות עבור "${esc(SEARCH_Q)}"</h1><p class="lede">${items.length} פריטים · ${terms.length} מושגים</p></div>
    ${none ? '<div class="empty-state">לא נמצאו תוצאות. אפשר לנסות מילה אחרת או חלק ממילה.</div>' : ''}
    ${terms.length ? `<div class="section-head"><h2>מושגים</h2></div><div class="related"><div class="row">${terms.slice(0, 30).map(g => `<button class="chip" style="border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:600" data-term="${esc(g.term)}">${esc(g.term)}</button>`).join('')}</div></div>` : ''}
    ${tools.length ? `<div class="section-head"><h2>כלים</h2></div><div class="tool-grid">${tools.map(toolCard).join('')}</div>` : ''}
    ${items.length ? `<div class="section-head"><h2>פריטים</h2></div><div class="cards">${items.map(itemCard).join('')}</div>` : ''}`;
}

function srcRow(it){
  const b = [];
  if (it.file) b.push(pdfLink(it.id, `PDF · ${it.file.pages} עמ'`, 'btn'));
  if (it.url) b.push(`<a class="btn" href="${esc(it.url)}" target="_blank" rel="noopener" title="${esc(it.urlLabel || '')}">קישור ↗</a>`);
  return `<div class="row"><div><a class="t" href="#i-${it.id}">${esc(it.title)}</a> <span class="muted" style="font-size:14px">${byline(it)}</span></div><div class="b">${b.join('')}</div></div>`;
}
function pageSources(){
