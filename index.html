 לימודים, מבנה, הון אנושי, תשתיות, תרבות, שירותים ותקציב). המסמך מסתיים בטענה שזהו \"שינוי ממעלה שנייה\" שמשנה את כללי המשחק של בתי הספר. מציאות ה-VUCA היא המציאות הקבועה של המאה ה-21 (The New Normal), ולא מצב חריג. היא מתחדדת בזמני משבר כמו הקורונה. כדי שהצעת הערך של בית הספר תישאר רלוונטית, עליו לאמץ תפישה ארגונית שמאפשרת הסתגלות. המורכבות של בתי הספר גוברת בגלל ביזור והאצלת סמכויות, ריבוי בעלי עניין, דרישה לחינוך מותאם אישית ומשילות רב-שכבתית (מטה, מחוז, רשות, בית ספר). המגמות האלה מקשות לתת מענה איכותי בזמן. ארגון היררכי-ריכוזי (\"ארגון האיך\", \"מכונה משומנת\") הוא שביר: שרשרת המידע, ההחלטות, הביצוע והפיקוח ארוכה ואיטית, ההנהלה מנותקת מהשטח, ואין דרכי פעולה חלופיות כשהדרך הסטנדרטית מפסיקה לעבוד. בארגון מורכב מסתגל אין קשר מובהק בין סיבה לתוצאה, וקשה לחזות בפרטנות. ובכל זאת אפשר למצוא סדר באמצעות חשיבה מערכתית. ההסתגלות נשענת על אוטונומיה של הגורמים הפעלנים, על הזיכרון המקומי שלהם ועל הלמידה מהניסיון. בית ספר מורכב מסתגל הוא \"ארגון הלמה\". ההנהלה מגדירה, בשיתוף בעלי העניין, מצפן ויעדי מדיניות (ה\"למה\"), ובעלי העניין מתארגנים בעצמם ובוחרים את ה\"איך\". המצפן יעיל רק אם הוא ברור, מוסכם וידוע לכולם. בניית המצפן נשענת על שתי אסטרטגיות משלימות: חשיבת עתיד לחזון ארוך טווח, וזמישות (agility) שנשענת על סריקה סביבתית שוטפת, פנימית וחיצונית, כדי להגיב מהר לשינויים בהווה. הצוותים האוטונומיים, ההטרוגניים והזמניים הם \"מנוע השינוי\". תפקיד ההנהלה עובר מהוצאת הנחיות ופיקוח לתפקידים של מאמנים, מנטורים, \"מנתחי לקוחות\" ומסירי חסמים, ולבניית אמון ותמיכה בפתרון בעיות בין-אישיות ובין-קבוצתיות. ניהול \"סף הכאוס\" פירושו לאזן בין סדר לאי-סדר. כשיש עודף אי-סדר מגבירים משמעת ושליטה, וכשהארגון מקובע מכניסים אי-סדר מבוקר. לפעמים כדאי דווקא להדגיש חילוקי דעות כדי לקדם דיאלוג אמיתי. המנהיגות צריכה לוותר על \"אשליית השליטה\" ועל \"ודאות כוזבת\". עליה להכיל את החרדה שמעוררות מגבלות התכנון, להחזיק פרדוקסים (\"גם... וגם\") ולבזר מנהיגות למורים. היא גם צריכה להגן על הצוות משחיקה ומלחצים חיצוניים, ולהמיר התנהגויות פוגעניות רגשית בדפוסים שבונים אמון. האקו-סיסטם התומך כולל רכיבים חיצוניים (משרד החינוך, מחוז, רשות, רשת) ופנימיים: מנהיגות, חיבוריות, תוכניות לימודים, מבנה ארגוני, הון אנושי, תשתיות, תרבות, שירותים ותקציב. בתרבות שהוא מטפח, טעויות ובעיות נתפסות כהזדמנויות ללמידה. VUCA – Volatility, Uncertainty, Complexity, Ambiguity: תנודתיות, חוסר ודאות, מורכבות ועמימות. תיאור המציאות של המאה ה-21. STEEEP – מודל לסריקה שיטתית של מגמות שינוי: חברתיות, טכנולוגיות, כלכליות, סביבתיות, חינוכיות ופוליטיות. מורכבות ארגונית – מגוון רחב של ישויות בארגון שמקיימות יחסי גומלין ומשפיעות על אירועים. סוגיה: אנכית, אופקית, מרחבית, טכנולוגית והסתגלותית. \"ארגון האיך\" / \"ארגון הלמה\" – בארגון האיך ההנהלה קובעת \"לפרטי פרטים\" איך עושים כל דבר. בארגון הלמה ההנהלה מגדירה את היעדים (המצפן), ובעלי העניין בוחרים את הדרכים. ארגון שביר / אנטי-שביר – לפי טאלב. ארגון שביר נפגע מהשינוי. ארגון אנטי-שביר מנצל את השינוי לצמיחה, ומאופיין בחיבור למציאות, בביזור השליטה וביתירות (redundancy) של דרכי פעולה. ארגון מורכב מסתגל (CAS) – ארגון שבנוי כמערכת אקולוגית פתוחה ודינמית שמסוגלת ללמוד ולהסתגל למציאות משתנה. גורמים פעלנים – ארגון, מחלקה, צוות או אדם שפועלים באופן עצמאי ומקיימים יחסי גומלין דינמיים. התארגנות עצמית והתהוות – גורמים פעלנים מתארגנים בעצמם לשיתופי פעולה, ובתהליך \"מלמטה למעלה\" נוצרים דפוסים ארגוניים חדשים. סף הכאוס – מצב ביניים בין \"יציבות קפואה ומנוונת\" לבין \"פעילות כאוטית ובלתי נשלטת\", שמניע יצירתיות וחדשנות. זמישות ארגונית – יכולת להתאים את העשייה הארגונית במהירות לשינויים במציאות. מצפן בית ספרי – עקרונות ויעדי מדיניות ברורים, מוסכמים ושקופים, שמבוססים על המצפן המערכתי של מערכת החינוך ועל חזון בית ספרי ומודלים קוגניטיביים ייחודיים. סריקה סביבתית – מנגנון לניטור, זיהוי וניתוח מהירים של מידע פנימי וחיצוני, ולגזירת אתגרים והזדמנויות ממנו."},{"id":"turi_contract","title":"תהליך בניית חוזה עבודה עם מנהל בית הספר","authors":"צילה תורי-מגדסי","year":"","cite":"תורי-מגדסי, צ'. תהליך בניית חוזה עבודה עם מנהל בית הספר. הפורום המערכתי, שפ\"י.","url":null,"kind":"tool","desc":null,"file":{"orig":"בנית חוזה עם מנהל ביהס צילה תורי מגדסי.pdf","ext":"pdf","pdf":"turi_contract.pdf","pages":5,"bytes":168274},"placements":[["s2","system"]],"extra":false,"ref":"תורי-מגדסי, חוזה עם המנהל","inFolder":true,"srcTitle":"תהליך בניית חוזה עבודה עם מנהל ביה\"ס","secs":{"abstract":"<p>המסמך הוא כלי מובנה, באורך חמישה עמודים, לשיחה בין פסיכולוג בית הספר לבין המנהל. השיחה מתקיימת אחרי היכרות ראשונית עם בית הספר, וגם לקראת כל שנת לימודים חדשה. הכותבת מדגישה שבניית החוזה, בדיקת התאמתו ומידת מימושו הם תהליך מתמשך ולא אירוע חד-פעמי. הכלי בנוי משבעה פרקים: (א) נתוני רקע, ובהם עיתוי בניית החוזה, סוג המסגרת, אפיוני האוכלוסייה, משאבים ושעות עבודה; (ב) הערכת צורכי המערכת דרך מושג \"המשימה המרכזית\"; (ג) תוכנית העבודה, כלומר חלוקת שעות בין העבודה המערכתית, הטיפולית והאבחונית; (ד) דפוסי העבודה: קשר סדיר עם המנהל, עבודה מניעתית לעומת תגובתית, \"אבני נגף\" ובקרה; (ה) תנאי עבודה ונוהלי הפניה; (ו) רקע תיאורטי מתוך תיאוריית המערכות הפתוחות (Vega Zagier Roberts): משימה מרכזית, אנטי-משימה, ושלוש רמות של משימה (נורמטיבית, אקזיסטנציאלית ופנומנלית); (ז) הצעה לפעילות להטמעת הכלי בצוות השפ\"ח. הרעיון המארגן הוא שהחוזה נגזר מהגדרה משותפת של המשימה המרכזית של בית הספר, ומבירור הפערים בין החזון המוצהר, התפיסה של בעלי התפקידים השונים והמציאות בפועל.<\/p>","ideas":"<ul>\n<li>החוזה עם המנהל הוא תהליך מתמשך ורציף ולא אירוע חד-פעמי. צריך לבנות אותו, לבדוק את התאמתו ולעקוב אחרי מימושו לאורך השנה.<\/li>\n<li>עיתוי: מומלץ להתחיל לבנות את החוזה בסיום שנת הלימודים, כשהמנהל, הפסיכולוג והצוות \"בשלים\" להעריך צרכים ומענים, ויש עוד גמישות בתכנון לוחות הזמנים. בתחילת השנה בוחנים את החוזה מחדש ומדייקים אותו.<\/li>\n<li>נתוני הרקע (סוג המסגרת, אוכלוסייה, גודל, משאבים, שעות הפסיכולוג) משפיעים על בחירת תוכנית העבודה, על סדרי העדיפויות ועל עומק ההשקעה בכל משימה.<\/li>\n<li>הערכת הצרכים נשענת על מושג \"המשימה המרכזית\" (Primary Task). השאלה המרכזית היא אם המשימה שהגדירו המנהל והצוות מקרבת אותם לחזון, והאם יש שונות בתוך הצוות או בקרב ההורים לגבי הגדרתה.<\/li>\n<li>הכלי מבקש לברר גם את ציפיות המנהל והצוות מהפסיכולוג וגם את ציפיות הפסיכולוג מעצמו, וכן את המשימות שהחוק מחייב (למשל ועדות סטטוטוריות).<\/li>\n<li>לב התהליך הוא חקירת הפערים בין החזון לפרקטיקה, ובין תפיסות המשימה של המנהל, של אנשי צוות אחרים ושל הפסיכולוג. מתוכה נבנית הגדרה משותפת של המשימה המרכזית ושל סדרי העדיפויות, שמאזנת בין החזון לאילוצי המערכת, המקום והזמן. לפי הכותבת זה תהליך שדורש גמישות ויצירתיות.<\/li>\n<li>תוכנית העבודה מתרגמת את ההחלטות להקצאת שעות בין התחום המערכתי, הטיפולי והאבחוני, לפריסה שנתית, לשותפים במערכת ולמנגנונים ארגוניים (צוות רב-מקצועי, פגישות קבועות עם המנהל, נהלים לאיתור, הפניה ומעקב).<\/li>\n<li>קשר קבוע וסדיר עם המנהל ועם בעלי התפקידים הוא בסיס לעבודה פסיכולוגית משמעותית. גודש האירועים בבית הספר מושך את כולם ל\"כיבוי שריפות\", ולכן החוזה צריך לכלול מחשבה מראש על שמירת עבודה מתוכננת ומניעתית.<\/li>\n<li>\"אנטי-משימה\": כשהמשימה המרכזית אינה ברורה, נפגעים גם הגבולות. אז פורצים תכנים לא מודעים אל תוך המשימה (הנחות היסוד של ביון), ומופיעים דפוסים הגנתיים, בדרך כלל לא יעילים.<\/li>\n<li>ההבחנה בין משימה נורמטיבית, אקזיסטנציאלית ופנומנלית מאפשרת לראות פערים בין מה שהארגון מצהיר, מה שאנשיו מאמינים שהם עושים ומה שקורה בפועל.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>חוזה עבודה עם המנהל<\/strong> – הסכמות על תחומי ההתערבות, סדרי העדיפויות, דפוסי העבודה ותנאיה. החוזה נבנה בשיחה ומתעדכן לאורך הזמן.<\/li>\n<li><strong>המשימה המרכזית (Primary Task)<\/strong> – מושג שהגדיר רייס (1963): המשימה שהארגון חייב לבצע כדי להתקיים. לכל ארגון יש ברגע נתון משימה מרכזית אחת, וממנה נגזרים בעלי התפקידים, הפעולות, המשאבים והיחסים עם הסביבה. היא יכולה להשתנות, במיוחד בשעת משבר. בארגונים שמטרתם לעזור לאנשים או לשנות אותם קשה במיוחד להגדיר אותה.<\/li>\n<li><strong>משימה לעומת חזון<\/strong> – \"המשימה היא הדרך להגשמת היעדים, החזון, הערכים.\"<\/li>\n<li><strong>אנטי-משימה (Anti Task)<\/strong> – מה שקורה כשהמשימה המרכזית אינה ברורה: הגבולות מיטשטשים, תכנים לא מודעים פורצים לתוך המשימה (הנחות היסוד של ביון בתוך קבוצת העבודה) ומופיעים דפוסים הגנתיים לא יעילים.<\/li>\n<li><strong>משימה מרכזית נורמטיבית (Normative Primary Task)<\/strong> – המשימה הפורמלית והמוצהרת של הארגון.<\/li>\n<li><strong>משימה מרכזית אקזיסטנציאלית (Existential Primary Task)<\/strong> – המשימה כפי שחברי הארגון תופסים אותה, כלומר הפרשנות האישית של כל אחד.<\/li>\n<li><strong>משימה מרכזית פנומנלית (Phenomenal Primary Task)<\/strong> – האופן שבו הארגון מתנהג בפועל, ובדרך כלל אינו מודע.<\/li>\n<li><strong>עבודה מניעתית לעומת תגובתית<\/strong> – המתח בין עבודה מתוכננת לבין \"סחף לתגובתיות\" ו\"כיבוי שריפות\" שנוצר מגודש אירועים שוטפים ובלתי צפויים.<\/li>\n<li><strong>אבני נגף<\/strong> – מכשולים צפויים בביצוע החוזה. הדוגמה שבמסמך היא תהליכי העברה והעברה נגדית.<\/li>\n<li><strong>אחראי מענה (case manager)<\/strong> – בעל תפקיד שממונה לנושאים שונים, כחלק מתהליכי הבקרה והמעקב.<\/li>\n<li><strong>גבולות התפקיד<\/strong> – הגבולות שהפסיכולוג מנהל לתפקידו. השאלה היא אם הם רחבים או צרים, נוקשים או חדירים.<\/li>\n<\/ul>","models":"<p><strong>מבנה הכלי \"תהליך בניית חוזה עבודה עם מנהל ביה\"ס\" (מלא, לפי סדר המסמך):<\/strong><\/p>\n<p><strong>הקדמה:<\/strong> הכלי נועד לשיחה בין פסיכולוג בית הספר למנהל, אחרי היכרות ראשונית עם בית הספר, וגם לקראת תחילת שנת לימודים חדשה. בניית החוזה, בדיקת התאמתו ומידת מימושו הן תהליך מתמשך ורציף.<\/p>\n<p><strong>א. נתוני רקע<\/strong>: אלה גורם חשוב בבחירת תוכנית העבודה, בקביעת סדרי העדיפויות, ובהחלטה כמה להשקיע וכמה להעמיק בכל משימה.<\/p>\n<ol>\n<li><strong>עיתוי בניית החוזה<\/strong>: מומלץ להתחיל בסיום שנת הלימודים, בזמן הסיכום של העבודה הפסיכולוגית באותה שנה. אז אפשר להעריך את צורכי הצוות והתלמידים ואת המענים שניתנו, ולתכנן את המענים הבאים. זה גם הזמן שבו יש גמישות יחסית בלוחות הזמנים: ימי עבודת הפסיכולוג, זמנים להשתלמויות מורים, מפגשים קבועים של הצוותים. בתחילת שנת הלימודים בוחנים את החוזה מחדש, מדייקים את ההחלטות ובונים תוכנית עבודה.<\/li>\n<li><strong>סוג המסגרת<\/strong>: גן, בית ספר, חטיבת ביניים, חינוך מיוחד.<\/li>\n<li><strong>אפיונים ייחודיים של אוכלוסיית התלמידים<\/strong>: אוכלוסייה מבוססת, אוכלוסיית עולים, יישוב קהילתי ועוד.<\/li>\n<li><strong>מספר<\/strong> התלמידים, הכיתות והמורים במערכת.<\/li>\n<li><strong>משאבים חינוכיים ומנגנונים ארגוניים<\/strong>: הרכב הצוות ומבנהו, בעלי תפקידים, גורמים טיפוליים, חלוקת סמכויות.<\/li>\n<li><strong>מספר שעות העבודה השבועיות של הפסיכולוג במסגרת.<\/strong><\/li>\n<\/ol>\n<p><strong>ב. הערכת צורכי המערכת החינוכית<\/strong>: מתייחסת לסוגי \"המשימה המרכזית\" שמופיעים במאמר \"תרומות מתיאורית המערכות הפתוחות\" של Vega Zagier Roberts (ראו סעיף ו').<\/p>\n<ol>\n<li><strong>הצרכים המרכזיים של אוכלוסיית בית הספר והחזון הבית-ספרי<\/strong>: מהו החזון, מי שותף לבנייתו, ואילו מטרות ויעדים עיקריים נגזרים ממנו לטווח הקצר ולטווח הארוך (המשימה המרכזית).<\/li>\n<li><strong>המשימה המרכזית<\/strong>: האם המשימה שהגדירו המנהל והצוות מקרבת אותם לחזון הבית-ספרי? האם יש שונות בין אנשי הצוות או בקרב ההורים בהגדרתה?<\/li>\n<li><strong>תפקיד הפסיכולוג<\/strong>: מה מצפים המנהל והצוות שהפסיכולוג יתרום להשגת המשימה המרכזית? מה סדר העדיפויות בין המשימות שמצופות ממנו? הדוגמאות במסמך: התמודדות עם בעיות התנהגות, עזרה בעבודה חינוכית מותאמת לאוכלוסייה הטרוגנית, העלאת רמת ההישגים של התלמידים, התמודדות עם ביקורת או התערבות יתר של הורים, תקופת חירום, מתחים בתוך צוות בית הספר.<\/li>\n<li><strong>מה מצפה הפסיכולוג עצמו לתרום?<\/strong><\/li>\n<li><strong>משימות שהחוק מחייב<\/strong> לכלול בעבודת הפסיכולוג באותה שנה, למשל עבודה שנגזרת מוועדות סטטוטוריות.<\/li>\n<li><strong>חקירת הפערים<\/strong>: בין החזון לפרקטיקה, ובין המשימה המרכזית כפי שהמנהל, אנשי צוות אחרים והפסיכולוג תופסים אותה. ניתוח המשמעות של הפערים והמסקנות המקצועיות והאופרטיביות שעולות מהם.<\/li>\n<li><strong>בניית הגדרה משותפת<\/strong> של המשימה המרכזית ושל סדרי העדיפויות, שמתייחסת גם לחזון הבית-ספרי וגם לאילוצי המערכת, המקום והזמן. זהו תהליך מורכב של מציאת האיזונים הנדרשים, ובדרך כלל הוא דורש גמישות ויצירתיות.<\/li>\n<\/ol>\n<p><strong>ג. תוכנית העבודה<\/strong><\/p>\n<ol>\n<li>לפי ההעדפות שנבחרו יחד עם המנהל, בהתאם לחזון בית הספר ולהגדרת המשימה המרכזית: כמה מתוך סך שעות העבודה יוקצו לכל תחום, מערכתי, טיפולי ואבחוני?<\/li>\n<li>צפי לפריסת העבודה הפסיכולוגית לאורך השנה.<\/li>\n<li>שותפים אפשריים במערכת למשימות השונות.<\/li>\n<li>בניית המנגנונים הארגוניים שנדרשים לביצוע התוכנית: ישיבות צוות רב-מקצועי, מפגשים קבועים עם המנהל, נהלים ברורים לאיתור, להפניה ולמעקב ועוד.<\/li>\n<\/ol>\n<p><strong>ד. דפוסי העבודה<\/strong><\/p>\n<ol>\n<li><strong>קשר קבוע וסדיר<\/strong> בין הפסיכולוג, המנהל ובעלי תפקידים נוספים במערכת. קובעים את התדירות ואת אופי הקשר עם המנהל ומועדים סדירים למפגשים.<\/li>\n<li><strong>מהם התנאים הנדרשים לעבודת הפסיכולוג?<\/strong> (פירוט בסעיף ה')<\/li>\n<li><strong>עבודה מניעתית לעומת תגובתית<\/strong>: גודש האירועים השוטפים והבלתי צפויים מושך לתגובתיות. מה אפשר לעשות כדי להימנע מסחף ל\"כיבוי שריפות\" ולקדם עבודה מתוכננת ומניעתית?<\/li>\n<li><strong>אבני נגף נוספות צפויות<\/strong> (למשל תהליכי העברה והעברה נגדית). איך אפשר להתמודד איתן?<\/li>\n<li><strong>תהליכי בקרה ומעקב למימוש התוכנית<\/strong>: למשל פגישות מעקב עם המנהל לפחות פעמיים בשנה, בנוסף למשוב בסוף השנה, ומינוי אחראי מענה (case manager) לנושאים שונים.<\/li>\n<\/ol>\n<p><strong>ה. תנאי עבודה<\/strong> (פירוט לסעיף ד' 2)<\/p>\n<ul>\n<li><strong>דרכי פנייה להתערבות פסיכולוגית<\/strong>: בזמן תכנון ההתערבות קובעים את המקום, את הזמנים הקבועים ואת שאר התנאים הדרושים, למשל תנאי החדר: גודל, שקט, מקום קבוע.<\/li>\n<li><strong>נוהלי הפניית ילד לאבחון ולוועדת השמה<\/strong>: המועדים המתאימים והאפשריים בשנה להפניה לאבחון, כולל המועד המאוחר ביותר. מילוי טופס הפניה בידי המחנכת הוא תנאי הכרחי להתחלת האבחון. בית הספר אחראי להגיש את הילד לוועדת השמה: הגשת הטפסים וקביעת תאריכי ההשמה.<\/li>\n<\/ul>\n<p><strong>ו. רקע תיאורטי<\/strong><\/p>\n<ul>\n<li>מקורות:<ol>\n<li>Vega Zagier Roberts (2000). The organization of work: Contributions from open systems theory. In: A. Obholzer &amp; V. Z. Roberts (Eds.), <em>The Unconscious at Work<\/em>. London.<\/li>\n<li>בטלר, רות (1987). \"התרומות האפשריות של הערכה פסיכו-ארגונית של מערכות חינוכיות לעבודת הפסיכולוג בבית הספר\". בתוך: אוריאל לסט (עורך), <em>עבודה פסיכולוגית בבית הספר<\/em>. בית הספר לחינוך, האוניברסיטה העברית.<\/li>\n<\/ol>\n<\/li>\n<li>המושגים מתוך המאמר של Roberts:<ul>\n<li><strong>משימה מרכזית (Primary Task)<\/strong>, לפי רייס (1963).<\/li>\n<li><strong>ההבדל בין משימה לחזון.<\/strong><\/li>\n<li><strong>אנטי-משימה (Anti Task).<\/strong><\/li>\n<li><strong>Normative Primary Task<\/strong>: המשימה הפורמלית והמוצהרת.<\/li>\n<li><strong>Existential Primary Task<\/strong>: המשימה כפי שחברי הארגון תופסים אותה.<\/li>\n<li><strong>Phenomenal Primary Task<\/strong>: מה שקורה בפועל, התנהגות שבדרך כלל אינה מודעת.<\/li>\n<\/ul>\n<\/li>\n<li>ניתוח המשימה במונחים האלה מאיר פערים בין מה שהארגון מצהיר, מה שאנשיו מאמינים שהם עושים ומה שקורה בפועל. הוא גם עוזר להבין את היחסים בין קבוצות ויחידים בארגון, ואת השפעתם על הפעילויות, על התפקידים ועל הארגון כשלם.<\/li>\n<\/ul>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>רמת המשימה<\/th>\n<th>מה היא מייצגת<\/th>\n<th>שאלה מנחה (נגזרת מהטקסט)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>נורמטיבית (Normative)<\/td>\n<td>המשימה הפורמלית והמוצהרת<\/td>\n<td>מה בית הספר אומר שהוא עושה?<\/td>\n<\/tr>\n<tr>\n<td>אקזיסטנציאלית (Existential)<\/td>\n<td>הפרשנות האישית של כל חבר בארגון<\/td>\n<td>מה כל אחד מאמין שהוא עושה?<\/td>\n<\/tr>\n<tr>\n<td>פנומנלית (Phenomenal)<\/td>\n<td>מה שקורה בפועל, בדרך כלל לא מודע<\/td>\n<td>מה ההתנהגות בפועל מלמדת על המשימה?<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>ז. הצעה לפעילות להטמעת הכלי בצוות השפ\"ח<\/strong><\/p>\n<ol>\n<li><strong>דיון במושגים<\/strong>: משימה מרכזית, משימה מול חזון, משימה ואנטי-משימה, משימה מרכזית נורמטיבית, אקזיסטנציאלית ופנומנלית. הדיון נעשה בקבוצות קטנות, עם דוגמאות מהעבודה במסגרות החינוך:\n        - איך תופסים את המשימה המרכזית המנהל, גורמים אחרים בצוות והממשקים: הורים, הפיקוח, מנח\"י וכו'?\n        - איך הפסיכולוג מנהל את גבולות התפקיד שלו? האם הגבולות רחבים או צרים, נוקשים או חדירים?\n        - איך כל אלה משפיעים על הגשמת החזון והיעדים של בית הספר?<\/li>\n<li><strong>שאלות על תהליך בניית חוזה העבודה עם המנהל:<\/strong>\n        - איך אני בוחר את תחומי ההתערבות ואת סדרי העדיפויות? מה משפיע על הבחירה שלי?\n        - מה יאפשר לי לשמור על החוזה? הבנות מקצועיות, מבנה ברור, גיבוי של מנהל/ת הצוות.\n        - עד כמה רצוי להבנות את מסגרת התפקיד, וכמה דרגות חופש להשאיר?\n        - מה עושים עם פערים בין צורכי המערכת כפי שהפסיכולוג תופס אותם לבין הצרכים שהמנהל והצוות מציגים?<\/li>\n<\/ol>","practice":"<ul>\n<li>אפשר להשתמש במבנה א'–ה' כמתווה (צ'קליסט) לשיחת החוזה עם המנהל: להגיע עם נתוני רקע, לשאול על החזון והמשימה המרכזית, לברר ציפיות, ולסכם הקצאת שעות, מנגנונים ומועדי מעקב.<\/li>\n<li>כדאי לתכנן את שיחת החוזה לסוף שנת הלימודים, כשעוד אפשר לשבץ לוחות זמנים, ולקבוע מראש שיחת עדכון בתחילת השנה.<\/li>\n<li>לשאול את המנהל במפורש מה הוא מצפה מהפסיכולוג ובאיזה סדר עדיפויות, וגם לנסח לעצמך מה אתה מצפה לתרום. הפער בין השניים הוא חומר עבודה, לא תקלה.<\/li>\n<li>לבדוק את שלוש רמות המשימה: מה בית הספר מצהיר (נורמטיבית), מה אנשי צוות שונים חושבים שהם עושים (אקזיסטנציאלית), ומה קורה בפועל (פנומנלית). פער גדול ביניהן יכול להסביר \"כיבוי שריפות\" ודפוסים הגנתיים.<\/li>\n<li>לעגן בחוזה מנגנונים ולא רק כוונות: מועד קבוע עם המנהל, צוות רב-מקצועי, נוהל הפניה (טופס הפניה של המחנכת כתנאי לאבחון, מועד אחרון להפניה), תנאי חדר, ומעקב לפחות פעמיים בשנה.<\/li>\n<li>להיערך מראש לסחף לתגובתיות: להחליט עם המנהל מה עושים כשמגיע \"משבר\" שוטף, כדי לשמור זמן לעבודה מניעתית ומתוכננת.<\/li>\n<li>להתייחס להעברה ולהעברה נגדית ביחסים עם המנהל ועם הצוות כאל \"אבן נגף\" צפויה, ולהביא אותן להדרכה.<\/li>\n<li>להביא לדיון בהדרכה ובצוות השפ\"ח את השאלה כמה להבנות את התפקיד וכמה דרגות חופש להשאיר, ואת השאלה אם גבולות התפקיד שלך רחבים או צרים, נוקשים או חדירים.<\/li>\n<\/ul>","questions":"<ol>\n<li>מהי המשימה המרכזית של בית הספר שלך לפי המנהל, לפי המורים ולפי ההורים? מה מלמדת אותך ההתנהגות בפועל (המשימה הפנומנלית) על המשימה?<\/li>\n<li>אילו ציפיות מהפסיכולוג עלו (או לא עלו) בשיחה עם המנהל, ואיך הן מתיישבות עם מה שאתה רואה כצורכי המערכת? מה תעשה עם הפער?<\/li>\n<li>איך היה מתחלק זמנך השבוע בפועל בין העבודה המערכתית, הטיפולית והאבחונית, ובין עבודה מתוכננת ל\"כיבוי שריפות\"? איך זה תואם את החוזה?<\/li>\n<li>אילו תהליכי העברה והעברה נגדית אתה מזהה ביחסים שלך עם המנהל, ואיך הם עלולים להשפיע על שמירת החוזה?<\/li>\n<li>מה יעזור לך לשמור על החוזה (הבנות, מבנה, גיבוי של מנהל/ת הצוות בשפ\"ח), ומה מאיים עליו?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"חשוב להדגיש כי בניית חוזה, בדיקת התאמתו ומידת מימושו הינם תהליך מתמשך, רציף ואינו מהווה אירוע חד פעמי.\" (עמ' 1)<\/li>\n<li>\"קשר קבוע וסדיר בין הפסיכולוג, מנהל ביה\"ס, ובעלי תפקידים נוספים במערכת הוא בסיס לעבודה פסיכולוגית משמעותית ויעילה.\" (עמ' 3)<\/li>\n<li>\"המשימה היא הדרך להגשמת היעדים, החזון, הערכים.\" (עמ' 4)<\/li>\n<li>\"ניתוח המשימה המרכזית על פי מונחים אלה יכול להאיר פערים בין מה שהארגון מצהיר, לבין מה שאנשים בו מאמינים שהם עושים ולמה שקורה בפועל.\" (עמ' 4)<\/li>\n<\/ul>"},"level":"שנה א' (כלי בסיס לכל פסיכולוג בית ספר; מתאים גם להעמקה בשנים ב'-ג')","stype":"כלי (מתווה לשיחה ולבניית חוזה, עם רקע תיאורטי והצעה להטמעה בצוות)","tldr":"המסמך הוא כלי מובנה, באורך חמישה עמודים, לשיחה בין פסיכולוג בית הספר לבין המנהל. השיחה מתקיימת אחרי היכרות ראשונית עם בית הספר, וגם לקראת כל שנת לימודים חדשה. הכותבת מדגישה שבניית החוזה, בדיקת התאמתו ומידת מימושו הם תהליך מתמשך ולא אירוע חד-פעמי.…","search":"המסמך הוא כלי מובנה, באורך חמישה עמודים, לשיחה בין פסיכולוג בית הספר לבין המנהל. השיחה מתקיימת אחרי היכרות ראשונית עם בית הספר, וגם לקראת כל שנת לימודים חדשה. הכותבת מדגישה שבניית החוזה, בדיקת התאמתו ומידת מימושו הם תהליך מתמשך ולא אירוע חד-פעמי. הכלי בנוי משבעה פרקים: (א) נתוני רקע, ובהם עיתוי בניית החוזה, סוג המסגרת, אפיוני האוכלוסייה, משאבים ושעות עבודה; (ב) הערכת צורכי המערכת דרך מושג \"המשימה המרכזית\"; (ג) תוכנית העבודה, כלומר חלוקת שעות בין העבודה המערכתית, הטיפולית והאבחונית; (ד) דפוסי העבודה: קשר סדיר עם המנהל, עבודה מניעתית לעומת תגובתית, \"אבני נגף\" ובקרה; (ה) תנאי עבודה ונוהלי הפניה; (ו) רקע תיאורטי מתוך תיאוריית המערכות הפתוחות (Vega Zagier Roberts): משימה מרכזית, אנטי-משימה, ושלוש רמות של משימה (נורמטיבית, אקזיסטנציאלית ופנומנלית); (ז) הצעה לפעילות להטמעת הכלי בצוות השפ\"ח. הרעיון המארגן הוא שהחוזה נגזר מהגדרה משותפת של המשימה המרכזית של בית הספר, ומבירור הפערים בין החזון המוצהר, התפיסה של בעלי התפקידים השונים והמציאות בפועל. החוזה עם המנהל הוא תהליך מתמשך ורציף ולא אירוע חד-פעמי. צריך לבנות אותו, לבדוק את התאמתו ולעקוב אחרי מימושו לאורך השנה. עיתוי: מומלץ להתחיל לבנות את החוזה בסיום שנת הלימודים, כשהמנהל, הפסיכולוג והצוות \"בשלים\" להעריך צרכים ומענים, ויש עוד גמישות בתכנון לוחות הזמנים. בתחילת השנה בוחנים את החוזה מחדש ומדייקים אותו. נתוני הרקע (סוג המסגרת, אוכלוסייה, גודל, משאבים, שעות הפסיכולוג) משפיעים על בחירת תוכנית העבודה, על סדרי העדיפויות ועל עומק ההשקעה בכל משימה. הערכת הצרכים נשענת על מושג \"המשימה המרכזית\" (Primary Task). השאלה המרכזית היא אם המשימה שהגדירו המנהל והצוות מקרבת אותם לחזון, והאם יש שונות בתוך הצוות או בקרב ההורים לגבי הגדרתה. הכלי מבקש לברר גם את ציפיות המנהל והצוות מהפסיכולוג וגם את ציפיות הפסיכולוג מעצמו, וכן את המשימות שהחוק מחייב (למשל ועדות סטטוטוריות). לב התהליך הוא חקירת הפערים בין החזון לפרקטיקה, ובין תפיסות המשימה של המנהל, של אנשי צוות אחרים ושל הפסיכולוג. מתוכה נבנית הגדרה משותפת של המשימה המרכזית ושל סדרי העדיפויות, שמאזנת בין החזון לאילוצי המערכת, המקום והזמן. לפי הכותבת זה תהליך שדורש גמישות ויצירתיות. תוכנית העבודה מתרגמת את ההחלטות להקצאת שעות בין התחום המערכתי, הטיפולי והאבחוני, לפריסה שנתית, לשותפים במערכת ולמנגנונים ארגוניים (צוות רב-מקצועי, פגישות קבועות עם המנהל, נהלים לאיתור, הפניה ומעקב). קשר קבוע וסדיר עם המנהל ועם בעלי התפקידים הוא בסיס לעבודה פסיכולוגית משמעותית. גודש האירועים בבית הספר מושך את כולם ל\"כיבוי שריפות\", ולכן החוזה צריך לכלול מחשבה מראש על שמירת עבודה מתוכננת ומניעתית. \"אנטי-משימה\": כשהמשימה המרכזית אינה ברורה, נפגעים גם הגבולות. אז פורצים תכנים לא מודעים אל תוך המשימה (הנחות היסוד של ביון), ומופיעים דפוסים הגנתיים, בדרך כלל לא יעילים. ההבחנה בין משימה נורמטיבית, אקזיסטנציאלית ופנומנלית מאפשרת לראות פערים בין מה שהארגון מצהיר, מה שאנשיו מאמינים שהם עושים ומה שקורה בפועל. חוזה עבודה עם המנהל – הסכמות על תחומי ההתערבות, סדרי העדיפויות, דפוסי העבודה ותנאיה. החוזה נבנה בשיחה ומתעדכן לאורך הזמן. המשימה המרכזית (Primary Task) – מושג שהגדיר רייס (1963): המשימה שהארגון חייב לבצע כדי להתקיים. לכל ארגון יש ברגע נתון משימה מרכזית אחת, וממנה נגזרים בעלי התפקידים, הפעולות, המשאבים והיחסים עם הסביבה. היא יכולה להשתנות, במיוחד בשעת משבר. בארגונים שמטרתם לעזור לאנשים או לשנות אותם קשה במיוחד להגדיר אותה. משימה לעומת חזון – \"המשימה היא הדרך להגשמת היעדים, החזון, הערכים.\" אנטי-משימה (Anti Task) – מה שקורה כשהמשימה המרכזית אינה ברורה: הגבולות מיטשטשים, תכנים לא מודעים פורצים לתוך המשימה (הנחות היסוד של ביון בתוך קבוצת העבודה) ומופיעים דפוסים הגנתיים לא יעילים. משימה מרכזית נורמטיבית (Normative Primary Task) – המשימה הפורמלית והמוצהרת של הארגון. משימה מרכזית אקזיסטנציאלית (Existential Primary Task) – המשימה כפי שחברי הארגון תופסים אותה, כלומר הפרשנות האישית של כל אחד. משימה מרכזית פנומנלית (Phenomenal Primary Task) – האופן שבו הארגון מתנהג בפועל, ובדרך כלל אינו מודע. עבודה מניעתית לעומת תגובתית – המתח בין עבודה מתוכננת לבין \"סחף לתגובתיות\" ו\"כיבוי שריפות\" שנוצר מגודש אירועים שוטפים ובלתי צפויים. אבני נגף – מכשולים צפויים בביצוע החוזה. הדוגמה שבמסמך היא תהליכי העברה והעברה נגדית. אחראי מענה (case manager) – בעל תפקיד שממונה לנושאים שונים, כחלק מתהליכי הבקרה והמעקב. גבולות התפקיד – הגבולות שהפסיכולוג מנהל לתפקידו. השאלה היא אם הם רחבים או צרים, נוקשים או חדירים."},{"id":"turi_unconscious","title":"האם יש לבית הספר לא מודע?","authors":"צילה תורי-מגדסי","year":"","cite":"תורי-מגדסי, צ'. האם יש לבית הספר לא מודע?","url":null,"kind":"article","desc":null,"file":{"orig":"האם יש לבית הספר לא מודע.doc","ext":"doc","pdf":"turi_unconscious.pdf","pages":10,"bytes":108787},"placements":[["s2","system"]],"extra":false,"ref":"תורי-מגדסי, הלא מודע","inFolder":true,"srcTitle":"האם יש לבית הספר לא מודע? עבודה בחשיבה פסיכואנליטית מערכתית בשירות הפסיכולוגי-חינוכי","secs":{"abstract":"<p>המאמר מציג את הגישה הפסיכואנליטית-מערכתית לעבודת הפסיכולוג החינוכי. הגישה משלבת את התיאוריה של קליין וביון (חרדות ראשוניות, הזדהות השלכתית, הכלה, \"קבוצת עבודה\" מול \"קבוצת הנחות בסיסיות\") עם תיאוריית המערכות הפתוחות של מילר ורייס (גבולות, ניהול גבולות, \"המשימה המרכזית\"). הטענה המרכזית היא שגם לבית הספר כארגון יש \"לא מודע\". סביב המשימה והמציאות הארגונית מתעוררות חרדות קולקטיביות, והמערכת מגייסת מולן מנגנוני הגנה (הכחשה, השלכה, פיצול, רציונליזציה). ההגנות מרגיעות זמנית, אבל פוגעות בתפקוד. כשהמשימה המרכזית עמומה ואין פונקציה מכילה, הארגון מתנהג \"כאילו\" משימתו היא להינצל מסכנה, והגבולות נעשים נוקשים ומשרתים את ההגנה. תפקיד הפסיכולוג הוא לעזור להנהלה לתפקד כ\"מיכל\" ולזהות פערים בין המשימה המוצהרת לזו שמקודמת בפועל. כמקורות מידע הוא נעזר בהעברה הנגדית שלו ובהתנגדות של המערכת. המאמר מדגים את הגישה בארבעה מקרים: התנגדות הורים לקליטת ילדים; מנהלת בבית ספר לחנ\"מ שהדפוס האישי שלה עיצב את תרבות בית הספר; תוכנית מעבר מהיסודי לחטיבת הביניים שלא מומשה; ו\"מלכודת דבש\" שבה קבלת פנים חמה הסתירה הדרה של הפסיכולוגית.<\/p>","ideas":"<ul>\n<li>הגישה המערכתית מניחה שכל התרחשות שקשורה בפרט יכולה לייצג את המערכת כולה ולעזור להבין אותה, בין שהיא קורית בחדר המנהל, במסדרונות או בחדר המורים. הבנת ההקשרים הרחבים היא הבסיס לתכנון התערבות שמטרתה שינוי בבית הספר לטובת הפרטים שבו.<\/li>\n<li>לפי ביון, כל קבוצה פועלת בו-זמנית בשני רבדים: \"קבוצת העבודה\" (הרובד המודע והמשימתי) ו\"קבוצת ההנחות הבסיסיות\" (הרובד הרגרסיבי, הלא מודע וההגנתי). ההנחה הבסיסית \"מפעפעת\" לתוך קבוצת העבודה, ולכן רק חלק מזמן הקבוצה מוקדש למשימה.<\/li>\n<li>לכל חבר בקבוצה יש נטייה (valency) לעורר סוג מסוים של השלכה, ולכן הוא מקבל תפקיד סימבולי שמשרת את הקבוצה, למשל \"שעיר לעזאזל\". מכאן שמה שאומר היחיד הוא פעמים רבות קולה של הקבוצה.<\/li>\n<li>בתי ספר נוטים לגייס מנגנוני הגנה לא יעילים מול חרדה (שטיינברג, 2014): הם מכחישים שינויים במציאות, מטילים את האחריות על \"הם\", מבדלים את כיתת החנ\"מ, מתפצלים למחנות סביב מנהל חדש ונמלטים לביורוקרטיה או לרציונליזציה.<\/li>\n<li>גם ארגונים, כמו תינוקות, זקוקים לפונקציה מכילה שמאפשרת לעבד רגשות קשים. ביון מייחס את התפקיד הזה לבעל הסמכות, ובבית ספר זו ההנהלה. הפסיכולוג עוזר להנהלה לתפקד כ\"מיכל\": הוא מזהה מצוקות וחרדות, קשוב לאופן שבו ההתרחשויות מהדהדות בו (העברה נגדית), מעבד אותן ואז משקף את תובנותיו.<\/li>\n<li>לפי תיאוריית המערכות הפתוחות, ארגון זקוק לגבול שמפריד אותו מהסביבה ובאותו זמן מאפשר מעבר. ליד הגבולות מתחוללים קונפליקטים על טריטוריה, מנהיגות וסמכות. הגבול בין בית הספר להורים עדין במיוחד, וניהולו דורש להבין את הצרכים, את התרבות ואת ההיסטוריה הארגונית של הצד השני.<\/li>\n<li>\"המשימה המרכזית\" (primary task) היא הדרך להגשים את החזון והערכים של הארגון. ממנה נגזרים התפקידים, המשאבים, היחסים עם הסביבה וסדרי העדיפויות. בבית ספר קשה להגדיר אותה כי יש בו משימות רבות וחשובות. כשההגדרה רחבה ועמומה ואין הגדרות ברורות של תפקידים וגבולות, נוצר מתח.<\/li>\n<li>כשאין פונקציה מכילה, הארגון מתנהג \"כאילו\" (as if) משימתו היא להינצל מסכנה. אז הגבולות משרתים הגנה ולא משימה. דוגמה לכך היא הרחקת כיתות החנ\"מ למבנה או לקומה נפרדים כדי לפצל בין \"בריאים\" ל\"פגומים\". הגדרה ברורה של המשימה, למשל שילוב וחינוך לשוויון, יכולה לטפל בפיצול הזה.<\/li>\n<li>סימן חשוב לפעולתם של כוחות לא מודעים הוא פער בין המשימה המרכזית הרשמית לבין המשימה שהארגון מקדם בפועל. את ההסברים לפער מחפשים בדינמיקה של המסגרת, בהיסטוריה שלה ובאישיות ובהיסטוריה הפרטית של הדמויות המרכזיות.<\/li>\n<li>כניסת פסיכולוג לארגון היא אקט חודרני ומעוררת התנגדות, גם כשהארגון ביקש עזרה. ההתנגדות עצמה היא מידע, כי מה שהמערכת מסרבת לשמוע הוא בדרך כלל החשוב ביותר להבנת קשייה. גם היעדר התנגדות מחייב בדיקה, כי ייתכן שזו \"מלכודת דבש\".<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>הזדהות השלכתית<\/strong> – תהליך שבו אדם מפקיד באחר רגשות בלתי נסבלים (אצל התינוק: התוקפנות שלו כלפי האם), כדי שהאחר ישמור אותם, יעבד אותם ויחזיר אותם בצורה ממותנת. בקבוצה, כל חבר יכול להפוך ל\"בית קיבול\" לחלקים שהאחרים הכחישו והשליכו.<\/li>\n<li><strong>הכלה / פונקציה מכילה (\"מיכל\")<\/strong> – היכולת לקלוט חרדות ותוקפנות בלי להתפרק ובלי להפסיק להיות טוב ומזין, ולהחזיר אותן מעובדות. בארגון הפונקציה הזו שייכת לבעל הסמכות (ההנהלה), והפסיכולוג מסייע לה למלא אותה.<\/li>\n<li><strong>קבוצת עבודה<\/strong> – הרובד המודע, המציאותי והמשימתי של הקבוצה, שמקדם את המטרה המוצהרת שלשמה היא קיימת.<\/li>\n<li><strong>קבוצת ההנחות הבסיסיות<\/strong> – הרובד הרגרסיבי, הלא מודע, הלא רציונלי וההגנתי. הוא מונע מפנטזיה ומחרדות, והקבוצה פועלת בו \"כאילו\" יש לה אויב או שהיא בסכנה.<\/li>\n<li><strong>נטייה (valency)<\/strong> – הנטייה של חבר בקבוצה לעורר סוג מסוים של השלכה, וכך לקבל תפקיד סימבולי שמשרת את הקבוצה (Rioch, 1970).<\/li>\n<li><strong>מערכת פתוחה<\/strong> – תפיסה של ארגון כאורגניזם חי שמקיים יחסי גומלין עם הסביבה דרך גבול, שצריך גם להפריד וגם לאפשר מעבר מווסת (לוין; מילר ורייס).<\/li>\n<li><strong>גבול / מרחב הגבול / ניהול גבולות<\/strong> – אזור המפגש בין הארגון לסביבתו ובין תתי-מערכות. ניהולו הוא תפקיד מרכזי של המנהל ותנאי לביצוע המשימה.<\/li>\n<li><strong>המשימה המרכזית (primary task)<\/strong> – הדרך להגשים את יעדי הארגון, חזונו וערכיו. ממנה נגזרים העשייה, התפקידים, המשאבים וסדרי העדיפויות. בזמן נתון יש לכל מערכת משימה מרכזית אחת (Rice, 1963; Roberts, 2000).<\/li>\n<li><strong>\"כאילו\" (as if)<\/strong> – מצב שבו ההגנה מפעילה את הארגון, והוא מתנהג כאילו משימתו המרכזית היא להינצל מסכנה.<\/li>\n<li><strong>התנגדות המערכת לפסיכולוג<\/strong> – בלימה, לעיתים לא מודעת, של היועץ, שנתפס כ\"גוף זר\": לא נותנים לו כניסה של ממש, לא חושפים בפניו מידע ודוחים את הפירושים שלו.<\/li>\n<li><strong>\"מלכודת דבש\"<\/strong> – קבלה חמה וחסרת התנגדות שמטרתה \"להרדים\" את הפסיכולוג ולהסתיר ממנו את מה שהארגון אינו רוצה שיראה.<\/li>\n<li><strong>מרחב הביניים של הפסיכולוג<\/strong> – המיקום של הפסיכולוג החינוכי בין פנים לחוץ. הוא אינו חלק אינטגרלי מצוות בית הספר וכפוף לגורמים חיצוניים (מינהל החינוך ושפ\"י), וזה מה שמאפשר לו לסייע בהבנת המערכת.<\/li>\n<\/ul>","models":"<h3>1. שני הרבדים שבהם פועלת קבוצה (ביון)<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>רובד<\/th>\n<th>אפיון<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>קבוצת העבודה<\/td>\n<td>מודע, מציאותי ומשימתי. מקדם את המטרה המוצהרת<\/td>\n<\/tr>\n<tr>\n<td>קבוצת ההנחות הבסיסיות<\/td>\n<td>רגרסיבי, לא מודע, לא רציונלי והגנתי. מונע מפנטזיה ומחרדות, אימפולסיבי וללא בוחן מציאות<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>ההנחה הבסיסית \"תפעפע, תעלה ותפרוץ\" לתוך קבוצת העבודה, בדומה לתכנים לא מודעים שפורצים לאגו.<\/p>\n<h3>2. מנגנוני הגנה לא יעילים בבתי ספר (שטיינברג, 2014)<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>ביטוי<\/th>\n<th>מנגנון<\/th>\n<th>דוגמה מהמאמר<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>התעלמות ממשמעות תופעות במציאות בית הספר<\/td>\n<td>הכחשה<\/td>\n<td>בית ספר ששאף למצוינות התעלם משינוי דמוגרפי בשכונה ומצרכים מורכבים יותר של התלמידים. דרכי העבודה לא התאימו, והתהליך הוביל למשבר<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>\"זה לא אנחנו, זה הם\"<\/td>\n<td>השלכה<\/td>\n<td>הצוות מתקשה לקחת אחריות לכשלים ומאשים את ההורים, את משרד החינוך או את הגופים העירוניים. גם בתוך הצוות מטילים אחריות לכשלים על אנשים מסוימים<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>בידול והרחקה<\/td>\n<td>השלכה (והזדהות השלכתית)<\/td>\n<td>הצוות מייחס לכיתת החנ\"מ את כל החולשות שלו. הכיתה מבודלת פיזית, חברתית ולימודית, והמחנכת שלה הופכת ל\"מודרת\" בפעילויות ובהפסקות<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>תנועה בין אידיאליזציה לדה-ואלואציה<\/td>\n<td>פיצול<\/td>\n<td>אחרי חילופי מנהל נוצרים מחנות של תומכים ומתנגדים שמשליכים עליו את כל הרע, אף שבמציאות יש בו \"גם מזה וגם מזה\"<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>התנהגות לא שקולה כדרך להימנע מקונפליקטים ומחרדות<\/td>\n<td>רציונליזציה (וגם התנהגות אובססיבית)<\/td>\n<td>הימנעות ישירה ממפגשים וישיבות טעונים, או פעילות-יתר בפרטים, בביורוקרטיה ובנהלים. כמו כן, הסברים אינטלקטואליים מפותלים לכישלונות במקום התמודדות עם הסיבות האמיתיות<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>(בטקסט המקורי פריטים 4 ו-5 התמזגו לפסקה אחת בגלל בעיית עימוד.)<\/p>\n<h3>3. תנאים לקיום פונקציה מכילה בארגון (Obholzer, 1994)<\/h3>\n<p>לפי Stokes (1994) ו-Lawrence (1985), ההנהלה צריכה לעבוד באופן מתמשך עם אנשי הארגון על הגדרת המשימה ועל תכנון והגדרה של תפקידים שמתאימים לה. לשם כך נדרשים:<\/p>\n<ol>\n<li>דיון מתמשך של הארגון במשימה המרכזית שלו.<\/li>\n<li>מבנה סמכות ברור, כולל זהות הסמכות שמחליטה בסוף הדיון על הגדרת המשימה המרכזית.<\/li>\n<li>תקשורת פתוחה בין חלקי הארגון, ופורום קבוע לדיון במתרחש בארגון ובקשר שלו עם מערכות אחרות.<\/li>\n<li>מפגשים קבועים וסדירים של הצוותים, שבהם חברי הצוות מדברים על רגשותיהם ועל הקשיים בעבודה.<\/li>\n<li>תמיכה גם במנהלים עצמם.<\/li>\n<\/ol>\n<p>כשהתנאים האלה אינם מתקיימים והמשימה עמומה, אין פונקציה מכילה ומופיעות תגובות הגנתיות.<\/p>\n<h3>4. המנהל כמיכל (נוטקביץ', 2002)<\/h3>\n<p>המנהל, כדמות סמכותית, מעורר חרדות, תוקפנות וקנאה, והצוות מתגונן מפניהן באמצעות הזדהות השלכתית שמופנית אליו. מנגד, כמו האם והתרפיסט, המנהל צריך להיות בעל יכולת הכלה ולדאוג לשלמות \"המעטפת\" של הארגון: הגדרות המשימה, הזמן, הטריטוריה ועוד.<\/p>\n<h3>5. גבולות בית הספר<\/h3>\n<ul>\n<li><strong>גבולות חיצוניים<\/strong>: משרד החינוך, מינהל החינוך ביישוב, הקהילה וההורים. בתי ספר שונים זה מזה בשאלה אם ההורים וועד ההורים נתפסים כחלק מהמערכת או כמי שנמצאים מחוצה לה.<\/li>\n<li><strong>גבולות פנימיים<\/strong>: בין תתי-המערכות, כמו ההנהלה, צוות המורים, הכיתות ומועצת התלמידים.<\/li>\n<li>הגבולות נקבעים לפי המטרות, היעדים והמשימות. יש ארגונים שגבולותיהם פתוחים וגמישים, ויש ארגונים שגבולותיהם מקשים על יחסי גומלין פוריים.<\/li>\n<\/ul>\n<h3>6. התערבות מערכתית בשלוש רמות (מתוך המקרה של בית הספר לחנ\"מ)<\/h3>\n<ol>\n<li><strong>רמה אישית עם המנהלת<\/strong>: עבודה על הכוחות הלא מודעים שהפעילו אותה, כלומר החרדה מאבדון ומקריסה, וההגנות של הכחשה ופיצול. אחת הפסיכולוגיות שימשה לה \"מיכל\": עזרה לה לעבד את החרדות והחזירה אותן אליה מעובדות.<\/li>\n<li><strong>התערבות בחדר המורים<\/strong> בנוגע ליחסים בצוות.<\/li>\n<li><strong>ייעוץ למנהלת בהגדרת המשימה המרכזית<\/strong> כך שתהיה מותאמת, משותפת ומוכרת לכל הצוות. התהליך הובל על ידי המנהלת, ובמהלכו בוררה במשותף האידיאולוגיה החינוכית והוגדרו מחדש המטרות ודרכי ההוראה. ההתערבות חיזקה את \"המיכל\" שהמנהלת סיפקה לצוות, ודרכו לתלמידים.<\/li>\n<\/ol>\n<h3>7. תפקידי הפסיכולוג לפי הגישה (מתוך הסיכום)<\/h3>\n<ul>\n<li>לסייע לצוות להבין את ההתרחשויות המשמעותיות בבית הספר ולזהות חרדות, מניעים, הגנות וכוחות מקדמים ובולמים, מודעים ולא מודעים.<\/li>\n<li>לעזור למערכת להגדיר את המשימה המרכזית שלה, את המבנים והתפקידים הנחוצים ואת מרחבי הגבול.<\/li>\n<li>לבחון את מידת ההתאמה בין האידיאולוגיה המוצהרת לבין התנהלות המערכת בפועל.<\/li>\n<li>לאבחן פערים בין ההגדרה הפורמלית של המשימה והתפקידים לבין מה שקורה בפועל, ולהתייחס אליהם כמקור מידע על גורמים לא מודעים.<\/li>\n<li>לסייע ביצירת פונקציות הכלה בכל רמות הארגון.<\/li>\n<li>לתכנן על בסיס כל אלה התערבויות לטובת המערכת ולטובת הפרטים שבה, תלמידים ואנשי צוות.<\/li>\n<\/ul>\n<h3>8. המקרים במאמר<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>מקרה<\/th>\n<th>מה קרה<\/th>\n<th>ההבנה הדינמית-מערכתית<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>קליטת שלושה ילדים ממשפחה פלסטינית (האב שיתף פעולה עם השלטון הישראלי)<\/td>\n<td>קבוצת הורים גדולה וחזקה התנגדה בתוקף. מינהל החינוך וההנהלה נסוגו, והילדים עברו לבית ספר אחר בשכונה שקלט אותם בהצלחה<\/td>\n<td>למקבלי ההחלטות היו נקודות עיוורון לגבי רגישויות ההורים ולגבי ההיסטוריה הארגונית. זמן קצר קודם לכן נכשל איחוד עם בית ספר יוקרתי, וזה פגע בדימוי העצמי של ההורים ובדימוי בית הספר. ההורים השליכו את תחושת הערך הנמוכה והחולשה על הילדים החדשים וזכו בתחושת כוח<\/td>\n<\/tr>\n<tr>\n<td>מנהלת בבית ספר לחינוך מיוחד כוללני פגעה במחנכת בשיחת משוב, ואמרה לה שהמורות והסייעות אינן מעוניינות לעבוד איתה<\/td>\n<td>בצוות התעורר משבר אמון. לא הייתה אמפתיה למחנכת, והופנה כעס כלפיה וכלפי הפסיכולוגיות<\/td>\n<td>בבית הספר פעל דפוס לא מודע: אין לגיטימציה לחולשה, וכולם נדרשים למצוינות ולהתמודדות עצמאית. הדפוס קשור בהיסטוריה של המנהלת, שעבורה חולשה פירושה אבדון. הוא בא לידי ביטוי גם בהכחשת המוגבלויות של התלמידים. המחנכת הדחויה נשאה את תפקיד \"מייצגת החולשה\"<\/td>\n<\/tr>\n<tr>\n<td>חטיבת ביניים ביקשה לאבחן שליש מתלמידיה<\/td>\n<td>הפסיכולוגית שאלה מה פירוש הדבר. נבנתה תוכנית מערכתית רחבה (מינהל, פיקוח ומנהלי בתי הספר היסודיים) לגישור על המעבר. התוכנית עוררה התפעלות, אבל רוב ההחלטות לא מומשו<\/td>\n<td>הייתה חרדה ששינוי יחשוף את \"קוצר ידם\" של כל השותפים, ושלא אפשר יהיה עוד להשליך את האשמה זה על זה: החטיבה האשימה את היסודי, והיסודי התגאה בכך ש\"הכילו\" את התלמידים המתקשים והאשים את החטיבה בנוקשות. נוספה תחרות ותיקה בין הפיקוח של משרד החינוך למינהל העירוני, ושיתוף פעולה התאפשר רק אחרי חילופי בעלי תפקידים<\/td>\n<\/tr>\n<tr>\n<td>\"מלכודת דבש\" בחטיבת ביניים<\/td>\n<td>פסיכולוגית התקבלה בחביבות, אבל במשך שנים עסקה בעיקר באבחון תלמידי הכיתות המקדמות. כששאלה ישירות, נאמר לה שהסוגיות המהותיות נדונות בין המנהלים הגברים בבית הכנסת<\/td>\n<td>היחס המקבל לכאורה, יחד עם אישיותה הנעימה ורצונה להרגיש מוערכת, הסתירו את ההגבלה של חופש הפעולה המקצועי שלה<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","practice":"<ul>\n<li>כשמתבקשים לבצע מספר חריג של אבחונים או התערבויות פרטניות (למשל \"לאבחן שליש מהשכבה\"), כדאי לשאול קודם מה פירוש הדבר ברמת המערכת, לפני שמחפשים מענה פרטני.<\/li>\n<li>כדאי לשים לב לאנשי צוות או לכיתות שנושאים בעקביות את \"החולשה\", את \"הבעיה\" או את \"האשמה\" (\"שעיר לעזאזל\", כיתת החנ\"מ המבודלת ומחנכתה). אפשר לשאול איזה חלק של הקבוצה כולה מופקד אצלם.<\/li>\n<li>כשמוצגת \"המשימה המרכזית\" של בית הספר, אפשר להשוות אותה למה שקורה בפועל (לאן הולכים המשאבים, מי מבודל, מה מתוגמל). פער בין השניים הוא רמז לתהליכים לא מודעים.<\/li>\n<li>תחושות כמו מבוכה, כעס, חוסר אונים או נעימות-יתר בבית הספר הן מידע על המערכת (העברה נגדית). כדאי להביא אותן להדרכה ולא רק לנסות להרגיע אותן.<\/li>\n<li>כשבית הספר לא מאפשר כניסה, לא חושף מידע או דוחה הסברים, כדאי להתייחס לכך כמידע ולא רק ככישלון אישי. מה שהמערכת מסרבת לשמוע הוא כנראה החשוב.<\/li>\n<li>כשקבלת הפנים \"נעימה מדי\", כדאי לבדוק במה בפועל מבקשים ממך לעסוק, ומאילו פורומים וסוגיות מרחיקים אותך.<\/li>\n<li>בעבודה עם המנהל אפשר לחזק את יכולתו להכיל: לעזור לו להגדיר משימה ותפקידים, ולעודד פורום קבוע לתקשורת, מפגשי צוות שבהם מדברים גם על רגשות ותמיכה במנהל עצמו.<\/li>\n<li>לפני שתומכים ביוזמה מול ההורים או הקהילה, כדאי לברר את הרגישויות של הצד השני ואת ההיסטוריה הארגונית האחרונה שלו (אכזבות וסערות קודמות).<\/li>\n<\/ul>","questions":"<ul>\n<li>מהי המשימה המרכזית המוצהרת של בית הספר שלי, ומהי המשימה שהוא נראה מקדם בפועל? מה הפער הזה מלמד?<\/li>\n<li>איזה אדם או איזו קבוצה בבית הספר נושאים עבור האחרים חלקים מוכחשים (חולשה, כישלון, תוקפנות)? איך זה משרת את המערכת?<\/li>\n<li>באילו דרכים בית הספר מתנגד לכניסתי, ובאילו דרכים מקבל אותי \"יותר מדי טוב\"? ממה ההתנגדות או קבלת הפנים עשויות להגן?<\/li>\n<li>איך מהדהדות בי ההתרחשויות בבית הספר (העברה נגדית)? מה אני עושה עם התחושות האלה לפני שאני משקף משהו להנהלה?<\/li>\n<li>האם ההנהלה מתפקדת כ\"מיכל\"? מה חסר מבין התנאים של Obholzer, ואיך אני יכול לעזור לבנות אותו מתוך מרחב הביניים שלי?<\/li>\n<\/ul>","quotes":"<ul>\n<li>\"לפיכך, לפי ביון (1992), מה שמבטא היחיד בדרך כלל הוא למעשה קול של הקבוצה.\"<\/li>\n<li>\"סימן מעיד חשוב לקיומם של גורמים מפריעים לא מודעים מתקבל כאשר הפסיכולוג מבחין בפער בין המשימה המרכזית הרשמית של הארגון, לבין המשימה המרכזית שנראה שהארגון מקדם בפועל\"<\/li>\n<li>\"כניסה של פסיכולוג לארגון היא אקט חודרני.\"<\/li>\n<li>\"...שכן הדברים אותם מסרבת המערכת לשמוע הם בדרך כלל אלו המשמעותיים ביותר להבנת קשייה.\"<\/li>\n<\/ul>"},"level":"שנה א' (מבוא תיאורטי בסיסי לחשיבה פסיכואנליטית-מערכתית). כדאי לחזור אליו בשנים ב'-ג'.","stype":"מאמר","tldr":"המאמר מציג את הגישה הפסיכואנליטית-מערכתית לעבודת הפסיכולוג החינוכי. הגישה משלבת את התיאוריה של קליין וביון (חרדות ראשוניות, הזדהות השלכתית, הכלה, \"קבוצת עבודה\" מול \"קבוצת הנחות בסיסיות\") עם תיאוריית המערכות הפתוחות של מילר ורייס (גבולות, ניהול…","search":"המאמר מציג את הגישה הפסיכואנליטית-מערכתית לעבודת הפסיכולוג החינוכי. הגישה משלבת את התיאוריה של קליין וביון (חרדות ראשוניות, הזדהות השלכתית, הכלה, \"קבוצת עבודה\" מול \"קבוצת הנחות בסיסיות\") עם תיאוריית המערכות הפתוחות של מילר ורייס (גבולות, ניהול גבולות, \"המשימה המרכזית\"). הטענה המרכזית היא שגם לבית הספר כארגון יש \"לא מודע\". סביב המשימה והמציאות הארגונית מתעוררות חרדות קולקטיביות, והמערכת מגייסת מולן מנגנוני הגנה (הכחשה, השלכה, פיצול, רציונליזציה). ההגנות מרגיעות זמנית, אבל פוגעות בתפקוד. כשהמשימה המרכזית עמומה ואין פונקציה מכילה, הארגון מתנהג \"כאילו\" משימתו היא להינצל מסכנה, והגבולות נעשים נוקשים ומשרתים את ההגנה. תפקיד הפסיכולוג הוא לעזור להנהלה לתפקד כ\"מיכל\" ולזהות פערים בין המשימה המוצהרת לזו שמקודמת בפועל. כמקורות מידע הוא נעזר בהעברה הנגדית שלו ובהתנגדות של המערכת. המאמר מדגים את הגישה בארבעה מקרים: התנגדות הורים לקליטת ילדים; מנהלת בבית ספר לחנ\"מ שהדפוס האישי שלה עיצב את תרבות בית הספר; תוכנית מעבר מהיסודי לחטיבת הביניים שלא מומשה; ו\"מלכודת דבש\" שבה קבלת פנים חמה הסתירה הדרה של הפסיכולוגית. הגישה המערכתית מניחה שכל התרחשות שקשורה בפרט יכולה לייצג את המערכת כולה ולעזור להבין אותה, בין שהיא קורית בחדר המנהל, במסדרונות או בחדר המורים. הבנת ההקשרים הרחבים היא הבסיס לתכנון התערבות שמטרתה שינוי בבית הספר לטובת הפרטים שבו. לפי ביון, כל קבוצה פועלת בו-זמנית בשני רבדים: \"קבוצת העבודה\" (הרובד המודע והמשימתי) ו\"קבוצת ההנחות הבסיסיות\" (הרובד הרגרסיבי, הלא מודע וההגנתי). ההנחה הבסיסית \"מפעפעת\" לתוך קבוצת העבודה, ולכן רק חלק מזמן הקבוצה מוקדש למשימה. לכל חבר בקבוצה יש נטייה (valency) לעורר סוג מסוים של השלכה, ולכן הוא מקבל תפקיד סימבולי שמשרת את הקבוצה, למשל \"שעיר לעזאזל\". מכאן שמה שאומר היחיד הוא פעמים רבות קולה של הקבוצה. בתי ספר נוטים לגייס מנגנוני הגנה לא יעילים מול חרדה (שטיינברג, 2014): הם מכחישים שינויים במציאות, מטילים את האחריות על \"הם\", מבדלים את כיתת החנ\"מ, מתפצלים למחנות סביב מנהל חדש ונמלטים לביורוקרטיה או לרציונליזציה. גם ארגונים, כמו תינוקות, זקוקים לפונקציה מכילה שמאפשרת לעבד רגשות קשים. ביון מייחס את התפקיד הזה לבעל הסמכות, ובבית ספר זו ההנהלה. הפסיכולוג עוזר להנהלה לתפקד כ\"מיכל\": הוא מזהה מצוקות וחרדות, קשוב לאופן שבו ההתרחשויות מהדהדות בו (העברה נגדית), מעבד אותן ואז משקף את תובנותיו. לפי תיאוריית המערכות הפתוחות, ארגון זקוק לגבול שמפריד אותו מהסביבה ובאותו זמן מאפשר מעבר. ליד הגבולות מתחוללים קונפליקטים על טריטוריה, מנהיגות וסמכות. הגבול בין בית הספר להורים עדין במיוחד, וניהולו דורש להבין את הצרכים, את התרבות ואת ההיסטוריה הארגונית של הצד השני. \"המשימה המרכזית\" (primary task) היא הדרך להגשים את החזון והערכים של הארגון. ממנה נגזרים התפקידים, המשאבים, היחסים עם הסביבה וסדרי העדיפויות. בבית ספר קשה להגדיר אותה כי יש בו משימות רבות וחשובות. כשההגדרה רחבה ועמומה ואין הגדרות ברורות של תפקידים וגבולות, נוצר מתח. כשאין פונקציה מכילה, הארגון מתנהג \"כאילו\" (as if) משימתו היא להינצל מסכנה. אז הגבולות משרתים הגנה ולא משימה. דוגמה לכך היא הרחקת כיתות החנ\"מ למבנה או לקומה נפרדים כדי לפצל בין \"בריאים\" ל\"פגומים\". הגדרה ברורה של המשימה, למשל שילוב וחינוך לשוויון, יכולה לטפל בפיצול הזה. סימן חשוב לפעולתם של כוחות לא מודעים הוא פער בין המשימה המרכזית הרשמית לבין המשימה שהארגון מקדם בפועל. את ההסברים לפער מחפשים בדינמיקה של המסגרת, בהיסטוריה שלה ובאישיות ובהיסטוריה הפרטית של הדמויות המרכזיות. כניסת פסיכולוג לארגון היא אקט חודרני ומעוררת התנגדות, גם כשהארגון ביקש עזרה. ההתנגדות עצמה היא מידע, כי מה שהמערכת מסרבת לשמוע הוא בדרך כלל החשוב ביותר להבנת קשייה. גם היעדר התנגדות מחייב בדיקה, כי ייתכן שזו \"מלכודת דבש\". הזדהות השלכתית – תהליך שבו אדם מפקיד באחר רגשות בלתי נסבלים (אצל התינוק: התוקפנות שלו כלפי האם), כדי שהאחר ישמור אותם, יעבד אותם ויחזיר אותם בצורה ממותנת. בקבוצה, כל חבר יכול להפוך ל\"בית קיבול\" לחלקים שהאחרים הכחישו והשליכו. הכלה / פונקציה מכילה (\"מיכל\") – היכולת לקלוט חרדות ותוקפנות בלי להתפרק ובלי להפסיק להיות טוב ומזין, ולהחזיר אותן מעובדות. בארגון הפונקציה הזו שייכת לבעל הסמכות (ההנהלה), והפסיכולוג מסייע לה למלא אותה. קבוצת עבודה – הרובד המודע, המציאותי והמשימתי של הקבוצה, שמקדם את המטרה המוצהרת שלשמה היא קיימת. קבוצת ההנחות הבסיסיות – הרובד הרגרסיבי, הלא מודע, הלא רציונלי וההגנתי. הוא מונע מפנטזיה ומחרדות, והקבוצה פועלת בו \"כאילו\" יש לה אויב או שהיא בסכנה. נטייה (valency) – הנטייה של חבר בקבוצה לעורר סוג מסוים של השלכה, וכך לקבל תפקיד סימבולי שמשרת את הקבוצה (Rioch, 1970). מערכת פתוחה – תפיסה של ארגון כאורגניזם חי שמקיים יחסי גומלין עם הסביבה דרך גבול, שצריך גם להפריד וגם לאפשר מעבר מווסת (לוין; מילר ורייס). גבול / מרחב הגבול / ניהול גבולות – אזור המפגש בין הארגון לסביבתו ובין תתי-מערכות. ניהולו הוא תפקיד מרכזי של המנהל ותנאי לביצוע המשימה. המשימה המרכזית (primary task) – הדרך להגשים את יעדי הארגון, חזונו וערכיו. ממנה נגזרים העשייה, התפקידים, המשאבים וסדרי העדיפויות. בזמן נתון יש לכל מערכת משימה מרכזית אחת (Rice, 1963; Roberts, 2000). \"כאילו\" (as if) – מצב שבו ההגנה מפעילה את הארגון, והוא מתנהג כאילו משימתו המרכזית היא להינצל מסכנה. התנגדות המערכת לפסיכולוג – בלימה, לעיתים לא מודעת, של היועץ, שנתפס כ\"גוף זר\": לא נותנים לו כניסה של ממש, לא חושפים בפניו מידע ודוחים את הפירושים שלו. \"מלכודת דבש\" – קבלה חמה וחסרת התנגדות שמטרתה \"להרדים\" את הפסיכולוג ולהסתיר ממנו את מה שהארגון אינו רוצה שיראה. מרחב הביניים של הפסיכולוג – המיקום של הפסיכולוג החינוכי בין פנים לחוץ. הוא אינו חלק אינטגרלי מצוות בית הספר וכפוף לגורמים חיצוניים (מינהל החינוך ושפ\"י), וזה מה שמאפשר לו לסייע בהבנת המערכת."},{"id":"forest2014","title":"לראות את היער: עבודה מערכתית בשירות הפסיכולוגי","authors":"שפ\"ח ירושלים, עלון \"קשר משפחתי\" 9","year":"2014","cite":"שפ\"ח ירושלים (2014). לראות את היער... עבודה מערכתית בשירות הפסיכולוגי. קשר משפחתי, גיליון 9 (עורכת: אסנת ריינמן).","url":null,"kind":"article","desc":null,"file":{"orig":"לראות את היער שפח ירושלים כולל האישיות הבית ספרית.pdf","ext":"pdf","pdf":"forest2014.pdf","pages":71,"bytes":1515258},"placements":[["s2","system"]],"extra":true,"ref":"לראות את היער 2014","inFolder":true,"srcTitle":"לראות את היער... עבודה מערכתית בשירות הפסיכולוגי","secs":{"toc":"<p>(לפי עמודי העלון המודפסים)<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>עמ'<\/th>\n<th>פרק / מאמר<\/th>\n<th>כותב/ת<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>4<\/td>\n<td>פתיח: דבר מנהלת השפ\"ח<\/td>\n<td>ענת שראל<\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>מבוא: המרכז לעבודה מערכתית, התערבות במשבר וליווי צמיחה<\/td>\n<td>ענת קדר<\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td><strong>האישיות הבית ספרית<\/strong><\/td>\n<td>יעל שטיינברג<\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>אני יודע? אתה יודע? אנחנו יודעים... התנועה בין רבדים גלויים וסמויים<\/td>\n<td>מרים פישר-כספי וגרסיאלה ונגרובר-נוימן<\/td>\n<\/tr>\n<tr>\n<td>18<\/td>\n<td>כמה מחשבות על מנהלים חדשים והשתלת איברים<\/td>\n<td>יעל שטיינברג<\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td>קונסולטציה זוגית למנהל בית-ספר (בהנחיית המרכז המערכתי)<\/td>\n<td>ליליאן פטריק וורד ורטהיימר<\/td>\n<\/tr>\n<tr>\n<td>23<\/td>\n<td>שינוי נרטיב: ממשבר ללידה מחדש של בית-הספר<\/td>\n<td>טל גרין אפל<\/td>\n<\/tr>\n<tr>\n<td>25<\/td>\n<td>להפוך מצוקות חיים לאוצרות: מסעו של בי\"ס מנרטיב של חוסר אונים לסיפור של תקווה<\/td>\n<td>נורית סהר<\/td>\n<\/tr>\n<tr>\n<td>28<\/td>\n<td>מקבוצת הנחה בסיסית לקבוצת עבודה: התמודדות מערכתית עם שינוי<\/td>\n<td>רבקה שפיגלמן<\/td>\n<\/tr>\n<tr>\n<td>32<\/td>\n<td>התערבויות הקשורות במצבי צמיחה בריאים<\/td>\n<td>ענת קדר<\/td>\n<\/tr>\n<tr>\n<td>34<\/td>\n<td>הפסיכולוג החינוכי והקבוצה הגדולה<\/td>\n<td>דוד סימצקין<\/td>\n<\/tr>\n<tr>\n<td>36<\/td>\n<td>מתבגרים בארץ הפלאות: התערבויות מערכתיות בגילאי חטיבת הביניים<\/td>\n<td>שרון קייזר<\/td>\n<\/tr>\n<tr>\n<td>39<\/td>\n<td>הכיתה המקדמת כפריזמה המאפשרת אבחון המערכת הבית ספרית<\/td>\n<td>טל גרין אפל<\/td>\n<\/tr>\n<tr>\n<td>42<\/td>\n<td>על הקשר שבין ערכים, התנהגות הורית ועבודה מערכתית<\/td>\n<td>שרון קייזר-הלר<\/td>\n<\/tr>\n<tr>\n<td>45<\/td>\n<td>תרגום השפה הפסיכולוגית לפרקטיקה החינוכית, או איך נשארים \"קרובים לחוויה\"<\/td>\n<td>יערה מרחבי<\/td>\n<\/tr>\n<tr>\n<td>54<\/td>\n<td>מאבק להבעה וביטוי קול: מארג של סיפורים (בית-ספר \"אילנות\")<\/td>\n<td>ד\"ר נורית פלזנטל-ברגר<\/td>\n<\/tr>\n<tr>\n<td>59<\/td>\n<td>תכנית בית-ספר בקהילה: מחשבות ושאלות על תפקידו של השפ\"ח<\/td>\n<td>ענת קדר וצילה תורי-מגדסי<\/td>\n<\/tr>\n<tr>\n<td>62<\/td>\n<td>מנהיגות בית-ספר בקהילה: סקירת ספרות (Glanz; Chaltain)<\/td>\n<td>אבי גירלי<\/td>\n<\/tr>\n<tr>\n<td>66<\/td>\n<td>ביבליוגרפיה כללית בנושא עבודה פסיכולוגית מערכתית<\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td>67<\/td>\n<td>מה מתחדש בדיאגנוסטיקה?<\/td>\n<td>סמדר ספיר-יוגב<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr />","abstract":"<p>הגיליון מוקדש כולו לעבודה מערכתית של הפסיכולוג החינוכי בבית-הספר. שמו, \"לראות את היער...\", מבטא את הקריאה להסתכל מעבר ל\"עצים\" הבודדים (התלמיד הבעייתי, ההורה הנוקשה, המנהל השתלטן) אל המערכת כולה. הוא נפתח בתיאור \"המרכז לעבודה מערכתית\" שהוקם בשפ\"ח ירושלים ב-2008. למרכז שני קווי פעולה: <strong>התערבות במשברים מערכתיים<\/strong> ו<strong>ליווי תהליכי צמיחה בריאים<\/strong>. למשברים מוצגות שלוש קטגוריות סיבות: ניהול, שינויים בסביבה, ושינויים פנימיים או התנגדות לשינוי.<\/p>\n<p>המאמר המרכזי, <strong>\"האישיות הבית ספרית\"<\/strong> של יעל שטיינברג, מציע להשתמש במודל הסטרוקטורלי של פרויד כמבנה מארגן להערכת בית-ספר. <strong>הסופר-אגו<\/strong> הוא הערכים, החזון והאיסורים. <strong>האגו<\/strong> הוא המשימות, המבנים, המשאבים, הדימוי העצמי והגמישות. <strong>ההגנות<\/strong> הן הכחשה, השלכה, פיצול וכדומה. <strong>האיד<\/strong> הוא ההיסטוריה, הדחפים והתהליכים הלא מודעים ברמת הפרט והקבוצה. לפי המאמר, לעיתים קרובות הבעיה המוצגת היא <strong>סימפטום מערכתי<\/strong>.<\/p>\n<p>סביב המסגרת הזו מובאים כלים ומושגים פסיכודינמיים-ארגוניים: הלא-מודע הארגוני והחברתי (האלטון, הופר/וינברג), טבלת שאלות מנחות לגלוי ולסמוי (רוזנבליט), הנחות היסוד של ביון, העמדה הסכיזו-פרנואידית מול הדיכאונית (קליין) והקבוצה הגדולה (וינברג). לצידם מובאים כלים נרטיביים: סיפור דומיננטי מול אלטרנטיבי, unique outcomes, re-membering ועדים.<\/p>\n<p>בגיליון כמה תיאורי מקרה: קונסולטציה זוגית למנהל חדש בבית-ספר אלים, שינוי נרטיב בבית-ספר מצטמק, ליווי סגירה של בית-ספר, מעבר מחטיבה לתיכון שהוביל למשבר כיתתי, קבוצות מורות בחינוך החרדי, ובית-ספר לילדים עם נכויות קשות. לצידם מאמרים על חילופי מנהלים כ\"השתלת איבר\", על הכיתה המקדמת כ\"פריזמה\" לאבחון המערכת, על פערי ערכים בין הורים לבית-הספר (שוורץ), ועל תכנית \"בית-ספר בקהילה\" שבה הפסיכולוג מתרחב ל\"פסיכולוג קהילתי\". הגיליון נחתם בביבליוגרפיה מערכתית ובעדכוני דיאגנוסטיקה (CHC, תקן ארצי לחוות דעת והתאמות בבחינות).<\/p>\n<hr />","ideas":"<ol>\n<li><strong>לבית-ספר יש \"אישיות\"<\/strong>, כולל מצוקות, טראומות, סימפטומים והגנות. לכן אפשר להבין אותו ולהתערב בו בדומה לפרט, וגם הוא יכול להיתרם מהתערבות פסיכולוגית.<\/li>\n<li><strong>הבעיה המוצגת היא לעיתים קרובות סימפטום מערכתי<\/strong> ולא \"הבעיה עצמה\". כשמוציאים את \"הילד הבעייתי\", מישהו אחר תופס את מקומו. האתגר המרכזי של הפסיכולוג הוא לזהות אירועים כסימפטומים ולהבין אותם לאור האישיות הבית ספרית.<\/li>\n<li><strong>המודל הסטרוקטורלי של פרויד מתאים כמבנה מארגן להערכה<\/strong>: ערכים (סופר-אגו), משימות ומבנים (אגו), הגנות, והיסטוריה ודחפים לא מודעים (איד). <strong>תהליך ההערכה כשלעצמו<\/strong> מחזק את בית-הספר, במיוחד כשהוא נעשה יחד עם המנהל והצוות.<\/li>\n<li><strong>פגיעה ביחסים מובילה לפגיעה במשימה<\/strong>. משברים פוגעים במערכות היחסים בין קבוצות ובתוכן, ובמבנים הארגוניים: צוות ניהול, צוות בין-מקצועי, הגדרות תפקיד וחלוקת סמכויות.<\/li>\n<li><strong>טיפול במשבר מתאפשר בעיקר בשני מצבים<\/strong>: כשהמנהל מוכן לבדוק את עצמו, או כשהמשבר כבר \"מתפוצץ\" החוצה. מנהל מודע שהגנותיו אינן נוקשות יכול להתחיל בבדיקה ושינוי עוד לפני שנוצר משבר.<\/li>\n<li><strong>צמיחה בריאה היא \"שינוי ממעלה שלישית\"<\/strong>. בית-הספר חושב מחדש על מוסכמות, בוחן את הפער בין מטרות מוצהרות למטרות בפועל, פונה לכוחות הפנימיים שלו ומפחית את התלות במערכת החיצונית (משרד החינוך).<\/li>\n<li><strong>המשימה המרכזית קיימת בשלוש רמות<\/strong>: ההצהרתית, הלא-מודעת וזו שעובדים עליה בפועל (וגה-זאגייר). הפער בין המשימה שמשרד החינוך מצהיר עליה (השכלה רחבה, ערכים, חשיבה) לבין מה שנעשה בפועל (מיומנויות יסוד ומבחנים) מטשטש את ערכי בתי הספר ומטרותיהם.<\/li>\n<li><strong>גם הפסיכולוג הוא חלק מהשדה<\/strong>. הוא נושא חרדות, הגנות וציפיות, שלו ושל השפ\"ח, ועלול \"להישאב\" לדפוסי המערכת (קואליציה רגשית, פיצול). התייעצות מערכתית חיצונית עוזרת לו להשיב את האמפתיה ולבנות תמונה אינטגרטיבית.<\/li>\n<li><strong>בקבוצה בחרדה, המטרה היא מעבר מ\"קבוצת הנחה בסיסית\" ל\"קבוצת עבודה\"<\/strong> (ביון). מה שעוזר הוא יצירת פורום מכיל שמדבר על החרדה, מגע אישי (תפקודי זולת-עצמי) ודיאלוג מכבד שבו המבוגר אינו מוותר על סמכותו.<\/li>\n<li><strong>בקבוצה גדולה (כיתה, חדר מורים, בית-ספר) כל קול מייצג תת-קבוצה<\/strong>. ויכוח \"אישי\" בחדר המורים הוא לעיתים ביטוי של קולות רחבים יותר. ילד בודד נעזר בחיפוש מכנה משותף עם ילדים דומים לו ולא בכפיית קשר.<\/li>\n<li><strong>חילוף מנהל הוא כמו \"השתלת איבר חיוני\"<\/strong>. הוא כרוך באבל, בחרדה, בדחייה, בצורך בהתאמה ובליווי מבחוץ, ובהתעוררות של קונפליקטים רדומים. מנהלים \"מוצנחים\" נוטים יותר למהלכים כוחניים.<\/li>\n<li><strong>יחס בית-הספר לכיתה המקדמת משקף את ערכיו ואת יכולת ההכלה שלו<\/strong>. מיקום הכיתה, מעמד המחנכת וקיום ישיבות בין-מקצועיות הם מדדים אבחוניים למערכת כולה.<\/li>\n<li><strong>הבנת הקשר מורה–תלמיד אינה עוברת בהנחיות \"עשה ואל תעשה\"<\/strong> ולא ב\"ערפל מושגי\". היא עוברת בעבודה תהליכית שבה הפסיכולוג משמש זולת-עצמי למורה, בדומה למודל של אורנשטיין לעבודה עם הורים.<\/li>\n<li><strong>קונפליקטים בין הורים לבית-הספר נובעים לא פעם מפערי ערכים לא מודעים<\/strong> (שוורץ). הפתרון אינו \"איחוד ערכים\" אלא שיח פתוח על ערכים.<\/li>\n<li><strong>נרטיב בית ספרי ואישי אפשר לשנות<\/strong>. מוצאים נקודות אור ו-unique outcomes, מגייסים עדים ומחברים את נוף הפעולה לנוף הזהות. עם זאת, \"לא די בפתיחת דלת להשמעת נרטיב אישי\": צריך השפעה רחבה במערכת.<\/li>\n<li><strong>כשבית-הספר נפתח לקהילה, תפקיד הפסיכולוג מתרחב<\/strong> מ\"פסיכולוג בית-ספר\" ל\"פסיכולוג קהילתי\" העוסק בגבולות, בשותפויות ובחרדות הצוות מפני שינוי. התפקיד המורחב מעורר גם דילמות של חיסיון מול הממשקים.<\/li>\n<\/ol>\n<hr />","concepts":"<ol>\n<li><strong>האישיות הבית ספרית<\/strong>: ה\"רוח\" והאווירה של בית-ספר, במונחים פסיכולוגיים. היא נבחנת דרך תפקוד המערכת, החלקים הלא מודעים, הדימוי העצמי ותחושת הקוהסיביות.<\/li>\n<li><strong>סימפטום מערכתי<\/strong>: קושי שנראה פרטני (הורה, תלמיד, כיתה, מורה, מנהל) ומבטא \"קול במערכת\", כלומר קושי של המערכת כולה.<\/li>\n<li><strong>הסופר-אגו הבית ספרי<\/strong>: הערכים, האידאולוגיה, החזון, החוקים והאיסורים. הוא יכול להיות מגובש ונוכח, עמום, מנופח או נוקשה.<\/li>\n<li><strong>האגו הבית ספרי<\/strong>: החלק הפועל במציאות. הוא כולל את המשימות המרכזיות, המבנים הארגוניים, המשאבים, הדימוי העצמי, הגמישות, היצירתיות והאותנטיות.<\/li>\n<li><strong>האיד הבית ספרי<\/strong>: החלקים הלא מודעים של הפרט, הקבוצה והקהילה. \"מה שנמסר בתורשה\" הוא ההיסטוריה והדפוסים של בית-הספר. כאן נמצאים גם הדחפים (מיניות ותוקפנות).<\/li>\n<li><strong>הגנות מערכתיות<\/strong>: מנגנונים לא מודעים שתפקידם למנוע הצפה ופירוק ולשמר תחושת ערך: הכחשה, השלכה, השלכה הזדהותית, פיצול, רציונליזציה, הימנעות, אובססיביות, אידאליזציה ודה-ולואציה.<\/li>\n<li><strong>לא-מודע ארגוני<\/strong> (האלטון; קטס דה-וריס): גם לארגון יש \"מבנים נפשיים\", מנגנוני הגנה, השלכות והזדהויות.<\/li>\n<li><strong>לא-מודע חברתי<\/strong> (הופר, אצל וינברג): הסדרים חברתיים, תרבותיים ותקשורתיים שאנשים אינם מודעים להם. הוא משותף ו\"מובנה-יחדיו\" (co-constructed), וכולל חרדות, הגנות, פנטזיות, מיתוסים, זיכרונות, טראומות ו\"רגעי תהילה\".<\/li>\n<li><strong>קבוצת עבודה מול קבוצת הנחה בסיסית<\/strong> (ביון): קבוצה הפועלת למשימה (מקבילה לאגו) לעומת קבוצה שבחרדה נסוגה לתפקוד הגנתי אנטי-משימתי.<\/li>\n<li><strong>הנחות היסוד<\/strong> (ביון): <strong>תלות<\/strong> (תקווה במנהיג כל-יכול), <strong>מאבק-בריחה<\/strong> (fight-flight: מאבק פנימי או נסיגה) ו<strong>זיווג<\/strong> (pairing: תקווה שאיחוד של שניים יביא ישועה, תוך הימנעות מההווה).<\/li>\n<li><strong>עמדה סכיזו-פרנואידית מול עמדה דיכאונית<\/strong> (קליין): מטרת ההתערבות היא מעבר מפיצול, מחנות והאשמות לאינטגרציה וחיבור.<\/li>\n<li><strong>קואליציות חוצות גבולות<\/strong>: בריתות של המנהל עם ממשקים חיצוניים (כמו הפיקוח) במקום עם הצוות שלו. הן פוגעות בנאמנויות ובניהול הגבולות (וגה-זאגייר).<\/li>\n<li><strong>המשימה המרכזית<\/strong> (וגה-זאגייר): המשימה שלשמה קיים הארגון. היא נבחנת בשלוש רמות: הצהרתית, לא-מודעת ובפועל. בשבילה נדרשים מבנים ומנגנונים ברורים עם משימות ידועות.<\/li>\n<li><strong>שינוי ממעלה שלישית<\/strong>: שינוי שבו בית-הספר מגדיר מחדש את מטרותיו מתוך הכוחות שלו ומפחית את ההישענות על המערכת החיצונית.<\/li>\n<li><strong>קבוצה גדולה<\/strong> (וינברג): קבוצה שאי אפשר להקיף את כל משתתפיה במבט אחד. היא מעוררת ניכור, חרדה ו\"שקיפות\", ומתמודדים בה דרך תתי-קבוצות ו\"מערכת השתייכות מורכבת\".<\/li>\n<li><strong>זולת-עצמי (selfobject)<\/strong> (קוהוט): דמות שממלאת עבור הפרט תפקודים נפשיים שאינו יכול למלא בעצמו: שיקוף (mirroring) וקוטב לאידאליזציה. המחנכת, המבוגרים בבית-הספר ואפילו הקבוצה יכולים למלא תפקיד כזה.<\/li>\n<li><strong>מיכל / מיכל מורחב<\/strong> (ויניקוט): המחנכת משמשת מיכל לילדים, ובית-ספר מכיל הוא \"מיכל מורחב\" למיכל שלה. בית-ספר מדיר פועל נגד המיכל.<\/li>\n<li><strong>סיפור דומיננטי / סיפור אלטרנטיבי / unique outcomes<\/strong> (ווייט): הסיפור המקובל שנתפס כ\"מציאות\", לעומת סיפור מועדף שנבנה מאירועים יוצאי דופן.<\/li>\n<li><strong>re-membering ועדים<\/strong>: זכירה מחדש של אנשים ואירועים מועדפים כדי להתחבר לשייכות ולמשמעות. העדים הופכים שותפים פעילים לסיפור האלטרנטיבי. <strong>נוף הפעולה ונוף הזהות<\/strong> הם החיבור בין עשייה במציאות לבין מתן משמעות לה.<\/li>\n<li><strong>\"ערפל מושגי\" מול \"מושג קשור לכיסא\"<\/strong>: שתי דרכים כושלות לתרגם ידע פסיכולוגי למורים: עמימות מקצועית, או רשימת הנחיות מעשיות שמרוקנת את המושג. הדרך המוצעת היא דיאלוג תהליכי.<\/li>\n<\/ol>\n<hr />","models":"<h3>1. המרכז לעבודה מערכתית: קווי הפעולה ושלוש קטגוריות המשבר (ענת קדר, מבוא)<\/h3>\n<p><strong>הרקע<\/strong>: המרכז הוקם ב-2008 על ידי צוות בראשות צילה תורי-מגדסי, כחלק מרה-ארגון בשפ\"ח.<\/p>\n<p><strong>שני קווי פעולה עיקריים:<\/strong><\/p>\n<ol>\n<li>התערבות במצבים משבריים.<\/li>\n<li>פתיחת ערוצי התפתחות וליווי תהליכי צמיחה בריאים.<\/li>\n<\/ol>\n<p><strong>שלוש קטגוריות של גורמים שסביבן מתפתחים משברים מערכתיים:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>קטגוריה<\/th>\n<th>דוגמאות מהטקסט<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>א. ניהול בית-הספר<\/strong><\/td>\n<td>יציאה או כניסה של מנהלים; אפיוני ניהול ואפיוני אישיות המנהל; המפגש בין אלה לבין אפיוני הצוות והתרבות הארגונית; טיב היחסים בין המנהל לצוות; תהליכים דינמיים שמתפתחים על רקע זה<\/td>\n<\/tr>\n<tr>\n<td><strong>ב. שינויים בסביבה<\/strong><\/td>\n<td>שינויים דמוגרפיים בסביבת בית-הספר ובעיר; שינויים פוליטיים שמשנים את דרישות משרד החינוך; שינויים ביחסי הכוח ובהגדרות התפקיד בין בית-הספר לגורמים בקהילה; השלכות על הגבולות, ההיררכיות והשיתוף; שינויים בתפיסות ובערכים בסביבה הקרובה והרחוקה<\/td>\n<\/tr>\n<tr>\n<td><strong>ג. שינויים פנימיים או התנגדות לשינוי<\/strong><\/td>\n<td>דרישה להסתגל לגישות ולמטרות חדשות; שינוי במעמד איש הצוות בעיני המנהל, בזהות המקצועית ובהיררכיה; קשיי הסתגלות לחילופי מנהלים; תהליכי הזרה שהצוות מפעיל נגד מנהלים<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>ממה שלמדו:<\/strong><\/p>\n<ul>\n<li>הפגיעה העיקרית היא <strong>במערכות היחסים<\/strong>: בין הקבוצות (מורים, תלמידים, מנהל) ובתוכן, ובין בית-הספר לממשקים (הורים, פיקוח, מנח\"י).<\/li>\n<li>בית-הספר מכוון לצמיחת הפרט, אבל פועל כ<strong>מרחב של קבוצות<\/strong>. הקבוצות הן הקרקע לצמיחה של הפרט או לפגיעה בו. מורים מתקשים לראות את הדינמיקה הזו, וגם ההכשרה שלהם אינה מדגישה אותה.<\/li>\n<li>במקום שבו נפגעים היחסים נפגעות גם <strong>המשימה המרכזית<\/strong> ומימוש הערכים.<\/li>\n<li>במשבר נפגעים <strong>המבנים הארגוניים<\/strong>: הגדרה ובנייה של צוותים (צוות ניהול אפקטיבי, צוות בין-מקצועי), הגדרות תפקיד, חלוקת סמכויות, שייכות, לויאליות ושותפות, שימוש נכון בכוחות הצוות, בחירה נכונה של אנשים לתפקידים, ויצירת תנאים לביצוע התפקיד.<\/li>\n<li><strong>טיפול במשבר מתאפשר בשני מצבים<\/strong>: (א) המנהל מוכן לבדוק את עצמו ואת התנהלותו ולהעמיד את ההבנות האלה במרכז תהליך השינוי. (ב) המשבר הגיע ל\"פיצוצים\" שהדיהם נשמעים בסביבה.<\/li>\n<li>מנהל עם מודעות גבוהה לתהליכים גלויים וסמויים, שהגנותיו אינן נוקשות, יכול להתחיל בבדיקה ושינוי לפני שנוצר משבר, ויפנה לייעוץ ארגוני או ייענה לו.<\/li>\n<\/ul>\n<p><strong>ליווי צמיחה בריאה:<\/strong><\/p>\n<ul>\n<li><strong>המוקד<\/strong>: חשיבה מחודשת על מטרות, דרכי עבודה, ערכים וגיוס כוחות.<\/li>\n<li><strong>המנוע<\/strong>: מבט מזווית חדשה על מוסכמות ותפיסות מושרשות, במיוחד על הפער בין המטרות המוגדרות למטרות שעובדים עליהן בפועל (\"חשיבה מחוץ לקופסה\").<\/li>\n<li><strong>הכיוון<\/strong>: פנייה לכוחות הפנימיים, קביעת צרכים על ידי הצוות והפחתת ההישענות על המערכת החיצונית (שינוי ממעלה שלישית).<\/li>\n<li><strong>התוצרים המדווחים<\/strong>: אוטונומיה, גאוות יחידה, שיפור בדימוי העצמי של הצוות, תפקוד טוב יותר בטיפול בפרט ובהוראה, יצירתיות, מוטיבציה והתלהבות, ערוצי התפתחות מקצועית לכוחות רדומים, קשר רחב יותר עם ההורים ועלייה ברישום.<\/li>\n<\/ul>\n<p><strong>הגיבוי התיאורטי של הצוות<\/strong>: וגה-זאגר, מינצברג, ביון, מלאני קליין ושיין (בעיקר הבנה פסיכודינמית של ארגונים).<\/p>\n<p><strong>בפתיח של ענת שראל<\/strong>: במצבי חירום (כמו \"צוק איתן\" ומות בוגרים) מודגשת יכולת הפסיכולוג לראות את מורכבות המצב ואת צורכי המערכת, ולתת מענה \"לפי העקרונות הידועים של עבודה בחירום (קמ\"ץ וגש\"ר מאח\"ד)\". העקרונות עצמם אינם מפורטים בגיליון.<\/p>\n<hr />\n<h3>2. מודל \"האישיות הבית ספרית\" (יעל שטיינברג): המודל המרכזי של הגיליון<\/h3>\n<p><strong>הנחת יסוד<\/strong>: אם לבית-ספר יש אישיות, תיאוריות אישיות יכולות לתרום להבנה המערכתית (נשען על Kets de Vries, \"Organizations on the couch\"). למערכת, כמו לפרט, יש מצוקות, טראומות, סימפטומים והגנות.<\/p>\n<h4>2א. סימפטומים מערכתיים<\/h4>\n<p><strong>סימפטומים שהמערכת \"מציגה\"<\/strong> (לפי הטקסט \"רק חלק קטן\"): קושי לעמוד במשימות, ריבוי בעיות התנהגות, יחסים בעייתיים בצוות, תשישות, והיעדרויות רבות של הצוות או של התלמידים.<\/p>\n<p><strong>טבלת \"תרגום\" מהבעיה המוצגת לסימפטום מערכתי<\/strong> (לפי הטקסט):<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>הבעיה כפי שנראית<\/th>\n<th>אפשרות לקריאה מערכתית<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ההורה הנוקשה<\/td>\n<td>סימפטום למערכת לא גמישה<\/td>\n<\/tr>\n<tr>\n<td>התלמיד הבעייתי<\/td>\n<td>סימפטום למערכת לא מכילה או חסרת גבולות<\/td>\n<\/tr>\n<tr>\n<td>הכיתה הבלתי מרוסנת<\/td>\n<td>סימפטום לקשיים ביחסים בתוך הצוות<\/td>\n<\/tr>\n<tr>\n<td>המורה המיושן<\/td>\n<td>סימפטום לחוסר מוגנות של הצוות<\/td>\n<\/tr>\n<tr>\n<td>המנהל השתלטן<\/td>\n<td>סימפטום לתחושת איום מבפנים או מבחוץ<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p>עיקרון: לעיתים איננו רואים בבעיה המוצגת \"ייצוג של קול במערכת\", אלא את הבעיה עצמה ממנה היינו רוצים להיפטר. כשהילד הבעייתי יוצא, \"מיד אחד אחר יתפוס את מקומו\".<\/p>\n<\/blockquote>\n<h4>2ב. המבנה המארגן: המודל הסטרוקטורלי של פרויד (\"האני והסתם\", 1923)<\/h4>\n<ul>\n<li><strong>איד<\/strong>: מה שנמסר בתורשה, הדחפים והיצרים. כולו לא מודע, פועל בתהליכי חשיבה ראשוניים ולפי עקרון העונג.<\/li>\n<li><strong>אגו<\/strong>: מתווך בין האיד, הסופר-אגו והעולם החיצוני, ומשימתו שמירת הקיום העצמי. מול עודף גירויים הוא נמנע, מול גירויים בינוניים הוא מסתגל, ובאופן אקטיבי הוא משנה את הסביבה לטובתו. פועל לפי עקרון המציאות ובתהליכים משניים.<\/li>\n<li><strong>סופר-אגו<\/strong>: התבוננות עצמית, מצפון ונשיאת אידאלים, \"הדחף לשלמות\" (נוי, 2008).<\/li>\n<li>באגו ובסופר-אגו יש חלקים מודעים ולא מודעים.<\/li>\n<\/ul>\n<h4>2ג. הסופר-אגו הבית ספרי: ערכים, אידאולוגיה, חזון, חוקים ואיסורים<\/h4>\n<p><strong>שאלה מרכזית<\/strong>: האם יש לבית-הספר סופר-אגו <strong>מגובש ונוכח<\/strong>?<\/p>\n<p><strong>מדדים ושאלות לבדיקה:<\/strong><\/p>\n<ul>\n<li>האם החזון \"תלוי על הקיר בחדר המנהל אך נעדר במסדרונות\"?<\/li>\n<li>אם תשאל מורה או תלמיד אקראיים מהם <strong>שלושת הערכים המרכזיים<\/strong> של בית-הספר, האם יוכלו לשלוף אותם?<\/li>\n<li><strong>אופי השיח<\/strong>: האם התפיסה הערכית עולה בדיוני הצוות?<\/li>\n<li>האם יש <strong>מודעות לפערים ולקונפליקטים<\/strong> (ש\"תמיד שם\")?<\/li>\n<li>האם התפיסה הערכית מתממשת <strong>במשימות ובמבנים<\/strong>? למשל, בית-ספר שערך מרכזי שלו הוא מצוינות בלמידה צריך מבנים מפותחים סביב הוראה (צוותים דידקטיים פעילים). בית-ספר שערך מוביל שלו הוא הכלת תלמידים מורכבים צריך צוות טיפולי רחב, פעיל ומתפקד.<\/li>\n<\/ul>\n<p><strong>טיפולוגיה של הסופר-אגו הבית ספרי:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>סוג<\/th>\n<th>מאפיינים לפי הטקסט<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>מגובש ונוכח<\/strong> (הבריא)<\/td>\n<td>הערכים חיים בשיח, במשימות ובמבנים, ויש ערנות לפערים<\/td>\n<\/tr>\n<tr>\n<td><strong>עמום<\/strong><\/td>\n<td>התפיסה הערכית לא ברורה; החזון \"על הקיר\" בלבד<\/td>\n<\/tr>\n<tr>\n<td><strong>מנופח<\/strong><\/td>\n<td>עסוק בתוכניות ערכיות גרנדיוזיות ומתקשה במשימות הבסיסיות. לעיתים נובע ממקום משברי ומרצון להרשים את הקהילה ואת גורמי החוץ. עלול לגרום קרעים בצוות, שעמוס בפרויקטים גדולים ומרגיש שאינו מצליח במשימות הבסיסיות<\/td>\n<\/tr>\n<tr>\n<td><strong>נוקשה<\/strong><\/td>\n<td>עמדות מוסרניות נוקשות, אין מקום לגמישות ולצרכים אישיים. מעורר התנגדות סמויה וגלויה בקרב צוות ותלמידים שמרגישים שאינם נראים. חרד משינויים ומשתמש בעמדה המוסרית כדי למנוע ביקורת או ביטוי אינדיבידואלי שמאיים על המבנה<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>סוגי פערים ערכיים:<\/strong><\/p>\n<ol>\n<li>בין הערכים שעליהם הוקם בית-הספר לבין ערכי <strong>האוכלוסייה החדשה<\/strong>, אחרי שינויים דמוגרפיים.<\/li>\n<li>בין הערכים המוצהרים לבין <strong>המבנים<\/strong> שקיימים כדי לממש אותם.<\/li>\n<li>בין <strong>המוצהר<\/strong> לבין מה ש<strong>מורגש בשטח<\/strong>.<\/li>\n<li>בין <strong>תתי-קבוצות<\/strong>. למשל, מורים מקצועיים רוצים הצטיינות ובחירה סלקטיבית, וההנהלה שואפת להכלה רחבה.<\/li>\n<\/ol>\n<blockquote>\n<p>מקור הפערים רחב, כי הערכים הם תוצר של ערכי הפרט, הקבוצה והקהילה, וחלקם מודעים וחלקם לא.<\/p>\n<\/blockquote>\n<p><strong>שלוש קבוצות ערכים<\/strong> (דולן, גרסיה ולאנדאו, \"ניהול על פי ערכים\"):<\/p>\n<ul>\n<li><strong>ערכים אתיים-מוסריים<\/strong>: צדק, שוויון, יושר.<\/li>\n<li><strong>ערכים כלכליים<\/strong>: כוח, מצוינות, הישגיות.<\/li>\n<li><strong>ערכים רגשיים-תשוקתיים<\/strong>: סיפוק, הנאה, ריגוש.<\/li>\n<li>החוסן של הסופר-אגו המערכתי תלוי במידת <strong>האיזון<\/strong> בין שלוש הקבוצות. ככל שהתפיסה הערכית מגובשת והרמונית יותר, הארגון חזק ויעיל יותר.<\/li>\n<\/ul>\n<p><strong>שלושה קריטריונים לממד ערכי בריא.<\/strong> מערכת שהממד הערכי שלה (1) נוכח בהוויה היומיומית, (2) מאוזן (\"לא מנופח מדי ולא מצומק מדי\") ותואם את האוכלוסייה שהוא משרת ושאליה הוא שייך, ו-(3) מלווה ברגישות וערנות מתמשכות לפערים, תתפקד הרמונית יותר, תהיה עמידה יותר למשברים ותוכל לצמוח.<\/p>\n<h4>2ד. האגו הבית ספרי<\/h4>\n<p><strong>רכיבי האגו הבית ספרי:<\/strong><\/p>\n<ol>\n<li><strong>המשימות המרכזיות והמבנים הארגוניים<\/strong> שמשרתים אותן. הדוגמאות בטקסט: בבית-ספר חרדי עומד רב בראש הצוות הניהולי. בבית-ספר דו-לשוני השואף לדו-קיום יש מנהל יהודי ומנהל ערבי. בית-ספר אנתרופוסופי מנוהל על ידי חברי הצוות ברוטציה. התפיסה הערכית מתורגמת למשימות, והמשימות באות לידי ביטוי במבנים ובתפקודם.<\/li>\n<li><strong>הכוחות שעומדים לרשות בית-הספר<\/strong>: משאבים וכוח אדם של התלמידים, הצוות והקהילה. בית-ספר סלקטיבי שמשרת אוכלוסייה חזקה שונה מבית-ספר הטרוגני או מבית-ספר שקולט נושרים.<\/li>\n<li><strong>הדימוי העצמי של בית-הספר<\/strong>: ככל שהוא טוב ויציב יותר, המערכת מתמודדת טוב יותר עם לחצים ומשברים. הוא מושפע מאוד מההיסטוריה של בית-הספר.<\/li>\n<li><strong>גמישות, יצירתיות ואותנטיות<\/strong>: יכולת ההסתגלות של האגו (פרויד), ויצירתיות ואותנטיות כסימני בריאות (ויניקוט וקוהוט). אלה מתבטאים ביכולת לתת ביטוי למאפיינים הייחודיים של הפרט והקבוצה בלי לאיים על שלמות המערכת.<\/li>\n<\/ol>\n<p><strong>סממנים של אגו במשבר או בדעיכה:<\/strong><\/p>\n<ul>\n<li>אין מבנים שמותאמים למשימות, או שהמבנים אינם מתפקדים (ישיבות שלא מתקיימות, תחושת בזבוז זמן).<\/li>\n<li>אין הגדרה מדויקת של המבנים והתפקידים, וזה יוצר מתחים וחיכוכים בין תתי-מערכות.<\/li>\n<li>בחינת המבנים ותפקודם מלמדת גם על הדינמיקה הגלויה והסמויה.<\/li>\n<\/ul>\n<h4>2ה. ההגנות הבית ספריות<\/h4>\n<p>ההגנות ממוקמות באגו ואינן מודעות. תפקידן לשמור מפני הצפה ופירוק ולשמר תחושת ערך.<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>הגנה<\/th>\n<th>ביטוי בבית-הספר (מהטקסט)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>הכחשה<\/strong><\/td>\n<td>חוסר יכולת לראות את המציאות. למשל, בית-ספר שממשיך לשאוף למצוינות אחרי שהאוכלוסייה שלו הפכה מורכבת עם צרכים מורכבים. כך נוצר אי-התאמה שהולך וגדל, ובסוף עלול להיווצר משבר<\/td>\n<\/tr>\n<tr>\n<td><strong>השלכה<\/strong><\/td>\n<td>\"זה לא אנחנו, זה הם\": האשמת הורים, משרד החינוך, מנח\"י או גורמי חוץ. בתוך בית-הספר, איש מקצוע אחד מחפש את האשמה אצל האחר<\/td>\n<\/tr>\n<tr>\n<td><strong>השלכה הזדהותית<\/strong><\/td>\n<td>למשל, היעדרות המורה לחינוך מיוחד מחדר המורים כביטוי למקומה של הכיתה המקדמת או של החינוך המיוחד בבית-הספר<\/td>\n<\/tr>\n<tr>\n<td><strong>פיצול<\/strong><\/td>\n<td>חלוקת חדר המורים ל\"טובים\" ו\"רעים\". אופייני מאוד לבתי ספר במשבר<\/td>\n<\/tr>\n<tr>\n<td><strong>רציונליזציה<\/strong><\/td>\n<td>הסברים אינטלקטואליים לקשיים ולכישלונות<\/td>\n<\/tr>\n<tr>\n<td><strong>הימנעות<\/strong><\/td>\n<td>דברים שאינם מטופלים, צעדים שלא ננקטים, מפגשים וישיבות שלא מתקיימים<\/td>\n<\/tr>\n<tr>\n<td><strong>אובססיביות<\/strong><\/td>\n<td>עיסוק בפרטים, בנהלים ובבירוקרטיה<\/td>\n<\/tr>\n<tr>\n<td><strong>אידאליזציה ודה-ולואציה<\/strong><\/td>\n<td>הערכה שהופכת בן רגע לחוסר הערכה<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h4>2ו. האיד הבית ספרי<\/h4>\n<p><strong>הגדרה<\/strong>: החלקים הלא מודעים שמניעים את ההתנהגות של הפרט, הקבוצה והקהילה (האלטון, קטס ואחרים).<\/p>\n<p><strong>\"מה שנמסר בתורשה\"<\/strong>: ההיסטוריה של בית-הספר והדפוסים שבו, חלקם ידועים וחלקם לא. <strong>דוגמה<\/strong>: בבית-ספר שההיסטוריה שלו רוויה בפיטורי מנהלים יתפתחו דפוסים של חשדנות וחוסר אמון.<\/p>\n<p><strong>דחפים (מיניות ותוקפנות)<\/strong>: האופן והעוצמה שבהם הם מתבטאים תלויים ביכולת האגו והסופר-אגו להתמודד איתם. <strong>דוגמה<\/strong>: נמצא יותר בעיות התנהגות בבתי ספר שהמבנה הארגוני שלהם מטושטש וחסר גבולות ברורים, ושמעבירים מסרים ערכיים סותרים.<\/p>\n<p><strong>שלוש רמות ביטוי של האיד:<\/strong><\/p>\n<ul>\n<li><strong>רמת הפרט<\/strong>: פרטים שמבטאים תכנים לא מודעים אישיים הופכים לסימפטום מערכתי. ילד עם בעיות התנהגות והיסטוריה של היעדר נוכחות הורית והחזקה \"יקבל מקום\" במערכת עם קשיי הכלה והיעדר גבולות. <strong>ונדליזם<\/strong> יכול להיות מחאה וזעם על \"מחיקה\". <strong>הפרעות אכילה<\/strong> יכולות להיות סימפטום של מערכת ששואפת למושלמות ולנראות חיצונית ומתקשה לראות את הפרט השלם והלא מושלם.<\/li>\n<li><strong>רמת הקבוצה (ביון)<\/strong>: קבוצת העבודה פועלת למשימה ומקבילה לאגו. בחרדה הקבוצה נסוגה להנחות בסיסיות (לחימה-בריחה, תלות, חיפוש ישועה). צוות ניהול, צוות רכזים או צוות בין-מקצועי ש\"אינו מצליח לקדם את הנושאים שלשמם התכנס\" פועל ככל הנראה בפאזה של הנחות בסיסיות. מתחת לזה נמצא לעיתים קנאה, תחרות, תחושת איום וחוסר אמון. <strong>התופעה נפוצה<\/strong> בבתי ספר באיום סגירה, בבתי ספר צומחים שהמבנים בהם עוד לא מבוססים, ובבתי ספר שעברו טראומה.<\/li>\n<li><strong>תהליכים מקבילים<\/strong>: המערכת מבטאת את הדינמיקה של האוכלוסייה שהיא משרתת. <strong>דוגמה<\/strong>: בתי ספר כוללניים לילדים צעירים עם נכויות קשות עובדים באופן מאומץ ששוחק את הצוות, כדרך להימנע מהמפגש עם הכאב וההכרה באובדן. ההתנהלות הזו משקפת עמדה הורית שמכחישה את המוגבלות, ולכן אינה מאפשרת להתייחס להיבטים הרגשיים.<\/li>\n<li><strong>רמת הקהילה והחברה<\/strong>: תהליכים בבית-הספר מקפלים בתוכם תהליכים מודעים ולא מודעים של הקהילה והחברה.<\/li>\n<\/ul>\n<h4>2ז. סיכום המודל<\/h4>\n<ul>\n<li>המודל המבני משמש <strong>\"מבנה-על מארגן\"<\/strong> להסתכלות על האישיות הבית ספרית.<\/li>\n<li><strong>תהליך ההערכה וההתבוננות כשלעצמו בעל ערך<\/strong>, כי הוא מחזק התבוננות, גיבוש והרחבה של האישיות הבית ספרית.<\/li>\n<li><strong>הערכה משותפת עם המנהל והצוות<\/strong> עוזרת לגבש תוכנית התערבות מתאימה.<\/li>\n<\/ul>\n<hr />\n<h3>3. גלוי וסמוי: טבלת השאלות המנחות של רוזנבליט (פישר-כספי ו-ונגרובר-נוימן)<\/h3>\n<p><strong>הרקע המושגי:<\/strong><\/p>\n<ul>\n<li><strong>מנגנוני הימנעות<\/strong> שומרים על תכנים מאיימים כ\"לא ידועים\", ומתוארים במושגים \"לא מודע\", \"התקפה על החיבורים\" ו\"הידוע שלא נחשב\". הספרות משתמשת בדימויים כמו \"קצה הקרחון\", \"רוחות רפאים\", \"מחול שדים\" ו\"לטאטא מתחת לשטיח\".<\/li>\n<li><strong>שאלות הכותבות<\/strong>: האם חשוב להתייחס לשני הרבדים, ולמה? מתי נתייחס לגלוי ומתי נחפש את הסמוי? איך נשאת את התחושה הבלתי נסבלת של דברים \"ממוסכים, פרומים, מנותקים\"? מהם התנאים שמאפשרים ידיעה? איך נשהה במצב של אי-ידיעה בלי \"לקפוץ למסקנות נמהרות\" ובלי \"לסגור\" בחופזה? האם ומתי לתקשר תובנות, איך ולמי?<\/li>\n<li><strong>הלא-מודע החברתי<\/strong> (הופר, אצל וינברג) מוגדר כרצף של ארבעה שלבים. ההסדרים החברתיים (1) אינם נתפסים (\"לא ידועים\"). (2) אם הם נתפסים, אין מכירים בהם (\"מוכחשים\"). (3) אם מכירים בהם, הם לא נתפסים כבעייתיים (\"נתונים\"). (4) אם הם נתפסים כבעייתיים, אין מתייחסים אליהם במרחק ובאובייקטיביות האופטימליים.<\/li>\n<li><strong>הפסיכולוג כסובייקט<\/strong>: הוא מביא איתו חלקים רציונליים ולא רציונליים, התנסויות, חרדות, הגנות, פנטזיות וציפיות. הוא נושא את ציפיות הארגון שלו (תחנת השפ\"ח, שגם היא עתירה ברבדים סמויים) ואת ציפיותיו מעצמו, ופוגש את ציפיות בית-הספר ממנו ומהשפ\"ח.<\/li>\n<li><strong>המפגש בין הפסיכולוג לבית-הספר<\/strong> הוא מערכת יחסים של חלקים מציאותיים והשלכתיים. הוא כולל השפעות הדדיות מקדמות (\"משחק\", יצירתיות והנאה) והשפעות \"ממלכדות\" שמחבלות ומעכבות. אפשר לנתח אותו גם במונחי קבוצת עבודה וקבוצת הנחות בסיסיות.<\/li>\n<\/ul>\n<p><strong>טבלת \"שאלות מנחות לעבודה על תהליכים לא מודעים\"<\/strong> (רוזנבליט, 2001, \"הנסתר והגלוי בהזמנת ייעוץ לתהליך שינוי ארגוני\"). הטבלה בודקת את היחסים בין \"האני\" לבין הארגון, המשימה, הלקוחות והסביבה:<\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>רמה<\/th>\n<th>מודע<\/th>\n<th>לא מודע<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>אני<\/strong><\/td>\n<td>מה מניע אותי לעבודה בארגון? מה מושך ומה דוחה אותי בארגון?<\/td>\n<td><strong>מה איני רוצה לשאול/לדעת על כך?<\/strong> האם מעבר לרצון לסייע בקושי ארגוני או לעזור בפיתוח הארגון יש דבר מה שידיעתו או התייחסות אליו יכולה לאיים עלי באופן אישי? לאיים על אחרים בארגון או על הארגון כמכלול? מהו אותו דבר?<\/td>\n<\/tr>\n<tr>\n<td><strong>ארגון<\/strong><\/td>\n<td>מה מותר לנו לומר/לדעת על הארגון שלנו? מה היינו רוצים שיועץ ידע/יגלה עלי, על אחרים, על הארגון?<\/td>\n<td><strong>מה אסור לומר/לדעת על הארגון שלנו? מה מפחיד אותנו לדעת על הארגון? מה מעוררים בקרבי (ובקרב עובדים אחרים) היחסים עם המנהלים שלי?<\/strong> מהי הסיבה שבגללה, למרות הקושי בארגון, אסור או קשה לנו להזמין יועץ? מה לעולם לא היינו רוצים שיועץ ידע/יגלה על ארגוננו? מה הדברים עליהם אסור לדבר בארגון?<\/td>\n<\/tr>\n<tr>\n<td><strong>משימה<\/strong><\/td>\n<td>מה הערך המוסף שאנו נותנים ללקוחותינו? מהם היעדים המנחים אותי?<\/td>\n<td>מהו הבסיס שעליו אנו מפתחים את יחסי הגומלין בינינו לבין המשימות הארגוניות? מהו המחיר שאנו משלמים על כך?<\/td>\n<\/tr>\n<tr>\n<td><strong>לקוחות<\/strong><\/td>\n<td>למה לקוחותינו מצפים מאיתנו? מה ידוע לנו על לקוחותינו?<\/td>\n<td>מהי הזהות של לקוחותינו ומהן האמונות שלהם? מה מועבר מיחסינו עם הלקוחות ליחסים שבתוך הארגון או לגורמים אחרים? מה איננו יודעים על הלקוחות?<\/td>\n<\/tr>\n<tr>\n<td><strong>סביבה<\/strong><\/td>\n<td>מה הכיוונים והמגמות בשוק שלנו? האם יש משהו חשוב יותר מהצלחת הארגון ומהקידום האישי שלי?<\/td>\n<td>מהן שתי השאלות שהכי היינו רוצים לשאול מגיד עתידות? האם יש משהו שלעולם לא נדע? מה מפחיד אותי לדעת על הסביבה שבה פועל הארגון?<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>\"אז מה עושים?\"<\/strong> – \"שמים <strong>לב<\/strong> ונותנים את <strong>הדעת<\/strong>\". התמונה הסמלית היא שלושת הקופים: לא רואים, לא שומעים, לא מדברים. כשנותנים מקום לתכנים המושתקים ולא בורחים, נמנעים, מתעלמים או מכחישים, הם הופכים ל\"תכנים, דפוסים וחוויות בבעלותנו\" שאפשר לחיות איתם, להתמודד איתם ולשנות אותם. כך אפשר \"לנהל את מערכות היחסים\" ולכוון את העשייה למשימה המרכזית. המאמר מסתיים בשאלה לקורא: \"מה ידעתם שלא ידעתם שידעתם?\"<\/p>\n<hr />\n<h3>4. חילופי מנהלים כ\"השתלת איבר חיוני\" (יעל שטיינברג)<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>מרכיב בהשתלה<\/th>\n<th>המקבילה בחילופי מנהל<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>חרדה רבה, כי כישלון ההשתלה פוגע בכל המערכות<\/td>\n<td>מנהל שלא ביסס את מקומו מוביל לחוסר תפקוד כללי של המערכת<\/td>\n<\/tr>\n<tr>\n<td>פרידה מאיבר \"שהיה שלי\" (גם אם לא תפקד) ותהליכי אובדן: הכחשה, כעס, משא ומתן, כאב והשלמה. בסוף \"הגוף יהיה גוף אחר\"<\/td>\n<td>התמודדות עם אובדן גם אם המנהל הקודם לא היה מוצלח, והכרה בכך שבית-הספר יהיה אחר<\/td>\n<\/tr>\n<tr>\n<td><strong>התאמת רקמות<\/strong> קפדנית לפני ההשתלה<\/td>\n<td><strong>מנהל \"צומח\"<\/strong> מתוך הצוות: תהליך קליטה קצר ופחות משברי, אבל נושא \"אותו DNA\". לכן מנהלים צומחים עדיפים בארגונים מתפקדים שמטרתם לשמר את הקיים (מירב שרון, 2010)<\/td>\n<\/tr>\n<tr>\n<td><strong>דיכוי הדחייה<\/strong>: הגוף תוקף איבר זר, והמושתל אינו יכול להתגבר על כך לבד ונזקק לטיפול תרופתי<\/td>\n<td>המנהל החדש צריך לצלוח את ההתנגדות הראשונית לזר. יש צורך בליווי אנשי מקצוע ותמיכה מבחוץ<\/td>\n<\/tr>\n<tr>\n<td><strong>מחלת השתל נגד המאכסן<\/strong> (Graft versus host): האיבר תוקף את הגוף<\/td>\n<td>מנהלים \"מוצנחים\" נוטים מהר יותר למהלכים כוחניים ולמאבק, בהשוואה למנהלות שצמחו מתוך בית-הספר (שרון, 2010; Oplatka, 2001)<\/td>\n<\/tr>\n<tr>\n<td><strong>מצב הגוף הקולט<\/strong>: בריא או אחרי טראומות ושחיקה<\/td>\n<td>במערכת רצופת משברים הסיכונים רבים יותר. במערכת עם כוחות הסיכוי למהפך ולתפקוד מיטבי גדול יותר<\/td>\n<\/tr>\n<tr>\n<td><strong>היסטוריית האיבר המושתל<\/strong>: עמיד ומתפקד, או אחרי טראומות ועם רגישויות<\/td>\n<td>ההיסטוריה והתפקוד הקודמים של המנהל רלוונטיים להצלחה<\/td>\n<\/tr>\n<tr>\n<td><strong>מנוחה<\/strong> עד שיתברר אם האיבר נקלט<\/td>\n<td>רק כשהמנהל מרגיש שנקלט הוא יכול להוציא לפועל תוכניות מאתגרות<\/td>\n<\/tr>\n<tr>\n<td><strong>פגיעות<\/strong> מוגברת: \"וירוסים רדומים\" מתעוררים<\/td>\n<td>בעיות, מתחים וקונפליקטים שהיו רדומים או \"מוחזקים\" בתקופת המנהל הקודם צצים ומערערים את המערכת<\/td>\n<\/tr>\n<tr>\n<td><strong>התרגשות<\/strong> וציפייה לחיים חדשים<\/td>\n<td>ציפייה לחזרה ל\"ימי הזוהר\" ולהגשמת תוכניות שלא התאפשרו<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>מסקנות<\/strong>: חילופי מנהלים הם אירוע שכיח ו\"נורמלי\", ולכן קל להמעיט בעוצמת החוויה. נדרשים חשיבה מקדימה והתאמה של המנהל לבית-הספר, תוך התחשבות בהיסטוריה של שני הצדדים. נדרש גם ליווי מבחוץ של הגורמים \"המשתילים\" והמטפלים: הפיקוח, מנח\"י והשפ\"ח. צריך להיות ערים לעיבוד האבל לצד הצמיחה וההתחדשות.<\/p>\n<hr />\n<h3>5. קונסולטציה זוגית למנהל בית-ספר: מהלך ההתערבות (פטריק וורטהיימר)<\/h3>\n<p><strong>תמונת המצב:<\/strong><\/p>\n<ul>\n<li>אוכלוסייה קשה עם צרכים רבים.<\/li>\n<li>מנהל שנבחר לפני שנים ספורות, בלי ניסיון ניהולי.<\/li>\n<li>מסורת ארוכה, \"זרמים תת-קרקעיים\" ודפוסים שהתקבעו.<\/li>\n<li>תחרות, חוסר שיתוף פעולה והאשמות הדדיות בין המנהל לחלק מבעלי התפקידים.<\/li>\n<li>אקלים נעים ש\"מסווה ייאוש\" ופיצולים, על רקע מחסור בגבולות ובתחושת החזקה.<\/li>\n<li>אווירת אלימות בין הילדים וחוסר אונים של הצוות, לצד השקעה ומסירות של צוות מיומן.<\/li>\n<\/ul>\n<p><strong>דפוסי הניהול:<\/strong><\/p>\n<ul>\n<li>המנהל עובד לבד, בלי צוות ניהול אפקטיבי.<\/li>\n<li>הוא \"מנחית\" הנחיות שהצוות אינו מקבל.<\/li>\n<li>על פני השטח היחסים טובים. מתחת: חוסר בתקשורת רציפה, תחרות והאשמות.<\/li>\n<li>אין התייחסות לצורכי הצוות ואין מסגרות תמיכה, על רקע חוסר אמון של המנהל באנשיו.<\/li>\n<li><strong>קואליציות חוצות גבולות<\/strong> עם ממשקים כמו הפיקוח מעוררות שאלה לגבי הנאמנויות שלו.<\/li>\n<li>אין האצלת סמכויות אמיתית.<\/li>\n<li>התמקדות בלעדית בצורכי הילדים מנעה ממנו לראות את חשיבות צורכי הצוות.<\/li>\n<\/ul>\n<p><strong>הגורמים להתערבות:<\/strong><\/p>\n<ul>\n<li>מרמור וכעס בצוות על חוסר גיבוי, במיוחד סביב האלימות.<\/li>\n<li>פגיעה ביכולת לתת מענה לילדים.<\/li>\n<li>תחושה שבלי ייעוץ חיצוני הבעיות לא ייפתרו.<\/li>\n<\/ul>\n<p><strong>תהליך מקביל אצל הפסיכולוגיות:<\/strong><\/p>\n<ul>\n<li>הן \"נשאבו\" לדפוסים הרגשיים של הצוות ויצרו איתו <strong>קואליציה רגשית<\/strong>.<\/li>\n<li>התפתח אצלן חוסר אמפתיה כלפי המנהל, לצד תשישות, ייאוש וכעס.<\/li>\n<li>הן הרגישו שהמערכת אינה משתמשת בהן נכון כמשאב, ושתפקידן \"מנוטרל\" כמו תפקידים אחרים.<\/li>\n<\/ul>\n<p><strong>שלבי ההתערבות:<\/strong><\/p>\n<ol>\n<li>הפסיכולוגיות יוזמות פנייה לצוות המערכתי ונפגשות איתו להתייעצות. בסך הכול התקיימו שלושה מפגשים לאורך התהליך.<\/li>\n<li>ההתייעצות מחזירה את <strong>האמפתיה כלפי המנהל<\/strong> ומרחיבה את ההבנה שלו לתמונה \"מורכבת ואינטגרטיבית\". המבט מבחוץ וההמשגות עוזרים לצאת מהתקיעות, כתגובה ל\"דפוס המפצל במערכת\".<\/li>\n<li>הפסיכולוגיות מציעות למנהל <strong>פגישות ייעוץ קבועות<\/strong>.<\/li>\n<\/ol>\n<p><strong>מוקדי הייעוץ למנהל:<\/strong><\/p>\n<ul>\n<li>עצירה מתוך המרוץ לצורך חשיבה והתבוננות.<\/li>\n<li>בירור העמדה הפנימית שלו כלפי תפקיד הניהול, הציפיות שלו מהצוות והמניעים האישיים שלו.<\/li>\n<li>ראיית הצוות באופן רחב ואמפתי יותר. שינוי דפוסי היחס אליו. הפחתת החרדה שהובילה לתוקפנות, והחלפתה בתקשורת ובדיאלוג.<\/li>\n<li>הבנה ש<strong>קולות פרטיים בצוות עשויים לשקף קולות במערכת<\/strong>, וראיית המשמעות המערכתית של סיטואציות קונקרטיות.<\/li>\n<li>הכלת קולות \"פחות סימפטיים\" והקשבה למסרים הסמויים ולצרכים, כדי לחזק את תחושת ההחזקה של הצוות.<\/li>\n<li>הרחבת מגוון האפשרויות לפתרון בעיות, מול נטייה לקונקרטיות ולפורמליות.<\/li>\n<li><strong>הזוג<\/strong> כמודלינג לחשיבה משותפת של שני אנשי מקצוע.<\/li>\n<\/ul>\n<p><strong>תוצאות<\/strong>: המנהל מעוניין יותר במעורבות הפסיכולוג בחשיבה ובהמשגה המערכתית. נוצר \"בסיס טוב יותר\" לעבודה על היחסים ועל המשימה המרכזית. הכותבות מדגישות שזו רק \"ראשיתה של דרך ארוכה\".<\/p>\n<p><strong>המשגה:<\/strong><\/p>\n<ul>\n<li>דפוסי האישיות של המנהל משפיעים על סגנון הניהול (בר-לב).<\/li>\n
