 תזזיתיות ופנטזיות מפחידות.<\/li>\n<li>הגננת מתייעצת עם פסיכולוג הגן (ועם היועץ אם יש) לגבי חרדות ההורים, חרדותיה שלה והתאמת השיח; בשל מיעוט הצוות היא זקוקה לתמיכה רבה.<\/li>\n<li>השיח – קצר יחסית; המסר: הגננת ערה לכך שקרה משהו והיא כאן לשמור עליהם. שיקום המוגנות חשוב מהעובדות המדויקות במלואן.<\/li>\n<li>ארגון היום ברמה קונקרטית: \"בואו נצייר לחבר שלנו מהגן לחזק אותו\", \"היום נשיר שירים ש-X אהב\", תרגילי ריתמיקה \"שיעזרו לנו כשאנחנו עצובים\".<\/li>\n<li>מכתב להורים: מה קרה, מה נעשה, מה צפוי, למה לשים לב, מה לומר לילדים, אפשרות להתייעצות; באירועי מוות – להסביר שמושג המוות בגיל הגן אינו בשל (אין הבנת סופיות), ולכן משאלות לחזרת הנפטר תואמות את השלב ההתפתחותי.<\/li>\n<li>מפגש הורים בהובלת הגננת בליווי פסיכולוג הגן והיועץ: מידע ועצות, הכלת ההורים, שיקום תחושת השלם בקהילת הגן, ומסר שהגננת מובילה את ניהול האירוע.<\/li>\n<\/ul>","practice":"<ul>\n<li>לפני שיקרה משהו: להכין \"ערכת חירום אישית\" ולוודא שבכל בית ספר/גן שלך יש צל\"ח מוגדר וערכת חירום עם מכתב גנרי להורים ומסמך עקרונות שיחה לפי גיל.<\/li>\n<li>באירוע: הפעולה הראשונה של מתמחה – ליצור קשר עם המדריך/ה האישי/ת (ואולי עם מנהל השפ\"ח), ולהעריך יחד אם נדרש תגבור פסיכולוגים.<\/li>\n<li>לזכור את התפקיד: לסייע למנהל להוביל, לא להחליף אותו; לתמוך \"ליד\" במורים ובמעגלים הטבעיים, ולהיכנס לכיתה בעצמך רק במצב אקוטי מאוד.<\/li>\n<li>להנחות את המנהל לפתוח כל כינוס במשפט קצר על הרגש המשותף ולהתמקד בעובדות – בלי לפתוח שיח רגשי כללי בשלבים הראשונים.<\/li>\n<li>לצייד את המורים לפני הכניסה לכיתות: \"להיות עם\" חשוב יותר מהמילים הנכונות; לעסוק בעובדות; להבהיר שהשינוי בשגרה זמני; לזהות סימנים מדאיגים ולדווח בהפסקה שאחרי השיעור השני.<\/li>\n<li>למפות מעגלי פגיעות (כיתה, חברים, שכבה, אחים בגנים/כיתות אחרים, מסגרות קודמות, חוגים) ולתכנן התייחסות לכל מעגל.<\/li>\n<li>בהתערבות עם פרט: לנרמל ולתת לגיטימציה לתגובות, להימנע מאנמנזה ומקישור לעבר, להצטרף לקצב הנפגע ולהוביל, ולחפש נקודת אור.<\/li>\n<li>לקבוע מראש את דיבוב חדר המורים (עד שבוע) ואת הפקת הלקחים – ולהיות מוכנ/ה להתנגדות המנהל.<\/li>\n<li>בגן: ללוות את הגננת בניסוח שיח קצר ומרגיע, בתכנון פעילויות קונקרטיות, בכתיבת מכתב להורים (כולל הסבר על מושג המוות בגיל הרך) ובמפגש הורים.<\/li>\n<li>לדאוג לעצמך: לא להתערב לבד, לבקש גיבוי, להשתתף בדיבוב אחרי ההתערבות, ולשים לב למצבים אישיים שמגבירים פגיעות.<\/li>\n<\/ul>","questions":"<ol>\n<li>אילו מצבי חירום אישיים שחוויתי מעצבים את התגובה שלי לאירועי חירום, וכיצד אוכל להפוך אותם למשאב ולא למכשול?<\/li>\n<li>מה קשה לי בעיקרון \"עשייה לפני רגש\" ובוויתור על אנמנזה, כפסיכולוג/ית שהורגל/ה לקדש את ההוויה הפנימית?<\/li>\n<li>כיצד אגיב למנהל שמתנגד להיערכות מקדימה או לדיבוב המורים \"כדי לחזור לשגרה מהר\"? מה אומר לו?<\/li>\n<li>אילו מעגלי פגיעות הייתי מזהה באירוע היפותטי בבית הספר/בגן שלי, ומה ההתייחסות המתאימה לכל אחד?<\/li>\n<li>איך הייתי מסייע/ת לגננת שההורים מתנגדים לכך שתדבר עם הילדים על מות ילד מהגן?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"בבואנו להתערב במערכת בשעת חירום, הקו המנחה הוא עשייה, והתייחסות להוויה ולרגש תגיע רק לאחר ההתערבות הראשונה.\"<\/li>\n<li>\"עצם חוויית הביחד היא בגדר מענה, כי היא מסייעת בחיבור החלקים לשלם.\"<\/li>\n<li>\"המנהל מחזיק את השלם הבית ספרי בכל מצב, בשגרה ובחירום\"<\/li>\n<li>\"שיקום המוגנות שהתערערה ותחושת הביטחון חשובה יותר מהעובדות המדויקות במלואן.\"<\/li>\n<\/ul>"},"level":"שנה א' (המאמר מיועד במפורש גם להכשרת מתמחים; לחזרה ולרענון לאורך כל ההתמחות)","stype":"מאמר","tldr":"המחברים טוענים שלמרות הידע שנצבר חסר בשטח מודל מארגן וממוקד, בנוי כפרוטוקול, שיעזור לפסיכולוג החינוכי בשעת חירום ובהכשרתו – בייחוד משום שהתחום אינו נלמד בתואר השני ויש ללמוד ולהתנסות בו בהתמחות. הם מציגים את מודל \"רציפות בחרו\"ם\" – חשיבה, רגש, מעשה…","search":"המחברים טוענים שלמרות הידע שנצבר חסר בשטח מודל מארגן וממוקד, בנוי כפרוטוקול, שיעזור לפסיכולוג החינוכי בשעת חירום ובהכשרתו – בייחוד משום שהתחום אינו נלמד בתואר השני ויש ללמוד ולהתנסות בו בהתמחות. הם מציגים את מודל \"רציפות בחרו\"ם\" – חשיבה, רגש, מעשה (knowing, being, doing) – המבוסס על גישת הרצפים (עומר ואלון, 1994), הנשענת על ויניקוט: לאדם שמונה רצפים (הכרתי-חשיבתי, בין-אישי, תפקיד, היסטורי, דימויים, אמונות, פיזיולוגי, רגשי), ואירוע טראומטי קוטע את \"קו החיים\"; ההתערבות נועדה לחבר מחדש את החלקים לשלם. ברמת הפרט המודל נשען על עקרונות הקמ\"צ (קרבה, מיידיות, ציפייה) ועל הגישה האסטרטגית של מילטון אריקסון (נרמול סימפטומים, מסגור מחדש, הצטרפות והובלה, \"להיות עם\"). את גישת הרצפים הם מרחיבים לארגון: בית הספר או הגן כ\"שלם\" שנשבר, וההתערבות מחברת מחדש בהדרגה את \"איבריו\" – הצל\"ח, חדר המורים, התלמידים וההורים – לפי תרשים זרימה עם ציר זמן: היערכות מקדימה, צל\"ח בראשות המנהל, תדריך חדר מורים, כניסת המורים לכיתות, מכתב להורים, דיבוב מורים כשבוע לאחר האירוע והפקת לקחים. המנהל הוא הדמות המרכזית, והצוות הטיפולי מסייע לו. פרק נפרד מוקדש להתאמות לגני ילדים, ופרק אחר להכשרה ולשמירה על המתערבים מפני שחיקת חמלה וטראומטיזציה משנית. התערבות בחירום היא חלק מהגדרת התפקיד והזהות של הפסיכולוג החינוכי – לא תוספת; המיצוב שלו מחייב אותו לפעול גם ברמת מערכת החינוך והקהילה, להבדיל מדיסציפלינות הממוקדות בפרט. המודל פועל בשלוש רמות – חשיבה (ידע ותיאוריה), רגש (ההוויה הפנימית של הנפגעים וגם של המתערבים) ומעשה – וההכשרה צריכה להתייחס לשלושתן. בהתערבות מיידית \"הקו המנחה הוא עשייה\": ההתייחסות לרגש באה אחרי ההתערבות הראשונה; לא לוקחים אנמנזה, כי התגובות הן לרוב אופני התמודדות נורמליים למצב לא נורמלי ולא תולדה של ההיסטוריה האישית. אירוע טראומטי קוטע את רצף הקיום (\"קו החיים\") של הפרט ושל הארגון; מטרת ההתערבות היא לחבר מחדש את החלקים לשלם ולהשיב תחושת רציפות. רוב האנשים יתאוששו בכוחות עצמם ובסביבתם הטבעית, חלקם אף יצמחו; מעטים יזדקקו לסיוע קצר, ומיעוט קטן לסיוע ארוך טווח. עקרונות הקמ\"צ (קרבה, מיידיות, ציפייה) מותאמים למערכת: מקום ההתערבות יכול להיות בית הספר או הגן גם כשהאירוע התרחש הרחק משם; ההתערבות עשויה להתחיל גם מחוץ לשעות הפעילות; ומדגישים את זמניות החריגה מהשגרה. \"להיות עם\" – הנוכחות עצמה היא המענה; למורים חשוב לומר שגם בלי \"המילים הנכונות\" חוויית הביחד מחברת את החלקים לשלם. המתערב \"משאיל\" לנפגע את ה\"שלם\" שלו באופן זמני. הפסיכולוג תומך \"ליד\" – משאב לצוות ולמעגלים התומכים הטבעיים; רק כש\"אין ברירה\" הוא נכנס ל\"חזית\". מי שנכנסים לכיתות הם דמויות מוכרות לתלמידים, והפסיכולוג נכנס לכיתה רק במצב אקוטי מאוד. המנהל הוא הדמות המרכזית – \"מחזיק את השלם הבית ספרי\" בשגרה ובחירום – ותפקיד הצוות הטיפולי (כולל הפסיכולוג) הוא לסייע לו להוביל. בכל מפגש: התייחסות קצרה לרגשות המשותפים בלי לפתוח שיח רגשי כללי, ועיקר – עובדות, שמייצבות ומצמצמות שמועות. יש לזהות \"מעגלי פגיעות\" (כיתה, חברים, שכבה, אחים, מסגרות קודמות, תנועת נוער וכו') ולהתייחס לכל אחד מהם. הפסיכולוג צריך לצפות להתנגדות מנהלים – להיערכות המקדימה, לדיבוב המורים ולהפקת הלקחים – מתוך הכחשה והדחקה, ולעודד את קיומם (דיבוב – לקבוע מראש ולקיים ללא קשר למספר המשתתפים). בגן: שיח קצר ומותאם גיל הוא הכרחי (הימנעות מחלישה את הילדים ומעוררת פנטזיות מפחידות); שיקום המוגנות חשוב מהעובדות המלאות; הגננת זקוקה לתמיכה רבה בשל בדידותה ולהתמודדות עם התנגדות הורים. שמירה על המתערבים: התערבות בשניים, גיבוי מדריך/מנהל למתמחה, אפשרות החלפה, התייעצות ודיבוב, ורגישות למצבים אישיים (הורות, היריון, אבל). מעורבות בחירום גם מחזקת את אמון הצוות בפסיכולוג בשגרה. רציפות בחרו\"ם – מודל עבודה והכשרה להתערבות מיידית בחירום במסגרות חינוך, בשלוש רמות: חשיבה, רגש, מעשה (knowing, being, doing). גישת הרצפים – תיאוריה (עומר ואלון, 1994) הנשענת על ויניקוט, שלפיה האדם חי לאורך שמונה רצפים, ואירוע טראומטי קוטע אותם. קו החיים – החוויה של קיום רציף ושלם מהעבר דרך ההווה אל העתיד; בטראומה נוצר בו פער/חלל. השלם (הפרטי/הארגוני) – תחושת השלמות של הפרט או של בית הספר/הגן, המתרסקת באירוע ושיש לחבר מחדש. עקרונות הקמ\"צ – קרבה (LOCATION), מיידיות (TIMING), ציפייה (EXPECTANCY); מקורם בטיפול בתגובות קרב (מלחמת העולם הראשונה). הגישה האסטרטגית – עקרונות התערבות בהשראת מילטון אריקסון: לגיטימציה לסימפטומים, מסגור מחדש, אי-עיסוק בעבר, הצטרפות והובלה, חיפוש נקודת אור, הסתייעות בסביבה הטבעית, \"להיות עם\". הצטרפות והובלה (Pacing and Leading) – \"לרדת למקום הנמוך\" שבו נמצא הנפגע, להתאים קצב וטון, ומשם להוביל אותו מעלה. מסגור מחדש (Reframing) – הגדרת הסימפטום כביטוי לבריאות (למשל, חולשה כחוזק); היעדר סימפטומים לחלוטין עשוי אף להדאיג. \"להיות עם\" – נוכחות פיזית ורגשית לצד הנפגע, ללא חובה ב\"מילים חכמות\". מעגלי פגיעות – הקבוצות שהאירוע מטלטל ומרחיק מהשלם (טמיר וחיימוב, 2005), הדורשות התייחסות ייעודית. צל\"ח (צוות לשעת חירום) – צוות שנקבע מראש לפי חוזר המנכ\"ל, לרוב מקביל לצוות ההנהלה, המתכנס ראשון בראשות המנהל. ערכת חירום – ערכה מוכנה מראש (רשימות, חומרים להנהלה ולמורים, מסמך עקרונות שיחה לפי גיל, מכתב גנרי להורים); לפסיכולוג – \"ערכת חירום אישית\". דיבוב – כינוס לאוורור חוויות ולמתן מקום לרמת הרגש (לכיתות בסיכון, ולחדר המורים כשבוע לאחר האירוע). שחיקת חמלה / טראומטיזציה משנית – סיכון למתערבים, המחייב שמירה מובנית עליהם."},{"id":"tene_sped","title":"מעבר לחינוך מיוחד","authors":"צילה טנא","year":"","cite":"טנא, צ'. מעבר לחינוך מיוחד.","url":null,"kind":"article","desc":"מאמר של צילה טנא על המעבר לחינוך המיוחד.","placements":[["s1","sped"]],"extra":false,"ref":"טנא, מעבר לחנ\"מ","inFolder":false,"tldr":"מאמר של צילה טנא על המעבר לחינוך המיוחד.","search":"מאמר של צילה טנא על המעבר לחינוך המיוחד."},{"id":"ravid2024","title":"היבטים טיפוליים בתהליך המשוב באבחון הפסיכו-חינוכי","authors":"ה' ראביד-חיון ומ' בן ריי","year":"2024","cite":"ראביד-חיון, ה' ובן ריי, מ' (16 בינואר 2024). היבטים טיפוליים בתהליך המשוב באבחון הפסיכו-חינוכי. פסיכולוגיה עברית.","url":"https://www.hebpsy.net/articles.asp?id=4639","kind":"article","desc":"מאמר על המשוב באבחון הפסיכו-חינוכי כמהלך בעל ערך טיפולי. ממשיך באופן טבעי את הרעיון של ספיר-יוגב שהמשוב הוא \"מפגש בין מומחים\".","urlLabel":"המאמר באתר פסיכולוגיה עברית","placements":[["s2","diag"]],"extra":false,"ref":"ראביד-חיון ובן ריי 2024","inFolder":false,"tldr":"מאמר על המשוב באבחון הפסיכו-חינוכי כמהלך בעל ערך טיפולי. ממשיך באופן טבעי את הרעיון של ספיר-יוגב שהמשוב הוא \"מפגש בין מומחים\".","search":"מאמר על המשוב באבחון הפסיכו-חינוכי כמהלך בעל ערך טיפולי. ממשיך באופן טבעי את הרעיון של ספיר-יוגב שהמשוב הוא \"מפגש בין מומחים\"."},{"id":"ostrovil1987","title":"קונסולטציה במסגרות חינוכיות: הצגת מודל אינטגרטיבי","authors":"ז' אוסטרוויל","year":"1987","cite":"אוסטרוויל, ז' (1987). קונסולטציה במסגרות חינוכיות: הצגת מודל אינטגרטיבי. בתוך: א' לסט (עורך), עבודה פסיכולוגית בבית הספר (עמ' 102-123). ירושלים: מאגנס.","url":null,"kind":"article","desc":"פרק קלאסי שמציג מודל אינטגרטיבי לקונסולטציה במסגרות חינוכיות, מתוך הספר \"עבודה פסיכולוגית בבית הספר\" (מאגנס).","placements":[["s2","therapy"]],"extra":false,"ref":"אוסטרוויל 1987","inFolder":false,"tldr":"פרק קלאסי שמציג מודל אינטגרטיבי לקונסולטציה במסגרות חינוכיות, מתוך הספר \"עבודה פסיכולוגית בבית הספר\" (מאגנס).","search":"פרק קלאסי שמציג מודל אינטגרטיבי לקונסולטציה במסגרות חינוכיות, מתוך הספר \"עבודה פסיכולוגית בבית הספר\" (מאגנס)."},{"id":"barakstein2014","title":"לעבוד עם טיפוסים: קולות קבוצתיים בכיתה","authors":"ח' ברק שטיין","year":"2014","cite":"ברק שטיין, ח' (2014). לעבוד עם טיפוסים: קולות קבוצתיים בכתה.","url":"https://www.helibarak.com/articlesgroups","kind":"article","desc":"מאמר על התבוננות בכיתה כקבוצה ועל ה\"קולות\" והתפקידים הקבוצתיים שתלמידים נושאים בה.","urlLabel":"רשימת המאמרים באתר המחברת","placements":[["s2","therapy"]],"extra":false,"ref":"ברק שטיין 2014","inFolder":false,"tldr":"מאמר על התבוננות בכיתה כקבוצה ועל ה\"קולות\" והתפקידים הקבוצתיים שתלמידים נושאים בה.","search":"מאמר על התבוננות בכיתה כקבוצה ועל ה\"קולות\" והתפקידים הקבוצתיים שתלמידים נושאים בה."},{"id":"gantz2021","title":"טיפול בהורים: כשהפתולוגיה תוקפת את הטיפול","authors":"ירדנה גנץ","year":"2021","cite":"גנץ, י' (14 בנובמבר 2021). טיפול בהורים: כשהפתולוגיה תוקפת את הטיפול. פסיכולוגיה עברית.","url":"https://www.hebpsy.net/articles.asp?id=4227","kind":"article","desc":null,"urlLabel":"המאמר באתר פסיכולוגיה עברית","file":{"orig":"טיפול בהורים כשהפתולוגיה תוקפת את הטיפול.doc","ext":"doc","pdf":"gantz2021.pdf","pages":30,"bytes":200034},"placements":[["s2","therapy"]],"extra":false,"ref":"גנץ 2021","inFolder":true,"srcTitle":"טיפול בהורים: כשהפתולוגיה תוקפת את הטיפול","secs":{"abstract":"<p>המאמר מתאר תופעה שהמחברת מכנה \"כשהפתולוגיה תוקפת את הטיפול – והמטפל מלוהק לדרמה הפתולוגית\". התופעה שכיחה בכל טיפול, ובמיוחד בטיפול בהורים. היא מופיעה בטווח רחב של צורות: איחורים וביטולים, \"למה אנחנו ולא הילד\", צמצום המרחב הטיפולי, הפחתת ערך המטפל ונטישה מוקדמת. לפי הטענה המרכזית, המתקפה היא לעיתים קרובות ביטוי של הפתולוגיה של המטופל עצמה. המטפל נגרר בדרך של אנאקטמנט לדפוס הקשר הפתולוגי, ולכן נוצרת הזדמנות טיפולית \"בלתי נמנעת ובלתי רגילה\" לעבוד בכאן ועכשיו. המאמר מבוסס על הגישה ההתייחסותית ומשלב את בנג'מין (הכרה הדדית מול שליטה-כניעות, \"השלישי\"), את ארון (מבוי סתום, שיתוק המטפל, הדדיות א-סימטרית) ואת קבוצת בוסטון (\"ידע יחסים סמוי\"). לפי המחברת, הטיפול בהורים מועד במיוחד לתופעה: הסימפטום נמצא אצל הילד והפתולוגיה בעיקר אצל ההורים, ולכן נוצרים שיפוטיות, אשמה ויחסים בינאריים. המאמר מביא מקרי בוחן ודוגמאות של סטינג, וכולל ורבטים מפורטים. היציאה מהמבוי הסתום מתרחשת כשהמטפל \"מטפס ראשון למרפסת\" בעזרת \"סולמות\" (תיאוריה, הדרכה, טיפול אישי) ומזמין את ההורים להתבוננות משותפת, ו\"זהו הטיפול עצמו\".<\/p>","ideas":"<ul>\n<li>מתקפה על הטיפול אינה רק איום על קיומו. היא עשויה להיות ביטוי מרוכז של הפתולוגיה: \"כל ה-DNA של הפתולוגיה מרוכז בדינמיקת היחסים הטיפוליים\". לכן ההשתהות באזור הזה היא תנאי להתקדמות, ובה בעת הזדמנות לעבודה עוצמתית בכאן ועכשיו.<\/li>\n<li>המטפל מגיב למתקפה באחת משתי דרכים: כניעה, ריצוי וביטול עצמי, או הכנעה, שליטה וביטול האחר. משתי התגובות מתפתח מאבק (שכנוע, ויכוחים, מאבקי כוח, מניפולציות רגשיות או הפסקה תוקפנית של הטיפול) שמחמיר את ה\"פלונטר\".<\/li>\n<li>פרויד התמודד עם התנגדות באמצעות כוח, עימות והכנעה, מתוך יחסי כוחות דיכוטומיים. למטפל ההתייחסותי אין ה\"פריבילגיה הסמכותית\" הזו, כי הוא סובייקט בקשר.<\/li>\n<li>לפי בנג'מין, בריאות ביחסים היא הכרה הדדית ופתולוגיה היא שליטה-כניעות. ארון מוסיף שביחסים היררכיים (הורות, טיפול) בריאות פירושה \"הדדיות א-סימטרית\": המטופל נחשף בחופשיות, וחשיפת המטפל נעשית בשיקול דעת ובשירות המטופל.<\/li>\n<li>\"מבוי סתום אנליטי\" הוא משבר קומפלימנטרי: דפוס בינארי של שולט-כנוע, עושה-נעשה לו, \"פינג-פונג\". היציאה ממנו היא דרך \"שלישי אינטרסובייקטיבי\" שנוצר במשותף. ארון מדגיש שקודם לכן המטפל צריך להשתקם מהשיתוק שלו, שנע בין אמפתיה מזויפת לשיפוטיות אותנטית, באמצעות רפלקציה עצמית וחשיפה עצמית מותאמת.<\/li>\n<li>קבוצת בוסטון מבחינה בין רובד דקלרטיבי-מילולי לרובד פרוצדורלי-סמוי (\"ידע יחסים סמוי\"). דפוסי קשר מזוהים בעיקר דרך ההתנסות בקשר הטיפולי, ומשתנים בעיקר דרך התנסות בדפוסים חלופיים ולא דרך פרשנות או פסיכו-אדיוקציה (בדומה ללמידת רכיבה על אופניים).<\/li>\n<li>איכויות הקשר הטיפולי, כמו קשב דק, כבוד לגבולות, חיפוש פשר לא שיפוטי, הזמנה לרפלקציה ומשא ומתן מכבד, אינן רק אמצעי. הן המטרה עצמה, כי החוויה שלהן בכאן ועכשיו מרחיבה את ידע היחסים הסמוי של המטופל.<\/li>\n<li>הטיפול בהורים מועד במיוחד למתקפות, כי הסימפטום אצל הילד והפתולוגיה בעיקר אצל ההורים. המבנה הזה מזמין פרדיגמה של פוגע-קורבן, שיפוטיות אצל המטפל ואשמה בלתי נסבלת אצל ההורים. הוא גם משקף את פרדוקס הפסיכולוגיה של ההורה: ההורה הוא אובייקט הורי וגם סובייקט, והילד הוא שלוחה של ההורה וגם ישות נפרדת. המשבר בטיפול הוא החצנה של הפרדוקס הזה.<\/li>\n<li>הסטינג עצמו מעביר מסר יחסי. לדוגמה, פגישות משותפות קבועות להורים גרושים משדרות \"אתם עדיין זוג\", בניגוד למשימת הנפרדות. לכן כדאי לחשוב על הסטינג כעל כלי שמרחיב את ידע היחסים הסמוי.<\/li>\n<li>הסתייגות חשובה (הערה 2): \"לפני הדרש – הפשט\". לא כל קושי הוא מתקפה. לפעמים מדובר בקושי מציאותי, בכשל אמפתי של המטפל או בפתולוגיה של המטפל עצמו.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>\"כשהפתולוגיה תוקפת את הטיפול\"<\/strong> – מצב שבו הפתולוגיה של המטופל פוגעת בסטינג או ביחסים הטיפוליים, והמטפל מלוהק לדרמה הפתולוגית.<\/li>\n<li><strong>אנאקטמנט<\/strong> – מושג התייחסותי. הוא כולל את המרכיב התוך-אישי של הזדהות השלכתית (תחושות קשות כמו חוסר ערך, ייאוש, בלבול או כישלון) ומוסיף את הביטוי ההתנהגותי בקשר הממשי (מאבק, כניעה או הכנעה). המחברת בחרה בו במקום \"הזדהות השלכתית\" בגלל הרכיב ההתנהגותי.<\/li>\n<li><strong>משבר קומפלימנטרי / יחסים קומפלימנטריים<\/strong> – יחסים בינאריים נוקשים של שולט-כנוע, שמקבעים ואף מחריפים את מצב השותפים. רענן מיוחס הציע את התרגום \"יחסים משליליים\".<\/li>\n<li><strong>מבוי סתום אנליטי (analytic impasse)<\/strong> – משבר ביחסים הטיפוליים שבו אין \"meeting of minds\", אלא \"פינג-פונג\" (בנג'מין) או \"see-saw\" (ארון).<\/li>\n<li><strong>שלישי אינטרסובייקטיבי<\/strong> – יצירה משותפת בעלת מאפיינים ריתמיים, סימבוליים ומוסריים. הוא מאפשר מסירות (surrender) כחלופה לשליטה-כניעות.<\/li>\n<li><strong>הכרה הדדית / הדדיות א-סימטרית<\/strong> – הקריטריון לבריאות ביחסים. ביחסים היררכיים ההדדיות היא א-סימטרית. המקבילה התוך-נפשית של ההדדיות היא היכולת להכיל פרדוקס בין ביטוי עצמי להכרה באחר.<\/li>\n<li><strong>ידע יחסים סמוי (implicit relational knowing)<\/strong> – ייצוג פנימי לא מודע (במובן הפנומנולוגי, לא הדינמי) של פרוצדורות בין-אישיות, שממנו בנויים דפוסי קשר חוזרים.<\/li>\n<li><strong>\"מרפסת\"<\/strong> – המטפורה של המחברת לעמדה רפלקטיבית (\"השלישי\"), שממנה המטפל והמטופל צופים יחד במה שקורה ביניהם.<\/li>\n<li><strong>\"סולמות\"<\/strong> – תיאוריה, הדרכה, ובמצבי קאונטר-טרנספרנס עוצמתי גם טיפול אישי. הם עוזרים למטפל, שהוא \"חבוש בבית האסורים\", לטפס ראשון למרפסת.<\/li>\n<li><strong>מנטליזציה<\/strong> – כפי שהמונח מוגדר במאמר: \"נתינת פשר פנימי להתרחשויות חיצוניות\".<\/li>\n<li><strong>הפסיכולוגיה של ההורה<\/strong> – מערך של שני פרדוקסים: ההורה כאובייקט הורי וכסובייקט אנושי, והילד כשלוחה של הוריו וכישות עצמאית.<\/li>\n<\/ul>","models":"<p><strong>מנעד המופעים של מתקפה על הטיפול (מהקל לכואב):<\/strong><\/p>\n<ol>\n<li>מתקפה על הסטינג: איחורים וביטולים.<\/li>\n<li>אי הבנה: \"מדוע אנחנו ההורים צריכים להגיע לטיפול ולא הילד\", או המורה.<\/li>\n<li>צמצום המרחב הטיפולי באופן שמבטל את האפשרות לעבודה טיפולית.<\/li>\n<li>מתקפה במקום הרגיש: הפחתת ערך המטפל.<\/li>\n<li>\"הכואב מכל\": נטישה מוקדמת של הטיפול.<\/li>\n<\/ol>\n<p><strong>השתלשלות האירוע: חמשת השלבים<\/strong><\/p>\n<ol>\n<li>מתקיימת מתקפה סמויה או גלויה על הטיפול.<\/li>\n<li>המטפל חש במתקפה, במודע או שלא במודע, ומגיב באחת משתי דרכים: (א) כניעה, ריצוי וביטול עצמי; (ב) הכנעה, שליטה וביטול האחר. מתפתח מאבק בלתי טיפולי (שכנוע, ויכוחים, מאבקי כוח, מניפולציות רגשיות, הפסקה תוקפנית).<\/li>\n<li>המתקפה היא לעיתים קרובות ביטוי של הפתולוגיה של המטופל, והמטפל מלוהק בדרך של אנאקטמנט לדפוס הקשר הפתולוגי. כך נוצרת הזדמנות טיפולית \"בלתי נמנעת\" (אי אפשר להתקדם בלי להשתהות כאן) ו\"בלתי רגילה\" (עבודה עוצמתית בכאן ועכשיו). בלשון מיטשל: \"להיעשות לחלק מהבעיה זו הדרך שבה אנו נעשים חלק מהפתרון\".<\/li>\n<li>המעבר מליהוק לטיפול מתרחש דרך \"השלישי\", או \"המרפסת\". המטפל מטפס ראשון בעזרת סולמות (תיאוריה, הדרכה, טיפול אישי) ואז מזמין את המטופל לתצפית משותפת על מה שקורה ביניהם ועל הרלוונטיות שלו לטיפול.<\/li>\n<li>כל זה אינו \"פרומו\" לטיפול. זהו הטיפול עצמו, ולעיתים קרובות הפרק הקשה, הכואב, המייאש והמשמעותי ביותר.<\/li>\n<\/ol>\n<p><strong>שלוש עמדות כלפי התנגדות או מתקפה (רקע תיאורטי):<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>גישה<\/th>\n<th>הבנת המתקפה<\/th>\n<th>דרך ההתמודדות<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>פרויד (מודרניסטית)<\/td>\n<td>התנגדות: אותם מנגנוני הגנה שבולמים דחפים בולמים את הטיפול<\/td>\n<td>כוח, עימות והכנעה; האנליסט מומחה \"אובייקטיבי\"<\/td>\n<\/tr>\n<tr>\n<td>בנג'מין וארון (התייחסותית)<\/td>\n<td>מבוי סתום ומשבר קומפלימנטרי; שיתוק המטפל (ארון)<\/td>\n<td>שלישי אינטרסובייקטיבי, מסירות, רפלקציה עצמית וחשיפה עצמית מותאמת; צניעות, סבלנות ונדיבות<\/td>\n<\/tr>\n<tr>\n<td>קבוצת בוסטון + המחברת<\/td>\n<td>המשבר הוא ביטוי של ידע יחסים סמוי פתולוגי שהמטופל מביא, והמטפל מלוהק אליו<\/td>\n<td>היחלצות משותפת מהדפוס = חוויה בכאן ועכשיו של דפוס שינוי. \"זהו הטיפול במלוא הדרו\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>המשוואה (בנג'מין + ארון):<\/strong><\/p>\n<ul>\n<li>ביחסים שוויוניים (זוגיות, חברות): בריאות = הדדיות.<\/li>\n<li>ביחסים היררכיים (הורות, טיפול): בריאות = הדדיות א-סימטרית.<\/li>\n<li>יחסי שליטה-כניעות: תמיד פתולוגיים.<\/li>\n<\/ul>\n<p><strong>שתי החוליות שקבוצת בוסטון מוסיפה להבנת המבוי הסתום:<\/strong><\/p>\n<ol>\n<li>חוליה מקדימה: השבר בקשר הטיפולי הוא ביטוי של ידע יחסים סמוי פתולוגי שהמטופל מביא, וכנראה קשור לסימפטום או למוקד הסבל. המטפל מלוהק אליו.<\/li>\n<li>חוליה אחרונה: היחלצות משותפת מהדפוס (בעזרת השלישי) היא אירוע טיפולי משמעותי, שבו המטופל חווה בכאן ועכשיו דפוס של שינוי.<\/li>\n<\/ol>\n<p><strong>איכויות קשר טיפוליות (שהן גם אמצעי וגם מטרה):<\/strong> קשב דק; כבוד לגבולות (לסוכנות העצמית של המטופל); התכווננות רגשית; חיפוש פשר לא שיפוטי; הזמנה לרפלקציה; זיהוי כוחות; מסירות; חשיפה עצמית זהירה; משא ומתן מכבד; בנייה משותפת של קשר עם הדדיות א-סימטרית.<\/p>\n<p><strong>שלושה דפוסי קשר בהוראת רכיבה על אופניים (המחשה של ידע יחסים סמוי):<\/strong><\/p>\n<ul>\n<li>ריצוי וכניעות: ההורה כ\"גלגלי עזר אנושיים כרוניים\".<\/li>\n<li>שתלטנות וחודרנות: \"כל החברים שלך כבר רוכבים, למה רק את לא קולטת?\"<\/li>\n<li>האופציה הבריאה, מסירות והדדיות: \"יש לך כוח להמשיך באימון? לי נגמר הכוח, מה את מציעה?\"<\/li>\n<\/ul>\n<p><strong>זוגות בינאריים אופייניים במשבר בטיפול בהורים:<\/strong> מאשים-אשם, פוגע-קורבן, רודף-נרדף, שוטר-גנב, אובייקט-סובייקט, אלטרואיסט שחושב על הילד מול אגואיסט שחושב על עצמו, לוקח אחריות מול משתמט. התפקידים מתחלפים באופן מתעתע בין המטפל להורים.<\/p>\n<p><strong>מקרי בוחן ודוגמאות:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>מקרה<\/th>\n<th>ביטוי המתקפה<\/th>\n<th>הבנה (ליהוק)<\/th>\n<th>כיוון טיפולי<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>פתיחה – גיל ונערה בת 13 בסיכון<\/td>\n<td>לחץ לתוכנית מעשית; האב זועם על \"בזבוז זמן\"; המטפל חווה \"יובש\" וייאוש<\/td>\n<td>הדפוס האנטי-מנטליסטי של ההורים סחף את המטפל. הוא לא הצליח לענות לשאלה \"מה מספרת ההתנהגות הסיכונית?\"<\/td>\n<td>בהדרכה: לזהות את ההקבלה בין הקושי של המטפל במנטליזציה לקושי של ההורים, ולהזמין לרפלקציה על הקושי ברפלקציה<\/td>\n<\/tr>\n<tr>\n<td>\"פלונטר נרציסטי\" – תום, בן 8, אנקופרזיס<\/td>\n<td>ההורים מציגים רשימת מומחים שנכשלו, יוקרה וציניות; אצל המטפלת דחף גרנדיוזי מול דחף תוקפני<\/td>\n<td>אם הטיפול יצליח זה כישלון (הוכחה לנזקקות); אם ייכשל זו הצלחה. הסימפטום \"חושף את הלכלוך\" ופורץ את מלכודת המושלמות<\/td>\n<td>לשהות במבוי הסתום, לחפש \"מרפסת\" ולצפות יחד בפלונטר בכאן ועכשיו<\/td>\n<\/tr>\n<tr>\n<td>\"טיפול בנדמה לי\" – מור, נערה מופנמת (\"רואה ובלתי נראית\")<\/td>\n<td>אינטייק \"טפלון\": כל המילים הנכונות ושום תוכן<\/td>\n<td>הערפל בחדר משקף את הערפל בין ההורים לבת; בהמשך התגלו \"גירושין סמויים\"<\/td>\n<td>שיקוף ישיר (\"אנחנו משחקים בנדמה לי\"), שקט, והזמנה חוזרת ללא שיפוטיות, בהומור ובהתמדה<\/td>\n<\/tr>\n<tr>\n<td>הורים בהישרדות (כלכלית, בריאותית, גירושין)<\/td>\n<td>ביטולים וקושי להתמיד<\/td>\n<td>מחסור במשאבי זמן, כסף ובעיקר רגש מצמצם גם את ההורות וגם את הטיפול<\/td>\n<td>לא להפסיק את הטיפול (זה מחזיר את המתקפה). להתבונן יחד בקושי להיות הורה כשנלחמים על הקיום<\/td>\n<\/tr>\n<tr>\n<td>רק הורה אחד מגיע לפגישה<\/td>\n<td>–<\/td>\n<td>ייתכן שזו הצצה לדפוס שליטה-כניעות בזוגיות ובהורות<\/td>\n<td>לא לבטל ולא להמשיך \"כרגיל\". להזמין את ההורה להתבוננות משותפת על המבנה החסר ועל משמעותו, ולהחליט יחד איך להמשיך<\/td>\n<\/tr>\n<tr>\n<td>הורים גרושים<\/td>\n<td>סטינג משותף קבוע<\/td>\n<td>הסטינג מעביר מסר שהם \"עדיין זוג\" ומזמין התערבות בבית השני<\/td>\n<td>בעיקר פגישות נפרדות, ומדי פעם פגישה משותפת שמתמקדת רק ב\"גשר בין שני הבתים\"<\/td>\n<\/tr>\n<tr>\n<td>\"ללכת עם להרגיש בלי\" – איתי, בן 14<\/td>\n<td>שכחה, ביטול, איחור; תחושת ניצול וכעס אצל המטפלת ודחף להפסיק בתוקפנות<\/td>\n<td>ההורים \"אינם באמת שם\" בהורות שלהם. \"אנחנו אמנם ממש בתחילתו של הטיפול, אך נתונים כבר בעיצומו\"<\/td>\n<td>חשיפה עצמית זהירה (\"אני מרגישה ברורה מאליו\"), השוואה להדדיות שלהם בעבודה, \"להיכנס לנעליי\", ואז עלו הביקורת העצמית של האב והבריחה של האם (\"פעם ברחתי מאבא שלי והיום אני בורחת מהבן שלי\")<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>דוגמאות לתופעה בהקשרים אחרים (הערה 4):<\/strong> ילד עם ODD שמסרב לטיפול; רווק שמתקשה להיות בעמדת הזדקקות ומבטל פגישות או את המטפל; הדרכה של מתמחה שמתקשה במגע עם אי ידיעה, שבה הקשר ההדרכתי סופג מתקפות הגנתיות.<\/p>","practice":"<ul>\n<li>כשטיפול בהורים \"נתקע\" (ביטולים, איחורים, \"תטפלי בילד\", זלזול), בדוק/בדקי קודם את הפשט: קושי מציאותי? כשל אמפתי שלך? רק אחר כך שאל/י: \"האם זו הפתולוגיה שתוקפת את הטיפול?\"<\/li>\n<li>השתמש/י ברגשות שלך (כעס, תחושת ניצול, ייאוש, יובש, דחף להפסיק או להוכיח) כמידע על דפוס הקשר שההורים מביאים. אל תשתמש/י בהם כהצדקה לפעולה.<\/li>\n<li>שים/י לב אם נגררת לכניעה וריצוי (עוד ועוד \"פרקטיקה\" כדי לרצות) או להכנעה ושליטה (שכנוע, התניות, איומים בסיום). שתי התגובות משחזרות את הדפוס.<\/li>\n<li>הבא/י להדרכה את השאלה הבסיסית \"איך אני מבין/ה את מה שקורה לילד? מה ההתנהגות שלו מספרת?\" אם קשה לך לענות, ייתכן שזו מקבילה לקושי של ההורים במנטליזציה.<\/li>\n<li>טפס/י \"ראשון למרפסת\" (תיאוריה, הדרכה, ואם צריך טיפול אישי), ורק אחר כך הזמן/י את ההורים להתבוננות משותפת על הכאן ועכשיו. עשה/י זאת ללא שיפוטיות, בהתמדה, ביצירתיות ולעיתים בהומור.<\/li>\n<li>חשוב/י על הסטינג כעל התערבות: כשמגיע רק הורה אחד, אל תבטל/י ואל תמשיך/י כרגיל, אלא חקור/י את המשמעות יחד איתו. עם הורים גרושים, שקול/י פגישות נפרדות ומפגש משותף ממוקד ב\"גשר\".<\/li>\n<li>חשיפה עצמית זהירה (\"אני מרגישה שאני ברורה מאליו\") יכולה לפתוח התבוננות, בתנאי שהיא בשירות ההורים ובהדדיות א-סימטרית ולא כדי לקבל עוד התנצלות.<\/li>\n<li>זכור/זכרי ש\"היחלצות\" מהמבוי הסתום עם ההורים היא חוויה מתקנת שמשפיעה ישירות על דפוסי ההורות שלהם (הקבלה בין יחסי מטפל-מטופל ליחסי הורה-ילד).<\/li>\n<\/ul>","questions":"<ol>\n<li>באיזה טיפול שלי אני מרגיש/ה כרגע מותקף/ת, מנוצל/ת, משותק/ת או מתווכח/ת? לאיזו \"דרמה\" אולי לוהקתי, ומה היא מספרת על היחסים בין ההורים לילד?<\/li>\n<li>מול לחץ של הורים, האם אני נוטה יותר לריצוי וביטול עצמי או להכנעה ושליטה? מה זה אומר עליי ועל הדפוס שלהם?<\/li>\n<li>מה ה\"מרפסת\" שלי בטיפול הזה? איזה משפט שיקוף על הכאן ועכשיו אוכל לנסות, ואיך אעשה זאת בלי שיפוטיות?<\/li>\n<li>מה הסטינג הנוכחי (מי מגיע, באיזה הרכב, באיזו תדירות) משדר לגבי דפוסי הקשר במשפחה? האם יש סטינג שעשוי להיות טיפולי יותר?<\/li>\n<li>איך אבחין בין \"פשט\" (קושי מציאותי, כשל אמפתי שלי, הפתולוגיה שלי) לבין \"דרש\" (מתקפה שמבטאת את הפתולוגיה של המטופל)?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"וכל מה שתואר עד כה, אינו פרומו לטיפול ואינו אמצעי המאפשר את המשך קיומו של הטיפול, אלא זהו הטיפול עצמו.\"<\/li>\n<li>\"טיפול בהורים מתקיים במערך ייחודי שבו הסימפטום נמצא בדרך כלל אצל אחד – הילד, ואילו הפתולוגיה מצויה ברובה אצל השני – ההורים\"<\/li>\n<li>\"נוצר שקט בחדר, שנמשך. נתתי לו להימשך. סוף סוף כולנו רואים משהו, אנחנו רואים ביחד שאנחנו לא רואים כלום.\"<\/li>\n<li>\"becoming part of the problem is how we become part of the solution\" כלומר, \"להיעשות לחלק מהבעיה זו הדרך שבה אנו נעשים חלק מהפתרון\" (סטיבן מיטשל, כפי שמצוטט חסים היא הכרה הדדית ופתולוגיה היא שליטה-כניעות. ארון מוסיף שביחסים היררכיים (הורות, טיפול) בריאות פירושה \"הדדיות א-סימטרית\": המטופל נחשף בחופשיות, וחשיפת המטפל נעשית בשיקול דעת ובשירות המטופל. \"מבוי סתום אנליטי\" הוא משבר קומפלימנטרי: דפוס בינארי של שולט-כנוע, עושה-נעשה לו, \"פינג-פונג\". היציאה ממנו היא דרך \"שלישי אינטרסובייקטיבי\" שנוצר במשותף. ארון מדגיש שקודם לכן המטפל צריך להשתקם מהשיתוק שלו, שנע בין אמפתיה מזויפת לשיפוטיות אותנטית, באמצעות רפלקציה עצמית וחשיפה עצמית מותאמת. קבוצת בוסטון מבחינה בין רובד דקלרטיבי-מילולי לרובד פרוצדורלי-סמוי (\"ידע יחסים סמוי\"). דפוסי קשר מזוהים בעיקר דרך ההתנסות בקשר הטיפולי, ומשתנים בעיקר דרך התנסות בדפוסים חלופיים ולא דרך פרשנות או פסיכו-אדיוקציה (בדומה ללמידת רכיבה על אופניים). איכויות הקשר הטיפולי, כמו קשב דק, כבוד לגבולות, חיפוש פשר לא שיפוטי, הזמנה לרפלקציה ומשא ומתן מכבד, אינן רק אמצעי. הן המטרה עצמה, כי החוויה שלהן בכאן ועכשיו מרחיבה את ידע היחסים הסמוי של המטופל. הטיפול בהורים מועד במיוחד למתקפות, כי הסימפטום אצל הילד והפתולוגיה בעיקר אצל ההורים. המבנה הזה מזמין פרדיגמה של פוגע-קורבן, שיפוטיות אצל המטפל ואשמה בלתי נסבלת אצל ההורים. הוא גם משקף את פרדוקס הפסיכולוגיה של ההורה: ההורה הוא אובייקט הורי וגם סובייקט, והילד הוא שלוחה של ההורה וגם ישות נפרדת. המשבר בטיפול הוא החצנה של הפרדוקס הזה. הסטינג עצמו מעביר מסר יחסי. לדוגמה, פגישות משותפות קבועות להורים גרושים משדרות \"אתם עדיין זוג\", בניגוד למשימת הנפרדות. לכן כדאי לחשוב על הסטינג כעל כלי שמרחיב את ידע היחסים הסמוי. הסתייגות חשובה (הערה 2): \"לפני הדרש – הפשט\". לא כל קושי הוא מתקפה. לפעמים מדובר בקושי מציאותי, בכשל אמפתי של המטפל או בפתולוגיה של המטפל עצמו. \"כשהפתולוגיה תוקפת את הטיפול\" – מצב שבו הפתולוגיה של המטופל פוגעת בסטינג או ביחסים הטיפוליים, והמטפל מלוהק לדרמה הפתולוגית. אנאקטמנט – מושג התייחסותי. הוא כולל את המרכיב התוך-אישי של הזדהות השלכתית (תחושות קשות כמו חוסר ערך, ייאוש, בלבול או כישלון) ומוסיף את הביטוי ההתנהגותי בקשר הממשי (מאבק, כניעה או הכנעה). המחברת בחרה בו במקום \"הזדהות השלכתית\" בגלל הרכיב ההתנהגותי. משבר קומפלימנטרי / יחסים קומפלימנטריים – יחסים בינאריים נוקשים של שולט-כנוע, שמקבעים ואף מחריפים את מצב השותפים. רענן מיוחס הציע את התרגום \"יחסים משליליים\". מבוי סתום אנליטי (analytic impasse) – משבר ביחסים הטיפוליים שבו אין \"meeting of minds\", אלא \"פינג-פונג\" (בנג'מין) או \"see-saw\" (ארון). שלישי אינטרסובייקטיבי – יצירה משותפת בעלת מאפיינים ריתמיים, סימבוליים ומוסריים. הוא מאפשר מסירות (surrender) כחלופה לשליטה-כניעות. הכרה הדדית / הדדיות א-סימטרית – הקריטריון לבריאות ביחסים. ביחסים היררכיים ההדדיות היא א-סימטרית. המקבילה התוך-נפשית של ההדדיות היא היכולת להכיל פרדוקס בין ביטוי עצמי להכרה באחר. ידע יחסים סמוי (implicit relational knowing) – ייצוג פנימי לא מודע (במובן הפנומנולוגי, לא הדינמי) של פרוצדורות בין-אישיות, שממנו בנויים דפוסי קשר חוזרים. \"מרפסת\" – המטפורה של המחברת לעמדה רפלקטיבית (\"השלישי\"), שממנה המטפל והמטופל צופים יחד במה שקורה ביניהם. \"סולמות\" – תיאוריה, הדרכה, ובמצבי קאונטר-טרנספרנס עוצמתי גם טיפול אישי. הם עוזרים למטפל, שהוא \"חבוש בבית האסורים\", לטפס ראשון למרפסת. מנטליזציה – כפי שהמונח מוגדר במאמר: \"נתינת פשר פנימי להתרחשויות חיצוניות\". הפסיכולוגיה של ההורה – מערך של שני פרדוקסים: ההורה כאובייקט הורי וכסובייקט אנושי, והילד כשלוחה של הוריו וכישות עצמאית."},{"id":"greenwald2012","title":"חשיבה טיפולית במסגרת חינוכית: מתח והשלמה ברמה קלינית וארגונית","authors":"נעמה גרינולד","year":"2012","cite":"גרינולד, נ' (אפריל 2012). חשיבה טיפולית במסגרת חינוכית: מתח והשלמה ברמה קלינית וארגונית. פסיכואקטואליה, 26-37.","url":"https://www.psychology.org.il/sites/psycho/UserContent/files/psycho-actualia/psycho4_12.pdf","kind":"article","desc":null,"urlLabel":"הגיליון המלא של פסיכואקטואליה (PDF), עמ' 26","file":{"orig":"חשיבה טיפולית במסגרת חינוכית מתח והשלמה ברמה קלינית וארגונית, גרינוולד .pdf","ext":"pdf","pdf":"greenwald2012.pdf","pages":16,"bytes":369386},"placements":[["s2","therapy"],["s2","system"]],"extra":false,"ref":"גרינולד 2012","inFolder":true,"srcTitle":"חשיבה טיפולית במסגרת חינוכית: מתח והשלמה ברמה קלינית וארגונית","secs":{"abstract":"<p>המאמר נפתח בהתלבטות של הכותבת משנתה הראשונה כמתמחה בפסיכולוגיה חינוכית. ייעוץ למורה הביא לשינוי התנהגותי מהיר אצל ילד שנחשד שנחשף לאלימות בבית. היא תהתה אם הסרת הסימפטום יצרה דיכוי רגשי, כשהמציאות החיצונית כבר אינה מבטאת את הפנימית, ואם הצטרפה מהר מדי לאג'נדה של הצוות. המאמר עוסק בשתי שאלות: ההגדרה העצמית של איש הטיפול במסגרת חינוכית, והמפגש הבין-מקצועי. הוא מבחין בין \"עמדה חינוכית-הסתגלותית\", שמתעניינת בהסתגלות למשימות נורמטיביות ונמדדת באופן אובייקטיבי, לבין \"עמדה טיפולית-רפלקטיבית\", שחוקרת את העולם הסובייקטיבי. לשתי העמדות מושא שונה, יעדים שונים ופרקטיקות שונות, אבל הן משלימות. ההמשגה נשענת על ההבחנה בין אובייקט טרנספרנסיאלי לאובייקט התפתחותי (אנה פרויד, Hurry), על \"המשחק עם המציאות\" ועל mode of equivalence של פונגי וטרג'ט, ועל מנוני. ברמה הארגונית מתוארים קנאה, פנטזיות פרנואידיות, לחץ \"לדעת\" ולאבחן, לחץ ל\"קו אחיד\", תרבות הישגית, וגם חרדות של המטפל עצמו. בסוף מוצעים כיוונים יישומיים: הכנסת שפה טיפולית לשיח החינוכי, התמקמות כ\"אחר\" בפגישות הראשונות, וניווט בין פרטיות לשיתוף (\"גבול עבה\" מול \"גבול דק\").<\/p>","ideas":"<ul>\n<li>גם התערבות יעילה, כמו שינוי התנהגותי מהיר בעקבות ייעוץ למורה, מעלה שאלות. ייתכן שהסימפטום \"גילם הלימה\" בין המציאות הפנימית לחיצונית, והסרתו יוצרת דיכוי רגשי. על המטפל גם לבחון את הלחצים שגרמו לו להצטרף לאג'נדה הגלויה והסמויה של הצוות.<\/li>\n<li>אנשי מקצוע טיפוליים במוסד חינוכי ממקמים את עצמם על רצף של הזדהות-מובחנות מול הצוות. יועצות נוטות בדרך כלל לשיתופיות, ופסיכולוגים ומטפלים באמנויות למובחנות. האחרונים נתפסים לעיתים כזרים, כמתנשאים או כמי שאינם מבינים את מצוקת הצוות. הגדרה מקצועית אינה סטטית, ובארגון הגבולות דיפוזיים. לכן חשוב שלמטפל יהיו נקודות התייחסות אתיות ברורות.<\/li>\n<li>העמדה החינוכית-הסתגלותית מתעניינת בתפקוד הנורמטיבי (למידה, התנהגות, חברה) ובשינוי שניתן למדידה מוסכמת. העמדה הטיפולית-רפלקטיבית מתעניינת במשמעות שהפרט, הקבוצה או הארגון מייחסים לאירועים. שינוי באחד המישורים אינו מעיד בהכרח על שינוי באחר, ו\"לא ניתן לדעת על הסובייקטיביות ללא חקירה\" של הסובייקט.<\/li>\n<li>שתי העמדות חיוניות ומשלימות להתפתחות תקינה. כדי לנוע ביניהן ולזהות חוסר פרופורציה, למשל השתלטות של העמדה החינוכית על הצורך להכיר בחוויה (או להפך), צריך להבחין ביניהן. ההבחנה היא גם סוגיה ארגונית, כי המפגש הבין-מקצועי מעורר יחסי כוח.<\/li>\n<li>הסביבה החינוכית במיטבה היא \"אובייקט התפתחותי\" שמחזק את כוחות האגו (שליטה, איפוק, ריסון, תכנון, ארגון). המטפל יכול לעזור לצוות להיות ער גם להיבטים הטרנספרנסיאליים שמושלכים עליו. דוגמה: ילד שהורס כל מחמאה, והמורה מבקשת את רשותו לפני שהיא מחמיאה לו.<\/li>\n<li>עמדה טיפולית פירושה הרחבת היכולת \"לשחק עם המציאות\" (פונגי וטרג'ט), כלומר לראות את העצמי ואת האחר כבעלי כוונות ונקודות מבט חלופיות. תקיעות נפשית, אצל ילד, הורה, מורה, מטפל או ארגון, דומה ל-mode of equivalence: ודאות שהמציאות היא בדיוק כפי שהיא נתפסת. לפעמים גם אמפתיה \"ללא סייג\" מצמצמת את מרחב המשחק, כמו במקרה של הנער השכול.<\/li>\n<li>הכותבת מציעה דרך שלישית בין ההתייחסות לקושי כסמל לתוכן אחר (מנוני) לבין ההתייחסות אליו כליקוי קונקרטי בלבד. הדרך השלישית מתמקדת באופן שבו הילד מתמודד עם הלקות, כסיפור על האופן שבו הוא תופס את העולם וחווה את האופן שבו הסביבה תופסת אותו.<\/li>\n<li>מנוני משייכת את העמדה החינוכית לצוות ואת האנליטית למטפלים בלבד. הכותבת סבורה שהגבולות אינם חדים ושיש בכך תועלת: מורים יכולים לפרש, ומטפלים נוקטים לעיתים עמדה חינוכית (למשל אזהרה תקיפה). המטפל אינו מי ש\"מקיימת קליניקה בתוך כותלי בית הספר\" אלא שותף למערך התערבותי רחב, והעמדה נבחרת לפי ההיבט החסר.<\/li>\n<li>ברמה הארגונית המטפל חשוף ל\"התקפות\": קנאה (באינטימיות עם הילד, בפטור מתורנויות, בסודיות), פנטזיות פרנואידיות (\"מה הילד מספר עלינו\"), לחץ לתייג (ADHD וכו') מתוך חוסר סובלנות לאי-ידיעה, לחץ להצטרף ללכידות-יתר ו\"לישר קווים\" מול הורים, ולחץ להצטרף לתרבות של מדידה והישגים. גם המטפל מגן על עצמו, למשל כשהוא \"מסתתר\" מאחורי סודיות מחרדה שיתגלה שאינו יודע.<\/li>\n<li>תזמון ההתערבות קריטי. היא יכולה להצליח לפני שהצוות והילד גיבשו עמדה פנימית סגורה. כשהרגשות ההדדיים כבר עוצמתיים ושליליים, המטפל זקוק ל\"בעל ברית נוסף, השותף לתקווה\" (למשל המנהלת). הימנעות מוחלטת משיתוף מידע יוצרת \"גבול עבה\" שמגביר פיצול והשלכה. \"גבול דק\", בזהירות ובשמירה על פרטיות, מאפשר דיאלוג פורה.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>עמדה חינוכית-הסתגלותית<\/strong> – עמדה שמתעניינת בעיקר בהסתגלות הפרט למשימות שנתפסות כנורמטיביות לגילו (למידה, התנהגות, חברה). השינוי בה נמדד בקריטריונים אובייקטיביים, נצפים ומוסכמים.<\/li>\n<li><strong>עמדה טיפולית-רפלקטיבית<\/strong> – עמדה שחוקרת את העולם הפנימי והסובייקטיבי של הפרט, הקבוצה או הארגון: משמעות, רגשות, סיבות וכוונות. היא אינה מתמקדת בהכרח בעבר או בלא מודע.<\/li>\n<li><strong>אובייקט טרנספרנסיאלי<\/strong> – המטפל כמושא להשלכות המטופל. פעולתו העיקרית היא לחשוף ולפרש רבדים לא מודעים ודפוסי קשר חוזרים.<\/li>\n<li><strong>אובייקט התפתחותי<\/strong> – דמות שמספקת הכרה אמפתית ומשלימה צרכים התפתחותיים שתוסכלו או נעצרו, בלי לספק צורך יצרי. המאמר מרחיב את המושג גם לסביבה החינוכית.<\/li>\n<li><strong>גישה \"בונת אגו\" (\"מרכיבים טיפוליים משניים\")<\/strong> – התערבויות לא פרשניות שאנה פרויד המליצה עליהן במקרים שאינם נוירוטיים, ובעיקר בילדים שעברו טראומה.<\/li>\n<li><strong>משחק עם המציאות (Playing with Reality) / מנטליזציה<\/strong> – מושג של פונגי וטרג'ט: היכולת לשחק עם רעיונות, שעומדת בבסיס המנטליזציה. מנטליזציה היא היכולת לראות את העצמי ואת האחר כבעלי רעיונות, כוונות ורצונות, ולכן לראות באחר מי שעשוי להיות שונה מהעצמי.<\/li>\n<li><strong>Mode of equivalence<\/strong> – מצב מנטלי שבו המציאות הפנימית והחיצונית \"חד הן\". הוא מלווה בוודאות ובקושי להעלות על הדעת חלופה (למשל \"הם בטח לועגים לי\"). המאמר מחיל אותו גם על קבוצות (שעיר לעזאזל) ועל ארגונים (עימות בין צוותים).<\/li>\n<li><strong>מרחב משחק אינטרסובייקטיבי<\/strong> – מרחב המשחק נוצר מהאינטראקציה בין המשתתפים. לכן ההתערבות אפקטיבית יותר כשגם הילד וגם הצוות מרחיבים את יכולת ה\"משחק\" שלהם.<\/li>\n<li><strong>פוליפוניות (רב-קוליות)<\/strong> – ישיבה רב-מקצועית שבה חלק מהמשתתפים מייצגים את ההיבט התפקודי וחלקם את הקול הסובייקטיבי של הילד.<\/li>\n<li><strong>צוות מולטי-, אינטר- וטרנס-דיסציפלינרי<\/strong> – שלושה סוגי שותפות רב-מקצועית (מנור-בנימיני). ראו פירוט בהמשך.<\/li>\n<li><strong>\"גבול עבה\" / \"גבול דק\"<\/strong> – לפי גורביץ'. גבול עבה הוא תת-מערכת טיפולית אטומה לשיתוף, ויוצר מכניסטיות, סגירות ופיצול. גבול דק מאפשר דיאלוג פורה, תוך שמירה על פרטיות וסודיות.<\/li>\n<li><strong>שימוש הגנתי באבחנה<\/strong> – מתן תווית (ADHD, ליקוי בתקשורת) מתוך צורך \"להגיד משהו בעל משמעות\" מול לחץ הצוות, כשהמשימה הטיפולית של חקירת המשמעות עבור הילד אינה מוחזקת על ידי אף גורם.<\/li>\n<\/ul>","models":"<h3>1. שתי העמדות<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>עמדה חינוכית-הסתגלותית<\/th>\n<th>עמדה טיפולית-רפלקטיבית<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>מושא ההתעניינות<\/td>\n<td>הסתגלות הפרט למשימות נורמטיביות שמותאמות לבני הגיל<\/td>\n<td>העולם הסובייקטיבי: המשמעות שהפרט, הקבוצה או הארגון מייחסים לאירועים, הרגשות, הסיבות שמייחסים להם והכוונות לעתיד<\/td>\n<\/tr>\n<tr>\n<td>מדידת שינוי<\/td>\n<td>קריטריונים אובייקטיביים, נצפים ומוסכמים: מבחנים משווים (מיצ\"ב), היענות לדרישות המורים לעומת העבר, התאמה לנורמות חברתיות. אלה מושאי השיטות \"מבוססות הראיות\"<\/td>\n<td>שינוי בעמדה הפנימית. אי אפשר לדעת עליו בלי חקירה ישירה או עקיפה (חומר השלכתי). שינוי התנהגותי אינו מעיד בהכרח על שינוי פנימי, ולהפך<\/td>\n<\/tr>\n<tr>\n<td>תיאוריות<\/td>\n<td>–<\/td>\n<td>פסיכואנליטיות למיניהן, מערכתיות (מייקל וייט) ונרטיביות<\/td>\n<\/tr>\n<tr>\n<td>דוגמה: ר. נמנע ממטלות גרפו-מוטוריות<\/td>\n<td>קצב ההיענות לאימונים וההישגים בכתיבה לאורך זמן<\/td>\n<td>האם הוא חווה את העזרה כמסייעת או כהתקפה? מה עוצמת העלבון? האם העלבון מוכל או מציף? האם הוא מתאמן היום פחות בחרדה, או מתוך מובסות?<\/td>\n<\/tr>\n<tr>\n<td>בפרופסיות ובאבחון<\/td>\n<td>ריפוי בעיסוק וקלינאות תקשורת כשהם עוסקים בתפקוד. רוב חלקי האבחון הפסיכולוגי (השוואה לבני הגיל)<\/td>\n<td>כשהמטפל עוסק במה הילד אוהב, נהנה ממנו או נרתע ממנו. חלקים בראיון ובמבחנים ההשלכתיים שחושפים את תפיסת העצמי, האחרים והיחסים<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>הנחת היסוד היא ששתי העמדות נבדלות בשלושה תחומים: אינן מתעניינות באותו אובייקט, חותרות ליעדים שונים ומבוססות על פרקטיקות שונות. ובכל זאת היחס ביניהן קומפלמנטרי.<\/p>\n<h3>2. שלושת תחומי התפקוד בעמדה החינוכית<\/h3>\n<ul>\n<li><strong>למידה<\/strong>: גרפו-מוטוריקה, חשבון, קריאה וכתיבה, רכישת ידע.<\/li>\n<li><strong>התנהגות<\/strong>: הבנת נורמות ומיומנויות למידה, כמו ישיבה לאורך זמן, הבאת ציוד והתארגנות לפי לוח זמנים יומי או תקופתי.<\/li>\n<li><strong>חברה<\/strong>: קודים כלליים (המתנה בתור, הדדיות בשיחה, ויסות תוקפנות) וניואנסים של תת-תרבות (סוג הומור, סלנג, מחוות גוף).<\/li>\n<\/ul>\n<h3>3. רמות \"הקליינט\" בעמדה הטיפולית<\/h3>\n<ul>\n<li><strong>פרט<\/strong>: תלמיד או תלמידה, מורה או מנהלת.<\/li>\n<li><strong>קבוצה<\/strong>: כיתה או צוות מקצועי.<\/li>\n<li><strong>ארגון<\/strong>: בית הספר, או מערכת החינוך ברשות מקומית.<\/li>\n<\/ul>\n<h3>4. \"מרכיבים טיפוליים משניים\" (אנה פרויד)<\/h3>\n<p>הצעות; אישורים; המללת רגשות; הבהרות על סכנות חיצוניות ופנימיות; הכוונה לשלוט במשאלות ובדחפים במקום לפעול לפיהם; הדרכה לתקשר עם אחרים ולראות אותם כבעלי מחשבות ורגשות נפרדים.\nהמטפל כ\"אובייקט התפתחותי\" מרחיב את מגוון ההתערבויות: מזהיר את הילד מתוצאות שליליות, מעודד אותו להתמודד, מציע לראות חבר או הורה מנקודת מבט אחרת. במקביל הוא נזהר <strong>לא<\/strong> לספק צורך בחברות, במגע או בהערצה.<\/p>\n<h3>5. שלוש עמדות כלפי קושי לימודי<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>עמדה<\/th>\n<th>התייחסות לקושי בחשבון (הדוגמה במאמר)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>אנליטית-קלאסית (מנוני)<\/td>\n<td>הקושי לחבר מספרים מבטא סמלית קושי לחבר בין אנשים וקושי עם קרבה<\/td>\n<\/tr>\n<tr>\n<td>חינוכית עכשווית<\/td>\n<td>היבט נוירולוגי, לקות למידה. \"הקושי הוא מה שקשה\"<\/td>\n<\/tr>\n<tr>\n<td>האופציה השלישית (הכותבת)<\/td>\n<td>התמקדות באופן שבו הילד מתמודד עם הלקות, כסיפור על האופן שבו הוא תופס את העולם וחווה את האופן שבו הסביבה תופסת אותו. המטרה היא להרחיב את מרחב המשחק של הילד, של הצוות ושל ההורים<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>6. מקורות לחץ ו\"התקפה\" על המטפל במסגרת חינוכית<\/h3>\n<ol>\n<li><strong>קנאה<\/strong>: על האינטימיות עם הילד, על הפטור משיתוף במה שקורה בחדר הסגור, ועל אי-ההשתתפות במשימות היומיומיות (למשל תורנות בהפסקות).<\/li>\n<li><strong>פנטזיות פרנואידיות<\/strong> על מה שקורה בחדר הטיפול (\"מה הילד מספר או מתלונן עלינו?\"). לפי מנוני, המטפל נתפס כ\"מציצן, כמרגל, המזוהה עם מי שמנסה כביכול לגנוב את ה'אובייקט הטוב'\".<\/li>\n<li><strong>סובלנות נמוכה לאי-ידיעה<\/strong>: לחץ להבין ולתייג, ומכאן שימוש הגנתי באבחנה.<\/li>\n<li><strong>תהליכים קבוצתיים<\/strong> (ביון): כשהצוות מרגיש מותקף מול ילד, נוצרת תפיסה הומוגנית ולחץ על המטפל \"לישר קווים\". למשל, גיוס הפסיכולוג לייצג את הצוות מול ההורים כדי \"שנהיה עם קו אחיד ומגובש\".<\/li>\n<li><strong>תרבות של התייעלות, הישגיות ומדידה כמותית<\/strong>, ש\"תוקפת\" הוויות דיאלוגיות וחוקרות.<\/li>\n<\/ol>\n<p>ובצד המטפל:<\/p>\n<ol start=\"6\">\n<li>חרדה שהוא אינו מכיר את הילד לעומק יותר מהצוות, או קושי לתרגם את מה שחווה לתובנות יישומיות.<\/li>\n<li>הימנעות מוחלטת משיתוף \"כי זה סודי\", שלפעמים נובעת מחרדה שיתגלה שהוא אינו יודע, ולא רק מאתיקה.<\/li>\n<li>קושי להסביר את המימד הסמלי של משחק וציור. למשל, למה מעבר מציור א-כרומטי לציור צבעוני חשוב, או למה פריצת דרך ביכולת לשחק (במובן הוויניקוטיאני) מרגשת.<\/li>\n<\/ol>\n<h3>7. סוגי עבודה רב-מקצועית (מנור-בנימיני)<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>סוג צוות<\/th>\n<th>אופן העבודה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>מולטי-דיסציפלינרי<\/td>\n<td>כל איש מקצוע מאבחן, מכין ומיישם תוכנית עבודה נפרדת עם הילד או הכיתה<\/td>\n<\/tr>\n<tr>\n<td>אינטר-דיסציפלינרי<\/td>\n<td>כל איש מקצוע מאבחן ומטפל בנפרד, אבל כל העובדים עם הילד נפגשים באופן קבוע לדיווח וליידוע הדדי<\/td>\n<\/tr>\n<tr>\n<td>טרנס-דיסציפלינרי<\/td>\n<td>כל איש מקצוע מאבחן ומטפל בנפרד, אבל תוצאות האבחון ותוכניות העבודה מתגבשות בדיונים משותפים של כל הצוות. יש בו פוטנציאל לחשיבה סינרגטית (כמו במקרה של א., נער עם PDD)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>8. כיוונים יישומיים למטפל במערכת חינוכית<\/h3>\n<p><strong>א. הכנסת שפה טיפולית לשיח החינוכי.<\/strong> לזהות מבני עבודה קיימים (ישיבות פדגוגיות) ולהשמיע בהם בכוונה את הקול הסובייקטיבי. שאלות להעלות:<\/p>\n<ul>\n<li>האם הילד עצמו מוטרד ממצבו התפקודי?<\/li>\n<li>באילו תחומים הוא מרגיש מסוגל, ובאילו הוא חווה קושי?<\/li>\n<li>האם יש לו מוטיבציה לשינוי, ובאיזה תחום?<\/li>\n<li>מהי תפיסת העתיד שלו? למה הוא שואף?<\/li>\n<li>האם הוא מחבר בין התפקוד הנוכחי לבין האפשרות לממש את רצונותיו בהמשך?<\/li>\n<\/ul>\n<p>(להבחין בין זה לבין עבודה על \"סנגור עצמי\". סנגור עצמי הוא מיומנות חברתית-תקשורתית, ואילו בעמדה הטיפולית הבהירות משנית לאפשרות של הילד להתחבר לעצמו.)<\/p>\n<p><strong>בהשתתפות בתוכניות התנהגותיות<\/strong> אין מניעה שהמטפל ישתתף, אבל עליו לא לזנוח את חקירת המשמעות:<\/p>\n<ul>\n<li>האם הילד תופס את התוכנית כמסייעת או כמדכאת?<\/li>\n<li>עם אילו חלקים בה הוא מזדהה, ועם אילו פחות?<\/li>\n<li>באיזו מידה הוא מרגיש שותף לעיצוב התוכנית?<\/li>\n<li>האם השינוי נתפס בעיניו כחלק ממנו או כזר לו?<\/li>\n<li>איך לעצב את הניואנסים של התוכנית בהתאמה לילד הספציפי ולהקשר?<\/li>\n<li>אילו משימות מוגדרות יתבקש לבצע, בהתאמה למוטיבציה ולכוחות שלו ברגע נתון?<\/li>\n<\/ul>\n<p>(הכותבת נוהגת להזמין לחלק מהפגישה, בהסכמת הילד, הורה או מורה שייצגו את הקול \"המוטרד מהתפקוד\". כך היא נשארת מחוץ לשיח התפקודי, הילד אינו \"חייב לה דין וחשבון\", והיא אינה נעשית עבורו אובייקט רודפני.)<\/p>\n<p><strong>ב. שיח טיפולי: התמקמות כ\"אחר\".<\/strong> הפגישות הראשונות קריטיות לעיצוב המסגרת של \"מה שאנו עושים כאן\" (מנוני: \"גורלה של האנליזה נחרץ בחמש הפגישות הראשונות\"). הילד רואה במטפל מישהו ששייך לצוות ובאותו זמן לא שייך לו. הוא מגיע עם תפיסה של עצמו כמאכזב, ובכל זאת עם תקווה ועם מידה של טרנספרנס חיובי. על המטפל להגיב לציפיות האלה כבר בפגישות הראשונות. בדוגמה של ב. (\"אז מה תעשו לי? תעיפו אותי?\") היועצת עשתה שני סימונים:<\/p>\n<ol>\n<li><strong>מובחנות מהצוות<\/strong>: \"אני תוהה אם בכך שאת מגיעה לכאן, את מביעה איזו משאלה פיצפונת, שלפחות אחת מאיתנו תשמור על התקווה...\".<\/li>\n<li><strong>סוג השיח, כלומר פירוש<\/strong>: \"הצבת את עצמך במקום חסין – בך כבר אי אפשר לפגוע\". חשיבות הפירוש אינה ב\"אמיתותו\" אלא בסימון האפשרות שההתנהגות מבטאת כוונות שונות.<\/li>\n<\/ol>\n<p><strong>עיקרון התזמון<\/strong>: התערבות יכולה להניב פרי כשהיא מתרחשת לפני שהצוות והילד גיבשו עמדה פנימית סגורה. כשהרגשות ההדדיים כבר עוצמתיים ושליליים, נדרש \"בעל ברית נוסף, השותף לתקווה\", למשל המנהלת.<\/p>\n<p><strong>ג. פרטיות וסודיות: מעברים על הגבול.<\/strong> האתיקה מחייבת סודיות, אבל הימנעות מוחלטת משיתוף עלולה להיות הרסנית. הפיצול יכול להתרחש:<\/p>\n<ul>\n<li>ברמה התוך-אישית של הילד: חלקים תוקפניים בכיתה ורוך בטיפול.<\/li>\n<li>ברמה הבין-אישית בצוות: פנטזיות פרנואידיות, וכעס על חוסר האונים שמושלך על המטפל כאילו הוא מקור הקשיים.<\/li>\n<li>אצל המטפל עצמו: הזדהות-יתר עם תפיסות הילד, לעיתים בגלל תחושת ניכור שלו מהמערכת.<\/li>\n<\/ul>\n<p>הסיכון לפיצול גדל כשהמטפל מסמן את הטיפול כ\"אקס-טריטוריה\" (גבול עבה). הפתרון הוא דיאלוג מתמיד של השפעה הדדית (\"גבול דק\"), תוך שמירה על פרטיות.<\/p>\n<h3>9. כיווני חשיבה וחקירה להמשך (מתוך הסיכום)<\/h3>\n<ul>\n<li><strong>קליני<\/strong>: איך החשיפה להיבטים ההסתגלותיים של הילד משפיעה על ההקשבה ועל בחירת ההתערבויות? מה הילד חושב ומרגיש על כך שהמטפל יודע עליו פרטים שלא הוא בחר לשתף? אילו רגשות (כעס, אכזבה, הזדהות) מתעוררים במטפל בגלל אירועים מחוץ לחדר? האם החלחול מהסביבה מרחיב את ההקשבה ואת יכולת המנטליזציה, או מכניס את המטפל ל\"סד\" של צורך \"להנפיק תוצאות\"?<\/li>\n<li><strong>מערכתי<\/strong>: עד כמה המערכת מאוזנת בין העמדות. יש מערכות עם \"התלהבות יתר\" מהעמדה הטיפולית, שבהן אנשי הצוות הופכים כולם ל\"משקפים\" או ל\"מפרשים\" של רגשות הילד, ויש מערכות שמצטמצמות לשפה של תוצרים, תפוקות וציונים. מערכות מאוזנות מספקות גם אובייקט התפתחותי וגם אובייקט טרנספרנסיאלי, ומאפשרות לאנשי מקצוע \"לנוע במידה זהירה של אלסטיות\" בין תפקידים.<\/li>\n<li><strong>חברתי<\/strong>: איך השפה הטיפולית מחלחלת לשפה החינוכית? האם הילד נמדד לפי קריטריונים חיצוניים, או לפי מטרות שסימן לעצמו בשיח משותף? למשל, מנהל שמבין שקונפליקטים בצוות נובעים מאי-ודאות וחרדה סביב רפורמות (\"אופק חדש\", \"עוז ותמורה\" – כך בטקסט) מגביר בכך את יכולת המנטליזציה שלו.<\/li>\n<li><strong>ארגוני<\/strong>: לזהות או ליזום מבני שיח ועבודה, למשל השתתפות בישיבות פדגוגיות או מיסוד ישיבות רב-מקצועיות סדירות, כ\"מיכל סביר\" למגע בין השפות. כמו כן לחקור את יחסי הכוחות שבתוכם.<\/li>\n<\/ul>\n<h3>10. המקרים במאמר (לשימוש בהוראה)<\/h3>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>ילד/ה<\/th>\n<th>הסוגיה<\/th>\n<th>הנקודה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>נ. (מקרה הפתיחה, שנת ההתמחות של הכותבת)<\/td>\n<td>ילד עם קשיי התנהגות, חשד לאלימות של האב, הורים שאינם משתפים פעולה. ייעוץ למורה הביא לשינוי מהיר<\/td>\n<td>האם הסרת הסימפטום מדכאת? האם הצטרפתי מהר מדי לאג'נדה של הצוות?<\/td>\n<\/tr>\n<tr>\n<td>ר.<\/td>\n<td>נמנע ממטלות גרפו-מוטוריות<\/td>\n<td>ההבדל בין שאלות חינוכיות לשאלות טיפוליות<\/td>\n<\/tr>\n<tr>\n<td>ע., בן 10<\/td>\n<td>הורס כל מחמאה ומגביר תוקפנות כשמשבחים אותו<\/td>\n<td>ייצוג פנימי של יחסים שבהם \"טוב לא נשאר\". הפתרון: המורה מבקשת את רשותו לפני שהיא מחמיאה<\/td>\n<\/tr>\n<tr>\n<td>קבוצה טיפולית עם בעלי חיים<\/td>\n<td>השלכת תכנים פנימיים על בעלי החיים<\/td>\n<td>גם בקבוצה טיפולית יש התערבויות חינוכיות: הסבר, דרישה לאיפוק, הצבת גבול<\/td>\n<\/tr>\n<tr>\n<td>תלמידה מצטיינת<\/td>\n<td>טקס שינון אינסופי<\/td>\n<td>mode of equivalence: \"רק כך אצליח\"<\/td>\n<\/tr>\n<tr>\n<td>ב., תלמיד חנ\"מ משולב<\/td>\n<td>המרפאה בעיסוק הציעה להשהות את המעבר, והאם הגיבה בזעם<\/td>\n<td>פגיעה במנטליזציה אצל שתיהן: האם חוותה ערעור על היותה אם טובה, והמרפאה לא יכלה לשאת את \"הכישלון\"<\/td>\n<\/tr>\n<tr>\n<td>ד., כיתה י', אח שכול<\/td>\n<td>ירידה בתפקוד, והצוות והמטפל הסבירו אותה באבל בלבד<\/td>\n<td>אמפתיה ללא סייג צמצמה חלופות: אשמת ניצולים והענשה עצמית, או רצון לחזור לשגרה שמעורר בושה<\/td>\n<\/tr>\n<tr>\n<td>ש. (טיפול פרטי של הכותבת)<\/td>\n<td>הזדהות של המטפלת עם תחושת הדחייה של ש. וכעס על הכיתה. שיחה עם המורה חשפה עמדה קורבנית<\/td>\n<td>צריך \"מבוגרים נוספים\" שיחזיקו חלקים של הילד. המטפלת החזיקה את ש. אחרת בתודעתה עוד לפני שיכלה לפרש<\/td>\n<\/tr>\n<tr>\n<td>א., בן 16 עם PDD בכיתת תקשורת<\/td>\n<td>פחד שיהיה \"מנקה רחובות או הומלס\", ופגיעה בצוות (\"אעבור לבית ספר אחר\")<\/td>\n<td>פירוש ההשלכה (הצוות כ\"מחסום\") יחד עם יעד ריאלי (תעודת 12 שנות לימוד) הרחיבו את \"המשחק עם המציאות\". דוגמה לחשיבה טרנס-דיסציפלינרית<\/td>\n<\/tr>\n<tr>\n<td>מתבגר שהיכה בת כיתה / תלמיד עם התנהגות סחטנית<\/td>\n<td>מטפלת שמזהירה בתקיפות, ומחנכת שמפרשת<\/td>\n<td>חציית תפקידים מועילה בין העמדות<\/td>\n<\/tr>\n<tr>\n<td>ג. והטיול השנתי<\/td>\n<td>הצוות רצה למנוע את השתתפותו, והיועצת חששה מאישור החוויה הרודפנית שלו<\/td>\n<td>רק מודעות לכך שהעמדות מתעניינות באובייקט שונה (משמעת מול חוויה) מאפשרת להמשיך להידיין ולמצוא חלופה יצירתית, בלי שעמדה אחת \"תבלע\" את השנייה<\/td>\n<\/tr>\n<tr>\n<td>ב., נערה שכמעט אינה מתפקדת<\/td>\n<td>\"אז מה תעשו לי? תעיפו אותי?\"<\/td>\n<td>התמקמות כ\"אחר\" ופירוש. ההתערבות הגיעה מאוחר מדי וחסר בה שותף לתקווה<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>","practice":"<ul>\n<li>בישיבות פדגוגיות ורב-מקצועיות, להשמיע בכוונה את הקול הסובייקטיבי של הילד. אפשר להיעזר ברשימת השאלות (האם הוא עצמו מוטרד? במה הוא מרגיש מסוגל? מה הוא רוצה לעתיד?).<\/li>\n<li>כשמבקשים ממך \"להגיד מה יש לו\", לשים לב לפיתוי לתת אבחנה כדי להפיג את אי-הידיעה. לשאול אם האבחנה משרתת הקצאת משאבים או משמשת שימוש הגנתי-מסיט.<\/li>\n<li>כשאתה שותף לתוכנית התנהגותית, לבדוק איך הילד מבין אותה וחווה אותה, ולעזור להתאים את הניואנסים אליו. כדאי לשקול אם להשאיר את \"הקול התפקודי\" להורה או למורה.<\/li>\n<li>להיזהר מגיוס ל\"קו אחיד\" מול ההורים, ומהצטרפות מהירה לאג'נדה של הצוות. כדאי לשאול את עצמך אילו לחצים פועלים עליך.<\/li>\n<li>לא להסתתר מאחורי \"זה סודי\". אפשר לשתף את הצוות בהבנות ובתהליך באופן שמכבד את פרטיות הילד (\"גבול דק\"), כי אטימות מגבירה פנטזיות פרנואידיות ופיצול.<\/li>\n<li>בפגישות הראשונות עם ילד שהופנה, למקם את עצמך במפורש כמי ששונה מהצוות ומזמין שיח אחר. אפשר לבחור לפרש את ההתנהגות ולא רק לדון בעמידה בנורמה.<\/li>\n<li>להתערב מוקדם, לפני שהצוות והילד מתבצרים בעמדות. במקרה שמגיע מאוחר, לחפש בעל ברית במערכת \"שותף לתקווה\".<\/li>\n<li>כשאתה מוצא את עצמך מזדהה לגמרי עם הילד נגד הצוות, או עם הצוות נגד הילד, זה סימן לחפש נקודת מבט נוספת (שיחה עם המורה, הדרכה) ולנסות להחזיק את הילד אחרת בראש, גם לפני שיש פירוש.<\/li>\n<\/ul>","questions":"<ul>\n<li>במקרה שאני מלווה עכשיו, איזו עמדה, חינוכית או טיפולית, דומיננטית אצלי ואצל הצוות? מה חסר ומי יכול להחזיק אותו?<\/li>\n<li>מתי הצטרפתי \"מהר מדי\" לאג'נדה של הצוות או של ההורים? אילו לחצים פעלו עליי?<\/li>\n<li>איפה אני ממקם את הגבול בין סודיות לשיתוף בבית הספר שלי? האם הגבול \"עבה\" מדי או \"דק\" מדי, ומה ההשלכות?<\/li>\n<li>איפה אני או הצוות נמצאים ב-mode of equivalence ביחס לילד (\"ברור שהוא לא שם עלינו\")? איך אפשר להרחיב את \"המשחק עם המציאות\"?<\/li>\n<li>אילו רגשות שליליים (קנאה, חשד) מופנים אליי כאיש טיפול בבית הספר? איך אני מגיב אליהם?<\/li>\n<\/ul>","quotes":"<ul>\n<li>\"חשוב להכיר בכך, שלא ניתן לדעת על הסובייקטיביות ללא חקירה ישירה או עקיפה (באמצעות חומר השלכתי) של הסובייקט!\"<\/li>\n<li>\"אני מחזיקה בתפיסת עבודה שאיננה רואה בדמות הטיפולית מי שמקיימת קליניקה בתוך כותלי בית הספר, אלא שותפה למערך התערבותי רחב.\"<\/li>\n<li>\"התערבות יכולה להניב פרי, כאשר היא מתרחשת לפני שהצוות והילד גיבשו עמדה פנימית סגורה.\"<\/li>\n<li>\"מערכות מאוזנות מספקות מגוון רחב של אובייקטים – אובייקט התפתחותי, בצד אובייקט טרנספרסניאלי.\"<\/li>\n<\/ul>"},"level":"שנים ב'-ג' (מקרה הפתיחה, שמתאר את שנת ההתמחות הראשונה של הכותבת, ופרק \"כיוונים יישומיים\" מתאימים כבר לשנה א')","stype":"מאמר","tldr":"המאמר נפתח בהתלבטות של הכותבת משנתה הראשונה כמתמחה בפסיכולוגיה חינוכית. ייעוץ למורה הביא לשינוי התנהגותי מהיר אצל ילד שנחשד שנחשף לאלימות בבית. היא תהתה אם הסרת הסימפטום יצרה דיכוי רגשי, כשהמציאות החיצונית כבר אינה מבטאת את הפנימית, ואם הצטרפה מהר…","search":"המאמר נפתח בהתלבטות של הכותבת משנתה הראשונה כמתמחה בפסיכולוגיה חינוכית. ייעוץ למורה הביא לשינוי התנהגותי מהיר אצל ילד שנחשד שנחשף לאלימות בבית. היא תהתה אם הסרת הסימפטום יצרה דיכוי רגשי, כשהמציאות החיצונית כבר אינה מבטאת את הפנימית, ואם הצטרפה מהר מדי לאג'נדה של הצוות. המאמר עוסק בשתי שאלות: ההגדרה העצמית של איש הטיפול במסגרת חינוכית, והמפגש הבין-מקצועי. הוא מבחין בין \"עמדה חינוכית-הסתגלותית\", שמתעניינת בהסתגלות למשימות נורמטיביות ונמדדת באופן אובייקטיבי, לבין \"עמדה טיפולית-רפלקטיבית\", שחוקרת את העולם הסובייקטיבי. לשתי העמדות מושא שונה, יעדים שונים ופרקטיקות שונות, אבל הן משלימות. ההמשגה נשענת על ההבחנה בין אובייקט טרנספרנסיאלי לאובייקט התפתחותי (אנה פרויד, Hurry), על \"המשחק עם המציאות\" ועל mode of equivalence של פונגי וטרג'ט, ועל מנוני. ברמה הארגונית מתוארים קנאה, פנטזיות פרנואידיות, לחץ \"לדעת\" ולאבחן, לחץ ל\"קו אחיד\", תרבות הישגית, וגם חרדות של המטפל עצמו. בסוף מוצעים כיוונים יישומיים: הכנסת שפה טיפולית לשיח החינוכי, התמקמות כ\"אחר\" בפגישות הראשונות, וניווט בין פרטיות לשיתוף (\"גבול עבה\" מול \"גבול דק\"). גם התערבות יעילה, כמו שינוי התנהגותי מהיר בעקבות ייעוץ למורה, מעלה שאלות. ייתכן שהסימפטום \"גילם הלימה\" בין המציאות הפנימית לחיצונית, והסרתו יוצרת דיכוי רגשי. על המטפל גם לבחון את הלחצים שגרמו לו להצטרף לאג'נדה הגלויה והסמויה של הצוות. אנשי מקצוע טיפוליים במוסד חינוכי ממקמים את עצמם על רצף של הזדהות-מובחנות מול הצוות. יועצות נוטות בדרך כלל לשיתופיות, ופסיכולוגים ומטפלים באמנויות למובחנות. האחרונים נתפסים לעיתים כזרים, כמתנשאים או כמי שאינם מבינים את מצוקת הצוות. הגדרה מקצועית אינה סטטית, ובארגון הגבולות דיפוזיים. לכן חשוב שלמטפל יהיו נקודות התייחסות אתיות ברורות. העמדה החינוכית-הסתגלותית מתעניינת בתפקוד הנורמטיבי (למידה, התנהגות, חברה) ובשינוי שניתן למדידה מוסכמת. העמדה הטיפולית-רפלקטיבית מתעניינת במשמעות שהפרט, הקבוצה או הארגון מייחסים לאירועים. שינוי באחד המישורים אינו מעיד בהכרח על שינוי באחר, ו\"לא ניתן לדעת על הסובייקטיביות ללא חקירה\" של הסובייקט. שתי העמדות חיוניות ומשלימות להתפתחות תקינה. כדי לנוע ביניהן ולזהות חוסר פרופורציה, למשל השתלטות של העמדה החינוכית על הצורך להכיר בחוויה (או להפך), צריך להבחין ביניהן. ההבחנה היא גם סוגיה ארגונית, כי המפגש הבין-מקצועי מעורר יחסי כוח. הסביבה החינוכית במיטבה היא \"אובייקט התפתחותי\" שמחזק את כוחות האגו (שליטה, איפוק, ריסון, תכנון, ארגון). המטפל יכול לעזור לצוות להיות ער גם להיבטים הטרנספרנסיאליים שמושלכים עליו. דוגמה: ילד שהורס כל מחמאה, והמורה מבקשת את רשותו לפני שהיא מחמיאה לו. עמדה טיפולית פירושה הרחבת היכולת \"לשחק עם המציאות\" (פונגי וטרג'ט), כלומר לראות את העצמי ואת האחר כבעלי כוונות ונקודות מבט חלופיות. תקיעות נפשית, אצל ילד, הורה, מורה, מטפל או ארגון, דומה ל-mode of equivalence: ודאות שהמציאות היא בדיוק כפי שהיא נתפסת. לפעמים גם אמפתיה \"ללא סייג\" מצמצמת את מרחב המשחק, כמו במקרה של הנער השכול. הכותבת מציעה דרך שלישית בין ההתייחסות לקושי כסמל לתוכן אחר (מנוני) לבין ההתייחסות אליו כליקוי קונקרטי בלבד. הדרך השלישית מתמקדת באופן שבו הילד מתמודד עם הלקות, כסיפור על האופן שבו הוא תופס את העולם וחווה את האופן שבו הסביבה תופסת אותו. מנוני משייכת את העמדה החינוכית לצוות ואת האנליטית למטפלים בלבד. הכותבת סבורה שהגבולות אינם חדים ושיש בכך תועלת: מורים יכולים לפרש, ומטפלים נוקטים לעיתים עמדה חינוכית (למשל אזהרה תקיפה). המטפל אינו מי ש\"מקיימת קליניקה בתוך כותלי בית הספר\" אלא שותף למערך התערבותי רחב, והעמדה נבחרת לפי ההיבט החסר. ברמה הארגונית המטפל חשוף ל\"התקפות\": קנאה (באינטימיות עם הילד, בפטור מתורנויות, בסודיות), פנטזיות פרנואידיות (\"מה הילד מספר עלינו\"), לחץ לתייג (ADHD וכו') מתוך חוסר סובלנות לאי-ידיעה, לחץ להצטרף ללכידות-יתר ו\"לישר קווים\" מול הורים, ולחץ להצטרף לתרבות של מדידה והישגים. גם המטפל מגן על עצמו, למשל כשהוא \"מסתתר\" מאחורי סודיות מחרדה שיתגלה שאינו יודע. תזמון ההתערבות קריטי. היא יכולה להצליח לפני שהצוות והילד גיבשו עמדה פנימית סגורה. כשהרגשות ההדדיים כבר עוצמתיים ושליליים, המטפל זקוק ל\"בעל ברית נוסף, השותף לתקווה\" (למשל המנהלת). הימנעות מוחלטת משיתוף מידע יוצרת \"גבול עבה\" שמגביר פיצול והשלכה. \"גבול דק\", בזהירות ובשמירה על פרטיות, מאפשר דיאלוג פורה. עמדה חינוכית-הסתגלותית – עמדה שמתעניינת בעיקר בהסתגלות הפרט למשימות שנתפסות כנורמטיביות לגילו (למידה, התנהגות, חברה). השינוי בה נמדד בקריטריונים אובייקטיביים, נצפים ומוסכמים. עמדה טיפולית-רפלקטיבית – עמדה שחוקרת את העולם הפנימי והסובייקטיבי של הפרט, הקבוצה או הארגון: משמעות, רגשות, סיבות וכוונות. היא אינה מתמקדת בהכרח בעבר או בלא מודע. אובייקט טרנספרנסיאלי – המטפל כמושא להשלכות המטופל. פעולתו העיקרית היא לחשוף ולפרש רבדים לא מודעים ודפוסי קשר חוזרים. אובייקט התפתחותי – דמות שמספקת הכרה אמפתית ומשלימה צרכים התפתחותיים שתוסכלו או נעצרו, בלי לספק צורך יצרי. המאמר מרחיב את המושג גם לסביבה החינוכית. גישה \"בונת אגו\" (\"מרכיבים טיפוליים משניים\") – התערבויות לא פרשניות שאנה פרויד המליצה עליהן במקרים שאינם נוירוטיים, ובעיקר בילדים שעברו טראומה. משחק עם המציאות (Playing with Reality) / מנטליזציה – מושג של פונגי וטרג'ט: היכולת לשחק עם רעיונות, שעומדת בבסיס המנטליזציה. מנטליזציה היא היכולת לראות את העצמי ואת האחר כבעלי רעיונות, כוונות ורצונות, ולכן לראות באחר מי שעשוי להיות שונה מהעצמי. Mode of equivalence – מצב מנטלי שבו המציאות הפנימית והחיצונית \"חד הן\". הוא מלווה בוודאות ובקושי להעלות על הדעת חלופה (למשל \"הם בטח לועגים לי\"). המאמר מחיל אותו גם על קבוצות (שעיר לעזאזל) ועל ארגונים (עימות בין צוותים). מרחב משחק אינטרסובייקטיבי – מרחב המשחק נוצר מהאינטראקציה בין המשתתפים. לכן ההתערבות אפקטיבית יותר כשגם הילד וגם הצוות מרחיבים את יכולת ה\"משחק\" שלהם. פוליפוניות (רב-קוליות) – ישיבה רב-מקצועית שבה חלק מהמשתתפים מייצגים את ההיבט התפקודי וחלקם את הקול הסובייקטיבי של הילד. צוות מולטי-, אינטר- וטרנס-דיסציפלינרי – שלושה סוגי שותפות רב-מקצועית (מנור-בנימיני). ראו פירוט בהמשך. \"גבול עבה\" / \"גבול דק\" – לפי גורביץ'. גבול עבה הוא תת-מערכת טיפולית אטומה לשיתוף, ויוצר מכניסטיות, סגירות ופיצול. גבול דק מאפשר דיאלוג פורה, תוך שמירה על פרטיות וסודיות. שימוש הגנתי באבחנה – מתן תווית (ADHD, ליקוי בתקשורת) מתוך צורך \"להגיד משהו בעל משמעות\" מול לחץ הצוות, כשהמשימה הטיפולית של חקירת המשמעות עבור הילד אינה מוחזקת על ידי אף גורם."},{"id":"aron","title":"להכיר ולהיות מוכר","authors":"ל' ארון","year":"","cite":"ארון, ל'. להכיר ולהיות מוכר.","url":null,"kind":"article","desc":"טקסט של ל' ארון על ההדדיות במפגש הטיפולי. גנץ נשענת על ארון במאמרה על טיפול בהורים.","placements":[["s2","therapy"]],"extra":false,"ref":"ארון","inFolder":false,"tldr":"טקסט של ל' ארון על ההדדיות במפגש הטיפולי. גנץ נשענת על ארון במאמרה על טיפול בהורים.","search":"טקסט של ל' ארון על ההדדיות במפגש הטיפולי. גנץ נשענת על ארון במאמרה על טיפול בהורים."},{"id":"bahat","title":"משולש האבחנה הפסיכודינמית (פורמולציה דינמית)","authors":"דפנה בהט","year":"","cite":"בהט, ד'. פורמולציה דינמית.","url":null,"kind":"article","desc":null,"file":{"orig":"פורמולציה דינמית דפנה בהט.doc","ext":"doc","pdf":"bahat.pdf","pages":13,"bytes":170088},"placements":[["s2","therapy"]],"extra":false,"ref":"בהט","inFolder":true,"srcTitle":"משולש האבחנה הפסיכודינאמית: הצעה למודל דידקטי לחידוד האינטגרציה בהבנת המטופל","secs":{"abstract":"<p>המחברת מלמדת ומדריכה אנשי טיפול ובוחנת מתמחים בפסיכולוגיה קלינית. היא מזהה קושי נפוץ בניסוח המשגה דינאמית: ההמשגות יוצאות לרוב \"גנריות\", כאלה שמתאימות כמעט לכל מטופל (\"חסר בסביבה הורית מחזיקה\", \"העדר זולת-עצמי אמפתי\"). כמו תיאור הורוסקופי (אפקט ברנום), הן נכונות לכולם ואינן אומרות הרבה. לדבריה, הסיבה היא בעיקר חרדה מפני יצירת תיאוריה אישית, במיוחד לקראת בחינה, ונטייה להיצמד לתיאוריה \"שבמקרה נקראה אחרונה\". המאמר מציע \"משולש ההמשגה הדינאמית\" שעומד על ראשו. שלושת קדקודיו הם (1) אנמנזה (קונסטיטוציה וסביבה), (2) ההווה (סימפטומים, התנהגות או סיטואציה כוללנית, העברה, העברה נגדית), ו-(3) תיאוריה מחברת. המחברת מעדיפה את המונח \"המשגה\" או \"פורמולציה\" על פני \"אבחנה\", כי זו השערת עבודה דינאמית ומתפתחת ולא קביעה סופית. היא מוסיפה לממדים של קרנברג (חומרת המבנה, מופנמות-מוחצנות) \"ממד עומק\" אישי וייחודי. בשתי דוגמאות קליניות עם אותה אבחנה פנומנולוגית היא מראה כיצד מטאפורות שעולות מהטיפול (\"ערסל עם חורים\", \"התאמה ואי-התאמה\") הופכות המשגה \"יבשה\" להמשגה \"תפורה ביד\". להמשגה כזו יש גם ערך טיפולי: היא משפרת את דיוק ההתערבויות.<\/p>","ideas":"<ul>\n<li>המשגות דינאמיות רבות (בדו\"חות אבחון, בהצגות מקרה ובבחינות) הן \"גנריות ומיוצרות בקונפקציה\". הן משאירות בחוץ חלק גדול מפרטי האנמנזה ומהטיפול, ויוצרות \"תיאור חיוור\".<\/li>\n<li>מקור הקושי הוא חרדה מפני תיאוריה אישית ופרטיקולרית. החרדה מובילה להיצמדות למשפטים תיאורטיים כוללניים ולהישענות יתר על תיאוריה שנבחרה מראש לפי \"הצייטגייסט\".<\/li>\n<li>לכל אחד מאיתנו אותם מרכיבים בסיסיים (דחפים, אדיפוס, פגיעוּת נרקיסיסטית), אבל \"האדיפוס של האחד אינו דומה לאדיפוס של האחר\". ה\"תבלינים\" הייחודיים הם מה שצריך ללכוד.<\/li>\n<li>ההמשגה אינה רק תרגיל דידקטי. לנסח לעצמנו בכל רגע הבנה טנטטיבית (\"מה קורה כאן? מה הסיפור של המטופל?\") זו דרך \"לחשוב את המטופל\" ולחבר בין העברה לדינמיקה, בין עבר להווה ובין גלוי לסמוי.<\/li>\n<li>\"ללא זיכרון וללא תשוקה\" אינו סותר המשגה. לעיתים קרובות הוא \"מובן שלא כהלכה\" ומשמש הגנה בשירות אי ההתחייבות ו\"התקפה על החיבורים\", \"עד כדי עצלות מחשבתית\". דרושה תנועה פרדוקסלית בין שהייה באי ידיעה לבין חיפוש מתמיד אחר הבנה.<\/li>\n<li>\"פורמולציה\" עדיפה על \"אבחנה\". אבחנה היא מונח סטטי ומבחין, שבהקשר הרפואי נחשב סופי. פורמולציה היא פעולה מתמשכת, יצירה והשערת עבודה שמעוצבת שוב ושוב. מדובר ב\"קונסטלציה נפשית\" ולא בסיבתיות לינארית (\"הרכבה רכה\", מערכות מורכבות).<\/li>\n<li>המשולש מאפשר תנועה מההווה אל העבר ובחזרה ומהגלוי אל הסמוי ובחזרה, והתיאוריה מחברת ביניהם. גם האנמנזה עצמה היא הבנייה תיאורטית, כי אנו בוחרים מה לשאול ומה לזכור.<\/li>\n<li>לפעמים מקרה \"מקפיץ\" תיאוריה: התיאוריה \"כופה עצמה\" עלינו ולא אנחנו כופים אותה על המקרה. לבניית המשגה יש ממד דדוקטיבי וגם ממד אינדוקטיבי (Perry et al.). המודל מתאים גם לתיאוריות לא פסיכואנליטיות, למשל סכמות ב-CBT.<\/li>\n<li>כדאי להכליל בהמשגה מושגים אידיוסינקרטיים מעולמו ומשפתו של המטופל או מהחוויה המשותפת בטיפול. החיפוש אחריהם מחייב התבוננות קרובה יותר בסיטואציה ההעברתית ובהעברה הנגדית, ומשפר את דיוק הפירושים ואת אופי הנוכחות הטיפולית.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>המשגה / פורמולציה דינאמית<\/strong> – השערת עבודה, נכונה לנקודת זמן מסוימת, על \"איך המטופל הגיע עד הלום\". היא שואפת לאמת רגשית ואינה אמת עובדתית בלעדית.<\/li>\n<li><strong>אבחנה דינאמית<\/strong> – המונח שהמחברת מעדיפה פחות: מצמצם, סטטי ו\"סופי\".<\/li>\n<li><strong>אפקט ברנום<\/strong> – הטיה קוגניטיבית שבה אדם מייחס דיוק גבוה לתיאור מעורפל שמתאים לרבים. אצל המחברת זו מטפורה להמשגה גנרית.<\/li>\n<li><strong>משולש ההמשגה הדינאמית<\/strong> – משולש שעומד על ראשו, ושלושת קדקודיו (אנמנזה, הווה, תיאוריה מחברת) יוצרים ביניהם מרחב דינאמי.<\/li>\n<li><strong>סיטואציה כוללנית (Total situation; Joseph)<\/strong> – ההתנהגות הכוללת של המטופל, כולל במוסד (מחלקה, פנימייה). היא חלון למרכיבים העברתיים ולעולם הפנימי.<\/li>\n<li><strong>\"בחירת\" הסימפטום (Freud, 1913)<\/strong> – הסימפטום מסתיר, אבל גם מספר משהו על מה שהוסתר.<\/li>\n<li><strong>הרכבה רכה (Soft assembly; Harris)<\/strong> / <strong>מערכת מורכבת<\/strong> – הגורמים מתחברים לכדי אישיות באופן לא לינארי, בהשפעת תורת הכאוס.<\/li>\n<li><strong>ממד העומק<\/strong> – ממד שלישי שהמחברת מוסיפה לשני הצירים של קרנברג (חומרת הפגיעה במבנה האישיות; מופנמות-מוחצנות). הוא מתייחס להיבטים האישיים והייחודיים.<\/li>\n<li><strong>\"ללא זיכרון וללא תשוקה\" / Negative capability<\/strong> – עמדה של שהייה באי ידיעה. היא אינה מחליפה את המאמץ להמשיג, ושימוש הגנתי בה מסוכן.<\/li>\n<li><strong>\"עמוד ענן לפני המחנה\"<\/strong> – מטאפורה למקומה של ההמשגה בטיפול: לפעמים לפנינו, לפעמים מאחורינו ולפעמים עוטפת אותנו. צריך להחזיק בה באחיזה שאינה חזקה מדי.<\/li>\n<li><strong>\"תבלינים\" / קונפיגורציה אישית<\/strong> – הצירוף החד-פעמי שמבדיל מטופל ממטופלים אחרים עם אותה אבחנה.<\/li>\n<\/ul>","models":"<p><strong>שתי מטרות המודל:<\/strong><\/p>\n<ol>\n<li>הבנייה דידקטית ומסודרת של המרכיבים המוכרים של ההמשגה הדינאמית, כדי להטמיע את צורת החשיבה הדינאמית.<\/li>\n<li>קידום המשגה ייחודית וקרובה לחוויה, \"תפורה ביד ולא בקונפקציה\".<\/li>\n<\/ol>\n<p><strong>משולש ההמשגה הדינאמית (משולש שעומד על ראשו):<\/strong><\/p>\n<p><strong>קדקוד 1 – אנמנזה (תורשה וסביבה):<\/strong> היסטוריה, רקע קונסטיטוציוני, נסיבתי וסביבתי. \"נתוני הפתיחה\", המצע, המשאבים והחוסרים.<\/p>\n<ul>\n<li>א. המערוכת (הקונסטיטוציה) המולדת: טמפרמנט, מגדר, מבנה פיזי, אינטליגנציה, לקויות למיניהן. חלק מהם ממשיכים להשפיע גם בהווה, למשל הפרעת קשב, נכות, גובה, משקל, עוצמת דחף.<\/li>\n<li>ב. סביבה:<ul>\n<li>ב1. הסביבה המשפחתית שבה גדל (אופי הקשר עם הדמויות המטפלות).<\/li>\n<li>ב2. אירועים נסיבתיים (סדר לידה, אירועים בלידה ואחריה, מעברים).<\/li>\n<li>ב3. אירועים טראומטיים או אירועים מעצבים אחרים.<\/li>\n<li>ב4. הסביבה וההקשר החברתיים (כולל מצב סוציו-אקונומי ותרבות). המחברת מעירה שההיבטים האלה לא נכללים מספיק בדיונים פסיכואנליטיים.<\/li>\n<\/ul>\n<\/li>\n<li>גם יחסי הגומלין בין המרכיבים, למשל תינוק סוער ודמות מטפלת דיכאונית.<\/li>\n<li>החלוקה ב1–ב4 דידקטית ואינה מחייבת. רוב התוכן מגיע ממה שהמטופל מספר, וחלקו גלוי לעין.<\/li>\n<\/ul>\n<p><strong>קדקוד 2 – ההווה (הגלוי והסמוי), \"קצה הקרחון\" או ה\"תוצאה\":<\/strong><\/p>\n<ol>\n<li>הסימפטומים: \"בחירת\" הסימפטום מספרת על מה שבבסיסו.<\/li>\n<li>ההתנהגות הכללית או הסיטואציה הכוללנית (Joseph), כולל ההתנהלות במוסד.<\/li>\n<li>העברה.<\/li>\n<li>העברה נגדית.\n- מחפשים חיבורים בין משמעות הסימפטום לבין הסיטואציה הכוללנית, ההעברה וההעברה הנגדית.<\/li>\n<\/ol>\n<p><strong>קדקוד 3 – תיאוריה מחברת:<\/strong><\/p>\n<ul>\n<li>מחברת בין ה\"למה\" (אנמנזה, סיבות, קונסטיטוציה) לבין ה\"מה\" (התוצאה, \"הפתרון החלקי שהנפש מוצאת לה\").<\/li>\n<li>מאפשרת השערות על מבנה האישיות, על יחסי האובייקט המופנמים ועל ההגנות הרווחות.<\/li>\n<li>כוללת גם תיאוריה פורמלית ומקובלת וגם מושגים אישיים ואידיוסינקרטיים שעולים מהטיפול.<\/li>\n<li>מתאימה גם לתיאוריות לא פסיכואנליטיות (למשל סכמות ב-CBT). יש בה ממד דדוקטיבי וממד אינדוקטיבי.<\/li>\n<\/ul>\n<p><strong>הרחבת המודל של קרנברג:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>ממד<\/th>\n<th>תוכן<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ציר האורך (קרנברג)<\/td>\n<td>מבנה האישיות: חומרת הפגיעה בחוזק המבנים הפסיכולוגיים<\/td>\n<\/tr>\n<tr>\n<td>ציר הרוחב (קרנברג)<\/td>\n<td>מופנמות מול מוחצנות<\/td>\n<\/tr>\n<tr>\n<td>ממד העומק (תוספת המחברת)<\/td>\n<td>היבטים אישיים וייחודיים: ה\"תבלינים\", המטאפורות והתימות של המטופל המסוים<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>אבחנה לעומת פורמולציה:<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>אבחנה<\/th>\n<th>פורמולציה / המשגה<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>מצמצמת וסטטית<\/td>\n<td>תנועה, יצירה, דינאמיות<\/td>\n<\/tr>\n<tr>\n<td>מבחינה בין מחלה למחלה<\/td>\n<td>השערת עבודה שמתפתחת<\/td>\n<\/tr>\n<tr>\n<td>סופית (בהקשר הרפואי)<\/td>\n<td>מתמשכת, טנטטיבית, משתנה<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>דוגמה 1 – \"ערסל עם חורים\":<\/strong> מטופל עם חרדות, שמגיע ולא מגיע לטיפול ושב בכעס. בעברו פגוּת והורים צעירים שמתקשים בהחזקה. הוא איבד את מפתח הבית כשנפל מערסל עם חורים, ומשם התפתחה מטאפורה משותפת.<\/p>\n<ul>\n<li>המשגה גנרית: \"סביבה לא מחזיקה דיה\" (ויניקוט), \"צרכי זולת-עצמי לא סופקו\" (קוהוט), \"מיכל לא יציב\" (ביון). המשפטים נכונים, אבל מתאימים לרוב המטופלים.<\/li>\n<li>המשגה ייחודית: הורים שניסו ו\"התקינו ערסל\", אלא שהיו בו חורים גדולים מדי (האינקובטור, הטיפול ההורי). החרדה היא בהלה כשנשמט ותחושת עצמי מחוררת. ההיעדרויות מבטאות קושי בעקביות. בהזדהות השלכתית המטפל מרגיש ננטש ומבולבל, והן גם מבטאות ניסיון לגרום למטפל \"להדק את הערסל\". הכעס מופנה כלפי האכזבה. הדפוס הוא התרחקות (\"אסתדר לבד\"), אחריה התקרבות כשצורכי התלות גוברים, וחוזר חלילה.<\/li>\n<\/ul>\n<p><strong>דוגמה 2 – \"התאמה ואי-התאמה\":<\/strong> נערה בקהילה טיפולית. אחרי פגישות קרובות ומרגשות היא מתחילה להשמיץ את המטפל (\"לא מתאים לי\"). בהדרכת האם עולה שהאם, חד-הורית ויחידנית שהרתה אחרי טיפולי הפריה ותרומת זרע, הרגישה אחרי הלידה שהתינוקת \"אינה מתאימה לה\" (שיער בהיר, מזג עירני ועצבני, קשיי הנקה). ההמשגה מרחיבה את האבחנה (נרקיסיסטית עם קווים גבוליים, פיצולים, אידאליזציה ודה-ואלואציה) ומוסיפה את התימה של \"התאמה ואי-התאמה\" כתוכן הפיצולים: בהעברה משוחזרת חוויה ראשונית של התאמה, ואחריה חוויה של דחייה.<\/p>\n<p><strong>שאלת ה\"רגיל\":<\/strong> להורה שאומר \"הייתה לי ילדות רגילה\" המחברת עונה: \"יש רגיל צהוב, ורגיל אדום, ורגילה עם פסים... איזו מין רגילה הייתה הילדות שלך?\". את אותה שאלה כדאי לשאול כשממשיגים: מהם ה\"תבלינים\" של המטופל?<\/p>","practice":"<ul>\n<li>כשכותבים המשגה (בדו\"ח אבחון, בסיכום טיפול או בהצגת מקרה), עברו על שלושת הקדקודים באופן מסודר: אנמנזה (א, ב1–ב4 ויחסי הגומלין), הווה (סימפטום, סיטואציה כוללנית, העברה, העברה נגדית), ותיאוריה מחברת.<\/li>\n<li>\"מבחן ברנום\": על כל משפט בהמשגה שאל/י אם הוא היה מתאים גם לרוב המטופלים שלך. אם כן, חפש/י את מה שייחודי למטופל הזה.<\/li>\n<li>שים/י לב למטאפורות, למילים ולדימויים שחוזרים בטיפול (אצל המטופל, אצל ההורים או אצלך). הם יכולים להפוך למושג המארגן של ההמשגה.<\/li>\n<li>השתמש/י בהתנהגות בטיפול (היעדרויות, כעס, השמצה, בקשות לשינוי סטינג) ובהעברה הנגדית שלך כמקור מידע מרכזי, ולא רק בסיפור האנמנסטי.<\/li>\n<li>אל תשמיט/י פרטי רקע שהופיעו באנמנזה, ובמיוחד הקשר סוציו-אקונומי, תרבותי או קונסטיטוציוני (למשל הפרעת קשב), רק כי הם לא \"מסתדרים\" עם התיאוריה.<\/li>\n<li>כשהורה אומר \"הכול היה רגיל\", שאל/י \"איזה מין רגיל?\".<\/li>\n<li>התייחס/י להמשגה כהשערת עבודה שמתעדכנת (\"עמוד ענן\"). אל תחזיק/י בה חזק מדי, אבל אל תשתמש/י ב\"אי ידיעה\" כתירוץ להימנע מחשיבה.<\/li>\n<li>בדוק/בדקי אם אתה/את \"כופה\" את התיאוריה האהובה עליך או שהמקרה \"מקפיץ\" תיאוריה. נסה/י לנסח את אותו מקרה דרך שתי עדשות שונות.<\/li>\n<\/ul>","questions":"<ol>\n<li>אילו משפטים בהמשגה האחרונה שכתבתי היו מתאימים כמעט לכל מטופל? מה הייתי כותב/ת במקומם על המטופל הזה?<\/li>\n<li>איזו מטאפורה או מילה חוזרת בטיפול הזה יכולה לשמש כמושג המארגן של ההמשגה (\"הערסל\" שלו)?<\/li>\n<li>מה ההעברה הנגדית שלי (למשל תחושת נטישה, דחייה או \"אי התאמה\") מוסיפה להבנת האנמנזה והסימפטום?<\/li>\n<li>האם אני משתמש/ת ב\"ללא זיכרון וללא תשוקה\" כעמדה טיפולית, או לפעמים כדי להימנע מהתחייבות להבנה?<\/li>\n<li>אילו מרכיבים מהאנמנזה (קונסטיטוציה, הקשר חברתי או כלכלי) השמטתי מההמשגה, ולמה?<\/li>\n<\/ol>","quotes":"<ul>\n<li>\"בבחינת המשגה דינאמית תפורה ביד ולא בקונפקציה של מפעל לייצור המוני.\"<\/li>\n<li>\"הרעיון של \"ללא זיכרון וללא תשוקה\" מובן שלא כהלכה, ומנוצל באופן הגנתי בשירות אי ההתחייבות, בשירות ההתקפה על החיבורים, לעתים עד כדי מעין סוג של עצלות מחשבתית.\"<\/li>\n<li>\"כן, יש כל מיני רגילים, יש רגיל צהוב, ורגיל אדום, ורגילה עם פסים... איזו מין רגילה הייתה הילדות שלך?\"<\/li>\n<li>\"אני רואה את ההמשגה הדינאמית כסוג של 'עמוד ענן לפני המחנה'\"<\/li>\n<\/ul>"},"level":"שנים ב'-ג' (וחיוני במיוחד בשנה ד', לקראת הצגת מקרה ובחינת סיום ההתמחות)","stype":"מאמר (מציג מודל עבודה)","tldr":"המחברת מלמדת ומדריכה אנשי טיפול ובוחנת מתמחים בפסיכולוגיה קלינית. היא מזהה קושי נפוץ בניסוח המשגה דינאמית: ההמשגות יוצאות לרוב \"גנריות\", כאלה שמתאימות כמעט לכל מטופל (\"חסר בסביבה הורית מחזיקה\", \"העדר זולת-עצמי אמפתי\"). כמו תיאור הורוסקופי (אפקט…","search":"המחברת מלמדת ומדריכה אנשי טיפול ובוחנת מתמחים בפסיכולוגיה קלינית. היא מזהה קושי נפוץ בניסוח המשגה דינאמית: ההמשגות יוצאות לרוב \"גנריות\", כאלה שמתאימות כמעט לכל מטופל (\"חסר בסביבה הורית מחזיקה\", \"העדר זולת-עצמי אמפתי\"). כמו תיאור הורוסקופי (אפקט ברנום), הן נכונות לכולם ואינן אומרות הרבה. לדבריה, הסיבה היא בעיקר חרדה מפני יצירת תיאוריה אישית, במיוחד לקראת בחינה, ונטייה להיצמד לתיאוריה \"שבמקרה נקראה אחרונה\". המאמר מציע \"משולש ההמשגה הדינאמית\" שעומד על ראשו. שלושת קדקודיו הם (1) אנמנזה (קונסטיטוציה וסביבה), (2) ההווה (סימפטומים, התנהגות או סיטואציה כוללנית, העברה, העברה נגדית), ו-(3) תיאוריה מחברת. המחברת מעדיפה את המונח \"המשגה\" או \"פורמולציה\" על פני \"אבחנה\", כי זו השערת עבודה דינאמית ומתפתחת ולא קביעה סופית. היא מוסיפה לממדים של קרנברג (חומרת המבנה, מופנמות-מוחצנות) \"ממד עומק\" אישי וייחודי. בשתי דוגמאות קליניות עם אותה אבחנה פנומנולוגית היא מראה כיצד מטאפורות שעולות מהטיפול (\"ערסל עם חורים\", \"התאמה ואי-התאמה\") הופכות המשגה \"יבשה\" להמשגה \"תפורה ביד\". להמשגה כזו יש גם ערך טיפולי: היא משפרת את דיוק ההתערבויות. המשגות דינאמיות רבות (בדו\"חות אבחון, בהצגות מקרה ובבחינות) הן \"גנריות ומיוצרות בקונפקציה\". הן משאירות בחוץ חלק גדול מפרטי האנמנזה ומהטיפול, ויוצרות \"תיאור חיוור\". מקור הקושי הוא חרדה מפני תיאוריה אישית ופרטיקולרית. החרדה מובילה להיצמדות למשפטים תיאורטיים כוללניים ולהישענות יתר על תיאוריה שנבחרה מראש לפי \"הצייטגייסט\". לכל אחד מאיתנו אותם מרכיבים בסיסיים (דחפים, אדיפוס, פגיעוּת נרקיסיסטית), אבל \"האדיפוס של האחד אינו דומה לאדיפוס של האחר\". ה\"תבלינים\" הייחודיים הם מה שצריך ללכוד. ההמשגה אינה רק תרגיל דידקטי. לנסח לעצמנו בכל רגע הבנה טנטטיבית (\"מה קורה כאן? מה הסיפור של המטופל?\") זו דרך \"לחשוב את המטופל\" ולחבר בין העברה לדינמיקה, בין עבר להווה ובין גלוי לסמוי. \"ללא זיכרון וללא תשוקה\" אינו סותר המשגה. לעיתים קרובות הוא \"מובן שלא כהלכה\" ומשמש הגנה בשירות אי ההתחייבות ו\"התקפה על החיבורים\", \"עד כדי עצלות מחשבתית\". דרושה תנועה פרדוקסלית בין שהייה באי ידיעה לבין חיפוש מתמיד אחר הבנה. \"פורמולציה\" עדיפה על \"אבחנה\". אבחנה היא מונח סטטי ומבחין, שבהקשר הרפואי נחשב סופי. פורמולציה היא פעולה מתמשכת, יצירה והשערת עבודה שמעוצבת שוב ושוב. מדובר ב\"קונסטלציה נפשית\" ולא בסיבתיות לינארית (\"הרכבה רכה\", מערכות מורכבות). המשולש מאפשר תנועה מההווה אל העבר ובחזרה ומהגלוי אל הסמוי ובחזרה, והתיאוריה מחברת ביניהם. גם האנמנזה עצמה היא הבנייה תיאורטית, כי אנו בוחרים מה לשאול ומה לזכור. לפעמים מקרה \"מקפיץ\" תיאוריה: התיאוריה \"כופה עצמה\" עלינו ולא אנחנו כופים אותה על המקרה. לבניית המשגה יש ממד דדוקטיבי וגם ממד אינדוקטיבי (Perry et al.). המודל מתאים גם לתיאוריות לא פסיכואנליטיות, למשל סכמות ב-CBT. כדאי להכליל בהמשגה מושגים אידיוסינקרטיים מעולמו ומשפתו של המטופל או מהחוויה המשותפת בטיפול. החיפוש אחריהם מחייב התבוננות קרובה יותר בסיטואציה ההעברתית ובהעברה הנגדית, ומשפר את דיוק הפירושים ואת אופי הנוכחות הטיפולית. המשגה / פורמולציה דינאמית – השערת עבודה, נכונה לנקודת זמן מסוימת, על \"איך המטופל הגיע עד הלום\". היא שואפת לאמת רגשית ואינה אמת עובדתית בלעדית. אבחנה דינאמית – המונח שהמחברת מעדיפה פחות: מצמצם, סטטי ו\"סופי\". אפקט ברנום – הטיה קוגניטיבית שבה אדם מייחס דיוק גבוה לתיאור מעורפל שמתאים לרבים. אצל המחברת זו מטפורה להמשגה גנרית. משולש ההמשגה הדינאמית – משולש שעומד על ראשו, ושלושת קדקודיו (אנמנזה, הווה, תיאוריה מחברת) יוצרים ביניהם מרחב דינאמי. סיטואציה כוללנית (Total situation; Joseph) – ההתנהגות הכוללת של המטופל, כולל במוסד (מחלקה, פנימייה). היא חלון למרכיבים העברתיים ולעולם הפנימי. \"בחירת\" הסימפטום (Freud, 1913) – הסימפטום מסתיר, אבל גם מספר משהו על מה שהוסתר. הרכבה רכה (Soft assembly; Harris) / מערכת מורכבת – הגורמים מתחברים לכדי אישיות באופן לא לינארי, בהשפעת תורת הכאוס. ממד העומק – ממד שלישי שהמחברת מוסיפה לשני הצירים של קרנברג (חומרת הפגיעה במבנה האישיות; מופנמות-מוחצנות). הוא מתייחס להיבטים האישיים והייחודיים. \"ללא זיכרון וללא תשוקה\" / Negative capability – עמדה של שהייה באי ידיעה. היא אינה מחליפה את המאמץ להמשיג, ושימוש הגנתי בה מסוכן. \"עמוד ענן לפני המחנה\" – מטאפורה למקומה של ההמשגה בטיפול: לפעמים לפנינו, לפעמים מאחורינו ולפעמים עוטפת אותנו. צריך להחזיק בה באחיזה שאינה חזקה מדי. \"תבלינים\" / קונפיגורציה אישית – הצירוף החד-פעמי שמבדיל מטופל ממטופלים אחרים עם אותה אבחנה."},{"id":"kellner2000","title":"החוזה הטיפולי","authors":"נעמי קלנר","year":"2000","cite":"קלנר, נ' (2000). החוזה הטיפולי בפסיכותרפיה פסיכואנליטית. בתוך: דבשת הגמל. בן שמן: מודן.","url":null,"kind":"book","desc":null,"file":{"orig":"קלנר החוזה הטיפולי מתוך דבשת הגמל -.doc","ext":"doc","pdf":"kellner2000.pdf","pages":9,"bytes":206792},"placements":[["s2","therapy"]],"extra":false,"ref":"קלנר 2000","inFolder":true,"srcTitle":"החוזה הטיפולי בפסיכותרפיה פסיכואנליטית (סיכום פרק 3 מתוך \"דבשת הגמל\")","secs":{"abstract":"<p>הפרק מגדיר את החוזה הטיפולי כ\"הסכם עבודה\" בין המטפל למטופל על הכללים המינימליים שהתהליך הטיפולי צריך כדי להתפתח. רק חלק מהכללים האלה מנוסחים במפורש. קלנר ממקמת את החוזה בתוך \"הסיטואציה הטיפולית\", שכוללת את התהליך הטיפולי (לב העניין) ואת המערך הטיפולי (frame), שנועד לשרת את התהליך. למערך מיוחסות פונקציות פטרנליות (גבולות, עימות עם המציאות) ופונקציות מטרנליות (החזקה והגנה). הגישה התקשורתית של לאנגס מדגישה את הרגישות של המערכת הלא מודעת לשמירה על המסגרת ולהפרתה. לפי אטשגוז'ן יש שלושה סוגי חוזים: רציונלי, סמכותי ודמגוגי. השאיפה היא לחוזה רציונלי, הוגן ואתי, כי \"כישלון האתיקה... להוביל לכישלון טכני\". הפרק מפרט חמישה מרכיבים: הסדרי תשלום (תעריף, חיוב על פגישות מוחמצות, מועד ואופן תשלום), הסדרי זמן (תכיפות, משך, מועד קבוע, חגים וחופשות), סודיות וגבולותיה, כלל היסוד (אסוציאציות חופשיות) או עיקרון מנחה חלופי, וציון קיומם של כללי מסגרת נוספים. בסוף הוא דן בעיתוי עריכת החוזה (בדרך כלל בסוף שלב ההערכה) ובשאלה אם להציג חוזה קצר או מפורט. ההסכמה של מטופל בתחילת הדרך אינה תמיד אמיתית, והפרה של החוזה היא חומר טיפולי ולא שחרור מאחריות.<\/p>","ideas":"<ul>\n<li>החוזה אינו \"טכניקה\" בלבד. צריך להבין את התפקיד המתודי של כל אחד ממרכיביו בתוך הסיטואציה הטיפולית ובתוך מהות הפסיכותרפיה הדינמית (Yeoman et al.).<\/li>\n<li>החוזה נערך כשהמטופל חרד, מבולבל ואמביוולנטי, ולכן אין לפרש את הסכמתו \"כפשוטה\". הפרת כללים אינה משחררת את המטפל מאחריותו. היא מסמנת סטייה, ואליה חוזרים באמצעות מהלכים פרשניים ומהלכים של שמירת מסגרת. אפשר לחזור לחוזה, להשלים אותו, להתאים אותו ו\"לרענן\" אותו לאורך כל הטיפול.<\/li>\n<li>התהליך הטיפולי מבוסס על התפתחות אמון, הפחתת חרדה ותחושת ביטחון. אלה מאפשרים ירידה בהגנתיות, רגרסיה טיפולית והעברה. במקביל מתפתחות הברית הטיפולית והפנמת הפונקציה הטיפולית, וכל אלה מובילים לאינטרוספקציה, לפירוש ולתובנה.<\/li>\n<li>רוב הגישות (קלאסית ורומנטית, קונפליקט וחסר) רואות במערך הטיפולי רכיב חיוני ואף בעל השפעה מרפאת בפני עצמו (Modell). יחסו של המטפל למסגרת הוא \"יסוד בעל משקל כבד\" בתהליך השינוי.<\/li>\n<li>לפי לאנגס, המערכת הלא מודעת העמוקה רגישה מאוד לשמירה על מסגרת ולהפרתה, בעוד שהמערכת המודעת נוטה לזלזל בכללים. לכן שינויים \"לטובת\" המטופל זוכים לתודה מודעת אבל ל\"ביטויים שליליים מוצפנים\".<\/li>\n<li>כלל החיוב המלא על פגישות מוחמצות הוא \"הכלל הקשה ביותר לקבלה\" גם למטפלים וגם למטופלים. בכל זאת המחברת רואה בו יסוד של מסגרת בטוחה. כך או כך, את המדיניות צריך לומר בבירור בשלב החוזה.<\/li>\n<li>הקפדה על זמנים, \"לא דקה פחות ולא דקה יותר\", חשובה מאוד ברמה הלא מודעת. מטופלים בוחנים את המטפל בעניין הזמנים, ולוויניקוט ההקפדה על תחילת הפגישה וסופה היא ביטוי ל\"שנאה האובייקטיבית\" (הטיפולית) של המטפל.<\/li>\n<li>המטפל מתחייב במפורש לסודיות ומציין שיש לה הגבלות בחוק. את המקרים החריגים מפרטים רק אם המטופל שואל. כדאי לומר כבר בשלב החוזה שהמטפל נוהג להתייעץ עם עמיתים בעילום שם.<\/li>\n<li>אין להציף את המטופל בכל כללי המערך. אומרים את כללי היסוד, מציינים שיש עוד עקרונות שיוסברו כשיהיה צורך, וכך מעבירים מסר מובלע שהמטפל עובד לפי שיטה ידועה מראש. רוב העקרונות הנוספים מחייבים דווקא את המטפל.<\/li>\n<\/ul>","concepts":"<ul>\n<li><strong>חוזה טיפולי<\/strong> – הסכם בין המטפל למטופל על הגבולות והמסגרת (המערך הטיפולי). רק חלקו מנוסח במפורש.<\/li>\n<li><strong>חוזה רציונלי / סמכותי / דמגוגי<\/strong> (אטשגוז'ן) – חוזה שמותאם למה שעדיף לתהליך / חוזה שמקדים את נוחות המטפל למשימה הטיפולית / חוזה שמרצה את המטופל על חשבון המשימה.<\/li>\n<li><strong>סיטואציה טיפולית<\/strong> – מכלול התופעות של היחס הטיפולי. כוללת את המערך הטיפולי ואת התהליך הטיפולי.<\/li>\n<li><strong>תהליך טיפולי<\/strong> – לב הסיטואציה: סדרה של התרחשויות ושינויים הדרגתיים בדרך למטרות הטיפול.<\/li>\n<li><strong>מערך טיפולי (frame) מול מסגרת טיפולית (setting)<\/strong> – הכותבת מבחינה ביניהם. \"מערך\" הוא \"דברים שנערכו יחדיו בסדר מסוים\" וכולל גם גבולות מסגרת וגם כללי הנחיה.<\/li>\n<li><strong>פונקציות פטרנליות ומטרנליות של המערך<\/strong> – פטרנליות: חוקים וגבולות שמבחינים, מארגנים ומעמתים עם המציאות. מטרנליות: \"החזקה\" והגנה שמאפשרות התפתחות \"העצמי האמיתי\".<\/li>\n<li><strong>הגישה התקשורתית (Langs)<\/strong> – גישה שמייחסת למערך ולכללי היסוד תפקיד מכריע, בגלל רגישות המערכת הלא מודעת לשמירתם או להפרתם.<\/li>\n<li><strong>כלל היסוד (אסוציאציות חופשיות)<\/strong> – \"לומר כל מה שבדעתו ועל ליבו, בלי עריכה ובלי סלקציה\". לפי פרויד, כל שאר הכללים נועדו לאפשר אותו.<\/li>\n<li><strong>עיקרון מנחה חלופי<\/strong> – למטפל שאינו מקבל את האסוציאציות החופשיות ככלל יסוד (אוגדן רואה בהפיכתן לכלל \"מעשה אנטי טיפולי\"). זה עיקרון אחר שמסביר למטופל את תפקידו, ויש לכלול אותו בחוזה.<\/li>\n<li><strong>\"הצמד הפרוידיאני\"<\/strong> (בולאס) – כלל האסוציאציות החופשיות יחד עם כלל הקשב המרחף.<\/li>\n<li><strong>נזילה בטיפול<\/strong> – לפי פרויד: כשמטופל משוחח על הטיפול עם חבר, \"ידלוף דווקא המיטב\". מכאן שאלת הסודיות מצד המטופל.<\/li>\n<\/ul>","models":"<p><strong>שלושה סוגי חוזים (אטשגוז'ן):<\/strong><\/p>\n<div class=\"tablewrap\"><table>\n<thead>\n<tr>\n<th>סוג<\/th>\n<th>מאפיין<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>רציונלי<\/td>\n<td>מותאם למה שעדיף להתפתחות התהליך. הוגן ואתי. <strong>זה היעד<\/strong><\/td>\n<\/tr>\n<tr>\n<td>סמכותי<\/td>\n<td>נוחות המטפל קודמת למשימה הטיפולית<\/td>\n<\/tr>\n<tr>\n<td>דמגוגי<\/td>\n<td>מרצה את המטופל וגורם נזק למשימה הטיפולית<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>מבנה הסיטואציה הטיפולית:<\/strong><\/p>\n<ul>\n<li>תהליך טיפולי (לב הסיטואציה): אמון → הפחתת חרדה וביטחון → ירידה בהגנתיות → רגרסיה טיפולית והעברה. במקביל: ברית טיפולית, שיתוף פעולה והפנמת הפונקציה הטיפולית → אינטרוספקציה, ניסוח השערות ופירוש → תובנה לגבי ההשפעות הלא מודעות על ההתנהגות.<\/li>\n<li>מערך טיפולי, שני סוגי כללים:<ol>\n<li>כללים שממסגרים את הפעילות ומגדירים את היחסים: זמן, תשלום, ישיבה או שכיבה.<\/li>\n<li>כ
